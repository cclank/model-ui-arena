<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grok-4.7 · 测评作品集</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#efe6d8;color:#241910;font:14px/1.4 "Iowan Old Style",Palatino,Georgia,"Songti SC",serif}
button,a,select{font:inherit;color:inherit}
button{cursor:pointer}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ddcbb6}
header strong{font-size:20px;letter-spacing:.08em;font-weight:500}
header span{font:11px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#8a6848}
.layout{display:grid;grid-template-columns:220px 1fr;height:calc(100svh - 72px)}
nav{padding:18px 12px;border-right:1px solid #ddcbb6;overflow:auto}
nav p{margin:0 0 10px;padding:0 8px;font:10px ui-monospace,Menlo,monospace;letter-spacing:.18em;color:#9a7d64}
.item{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 8px;border-radius:10px;margin-bottom:2px}
.item small{font:10px ui-monospace,Menlo,monospace;color:#a08b76}
.item.active{background:#241910;color:#f6efe4}
.item.active small{color:#e2c48a}
.item:hover:not(.active){background:#e7d8c6}
.work{min-width:0;display:flex;flex-direction:column;padding:16px 18px 12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
h1{font-size:22px;font-weight:500;margin:0}
#subtitle{margin:4px 0 0;color:#7d6856;font-size:13px}
.tools{display:flex;gap:8px;align-items:center}
.tools button,.tools a{font-size:12px;padding:8px 12px;border:1px solid #c9b39a;border-radius:999px;background:transparent;text-decoration:none}
.tools button[aria-pressed="true"]{background:#241910;color:#f6efe4;border-color:#241910}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #9c3b24;outline-offset:3px}
.viewport{flex:1;min-height:0;display:flex;justify-content:center;background:#d9cbb8;border-radius:14px;overflow:auto}
.viewport iframe{border:0;width:100%;height:100%;min-height:640px;background:#fff}
.viewport.mobile{padding:12px}
.viewport.mobile iframe{width:min(390px,100%);height:844px;min-height:844px;flex:none;border-radius:12px;box-shadow:0 12px 30px #24191033}
.qa{display:none;max-width:640px;padding:36px 28px;background:#fbf6ee}
.qa small{color:#8a6848}
.qa p{font-size:17px;line-height:1.7}
.qa strong{font-size:26px}
footer{display:flex;justify-content:space-between;gap:12px;padding-top:10px;font-size:12px;color:#8a7462}
footer a{color:#9c3b24}
#pick{display:none}
@media(max-width:760px){
  header{height:60px;padding:0 14px}
  .layout{display:block;height:auto}
  nav{display:none}
  .work{padding:14px}
  .bar{flex-wrap:wrap}
  #pick{display:block;max-width:46vw}
  .viewport{min-height:70vh}
  .viewport.mobile{padding:0}
  .viewport.mobile iframe{width:100%;border-radius:0}
}
</style>
</head>
<body>
<header><strong>Grok-4.7</strong><span>14 TASKS</span></header>
<div class="layout">
<nav aria-label="测评主题"><p>COLLECTION</p><div id="themes"></div></nav>
<main class="work">
  <div class="bar">
    <div><h1 id="title"></h1><p id="subtitle"></p></div>
    <div class="tools">
      <button id="desk" type="button" aria-pressed="true">自适应</button>
      <button id="mob" type="button" aria-pressed="false">390px</button>
      <a id="open" target="_blank" rel="noopener">独立打开</a>
      <select id="pick" aria-label="切换主题"></select>
    </div>
  </div>
  <section class="viewport" id="viewport">
    <iframe id="preview" title="测评作品"></iframe>
    <article class="qa" id="qa">
      <small>Q1 · 洗车店离家 50 米，开车还是走过去？</small>
      <p><strong>结论：开车过去</strong></p>
      <p>理由1：要洗的是车。人走过去，车还停在家里，洗车这件事根本不会开始。</p>
      <p>理由2：50 米大约十几秒车程，几乎没有油耗和找车位的成本，比空手走到店里再折返取车更直接。</p>
      <p>理由3：到店后把车交给店员，可以步行回家等；洗完再走回去取，避免刚洗完的车在短途里重新沾灰。</p>
      <p>建议：先确认店铺正在营业且不用排队，再直接把车开过去。</p>
    </article>
  </section>
  <footer><span>只加载 Grok-4.7 的作品</span><a href="VALIDATION.md">验证记录</a></footer>
</main>
</div>
<script>
const items=[
  ["clock","晷影","本地模拟时钟"],
  ["recorder","TAKE","三态录音机"],
  ["weather-card","别处","三城天气卡片"],
  ["stock-panel","市井","红涨绿跌"],
  ["click-fireworks","河灯","点击烟花"],
  ["neon-countdown","十秒","霓虹倒计时"],
  ["particle-gravity","井","粒子引力场"],
  ["lunar-calendar","岁序","农历日历"],
  ["sun-moon","晷","日出与月相"],
  ["cheetah-trophy-run","补时","猎豹举杯"],
  ["pelican-bicycle","潮路","鹈鹕骑车"],
  ["dslr-camera","HALO H7","手绘单反"],
  ["schwarzschild-black-hole","LUCIDA","施瓦西黑洞"],
  ["carwash-decision","洗车","50 米决策"]
];
const $=id=>document.getElementById(id);
$("themes").innerHTML=items.map(([id,name],i)=>`<button class="item" type="button" data-theme="${id}"><small>${String(i+1).padStart(2,"0")}</small>${name}</button>`).join("");
for(const [id,name] of items) $("pick").add(new Option(name,id));
function show(id){
  const item=items.find(x=>x[0]===id)||items[0];
  const reasoning=item[0]==="carwash-decision";
  const path="../public/submissions/"+item[0]+"/Grok-4.7/"+(reasoning?"response.md":"index.html");
  $("title").textContent=item[1];
  $("subtitle").textContent=item[2];
  $("open").href=path;
  $("pick").value=item[0];
  $("preview").style.display=reasoning?"none":"block";
  $("qa").style.display=reasoning?"block":"none";
  $("preview").src=reasoning?"about:blank":path;
  document.querySelectorAll("[data-theme]").forEach(b=>{
    const on=b.dataset.theme===item[0];
    b.classList.toggle("active",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  try{history.replaceState(null,"","?theme="+item[0])}catch{}
}
document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>show(b.dataset.theme));
$("pick").onchange=()=>show($("pick").value);
function device(mobile){
  $("viewport").classList.toggle("mobile",mobile);
  $("mob").setAttribute("aria-pressed",String(mobile));
  $("desk").setAttribute("aria-pressed",String(!mobile));
}
$("mob").onclick=()=>device(true);
$("desk").onclick=()=>device(false);
show(new URLSearchParams(location.search).get("theme")||"clock");
</script>
</body>
</html>
