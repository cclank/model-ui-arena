结论：开车过去。
理由1：要洗的是车，需要把车送到洗车店；走过去会把车留在家里，无法直接洗车。
理由2：50 米只影响行程长短，开车过去能直接交车，省去走到店后再回家取车的往返。
理由3：出发前可以先确认店里是否营业、是否需要排队，避免短距离开过去还要等待。
