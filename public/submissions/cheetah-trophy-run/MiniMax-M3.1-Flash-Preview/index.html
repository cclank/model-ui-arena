<style>
  :root{
    --ink:#06080f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;max-width:100%;overflow-x:hidden;}
  body{
    background:
      radial-gradient(120% 90% at 50% 12%, #14203a 0%, #0a1020 45%, #05070e 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(6px,2.2vw,30px);
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .poster{
    width:100%;
    max-width:720px;
    min-width:0;
    flex:0 1 auto;
    position:relative;
    filter:drop-shadow(0 26px 60px rgba(0,0,0,.62));
  }
  .poster::after{
    content:"";
    position:absolute;inset:-1px;
    border:1px solid rgba(255,214,120,.28);
    border-radius:4px;
    pointer-events:none;
  }
  svg{display:block;width:100%;max-width:100%;height:auto;}

  /* ---------- motion ---------- */
  .anim-cheetah{animation:bob .46s ease-in-out infinite alternate;transform-origin:600px 1000px;}
  @keyframes bob{
    from{transform:translate(0px,7px) rotate(-.5deg);}
    to{transform:translate(0px,-7px) rotate(.5deg);}
  }
  .speed-scroll{animation:scrollX 1.1s linear infinite;}
  @keyframes scrollX{from{transform:translateX(0);}to{transform:translateX(-260px);}}
  .ball-roll{animation:roll 2.6s linear infinite;transform-origin:1044px 1372px;}
  @keyframes roll{from{transform:translate(0,0) rotate(0deg);}to{transform:translate(0,0) rotate(360deg);}}
  .conf-a{animation:fallA 6.5s linear infinite;}
  .conf-b{animation:fallB 8.2s linear infinite;}
  .conf-c{animation:fallC 7.4s linear infinite;}
  @keyframes fallA{
    0%{transform:translate(0,-260px) rotate(0deg);opacity:0;}
    8%{opacity:1;}
    92%{opacity:1;}
    100%{transform:translate(40px,1700px) rotate(760deg);opacity:0;}
  }
  @keyframes fallB{
    0%{transform:translate(0,-300px) rotate(0deg);opacity:0;}
    10%{opacity:.95;}
    90%{opacity:.95;}
    100%{transform:translate(-70px,1700px) rotate(-680deg);opacity:0;}
  }
  @keyframes fallC{
    0%{transform:translate(0,-280px) rotate(0deg);opacity:0;}
    12%{opacity:.9;}
    88%{opacity:.9;}
    100%{transform:translate(90px,1700px) rotate(920deg);opacity:0;}
  }
  .twinkle{animation:twinkle 2.6s ease-in-out infinite alternate;}
  .twinkle.b{animation-duration:3.4s;animation-delay:-1.2s;}
  .twinkle.c{animation-duration:2.1s;animation-delay:-.7s;}
  @keyframes twinkle{from{opacity:.25;}to{opacity:1;}}
  .beam-flicker{animation:flicker 5.2s ease-in-out infinite alternate;}
  @keyframes flicker{from{opacity:.62;}to{opacity:.92;}}
  .shine{animation:shine 3.4s ease-in-out infinite;}
  @keyframes shine{
    0%,100%{transform:translateX(-90px);opacity:0;}
    40%{opacity:.9;}
    60%{opacity:.9;}
    100%{transform:translateX(150px);opacity:0;}
  }
  .clock-dot{animation:pulse 1s steps(2,end) infinite;}
  @keyframes pulse{0%{opacity:1;}100%{opacity:.15;}}
  .grass-sway{animation:sway 2.2s ease-in-out infinite alternate;transform-origin:600px 1320px;}
  @keyframes sway{from{transform:skewX(-2.2deg);}to{transform:skewX(2.2deg);}}
  .debris-fly{animation:debris 1.5s ease-out infinite;}
  @keyframes debris{
    0%{transform:translate(0,0) rotate(0deg);opacity:0;}
    12%{opacity:1;}
    100%{transform:translate(-260px,86px) rotate(-420deg);opacity:0;}
  }

  @media (prefers-reduced-motion: reduce){
    .anim-cheetah,.speed-scroll,.ball-roll,.conf-a,.conf-b,.conf-c,
    .twinkle,.beam-flicker,.shine,.clock-dot,.grass-sway,.debris-fly{animation:none !important;}
  }
</style>

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var layers = [];
  var nodes = document.querySelectorAll("[data-depth]");
  for (var i = 0; i < nodes.length; i++) { layers.push(nodes[i]); }

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!layers.length || reduce) { return; }

  var raf = null;
  function apply(px, py) {
    for (var j = 0; j < layers.length; j++) {
      var el = layers[j];
      var d = parseFloat(el.getAttribute("data-depth")) || 0;
      el.style.transform = "translate3d(" + (-px * d).toFixed(2) + "px," + (-py * d).toFixed(2) + "px,0)";
    }
  }
  function onMove(ev) {
    var x = (ev.clientX / window.innerWidth - 0.5) * 2;
    var y = (ev.clientY / window.innerHeight - 0.5) * 2;
    if (raf) { cancelAnimationFrame(raf); }
    raf = requestAnimationFrame(function () { apply(x * 14, y * 10); raf = null; });
  }
  window.addEventListener("pointermove", onMove, { passive: true });
  root.setAttribute("data-motion", "on");
})();
</script>
