<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheetah Trophy Run · Hy4</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:#05070e;padding:0;
  font:400 14px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif}
.stage{width:100%;max-width:1180px;box-shadow:0 40px 90px -40px #000}
svg{display:block;width:100%;height:auto}
/* ---------- animations ---------- */
.cheetah{animation:bob 1.5s ease-in-out infinite;transform-origin:500px 450px}
@keyframes bob{50%{transform:translateY(-9px) rotate(-.5deg)}}
.beam{animation:beat 6s ease-in-out infinite alternate;transform-origin:top center}
.beam.b2{animation-duration:7.5s;animation-delay:-2s}
.beam.b3{animation-duration:5s;animation-delay:-1s}
@keyframes beat{from{opacity:.10}to{opacity:.26}}
.streak{stroke-dasharray:70 260;animation:zoom .85s linear infinite}
.streak:nth-child(2){animation-duration:.7s}.streak:nth-child(3){animation-duration:1s}
.streak:nth-child(4){animation-duration:.62s}.streak:nth-child(5){animation-duration:.9s}
@keyframes zoom{from{stroke-dashoffset:330}to{stroke-dashoffset:0}}
.roll{transform-box:fill-box;transform-origin:50% 50%;animation:roll 2.8s linear infinite}
@keyframes roll{0%{transform:translateX(10px) rotate(0)}50%{transform:translateX(-10px) rotate(-360deg)}
  100%{transform:translateX(10px) rotate(-720deg)}}
.glint{animation:glint 3.4s ease-in-out infinite}
@keyframes glint{0%,18%{transform:translateX(-14px) skewX(-18deg);opacity:0}
  26%{opacity:.75}46%{transform:translateX(126px) skewX(-18deg);opacity:0}100%{opacity:0}}
.confetti{transform-box:fill-box;transform-origin:50% 50%;animation:cf linear infinite}
@keyframes cf{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(760px) rotate(720deg)}}
.flash{animation:fl 3.4s ease-in-out infinite;opacity:0}
@keyframes fl{0%,88%{opacity:0}92%{opacity:1}96%,100%{opacity:0}}
.tuft{animation:tf 2.2s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes tf{0%{opacity:0;transform:translate(0,0) scale(.4)}30%{opacity:.9}
  100%{opacity:0;transform:translate(-70px,-46px) scale(1.1)}}
.board{animation:bglow 4s ease-in-out infinite}
@keyframes bglow{50%{filter:drop-shadow(0 0 16px rgba(255,196,64,.75))}}
.core{animation:cp 2.4s ease-in-out infinite}
@keyframes cp{50%{opacity:.75;transform:scale(1.06)}}
@media (max-width:560px){.stage{max-width:100%}}
</style>
</head>

<script>
const NS='http://www.w3.org/2000/svg',S=document.getElementById('poster');
const add=(p,tag,a)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
/* 星空 */
const st=S.querySelector('#stars');
for(let i=0;i<80;i++)add(st,'circle',{cx:(Math.random()*1000).toFixed(0),cy:(Math.random()*250).toFixed(0),
  r:(Math.random()*1.5+.5).toFixed(2),fill:'#e6eeff',opacity:(.2+Math.random()*.65).toFixed(2)});
/* 观众席 */

for(let r=0;r<4;r++)for(let i=0;i<60;i++)add(cr,'circle',{cx:(6+i*17+Math.random()*11).toFixed(0),
  cy:(146+r*33+Math.random()*7).toFixed(0),r:(2.4+Math.random()*1.9).toFixed(1),
  fill:CP[(Math.random()*CP.length)|0],opacity:(.45+Math.random()*.55).toFixed(2)});
for(let i=0;i<16;i++){const f=add(cr,'circle',{cx:(20+Math.random()*960).toFixed(0),cy:(146+Math.random()*110).toFixed(0),
  r:4,fill:'#ffffff',class:'flash'});f.style.animationDelay=(Math.random()*4).toFixed(2)+'s';}
/* 草皮割痕（透视条纹） */
const sp=S.querySelector('#stripes');
for(let i=0;i<8;i++){
  const x1=i*125,x2=(i+1)*125,b1=500+(x1-500)*1.6,b2=500+(x2-500)*1.6;
  add(sp,'polygon',{points:x1+',340 '+x2+',340 '+b2.toFixed(0)+',700 '+b1.toFixed(0)+',700',
    fill:i%2?'#ffffff':'#000000',opacity:i%2?.045:.05});
}
/* 飞起的草屑 */
const tf=S.querySelector('#tufts');
for(let i=0;i<14;i++){const x=250+Math.random()*340,y=580+Math.random()*40;
  const t=add(tf,'path',{d:'M0 0 L'+(4+Math.random()*5).toFixed(0)+' -'+(9+Math.random()*9).toFixed(0)+
    ' L'+(9+Math.random()*6).toFixed(0)+' 0 Z',fill:'#2ea05a',class:'tuft',transform:'translate('+x.toFixed(0)+','+y.toFixed(0)+')'});
  t.style.animationDelay=(Math.random()*2.2).toFixed(2)+'s';t.style.animationDuration=(1.8+Math.random()*1.4).toFixed(2)+'s';}
/* 金色彩带 */
const cf=S.querySelector('#confetti'),CC=['#ffd75e','#fff3bd','#f0a93a','#7fe3a5','#ffffff'];
for(let i=0;i<64;i++){
  const w=5+Math.random()*8,h=9+Math.random()*14;
  const r=add(cf,'rect',{x:(Math.random()*1000).toFixed(0),y:(-30-Math.random()*260).toFixed(0),width:w.toFixed(1),
    height:h.toFixed(1),rx:2,fill:CC[(Math.random()*CC.length)|0],opacity:(.6+Math.random()*.4).toFixed(2),class:'confetti'});
  r.style.animationDuration=(4+Math.random()*6).toFixed(2)+'s';
  r.style.animationDelay=(-Math.random()*9).toFixed(2)+'s';
}
</script>
</body>
</html>
