<!DOCTYPE html>

<title>Opus-5.5 · 补时绝杀</title>
<!-- 设计说明：
1. 竖版冠军海报：夜场球场，两座泛光灯塔的光柱斜切而下，看台人潮与闪光灯明灭，右上角挂着小比分牌 90+7′ · 3:2，金色彩纸与彩带纷飞。
2. 主角是一只拟人化猎豹：身体前倾约 22°，远侧后腿蹬地、近侧膝盖高抬，长尾向后甩成 S 形动势弧；黑色泪痕、实心斑点、白色胸腹、尾端黑环白尖都画出来了。
3. 双前爪把大力神杯高举过头：金色杯身由两道螺旋上升的托举人形构成，顶端地球浮雕大陆，底座两圈孔雀石绿环；奖杯有独立的高光层和闪光。
4. 速度感来自三层：身后的金色残影、横向速度线、蹬地溅起的草屑；脚下滚动的足球带运动拖影。全部图形为内联 SVG 手绘，没有任何真实球队或赛事标志。 -->
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#040811}
body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(80% 60% at 50% 35%,#0d1a3e,#03060d 75%)}
svg{display:block;width:min(100vw,75vh);height:auto;max-height:100vh}
.flash{fill:#fff;opacity:0;animation:flash 4s infinite}
@keyframes flash{0%,92%,100%{opacity:0}94%{opacity:1}96%{opacity:.2}}
.beam{animation:beam 6s ease-in-out infinite;mix-blend-mode:screen}
.beam.b2{animation-delay:-3s}
@keyframes beam{0%,100%{opacity:.75}50%{opacity:1}}
.conf{animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,var(--y0))}to{transform:translate(var(--sway),var(--y1))}}
.spin{animation:spin linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.streamer{fill:none;stroke:url(#ribbon);stroke-width:4;stroke-linecap:round;animation:wave 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.sl{animation:dash 1.1s linear infinite}
@keyframes dash{from{transform:translateX(40px);opacity:0}30%{opacity:1}to{transform:translateX(-120px);opacity:0}}
.ballSpin{animation:spin .9s linear infinite;transform-box:view-box;transform-origin:0 0}
.tail{animation:tail 1.6s ease-in-out infinite;transform-origin:430px 790px}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-3.5deg)}}
.twinkle{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle.t2{animation-delay:-1.1s}
@keyframes tw{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
.aura{animation:aura 3s ease-in-out infinite}
@keyframes aura{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
