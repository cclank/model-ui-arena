  .ballspin { animation:ballRoll 4.5s linear infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes ballRoll { to { transform:rotate(360deg); } }
  .livedot { animation:blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.15; } }
  .trophyGlow { animation:tglow 2.4s ease-in-out infinite; }
  @keyframes tglow { 50% { filter:drop-shadow(0 0 16px rgba(255,208,94,.85)); } }
  .tailarc { stroke-dasharray:6 10; animation:tailflow 1.1s linear infinite; }
  @keyframes tailflow { to { stroke-dashoffset:-32; } }
</style>

<script>
(function () {
  "use strict";
  // 观众席点阵人群
  var crowd = document.getElementById("crowd");
  var palette = ["#c96a6a", "#6a8fc9", "#c9b96a", "#7fbf8f", "#c98f6a", "#9a8fc9", "#d8d8e8", "#6a6f8c"];
  var frag = document.createDocumentFragment();
  for (var band = 0; band < 2; band++) {
    var y0 = band === 0 ? 322 : 360, rows = band === 0 ? 3 : 5;
    for (var r = 0; r < rows; r++) {
      var y = y0 + r * 11;
      for (var x = 52 + (band ? 0 : 5); x < 1150; x += 9 + Math.random() * 4) {
        var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", (y + Math.random() * 3).toFixed(1));
        c.setAttribute("r", (2.4 + Math.random() * 1.4).toFixed(1));
        c.setAttribute("fill", palette[(Math.random() * palette.length) | 0]);
        c.setAttribute("opacity", (0.45 + Math.random() * 0.5).toFixed(2));
        frag.appendChild(c);
      }
    }
  }
  crowd.appendChild(frag);

  // 金色彩带（下坠 + 旋转，负延迟错相）
  var confetti = document.getElementById("confetti");
  var colors = ["#ffd166", "#fff3c8", "#ff6b6b", "#69e6ff", "#b6ff8a"];
  for (var i = 0; i < 46; i++) {
    var p = document.createElementNS("http://www.w3.org/2000/svg", i % 3 === 0 ? "circle" : "rect");
    var x = 60 + Math.random() * 1080, y = -60 + Math.random() * 420;
    if (p.tagName === "circle") { p.setAttribute("cx", x); p.setAttribute("cy", y); p.setAttribute("r", 2.6 + Math.random() * 2.4); }
    else { p.setAttribute("x", x); p.setAttribute("y", y); p.setAttribute("width", 7 + Math.random() * 5); p.setAttribute("height", 4.5 + Math.random() * 3); }
    p.setAttribute("fill", colors[(Math.random() * colors.length) | 0]);
    p.setAttribute("opacity", (0.55 + Math.random() * 0.45).toFixed(2));
    p.setAttribute("class", "conf");
    p.style.animationDuration = (3.6 + Math.random() * 4.5) + "s";
    p.style.animationDelay = (-Math.random() * 8) + "s";
    confetti.appendChild(p);
  }

  // 猎豹斑点：沿躯干 / 颈 / 尾 / 腿 区域散布（猎豹为实心圆斑）
