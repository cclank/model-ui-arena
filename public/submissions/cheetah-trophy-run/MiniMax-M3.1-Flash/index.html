<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;display:grid;place-items:center;padding:20px 12px;
background:radial-gradient(80% 60% at 50% 0%,#1b1030 0%,#08050f 62%,#050308 100%);
font:400 15px/1.5 ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8e2f5}
.poster{width:100%;max-width:520px;position:relative}
.frame{position:relative;border-radius:16px;overflow:hidden;
box-shadow:0 40px 90px -30px #000,0 0 0 1px rgba(255,210,120,.22),0 0 0 7px rgba(255,255,255,.035)}
svg{display:block;width:100%;height:auto}
.cap{text-align:center;margin-top:14px}
.cap h1{font-size:19px;font-weight:800;letter-spacing:.3em;
background:linear-gradient(96deg,#ffe6a6,#ffb84d 38%,#ffe6a6 62%,#e8a13c);
-webkit-background-clip:text;background-clip:text;color:transparent}
.cap p{margin-top:7px;font-size:11.5px;letter-spacing:.16em;color:#8f86a8}
.beam{animation:sway 9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.beam.b2{animation-duration:11.5s;animation-delay:-3s}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.conf{animation:drift linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes drift{from{transform:translateY(0) rotate(0);opacity:.15}
18%{opacity:.95}to{transform:translateY(120px) rotate(220deg);opacity:.1}}
.glint{animation:glint 4.2s ease-in-out infinite}
@keyframes glint{0%,72%{opacity:0}82%{opacity:.95}100%{opacity:0}}
.trophy{transform-box:fill-box;transform-origin:center;animation:raise .7s cubic-bezier(.2,1.5,.35,1) both,hover 3.4s ease-in-out 0.7s infinite alternate}
@keyframes raise{from{transform:translateY(26px) scale(.9);opacity:.2}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes hover{to{transform:translateY(-7px)}}
.trail{animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-70}}
.chev{animation:cheer 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes cheer{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
.spark{animation:twinkle 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

    <path d="M142 -44 l10 -8 -3 10 Z"/><path d="M136 -26 l10 -7 -2 9 Z"/><path d="M132 -8 l9 -6 -2 8 Z"/>
  </g>
</g>

<!-- 冠军光效 -->
<g id="shines"></g>
<rect width="900" height="1000" fill="url(#vig)" pointer-events="none"/>
</svg>
</div>
<div class="cap">
  <h1>冠 军 时 刻</h1>
  <p>第 94 分钟 · 补时绝杀 · 3 : 2</p>
</div>
</main>
<script>
// 观众席人群点阵（种子随机，保证每次渲染一致）
(function(){
  let s=20261020;
  const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
  const mk=(host,n,cols)=>{
    const ns='http://www.w3.org/2000/svg';
    for(let i=0;i<n;i++){
      const t=rnd(),row=Math.floor(rnd()*cols);
      const x=20+t*860;
      const y=318+row*13+Math.sin(t*Math.PI)*-42;
      const c=document.createElementNS(ns,'circle');
      c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1));
      c.setAttribute('r',(2.1+rnd()*2.4).toFixed(1));
      const h=rnd();
      c.setAttribute('fill',h<.22?'#ffd98a':h<.44?'#ff8fb5':h<.66?'#8fd4ff':h<.84?'#b79bff':'#7a6a95');
      c.setAttribute('opacity',(0.35+rnd()*0.6).toFixed(2));
      host.appendChild(c)}
    };
  mk(document.getElementById('crowd'),620,16);
  mk(document.getElementById('crowd2'),340,9);
  // 金色彩带 / 纸屑
  const ns='http://www.w3.org/2000/svg',box=document.getElementById('confetti');
  for(let i=0;i<46;i++){
    const p=document.createElementNS(ns,'rect');
    p.setAttribute('x',(rnd()*900).toFixed(1));p.setAttribute('y',(120+rnd()*480).toFixed(1));
    p.setAttribute('width',(5+rnd()*9).toFixed(1));p.setAttribute('height',(13+rnd()*22).toFixed(1));
    p.setAttribute('rx','2');
    const h=rnd();
    p.setAttribute('fill',h<.4?'#ffd257':h<.7?'#ffe9a8':h<.9?'#ff9fd0':'#8fd8ff');
    p.setAttribute('opacity',(.45+rnd()*.5).toFixed(2));
    p.setAttribute('class','conf');
    p.style.animationDuration=(3.4+rnd()*4.6).toFixed(2)+'s';
    p.style.animationDelay=(-rnd()*7).toFixed(2)+'s';
    box.appendChild(p)}
  // 草屑
  const tb=document.getElementById('tufts');
  for(let i=0;i<46;i++){
    const p=document.createElementNS(ns,'path');
    const x=rnd()*900,y=860+rnd()*130,h=10+rnd()*22;
    p.setAttribute('d','M'+x.toFixed(1)+' '+y.toFixed(1)+' q'+(rnd()*10-5).toFixed(1)+' '+(-h*.6).toFixed(1)+' '+(rnd()*8-4).toFixed(1)+' '+(-h).toFixed(1));
    p.setAttribute('stroke','#8fe3a6');p.setAttribute('fill','none');
    p.setAttribute('stroke-width',(1.4+rnd()*1.8).toFixed(1));
    p.setAttribute('opacity',(.25+rnd()*.45).toFixed(2));
    tb.appendChild(p)}
  // 冠军闪光星
  const sh=document.getElementById('shines'),NS=ns;
  for(let i=0;i<16;i++){
    const p=document.createElementNS(NS,'path');
    const x=180+rnd()*560,y=140+rnd()*560,r=5+rnd()*11;
    p.setAttribute('d','M'+x.toFixed(1)+' '+(y-r).toFixed(1)+' L'+(x+r*.28).toFixed(1)+' '+(y-r*.28).toFixed(1)+' L'+(x+r).toFixed(1)+' '+y.toFixed(1)+' L'+(x+r*.28).toFixed(1)+' '+(y+r*.28).toFixed(1)+' L'+x.toFixed(1)+' '+(y+r).toFixed(1)+' L'+(x-r*.28).toFixed(1)+' '+(y+r*.28).toFixed(1)+' L'+(x-r).toFixed(1)+' '+y.toFixed(1)+' L'+(x-r*.28).toFixed(1)+' '+(y-r*.28).toFixed(1)+' Z');
    p.setAttribute('fill','#fff6cf');p.setAttribute('class','spark');
    p.style.animationDelay=(-rnd()*2.4).toFixed(2)+'s';
    p.style.animationDuration=(1.6+rnd()*2).toFixed(2)+'s';
    sh.appendChild(p)}
})();
</script>
</body>
</html>
