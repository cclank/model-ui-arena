<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheetah Champions · 猎豹托举大力神杯冲刺</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(60% 40% at 50% 30%,#1c2d55,#070b18 75%);display:grid;place-items:center;overflow:hidden;font-family:"Arial Black","Helvetica Neue",Arial,"PingFang SC",sans-serif}
  svg{width:100%;height:100%;display:block}
  .rays{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .glowpulse{animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.85}}
  .flash{animation:flash 2.4s ease-in-out infinite}
  @keyframes flash{0%,70%,100%{opacity:0}78%{opacity:1}86%{opacity:.2}}
  .cf{transform-box:fill-box;transform-origin:center;animation:fall 9s linear infinite}
  @keyframes fall{from{transform:translateY(-140px) rotate(0)}to{transform:translateY(1400px) rotate(540deg)}}
  .beam{transform-box:fill-box;transform-origin:50% 0;animation:sway 7s ease-in-out infinite alternate}
  .beam.r{animation-delay:-3.5s}
  @keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
  .ball{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
  .cheetah,.ghosts{animation:stride .48s ease-in-out infinite alternate}
  @keyframes stride{to{transform:translateY(-7px)}}
  .speed line{stroke-dasharray:90 60;animation:dash .7s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-150}}
  .sparkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{transform:scale(.4);opacity:.2}50%{transform:scale(1.1);opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
  // 少量脚本：只用于生成重复性的背景元素（观众、闪光灯、彩带、速度线、足球面板），主体全部为手写 SVG
  const NS = "http://www.w3.org/2000/svg", $ = (i) => document.getElementById(i);
  let seed = 20260902; const rnd = () => (seed = (seed * 48271) % 2147483647) / 2147483647;   // 固定种子，输出可复现
  const mk = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const pal = ["#182340", "#22304f", "#2c3d63", "#3b4f7a", "#f2c14e", "#d5232b", "#e9e2d0", "#5d6f99"];
  for (let y = 46; y < 718; y += 19) for (let x = -4; x < 1004; x += 15) { const r = rnd(); mk("circle", { cx: (x + rnd() * 6).toFixed(1), cy: (y + rnd() * 5).toFixed(1), r: (4 + rnd() * 3).toFixed(1), fill: pal[r < .72 ? (r * 5.5 | 0) : 4 + ((r - .72) * 14 | 0)] }, $("crowd")); }
  for (let i = 0; i < 40; i++) { const c = mk("circle", { cx: rnd() * 1000, cy: 40 + rnd() * 660, r: 3, fill: "#fff", class: "flash", filter: "url(#soft)" }, $("flashes")); c.style.animationDelay = -rnd() * 2.4 + "s"; c.style.animationDuration = 1.8 + rnd() * 2 + "s"; }
  for (let i = 0; i < 6; i++) { mk("circle", { cx: 84 + i * 15, cy: 12, r: 6 }, $("lampsL")); mk("circle", { cx: 842 + i * 15, cy: 12, r: 6 }, $("lampsR")); }
  for (let i = 0; i < 18; i++) mk("path", { d: "M0 0 L-9 -230 L9 -230 Z", transform: `translate(0 72) rotate(${i * 20})` }, $("raygrp"));
  const cfPal = ["#f2c14e", "#ffe89a", "#fff", "#d5232b", "#f2c14e"];
  for (let i = 0; i < 90; i++) {
    const g = mk("g", { transform: `translate(${(rnd() * 1000).toFixed(0)} ${(rnd() * 900 - 100).toFixed(0)})` }, i < 55 ? $("confettiBack") : $("confettiFront"));
    const inner = mk("g", { class: "cf" }, g); inner.style.animationDuration = 7 + rnd() * 8 + "s"; inner.style.animationDelay = -rnd() * 15 + "s";
    mk("rect", { x: -5, y: -9, width: 10, height: 18, rx: 2, fill: cfPal[rnd() * 5 | 0], transform: `rotate(${rnd() * 360})`, opacity: i < 55 ? .75 : .95 }, inner);
  }
  for (let i = 0; i < 16; i++) { const y = 400 + rnd() * 520, x = 20 + rnd() * 260, l = 60 + rnd() * 180; mk("line", { x1: x, y1: y, x2: x + l, y2: y, stroke: "#fff", "stroke-width": 1.5 + rnd() * 3, "stroke-linecap": "round", opacity: .2 + rnd() * .4 }, $("speed")); }
  const pent = (cx, cy, r, rot) => Array.from({ length: 5 }, (_, k) => { const a = rot + k * 1.2566; return `${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`; }).join(" ");
  mk("polygon", { points: pent(0, 0, 15, -1.5708), fill: "#1a1a1a" }, $("ballpanels"));
  for (let k = 0; k < 5; k++) { const a = -1.5708 + .6283 + k * 1.2566; mk("polygon", { points: pent(Math.cos(a) * 37, Math.sin(a) * 37, 13, a + Math.PI), fill: "#1a1a1a" }, $("ballpanels")); mk("line", { x1: Math.cos(a - .6283) * 15, y1: Math.sin(a - .6283) * 15, x2: Math.cos(a - .6283) * 44, y2: Math.sin(a - .6283) * 44, stroke: "#555", "stroke-width": 1.5 }, $("ballpanels")); }
