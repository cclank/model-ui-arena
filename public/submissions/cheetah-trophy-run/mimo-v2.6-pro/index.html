<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猎豹托举大力神杯冲刺 · SVG 冠军海报</title>
<style>
  html,body{margin:0;height:100%;background:#06090f;display:flex;align-items:center;justify-content:center}
  .poster{width:min(100vw,534px);height:auto;display:block;box-shadow:0 18px 60px rgba(0,0,0,.55)}
  @media (max-width:560px){.poster{width:100vw}}
</style>
</head>
<body>
<!-- ============================================================
  猎豹托举大力神杯冲刺 · 分层 SVG 冠军海报
  图层（自下而上）：
    layer-sky 背景夜空 → layer-lights 聚光灯 → layer-stands 观众席
  → layer-scoreboard 比分牌 → layer-speed-lines 速度残影线 → layer-ghosts 残影
  → layer-confetti-back 后景彩带 → layer-runner 猎豹主体(内含 layer-trophy)
  → layer-field 草皮/足球/草痕 → layer-confetti-front 前景彩带 → layer-frame 边框
  全部手绘矢量，无任何位图 / logo / emoji。
============================================================ -->
<svg class="poster" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="拟人化猎豹在球场草皮上高速奔跑，双爪高举金色大力神杯，补时比分牌 90+7' 3:2">
<defs>
  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#080f24"/><stop offset=".55" stop-color="#122248"/>
    <stop offset="1" stop-color="#1b3358"/>
  </linearGradient>
  <radialGradient id="lampG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff4cf" stop-opacity=".95"/><stop offset=".35" stop-color="#ffe9a8" stop-opacity=".45"/>
    <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="coneG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff2c8" stop-opacity=".30"/><stop offset="1" stop-color="#fff2c8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="goldRay" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffdf8e" stop-opacity="0"/><stop offset=".45" stop-color="#ffdf8e" stop-opacity=".22"/>
    <stop offset="1" stop-color="#ffdf8e" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="standG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#101c3c"/><stop offset="1" stop-color="#0a1density4"/>
  </linearGradient>
  <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f8a4d"/><stop offset=".5" stop-color="#2b7a44"/><stop offset="1" stop-color="#1d5c33"/>
  </linearGradient>
  <linearGradient id="bodyG" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#f0b45a"/><stop offset=".55" stop-color="#df9f3c"/><stop offset="1" stop-color="#b97c22"/>
  </linearGradient>
  <linearGradient id="creamG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#faecc4"/><stop offset="1" stop-color="#e8cf96"/>
  </linearGradient>
  <linearGradient id="tailG" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eeb05a"/><stop offset="1" stop-color="#c88a2a"/>
  </linearGradient>
  <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff6c8"/><stop offset=".28" stop-color="#f6cd5c"/>
    <stop offset=".58" stop-color="#d29a1e"/><stop offset=".82" stop-color="#a86f0d"/><stop offset="1" stop-color="#e8bb4a"/>
  </linearGradient>
  <linearGradient id="goldGlobe" x1=".25" y1=".1" x2=".85" y2=".95">
    <stop offset="0" stop-color="#fff8d2"/><stop offset=".4" stop-color="#f4c84e"/><stop offset="1" stop-color="#9a6a08"/>
  </linearGradient>
  <linearGradient id="malachite" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2c8a63"/><stop offset=".5" stop-color="#146144"/><stop offset="1" stop-color="#0b3d2c"/>
  </linearGradient>
  <linearGradient id="streakG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffe9b0" stop-opacity="0"/><stop offset="1" stop-color="#ffe9b0" stop-opacity=".8"/>
  </linearGradient>
  <linearGradient id="titleG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff3b8"/><stop offset=".5" stop-color="#f2c24e"/><stop offset="1" stop-color="#c98a16"/>
  </linearGradient>
  <radialGradient id="ballG" cx=".35" cy=".3" r=".85">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e9e4d6"/><stop offset="1" stop-color="#b9b2a1"/>
  </radialGradient>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="nearBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="1.6"/>
  </filter>
  <pattern id="crowdFar" width="26" height="17" patternUnits="userSpaceOnUse">
    <circle cx="5" cy="6" r="2.6" fill="#5c6a95"/><circle cx="18" cy="9" r="2.4" fill="#4d5a83"/>
    <rect x="2" y="9" width="6" height="6" fill="#5c6a95"/><rect x="15" y="12" width="6" height="5" fill="#4d5a83"/>
  </pattern>
  <pattern id="crowdNear" width="30" height="20" patternUnits="userSpaceOnUse">
    <circle cx="6" cy="6" r="3.2" fill="#e8c44b"/><rect x="2" y="9" width="8" height="8" rx="1" fill="#d9a63c"/>
    <circle cx="21" cy="10" r="3" fill="#d94f3d"/><rect x="17" y="13" width="8" height="7" rx="1" fill="#b84332"/>
  </pattern>
  <pattern id="crowdMix" width="24" height="16" patternUnits="userSpaceOnUse">
    <circle cx="6" cy="5" r="2.5" fill="#ede6d6"/><circle cx="17" cy="9" r="2.3" fill="#4fa36b"/>
    <rect x="3" y="8" width="6" height="6" fill="#d8d2c2"/><rect x="14" y="11" width="6" height="5" fill="#428a5c"/>
  </pattern>
  <pattern id="ledDots" width="4" height="4" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1" fill="#000" opacity=".38"/>
  </pattern>
  <pattern id="gripKnurl" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <path d="M0 0 H7 M0 3.5 H7" stroke="#2a1d08" stroke-width="1" opacity=".45"/>
  </pattern>
  <!-- 残影用简化剪影 -->
  <g id="runner-silhouette">
    <path d="M300 585 C338 552 420 508 448 478 C470 462 470 430 476 410 C492 380 528 384 534 412
             C540 442 512 452 500 468 C520 448 552 440 560 462 C548 430 500 424 486 442
             C470 420 452 428 452 452 L446 480 C470 500 512 548 536 596 L520 640 C480 596 430 556 396 546
             C368 560 336 588 318 612 L300 585 Z"/>
    <path d="M312 600 C270 636 200 700 120 780 L150 812 C232 742 306 688 344 664 Z"/>
    <path d="M330 596 C380 626 440 672 470 730 L446 752 C408 704 356 664 314 644 Z"/>
    <path d="M302 588 C240 552 160 520 108 552 C82 568 78 600 96 614 L120 588 C112 566 148 546 196 556 C244 566 282 588 312 612 Z"/>
    <path d="M430 300 C448 340 452 360 448 380 L470 380 C472 352 466 322 452 288 Z"/>
    <path d="M540 300 C522 340 522 358 528 380 L552 372 C548 344 552 322 562 292 Z"/>
    <ellipse cx="490" cy="150" rx="52" ry="52"/>
    <rect x="436" y="238" width="108" height="26" rx="8"/>
  </g>
  <g id="confetti-strip">
    <rect x="-3.2" y="-9" width="6.4" height="18" rx="2.4"/>
  </g>
  <clipPath id="torsoClip"><path d="M452 470 C430 508 398 556 352 596 C332 616 318 624 322 646 C328 672 366 678 402 658 C452 630 496 578 508 528 C516 494 486 462 452 470 Z"/></clipPath>
  <clipPath id="headClip"><path d="M430 372 C430 336 452 316 482 316 C516 316 542 340 542 376 C542 412 520 442 484 444 C450 446 430 414 430 372 Z"/></clipPath>
  <clipPath id="hipClip"><ellipse cx="330" cy="612" rx="52" ry="44"/></clipPath>
  <clipPath id="legNearClip"><path d="M338 596 C388 618 448 660 486 714 C496 730 484 748 464 744 C420 736 356 690 318 648 C308 634 322 588 338 596 Z"/></clipPath>
  <clipPath id="legFarClip"><path d="M322 606 C276 636 196 706 116 786 C104 798 118 814 136 804 C218 736 296 682 340 660 C354 650 338 596 322 606 Z"/></clipPath>
  <clipPath id="tailClip"><path d="M318 596 C248 552 164 518 112 552 C84 570 78 604 100 620 C112 628 124 622 118 610 C102 592 112 568 148 558 C196 545 254 568 322 616 Z"/></clipPath>
  <clipPath id="ballClip"><circle cx="642" cy="776" r="42"/></clipPath>
</defs>

<!-- ========== layer-sky 夜空背景 ========== -->
<g id="layer-sky">
  <rect x="0" y="0" width="800" height="1000" fill="url(#skyG)"/>
  <ellipse cx="150" cy="90" rx="210" ry="150" fill="url(#lampG)" opacity=".55"/>
  <ellipse cx="655" cy="70" rx="210" ry="150" fill="url(#lampG)" opacity=".5"/>
  <ellipse cx="400" cy="130" rx="260" ry="120" fill="url(#lampG)" opacity=".22"/>
</g>

<!-- ========== layer-lights 聚光灯锥与金色光柱 ========== -->
<g id="layer-lights">
  <path d="M120 40 L40 760 L260 760 Z" fill="url(#coneG)" transform="rotate(-6 120 40)"/>
  <path d="M672 36 L540 760 L780 760 Z" fill="url(#coneG)" transform="rotate(7 672 36)"/>
  <path d="M420 24 L330 720 L520 720 Z" fill="url(#coneG)" opacity=".7"/>
  <path d="M470 300 L415 300 L452 760 L560 760 Z" fill="url(#goldRay)" filter="url(#softGlow)"/>
  <path d="M508 290 L470 290 L520 750 L640 750 Z" fill="url(#goldRay)" opacity=".7"/>
  <circle cx="128" cy="36" r="14" fill="#fff7d8"/><circle cx="676" cy="32" r="14" fill="#fff7d8"/>
  <circle cx="128" cy="36" r="30" fill="url(#lampG)"/><circle cx="676" cy="32" r="30" fill="url(#lampG)"/>
</g>

<!-- ========== layer-stands 观众席 ========== -->
<g id="layer-stands">
  <path d="M0 300 L800 282 L800 596 L0 616 Z" fill="#0d1834"/>
  <path d="M0 318 L800 300 L800 388 L0 406 Z" fill="url(#crowdFar)"/>
  <path d="M0 340 L800 322 L800 404 L0 422 Z" fill="#0d1834" opacity=".35"/>
  <path d="M0 408 L800 390 L800 498 L0 516 Z" fill="url(#crowdMix)"/>
  <path d="M0 440 L800 422 L800 500 L0 518 Z" fill="#0d1834" opacity=".28"/>
  <path d="M0 520 L800 502 L800 604 L0 622 Z" fill="url(#crowdNear)"/>
  <path d="M0 560 L800 542 L800 610 L0 628 Z" fill="#0d1834" opacity=".3"/>

  <path d="M0 604 L800 586 L800 622 L0 640 Z" fill="#22305c"/>
  <path d="M0 616 L800 598" stroke="#3d4f85" stroke-width="4"/>
  <g stroke="#3d4f85" stroke-width="5">
    <path d="M70 612 L74 640"/><path d="M240 606 L244 634"/><path d="M420 600 L424 628"/>
    <path d="M600 594 L604 622"/><path d="M760 588 L764 616"/>
  </g>
  <!-- 观众旗帜（纯色无标志） -->
  <g opacity=".9">
    <path d="M96 356 L150 344 L150 392 L96 400 Z" fill="#d94f3d"/>
    <path d="M242 350 L286 342 L286 384 L242 392 Z" fill="#e8c44b"/>
    <path d="M556 336 L606 328 L606 372 L556 380 Z" fill="#4fa36b"/>
    <path d="M676 332 L716 326 L716 366 L676 372 Z" fill="#ede6d6"/>
    <path d="M382 344 L420 338 L420 376 L382 382 Z" fill="#7a5cc7"/>
  </g>
</g>

<!-- ========== layer-scoreboard 补时比分牌 ========== -->
<g id="layer-scoreboard">
  <rect x="64" y="128" width="286" height="146" rx="12" fill="#0a0f1e" stroke="#3d4f85" stroke-width="5"/>
  <rect x="78" y="142" width="258" height="118" rx="6" fill="#0c1322"/>
  <text x="207" y="172" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17"
        letter-spacing="3" fill="#5d6f9e">ADDED TIME · FINAL</text>
  <text x="207" y="218" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="46"
        font-weight="700" fill="#ffb300">90+7'</text>
  <text x="207" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="34"
        font-weight="700" fill="#45e08a">3 : 2</text>
  <rect x="78" y="142" width="258" height="118" rx="6" fill="url(#ledDots)"/>
  <circle cx="64" cy="200" r="5" fill="#2a3a66"/><circle cx="350" cy="200" r="5" fill="#2a3a66"/>
  <rect x="188" y="274" width="38" height="34" fill="#22305c"/>
</g>

<!-- ========== layer-speed-lines 速度残影线 ========== -->
<g id="layer-speed-lines" stroke="url(#streakG)" stroke-linecap="round">
  <path d="M120 452 H330" stroke-width="7" opacity=".8"/>
  <path d="M60 500 H300" stroke-width="5" opacity=".65"/>
  <path d="M150 546 H336" stroke-width="8" opacity=".75"/>

  <path d="M120 742 H286" stroke-width="6" opacity=".6"/>
  <path d="M52 786 H220" stroke-width="4" opacity=".45"/>
</g>

<!-- ========== layer-ghosts 速度残影（三次叠加） ========== -->
<g id="layer-ghosts" fill="#ffe2a0">
  <use href="#runner-silhouette" transform="translate(-232,6) scale(1.015) translate(-4,-8)" opacity=".05" filter="url(#nearBlur)"/>
  <use href="#runner-silhouette" transform="translate(-152,3) scale(1.01) translate(-3,-5)" opacity=".085" filter="url(#nearBlur)"/>
  <use href="#runner-silhouette" transform="translate(-78,0)" opacity=".13"/>
</g>

  <use href="#confetti-strip" transform="translate(208,258) rotate(-38)"/>

</g>

<g id="layer-runner">
  <!-- -- 尾巴：向后动势弧线，环纹 + 斑点 + 深色尾梢 -- -->
  <g id="cheetah-tail">
    <path d="M318 596 C248 552 164 518 112 552 C84 570 78 604 100 620 C112 628 124 622 118 610
             C102 592 112 568 148 558 C196 545 254 568 322 616 Z" fill="url(#tailG)"/>
    <g clip-path="url(#tailClip)" fill="#241708">
      <ellipse cx="290" cy="576" rx="11" ry="8" transform="rotate(-22 290 576)"/>
      <ellipse cx="248" cy="558" rx="12" ry="8.5" transform="rotate(-16 248 558)"/>
      <ellipse cx="204" cy="548" rx="12" ry="8.5"/>
      <ellipse cx="162" cy="554" rx="11" ry="8" transform="rotate(12 162 554)"/>

  <!-- -- 远侧后腿：蹬地伸展 -- -->

             C354 650 338 596 322 606 Z" fill="#c88a2a"/>

      <ellipse cx="242" cy="686" rx="8.5" ry="6.5" transform="rotate(38 242 686)"/>

      <ellipse cx="152" cy="762" rx="7" ry="5.5" transform="rotate(38 152 762)"/>

          stroke="#241708" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- -- 远侧前臂（举杯左爪，位于奖杯后层） -- -->
  <g id="cheetah-arm-far">
    <path d="M432 472 C418 424 412 372 424 330 C430 312 452 314 456 332 C462 366 462 414 468 462 Z" fill="#c88a2a"/>
    <g fill="#241708" opacity=".9">
      <ellipse cx="428" cy="382" rx="8" ry="6" transform="rotate(12 428 382)"/>
      <ellipse cx="432" cy="344" rx="7" ry="5.5"/>

    <path d="M424 322 C414 306 420 288 436 284 C452 280 464 292 462 308 C460 322 440 332 424 322 Z" fill="#e0a13c"/>
  </g>

  <!-- -- 躯干：前倾流线型，胸腔 + 骨盆 -- -->
  <g id="cheetah-torso">
    <ellipse cx="330" cy="612" rx="52" ry="44" fill="url(#bodyG)"/>
    <path d="M452 470 C430 508 398 556 352 596 C332 616 318 624 322 646 C328 672 366 678 402 658
             C452 630 496 578 508 528 C516 494 486 462 452 470 Z" fill="url(#bodyG)"/>

          fill="url(#creamG)" opacity=".95"/>

      <path d="M436 500 C414 530 384 566 356 596"/>
      <path d="M462 522 C436 556 402 592 372 618"/>
      <path d="M332 588 C352 592 376 600 396 614"/>
    </g>
    <path d="M470 482 C452 512 424 552 392 588" stroke="#fbe3a8" stroke-width="6" fill="none" opacity=".55" stroke-linecap="round"/>
    <g clip-path="url(#torsoClip)" fill="#241708">

      <ellipse cx="424" cy="522" rx="10" ry="7.5" transform="rotate(-32 424 522)"/>

      <ellipse cx="414" cy="592" rx="9.5" ry="7" transform="rotate(-32 414 592)"/>
      <ellipse cx="348" cy="604" rx="9.5" ry="7" transform="rotate(-32 348 604)"/>
      <ellipse cx="486" cy="512" rx="8" ry="6" transform="rotate(-32 486 512)"/>
      <ellipse cx="390" cy="618" rx="8.5" ry="6.5" transform="rotate(-32 390 618)"/>

    <g clip-path="url(#hipClip)" fill="#241708">

      <ellipse cx="342" cy="588" rx="10" ry="7.5" transform="rotate(-14 342 588)"/>
      <ellipse cx="318" cy="630" rx="10" ry="7.5" transform="rotate(-14 318 630)"/>

      <ellipse cx="304" cy="652" rx="9" ry="6.5" transform="rotate(-14 304 652)"/>
    </g>
  </g>

  <!-- -- 近侧后腿：屈膝前摆 -- -->

    <path d="M338 596 C388 618 448 660 486 714 C496 730 484 748 464 744 C420 736 356 690 318 648
             C308 634 322 588 338 596 Z" fill="url(#bodyG)"/>
