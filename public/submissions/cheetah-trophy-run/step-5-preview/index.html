    font-family: "Avenir Next", "PingFang SC", sans-serif;

  .poster {
    width: min(96vw, 560px); border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
  }
  svg { display: block; width: 100%; height: auto; }
  /* —— 氛围动效：彩带飘落 / 灯光呼吸 / 奖杯辉光 / 尘土 —— */
  .conf { animation: fall linear infinite; transform-origin: center; }
  @keyframes fall { 0% { transform: translateY(-30px) rotate(0deg); } 100% { transform: translateY(940px) rotate(720deg); } }
  .beam { animation: flick 5s ease-in-out infinite; }
  @keyframes flick { 0%,100% { opacity: .5; } 45% { opacity: .78; } 70% { opacity: .55; } }
  .gleam { animation: gleam 3.2s ease-in-out infinite; }
  @keyframes gleam { 0%,100% { opacity: .25; } 50% { opacity: .85; } }
  .dust { animation: puff 1.6s ease-out infinite; }
  @keyframes puff { 0% { transform: translate(0,0) scale(.6); opacity: .8; } 100% { transform: translate(-48px,-18px) scale(1.5); opacity: 0; } }
</style>
