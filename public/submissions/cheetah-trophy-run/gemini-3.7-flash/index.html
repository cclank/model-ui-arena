<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheetah Trophy Run - World Champion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #070b14; display: flex; align-items: center;
      justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px; color: #fff; overflow-x: hidden;
    }
    .poster-card {
      width: 100%; max-width: 540px; background: #0c1322; border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 20px; box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 35px rgba(255, 215, 0, 0.15);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .svg-container { width: 100%; aspect-ratio: 4 / 5; position: relative; }
    svg { width: 100%; height: 100%; display: block; }
    .footer-desc {
      padding: 12px 18px; background: rgba(12, 19, 34, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;
    }
    .tag { background: rgba(255, 215, 0, 0.15); color: #ffd700; padding: 4px 10px; border-radius: 8px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="poster-card">
    <div class="svg-container">
      <svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Stadium Lights Gradient -->
          <radialGradient id="lightBeam1" cx="0.1" cy="0.1" r="0.8">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
            <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#0c1322" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="lightBeam2" cx="0.9" cy="0.1" r="0.8">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
            <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#0c1322" stop-opacity="0" />
          </radialGradient>
          <!-- Trophy Gold Gradient -->
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffbeb" />
            <stop offset="25%" stop-color="#fef08a" />
            <stop offset="50%" stop-color="#eab308" />
            <stop offset="75%" stop-color="#ca8a04" />
            <stop offset="100%" stop-color="#854d0e" />
          </linearGradient>
          <!-- Cheetah Fur Gradient -->
          <linearGradient id="cheetahFur" x1="0%" y1="0%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
          </linearGradient>
          <!-- Pitch Grass Gradient -->
          <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#15803d" />
            <stop offset="40%" stop-color="#166534" />
            <stop offset="100%" stop-color="#052e16" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Background / Sky -->
        <rect width="800" height="1000" fill="#090e17" />

        <!-- Stadium Crowd / Stands -->
        <rect y="320" width="800" height="180" fill="#111827" opacity="0.9" />
        <!-- Crowd speckles -->
        <g fill="#4b5563" opacity="0.6">
          <circle cx="100" cy="360" r="3"/><circle cx="140" cy="380" r="2.5"/><circle cx="200" cy="350" r="3"/>
          <circle cx="280" cy="370" r="2.5"/><circle cx="520" cy="360" r="3"/><circle cx="600" cy="350" r="2.5"/>
          <circle cx="680" cy="380" r="3"/><circle cx="740" cy="360" r="2"/>
        </g>

        <!-- Stadium Lighting Beams -->
        <polygon points="0,0 260,0 600,600 0,600" fill="url(#lightBeam1)" />
        <polygon points="800,0 540,0 200,600 800,600" fill="url(#lightBeam2)" />

        <!-- Scoreboard (90+7' | 3 : 2) -->
        <g transform="translate(300, 120)">
          <rect width="200" height="74" rx="10" fill="#0f172a" stroke="#ffd700" stroke-width="2" />
          <text x="100" y="28" font-size="14" fill="#38bdf8" font-weight="bold" text-anchor="middle" letter-spacing="2">FINAL · 90+7'</text>
          <text x="100" y="60" font-size="30" fill="#facc15" font-weight="900" text-anchor="middle" letter-spacing="4">3 : 2</text>
        </g>

        <!-- Football Pitch & Grass -->
        <path d="M 0,480 Q 400,450 800,480 L 800,1000 L 0,1000 Z" fill="url(#grassGrad)" />
        <!-- Pitch Lines -->
        <path d="M 0,600 Q 400,560 800,600" stroke="rgba(255,255,255,0.25)" stroke-width="4" fill="none" />
        <ellipse cx="400" cy="720" rx="220" ry="60" stroke="rgba(255,255,255,0.2)" stroke-width="4" fill="none" />

        <!-- Confetti / Golden Streamers -->
        <g stroke="#fde047" stroke-width="4" stroke-linecap="round" opacity="0.8">
          <path d="M 120,180 Q 140,220 110,260" fill="none" stroke="#f43f5e" />
          <path d="M 680,160 Q 650,210 690,250" fill="none" stroke="#38bdf8" />
          <path d="M 220,100 Q 240,140 210,180" fill="none" stroke="#ffd700" />
          <path d="M 580,90 Q 560,130 590,170" fill="none" stroke="#ffd700" />
          <circle cx="160" cy="280" r="4" fill="#ffd700" stroke="none" />
          <circle cx="640" cy="310" r="5" fill="#f43f5e" stroke="none" />
          <circle cx="280" cy="220" r="4" fill="#38bdf8" stroke="none" />
        </g>

        <!-- Speed Motion Shadows / Streaks -->
        <g opacity="0.3">
          <path d="M 280,620 L 420,540 L 400,660 Z" fill="#d97706" />
          <path d="M 220,650 L 380,560 L 340,680 Z" fill="#f59e0b" />
        </g>

        <!-- CHEETAH BODY & SPRINTING POSE -->
        <g id="cheetah">
          <!-- Back Leg (Pushing Ground) -->
          <path d="M 330,620 Q 240,680 180,720 Q 220,740 260,710 Q 340,680 380,630 Z" fill="url(#cheetahFur)" stroke="#92400e" stroke-width="2" />
          <!-- Running Tail (Long curved dynamic arc) -->
          <path d="M 280,580 Q 160,560 120,440 Q 110,410 130,410 Q 150,430 170,510 Q 220,560 300,570 Z" fill="url(#cheetahFur)" stroke="#92400e" stroke-width="2" />
          <!-- Tail spots & black tip -->
          <circle cx="140" cy="450" r="6" fill="#18181b" />
          <circle cx="170" cy="500" r="7" fill="#18181b" />
          <path d="M 120,440 Q 110,410 130,410 Q 135,420 125,440 Z" fill="#18181b" />

          <!-- Forward Stride Front / Other Leg -->
          <path d="M 440,600 Q 480,680 530,730 Q 560,720 530,680 Q 480,620 460,570 Z" fill="url(#cheetahFur)" stroke="#92400e" stroke-width="2" />

          <!-- Torso / Muscular Aerodynamic Body -->
          <path d="M 300,580 Q 360,520 450,480 Q 480,510 440,590 Q 370,630 300,580 Z" fill="url(#cheetahFur)" stroke="#92400e" stroke-width="2" />

          <!-- Cheetah Spots on Torso -->
          <g fill="#18181b">
            <circle cx="340" cy="570" r="5" /><circle cx="370" cy="550" r="6" /><circle cx="400" cy="530" r="5" />
            <circle cx="430" cy="510" r="6" /><circle cx="360" cy="590" r="5.5" /><circle cx="400" cy="570" r="5" />
          </g>

          <!-- Head (Feline Profile, Eyes focused forward/up) -->
          <g transform="translate(430, 390)">
            <!-- Head Base -->
            <ellipse cx="60" cy="50" rx="42" ry="34" fill="url(#cheetahFur)" stroke="#92400e" stroke-width="2" />
            <!-- Ears -->
            <path d="M 35,22 Q 45,5 60,18 Z" fill="#d97706" stroke="#92400e" stroke-width="1.5" />
            <path d="M 40,20 Q 46,10 54,18 Z" fill="#fecdd3" />
            <!-- Muzzle & Mouth -->
            <path d="M 80,50 Q 105,52 100,66 Q 85,74 70,68 Z" fill="#fef08a" />
            <polygon points="98,54 105,58 96,62" fill="#18181b" />
            <!-- Iconic Black Tear Marks (Tear Stripes) -->
            <path d="M 75,44 Q 84,48 88,60 Q 90,68 86,72" stroke="#18181b" stroke-width="4.5" fill="none" stroke-linecap="round" />
            <!-- Eye (Determined, Gold/Amber) -->
            <ellipse cx="74" cy="42" rx="7" ry="5" fill="#fef08a" />
            <circle cx="75" cy="42" r="3.5" fill="#18181b" />
            <circle cx="76" cy="41" r="1.5" fill="#ffffff" />
            <!-- Head spots -->
            <circle cx="45" cy="36" r="3.5" fill="#18181b" />
            <circle cx="55" cy="30" r="3" fill="#18181b" />
          </g>

          <!-- High Raised Forelegs / Arms Lifting Trophy -->
          <path d="M 460,460 Q 470,360 440,290 Q 465,285 485,340 Q 495,410 480,470 Z" fill="url(#cheetahFur)" stroke="#92400e" stroke-width="2" />
          <path d="M 480,450 Q 520,350 510,290 Q 535,285 545,340 Q 535,420 500,470 Z" fill="url(#cheetahFur)" stroke="#92400e" stroke-width="2" />
        </g>

        <!-- WORLD CUP / FIFA TROPHY (Lifted High) -->
        <g id="trophy" transform="translate(440, 140)" filter="url(#glow)">
          <!-- Base Malachite Green Rings -->
          <rect x="0" y="140" width="80" height="14" rx="3" fill="#047857" stroke="#065f46" stroke-width="2" />
          <rect x="5" y="126" width="70" height="14" rx="3" fill="#047857" stroke="#065f46" stroke-width="2" />
          <rect x="0" y="140" width="80" height="4" fill="#ffd700" />
          <rect x="5" y="126" width="70" height="4" fill="#ffd700" />

          <!-- Main Golden Trophy Stem (Two stylized athletes holding globe) -->
          <path d="M 12,126 Q 20,80 8,50 Q 25,65 40,75 Q 55,65 72,50 Q 60,80 68,126 Z" fill="url(#goldGrad)" stroke="#a16207" stroke-width="2" />
          <path d="M 25,120 Q 32,85 40,82 Q 48,85 55,120 Z" fill="#ca8a04" />

          <!-- Golden Globe on Top -->
          <circle cx="40" cy="35" r="32" fill="url(#goldGrad)" stroke="#a16207" stroke-width="2" />
          <!-- Continents relief / lines on trophy globe -->
          <path d="M 20,30 Q 30,15 45,22 Q 55,30 40,42 Q 25,40 20,30 Z" fill="#fef08a" opacity="0.7" />
          <path d="M 48,32 Q 62,35 60,50 Q 48,55 45,45 Z" fill="#fef08a" opacity="0.7" />
          <!-- Glint highlight -->
          <ellipse cx="30" cy="22" rx="8" ry="4" fill="#ffffff" opacity="0.8" transform="rotate(-30, 30, 22)" />
        </g>

        <!-- Rolling Football & Grass Divots -->
        <g transform="translate(560, 750)">
          <!-- Divot / Mud Spray -->
          <path d="M -20,20 Q -50,-10 -90,0 Q -60,20 -20,20 Z" fill="#854d0e" opacity="0.8" />
          <circle cx="-60" cy="-5" r="4" fill="#15803d" />
          <circle cx="-40" cy="8" r="3" fill="#854d0e" />

          <!-- Ball -->
          <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="2" />
          <!-- Classic Hexagon Patches -->
          <polygon points="0,-10 9,-3 6,8 -6,8 -9,-3" fill="#111827" />
          <polygon points="0,-28 -8,-20 -5,-12 5,-12 8,-20" fill="#111827" />
          <polygon points="-24,-4 -28,5 -20,12 -14,5 -17,-3" fill="#111827" />
          <polygon points="24,-4 28,5 20,12 14,5 17,-3" fill="#111827" />
          <!-- Motion Lines on Ball -->
          <path d="M -40,-15 Q -60,-10 -80,-5" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
          <path d="M -35,5 Q -55,10 -75,15" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
        </g>

        <!-- Championship Typography Banner at Bottom -->
        <g transform="translate(400, 930)">
          <text x="0" y="0" font-size="36" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="6" filter="url(#glow)">WORLD CHAMPIONS</text>
          <text x="0" y="26" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="3">INJURY TIME WINNER · 90+7'</text>
        </g>
      </svg>
    </div>
    <div class="footer-desc">
      <span>⚽ 拟人猎豹 · 终场补时夺冠</span>
      <span class="tag">SVG 原创精绘</span>
    </div>
  </div>
</body>
</html>
