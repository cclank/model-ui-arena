<!-- 设计说明：猎豹托举大力神杯冲刺 · 冠军之夜海报
     纯内联 SVG：拟人猎豹（泪痕/斑点/长尾/流线身形）双爪高举金杯，
     绿色底座+双人托举+地球球体奖杯结构，球场草皮、聚光灯、观众席、
     金色彩带、速度残影与 90+7' 3:2 比分牌构成补时绝杀夺冠叙事。 -->
<!doctype html>

<title>猎豹举杯冲刺 · Cheetah Trophy Run</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a0e22;height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif;display:grid;place-items:center}
svg{display:block;width:100%;height:auto;max-height:100vh}
svg *{transform-box:view-box}
#tail{animation:sway .7s ease-in-out infinite alternate;transform-origin:672px 586px}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
.streak{animation:shim 1.6s ease-in-out infinite}
@keyframes shim{0%,100%{opacity:.15}50%{opacity:.6}}
.streak.s2{animation-delay:.4s}.streak.s3{animation-delay:.8s}.streak.s4{animation-delay:1.2s}
.conf{animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-60px) rotate(0deg);opacity:0}8%{opacity:1}100%{transform:translateY(1060px) rotate(540deg);opacity:.9}}
.dust{animation:dpuff 1.1s ease-out infinite}
@keyframes dpuff{0%{transform:scale(.5);opacity:.55}100%{transform:scale(1.6);opacity:0}}
.sheen{animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%,100%{opacity:.25}50%{opacity:.75}}
#scoreMin{filter:drop-shadow(0 0 14px #ff4d5e)}
#scoreVal{filter:drop-shadow(0 0 12px #ffd34d)}
@media (max-width:640px){svg{width:100vw;height:100vh;max-height:none}}
</style>
</head>
