<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>猎豹托举大力神杯冲刺 · SVG 冠军海报</title>
<style>
  html,body{margin:0;height:100%;background:#04060e;display:grid;place-items:center;
    font-family:-apple-system,"PingFang SC",system-ui,sans-serif}
  .poster{width:min(97vw,820px);max-height:98vh;padding:6px}
  svg{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
  /* ---- 动效增强（少量 CSS 动画） ---- */
  .flash{animation:fl 2.8s linear infinite}
  @keyframes fl{0%,92%,100%{opacity:0}94%{opacity:.95}97%{opacity:.1}}
  .confA{animation:fallA 7s linear infinite}
  .confB{animation:fallB 9s linear infinite}
  @keyframes fallA{from{transform:translateY(-70px)}to{transform:translateY(1060px)}}
  @keyframes fallB{from{transform:translateY(-140px)}to{transform:translateY(1060px)}}
  .trophyGlow{animation:tg 2.6s ease-in-out infinite}
  @keyframes tg{0%,100%{opacity:.45}50%{opacity:.85}}
  .speed{animation:sp 1.1s linear infinite}
  @keyframes sp{from{transform:translateX(26px);opacity:0}18%{opacity:.85}to{transform:translateX(-46px);opacity:0}}
  .ballspin{animation:bs 2.4s linear infinite;transform-origin:622px 802px}
  @keyframes bs{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.flash,.confA,.confB,.trophyGlow,.speed,.ballspin{animation:none}}
</style>
</head>
<body>
<div class="poster">
<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="猎豹托举大力神杯冲刺夺冠海报">
<defs>
  <!-- ===== 渐变 ===== -->
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#070c22"/><stop offset=".55" stop-color="#141f4d"/>
    <stop offset=".85" stop-color="#2c3a75"/><stop offset="1" stop-color="#4a4a86"/>
  </linearGradient>
  <linearGradient id="turfGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2e9446"/><stop offset=".35" stop-color="#1d7a38"/><stop offset="1" stop-color="#0c4c22"/>
  </linearGradient>
  <!-- 毛色渐变用 userSpaceOnUse：躯干/大腿/前臂共享同一光域，接缝处不留色块边 -->

    <stop offset="0" stop-color="#f7c463"/><stop offset=".5" stop-color="#e8a63f"/><stop offset="1" stop-color="#c07f26"/>
  </linearGradient>
  <linearGradient id="furLegGrad" gradientUnits="userSpaceOnUse" x1="180" y1="420" x2="600" y2="640">
    <stop offset="0" stop-color="#efb453"/><stop offset="1" stop-color="#b97c28"/>
  </linearGradient>
  <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbf1d8"/><stop offset="1" stop-color="#edd9a8"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff0b3"/><stop offset=".35" stop-color="#ffd257"/>
    <stop offset=".7" stop-color="#e39b1c"/><stop offset="1" stop-color="#8a5a10"/>
  </linearGradient>
  <linearGradient id="goldGradV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe89a"/><stop offset=".5" stop-color="#f5b92e"/><stop offset="1" stop-color="#9c6410"/>
  </linearGradient>
  <radialGradient id="ballGold" cx=".35" cy=".3" r="1">
    <stop offset="0" stop-color="#fff6cf"/><stop offset=".45" stop-color="#ffd257"/><stop offset="1" stop-color="#a86d0e"/>
  </radialGradient>
  <linearGradient id="greenBase" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#06381f"/><stop offset=".3" stop-color="#127a45"/><stop offset=".55" stop-color="#1fa45e"/>
    <stop offset=".8" stop-color="#0b5c33"/><stop offset="1" stop-color="#052e1a"/>
  </linearGradient>
  <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfe4ff" stop-opacity=".5"/><stop offset="1" stop-color="#cfe4ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glowSoft" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="turfLight" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#bfe8a0" stop-opacity=".4"/><stop offset="1" stop-color="#bfe8a0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b2440"/><stop offset="1" stop-color="#0a0f20"/>
  </linearGradient>
  <radialGradient id="vignette" cx=".5" cy=".45" r=".75">
    <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
  </radialGradient>
  <!-- ===== 观众席图案 ===== -->
  <pattern id="crowd" width="16" height="12" patternUnits="userSpaceOnUse">

    <circle cx="4" cy="4" r="2.6" fill="#26355f"/><circle cx="12" cy="8" r="2.6" fill="#1d2a50"/>
    <circle cx="12" cy="2" r="1.6" fill="#31426f"/><circle cx="4" cy="9" r="1.6" fill="#2b3b66"/>
  </pattern>
  <!-- ===== 滤镜 ===== -->
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ghostBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- ===== 猎豹主体（供残影复用） ===== -->
  <path id="torsoPath" d="M462 452 C494 462 502 500 484 528 C458 566 396 596 336 598 C296 600 270 580 268 548 C266 514 296 490 338 480 C386 468 430 442 462 452 Z"/>
  <g id="cheetahSil">
    <use href="#torsoPath"/>
    <path d="M292 540 C216 500 148 502 100 548 C88 560 86 578 98 584 C108 589 118 583 122 572 C150 528 214 522 284 560 Z"/>
    <circle cx="556" cy="408" r="46"/>
    <path d="M588 388 C612 392 632 406 634 420 C636 434 618 446 596 446 C580 446 566 438 562 428 Z"/>
    <path d="M310 562 C256 596 214 656 178 706 C156 736 128 750 104 756 C92 759 90 772 102 776 C146 782 186 758 212 722 C246 676 288 622 330 592 Z"/>
    <path d="M330 574 C382 606 408 646 398 692 C392 722 404 752 424 770 C432 777 428 790 416 790 C386 790 362 764 356 730 C348 686 336 640 306 600 Z"/>
    <path d="M452 462 C446 400 440 330 442 268 L470 266 C472 330 476 398 484 458 Z"/>
    <path d="M486 470 C498 410 508 340 508 272 L536 272 C534 342 522 412 512 474 Z"/>
  </g>
  <clipPath id="bodyClip">
    <use href="#torsoPath"/>
    <path d="M310 562 C256 596 214 656 178 706 C156 736 128 750 104 756 C92 759 90 772 102 776 C146 782 186 758 212 722 C246 676 288 622 330 592 Z"/>
    <path d="M330 574 C382 606 408 646 398 692 C392 722 404 752 424 770 C432 777 428 790 416 790 C386 790 362 764 356 730 C348 686 336 640 306 600 Z"/>
  </clipPath>
</defs>

<!-- ============ 1. 夜空 ============ -->

</g>

  <path d="M0 640 Q400 610 800 640 L800 668 L0 668 Z" fill="#0b1128"/>

    <rect x="0" y="644" width="800" height="26" fill="#0e1631"/>
    <text x="46" y="663" fill="#37e08c">CHAMPIONS</text><text x="252" y="663" fill="#ffd257">★ FINAL NIGHT ★</text>
    <text x="520" y="663" fill="#6ea8ff">GLORY RUN</text><text x="716" y="663" fill="#ff7d9c">90+7</text>

    <circle class="flash" cx="305" cy="330" r="3.2" style="animation-delay:.9s"/><circle class="flash" cx="420" cy="455" r="2.8" style="animation-delay:1.3s"/>

    <circle class="flash" cx="255" cy="560" r="3" style="animation-delay:2s"/><circle class="flash" cx="600" cy="545" r="3.2" style="animation-delay:.6s"/>

</g>

<!-- ============ 4. 比分牌 ============ -->

  <rect x="572" y="106" width="192" height="46" rx="6" fill="#060a18"/>

  <g font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8fa3d9">

</g>

<g id="turf">

  <g fill="#ffffff" opacity=".05">

</g>
