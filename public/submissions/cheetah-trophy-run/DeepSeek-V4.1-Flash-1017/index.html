<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>90+7' — The Trophy Run</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  html{background:#020604}
  body{
    margin:0;
    min-height:100vh;
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:clamp(8px,2.6vh,28px);
    background:
      radial-gradient(120% 78% at 50% -14%, rgba(40,140,100,.30) 0%, rgba(11,35,27,.16) 42%, rgba(3,9,7,0) 72%),
      radial-gradient(46% 30% at 50% 16%, rgba(255,225,160,.09) 0%, rgba(255,225,160,0) 72%),
      radial-gradient(62% 46% at 50% 112%, rgba(244,198,91,.18) 0%, rgba(244,198,91,0) 70%),
      radial-gradient(90% 90% at 50% 46%, #0a1e17 0%, #05100c 54%, #020604 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#d7e6dc;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background:
      radial-gradient(60% 50% at 18% 8%, rgba(255,224,150,.07), transparent 65%),
      radial-gradient(46% 44% at 86% 20%, rgba(255,207,120,.05), transparent 70%);
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:2;
    background:radial-gradient(ellipse at 50% 48%, transparent 56%, rgba(0,0,0,.5) 100%);
  }
  .stage{
    position:relative;
    z-index:1;
    width:min(94vw,70vh);
    max-width:760px;
    filter:drop-shadow(0 34px 60px rgba(0,0,0,.55));
  }
  .poster{
    display:block;
    width:100%;
    height:auto;
    border-radius:7px;
    box-shadow:
      0 0 0 1px rgba(244,198,91,.24),
      0 0 0 5px rgba(5,18,13,.55),
      0 0 90px rgba(244,198,91,.07),
      0 30px 80px rgba(0,0,0,.65);
  }
  .confetti{
    animation:confettiFloat var(--dur,9s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
    opacity:var(--op,.9);
    transform-box:fill-box;
    transform-origin:center;
  }
  .speed{
    animation:speedBreath 3.8s ease-in-out infinite;
  }
  .speed-alt{animation-delay:-1.9s}
  .dust{
    animation:dustDrift 11s linear infinite;
    animation-delay:var(--delay,0s);
  }
  .twinkle{
    animation:twinkle 4.6s ease-in-out infinite;
    animation-delay:var(--delay,0s);
    transform-box:fill-box;
    transform-origin:center;
  }
  .beam-sway{
    transform-origin:120px 120px;
    animation:beamSway 13s ease-in-out infinite alternate;
  }
  .beam-sway2{
    transform-origin:890px 100px;
    animation:beamSway2 17s ease-in-out infinite alternate;
  }
  @keyframes confettiFloat{
    0%,100%{transform:translateY(-6px) rotate(-2deg)}
    50%{transform:translateY(12px) rotate(3deg)}
  }
  @keyframes speedBreath{
    0%,100%{opacity:.22}
    50%{opacity:.62}
  }
  @keyframes dustDrift{
    0%{transform:translate(0,0);opacity:0}
    20%{opacity:.6}
    80%{opacity:.4}
    100%{transform:translate(26px,-46px);opacity:0}
  }
  @keyframes twinkle{
    0%,100%{opacity:.2;transform:scale(.7)}
    50%{opacity:.95;transform:scale(1.15)}
  }
  @keyframes beamSway{
    from{transform:rotate(-1.1deg)}
    to{transform:rotate(1.3deg)}
  }
  @keyframes beamSway2{
    from{transform:rotate(1.2deg)}
    to{transform:rotate(-1deg)}
  }
  .mobile-meta{display:none}
  @media (max-width:560px){
    body{
      padding:0;
      justify-items:start;
      align-content:center;
    }
    .stage{
      width:min(calc(100vw - 10px), 384px);
      margin-left:5px;
      display:flex;
      flex-direction:column;
    }
    .poster{border-radius:4px}
    .mobile-meta{
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 4px;
      font-size:9px;
      line-height:1.2;
      font-weight:600;
      letter-spacing:.42em;
      color:#cba969;
      text-transform:uppercase;
    }
    .mobile-meta .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(243,196,85,.5),rgba(243,196,85,0))}
    .mobile-top{margin-bottom:11px}
    .mobile-bottom{margin-top:11px;font-size:8px;letter-spacing:.3em;color:#7e9a8b}
    .mobile-bottom .line{background:linear-gradient(90deg,rgba(126,154,139,0),rgba(126,154,139,.35))}
  }
  @media (prefers-reduced-motion:reduce){
    .confetti,.speed,.dust,.twinkle,.beam-sway,.beam-sway2{animation:none!important}
  }
</style>
</head>
