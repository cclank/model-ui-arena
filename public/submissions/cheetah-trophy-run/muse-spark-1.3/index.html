<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champions Cheetah Run - SVG Poster</title>
<style>
  html,body{margin:0;padding:0;background:#03061a}
  svg{display:block;width:100%;max-width:100vw;height:auto;margin:0 auto;background:transparent}
  text{user-select:none}
  .anim-bob{animation:cheetahBob 1.05s ease-in-out infinite}
  @keyframes cheetahBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .rain{transform-box:fill-box;transform-origin:center;animation:confettiFall linear infinite}
  @keyframes confettiFall{0%{transform:translateY(-160px) rotate(0deg)}100%{transform:translateY(1660px) rotate(720deg)}}
  .twk{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.08}50%{opacity:1}}
  .spin{transform-box:fill-box;transform-origin:center;animation:ballSpin 2.2s linear infinite}
  @keyframes ballSpin{to{transform:rotate(360deg)}}
  .pulse{animation:glowPulse 2.8s ease-in-out infinite}
  @keyframes glowPulse{0%,100%{opacity:.3}50%{opacity:1}}
  .sway{transform-box:view-box;transform-origin:50% 5%;animation:beamSway 9s ease-in-out infinite}
  @keyframes beamSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
  @media (prefers-reduced-motion: reduce){
    .anim-bob,.rain,.twk,.spin,.pulse,.sway{animation:none}
  }
</style>
</head>
