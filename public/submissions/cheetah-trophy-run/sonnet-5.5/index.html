<title>猎豹托举大力神杯冲刺</title>
<style>
html,body{margin:0;height:100%;background:#04051a}
body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a1466,#04051a 70%)}
#poster{display:block;width:100vw;height:100vh;overflow:visible}
.hero{animation:bob 1.15s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.beam{animation:beam 3.2s ease-in-out infinite}
@keyframes beam{50%{opacity:.62}}
.flash{animation:flash 2.4s ease-in-out infinite}
@keyframes flash{0%,100%{opacity:.1}50%{opacity:1}}
.speed{animation:speed .55s linear infinite}
@keyframes speed{from{transform:translateX(70px);opacity:.15}30%{opacity:1}to{transform:translateX(-30px);opacity:.1}}
.spin{animation:spin 1.3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.conf{animation:fall 9s linear infinite}.c1{animation-duration:12s;animation-delay:-4s}.c2{animation-duration:7s;animation-delay:-2s}
@keyframes fall{from{transform:translate(0,-140px)}to{transform:translate(-50px,1120px)}}
.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.25;transform:scale(.7)}}
.colon{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script>
// 竖屏时收窄取景框（保留猎豹、奖杯、比分牌与足球），横屏保持方形海报；背景层延伸到取景框之外，任何比例都是满幅画面。
(() => {
  const svg = document.getElementById('poster'), mq = matchMedia('(max-aspect-ratio: 9/10)');
  const fit = () => svg.setAttribute('viewBox', mq.matches ? '105 0 790 1000' : '0 0 1000 1000');
  fit(); mq.addEventListener('change', fit);
  // 轻量视差：指针移动时，背景层以不同幅度偏移（无指针设备不受影响）
  const L = [['#stands', 6], ['#floodlights', 9], ['#ribbons', -10]].map(([q, k]) => [document.querySelector(q), k]);
  addEventListener('pointermove', e => { const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5; L.forEach(([el, k]) => el && (el.style.transform = 'translate(' + x * k + 'px,' + y * k * .6 + 'px)')); });
})();
</script>
