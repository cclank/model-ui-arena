<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>补时 · 猎豹举杯</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#081018;color:#f6f1e4}
svg{width:min(560px,100%);height:auto;display:block;margin:0 auto}
.speed{animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-80}}
.confetti{animation:fall 3.6s linear infinite}
@keyframes fall{to{transform:translateY(40px)}}
.ball{animation:roll 1.4s linear infinite;transform-origin:250px 1088px;transform-box:view-box}
@keyframes roll{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

    <path d="M804 726 C818 758 834 776 828 794" fill="none" stroke="#1a120c" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="888" cy="746" rx="7" ry="5" fill="#1a120c"/>

  <animateTransform attributeName="transform" type="rotate" from="0 250 1088" to="360 250 1088" dur="1.4s" repeatCount="indefinite"/>
  <circle cx="250" cy="1088" r="26" fill="#f7f7f2" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M250 1066 l9 13 h-18z M234 1082 l7 14 12 -7z M266 1082 l-7 14 -12 -7z M242 1108 h16 l-8 9z" fill="#1a1a1a"/>

<g stroke="#d8ffe4" stroke-width="2" opacity=".7">
  <path d="M430 1080 l-30 8 M500 1060 l24 10 M450 1100 l-18 12"/>
</g>
</svg>
<script>
const g=document.getElementById("crowd"), ns="http://www.w3.org/2000/svg";
for(let row=0;row<3;row++){
  for(let i=0;i<28;i++){
    const c=document.createElementNS(ns,"circle");
    c.setAttribute("cx",58+i*28+(row%2?10:0));
    c.setAttribute("cy",478+row*30);
    c.setAttribute("r",6);
    c.setAttribute("fill",["#f2c14e","#e85d4c","#d7ecff","#f6f1e4"][(i+row)%4]);
    g.appendChild(c);
  }
}
</script>
</body>
</html>
