<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6fbfea; }
  .stage { position: fixed; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #scene { display: block; width: 100vw; height: 100vh; overflow: visible; flex: none; }
  /* Portrait phones: enlarge the scene and centre it so the rider stays large and uncropped. */
  @media (max-aspect-ratio: 4/5) {
    #scene { width: 210vw; height: auto; }
  }
  .caption { position: fixed; left: 16px; top: 14px; margin: 0; color: #ffffff; font: 600 15px/1.4 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif; text-shadow: 0 1px 4px rgba(20, 60, 90, 0.35); pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="一只鹈鹕骑着自行车沿海边公路前行">
  <defs>
    <linearGradient id="gSky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="332">
      <stop offset="0" stop-color="#5db3e4"/>
      <stop offset="0.55" stop-color="#a9dcf1"/>
      <stop offset="0.86" stop-color="#ffecc8"/>
      <stop offset="1" stop-color="#ffd9a2"/>
    </linearGradient>
    <radialGradient id="gGlow">
      <stop offset="0" stop-color="#fff9e0" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#ffefb8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gSea" gradientUnits="userSpaceOnUse" x1="0" y1="330" x2="0" y2="392">
      <stop offset="0" stop-color="#a6e6df"/>
      <stop offset="0.3" stop-color="#4dbccb"/>
      <stop offset="1" stop-color="#1f7ea6"/>
    </linearGradient>
    <linearGradient id="gRoad" gradientUnits="userSpaceOnUse" x1="0" y1="392" x2="0" y2="600">
      <stop offset="0" stop-color="#6d727c"/>
      <stop offset="1" stop-color="#3a3e47"/>
    </linearGradient>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f1f5f8"/>
      <stop offset="1" stop-color="#c9d5e0"/>
    </linearGradient>
    <linearGradient id="gWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe4ec"/>
    </linearGradient>
    <linearGradient id="gBill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f08a1c"/>
    </linearGradient>
    <linearGradient id="gPouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f6a23a"/>
    </linearGradient>

    <!-- Soft shadow that lifts the pelican off the sky and sea -->
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0d2a40" flood-opacity="0.25"/>
    </filter>

    <!-- Cloud shape, reused inside the cloud pattern -->
    <g id="cloudG">
      <path d="M-62,18 C-74,18 -76,2 -64,-2 C-66,-18 -46,-26 -36,-16 C-30,-34 -4,-36 4,-18 C14,-30 36,-26 38,-8 C52,-10 62,2 56,12 C56,20 50,22 44,22 L-54,22 C-58,22 -60,20 -62,18 Z" fill="#ffffff" fill-opacity="0.94"/>
      <path d="M-54,22 L44,22 C50,22 56,20 56,12 C40,8 -40,6 -60,14 C-60,18 -58,22 -54,22 Z" fill="#d9e8f5" fill-opacity="0.9"/>
    </g>

    <!-- Scenery tiles. Pattern content uses absolute coordinates (tile origin at 0,0), so each rect shows the same art
         and translating the rect by exactly one tile width loops seamlessly. -->
    <pattern id="pCloud" width="500" height="230" patternUnits="userSpaceOnUse" x="0" y="0">
      <use href="#cloudG" transform="translate(110 162) scale(0.9)"/>
      <use href="#cloudG" transform="translate(360 200) scale(1.1)"/>
    </pattern>
    <pattern id="pHills" width="1000" height="400" patternUnits="userSpaceOnUse" x="0" y="0">
      <path d="M0,338 C50,312 100,300 150,306 C200,312 230,286 290,284 C350,282 380,304 430,308 C490,312 520,292 580,294 C640,296 680,318 740,314 C800,310 830,286 880,290 C930,294 962,330 1000,338 L1000,400 L0,400 Z" fill="#b5cde3"/>
      <path d="M0,344 C60,326 120,322 190,330 C260,338 300,324 370,326 C440,328 480,340 540,334 C610,328 660,322 730,330 C800,338 850,326 920,330 C960,338 982,342 1000,344 L1000,400 L0,400 Z" fill="#8fb9c6" fill-opacity="0.8"/>
    </pattern>
    <pattern id="pWaves" width="200" height="400" patternUnits="userSpaceOnUse" x="0" y="0">
      <path d="M12,352 q6,-4 12,0 t12,0 M70,366 q7,-4 14,0 t14,0 M130,346 q5,-3 10,0 t10,0 M168,378 q6,-4 12,0 t12,0" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
    </pattern>
    <pattern id="pPalm" width="420" height="400" patternUnits="userSpaceOnUse" x="0" y="0">
      <g transform="translate(210 390)">
        <path d="M0,0 C4,-40 -4,-70 6,-108" fill="none" stroke="#7a5a40" stroke-width="7" stroke-linecap="round"/>
        <g transform="translate(6 -108)" fill="#2e7a58">
          <path d="M0,0 C-14,-18 -40,-20 -54,-6 C-34,-12 -16,-8 0,0 Z"/>
          <path d="M0,0 C16,-22 40,-24 56,-10 C38,-14 18,-10 0,0 Z"/>
          <path d="M0,0 C-12,4 -34,14 -50,12 C-32,8 -16,4 0,0 Z" fill="#245f46"/>
          <path d="M0,0 C12,6 32,16 48,14 C32,8 16,6 0,0 Z" fill="#245f46"/>
          <path d="M0,0 C2,-18 8,-36 22,-46 C14,-32 10,-16 0,0 Z"/>
        </g>
      </g>
    </pattern>
    <pattern id="pRail" width="120" height="400" patternUnits="userSpaceOnUse" x="0" y="0">
      <rect x="0" y="352" width="120" height="5" fill="#f2f5f8"/>
      <rect x="0" y="357" width="120" height="2" fill="#7f97ab" fill-opacity="0.6"/>
      <rect x="54" y="346" width="4" height="40" fill="#e4eaf0"/>
    </pattern>
    <pattern id="pDashN" width="160" height="560" patternUnits="userSpaceOnUse" x="0" y="0">
      <rect x="0" y="543" width="84" height="5" rx="2.5" fill="#f2eee2"/>
    </pattern>
    <pattern id="pDashF" width="160" height="460" patternUnits="userSpaceOnUse" x="0" y="0">
      <rect x="0" y="438" width="72" height="3" rx="1.5" fill="#e9e3cf" fill-opacity="0.7"/>
    </pattern>
    <pattern id="pSeam" width="150" height="530" patternUnits="userSpaceOnUse" x="0" y="0">
      <rect x="0" y="514" width="2" height="12" fill="#20242b" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Sky, sun -->
  <rect x="-1500" y="-1200" width="4000" height="1532" fill="url(#gSky)"/>
  <g>
    <circle cx="800" cy="120" r="120" fill="url(#gGlow)"/>
    <circle cx="800" cy="120" r="30" fill="#fff8dc"/>
  </g>

  <!-- Clouds (slow parallax) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="16.67s" repeatCount="indefinite"/>
    <rect x="-500" y="50" width="2000" height="170" fill="url(#pCloud)"/>
  </g>

  <!-- Distant hills, sea, sea shimmer -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-1000 0" dur="41.67s" repeatCount="indefinite"/>
    <rect x="-1000" y="280" width="3000" height="112" fill="url(#pHills)"/>
  </g>
  <rect x="-1500" y="330" width="4000" height="62" fill="url(#gSea)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-200 0" dur="3.33s" repeatCount="indefinite"/>
    <rect x="-200" y="338" width="1400" height="54" fill="url(#pWaves)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.55">
    <rect x="786" y="338" width="28" height="2" rx="1"/>
    <rect x="776" y="346" width="48" height="2" rx="1"/>
    <rect x="764" y="356" width="72" height="2.4" rx="1.2"/>
    <rect x="750" y="368" width="100" height="2.6" rx="1.3"/>
    <rect x="738" y="381" width="124" height="2.8" rx="1.4"/>
  </g>

  <!-- Lighthouse on the far point -->
  <g transform="translate(900 332)">
    <path d="M-6,0 L-4,-44 L4,-44 L6,0 Z" fill="#fbfbfb"/>
    <rect x="-5" y="-22" width="10" height="5" fill="#e4572e"/>
    <rect x="-5" y="-40" width="10" height="5" fill="#e4572e"/>
    <rect x="-6" y="-48" width="12" height="4" rx="1" fill="#5c6b7a"/>
    <rect x="-4" y="-56" width="8" height="8" fill="#fff3b0"/>
    <circle cx="0" cy="-52" r="18" fill="#fff3b0" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Palms, sand, guard rail, road -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-420 0" dur="4.42s" repeatCount="indefinite"/>
    <rect x="-420" y="220" width="1840" height="172" fill="url(#pPalm)"/>
  </g>
  <rect x="-1500" y="384" width="4000" height="8" fill="#efdcae"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-120 0" dur="1.33s" repeatCount="indefinite"/>
    <rect x="-120" y="342" width="1360" height="50" fill="url(#pRail)"/>
  </g>
  <rect x="-1500" y="392" width="4000" height="1600" fill="url(#gRoad)"/>
  <rect x="-1500" y="392" width="4000" height="2" fill="#f6f2e8" fill-opacity="0.8"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-160 0" dur="0.92s" repeatCount="indefinite"/>
    <rect x="-160" y="436" width="1400" height="8" fill="url(#pDashF)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-160 0" dur="0.465s" repeatCount="indefinite"/>
    <rect x="-160" y="540" width="1400" height="14" fill="url(#pDashN)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-150 0" dur="0.5s" repeatCount="indefinite"/>
    <rect x="-150" y="510" width="1400" height="20" fill="url(#pSeam)"/>
  </g>

  <!-- Gulls passing over the sea -->
  <g>
    <animateMotion dur="20s" repeatCount="indefinite" path="M1100,120 L-100,96"/>
    <path fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite" values="M-12,-2 Q-6,-10 0,0 Q6,-10 12,-2;M-12,-8 Q-6,-2 0,0 Q6,-2 12,-8;M-12,-2 Q-6,-10 0,0 Q6,-10 12,-2"/>
    </path>
  </g>
  <g>
    <animateMotion dur="26s" begin="-9s" repeatCount="indefinite" path="M1100,160 L-100,140"/>
    <path fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="0.75s" repeatCount="indefinite" values="M-10,-2 Q-5,-8 0,0 Q5,-8 10,-2;M-10,-7 Q-5,-2 0,0 Q5,-2 10,-7;M-10,-2 Q-5,-8 0,0 Q5,-8 10,-2"/>
    </path>
  </g>

  <!-- Bicycle shadow on the road: shrinks slightly when the rig bounces -->
  <g transform="translate(490 522)">
    <ellipse rx="180" ry="9" fill="#14202b" fill-opacity="0.28">
      <animateTransform attributeName="transform" type="scale" values="1 1;0.93 0.9;1 1" dur="0.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Rider and bicycle rig: road bumps bounce the whole rig together, so feet stay on the pedals -->
  <g id="rig">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.4;0 0.3;0 0" keyTimes="0;0.2;0.55;1" dur="0.5s" repeatCount="indefinite"/>

    <!-- Far leg, crank and pedal (behind the frame): same keyframes, started half a cycle later -->
    <path fill="none" stroke="#c4cdd7" stroke-width="13" stroke-linecap="round" d="M424,336 L476.0,365.9">
      <animate attributeName="d" dur="0.8s" begin="-0.4s" repeatCount="indefinite" values="M424,336 L482.2,350.4;M424,336 L479.3,359.4;M424,336 L474.9,367.7;M424,336 L469.9,374.7;M424,336 L464.9,379.9;M424,336 L461.4,382.9;M424,336 L459.9,384.0;M424,336 L460.5,383.6;M424,336 L462.4,382.1;M424,336 L465.2,379.6;M424,336 L468.5,376.2;M424,336 L472.2,371.7;M424,336 L476.0,365.9;M424,336 L479.5,358.8;M424,336 L482.3,350.1;M424,336 L483.8,340.5;M424,336 L483.8,331.1;M424,336 L482.7,323.6;M424,336 L481.6,319.2;M424,336 L481.4,318.4;M424,336 L482.1,320.9;M424,336 L483.2,326.0;M424,336 L483.9,333.0;M424,336 L483.8,341.4;M424,336 L482.2,350.4"/>
    </path>
    <path fill="none" stroke="#d26a28" stroke-width="4.5" stroke-linecap="round" d="M476.0,365.9 L423.0,446.0">
      <animate attributeName="d" dur="0.8s" begin="-0.4s" repeatCount="indefinite" values="M482.2,350.4 L491.0,446.0;M479.3,359.4 L489.8,454.8;M474.9,367.7 L486.4,463.0;M469.9,374.7 L481.0,470.0;M464.9,379.9 L474.0,475.4;M461.4,382.9 L465.8,478.8;M459.9,384.0 L457.0,480.0;M460.5,383.6 L448.2,478.8;M462.4,382.1 L440.0,475.4;M465.2,379.6 L433.0,470.0;M468.5,376.2 L427.6,463.0;M472.2,371.7 L424.2,454.8;M476.0,365.9 L423.0,446.0;M479.5,358.8 L424.2,437.2;M482.3,350.1 L427.6,429.0;M483.8,340.5 L433.0,422.0;M483.8,331.1 L440.0,416.6;M482.7,323.6 L448.2,413.2;M481.6,319.2 L457.0,412.0;M481.4,318.4 L465.8,413.2;M482.1,320.9 L474.0,416.6;M483.2,326.0 L481.0,422.0;M483.9,333.0 L486.4,429.0;M483.8,341.4 L489.8,437.2;M482.2,350.4 L491.0,446.0"/>
    </path>
    <g transform="translate(462 458)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
        <path d="M0,0 L34,0" stroke="#3f444c" stroke-width="6" stroke-linecap="round"/>
        <g transform="translate(34 0)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
            <rect x="-11" y="-2" width="22" height="6" rx="2" fill="#2b2e33"/>
            <path d="M-6,-14 C-9,-12 -10,-6 -8,-2 L0,-1 C6,-1 12,-1 17,-1 Q20,-1 19,-4 C17,-6 14,-7 12,-7 C9,-9 5,-9 2,-10 C-1,-11 -4,-12 -6,-14 Z" fill="#d26a28"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Rear wheel: tyre, tread, rim, lacing spokes, valve, cog -->
    <g id="rear-wheel" transform="translate(380 450)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="1.4667s" repeatCount="indefinite"/>
        <circle r="66" fill="none" stroke="#25282e" stroke-width="8"/>
        <circle r="66" fill="none" stroke="#50555e" stroke-width="2.2" stroke-dasharray="4 7"/>
        <circle r="60" fill="none" stroke="#c9d1d9" stroke-width="2.4"/>
        <path d="M6.00,0.00L53.44,23.79M5.54,2.30L40.27,42.43M4.24,4.24L20.96,54.61M2.30,5.54L-1.53,58.48M0.00,6.00L-23.79,53.44M-2.30,5.54L-42.43,40.27M-4.24,4.24L-54.61,20.96M-5.54,2.30L-58.48,-1.53M-6.00,0.00L-53.44,-23.79M-5.54,-2.30L-40.27,-42.43M-4.24,-4.24L-20.96,-54.61M-2.30,-5.54L1.53,-58.48M-0.00,-6.00L23.79,-53.44M2.30,-5.54L42.43,-40.27M4.24,-4.24L54.61,-20.96M5.54,-2.30L58.48,1.53" fill="none" stroke="#e7ecf1" stroke-width="0.8"/>
        <rect x="-1.6" y="-66.5" width="3.2" height="8" fill="#d7dde3"/>
        <circle r="10" fill="#3d434b"/>
        <circle r="10" fill="none" stroke="#aab4be" stroke-width="2.4" stroke-dasharray="2 2"/>
        <circle r="6" fill="#aab3bd"/>
        <circle r="2.4" fill="#3c424a"/>
      </g>
    </g>

    <!-- Front wheel -->
    <g id="front-wheel" transform="translate(600 450)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="1.4667s" repeatCount="indefinite"/>
        <circle r="66" fill="none" stroke="#25282e" stroke-width="8"/>
        <circle r="66" fill="none" stroke="#50555e" stroke-width="2.2" stroke-dasharray="4 7"/>
        <circle r="60" fill="none" stroke="#c9d1d9" stroke-width="2.4"/>
        <path d="M6.00,0.00L53.44,23.79M5.54,2.30L40.27,42.43M4.24,4.24L20.96,54.61M2.30,5.54L-1.53,58.48M0.00,6.00L-23.79,53.44M-2.30,5.54L-42.43,40.27M-4.24,4.24L-54.61,20.96M-5.54,2.30L-58.48,-1.53M-6.00,0.00L-53.44,-23.79M-5.54,-2.30L-40.27,-42.43M-4.24,-4.24L-20.96,-54.61M-2.30,-5.54L1.53,-58.48M-0.00,-6.00L23.79,-53.44M2.30,-5.54L42.43,-40.27M4.24,-4.24L54.61,-20.96M5.54,-2.30L58.48,1.53" fill="none" stroke="#e7ecf1" stroke-width="0.8"/>
        <rect x="-1.6" y="-66.5" width="3.2" height="8" fill="#d7dde3"/>
        <circle r="6" fill="#aab3bd"/>
        <circle r="2.4" fill="#3c424a"/>
      </g>
    </g>

    <!-- Chain -->
    <path d="M462,435.5 L380,439 M462,480.5 L380,461" fill="none" stroke="#3a3f47" stroke-width="2.8" stroke-dasharray="3.2 1.6"/>

    <!-- Frame, fork, stem and bars -->
    <g id="frame" fill="none" stroke-linecap="round">
      <path d="M380,450 L462,458" stroke="#c8402a" stroke-width="6"/>
      <path d="M380,450 L434,372" stroke="#e4553a" stroke-width="4.5"/>
      <path d="M462,458 L432,358" stroke="#e4553a" stroke-width="7.5"/>
      <path d="M432,358 L584,344" stroke="#e4553a" stroke-width="7"/>
      <path d="M462,458 L590,392" stroke="#e4553a" stroke-width="8.5"/>
      <path d="M584,344 L590,392" stroke="#e4553a" stroke-width="8.5"/>
      <path d="M590,392 L600,450" stroke="#c6ced6" stroke-width="5"/>
      <path d="M584,344 L586,322" stroke="#3b3f46" stroke-width="6"/>
      <path d="M586,322 C594,304 612,298 634,300" stroke="#2e3137" stroke-width="4.5"/>
      <path d="M628,299 L642,306" stroke="#1f2226" stroke-width="9"/>
      <path d="M433,360 L431,350" stroke="#b9c3cd" stroke-width="5"/>
    </g>
    <path d="M390,354 C398,346 438,342 462,346 C468,350 466,358 456,360 C434,364 404,364 394,362 C390,360 388,357 390,354 Z" fill="#24262b"/>

    <!-- Near leg: feathered thigh (hidden under the belly at most angles), orange shank -->
    <path fill="none" stroke="#dfe7ee" stroke-width="12" stroke-linecap="round" d="M424,336 L482.2,350.4">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite" values="M424,336 L482.2,350.4;M424,336 L479.3,359.4;M424,336 L474.9,367.7;M424,336 L469.9,374.7;M424,336 L464.9,379.9;M424,336 L461.4,382.9;M424,336 L459.9,384.0;M424,336 L460.5,383.6;M424,336 L462.4,382.1;M424,336 L465.2,379.6;M424,336 L468.5,376.2;M424,336 L472.2,371.7;M424,336 L476.0,365.9;M424,336 L479.5,358.8;M424,336 L482.3,350.1;M424,336 L483.8,340.5;M424,336 L483.8,331.1;M424,336 L482.7,323.6;M424,336 L481.6,319.2;M424,336 L481.4,318.4;M424,336 L482.1,320.9;M424,336 L483.2,326.0;M424,336 L483.9,333.0;M424,336 L483.8,341.4;M424,336 L482.2,350.4"/>
    </path>
    <path fill="none" stroke="#f08a2c" stroke-width="5" stroke-linecap="round" d="M482.2,350.4 L491,446">
