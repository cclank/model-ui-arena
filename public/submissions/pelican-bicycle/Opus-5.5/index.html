<title>Opus-5.5 · 鹈鹕骑车</title>
<!-- 设计说明：
1. 黄昏的海滨公路：一只白鹈鹕骑着蒂芙尼绿的小自行车，喉囊里兜着一条鱼、尾巴还露在嘴边；天空、海面、岛影、棕榈与路灯、护栏、路面、近景草丛分六层以不同速度循环后退。
2. 机械全部同步：曲柄 2 s 一圈、齿比 1.6，车轮 1.25 s 一圈，路面线速度 = 车轮周长 / 周期，链条虚线按链长整数周期滚动，踏板反向自转保持水平。
3. 双腿用离线两段式 IK 求解 36 个曲柄角（含身体随踏频的起伏），生成大腿绕髋、跗蹠绕膝、蹼足绕踝的 CSS 关键帧，脚始终踩在踏板上；头颈、喉囊、尾羽有跟随的次级动作，影子随起伏伸缩。
4. 只用 SVG + CSS 动画；JavaScript 只负责切换车速（统一改 playbackRate）和昼夜配色。 -->

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset=".62" style="stop-color:var(--sky2)"/><stop offset="1" style="stop-color:var(--sky3)"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sea2)"/><stop offset="1" style="stop-color:var(--sea1)"/></linearGradient>

  <linearGradient id="sand" x1="0" y1="788" x2="0" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:var(--sand1)"/><stop offset="1" style="stop-color:var(--sand2)"/></linearGradient>
  <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6d8"/><stop offset=".25" stop-color="#ffe2a0" stop-opacity=".8"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/></radialGradient>
  <radialGradient id="moonGlow"><stop offset="0" stop-color="#f4f2e6"/><stop offset=".3" stop-color="#c8d2ff" stop-opacity=".45"/><stop offset="1" stop-color="#8090d0" stop-opacity="0"/></radialGradient>

<div class="ui" role="group" aria-label="控制">
  <button data-rate=".6">慢</button><button data-rate="1" class="on">中</button><button data-rate="1.6">快</button>
  <button id="dn">切换昼夜</button>
</div>
<script>
// 仅做增强：统一调整所有 CSS 动画的播放速率（保持机械同步），以及切换昼夜配色
const btns = document.querySelectorAll("[data-rate]");
btns.forEach((b) => b.addEventListener("click", () => {
  const r = +b.dataset.rate;
  document.getAnimations().forEach((a) => (a.playbackRate = r));
  btns.forEach((x) => x.classList.toggle("on", x === b));
}));
document.getElementById("dn").addEventListener("click", () => document.documentElement.classList.toggle("night"));
</script>
