<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pelican Bicycle — SVG Motion Study</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:#0a1c2e; overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .stage{ position:fixed; inset:0; }
  svg#scene{ display:block; width:100%; height:100%; }

  #scene .far-tone{ filter:brightness(.70) saturate(.85); }

  #scene.night #day-scene{ filter:brightness(.40) saturate(.60) hue-rotate(200deg); }
  #night-layer{ opacity:0; transition:opacity .8s ease; }
  #scene.night #night-layer{ opacity:1; }
  #sun-disc{ transition:opacity .8s ease; }
  #scene.night #sun-disc{ opacity:0; }

  .hud{ position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px;
    justify-content:center; align-items:center; padding:12px; pointer-events:none; }
  .btn{ pointer-events:auto; cursor:pointer; border:0; border-radius:999px;
    padding:9px 18px; font-size:13px; font-weight:700; letter-spacing:.10em;
    color:#eef8ff; background:rgba(8,30,46,.52); box-shadow:0 2px 12px rgba(0,0,0,.35);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .btn:hover{ background:rgba(16,56,80,.72); }
  .btn:active{ transform:translateY(1px); }
  .title{ position:fixed; left:14px; top:12px; color:rgba(238,248,255,.80);
    font-size:12px; letter-spacing:.18em; pointer-events:none; text-transform:uppercase; }
  .title b{ display:block; font-size:15px; letter-spacing:.06em; color:rgba(238,248,255,.95); }
  @keyframes hudPulse{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }
  .title b{ animation:hudPulse 4.5s ease-in-out infinite; }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="A pelican riding a bicycle along a seaside road">

  <defs>
    <!-- ============ gradients ============ -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1f7fb8"/>
      <stop offset="0.42" stop-color="#68b9de"/>
      <stop offset="0.78" stop-color="#b9e2ee"/>
      <stop offset="1"    stop-color="#ffe2b4"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#15597f"/>
      <stop offset="0.5" stop-color="#2d87ab"/>
      <stop offset="1"   stop-color="#67bccb"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#8b8478"/>
      <stop offset="0.16" stop-color="#767064"/>
      <stop offset="0.62" stop-color="#5d584f"/>
      <stop offset="1"    stop-color="#413d38"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d2"/>
      <stop offset="1" stop-color="#ffd489"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfbf2"/>
      <stop offset="1" stop-color="#cdd6e2"/>
    </linearGradient>
    <linearGradient id="tyreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#4a4a50"/>
      <stop offset="0.4" stop-color="#23242a"/>
      <stop offset="1"   stop-color="#101116"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#7e8792"/>
      <stop offset="0.35" stop-color="#d7dde4"/>
      <stop offset="0.62" stop-color="#9aa3ad"/>
      <stop offset="1"   stop-color="#5f666f"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0"   stop-color="#2f9aa0"/>
      <stop offset="0.5" stop-color="#14686f"/>
      <stop offset="1"   stop-color="#0b3d45"/>
    </linearGradient>
    <linearGradient id="saddleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#4b3a2c"/>
      <stop offset="1"   stop-color="#241a13"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0"   stop-color="#fffdf6"/>
      <stop offset="0.55" stop-color="#f4ecdb"/>
      <stop offset="1"   stop-color="#d8cdb6"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"   stop-color="#f7f1e2"/>
      <stop offset="0.6" stop-color="#ded4be"/>
      <stop offset="1"   stop-color="#b9ac93"/>
    </linearGradient>
    <linearGradient id="darkFeatherGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0"   stop-color="#4a4a54"/>
      <stop offset="0.5" stop-color="#26262e"/>
      <stop offset="1"   stop-color="#101017"/>
    </linearGradient>
    <linearGradient id="beakUpperGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0"   stop-color="#f6e3ab"/>
      <stop offset="0.55" stop-color="#e2bd76"/>
      <stop offset="1"   stop-color="#b08b4c"/>
    </linearGradient>
    <linearGradient id="beakLowerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c88a"/>
      <stop offset="1" stop-color="#9d7a45"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0"   stop-color="#ffe6b8"/>
      <stop offset="0.55" stop-color="#f0c184"/>
      <stop offset="1"   stop-color="#cf9455"/>
    </linearGradient>
    <linearGradient id="fishGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#dff1f7"/>
      <stop offset="0.5" stop-color="#93b8c9"/>
      <stop offset="1"   stop-color="#5b7f92"/>
    </linearGradient>
    <linearGradient id="shinGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#e0aa84"/>
      <stop offset="0.5" stop-color="#cf9570"/>
      <stop offset="1"   stop-color="#a9704f"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d3e6f2"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa9b4"/>
      <stop offset="1" stop-color="#a9c6c9"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7a3c"/>
      <stop offset="1" stop-color="#33461f"/>
    </linearGradient>

    <!-- ============ filters ============ -->
    <filter id="blurSoft" x="-45%" y="-140%" width="190%" height="380%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurCloud" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="blurFar" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <!-- ============ clip paths ============ -->
    <clipPath id="pouchClip">
      <path d="M 668 242 C 706 250 756 252 792 250 C 784 286 754 318 718 318 C 688 317 670 292 668 242 Z"/>
    </clipPath>
    <clipPath id="seaClip">
      <rect x="-400" y="392" width="2000" height="80"/>
    </clipPath>

    <!-- ============ wheel (drawn once, centred on 0,0) ============ -->
    <g id="wheelFace">
      <circle r="103.5" fill="none" stroke="url(#tyreGrad)" stroke-width="13"/>
      <circle r="110"  fill="none" stroke="#15161b" stroke-width="2" opacity=".55"/>
      <circle r="95"   fill="none" stroke="url(#metalGrad)" stroke-width="7"/>
      <circle r="89"   fill="none" stroke="#8e979f" stroke-width="2" opacity=".8"/>
      <g stroke="#b9c2cb" stroke-width="1.7" opacity=".95">
        <line x1="0" y1="0" x2="100" y2="0"/>
        <line x1="0" y1="0" x2="92.39" y2="38.27"/>
        <line x1="0" y1="0" x2="70.71" y2="70.71"/>
        <line x1="0" y1="0" x2="38.27" y2="92.39"/>
        <line x1="0" y1="0" x2="0" y2="100"/>
        <line x1="0" y1="0" x2="-38.27" y2="92.39"/>
        <line x1="0" y1="0" x2="-70.71" y2="70.71"/>
        <line x1="0" y1="0" x2="-92.39" y2="38.27"/>
        <line x1="0" y1="0" x2="-100" y2="0"/>
        <line x1="0" y1="0" x2="-92.39" y2="-38.27"/>
        <line x1="0" y1="0" x2="-70.71" y2="-70.71"/>
        <line x1="0" y1="0" x2="-38.27" y2="-92.39"/>
        <line x1="0" y1="0" x2="0" y2="-100"/>
        <line x1="0" y1="0" x2="38.27" y2="-92.39"/>
        <line x1="0" y1="0" x2="70.71" y2="-70.71"/>
        <line x1="0" y1="0" x2="92.39" y2="-38.27"/>
      </g>
      <g stroke="#7f8790" stroke-width="1.1" opacity=".65">
        <line x1="-7" y1="-5" x2="-96" y2="-26"/>
        <line x1="-7" y1="-5" x2="-62" y2="-70"/>
        <line x1="-7" y1="-5" x2="0" y2="-99"/>
        <line x1="-7" y1="-5" x2="62" y2="-70"/>
        <line x1="-7" y1="-5" x2="96" y2="-26"/>
        <line x1="-7" y1="-5" x2="96" y2="26"/>
        <line x1="-7" y1="-5" x2="62" y2="70"/>
        <line x1="-7" y1="-5" x2="0" y2="99"/>
      </g>
      <circle r="12" fill="url(#metalGrad)" stroke="#59616a" stroke-width="1.5"/>
      <circle r="4.5" fill="#3d444c"/>
      <line x1="0" y1="-12" x2="0" y2="-22" stroke="#c8a24a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-88" r="6.5" fill="#ff7a3c" stroke="#c9521f" stroke-width="1.5"/>
    </g>

    <!-- ============ pedal + webbed foot (pedal centre at 0,0) ============ -->
    <g id="pedalFoot">
      <rect x="-2.5" y="-8" width="5" height="11" rx="1.5" fill="#8d949c"/>
      <rect x="-16" y="2" width="38" height="10" rx="3" fill="url(#metalGrad)" stroke="#5c636c" stroke-width="1"/>
      <rect x="-14" y="3.5" width="34" height="3" rx="1.5" fill="#e7ecf1" opacity=".8"/>
      <path d="M -6 -4 C -6 -10 0 -18 8 -18 C 15 -18 17 -12 16 -6
               C 24 -9 33 -10 41 -8 C 46 -7 47 -2 42 0
               C 38 2 30 2 22 1 L 6 2 C -1 2 -6 0 -6 -4 Z"
            fill="#d79c78" stroke="#a66b4c" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 16 -6 C 22 -3 27 0 31 2" fill="none" stroke="#a9704f" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 16 -6 C 25 -4 33 -1 41 1" fill="none" stroke="#a9704f" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 10 -14 C 14 -12 16 -9 16 -6" fill="none" stroke="#a9704f" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 34 -9 C 39 -8 43 -5 43 -1" fill="none" stroke="#efc4a2" stroke-width="2" stroke-linecap="round"/>
      <circle cx="24" cy="-6" r="1.8" fill="#8d5637" opacity=".55"/>
    </g>

    <!-- ============ scenery symbols ============ -->
    <g id="cloudPuff">
      <path d="M 0 0 C -14 -14 -40 -10 -42 4 C -58 6 -60 24 -42 28
               C -34 42 -6 42 2 32 C 16 40 40 34 40 18 C 56 14 54 -4 38 -6
               C 30 -18 10 -18 0 0 Z" fill="url(#cloudGrad)" opacity=".92"/>
    </g>

    <g id="gullBody">
      <ellipse cx="0" cy="0" rx="9" ry="4" fill="#fbfdff"/>
      <path d="M -8 0 C -16 -3 -22 -2 -26 1 C -20 4 -14 4 -8 2 Z" fill="#eef4f8"/>
      <g id="gull-wing-l">
        <path d="M 0 0 C -10 -10 -24 -13 -32 -8 C -22 -2 -12 3 0 3 Z" fill="#ffffff"/>
        <animateTransform attributeName="transform" type="rotate"
          values="-4;-26;-4" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>
      </g>
      <g id="gull-wing-r">
        <path d="M 0 0 C 10 -10 24 -13 32 -8 C 22 -2 12 3 0 3 Z" fill="#f2f7fa"/>
        <animateTransform attributeName="transform" type="rotate"
          values="-4;-26;-4" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>
      </g>
    </g>

    <g id="cypressTree">
      <path d="M 0 0 C -9 -10 -12 -30 -7 -48 C -4 -60 -3 -70 0 -78
               C 3 -70 4 -60 7 -48 C 12 -30 9 -10 0 0 Z" fill="#3f6647"/>
      <path d="M 0 -6 C -6 -16 -8 -32 -4 -50 C -2 -62 -1 -70 1 -76
               C 2 -64 3 -50 5 -36 C 7 -22 5 -10 0 -6 Z" fill="#4e7c55" opacity=".85"/>
    </g>

    <g id="palmTree">
      <path d="M 0 0 C 2 -22 -2 -42 -6 -58 L 3 -58 C 6 -40 7 -20 5 0 Z" fill="#6b563a"/>
      <path d="M -2 -58 C -18 -70 -36 -68 -44 -58 C -32 -58 -18 -54 -4 -52 Z" fill="#3f7a4c"/>
      <path d="M 4 -58 C 20 -72 38 -72 46 -62 C 34 -61 18 -56 5 -53 Z" fill="#356b42"/>
      <path d="M 0 -58 C -10 -76 -6 -92 2 -100 C 6 -88 8 -70 4 -57 Z" fill="#4a8a55"/>
    </g>

    <g id="guardPost">
      <rect x="-5" y="-46" width="10" height="48" rx="2" fill="#cfd6da" stroke="#8d979e" stroke-width="1"/>
      <rect x="-5" y="-46" width="4" height="48" fill="#eef3f6" opacity=".7"/>
      <circle cx="0" cy="-42" r="1.8" fill="#8d979e"/>
    </g>

    <g id="bush">
      <ellipse cx="0" cy="0" rx="22" ry="13" fill="#3f6b3c"/>
      <ellipse cx="-13" cy="-3" rx="12" ry="9" fill="#4b7c45"/>
      <ellipse cx="12" cy="-4" rx="13" ry="10" fill="#456f3f"/>
      <ellipse cx="0" cy="-8" rx="9" ry="7" fill="#588a4e" opacity=".9"/>
      <circle cx="-6" cy="-2" r="1.6" fill="#d9c14a"/>
      <circle cx="5" cy="-4" r="1.6" fill="#d9c14a"/>
    </g>

    <g id="grassTuft">
      <path d="M 0 0 C -3 -14 -8 -24 -14 -30 C -8 -22 -6 -10 -5 0 Z" fill="url(#grassGrad)"/>
      <path d="M 0 0 C 0 -18 1 -30 3 -38 C 5 -26 5 -12 4 0 Z" fill="#4a6a2c"/>
      <path d="M 0 0 C 4 -14 10 -24 17 -29 C 10 -20 7 -9 6 0 Z" fill="#3d5a24"/>
      <path d="M -2 0 C -8 -10 -14 -16 -20 -19 C -12 -14 -7 -6 -5 1 Z" fill="#567a33"/>
    </g>

    <g id="roadPebble">
      <ellipse cx="0" cy="0" rx="7" ry="3" fill="#7b7469" opacity=".7"/>
    </g>

    <g id="island">
      <path d="M 0 0 C 22 -30 54 -40 84 -34 C 108 -29 128 -14 150 0 Z" fill="url(#hillGrad)"/>
      <path d="M 30 -6 C 48 -22 66 -28 84 -26 C 96 -24 106 -18 116 -10 Z" fill="#8fb6bd" opacity=".8"/>
    </g>

    <g id="sailboat">
      <path d="M 0 0 L -3 -30 L -30 -2 Z" fill="#fdfcf6" stroke="#8ea3ad" stroke-width="1"/>
      <path d="M 1 0 L 1 -22 L 22 -2 Z" fill="#eae3d2" stroke="#8ea3ad" stroke-width="1"/>
      <path d="M -34 2 C -20 6 6 6 24 2 L 20 8 L -28 8 Z" fill="#5b6b74"/>
    </g>

    <g id="crabBody">
      <ellipse cx="0" cy="0" rx="17" ry="10" fill="#e0683f"/>
      <ellipse cx="0" cy="-3" rx="13" ry="6" fill="#f08a5c"/>
      <g stroke="#c8542f" stroke-width="2.4" stroke-linecap="round">
        <path d="M -14 2 L -26 6 L -30 1"/><path d="M -14 5 L -25 12 L -29 8"/>
        <path d="M 14 2 L 26 6 L 30 1"/><path d="M 14 5 L 25 12 L 29 8"/>
        <path d="M -8 8 L -12 15"/><path d="M 0 9 L 0 16"/><path d="M 8 8 L 12 15"/>
      </g>
      <g stroke="#e0683f" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M -8 -7 L -10 -14"/><path d="M 8 -7 L 10 -14"/>
      </g>
      <circle cx="-10" cy="-15" r="2.6" fill="#20262c"/>
      <circle cx="10" cy="-15" r="2.6" fill="#20262c"/>
      <g id="crabClawL">
        <path d="M -22 -6 C -30 -12 -34 -6 -30 -1 C -34 4 -28 8 -22 3 Z" fill="#e0683f"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0;-14;0" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <g id="crabClawR">
        <path d="M 22 -6 C 30 -12 34 -6 30 -1 C 34 4 28 8 22 3 Z" fill="#e0683f"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0;14;0" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>
      </g>
    </g>
  </defs>

  <g id="day-scene">

    <!-- ================= SKY ================= -->
    <g id="layer-sky">
      <rect x="-400" y="-820" width="2000" height="1280" fill="url(#skyGrad)"/>
    </g>

    <g id="layer-sun" filter="url(#blurGlow)">
      <circle id="sun-glow" cx="252" cy="128" r="120" fill="#ffe6a8" opacity=".55"/>
    </g>
    <g id="sun-disc">
      <circle cx="252" cy="128" r="52" fill="url(#sunGrad)"/>
      <circle cx="252" cy="128" r="52" fill="none" stroke="#fff4cf" stroke-width="2" opacity=".8"/>
    </g>

    <!-- ================= CLOUDS (parallax 1) ================= -->
    <g id="layer-clouds" filter="url(#blurCloud)">
      <g id="cloud-scroll">
        <animateTransform attributeName="transform" type="translate"
          from="0 0" to="-960 0" dur="12s" repeatCount="indefinite"/>
        <g id="cloud-train">
          <use href="#cloudPuff" xlink:href="#cloudPuff" x="-960" y="96"  transform="translate(0,-14)"/>
          <use href="#cloudPuff" xlink:href="#cloudPuff" x="-480" y="150"/>
          <use href="#cloudPuff" xlink:href="#cloudPuff" x="0"    y="84"  transform="translate(0,-10)"/>
          <use href="#cloudPuff" xlink:href="#cloudPuff" x="480"  y="170" transform="translate(0,12)"/>
          <use href="#cloudPuff" xlink:href="#cloudPuff" x="960"  y="100"/>
          <use href="#cloudPuff" xlink:href="#cloudPuff" x="1440" y="150" transform="translate(0,-8)"/>
          <use href="#cloudPuff" xlink:href="#cloudPuff" x="1920" y="92"/>
        </g>
        <use href="#cloud-train" xlink:href="#cloud-train" x="960"/>
      </g>
    </g>

    <g id="layer-gulls">
      <g opacity="0.9">
        <use href="#gullBody" xlink:href="#gullBody" x="330" y="212"/>
      </g>
      <g opacity="0.8" transform="translate(690,168) scale(0.8)">
        <use href="#gullBody" xlink:href="#gullBody"/>
      </g>
      <g opacity="0.65" transform="translate(905,232) scale(0.62)">
        <use href="#gullBody" xlink:href="#gullBody"/>
      </g>
    </g>

    <!-- ================= DISTANT ISLANDS (parallax 2) ================= -->
    <g id="layer-islands" filter="url(#blurFar)" opacity="0.9">
      <g id="island-scroll">
        <animateTransform attributeName="transform" type="translate"
          from="0 0" to="-690 0" dur="18s" repeatCount="indefinite"/>
        <use href="#island" xlink:href="#island" x="-690" y="398" transform="scale(0.9)"/>
        <use href="#island" xlink:href="#island" x="-345" y="398" transform="scale(0.55)"/>
        <use href="#island" xlink:href="#island" x="345"  y="398" transform="scale(0.72)"/>
        <use href="#island" xlink:href="#island" x="690"  y="398" transform="scale(0.42)"/>
        <use href="#island" xlink:href="#island" x="1380" y="398" transform="scale(0.9)"/>
        <use href="#island" xlink:href="#island" x="2070" y="398" transform="scale(0.55)"/>
        <use href="#island" xlink:href="#island" x="2415" y="398" transform="scale(0.72)"/>
        <use href="#island" xlink:href="#island" x="2760" y="398" transform="scale(0.42)"/>
      </g>
    </g>

    <!-- ================= SEA (parallax 3) ================= -->
    <g id="layer-sea">
      <rect x="-400" y="392" width="2000" height="80" fill="url(#seaGrad)"/>
      <g clip-path="url(#seaClip)" stroke="#cdeef6" fill="none" stroke-linecap="round">
        <path d="M -400 404 H 1600" stroke-width="2.5" opacity=".45" stroke-dasharray="60 90">
          <animate attributeName="stroke-dashoffset" from="0" to="-600" dur="12s" repeatCount="indefinite"/>
        </path>
        <path d="M -400 420 H 1600" stroke-width="3" opacity=".38" stroke-dasharray="40 70">
          <animate attributeName="stroke-dashoffset" from="0" to="-440" dur="12s" repeatCount="indefinite"/>
        </path>
        <path d="M -400 440 H 1600" stroke-width="3.5" opacity=".30" stroke-dasharray="80 100">
          <animate attributeName="stroke-dashoffset" from="0" to="-720" dur="12s" repeatCount="indefinite"/>
        </path>
        <path d="M -400 458 H 1600" stroke-width="4" opacity=".22" stroke-dasharray="120 150">
          <animate attributeName="stroke-dashoffset" from="0" to="-1080" dur="12s" repeatCount="indefinite"/>

<div class="title"><b>PELICAN ON A BICYCLE</b>seaside road · svg motion study</div>

<div class="hud">
  <button class="btn" id="btn-speed" type="button">SPEED 1.0x</button>
  <button class="btn" id="btn-daynight" type="button">DAY / NIGHT</button>
</div>

<script>
(function(){
  var svg = document.getElementById('scene');
  if(!svg || !svg.querySelectorAll) return;

  var SUB = { x:230, y:150, w:640, h:520 };

  function frame(){
    var w = window.innerWidth, h = window.innerHeight;
    var ar = w / Math.max(h,1);
    var vw = SUB.w, vh = SUB.h;
    if(ar > vw/vh){ vw = vh * ar; } else { vh = vw / ar; }
    svg.setAttribute('viewBox',
      (SUB.x + (SUB.w - vw)/2).toFixed(1) + ' ' +
      (SUB.y + (SUB.h - vh)/2).toFixed(1) + ' ' +
      vw.toFixed(1) + ' ' + vh.toFixed(1));
  }
  frame();
  window.addEventListener('resize', frame, { passive:true });

  var speeds = [0.55, 1, 1.7];
  var si = 1;
  var anims = svg.querySelectorAll('animate, animateTransform, animateMotion');
  Array.prototype.forEach.call(anims, function(a){
    var d = a.getAttribute('dur');
    if(d) a.setAttribute('data-base-dur', d);
  });
  var btnSpeed = document.getElementById('btn-speed');
  function applySpeed(){
    var k = speeds[si];
    Array.prototype.forEach.call(anims, function(a){
      var base = a.getAttribute('data-base-dur');
      if(!base) return;
      var num = parseFloat(base);
      if(!num) return;
      a.setAttribute('dur', (num / k).toFixed(4) + 's');
    });
    if(btnSpeed) btnSpeed.textContent = 'SPEED ' + k.toFixed(2).replace(/0$/,'') + 'x';
  }
  if(btnSpeed){
    btnSpeed.addEventListener('click', function(){
      si = (si + 1) % speeds.length;
      applySpeed();
    });
  }

  var btnDN = document.getElementById('btn-daynight');
  if(btnDN){
    btnDN.addEventListener('click', function(){
      svg.classList.toggle('night');
    });
  }
})();
</script>
