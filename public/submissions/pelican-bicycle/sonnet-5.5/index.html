<title>鹈鹕骑自行车</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#3aa6e8;font-family:-apple-system,"SF Pro Text","PingFang TC","PingFang SC","Helvetica Neue",sans-serif}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;overflow:visible}
#night-layer,.glow{opacity:0;transition:opacity 1.2s ease}
body.night #night-layer,body.night .glow{opacity:1}
.tools{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:2}
.tools button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(20,40,80,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;display:grid;place-items:center;padding:0;transition:.2s}
.tools button:hover{background:rgba(20,40,80,.55)}
.tools svg{width:24px;height:24px}
.hint{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:rgba(255,255,255,.85);font-size:12px;letter-spacing:.2em;text-shadow:0 1px 6px rgba(0,0,0,.5);pointer-events:none}
</style>

<script>
// 仅做轻量增强：竖屏收窄取景框、昼夜切换、暂停/播放；主体动画全部是 SVG SMIL，页面不做逐帧重绘。
(() => {
  const svg = document.getElementById('scene'), mq = matchMedia('(max-aspect-ratio: 9/10)');
  const fit = () => svg.setAttribute('viewBox', mq.matches ? '196 70 610 500' : '0 0 1000 640');
  fit(); mq.addEventListener('change', fit);
  const play = document.getElementById('tg-play'); let paused = false;
  document.getElementById('tg-night').onclick = () => document.body.classList.toggle('night');
  play.onclick = () => { paused = !paused; paused ? svg.pauseAnimations() : svg.unpauseAnimations(); play.innerHTML = paused ? '<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5l11 7-11 7z"/></svg>' : '<svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>'; };
})();
</script>
