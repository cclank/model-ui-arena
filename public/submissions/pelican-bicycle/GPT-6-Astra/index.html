<script>
const scene=document.getElementById('coast'),animations=[...scene.querySelectorAll('animate,animateTransform,animateMotion')].map(el=>[el,parseFloat(el.getAttribute('dur'))]);
document.getElementById('speed').onclick=function(){const fast=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',fast);this.textContent=fast?'慢慢骑':'追一阵风';document.getElementById('speedValue').textContent=fast?'28':'18';for(const [el,dur] of animations)el.setAttribute('dur',`${dur/(fast?28/18:1)}s`)};
document.getElementById('light').onclick=function(){const night=document.body.classList.toggle('night');this.setAttribute('aria-pressed',night);this.textContent=night?'天亮':'入夜'};
document.getElementById('pause').onclick=function(){const paused=!scene.animationsPaused();paused?scene.pauseAnimations():scene.unpauseAnimations();this.setAttribute('aria-pressed',paused);this.textContent=paused?'继续':'暂停'};
</script></body></html>
