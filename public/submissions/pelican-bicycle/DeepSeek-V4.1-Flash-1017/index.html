<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle — Coastal Studies No. 07</title>
<style>
  :root{
    --paper:#f6ead4;
    --paper-soft:rgba(246,234,212,.62);
    --deep:#061f25;
    --teal:#0d3a40;
    --gold:#e8b477;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    padding:22px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    color:var(--paper);
    font-family:"Helvetica Neue","Segoe UI",Arial,sans-serif;
    background:radial-gradient(90% 70% at 50% 0%,#145158 0%,#0b3238 42%,#061c21 100%);
    transition:background 1s ease;
  }
  body.night{
    background:radial-gradient(90% 70% at 50% 0%,#0a2c44 0%,#061a2a 45%,#030c14 100%);
  }
  .wrap{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
  }
  .poster{
    width:min(92vw,70vh,680px);
    padding:clamp(5px,.85vw,9px);
    background:linear-gradient(155deg,#f8efdd 0%,#efdec3 55%,#e4cfae 100%);
    border-radius:5px;
    line-height:0;
    box-shadow:
      0 38px 80px -28px rgba(0,0,0,.72),
      0 10px 24px -14px rgba(0,0,0,.5),
      0 1px 0 rgba(255,255,255,.55) inset;
  }
  #scene{
    display:block;
    width:100%;
    height:auto;
    border-radius:2px;
    background:#0b2b31;
  }
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
  }
  .segment{
    display:flex;
    align-items:center;
    gap:2px;
    padding:4px;
    border:1px solid rgba(246,234,212,.16);
    border-radius:999px;
    background:rgba(246,234,212,.055);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
  }
  .seg-label{
    font-size:9px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:rgba(246,234,212,.48);
    padding:0 9px 0 10px;
    white-space:nowrap;
  }
  .chip{
    appearance:none;
    -webkit-appearance:none;
    border:0;
    background:transparent;
    color:var(--paper);
    font-family:inherit;
    font-size:10px;
    font-weight:600;
    letter-spacing:.17em;
    text-transform:uppercase;
    line-height:1;
    padding:10px 15px;
    border-radius:999px;
    cursor:pointer;
    transition:background .25s ease,color .25s ease,box-shadow .25s ease;
  }
  .chip:hover{background:rgba(246,234,212,.12);}
  .chip.is-on{background:var(--paper);color:#0b2b31;box-shadow:0 2px 8px rgba(0,0,0,.28);}
  .chip.is-on:hover{background:var(--paper);}
  .chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .theme{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(246,234,212,.16);
    background:rgba(246,234,212,.055);
    letter-spacing:.16em;
    padding:10px 17px;
  }
  .theme svg{width:13px;height:13px;display:block;flex:0 0 auto;}
  body:not(.night) .icon-sun{display:none;}
  body.night .icon-moon{display:none;}
  .hint{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-size:12.5px;
    letter-spacing:.035em;
    color:rgba(246,234,212,.42);
    text-align:center;
  }
  #scene .night{opacity:0;transition:opacity 1.15s ease;}
  body.night #scene .night{opacity:1;}
  #scene .sun{transition:opacity 1.15s ease;}
  body.night #scene .sun{opacity:0;}
  @media (max-width:430px){
    body{padding:16px 12px;}
    .wrap{gap:12px;}
    .segment{gap:0;}
    .seg-label{padding:0 6px 0 8px;}
    .chip{padding:9px 12px;}
    .theme{padding:9px 14px;}
    .hint{font-size:11.5px;}
  }
</style>
</head>

<script>
(function () {
  'use strict';
  var body = document.body;
  var anims = Array.prototype.slice.call(document.querySelectorAll('[data-base]'));
  var speedButtons = Array.prototype.slice.call(document.querySelectorAll('[data-speed]'));
  var themeBtn = document.getElementById('themeBtn');
  var themeLabel = document.getElementById('themeLabel');

  function setSpeed(factor) {
    for (var i = 0; i < anims.length; i++) {
      var el = anims[i];
      var base = parseFloat(el.getAttribute('data-base'));
      if (!isFinite(base) || base <= 0) continue;
      el.setAttribute('dur', (base / factor).toFixed(3) + 's');
    }
    for (var j = 0; j < speedButtons.length; j++) {
      var b = speedButtons[j];
      var on = parseFloat(b.getAttribute('data-speed')) === factor;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  for (var k = 0; k < speedButtons.length; k++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        setSpeed(parseFloat(btn.getAttribute('data-speed')));
      });
    })(speedButtons[k]);
  }

  themeBtn.addEventListener('click', function () {
    var night = body.classList.toggle('night');
    themeBtn.setAttribute('aria-pressed', night ? 'true' : 'false');
    themeLabel.textContent = night ? 'Day' : 'Night';
  });
})();
</script>
