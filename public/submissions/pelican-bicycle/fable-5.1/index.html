<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>

<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕在海边公路上骑自行车，车轮转动、双腿蹬踏、场景滚动">

    <linearGradient id="frameG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b62"/><stop offset="1" stop-color="#b3202a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffeaa0"/><stop offset=".5" stop-color="#e0aa38"/><stop offset="1" stop-color="#8a5d10"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="seaClip"><rect x="0" y="520" width="1000" height="310"/></clipPath>
    <g id="cloud"><ellipse cx="0" cy="0" rx="62" ry="30"/><ellipse cx="-48" cy="10" rx="40" ry="22"/><ellipse cx="52" cy="10" rx="44" ry="24"/><ellipse cx="6" cy="-22" rx="38" ry="26"/><ellipse cx="-22" cy="-12" rx="30" ry="22"/></g>
    <g id="spokes" stroke="#cfd6de" stroke-width="2.5" stroke-linecap="round"><path d="M0 -72 V72 M-72 0 H72"/><path d="M0 -72 V72 M-72 0 H72" transform="rotate(22.5)"/><path d="M0 -72 V72 M-72 0 H72" transform="rotate(45)"/><path d="M0 -72 V72 M-72 0 H72" transform="rotate(67.5)"/></g>

      <circle r="12" fill="#cdd4dd" stroke="#4a4f5a" stroke-width="3"/><circle r="4" fill="#4a4f5a"/>
