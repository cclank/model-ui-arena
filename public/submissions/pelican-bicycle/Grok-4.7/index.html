<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>潮路 · 鹈鹕骑车</title>
<style>
:root{--cycle:1.15s;--ink:#163042}
*{box-sizing:border-box}
html,body{margin:0;background:#d7eef8;color:var(--ink);font:14px/1.3 "Iowan Old Style",Palatino,Georgia,serif}
svg{width:100%;height:auto;display:block}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px}
h1{font-size:18px;font-weight:500;margin:0;letter-spacing:.12em}
.kicker{font:10px ui-monospace,Menlo,monospace;letter-spacing:.18em;color:#3d7e96}
button{font:inherit;border:1px solid #9cc5d4;background:#fff8;border-radius:999px;padding:6px 10px;cursor:pointer}
button:focus-visible{outline:2px solid #1d6f8a;outline-offset:2px}
.tools{display:flex;gap:6px}
#far{animation:slide calc(var(--cycle)*14) linear infinite}
#mid{animation:slide calc(var(--cycle)*6) linear infinite}
#near{animation:slide calc(var(--cycle)*2.4) linear infinite}
#road{animation:road var(--cycle) linear infinite}
#bob{animation:bob var(--cycle) ease-in-out infinite}
@keyframes slide{to{transform:translateX(-960px)}}
@keyframes road{to{transform:translateX(-364px)}}
@keyframes bob{0%,100%{transform:translateY(0)}25%{transform:translateY(2px)}50%{transform:translateY(0)}75%{transform:translateY(3.5px)}}
.pouch{animation:pouch var(--cycle) ease-in-out infinite;transform-origin:680px 248px}
@keyframes pouch{50%{transform:scale(1.06,1.12)}}
.tail{animation:tail calc(var(--cycle)*2) ease-in-out infinite;transform-origin:360px 300px}
@keyframes tail{50%{transform:rotate(-6deg)}}
body.night{background:#0d1b2a;color:#e7f2f8}
body.night .sky1{stop-color:#0c1730}
body.night .sky2{stop-color:#1c3d5a}
body.night .sea1{stop-color:#0e3a4d}
body.night .sea2{stop-color:#071820}
body.night .sun{fill:#f4e2b0;opacity:.85}
body.night button{background:#123;color:#e7f2f8;border-color:#356}
</style>
</head>

<script>
const speeds=[["0.72s","快"],["1.15s","中"],["1.9s","慢"]];
let i=1;
const speedBtn=document.getElementById("speed");
function apply(){
  document.documentElement.style.setProperty("--cycle",speeds[i][0]);
  document.querySelectorAll("[data-sync]").forEach(el=>el.setAttribute("dur",el.closest("#gull")?"9.2s":speeds[i][0]));
  speedBtn.textContent="速度 · "+speeds[i][1];
}
speedBtn.onclick=()=>{i=(i+1)%speeds.length;apply()};
document.getElementById("day").onclick=()=>document.body.classList.toggle("night");
apply();
</script>
