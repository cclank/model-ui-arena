<script>
// Once-only construction of declarative SMIL. The feet and pedals share the rotating crank;
// inverse-kinematic leg keyframes follow it. No JavaScript frame loop draws the subject.
const svg=document.getElementById('scene'),ns='http://www.w3.org/2000/svg';
function leg(phase){const hip={x:388,y:345},cx=430,cy=504,L1=94,L2=100,values=[];for(let i=0;i<=96;i++){const a=i/96*Math.PI*2+phase,x=cx+34*Math.cos(a),y=cy+34*Math.sin(a),dx=x-hip.x,dy=y-hip.y,d=Math.hypot(dx,dy),along=(L1*L1-L2*L2+d*d)/(2*d),rise=Math.sqrt(Math.max(0,L1*L1-along*along)),kx=hip.x+dx/d*along+dy/d*rise,ky=hip.y+dy/d*along-dx/d*rise;values.push(`M${hip.x} ${hip.y} ${kx.toFixed(3)} ${ky.toFixed(3)} ${x.toFixed(3)} ${y.toFixed(3)}`)}return values}
for(const[id,phase]of [['leg-near',0],['leg-far',Math.PI]]){const path=document.getElementById(id),values=leg(phase),a=document.createElementNS(ns,'animate');path.setAttribute('d',values[0]);a.setAttribute('attributeName','d');a.setAttribute('values',values.join(';'));a.setAttribute('dur','2.4s');a.setAttribute('repeatCount','indefinite');a.setAttribute('calcMode','linear');path.append(a)}
let speed=1,paused=false;const animations=[...svg.querySelectorAll('animate,animateTransform')];animations.forEach(a=>a.dataset.base=parseFloat(a.getAttribute('dur')));document.getElementById('speed').onclick=()=>{speed=speed===1?2:speed===2?.5:1;animations.forEach(a=>a.setAttribute('dur',a.dataset.base/speed+'s'));svg.setCurrentTime(0);document.getElementById('speed').textContent='巡航 ×'+speed};document.getElementById('day').onclick=()=>document.body.classList.toggle('night');document.getElementById('pause').onclick=()=>{paused=!paused;paused?svg.pauseAnimations():svg.unpauseAnimations();document.getElementById('pause').textContent=paused?'继续':'暂停'};
</script></body></html>
