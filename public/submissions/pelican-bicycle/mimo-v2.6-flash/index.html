*{margin:0;padding:0;box-sizing:border-box}
:root{--T:1.7s}
:root.fast{--T:.72s}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif}
body{display:grid;place-items:center;background:#0d1b2a}
.stage{position:relative;width:100vw;height:100vh;background:linear-gradient(#3aa0e0 0%,#8fd0f0 45%,#ffd9a0 100%);transition:background 1s}
body.night .stage{background:linear-gradient(#050a1e 0%,#122044 60%,#2a3560 100%)}
svg{position:absolute;inset:0;width:100%;height:100%}
.ui{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;z-index:5}
.ui button{border:0;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,.85);color:#143;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ui button:active{transform:scale(.95)}
body.night .ui button{background:rgba(10,16,40,.85);color:#cfe0ff}
/* ---------- 无缝循环滚动：两份内容平移一份宽度 ---------- */
.scroll{animation:sc linear infinite}
@keyframes sc{to{transform:translateX(-900px)}}
.s-cloud{animation-duration:calc(var(--T)*9)}
.s-far{animation-duration:calc(var(--T)*5)}
.s-mid{animation-duration:calc(var(--T)*2.6)}
.s-road{animation-duration:calc(var(--T)*1.15)}
/* ---------- 机械与生物动画 ---------- */
.spin{transform-box:view-box;animation:rot var(--T) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.legA{transform-box:view-box;transform-origin:368px 368px;animation:legA var(--T) linear infinite}
.legB{transform-box:view-box;transform-origin:368px 368px;animation:legA var(--T) linear infinite;animation-delay:calc(var(--T)*-.5)}
.kneeA{transform-box:view-box;transform-origin:368px 463px;animation:legB var(--T) linear infinite}
.kneeB{transform-box:view-box;transform-origin:368px 463px;animation:legB var(--T) linear infinite;animation-delay:calc(var(--T)*-.5)}
.orbitA{transform-box:view-box;transform-origin:452px 486px;animation:rot var(--T) linear infinite}
.orbitB{transform-box:view-box;transform-origin:452px 486px;animation:rot var(--T) linear infinite;animation-delay:calc(var(--T)*-.5)}
.ctrA{transform-box:view-box;transform-origin:488px 486px;animation:rotRev var(--T) linear infinite}
.ctrB{transform-box:view-box;transform-origin:416px 486px;animation:rotRev var(--T) linear infinite;animation-delay:calc(var(--T)*-.5)}
@keyframes rotRev{to{transform:rotate(-360deg)}}
.rider{transform-box:view-box;animation:bob calc(var(--T)/2) ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.neck{transform-box:view-box;transform-origin:430px 262px;animation:nsway var(--T) ease-in-out infinite alternate}
@keyframes nsway{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
.headg{transform-box:view-box;transform-origin:520px 170px;animation:hnod calc(var(--T)/2) ease-in-out infinite alternate}
@keyframes hnod{from{transform:rotate(-2.5deg)}to{transform:rotate(2deg)}}
.pouch{transform-box:view-box;transform-origin:556px 176px;animation:wig var(--T) ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-1.5deg) scale(1)}50%{transform:rotate(2.5deg) scale(1.04)}}
.tail{transform-box:view-box;transform-origin:270px 288px;animation:twag calc(var(--T)/2) ease-in-out infinite alternate}
@keyframes twag{from{transform:rotate(-7deg)}to{transform:rotate(6deg)}}
.wing{transform-box:view-box;transform-origin:402px 272px;animation:flap calc(var(--T)*2) ease-in-out infinite alternate}
@keyframes flap{to{transform:rotate(3.5deg)}}
.cloud{animation:drift calc(var(--T)*8) linear infinite;animation-delay:calc(var(--T)*-3)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-180px)}}

<script>
// 仅用于增强：切换速度倍率与昼夜主题，不逐帧重绘主体
let fast=false;
document.getElementById("spd").onclick=(e)=>{
  fast=!fast;document.documentElement.classList.toggle("fast",fast);
  e.currentTarget.textContent=fast?"速度 ×2.4":"速度 ×1";
};
document.getElementById("day").onclick=()=>{
  const night=document.body.classList.toggle("night");
  document.querySelector("#sunmoon .sunmoon-moon").style.display=night?"":"none";
  document.querySelectorAll("#sunmoon > circle").forEach(c=>c.style.display=night?"none":"");
};
</script>
