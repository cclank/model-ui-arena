<script>
// Generate SVG animation keyframes once. No JavaScript animation loop or per-frame drawing.
const NS='http://www.w3.org/2000/svg';let fast=false;const animations=[];
function animate(el,attribute,values){let a=document.createElementNS(NS,attribute==='transform'?'animateTransform':'animate');a.setAttribute('attributeName',attribute);if(attribute==='transform')a.setAttribute('type','translate');a.setAttribute('values',values.join(';'));a.setAttribute('dur','2.4s');a.setAttribute('repeatCount','indefinite');a.setAttribute('calcMode','linear');el.append(a);animations.push(a)}
for(let side=0;side<2;side++){let paths=[],feet=[];for(let i=0;i<=64;i++){let a=i/64*Math.PI*2+side*Math.PI,x=430+36*Math.cos(a),y=545+36*Math.sin(a),hx=side?420:400,hy=(side?422:421)+3*(1-Math.cos(i/64*Math.PI*4))/2,dx=x-hx,dy=y-hy,d=Math.hypot(dx,dy),height=Math.sqrt(Math.max(0,86*86-d*d/4)),sign=side?-1:1,kx=(hx+x)/2-sign*dy/d*height,ky=(hy+y)/2+sign*dx/d*height;paths.push(`M${hx.toFixed(2)} ${hy.toFixed(2)} L${kx.toFixed(2)} ${ky.toFixed(2)} L${x.toFixed(2)} ${y.toFixed(2)}`);feet.push(`${x.toFixed(2)} ${y.toFixed(2)}`)}animate(document.querySelector(side?'#back-leg':'#front-leg'),'d',paths);if(!side)animate(document.querySelector('#front-leg-highlight'),'d',paths);let foot=document.querySelector(side?'#back-foot':'#front-foot');foot.removeAttribute('transform');animate(foot,'transform',feet)}
document.querySelector('#speed').onclick=()=>{fast=!fast;document.querySelector('#postcard').classList.toggle('fast',fast);document.querySelector('#speed').textContent=fast?'慢慢骑就好 ↙':'轻快一点 ↗';animations.forEach(a=>a.setAttribute('dur',fast?'1.2s':'2.4s'))};
</script></body></html>
