<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Event Horizon / Schwarzschild observatory</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040609;color:#e5e8ea;font:12px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 36%,#030507aa 100%)}header{position:absolute;z-index:2;left:30px;top:25px}.brand{font:600 11px ui-monospace,monospace;letter-spacing:.25em;color:#e8d5b6}.sub{margin-top:5px;color:#7e8990;font-size:8px;letter-spacing:.18em}.side{position:absolute;z-index:2;right:24px;top:23px;width:210px;border:1px solid #ffffff20;border-radius:12px;padding:14px;background:#080b0ed9;backdrop-filter:blur(12px)}.side h2{font-size:9px;letter-spacing:.17em;color:#b1bbc0;font-weight:500;margin:0 0 13px}.metric{display:flex;justify-content:space-between;margin:9px 0;color:#7f8d94;font-size:9px}.metric b{color:#e8d5b5;font:12px ui-monospace,monospace}.metric small{font-size:8px;color:#87979e}.status{margin-top:13px;border-top:1px solid #ffffff16;padding-top:10px;color:#95a3a7;font-size:8px;letter-spacing:.08em}.legend{position:absolute;bottom:119px;left:29px;color:#839198;font-size:8px;letter-spacing:.14em}.controls{position:absolute;z-index:2;bottom:21px;left:50%;transform:translateX(-50%);width:min(630px,calc(100% - 28px));padding:13px 16px;border:1px solid #ffffff21;border-radius:13px;background:#090c0edb;backdrop-filter:blur(14px);display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:center}.control label{display:flex;justify-content:space-between;align-items:center;color:#829097;font-size:8px;letter-spacing:.1em}.control label b{color:#d9e0dd;font:10px ui-monospace,monospace}input[type=range]{width:100%;accent-color:#d2b57d;height:14px}.quality{display:flex;gap:4px}.quality button{border:1px solid #465157;border-radius:7px;padding:7px 9px;color:#93a1a5;background:#11181b;font:8px ui-sans-serif,system-ui;cursor:pointer}.quality button.active{border-color:#c7ab75;color:#e8d6ae;background:#352d21}.badge{position:absolute;z-index:2;left:29px;bottom:24px;color:#65747b;font:8px ui-monospace,monospace;letter-spacing:.12em}.err{position:absolute;z-index:5;inset:0;background:#080a0c;display:none;place-items:center;padding:26px}.err.show{display:grid}.errbox{max-width:440px;border:1px solid #4d4e48;border-radius:16px;background:#101416;padding:25px}.errbox h1{font-size:15px;font-weight:500;color:#f0d4a0}.errbox p{color:#9da7a6;line-height:1.7;font-size:11px}.errbox button{background:#282d2c;border:1px solid #66716b;color:#d9e3dc;padding:8px 12px;border-radius:8px;cursor:pointer}
@media(max-width:600px){header{left:15px;top:14px}.side{right:12px;top:60px;width:174px;padding:11px}.metric{margin:7px 0}.legend{left:15px;bottom:144px;font-size:7px}.controls{bottom:12px;grid-template-columns:1fr 1fr;gap:7px;padding:10px}.quality{grid-column:1/-1;justify-content:flex-end}.badge{left:15px;bottom:15px}}
</style></head><body><canvas id="space" aria-label="实时施瓦西黑洞渲染"></canvas><div class="overlay"></div><header><div class="brand">EVENT HORIZON</div><div class="sub">SCHWARZSCHILD OBSERVATORY · rₛ = 1</div></header><aside class="side"><h2>LOCAL ORBIT TELEMETRY</h2><div class="metric"><span>相机距离 <small>r / rₛ</small></span><b id="distRead">18.00</b></div><div class="metric"><span>引力时间膨胀</span><b id="timeRead">0.972</b></div><div class="metric"><span>圆轨道速度 β</span><b id="betaRead">0.167 c</b></div><div class="status" id="status">● WEBGL2 · FLOAT HDR</div></aside><div class="legend">DRAG TO ORBIT　·　SCROLL / PINCH TO ZOOM</div><div class="badge">GEODESICS INTEGRATED PER FRAGMENT · NO SCREEN WARP</div><section class="controls"><div class="control"><label>吸积率 <b id="diskVal">1.00×</b></label><input id="disk" type="range" min=".2" max="2" step=".01" value="1"></div><div class="control"><label>曝光 <b id="expVal">1.00×</b></label><input id="exposure" type="range" min=".5" max="2" step=".01" value="1"></div><div class="quality"><button class="active" data-q="high">精细</button><button data-q="low">性能</button></div></section><div class="err" id="err"><div class="errbox"><h1>观测中断</h1><p id="errtext">当前设备无法初始化 WebGL2。黑洞视界、测地线积分与 HDR 渲染需要支持 WebGL2 的浏览器及显卡。</p><button id="retry">重新连接</button></div></div>
<script>
const canvas=document.querySelector('#space'),errorBox=document.querySelector('#err'),errorText=document.querySelector('#errtext');let gl,programs={},targets=[],quad,dist=18,yaw=0,pitch=.72,disk=1,exposure=1,quality='high',drag=null,last=0,fps=60,slow=0,scale=.72;const $=s=>document.querySelector(s);
const vs=`#version 300 es\nin vec2 p;out vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const sceneFS=`#version 300 es
precision highp float;in vec2 v;out vec4 o;uniform vec2 res;uniform float time,camDist,yaw,pitch,diskPower,steps;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1)),f.x),f.y);}
// Null rays use the Schwarzschild orbit equation u'' + u = 1.5u^2, with u=1/r.
float grav(float u){return -u+1.5*u*u;}vec3 blackBody(float r){float t=clamp((9.-r)/7.,0.,1.);vec3 cold=vec3(1.35,.35,.10),warm=vec3(1.8,1.04,.48),hot=vec3(.75,1.13,1.75);return mix(mix(cold,warm,smoothstep(0.,.48,t)),hot,smoothstep(.5,1.,t));}
vec3 starfield(vec3 d){float lon=atan(d.z,d.x),lat=asin(clamp(d.y,-1.,1.));vec2 uv=vec2(lon/6.28318+.5,lat/3.14159+.5);vec2 cell=floor(uv*vec2(900.,460.));float h=hash(cell);float star=smoothstep(.9968,.9998,h)*pow(hash(cell+7.),4.)*1.8;float milky=noise(vec2(lon*3.,lat*17.)+vec2(1.));float band=exp(-pow((lat+.18*sin(lon*2.))/.16,2.));vec3 c=vec3(.018,.028,.043)+vec3(.11,.14,.2)*band*milky+vec3(star);float neb=noise(uv*55.+vec2(time*.002,0.));c+=vec3(.045,.018,.08)*smoothstep(.68,.86,neb)*band;return c;}
void main(){vec2 xy=(gl_FragCoord.xy-.5*res)/res.y;vec3 n=normalize(vec3(sin(yaw)*cos(pitch),sin(pitch),cos(yaw)*cos(pitch)));vec3 right=normalize(vec3(cos(yaw),0.,-sin(yaw)));vec3 up=normalize(cross(n,right));vec3 rd=normalize(-n+right*xy.x*1.18+up*xy.y*1.18);float radial=dot(n,rd);if(radial>=-.015){o=vec4(starfield(rd),1);return;}float b=length(cross(n*camDist,rd));if(b<.0001){o=vec4(0,0,0,1);return;}vec3 q=normalize(rd-n*radial);float u=1./camDist,w=-radial/b,phi=0.,h=.014;float z0=n.z;vec3 glow=vec3(0);float hit=0.;bool escaped=false,captured=false;int count=int(steps);
for(int i=0;i<440;i++){if(i>=count)break;float k1u=w,k1w=grav(u);float k2u=w+.5*h*k1w,k2w=grav(u+.5*h*k1u);float k3u=w+.5*h*k2w,k3w=grav(u+.5*h*k2u);float k4u=w+h*k3w,k4w=grav(u+h*k3u);float un=u+h*(k1u+2.*k2u+2.*k3u+k4u)/6.;float wn=w+h*(k1w+2.*k2w+2.*k3w+k4w)/6.;float ph=phi+h;float z1=n.z*cos(ph)+q.z*sin(ph);if(z0*z1<=0.&&i>2){float f=clamp(abs(z0)/(abs(z0)+abs(z1)+1e-6),0.,1.);float uc=mix(u,un,f);float r=1./max(uc,.0001);if(r>=3.&&r<=12.){float pc=phi+h*f;// A sign change in z is a physical equatorial-plane crossing; emit only between ISCO and disk edge.
vec3 pos=(n*cos(pc)+q*sin(pc))*r;float ang=atan(pos.y,pos.x);float beta=sqrt(1./(2.*r));vec3 vel=normalize(vec3(-pos.y,pos.x,0.));// Local Keplerian beta, delta^3 beaming, Schwarzschild gravitational redshift, and T proportional to r^(-3/4).
float dop=sqrt(1.-beta*beta)/max(.22,1.-beta*dot(vel,-rd));float stripes=.84+.16*sin(ang*6.-time*(1.4/r)+log(r)*9.)+.06*sin(ang*2.+log(r)*5.);float temp=pow(3./r,.75);float gravRed=sqrt(max(0.,1.-1./r));float intens=diskPower*dop*dop*dop*gravRed*temp*stripes*.46;vec3 c=blackBody(r)*intens;float arc=exp(-pow((r-3.15)*1.9,2.));c+=vec3(.45,.64,1.)*arc*dop*diskPower;glow+=c;hit+=intens;}}z0=z1;u=un;w=wn;phi=ph;if(u>=1.){captured=true;break;}if(u<=.0001){escaped=true;break;}if(w<0.&&u<1./camDist&&phi>.16){escaped=true;break;}if(phi>6.1)break;}
vec3 color=glow;if(escaped){vec3 skyDir=normalize(n*cos(phi)+q*sin(phi));color+=starfield(skyDir)*max(.36,1.-hit*.18);}else if(!captured&&hit<.001){color=vec3(.008,.011,.018);}float photon=exp(-pow((b-2.72)*9.,2.))*smoothstep(2.,2.9,b);color+=vec3(.27,.39,.62)*photon*.8;float lens=exp(-pow((b-3.05)*2.2,2.))*smoothstep(2.6,3.05,b);color+=vec3(.22,.12,.075)*lens*diskPower*.24;float vign=1.-.22*dot(xy,xy);o=vec4(color*vign,1.);}`;
const extractFS=`#version 300 es\nprecision highp float;in vec2 v;out vec4 o;uniform sampler2D src;void main(){vec3 c=texture(src,v).rgb;float l=max(max(c.r,c.g),c.b);float k=max(l-0.78,0.)/max(l,.001);o=vec4(c*k,1.);}`;
const blurFS=`#version 300 es\nprecision highp float;in vec2 v;out vec4 o;uniform sampler2D src;uniform vec2 dir;void main(){vec3 c=texture(src,v).rgb*.227027;c+=texture(src,v+dir*1.384615).rgb*.316216;c+=texture(src,v-dir*1.384615).rgb*.316216;c+=texture(src,v+dir*3.230769).rgb*.070270;c+=texture(src,v-dir*3.230769).rgb*.070270;o=vec4(c,1.);}`;
const composeFS=`#version 300 es\nprecision highp float;in vec2 v;out vec4 o;uniform sampler2D scene,bloom;uniform float exposure;vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}void main(){vec3 c=texture(scene,v).rgb+texture(bloom,v).rgb*.52;c=aces(c*exposure);float vig=1.-.32*dot(v-.5,v-.5);c*=vig;o=vec4(pow(c,vec3(1./2.2)),1.);}`;
function compile(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}function prog(fs){let p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}function target(float){let t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,float?gl.RGBA16F:gl.RGBA8,canvas.width,canvas.height,0,gl.RGBA,float?gl.HALF_FLOAT:gl.UNSIGNED_BYTE,null);let f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('HDR framebuffer unavailable');return {t,f}}
function init(){try{gl=canvas.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'high-performance'});if(!gl)throw Error('WebGL2 unavailable');const ext=gl.getExtension('EXT_color_buffer_float');programs={scene:prog(sceneFS),extract:prog(extractFS),blur:prog(blurFS),compose:prog(composeFS)};quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);resize();$('#status').textContent=ext?'● WEBGL2 · RGBA16F · 5 PASS':'● WEBGL2 · RGBA8 FALLBACK · 5 PASS';errorBox.classList.remove('show');requestAnimationFrame(frame)}catch(e){showError('着色器或浮点帧缓冲初始化失败。'+String(e.message||e))}}function resize(){if(!gl)return;const d=Math.min(devicePixelRatio||1,1.15),q=quality==='high'?.82:.56;canvas.width=Math.max(1,Math.round(innerWidth*d*q));canvas.height=Math.max(1,Math.round(innerHeight*d*q));canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';gl.viewport(0,0,canvas.width,canvas.height);targets=[];let useFloat=!!gl.getExtension('EXT_color_buffer_float');try{targets=[target(useFloat),target(useFloat),target(useFloat)]}catch(e){targets=[target(false),target(false),target(false)];$('#status').textContent='● WEBGL2 · RGBA8 FALLBACK · 5 PASS'}}function showError(s){errorText.textContent=s;errorBox.classList.add('show')}function loc(p,k){return gl.getUniformLocation(p,k)}function tex(p,name,unit,t){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(loc(p,name),unit)}function draw(p,f){gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}// Render order: floating scene, bright extraction, horizontal blur, vertical blur, then ACES tone map.
function frame(t){if(!gl||errorBox.classList.contains('show'))return;let dt=Math.min(.1,(t-last)/1000||.016);last=t;fps=fps*.92+(1/dt)*.08;if(fps<25)slow+=dt;else slow=Math.max(0,slow-dt*.5);if(slow>3&&quality==='high'){quality='low';document.querySelector('[data-q=low]').classList.add('active');document.querySelector('[data-q=high]').classList.remove('active');resize();slow=0;$('#status').textContent='● AUTO QUALITY · PERF MODE'}let s=programs.scene;gl.useProgram(s);gl.uniform2f(loc(s,'res'),canvas.width,canvas.height);gl.uniform1f(loc(s,'time'),t/1000);gl.uniform1f(loc(s,'camDist'),dist);gl.uniform1f(loc(s,'yaw'),yaw);gl.uniform1f(loc(s,'pitch'),pitch);gl.uniform1f(loc(s,'diskPower'),disk);gl.uniform1f(loc(s,'steps'),quality==='high'?360:170);draw(s,targets[0].f);let e=programs.extract;gl.useProgram(e);tex(e,'src',0,targets[0].t);draw(e,targets[1].f);let b=programs.blur;gl.useProgram(b);tex(b,'src',0,targets[1].t);gl.uniform2f(loc(b,'dir'),2/canvas.width,0);draw(b,targets[2].f);tex(b,'src',0,targets[2].t);gl.uniform2f(loc(b,'dir'),0,2/canvas.height);draw(b,targets[1].f);let c=programs.compose;gl.useProgram(c);tex(c,'scene',0,targets[0].t);tex(c,'bloom',1,targets[1].t);gl.uniform1f(loc(c,'exposure'),exposure);draw(c,null);updateTelemetry();requestAnimationFrame(frame)}function updateTelemetry(){let r=Math.max(1.001,dist);$('#distRead').textContent=r.toFixed(2);$('#timeRead').textContent=Math.sqrt(Math.max(0,1-1/r)).toFixed(4);$('#betaRead').textContent=Math.sqrt(1/(2*r)).toFixed(4)+' c'}function zoom(f){dist=Math.max(3.2,Math.min(40,dist*f));updateTelemetry()}canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.006;pitch=Math.max(-1.15,Math.min(1.15,pitch+(e.clientY-drag.y)*.005));drag.x=e.clientX;drag.y=e.clientY});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.08:.92)},{passive:false});let pinch=0;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)zoom(pinch/d);pinch=d}},{passive:false});canvas.addEventListener('touchend',()=>pinch=0);$('#disk').oninput=e=>{disk=+e.target.value;$('#diskVal').textContent=disk.toFixed(2)+'×'};$('#exposure').oninput=e=>{exposure=+e.target.value;$('#expVal').textContent=exposure.toFixed(2)+'×'};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{quality=b.dataset.q;document.querySelectorAll('[data-q]').forEach(x=>x.classList.toggle('active',x===b));resize()});addEventListener('resize',resize);canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();showError('显卡上下文已丢失。请尝试重新连接，页面会重新创建完整的测地线与 HDR 管线。')});canvas.addEventListener('webglcontextrestored',()=>init());$('#retry').onclick=()=>{errorBox.classList.remove('show');init()};init();
</script></body></html>
