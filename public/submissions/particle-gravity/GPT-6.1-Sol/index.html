<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBITAL · 引力的形状</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#080e17;color:#dfe8ef;font-family:Arial,"PingFang SC",sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}header{position:absolute;top:30px;left:34px;right:34px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.logo{font-size:12px;letter-spacing:.27em}.logo span{color:#7ce4d4}.mode{font-size:9px;letter-spacing:.16em;color:#7295a4}.copy{position:absolute;left:6%;top:16%;pointer-events:none}.eyebrow{font-size:9px;letter-spacing:.25em;color:#648c9d}h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(34px,4vw,58px);font-weight:normal;letter-spacing:-.04em;line-height:1.22;margin:15px 0}.copy p{font-size:11px;color:#728d9d;line-height:1.8}.controls{position:absolute;left:34px;bottom:30px;right:34px;display:flex;justify-content:space-between;gap:20px;align-items:end}.panel{padding:16px 20px;border:1px solid #36506366;background:#0a1523cc;backdrop-filter:blur(14px);border-radius:16px;display:flex;gap:18px;align-items:center}.metric small{display:block;font-size:8px;letter-spacing:.14em;color:#6d92a4;margin-bottom:7px}.metric strong{font-size:18px;font-weight:normal;color:#b4e0e3;font-variant-numeric:tabular-nums}.actions{display:flex;gap:7px}button,select{font:inherit;font-size:10px;border:1px solid #37505f;border-radius:20px;color:#afd5df;background:#122432;padding:10px 13px;cursor:pointer}button:hover{border-color:#82d5d5}button[aria-pressed=true]{background:#23494d;border-color:#82d5d5}select{max-width:120px}.hint{position:absolute;right:5%;top:43%;font-size:9px;color:#526e85;letter-spacing:.16em;writing-mode:vertical-rl;pointer-events:none}.credit{position:absolute;right:34px;top:65px;font-size:8px;color:#496174;letter-spacing:.12em;pointer-events:none}@media(max-width:680px){header{left:22px;right:22px;top:25px}.copy{left:7%;top:13%}h1{font-size:37px}.controls{left:20px;right:20px;bottom:22px;flex-direction:column;align-items:stretch;gap:10px}.panel{padding:13px 17px;justify-content:space-between}.metric strong{font-size:17px}.actions{justify-content:space-between}button,select{font-size:9px;padding:9px 11px}.mode{font-size:8px}.hint{right:6%;top:40%;font-size:8px}.credit{display:none}}
</style></head><body><canvas id="field" aria-label="交互引力场，移动吸引粒子，点击发射冲击波"></canvas><header><div class="logo"><span>O</span> / ORBITAL</div><div class="mode" id="mode">ATTRACT / 吸引模式</div></header><div class="copy"><div class="eyebrow">A STUDY IN INVISIBLE FORCES</div><h1>万物有引力，<br>轨迹有回声。</h1><p>移动，牵引星群。<br>轻触，让涟漪越过轨道。</p></div><div class="hint">MOVE TO ATTRACT · TOUCH TO RIPPLE</div><span class="credit">GPT-6.1-SOL / PHYSICS STUDY</span><div class="controls"><div class="panel"><div class="metric"><small>PARTICLES / 粒子</small><strong id="count">900</strong></div><div class="metric"><small>KINETIC / 能量</small><strong id="energy">0.0</strong></div><div class="metric"><small>FRAME RATE</small><strong id="fps">60</strong></div></div><div class="actions"><button id="polarity" aria-pressed="false">切换排斥</button><button id="pause">暂停</button><button id="reset">重置</button><select id="density" aria-label="选择粒子数量"><option value="600">600 粒子</option><option value="900" selected>900 粒子</option><option value="1500">1500 粒子</option></select></div></div>
<script>
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let w,h,cx,cy,scale,particles=[],ripples=[],pointer={x:0,y:0,on:false},repel=false,paused=false,last=performance.now(),frames=0,clock=performance.now(),total=innerWidth<600?600:900;const colors=['#75cfd2','#607fc2','#bba3d9'];$('density').value=total;
function seed(){particles=[];for(let i=0;i<total;i++){const r=(.18+Math.random()*.78)*scale,a=Math.random()*Math.PI*2,s=Math.sqrt(70*scale/r)*(.92+Math.random()*.15);particles.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,vx:-Math.sin(a)*s,vy:Math.cos(a)*s,color:i%3,depth:.45+Math.random()*.55})}$('count').textContent=total;ctx.fillStyle='#080e17';ctx.fillRect(0,0,w,h)}
function resize(){w=innerWidth;h=innerHeight;scale=Math.min(w,h)*.42;cx=w*.54;cy=h*.52;const d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);seed()}addEventListener('resize',resize);resize();
canvas.onpointermove=e=>{pointer={x:e.clientX,y:e.clientY,on:true}};canvas.onpointerleave=()=>pointer.on=false;canvas.onpointerdown=e=>{pointer={x:e.clientX,y:e.clientY,on:true};ripples.push({x:e.clientX,y:e.clientY,r:0,alpha:1});ripples=ripples.slice(-12);for(const p of particles){const dx=p.x-e.clientX,dy=p.y-e.clientY,d=Math.hypot(dx,dy)+1,impulse=9*Math.exp(-d/180);p.vx+=dx/d*impulse;p.vy+=dy/d*impulse}};canvas.onpointerup=e=>{if(e.pointerType==='touch')pointer.on=false};$('polarity').onclick=()=>{repel=!repel;$('polarity').setAttribute('aria-pressed',repel);$('polarity').textContent=repel?'切换吸引':'切换排斥';$('mode').textContent=repel?'REPEL / 排斥模式':'ATTRACT / 吸引模式'};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停';document.body.dataset.paused=paused};$('reset').onclick=seed;$('density').onchange=()=>{total=Number($('density').value);seed()};
function frame(now){const dt=Math.min((now-last)/16.667,2);last=now;if(!paused){ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(8,14,23,.16)';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#36556c25';ctx.lineWidth=.6;for(const r of [.3,.58,.87]){ctx.beginPath();ctx.ellipse(cx,cy,scale*r,scale*r,0,0,Math.PI*2);ctx.stroke()}let kinetic=0;ctx.globalCompositeOperation='lighter';for(let c=0;c<3;c++){ctx.strokeStyle=colors[c];ctx.lineWidth=c===0?1:.6;ctx.globalAlpha=c===0?.6:.37;ctx.beginPath();for(const p of particles){if(p.color!==c)continue;let dx=cx-p.x,dy=cy-p.y,d2=dx*dx+dy*dy+scale*scale*.006,inv=1/Math.sqrt(d2),a=70*scale*inv*inv*inv;p.vx+=dx*a*dt;p.vy+=dy*a*dt;if(pointer.on){dx=pointer.x-p.x;dy=pointer.y-p.y;d2=dx*dx+dy*dy+1800;a=2400/Math.pow(d2,1.5)*(repel?-1:1);p.vx+=dx*a*dt;p.vy+=dy*a*dt}const speed=Math.hypot(p.vx,p.vy);if(speed>14){p.vx*=14/speed;p.vy*=14/speed}ctx.moveTo(p.x,p.y);p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.lineTo(p.x,p.y);kinetic+=p.vx*p.vx+p.vy*p.vy;if(p.x<-w||p.x>2*w||p.y<-h||p.y>2*h){const a=Math.random()*6.28,r=scale*.75,s=Math.sqrt(70*scale/r);p.x=cx+Math.cos(a)*r;p.y=cy+Math.sin(a)*r;p.vx=-Math.sin(a)*s;p.vy=Math.cos(a)*s}}ctx.stroke()}ctx.globalAlpha=1;const glow=ctx.createRadialGradient(cx,cy,1,cx,cy,45);glow.addColorStop(0,'#a9ffea');glow.addColorStop(.08,'#66f5d999');glow.addColorStop(1,'#66f5d900');ctx.fillStyle=glow;ctx.fillRect(cx-45,cy-45,90,90);ctx.strokeStyle='#8df9e655';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,9+Math.sin(now*.001)*2,0,6.28);ctx.stroke();if(pointer.on){ctx.strokeStyle=repel?'#d9a5ce88':'#8ed7d388';ctx.beginPath();ctx.arc(pointer.x,pointer.y,12,0,6.28);ctx.stroke()}for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=5*dt;r.alpha-=.012*dt;if(r.alpha<=0){ripples.splice(i,1);continue}ctx.strokeStyle=`rgba(133,222,217,${r.alpha*.6})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.28);ctx.stroke()}if(now-clock>500)$('energy').textContent=(kinetic/particles.length).toFixed(1)}frames++;if(now-clock>500){$('fps').textContent=Math.round(frames*1000/(now-clock));frames=0;clock=now}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
