<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital — An experiment in attraction</title>
<!-- Semi-implicit Euler particles orbit a softened inverse-square potential. Moving the pointer adds a temporary attractor; pressing creates a radial impulse. Stable substeps and fixed particle counts bound cost. -->
<style>
*{box-sizing:border-box}body{margin:0;background:#07121a;color:#cdebe4;overflow:hidden;font-family:Arial,sans-serif}canvas{position:fixed;inset:0;touch-action:none;width:100%;height:100%}header{position:fixed;top:32px;left:36px;right:36px;display:flex;justify-content:space-between;pointer-events:none}.brand{font:18px monospace;letter-spacing:5px}.brand b{color:#67e4c0}.tag{font:9px/1.8 monospace;letter-spacing:1px;color:#5f9295;text-align:right}.intro{position:fixed;left:36px;top:111px;pointer-events:none}h1{font:normal clamp(34px,5vw,62px)/1.04 Georgia;margin:0 0 16px;letter-spacing:-1px}h1 em{color:#64b5b2}.intro p{font:10px/1.8 monospace;color:#658f98}.core-label{position:fixed;left:50%;top:53%;transform:translate(-50%,50px);pointer-events:none;font:8px monospace;letter-spacing:3px;color:#5b9798}.bottom{position:fixed;left:36px;right:36px;bottom:27px;display:flex;justify-content:space-between;align-items:end;gap:20px}.telemetry{display:flex;gap:30px;padding-top:17px;border-top:1px solid #25505766}.telemetry span{font:8px monospace;letter-spacing:1px;color:#547f8a;display:block;margin-bottom:7px}.telemetry b{font:16px monospace;color:#add9cd;font-weight:400}.controls{display:flex;gap:7px;flex-wrap:wrap}button{background:#0d212cbd;border:1px solid #244952;color:#87b7b7;border-radius:4px;font:9px monospace;letter-spacing:1px;padding:11px 14px;cursor:pointer}button[aria-pressed=true]{color:#80e2c5;border-color:#488576}button:focus-visible,canvas:focus-visible{outline:2px solid #87dbc5;outline-offset:4px}@media(max-width:550px){header{left:22px;right:22px;top:24px}.tag{font-size:7px}.brand{font-size:15px;letter-spacing:3px}.intro{left:22px;top:95px}.intro p{font-size:8px}h1{font-size:40px}.bottom{left:22px;right:22px;flex-direction:column;align-items:stretch;bottom:22px;gap:19px}.telemetry{justify-content:space-between}.controls button{flex:1;font-size:8px}.core-label{top:55%}}
</style></head><body><canvas id="field" tabindex="0" aria-label="Particle gravity field. Move to attract, click to create a shockwave, or press space."></canvas><header><span class="brand">ORBITAL<b>®</b></span><span class="tag">EXPERIMENT 003<br>AN INVISIBLE CONNECTION</span></header><section class="intro"><h1>Everything<br><em>finds its orbit.</em></h1><p>MOVE TO ATTRACT. PRESS TO DISRUPT.<br>A SMALL STUDY OF GRAVITY.</p></section><div class="core-label">SINGULARITY · 01</div><div class="bottom"><div class="telemetry"><div><span>PARTICLES</span><b id="count">800</b></div><div><span>FRAME RATE</span><b id="fps">60 FPS</b></div><div><span>MEAN SPEED</span><b id="energy">0 px/s</b></div></div><div class="controls"><button id="mode" aria-pressed="false">MODE: ATTRACT</button><button id="pause" aria-pressed="false">PAUSE</button><button id="reset">RESEED</button></div></div><script>
const c=document.getElementById('field'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let w,h,cx,cy,particles=[],waves=[],pointer={x:0,y:0,on:false},paused=false,repel=false,last=0,frames=0,stamp=0,raf;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let N=reduced?350:800;const GM=2300000;
function seed(){particles=Array.from({length:N},(_,i)=>{const r=38+Math.pow(Math.random(),.65)*Math.min(w,h)*.4,a=Math.random()*Math.PI*2,v=Math.sqrt(GM/r)*(.7+Math.random()*.4);return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,vx:-Math.sin(a)*v,vy:Math.cos(a)*v,depth:.3+Math.random()*.7,hue:155+Math.random()*62};});waves=[];$('count').textContent=N;}
function resize(){w=innerWidth;h=innerHeight;cx=w*.5;cy=h*.53;const d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#07121a';ctx.fillRect(0,0,w,h);seed();}
function shock(x,y){for(const p of particles){const dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy)+12,f=6500/(d+35);p.vx+=dx/d*f;p.vy+=dy/d*f;}waves.push({x,y,r:0,life:1});if(waves.length>10)waves.shift();}
function frame(t){const dt=Math.min((t-last)/1000||.016,.033);last=t;if(!paused){ctx.globalCompositeOperation='source-over';ctx.fillStyle=reduced?'rgba(7,18,26,.4)':'rgba(7,18,26,.05)';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#17384166';ctx.lineWidth=.5;for(const r of [75,145,225]){ctx.beginPath();ctx.ellipse(cx,cy,r,r*.7,0,0,7);ctx.stroke();}ctx.globalCompositeOperation='lighter';let energy=0;
for(const p of particles){const ox=p.x,oy=p.y;for(let step=0;step<2;step++){const dx=cx-p.x,dy=cy-p.y,r2=dx*dx+dy*dy+24*24,f=GM/Math.pow(r2,1.5);let ax=dx*f,ay=dy*f;if(pointer.on){const px=pointer.x-p.x,py=pointer.y-p.y,pr=px*px+py*py+35*35,pf=(repel?-1:1)*400000/Math.pow(pr,1.5);ax+=px*pf;ay+=py*pf;}p.vx+=ax*dt/2;p.vy+=ay*dt/2;const speed=Math.hypot(p.vx,p.vy);if(speed>420){p.vx*=420/speed;p.vy*=420/speed;}p.x+=p.vx*dt/2;p.y+=p.vy*dt/2;}if(p.x< -w*.5||p.x>w*1.5||p.y< -h*.5||p.y>h*1.5){const a=Math.random()*6.28,r=Math.min(w,h)*.4;p.x=cx+Math.cos(a)*r;p.y=cy+Math.sin(a)*r;p.vx=-Math.sin(a)*Math.sqrt(GM/r);p.vy=Math.cos(a)*Math.sqrt(GM/r);continue;}energy+=Math.hypot(p.vx,p.vy);ctx.strokeStyle=`hsla(${p.hue},65%,${65+p.depth*25}%,${p.depth*.8})`;ctx.lineWidth=p.depth*1.8;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(p.x,p.y);ctx.stroke();}
const g=ctx.createRadialGradient(cx,cy,1,cx,cy,45);g.addColorStop(0,'#b8ffdc');g.addColorStop(.1,'#3bb6a644');g.addColorStop(1,'#0b617000');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,45,0,7);ctx.fill();ctx.fillStyle='#b0f0d9';ctx.beginPath();ctx.arc(cx,cy,3,0,7);ctx.fill();waves=waves.filter(v=>v.life>0);for(const v of waves){v.r+=dt*210;v.life-=dt;ctx.strokeStyle=`rgba(130,241,215,${Math.max(0,v.life)*.5})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(v.x,v.y,v.r,0,7);ctx.stroke();}if(pointer.on){ctx.strokeStyle=repel?'#ebad98aa':'#9debd8aa';ctx.beginPath();ctx.arc(pointer.x,pointer.y,8,0,7);ctx.stroke();}frames++;if(t-stamp>600){$('fps').textContent=Math.round(frames*1000/(t-stamp))+' FPS';$('energy').textContent=Math.round(energy/N)+' px/s';frames=0;stamp=t;}}raf=requestAnimationFrame(frame);}
c.onpointermove=e=>{pointer={x:e.clientX,y:e.clientY,on:true};};c.onpointerleave=()=>pointer.on=false;c.onpointerdown=e=>{pointer={x:e.clientX,y:e.clientY,on:true};shock(e.clientX,e.clientY);};c.onpointerup=e=>{if(e.pointerType!=='mouse')pointer.on=false;};c.onpointercancel=()=>pointer.on=false;c.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();shock(cx,cy);}};$('mode').onclick=()=>{repel=!repel;$('mode').textContent='MODE: '+(repel?'REPEL':'ATTRACT');$('mode').setAttribute('aria-pressed',repel);};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE';$('pause').setAttribute('aria-pressed',paused);if(paused)$('fps').textContent='PAUSED';else{stamp=performance.now();frames=0;}};$('reset').onclick=seed;addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden){last=stamp=performance.now();frames=0;raf=requestAnimationFrame(frame);}});resize();raf=requestAnimationFrame(frame);
</script></body></html>
