<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravity Well — 粒子引力实验场</title>
<style>
:root{color-scheme:dark;--ink:#e9f4f3;--muted:#758b92;--cyan:#6debd5;--violet:#9d83ff;--line:#ffffff14}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#05080e;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 25%,#03060a99 100%);box-shadow:inset 0 0 120px #0007}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:28px clamp(20px,4vw,50px);pointer-events:none}.brand{display:flex;align-items:center;gap:13px}.mark{width:34px;height:34px;border:1px solid #6debd560;border-radius:50%;position:relative;box-shadow:inset 0 0 15px #6debd515}.mark:before{content:"";position:absolute;inset:7px;border:1px solid var(--cyan);border-radius:50%;transform:rotate(55deg) scaleY(.35)}.mark:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--cyan);left:14px;top:14px;box-shadow:0 0 12px var(--cyan)}.brand strong{display:block;font-size:11px;letter-spacing:.24em}.brand span{display:block;margin-top:5px;color:var(--muted);font:8px/1 ui-monospace,monospace;letter-spacing:.12em}.status{display:flex;align-items:center;gap:8px;color:var(--cyan);font-size:9px;letter-spacing:.15em}.status i{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.25}}
.panel{position:fixed;right:clamp(16px,4vw,50px);top:50%;transform:translateY(-50%);width:190px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#0a1119b8;backdrop-filter:blur(16px);pointer-events:auto}.panel-title{display:flex;justify-content:space-between;color:var(--muted);font-size:8px;letter-spacing:.17em;padding-bottom:14px;border-bottom:1px solid var(--line)}.metric{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid #ffffff09}.metric span{color:var(--muted);font-size:9px;letter-spacing:.08em}.metric strong{font:500 12px/1 ui-monospace,monospace}.metric strong.accent{color:var(--cyan)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:15px}button{border:1px solid var(--line);border-radius:8px;background:#ffffff04;color:var(--ink);padding:9px 5px;font:600 8px/1 inherit;letter-spacing:.1em;cursor:pointer}button:hover{border-color:#6debd570;color:var(--cyan)}button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.mode{grid-column:1/-1;color:var(--cyan)}
.instruction{position:fixed;left:clamp(20px,4vw,50px);bottom:clamp(24px,5vw,52px);pointer-events:none}.instruction .eyebrow{color:var(--cyan);font-size:8px;letter-spacing:.25em;margin-bottom:10px}.instruction h1{margin:0;font:300 clamp(24px,3.2vw,46px)/1.1 Georgia,"Songti SC",serif;letter-spacing:.08em}.instruction p{margin:12px 0 0;color:var(--muted);font-size:10px;line-height:1.7;letter-spacing:.08em}.instruction p b{color:#c2d2d3;font-weight:500}.coordinates{position:fixed;right:clamp(16px,4vw,50px);bottom:28px;color:#50636b;font:8px/1.6 ui-monospace,monospace;text-align:right;letter-spacing:.1em;pointer-events:none}
@media(max-width:650px){header{padding:18px 16px}.brand span{display:none}.panel{top:auto;right:14px;left:14px;bottom:14px;transform:none;width:auto;padding:12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}.panel-title{grid-column:1/-1;padding-bottom:8px}.metric{padding:9px 0;border:0}.metric{display:block}.metric span{display:block;font-size:7px;margin-bottom:5px}.metric strong{font-size:10px}.controls{grid-column:1/-1;margin-top:5px;grid-template-columns:1fr 1fr 1fr}.mode{grid-column:auto}.instruction{left:18px;bottom:190px}.instruction h1{font-size:26px}.instruction p{font-size:9px}.coordinates{display:none}.status{font-size:8px}}
@media(prefers-reduced-motion:reduce){.status i{animation:none}}
</style>
</head>
<body>
<canvas id="field" aria-label="可交互粒子引力场：按住吸引，点击释放冲击波"></canvas><div class="vignette"></div>
<header><div class="brand"><i class="mark"></i><div><strong>GRAVITY / 引力场</strong><span>N-BODY ORBITAL LABORATORY</span></div></div><div class="status"><i></i><span id="runState">SIMULATION LIVE</span></div></header>
<aside class="panel" aria-label="引力场实时状态"><div class="panel-title"><span>FIELD TELEMETRY</span><span>μ = 9200</span></div><div class="metric"><span>PARTICLES / 粒子</span><strong id="count">000</strong></div><div class="metric"><span>MEAN ENERGY / 能量</span><strong class="accent" id="energy">0.00</strong></div><div class="metric"><span>FRAME RATE / 帧率</span><strong id="fps">60 FPS</strong></div><div class="controls"><button class="mode" id="mode">MODE · ATTRACT</button><button id="pulse">PULSE</button><button id="pause">PAUSE</button><button id="reset">RESET</button></div></aside>
<div class="instruction"><div class="eyebrow">AN EXPERIMENT IN ATTRACTION</div><h1>万物彼此牵引</h1><p><b>按住并拖动</b> 放置临时引力点 · <b>点击</b> 释放冲击波<br>所有粒子遵循连续引力、阻尼与轨道速度</p></div><div class="coordinates">SOFTENING ε² = 144<br>INTEGRATION / SEMI-IMPLICIT EULER</div>
<script>
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),particles=[],waves=[],stars=[];let W,H,dpr,core={x:0,y:0},pointer={x:0,y:0,down:false,active:false},mode='attract',paused=false,last=performance.now(),fpsStart=last,frames=0,energy=0,seed=42017;
const $=id=>document.getElementById(id),MU=9200,TAU=Math.PI*2,rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
function spawn(p,initial=false){const a=rand()*TAU,r=initial?70+rand()*Math.min(W,H)*.43:Math.max(W,H)*(.42+rand()*.15),speed=Math.sqrt(MU/r)*(.82+rand()*.35);p.x=core.x+Math.cos(a)*r;p.y=core.y+Math.sin(a)*r;p.px=p.x;p.py=p.y;p.vx=-Math.sin(a)*speed+(rand()-.5)*.15;p.vy=Math.cos(a)*speed+(rand()-.5)*.15;p.size=.45+rand()*1.55;p.depth=.35+rand()*.65;p.hue=rand()>.83?255:160+rand()*45;p.life=500+rand()*1400;return p}
function reset(){particles.length=0;const n=W<600?190:340;for(let i=0;i<n;i++)particles.push(spawn({},true));$('count').textContent=String(n).padStart(3,'0')}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);core.x=W*(W<650?.5:.46);core.y=H*.48;stars.length=0;for(let i=0;i<110;i++)stars.push({x:rand()*W,y:rand()*H,r:rand()*1.1,a:.08+rand()*.3});ctx.fillStyle='#05080e';ctx.fillRect(0,0,W,H);reset()}
function gravityBody(p,b,dt,strength=1){const dx=b.x-p.x,dy=b.y-p.y,r2=dx*dx+dy*dy+144,r=Math.sqrt(r2),a=MU*strength/r2,sign=mode==='attract'?1:-1;p.vx+=dx/r*a*dt*sign;p.vy+=dy/r*a*dt*sign;return r}
function drawCore(t){const pulse=1+Math.sin(t*.0017)*.035;ctx.save();ctx.translate(core.x,core.y);ctx.globalCompositeOperation='lighter';for(let i=3;i>0;i--){ctx.strokeStyle=`rgba(${i===1?'109,235,213':'95,124,190'},${.07+i*.025})`;ctx.lineWidth=.7;ctx.beginPath();ctx.ellipse(0,0,(48+i*22)*pulse,(15+i*7)*pulse,t*.00008*(i%2?1:-1)+i,0,TAU);ctx.stroke()}const glow=ctx.createRadialGradient(0,0,0,0,0,55);glow.addColorStop(0,'rgba(225,255,249,.95)');glow.addColorStop(.08,'rgba(109,235,213,.85)');glow.addColorStop(.25,'rgba(65,171,176,.25)');glow.addColorStop(1,'rgba(25,68,85,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,55*pulse,0,TAU);ctx.fill();ctx.fillStyle='#dffff7';ctx.beginPath();ctx.arc(0,0,3.4,0,TAU);ctx.fill();ctx.restore()}
function animate(t){requestAnimationFrame(animate);const raw=Math.min(32,t-last);last=t;if(paused)return;const dt=raw/16.667;ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(5,8,14,.19)';ctx.fillRect(0,0,W,H);for(const s of stars){ctx.fillStyle=`rgba(170,200,215,${s.a})`;ctx.fillRect(s.x,s.y,s.r,s.r)}energy=0;
for(const p of particles){p.px=p.x;p.py=p.y;const r=gravityBody(p,core,dt);if(pointer.down){gravityBody(p,pointer,dt,1.8)}p.vx*=Math.pow(.9995,dt);p.vy*=Math.pow(.9995,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;energy+=Math.hypot(p.vx,p.vy);if(r<16||p.x<-100||p.x>W+100||p.y<-100||p.y>H+100||p.life<0)spawn(p);ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`hsla(${p.hue},80%,${55+p.depth*25}%,${.22+p.depth*.6})`;ctx.lineWidth=p.size*p.depth;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke()}
ctx.globalCompositeOperation='lighter';for(let i=waves.length-1;i>=0;i--){const w=waves[i];w.r+=4.5*dt;w.life-=.018*dt;ctx.strokeStyle=`rgba(157,131,255,${Math.max(0,w.life)*.6})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,TAU);ctx.stroke();if(w.life<=0)waves.splice(i,1)}if(pointer.down){ctx.strokeStyle='rgba(109,235,213,.45)';ctx.setLineDash([3,5]);ctx.beginPath();ctx.arc(pointer.x,pointer.y,24+Math.sin(t*.006)*4,0,TAU);ctx.stroke();ctx.setLineDash([])}drawCore(t);frames++;if(t-fpsStart>700){$('fps').textContent=Math.round(frames*1000/(t-fpsStart))+' FPS';$('energy').textContent=(energy/particles.length).toFixed(2);frames=0;fpsStart=t}}
function impulse(x,y){waves.push({x,y,r:8,life:1});if(waves.length>8)waves.shift();for(const p of particles){const dx=p.x-x,dy=p.y-y,r=Math.hypot(dx,dy)+8;if(r<230){const f=(1-r/230)*7;p.vx+=dx/r*f;p.vy+=dy/r*f}}}
function position(e){pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true}
canvas.addEventListener('pointerdown',e=>{position(e);pointer.down=true;canvas.setPointerCapture(e.pointerId);impulse(pointer.x,pointer.y)});canvas.addEventListener('pointermove',position);canvas.addEventListener('pointerup',e=>{pointer.down=false;canvas.releasePointerCapture(e.pointerId)});canvas.addEventListener('pointercancel',()=>pointer.down=false);
$('mode').onclick=()=>{mode=mode==='attract'?'repel':'attract';$('mode').textContent=`MODE · ${mode.toUpperCase()}`;$('mode').style.color=mode==='attract'?'var(--cyan)':'var(--violet)'};$('pulse').onclick=()=>impulse(core.x,core.y);$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE';$('runState').textContent=paused?'SIMULATION PAUSED':'SIMULATION LIVE';last=performance.now()};$('reset').onclick=reset;addEventListener('resize',resize);resize();requestAnimationFrame(animate);
</script>
</body></html>
