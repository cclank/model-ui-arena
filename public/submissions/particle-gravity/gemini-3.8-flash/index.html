<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Gravity Vortex - gemini-3.8-flash</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #020617; overflow: hidden; height: 100vh; width: 100vw;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .hud-panel {
    position: absolute; top: 16px; left: 16px;
    background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
    padding: 12px 16px; color: #f8fafc; font-size: 12px; pointer-events: none;
  }
  .hud-title { font-weight: 700; color: #38bdf8; letter-spacing: 0.05em; margin-bottom: 6px; }
  .hud-item { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 2px; }
  .hud-val { font-family: monospace; font-weight: 600; color: #cbd5e1; }
  .mode-hint {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    color: #94a3b8; font-size: 12px; padding: 6px 16px; border-radius: 999px;
    pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div class="hud-panel">
  <div class="hud-title">GRAVITY WELL TELEMETRY</div>
  <div class="hud-item"><span>粒子总数:</span><span class="hud-val" id="pCount">450</span></div>
  <div class="hud-item"><span>实时帧率:</span><span class="hud-val" id="fpsVal">60 FPS</span></div>
  <div class="hud-item"><span>引力模式:</span><span class="hud-val" id="modeVal" style="color:#38bdf8;">吸引 (ATTRACT)</span></div>
</div>
<div class="mode-hint">拖拽引导引力中心 • 点击切换吸引/排斥</div>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const pCountEl = document.getElementById('pCount');
  const fpsValEl = document.getElementById('fpsVal');
  const modeValEl = document.getElementById('modeVal');

  let w, h;
  const PARTICLE_COUNT = 450;
  const particles = [];
  let isRepelling = false;

  const well = { x: 0, y: 0, targetX: 0, targetY: 0, mass: 650 };

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    if (!well.x) {
      well.x = well.targetX = w / 2;
      well.y = well.targetY = h / 2;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor() { this.init(true); }
    init(randomPos = false) {
      const angle = Math.random() * Math.PI * 2;
      const dist = randomPos ? Math.random() * Math.min(w, h) * 0.45 + 40 : Math.min(w, h) * 0.45;
      this.x = well.x + Math.cos(angle) * dist;
      this.y = well.y + Math.sin(angle) * dist;
      // Perpendicular orbital velocity
      const orbitSpeed = Math.sqrt(well.mass / (dist + 10)) * 0.8;
      this.vx = -Math.sin(angle) * orbitSpeed + (Math.random() - 0.5);
      this.vy = Math.cos(angle) * orbitSpeed + (Math.random() - 0.5);
      this.radius = 1 + Math.random() * 2;
      this.hue = Math.floor(180 + Math.random() * 80); // Cyan to purple
    }
    update() {
      const dx = well.x - this.x;
      const dy = well.y - this.y;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq);

      if (dist < 12) {
        this.init();
        return;
      }

      const force = (well.mass / (distSq + 100)) * (isRepelling ? -1.8 : 1.0);
      this.vx += (dx / dist) * force;
      this.vy += (dy / dist) * force;

      this.vx *= 0.985;
      this.vy *= 0.985;
      this.x += this.vx;
      this.y += this.vy;

      if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) {
        this.init();
      }
    }
    draw() {
      const speed = Math.hypot(this.vx, this.vy);
      ctx.fillStyle = `hsl(${this.hue + speed * 15}, 85%, ${50 + Math.min(speed * 6, 40)}%)`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
  pCountEl.textContent = PARTICLE_COUNT;

  let lastFrame = performance.now();
  let frameCount = 0;
  let fpsTimer = performance.now();

  function loop(now) {
    frameCount++;
    if (now - fpsTimer >= 500) {
      fpsValEl.textContent = `${Math.round((frameCount * 1000) / (now - fpsTimer))} FPS`;
      frameCount = 0;
      fpsTimer = now;
    }

    well.x += (well.targetX - well.x) * 0.1;
    well.y += (well.targetY - well.y) * 0.1;

    ctx.fillStyle = 'rgba(2, 6, 23, 0.25)';
    ctx.fillRect(0, 0, w, h);

    // Draw central gravity core
    ctx.save();
    const coreGrad = ctx.createRadialGradient(well.x, well.y, 4, well.x, well.y, 36);
    const coreColor = isRepelling ? '239, 68, 68' : '56, 189, 248';
    coreGrad.addColorStop(0, `rgba(${coreColor}, 0.9)`);
    coreGrad.addColorStop(0.5, `rgba(${coreColor}, 0.3)`);
    coreGrad.addColorStop(1, `rgba(${coreColor}, 0)`);
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(well.x, well.y, 36, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(loop);
  }

  function handlePointer(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
    const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);
    if (clientX !== undefined) {
      well.targetX = clientX - rect.left;
      well.targetY = clientY - rect.top;
    }
  }

  window.addEventListener('pointermove', handlePointer);
  window.addEventListener('pointerdown', (e) => {
    handlePointer(e);
    isRepelling = !isRepelling;
    modeValEl.textContent = isRepelling ? '排斥 (REPEL)' : '吸引 (ATTRACT)';
    modeValEl.style.color = isRepelling ? '#ef4444' : '#38bdf8';
  });

  requestAnimationFrame(loop);
</script>
</body>
</html>
