<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBITAL / 粒子引力场</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#050b17;color:#e5f5ff;font-family:Arial,"PingFang SC",sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;top:22px;left:25px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.3em;color:#77c9f6}.top h1{font-size:clamp(27px,5vw,49px);font-weight:300;letter-spacing:.1em;margin:9px 0}.top p{color:#8fa8c0;font-size:12px;margin:0}.stats{position:absolute;left:25px;bottom:23px;display:flex;gap:23px;pointer-events:none}.stat small{display:block;font-size:10px;letter-spacing:.19em;color:#7790aa;margin-bottom:6px}.stat strong{font-size:19px;font-variant-numeric:tabular-nums}.legend{position:absolute;right:25px;bottom:26px;color:#9ab4c9;font-size:11px;letter-spacing:.1em;pointer-events:none}.mode{color:#7de2d7}@media(max-width:500px){.top{left:18px;top:16px}.stats{left:18px;bottom:18px;gap:15px}.legend{right:18px;bottom:82px}.top p{max-width:270px}}
</style></head><body><canvas id="space" aria-label="可触摸的粒子引力场"></canvas><div class="top"><div class="eyebrow">INTERACTIVE FIELD / 01</div><h1>ORBITAL</h1><p>移动指针制造引力井 · 轻触释放冲击波</p></div><div class="stats"><div class="stat"><small>PARTICLES</small><strong id="particles"></strong></div><div class="stat"><small>ENERGY</small><strong id="energy"></strong></div><div class="stat"><small>FPS</small><strong id="fps"></strong></div></div><div class="legend">MODE <span class="mode">GRAVITY / WAVE</span></div><script>
const canvas=document.querySelector("#space"),ctx=canvas.getContext("2d"),labels={n:document.querySelector("#particles"),e:document.querySelector("#energy"),f:document.querySelector("#fps")};let W,H,D,core,particles=[],pointer={x:0,y:0,active:false},waves=[],last=0,fpsClock=0,frames=0,fps=60;const N=230;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);core={x:W*.5,y:H*.53};particles=Array.from({length:N},(_,i)=>spawn(i));ctx.fillStyle="#050b17";ctx.fillRect(0,0,W,H)}addEventListener("resize",resize);
function spawn(i){const a=Math.random()*Math.PI*2,r=65+Math.sqrt(Math.random())*Math.min(W,H)*.55,v=Math.sqrt(1800/r);return{x:core.x+Math.cos(a)*r,y:core.y+Math.sin(a)*r,px:0,py:0,vx:-Math.sin(a)*v*(.8+Math.random()*.4),vy:Math.cos(a)*v*(.8+Math.random()*.4),size:.6+Math.random()*1.7,hue:180+Math.random()*80}}
function field(p,x,y,strength,dt){let dx=x-p.x,dy=y-p.y,r2=dx*dx+dy*dy+850,d=Math.sqrt(r2);p.vx+=dx/d*strength/r2*dt;p.vy+=dy/d*strength/r2*dt}
canvas.addEventListener("pointermove",e=>{pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true});canvas.addEventListener("pointerleave",()=>pointer.active=false);canvas.addEventListener("pointerdown",e=>{pointer.x=e.clientX;pointer.y=e.clientY;waves.push({x:pointer.x,y:pointer.y,r:0,life:1});if(waves.length>8)waves.shift()});
function draw(t){let dt=Math.min((t-last)/16.667||1,2);last=t;ctx.fillStyle="rgba(5,11,23,.19)";ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation="lighter";
 const glow=ctx.createRadialGradient(core.x,core.y,2,core.x,core.y,90);glow.addColorStop(0,"#c5ffff");glow.addColorStop(.12,"#59c8ffbb");glow.addColorStop(.42,"#3174ff39");glow.addColorStop(1,"#3174ff00");ctx.fillStyle=glow;ctx.beginPath();ctx.arc(core.x,core.y,90,0,7);ctx.fill();
 for(let i=0;i<N;i++){let p=particles[i];p.px=p.x;p.py=p.y;field(p,core.x,core.y,1800,dt);if(pointer.active)field(p,pointer.x,pointer.y,2500,dt);for(const wave of waves){let dx=p.x-wave.x,dy=p.y-wave.y,d=Math.hypot(dx,dy)||1,band=Math.exp(-Math.pow((d-wave.r)/30,2));p.vx+=dx/d*band*.8*dt;p.vy+=dy/d*band*.8*dt}p.vx*=Math.pow(.999,dt);p.vy*=Math.pow(.999,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;
 if(p.x< -80||p.x>W+80||p.y< -80||p.y>H+80||Math.hypot(p.x-core.x,p.y-core.y)<12){particles[i]=spawn(i);continue}
 ctx.strokeStyle="hsla("+p.hue+",100%,72%,.44)";ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.fillStyle="hsla("+p.hue+",100%,80%,.8)";ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}
 waves=waves.filter(w=>w.life>0);for(const wave of waves){wave.r+=7*dt;wave.life-=.015*dt;ctx.strokeStyle="rgba(132,232,255,"+wave.life*.6+")";ctx.lineWidth=2;ctx.beginPath();ctx.arc(wave.x,wave.y,wave.r,0,7);ctx.stroke()}
 if(pointer.active){ctx.strokeStyle="#a7fff799";ctx.lineWidth=1;ctx.beginPath();ctx.arc(pointer.x,pointer.y,12+Math.sin(t*.005)*3,0,7);ctx.stroke()}
 ctx.globalCompositeOperation="source-over";frames++;if(t-fpsClock>500){fps=Math.round(frames*1000/(t-fpsClock));frames=0;fpsClock=t;labels.n.textContent=N;labels.e.textContent=Math.round(100+waves.length*18+(pointer.active?25:0))+"%";labels.f.textContent=fps}requestAnimationFrame(draw)}
resize();requestAnimationFrame(draw);
</script></body></html>
