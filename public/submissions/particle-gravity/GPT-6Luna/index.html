<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>ORBITAL / Gravity field</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070c12;color:#dce6e5;font:12px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.veil{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 28%,#05090fbb 100%),linear-gradient(180deg,#08121a55,transparent 35%,#060b10aa);pointer-events:none}.head{position:fixed;z-index:1;left:clamp(18px,5vw,52px);top:clamp(20px,5vh,43px)}.brand{font-size:10px;letter-spacing:.23em;color:#a9d6cd}.sub{font-size:8px;color:#637a80;letter-spacing:.17em;margin-top:5px}.telemetry{position:fixed;right:clamp(17px,5vw,52px);top:clamp(20px,5vh,43px);text-align:right}.telemetry span{display:inline-block;margin-left:18px;color:#758d91;font-size:8px;letter-spacing:.12em}.telemetry b{display:block;font:18px ui-monospace,monospace;color:#d3e0db;margin-top:4px}.center{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}.core{width:5px;height:5px;background:#e1f4de;border-radius:50%;margin:auto;box-shadow:0 0 12px 6px #a1d4c3,0 0 45px 22px #59aab182,0 0 120px 50px #42778b45}.caption{color:#a9bdba;font:italic 17px Georgia,serif;margin-top:27px}.caption small{display:block;color:#718a8b;font:8px ui-sans-serif,system-ui;letter-spacing:.16em;margin-top:7px}.controls{position:fixed;z-index:2;left:50%;bottom:22px;transform:translateX(-50%);width:min(560px,calc(100% - 28px));display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid #48616660;border-radius:14px;background:#0c171dd9;backdrop-filter:blur(14px)}.btn{border:1px solid #385057;border-radius:9px;padding:9px 12px;background:#14242a;color:#b9ceca;font:inherit;font-size:9px;cursor:pointer;white-space:nowrap}.btn.active{border-color:#72c1ac;color:#d7f0e5;background:#183a36}.slider{flex:1;min-width:70px}.slider label{display:flex;justify-content:space-between;color:#768d8d;font-size:8px}.slider b{color:#cadbd4;font:9px ui-monospace,monospace}input{display:block;width:100%;accent-color:#8cd3bd}.hint{position:fixed;left:clamp(18px,5vw,52px);bottom:31px;color:#627a7e;font-size:8px;letter-spacing:.12em}.fps{position:fixed;left:clamp(18px,5vw,52px);top:92px;color:#61787c;font:8px ui-monospace,monospace}
@media(max-width:600px){.telemetry{top:20px;right:15px}.telemetry span{margin-left:9px}.telemetry b{font-size:15px}.head{left:15px;top:18px}.fps{left:15px;top:70px}.controls{bottom:10px;padding:8px;gap:6px}.btn{padding:8px 9px}.hint{left:15px;bottom:73px;font-size:7px}.caption{font-size:15px}}
</style></head><body><canvas id="field" aria-label="交互式粒子引力场"></canvas><div class="veil"></div><header class="head"><div class="brand">ORBITAL <span style="color:#59737a">/</span> 引力场</div><div class="sub">A STUDY IN CONTINUOUS MOTION</div></header><div class="telemetry"><span>粒子<b id="count">180</b></span><span>能量<b id="energy">0.84</b></span></div><div class="fps" id="fps">FPS -- · STABLE ORBIT</div><div class="center"><div class="core"></div><div class="caption">微小的星辰，也会找到方向。<small>TOUCH THE FIELD · CHANGE THE ORBIT</small></div></div><div class="hint">点击或拖动，施加一次时空扰动</div><nav class="controls"><button class="btn active" id="mode">引力吸引</button><div class="slider"><label>星尘密度 <b id="densityLabel">180</b></label><input id="density" type="range" min="80" max="320" step="10" value="180"></div><button class="btn" id="pause">暂停</button><button class="btn" id="reset">重置</button></nav>
<script>
const canvas=document.querySelector('#field'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);let w=0,h=0,dpr=1,particles=[],count=180,repel=false,paused=false,last=0,fps=60,pulse=null,pointer=null,energy=.84;function resize(){dpr=Math.min(devicePixelRatio||1,1.7);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);seed()}addEventListener('resize',resize,{passive:true});function seed(){particles=Array.from({length:count},()=>{let a=Math.random()*Math.PI*2,r=18+Math.random()*Math.min(w,h)*.46,v=Math.sqrt(175/(r+28));return{x:w/2+Math.cos(a)*r,y:h/2+Math.sin(a)*r*.63,vx:-Math.sin(a)*v,vy:Math.cos(a)*v*.63,z:.35+Math.random()*.65,tail:[],phase:Math.random()*6.28}})}resize();function interact(e){pulse={x:e.clientX,y:e.clientY,r:0,life:1,sign:repel?1:-1};pointer={x:e.clientX,y:e.clientY}}canvas.addEventListener('pointerdown',interact);canvas.addEventListener('pointermove',e=>{if(e.buttons)pointer={x:e.clientX,y:e.clientY}});$('#mode').onclick=e=>{repel=!repel;e.currentTarget.textContent=repel?'排斥脉冲':'引力吸引';e.currentTarget.classList.toggle('active',!repel)};$('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'继续':'暂停';if(!paused)last=performance.now()};$('#reset').onclick=()=>{seed();pulse=null};$('#density').oninput=e=>{count=+e.target.value;$('#densityLabel').textContent=count;$('#count').textContent=count;seed()};function frame(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;fps=fps*.9+(1/dt)*.1;$('#fps').textContent=`FPS ${Math.round(fps)} · ${paused?'PAUSED':fps<38?'PERFORMANCE ALERT':'STABLE ORBIT'}`;if(!paused){ctx.fillStyle='rgba(5,10,16,.18)';ctx.fillRect(0,0,w,h);let cx=w/2,cy=h/2;if(pointer&&pulse&&pulse.life>.75){cx=w/2;cy=h/2}let sum=0;for(let p of particles){let dx=cx-p.x,dy=(cy-p.y)*1.16,r2=dx*dx+dy*dy+100,r=Math.sqrt(r2),pull=(repel?-.95:1.05)/(r2*.012+10);p.vx+=dx/r*pull*dt*60;p.vy+=dy/r*pull*dt*60;p.vx*=.999;p.vy*=.999;if(pulse){let px=p.x-pulse.x,py=p.y-pulse.y,pr=Math.hypot(px,py)+1,force=pulse.sign*Math.exp(-(((pr-pulse.r)/76)**2))*.34;p.vx+=px/pr*force*dt*60;p.vy+=py/pr*force*dt*60}p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.phase+=dt*1.8;p.tail.push([p.x,p.y]);if(p.tail.length>6)p.tail.shift();if(Math.hypot(p.x-cx,p.y-cy)>Math.max(w,h)*.7){let a=Math.random()*6.28,rr=20+Math.random()*40;p.x=cx+Math.cos(a)*rr;p.y=cy+Math.sin(a)*rr;p.vx=-Math.sin(a)*2;p.vy=Math.cos(a)*2;p.tail=[]}let hue=164+p.z*34+Math.sin(p.phase)*8;ctx.beginPath();ctx.moveTo(p.x,p.y);for(let q=p.tail.length-1;q>=0;q--)ctx.lineTo(p.tail[q][0],p.tail[q][1]);ctx.strokeStyle=`hsla(${hue},58%,68%,${.08+p.z*.24})`;ctx.lineWidth=.6+p.z;ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,.55+p.z*1.25,0,Math.PI*2);ctx.fillStyle=`hsla(${hue},67%,${72+p.z*15}%,${.45+p.z*.5})`;ctx.fill();sum+=Math.min(1,Math.hypot(p.vx,p.vy)/3)}energy=sum/particles.length}if(pulse){pulse.r+=720*dt;pulse.life-=dt*.72;if(pulse.life<=0)pulse=null}else pointer=null;$('#energy').textContent=energy.toFixed(2);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
