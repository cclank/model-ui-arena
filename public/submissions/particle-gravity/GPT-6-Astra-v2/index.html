<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attraction — An orbital playground</title>
<!-- 金铜粒子围绕暗核形成具有深度的连续轨道，配以极简天体实验界面。
     软化中心引力配合半隐式积分，指针可吸引或排斥，点击产生冲击波。
     固定粒子预算、自适应画布分辨率、触屏控制及可暂停模拟。 -->
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;overflow:hidden;background:#0e1015;color:#eae0cd;font-family:Arial,Helvetica,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}main{position:relative;min-height:100svh;pointer-events:none;padding:30px 35px;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center}.brand{font:10px monospace;letter-spacing:3px;color:#bba997}.tag{font:8px monospace;letter-spacing:1px;color:#80756c}.intro{margin-top:43px}.eyebrow{font:8px monospace;letter-spacing:2px;color:#796d62}h1{font:normal clamp(42px,6vw,62px)/1.1 Georgia,serif;margin:11px 0 13px;letter-spacing:-2px}h1 em{font-style:italic;color:#c0a282}p{font-size:11px;color:#9c9183;margin:0;line-height:1.8}.bottom{margin-top:auto;padding-top:260px}.telemetry{display:flex;gap:30px;margin-bottom:23px}.telemetry div{min-width:65px}.telemetry span{display:block;font:7px monospace;letter-spacing:1.7px;color:#847363}.telemetry b{display:block;font:18px monospace;color:#d8c5a4;font-weight:400;margin-top:8px}.telemetry b small{font:8px monospace;color:#7d705c}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #b295692b;padding-top:18px;pointer-events:auto}button{font:9px monospace;border:1px solid #78695155;border-radius:25px;background:#11151aba;color:#a8957d;padding:12px 16px;cursor:pointer;backdrop-filter:blur(10px)}button:hover{border-color:#ccb58b}button:focus-visible{outline:2px solid #ddc094;outline-offset:4px}button[aria-pressed=true]{background:#d5bb95;color:#34271c;border-color:#d5bb95}.modes{display:flex;gap:7px}.actions{display:flex;gap:7px}.legend{font:8px monospace;color:#7d705e;letter-spacing:1px;margin-top:17px;display:flex;justify-content:space-between}.core-label{position:absolute;top:49%;left:50%;transform:translate(-50%,-50%);font:7px monospace;letter-spacing:2px;color:#b99b724d;text-align:center;line-height:2.2}.core-label span{display:block;width:4px;height:4px;border-radius:50%;background:#dec295;margin:0 auto 8px;box-shadow:0 0 15px #efb369}
@media(max-width:450px){main{padding:24px}.intro{margin-top:32px}h1{font-size:44px}.bottom{padding-top:250px}.telemetry{gap:22px}.telemetry b{font-size:17px}button{padding:11px 12px;font-size:8px}.modes,.actions{gap:5px}.toolbar{gap:8px}.legend{font-size:7px;letter-spacing:.5px}.brand{font-size:9px}.tag{font-size:7px}.core-label{top:50%}}
</style>
<canvas id="field" role="img" aria-label="Interactive particle gravity field. Move to attract particles, click to create a shockwave."></canvas><main><header><span class="brand">ORBITAL STUDIES</span><span class="tag">EXPERIMENT / 03</span></header><div class="intro"><div class="eyebrow">A STUDY IN INVISIBLE FORCES</div><h1>A little<br><em>attraction.</em></h1><p>Move to bend an orbit.<br>Touch to make a ripple.</p></div><div class="core-label"><span></span>THE QUIET<br>AT THE CENTER</div><div class="bottom"><section class="telemetry" aria-label="Simulation telemetry"><div><span>PARTICLES</span><b id="count">720</b></div><div><span>MEAN ENERGY</span><b id="energy">0.00</b></div><div><span>FRAME RATE</span><b id="fps">60 <small>FPS</small></b></div></section><div class="toolbar"><div class="modes" role="group" aria-label="Pointer force"><button id="attract" aria-pressed="true">+ Attract</button><button id="repel" aria-pressed="false">− Repel</button></div><div class="actions"><button id="reset">Reset</button><button id="pause" aria-pressed="false">Pause</button></div></div><div class="legend"><span>SOFTENED GRAVITY · LIVE SIMULATION</span><span id="mode">POINTER / ATTRACT</span></div></div></main>
<script>
const $=id=>document.getElementById(id),canvas=$('field'),ctx=canvas.getContext('2d');let w,h,cx,cy,scale,particles=[],rings=[],pointer={x:0,y:0,on:false},force=1,paused=false,last=0,raf,seed=94127,fps=60,previousReport=0;const G=12500,reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}function particle(){const radius=50+Math.pow(rand(),.65)*135,a=rand()*Math.PI*2,v=Math.sqrt(G/radius)*(.8+rand()*.35);return{x:Math.cos(a)*radius,y:Math.sin(a)*radius,vx:-Math.sin(a)*v,vy:Math.cos(a)*v,z:.4+rand()*.6,size:.4+rand()*.9,hue:24+rand()*22,px:0,py:0}}
function reset(){seed=94127;particles=Array.from({length:reduced?320:w<600?560:860},particle);rings=[];$('count').textContent=particles.length;ctx.fillStyle='#0e1015';ctx.fillRect(0,0,w,h)}function resize(){w=innerWidth;h=innerHeight;cx=w/2;cy=h*.5;scale=Math.min(w*.46,h*.26)/200;const d=Math.min(devicePixelRatio,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);reset()}addEventListener('resize',resize);resize();
function setPointer(e){pointer.x=(e.clientX-cx)/scale;pointer.y=(e.clientY-cy)/scale;pointer.on=true}canvas.onpointermove=setPointer;canvas.onpointerleave=()=>pointer.on=false;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);setPointer(e);rings.push({x:pointer.x,y:pointer.y,r:1,life:1});if(rings.length>8)rings.shift();for(const p of particles){const dx=p.x-pointer.x,dy=p.y-pointer.y,d=Math.hypot(dx,dy)+8,k=Math.min(30,1800/d);p.vx+=dx/d*k;p.vy+=dy/d*k}};canvas.onpointerup=e=>{if(e.pointerType!=='mouse')pointer.on=false};canvas.onpointercancel=()=>pointer.on=false;
function mode(n){force=n;$('attract').setAttribute('aria-pressed',n===1);$('repel').setAttribute('aria-pressed',n===-1);$('mode').textContent='POINTER / '+(n===1?'ATTRACT':'REPEL')}$('attract').onclick=()=>mode(1);$('repel').onclick=()=>mode(-1);$('reset').onclick=reset;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';$('pause').setAttribute('aria-pressed',paused);$('mode').textContent=paused?'SIMULATION PAUSED':'POINTER / '+(force===1?'ATTRACT':'REPEL')};
function draw(t){const real=Math.min(.05,(t-last)/1000||.0167);last=t;fps=fps*.96+Math.min(120,1/real)*.04;const dt=real*2.4;ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(14,16,21,${1-Math.pow(.84,real*60)})`;if(!paused)ctx.fillRect(0,0,w,h);if(!paused){ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);ctx.strokeStyle='#b49a6730';ctx.lineWidth=.45;for(const r of [68,122,192]){ctx.beginPath();ctx.ellipse(0,0,r,r*.73,-.28,0,Math.PI*2);ctx.stroke()}let energy=0;
for(const p of particles){p.px=p.x;p.py=p.y;for(let s=0;s<2;s++){const r2=p.x*p.x+p.y*p.y+144,inv=G/Math.pow(r2,1.5);let ax=-p.x*inv,ay=-p.y*inv;if(pointer.on){const dx=pointer.x-p.x,dy=pointer.y-p.y,f=force*4200/Math.pow(dx*dx+dy*dy+900,1.5);ax+=dx*f;ay+=dy*f}p.vx+=ax*dt/2;p.vy+=ay*dt/2;p.x+=p.vx*dt/2;p.y+=p.vy*dt/2}if(Math.hypot(p.x,p.y)>430){Object.assign(p,particle());p.px=p.x;p.py=p.y}energy+=p.vx*p.vx+p.vy*p.vy;ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`hsla(${p.hue},${32+p.z*30}%,${40+p.z*33}%,${.35+p.z*.55})`;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();if(p.z>.9){ctx.fillStyle='#d8c5a0';ctx.fillRect(p.x,p.y,1.1,1.1)}}
for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=dt*125;r.life-=dt*.36;if(r.life<=0){rings.splice(i,1);continue}ctx.strokeStyle=`rgba(242,204,141,${r.life*.42})`;ctx.lineWidth=.8;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke()}ctx.globalCompositeOperation='source-over';const core=ctx.createRadialGradient(0,0,4,0,0,42);core.addColorStop(0,'#0d1016');core.addColorStop(.64,'#0d1016ef');core.addColorStop(1,'#0d101600');ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,0,42,0,Math.PI*2);ctx.fill();ctx.restore();if(t-previousReport>500){$('energy').textContent=(energy/particles.length/100).toFixed(2);$('fps').innerHTML=Math.round(fps)+' <small>FPS</small>';previousReport=t}}raf=requestAnimationFrame(draw)}
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);pointer.on=false;if(!document.hidden){last=performance.now();raf=requestAnimationFrame(draw)}});raf=requestAnimationFrame(draw);
</script></html>
