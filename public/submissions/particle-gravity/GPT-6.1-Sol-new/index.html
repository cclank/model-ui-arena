<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBIT / An invisible conversation</title>
<!-- 设计说明：冷白星尘环绕琥珀核心，像一张可触摸的天体观测图。
软化引力、连续速度和切向初速形成稳定轨道；指针施加局部力。
点击触发冲击波，模式可切换吸引和排斥，实时显示帧率与能量。 -->
<style>
*{box-sizing:border-box}body{margin:0;height:100svh;background:#091014;color:#e6ece8;font-family:Arial,"PingFang SC",sans-serif;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:32px 38px;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:18px;font-weight:600;letter-spacing:6px}.brand small{display:block;font:8px monospace;letter-spacing:2px;color:#5e777a;margin-top:8px}.status{font:9px monospace;color:#86a4a3;letter-spacing:2px}.status:before{content:"";display:inline-block;width:5px;height:5px;background:#9bbda6;border-radius:50%;margin-right:8px}.copy{position:absolute;top:20%;left:38px;max-width:220px}.copy h1{font:italic 38px Georgia,serif;line-height:1.15;font-weight:400;color:#d7e1db;margin:0 0 18px}.copy p{font-size:10px;line-height:2;color:#698287;letter-spacing:2px}.bottom{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.stats{display:flex;gap:30px}.stat label{display:block;font:8px monospace;letter-spacing:2px;color:#557078;margin-bottom:8px}.stat b{font:22px monospace;font-weight:400;color:#b7cec5}.stat small{font-size:10px;color:#658386}.controls{pointer-events:auto;display:flex;gap:6px;align-items:center;padding:5px;border:1px solid #2b4147;border-radius:30px;background:#0c1920c9;backdrop-filter:blur(10px)}button{font:10px Arial;color:#7e9c9b;cursor:pointer;border:0;padding:10px 15px;border-radius:25px;background:transparent}.active{background:#213b3a;color:#c3dec8}button:focus-visible{outline:2px solid #c0d8b6}.hint{position:absolute;right:38px;bottom:105px;font:8px monospace;color:#4d6971;letter-spacing:2px;writing-mode:vertical-rl}.core-label{position:absolute;top:calc(50% + 72px);left:50%;transform:translateX(-50%);font:8px monospace;letter-spacing:3px;color:#aa8c63;text-align:center}.reticle{position:absolute;left:50%;top:50%;width:130px;height:130px;transform:translate(-50%,-50%);border:1px solid #aa875a25;border-radius:50%}.reticle:before{content:"";position:absolute;left:-12px;right:-12px;top:50%;height:1px;background:linear-gradient(90deg,#aa875a50 12px,transparent 12px,transparent calc(100% - 12px),#aa875a50 0)}
@media(max-width:600px){.ui{padding:24px 22px}.copy{left:22px;top:17%;max-width:190px}.copy h1{font-size:29px}.copy p{font-size:9px}.bottom{flex-direction:column;align-items:stretch;gap:20px}.stats{justify-content:space-between;gap:15px}.stat b{font-size:19px}.controls{align-self:center}button{padding:10px 16px}.status{font-size:7px;letter-spacing:1px}.hint{right:22px;bottom:165px}.core-label{font-size:7px}.brand{font-size:16px}.copy{opacity:.8}}
</style></head><body><canvas id="field" aria-label="可交互粒子引力场"></canvas><main class="ui"><header class="top"><div class="brand">ORBIT<small>GRAVITATIONAL OBSERVATORY / 01</small></div><div class="status">SYSTEM IN MOTION</div></header><section class="copy"><h1>An invisible<br>conversation.</h1><p>每一次靠近，都改变轨迹。<br>移动指针施力 · 点击释放冲击波</p></section><div class="reticle"></div><div class="core-label">SINGULARITY / 01</div><div class="hint">TOUCH THE FIELD</div><footer class="bottom"><div class="stats"><div class="stat"><label>PARTICLES</label><b id="number"></b></div><div class="stat"><label>ENERGY</label><b id="energy">0.0</b><small> k</small></div><div class="stat"><label>FRAME RATE</label><b id="fps">60</b><small> fps</small></div></div><div class="controls"><button class="active" id="attract">吸引</button><button id="repel">排斥</button><button id="reset">重置星群</button></div></footer></main>
<script>
const c=document.querySelector('#field'),ctx=c.getContext('2d'),$=s=>document.querySelector(s);let w,h,dpr,cx,cy,ps=[],waves=[],pointer={active:false,x:0,y:0},mode=1,last=0,fps=60,report=0;const N=innerWidth<600?550:1000;
function seed(){ps=Array.from({length:N},()=>{let a=Math.random()*Math.PI*2,r=(.18+Math.random()*.3)*Math.min(w,h),speed=Math.sqrt(185000/(r+15));return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,vx:-Math.sin(a)*speed,vy:Math.cos(a)*speed,z:Math.random(),hue:Math.random()}});$('#number').textContent=N}
function resize(){w=innerWidth;h=innerHeight;cx=w/2;cy=h/2;dpr=Math.min(devicePixelRatio,2);c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#091014';ctx.fillRect(0,0,w,h);seed()}resize();addEventListener('resize',resize);c.onpointermove=e=>{pointer={active:true,x:e.clientX,y:e.clientY}};c.onpointerleave=()=>pointer.active=false;c.onpointerup=e=>{if(e.pointerType!=='mouse')pointer.active=false};c.onpointerdown=e=>{pointer={active:true,x:e.clientX,y:e.clientY};waves.push({x:e.clientX,y:e.clientY,r:0,age:0});if(waves.length>8)waves.shift();for(let p of ps){let dx=p.x-e.clientX,dy=p.y-e.clientY,r=Math.hypot(dx,dy)+8,f=85*Math.exp(-r/220);p.vx+=dx/r*f;p.vy+=dy/r*f}};
$('#attract').onclick=()=>setMode(1);$('#repel').onclick=()=>setMode(-1);function setMode(v){mode=v;$('#attract').classList.toggle('active',v===1);$('#repel').classList.toggle('active',v===-1)}$('#reset').onclick=()=>{waves=[];pointer.active=false;seed()};
function frame(t){let raw=(t-last)/1000||1/60,dt=Math.min(.035,raw);last=t;fps=fps*.96+Math.min(120,1/raw)*.04;ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(9,16,20,${1-Math.exp(-dt*3.1)})`;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#36525818';ctx.lineWidth=1;for(let r of [.18,.3,.42]){ctx.beginPath();ctx.ellipse(cx,cy,Math.min(w,h)*r,Math.min(w,h)*r*.65,-.28,0,Math.PI*2);ctx.stroke()}ctx.globalCompositeOperation='lighter';let energy=0;for(let p of ps){let dx=cx-p.x,dy=cy-p.y,r2=dx*dx+dy*dy+700,f=185000/Math.pow(r2,1.5);p.vx+=dx*f*dt;p.vy+=dy*f*dt;if(pointer.active){let ux=pointer.x-p.x,uy=pointer.y-p.y,u2=ux*ux+uy*uy+2500,g=mode*230000/Math.pow(u2,1.5);p.vx+=ux*g*dt;p.vy+=uy*g*dt}let drag=Math.exp(-dt*.025);p.vx*=drag;p.vy*=drag;let ox=p.x,oy=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x< -150||p.x>w+150||p.y< -150||p.y>h+150||Math.hypot(p.x-cx,p.y-cy)<10){let a=Math.random()*Math.PI*2,r=Math.min(w,h)*(.3+Math.random()*.14),s=Math.sqrt(185000/r);p.x=cx+Math.cos(a)*r;p.y=cy+Math.sin(a)*r;p.vx=-Math.sin(a)*s;p.vy=Math.cos(a)*s;ox=p.x;oy=p.y}energy+=(p.vx*p.vx+p.vy*p.vy)/2;ctx.globalAlpha=.3+p.z*.65;ctx.strokeStyle=p.hue>.83?'#d4a970':p.hue>.4?'#8ac8c8':'#d2dfd2';ctx.lineWidth=.5+p.z;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(p.x,p.y);ctx.stroke();if(p.z>.8){ctx.fillStyle='#edf4d2';ctx.fillRect(p.x,p.y,1,1)}}ctx.globalAlpha=1;let g=ctx.createRadialGradient(cx,cy,0,cx,cy,45);g.addColorStop(0,'#ffedbb');g.addColorStop(.12,'#eab673aa');g.addColorStop(.38,'#9b5f2928');g.addColorStop(1,'#6a431000');ctx.fillStyle=g;ctx.fillRect(cx-45,cy-45,90,90);for(let i=waves.length-1;i>=0;i--){let v=waves[i];v.age+=dt;v.r+=240*dt;if(v.age>1.5){waves.splice(i,1);continue}ctx.strokeStyle=`rgba(172,216,196,${(1-v.age/1.5)*.45})`;ctx.beginPath();ctx.arc(v.x,v.y,v.r,0,Math.PI*2);ctx.stroke()}if(t-report>250){report=t;$('#energy').textContent=(energy/N/1000).toFixed(1);$('#fps').textContent=Math.round(fps)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
