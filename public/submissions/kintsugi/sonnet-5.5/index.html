<title>金缮 · 碎而复合的青瓷碗</title>
<!--
  金缮 KINTSUGI —— 一只会被打碎、又以金缮之法自我修复的青瓷碗（单文件 · 零依赖 · Canvas 2D + WebAudio）
  ─ 断裂：每次点击都以点击点为中心实时生成种子（放射环 + 泊松补点，越近越密），对碗的剪影多边形做 Voronoi 剖分
    （逐个半平面裁剪），共享边加入确定性抖动后同时写入相邻两片，因此碎片严丝合缝、拼起来就是原碗；15–60 片。
  ─ 坠落：碎片是刚体（质心/转动惯量由多边形算出），凸包 SAT + 参考面裁剪求接触流形，序列冲量求解摩擦与弹跳，
    与案几/边界碰撞；速度阈值内静止，不再抖动。
  ─ 修复：碎片按目标高度自下而上飞回原位；随后每条裂缝以一条“液态金线”从靠近碰撞点的一端向另一端生长，
    完成后一次金光扫过，金线烘焙进碗釉贴图，下一次碎裂时旧金线随碎片一起碎、新裂纹再叠加新的金线。
-->

$('#repair').onclick = () => { if (S.state === 'rest') startReturn(); };

addEventListener('resize', layout);

/* ═════════════ 主循环 ═════════════ */
function drawShard(c, b, o = {}) {

}

  ctx.save(); ctx.translate(BX + D * .06, floorY + 2); ctx.scale(1, .16); const g = ctx.createRadialGradient(0, 0, D * .05, 0, 0, D * .78); g.addColorStop(0, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, D * .78, 0, TAU); ctx.fill(); ctx.restore();

let refl = null;
function drawReflection() {                                   // 案几漆面倒影：以桌面为镜面翻转重绘，再叠一层自上而下渐隐的遮罩
  const h = Math.ceil(D * .62), ym = floorY + 1; if (!refl || refl.width !== cv.width || refl.height !== Math.ceil(h * dpr)) { refl = document.createElement('canvas'); refl.width = cv.width; refl.height = Math.ceil(h * dpr); }

}
function tipAt(s, f) { const target = s.len * f; let i = 1; while (i < s.pts.length - 1 && s.cum[i] < target) i++; const a = s.pts[i - 1], b = s.pts[i], t = clamp((target - s.cum[i - 1]) / (s.cum[i] - s.cum[i - 1] || 1), 0, 1); return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
function drawCracks() {                                       // 碎裂前的一瞬：暗色裂纹从点击点向外扩展
  ctx.save(); ctx.translate(BX, BY); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
