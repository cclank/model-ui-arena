  for(let i=0;i<28;i++){const a=Math.random()*Math.PI*2,v=35+Math.random()*190;dustChips.push({x:point[0],y:point[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v-70,age:0,node:make('path',{d:'M-1 -2L2 0L0 2Z',fill:i%4?'#bad2b1':'#d7b66d'},$('chips'))})}
  $('count-pieces').textContent=String(bodies.length).padStart(2,'0');$('count-seams').textContent=String(seams.length).padStart(2,'0');$('impact-mark').setAttribute('transform',`translate(${point[0]} ${point[1]})`);$('impact-mark').setAttribute('opacity','.7');setPhase('falling');accumulator=0;settledFor=0;playBreak();
}
function transformed(b){const c=Math.cos(b.angle),s=Math.sin(b.angle);return b.local.map(p=>[c*p[0]-s*p[1],s*p[0]+c*p[1]])}
function physics(b,dt){if(b.sleep)return;b.vy+=GRAVITY*dt;b.vx*=Math.exp(-.17*dt);b.omega*=Math.exp(-.2*dt);b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle+=b.omega*dt;
  const vertices=transformed(b);let low=vertices[0],left=Infinity,right=-Infinity;for(const v of vertices){if(v[1]>low[1])low=v;left=Math.min(left,v[0]);right=Math.max(right,v[0])}const wall=mobile.matches?165:45;if(b.x+left<wall){b.x=wall-left;b.vx=Math.abs(b.vx)*.3}if(b.x+right>1000-wall){b.x=1000-wall-right;b.vx=-Math.abs(b.vx)*.3}
  if(b.y+low[1]>=FLOOR-0.01){b.y=FLOOR-low[1];const speed=b.vy+b.omega*low[0];if(speed>0){const restitution=speed>45?.27:0,j=-(1+restitution)*speed/(1+low[0]**2/b.inertia);b.vy+=j;b.omega+=low[0]*j/b.inertia;const tangent=b.vx-b.omega*low[1],jt=clamp(-tangent/(1+low[1]**2/b.inertia),-.48*Math.abs(j),.48*Math.abs(j));b.vx+=jt;b.omega-=low[1]*jt/b.inertia;if(speed>65&&b.contacts<3)playTick(b.area,speed);b.contacts++}b.vx*=Math.exp(-2.8*dt);b.omega*=Math.exp(-3.8*dt);if(Math.abs(b.vx)+Math.abs(b.vy)<20&&Math.abs(b.omega)<.5)b.quiet+=dt;else b.quiet=0;if(b.quiet>.18||elapsed>3.3){b.sleep=true;b.vx=b.vy=b.omega=0}}
  // Enforce nonpenetration after every fixed step, also during the final sleep frame.
  let bottom=-Infinity;for(const p of transformed(b))bottom=Math.max(bottom,b.y+p[1]);if(bottom>FLOOR)b.y-=bottom-FLOOR;
}
function beginReturn(){if(!['falling','resting'].includes(phase))return;for(const b of bodies){b.from={x:b.x,y:b.y,angle:b.angle};b.delay=Math.random()*.2;b.sleep=true}setPhase('returning');$('chips').replaceChildren();dustChips=[];playTone(392,.25,.024);}
function beginGold(){for(const b of bodies){b.x=b.cx;b.y=b.cy;b.angle=0;updateBody(b)}$('piece-shadows').replaceChildren();$('bowl-shadow').setAttribute('opacity','1');$('reflection').setAttribute('opacity','.055');$('new-gold').replaceChildren();
  for(const seam of seams){const d=`M${seam.a[0]} ${seam.a[1]}L${seam.b[0]} ${seam.b[1]}`;seam.delay=seam.distance/370*.85;seam.duration=.5+Math.hypot(seam.a[0]-seam.b[0],seam.a[1]-seam.b[1])/180;seam.glow=make('path',{d,class:'gold-path',stroke:'#deb864','stroke-width':5,opacity:.11,pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1,filter:'url(#soft)'},$('new-gold'));seam.line=make('path',{d,class:'gold-path',stroke:'url(#metal)','stroke-width':1.75,pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1},$('new-gold'));seam.highlight=make('path',{d,class:'gold-path',stroke:'#fff3c7','stroke-width':.38,opacity:.57,pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1},$('new-gold'));seam.bead=make('circle',{cx:seam.a[0],cy:seam.a[1],r:2.3,fill:'#f8e5a0',opacity:0},$('new-gold'));}
  setPhase('gilding');
}
function finishGold(){for(const s of seams){s.bead.remove();for(const n of [s.glow,s.line,s.highlight]){n.removeAttribute('stroke-dasharray');n.removeAttribute('stroke-dashoffset')}}while($('new-gold').firstChild)history.append($('new-gold').firstChild);shardLayer.replaceChildren();clips.replaceChildren();whole.style.visibility='visible';repairs++;$('count-repairs').textContent=String(repairs).padStart(2,'0');setPhase('healed');playBell();}
function reset(){setPhase('ready');bodies=[];seams=[];dustChips=[];current=null;repairs=0;history.replaceChildren();clips.replaceChildren();for(const id of ['shards','chips','piece-shadows','new-gold'])$(id).replaceChildren();whole.style.visibility='visible';$('bowl-shadow').setAttribute('opacity','1');$('reflection').setAttribute('opacity','.055');$('gold-sweep').setAttribute('opacity','0');$('impact-mark').setAttribute('opacity','0');for(const id of ['count-pieces','count-seams','count-repairs'])$(id).textContent='00';}
function tick(now){const dt=last?Math.min((now-last)/1000,.06):0;last=now;elapsed+=dt;
  if(phase==='falling'){accumulator+=dt;while(accumulator>=STEP){for(const b of bodies)physics(b,STEP);accumulator-=STEP}for(const b of bodies)updateBody(b);$('impact-ring').setAttribute('r',3+elapsed*130);$('impact-mark').setAttribute('opacity',Math.max(0,.7-elapsed*2));if(bodies.every(b=>b.sleep)){setPhase('resting');settledFor=0}}
  else if(phase==='resting'){settledFor+=dt;if(settledFor>1.25)beginReturn()}
  else if(phase==='returning'){let done=true;for(const b of bodies){const t=clamp((elapsed-b.delay)/returnDuration),e=ease(t);b.x=lerp(b.from.x,b.cx,e);b.y=lerp(b.from.y,b.cy,e)-Math.sin(Math.PI*t)*46;b.angle=b.from.angle*(1-e);if(t<1)done=false;updateBody(b)}if(done)beginGold()}
  else if(phase==='gilding'){for(const s of seams){const p=clamp((elapsed-s.delay)/s.duration);for(const n of [s.glow,s.line,s.highlight])n.setAttribute('stroke-dashoffset',1-p);s.bead.setAttribute('cx',lerp(s.a[0],s.b[0],p));s.bead.setAttribute('cy',lerp(s.a[1],s.b[1],p));s.bead.setAttribute('opacity',p>0&&p<1?.85:0)}if(elapsed>2.6)finishGold()}
  else if(phase==='healed'){const t=elapsed/1.5;$('gold-sweep').setAttribute('x',lerp(170,930,clamp(t)));$('gold-sweep').setAttribute('opacity',t<1?Math.sin(t*Math.PI)*.55:0)}
  for(const p of dustChips){p.age+=dt;p.vy+=650*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>FLOOR){p.y=FLOOR;p.vy*=-.2;p.vx*=.6}p.node.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${p.age*160})`);p.node.setAttribute('opacity',clamp(1-p.age/1.6))}
  requestAnimationFrame(tick);
}
svg.addEventListener('click',event=>{const matrix=svg.getScreenCTM();if(!matrix)return;const p=new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse());if(inside([p.x,p.y]))breakBowl([p.x,p.y])});
svg.addEventListener('keydown',e=>{if(e.code==='Enter'||e.code==='Space'){e.preventDefault();breakBowl([500,360])}});
$('repair').onclick=beginReturn;$('reset').onclick=reset;
document.addEventListener('visibilitychange',()=>{last=0;accumulator=0});
const mobile=matchMedia('(max-width:760px)');function resizeStage(){svg.setAttribute('viewBox',mobile.matches?'130 0 740 680':'0 0 1000 680')}mobile.addEventListener('change',resizeStage);resizeStage();
// Gesture-gated procedural audio. No sound files or network requests.
let sound=false,audio=null,lastTick=0;
function getAudio(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audio=new AC()}if(audio.state==='suspended')audio.resume().catch(()=>{});return audio}
function playTone(freq,duration,gain=.035,delay=0){if(!sound)return;const ctx=getAudio();if(!ctx)return;const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.00001,t);g.gain.exponentialRampToValueAtTime(gain,t+.004);g.gain.exponentialRampToValueAtTime(.00001,t+duration);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration+.02);o.onended=()=>{o.disconnect();g.disconnect()}}
function playBreak(){if(!sound)return;const ctx=getAudio();if(!ctx)return;const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.065),ctx.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length)**3;const source=ctx.createBufferSource(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();source.buffer=b;gain.gain.value=.18;filter.type='highpass';filter.frequency.value=1800;source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);source.start();source.onended=()=>{source.disconnect();gain.disconnect();filter.disconnect()};[1470,2211,3280].forEach((f,i)=>playTone(f,.19,.038/(i+1)));}
function playTick(area,speed){if(!sound||performance.now()-lastTick<45)return;lastTick=performance.now();playTone(750+18000/Math.sqrt(area),.1,.012*clamp(speed/150,.2,1))}
function playBell(){[523.25,1046.5,1569.75,2093].forEach((f,i)=>playTone(f,2.1-i*.27,.045/(i+1),i*.018))}
$('sound').onclick=function(){sound=!sound;if(sound)getAudio();this.setAttribute('aria-pressed',sound);this.setAttribute('aria-label',sound?'关闭声音':'开启声音');$('sound-label').textContent=sound?'声音开启':'声音关闭';if(sound)playTone(1046.5,.4,.025)};
// Stable ceramic microtexture, independent of random fracture geometry.
let grainSeed=79;const grainRandom=()=>((grainSeed=Math.imul(grainSeed,1664525)+1013904223>>>0)/4294967296);
for(let i=0;i<580;i++){const x=280+grainRandom()*440,y=230+grainRandom()*263;if(inside([x,y]))make('circle',{cx:x,cy:y,r:.23+grainRandom()*.65,fill:i%3?'#dce4c1':'#254d3d'},$('glaze-speckle'))}
for(let i=0;i<19;i++)make('circle',{cx:160+grainRandom()*680,cy:150+grainRandom()*340,r:.6+grainRandom()*.6,class:'dust',style:`--dur:${7+grainRandom()*9}s;--delay:${-grainRandom()*12}s`},$('dust'));
// Read-only diagnostic snapshot for reproducible geometric and physics acceptance.
window.kintsugiInspect=()=>({phase,repairs,fragments:bodies.length,seams:seams.length,generation,area:current?.area||0,fragmentArea:current?.cells.reduce((sum,c)=>sum+c.area,0)||0,impactSites:current?.seeds.map(p=>p.slice())||[],cells:current?.cells.map(c=>({area:c.area,polygon:c.poly.map(p=>p.slice()),center:[c.cx,c.cy]}))||[],floor:FLOOR,bodies:bodies.map(b=>({x:b.x,y:b.y,angle:b.angle,sleep:b.sleep,bottom:Math.max(...transformed(b).map(p=>b.y+p[1])),error:Math.hypot(b.x-b.cx,b.y-b.cy),contacts:b.contacts})),oldGoldPaths:history.querySelectorAll('path').length});
