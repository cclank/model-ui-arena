<!-- 设计说明：晨光、青瓷与一张静止的案几，承载破碎到重生的过程。

<style>

</style></head><body><main class="studio"><header><div class="brand">金缮 / KINTSUGI<small>A STUDY OF BECOMING WHOLE</small></div><div class="edition">青瓷 · 液态金<br>OBJECT NO. 01</div></header><section class="art"><canvas id="ceramic" role="button" tabindex="0" aria-label="点击青瓷碗，将它打碎后自动金缮修复"></canvas><div class="guide" id="guide">轻触碗身，听见重生。</div><div class="phase" id="phase">01 / STILLNESS</div><button class="sound" id="sound">声音关</button></section><footer class="footer"><div><h1>More whole than before.</h1><p>光从裂隙落下，碗把它留住。</p></div><div class="stats"><div><label>SHARDS</label><strong id="shards">00</strong></div><div><label>SEAMS</label><strong id="seams">00</strong></div><div><label>REPAIRS</label><strong id="repairs">00</strong></div></div></footer><div class="actions"><span id="message">每道痕迹，都可以被珍惜。</span><div class="buttons"><button id="repair" disabled>以金修复</button><button id="reset">重新来过</button></div></div></main>
<script>
'use strict';const $=s=>document.querySelector(s),canvas=$('#ceramic'),ctx=canvas.getContext('2d');const W=800,H=535,FLOOR=424;let state='whole',since=0,last=0,shards=[],seams=[],gold=[],repairs=0,click={x:400,y:285},dust=[],enabledSound=false,audio,shine=0;
// A single hand-built bowl outline is the subject polygon for every fracture.
const outline=[];for(let i=0;i<=32;i++){let t=Math.PI+i/32*Math.PI;outline.push({x:400+195*Math.cos(t),y:226+25*Math.sin(t)})}function quadratic(a,b,c,n){for(let i=1;i<=n;i++){let t=i/n;outline.push({x:(1-t)**2*a.x+2*(1-t)*t*b.x+t*t*c.x,y:(1-t)**2*a.y+2*(1-t)*t*b.y+t*t*c.y})}}quadratic({x:595,y:226},{x:571,y:372},{x:455,y:402},24);outline.push({x:455,y:418},{x:345,y:418},{x:345,y:402});quadratic({x:345,y:402},{x:229,y:372},{x:205,y:226},24);
function path(points){let p=new Path2D();p.moveTo(points[0].x,points[0].y);for(let v of points.slice(1))p.lineTo(v.x,v.y);p.closePath();return p}const bowlPath=path(outline);
function resize(){let d=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.width*H/W*d);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}resize();addEventListener('resize',resize);
function contains(p){let inside=false;for(let i=0,j=outline.length-1;i<outline.length;j=i++){let a=outline[i],b=outline[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)inside=!inside}return inside}
// Sutherland-Hodgman half-plane clipping: cell_i = bowl intersect all
// |x-seed_i|² <= |x-seed_j|². Shared bisectors make matching shard edges.
function clip(poly,nx,ny,c){let out=[];for(let i=0;i<poly.length;i++){let a=poly[i],b=poly[(i+1)%poly.length],da=a.x*nx+a.y*ny-c,db=b.x*nx+b.y*ny-c;if(da<=1e-8)out.push(a);if((da<0)!==(db<0)){let t=da/(da-db);out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}}return out}
function centroid(poly){let area=0,x=0,y=0;for(let i=0;i<poly.length;i++){let a=poly[i],b=poly[(i+1)%poly.length],cross=a.x*b.y-b.x*a.y;area+=cross;x+=(a.x+b.x)*cross;y+=(a.y+b.y)*cross}return{x:x/(3*area),y:y/(3*area),area:Math.abs(area)/2}}
function fracture(p){if(state!=='whole')return;click=p;const sites=[];let total=34+Math.floor(Math.random()*9);while(sites.length<total){let s;if(sites.length<Math.floor(total*.57)){let a=Math.random()*Math.PI*2,r=8+Math.random()**1.2*95;s={x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r}}else s={x:205+Math.random()*390,y:201+Math.random()*217};if(contains(s)&&sites.every(t=>Math.hypot(t.x-s.x,t.y-s.y)>3))sites.push(s)}
shards=sites.map((s,i)=>{let poly=outline.map(v=>({...v}));for(let j=0;j<sites.length;j++)if(i!==j){let q=sites[j];poly=clip(poly,q.x-s.x,q.y-s.y,(q.x*q.x+q.y*q.y-s.x*s.x-s.y*s.y)/2);if(poly.length<3)break}if(poly.length<3)return null;let center=centroid(poly),dx=center.x-p.x,dy=center.y-p.y,r=Math.hypot(dx,dy)+1;return{poly,path:path(poly),cx:center.x,cy:center.y,area:center.area,x:center.x,y:center.y,vx:dx/r*(65+Math.random()*100),vy:-70-Math.random()*135,angle:0,av:(Math.random()-.5)*7,sleep:false,bounces:0}}).filter(Boolean);
seams=[];let edges=new Map();for(let s of shards)for(let i=0;i<s.poly.length;i++){let a=s.poly[i],b=s.poly[(i+1)%s.poly.length],ka=`${a.x.toFixed(3)},${a.y.toFixed(3)}`,kb=`${b.x.toFixed(3)},${b.y.toFixed(3)}`,key=ka<kb?ka+'|'+kb:kb+'|'+ka;if(edges.has(key)){let len=Math.hypot(b.x-a.x,b.y-a.y);if(len>.4)seams.push({a,b,len,delay:Math.hypot((a.x+b.x)/2-p.x,(a.y+b.y)/2-p.y)/550})}else edges.set(key,{a,b})}
// Preserve old seams; each shard is clipped before drawing the original bowl.
state='falling';since=0;shine=0;$('#shards').textContent=String(shards.length).padStart(2,'0');$('#seams').textContent=String(seams.length).padStart(2,'0');$('#repair').disabled=false;$('#guide').style.opacity='0';$('#phase').textContent='02 / LETTING GO';$('#message').textContent='碎片静止后，会自动回到原位。';dust=Array.from({length:65},()=>({x:p.x,y:p.y,vx:(Math.random()-.5)*270,vy:-Math.random()*190,age:0}));tone(2800,.07,.12,'triangle');setTimeout(()=>tone(1700,.05,.08,'sine'),45)}
function startRepair(){if(!['falling','resting'].includes(state))return;state='returning';since=0;for(let s of shards){s.from={x:s.x,y:s.y,angle:s.angle};s.angle=((s.angle+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;s.from.angle=s.angle}$('#repair').disabled=true;$('#phase').textContent='04 / COMING HOME';$('#message').textContent='慢慢归位，再让金线生长。';tone(392,.045,1.2,'sine')}
function reset(){state='whole';since=0;shards=[];seams=[];gold=[];dust=[];repairs=0;shine=0;$('#shards').textContent='00';$('#seams').textContent='00';$('#repairs').textContent='00';$('#guide').textContent='轻触碗身，听见重生。';$('#guide').style.opacity='1';$('#phase').textContent='01 / STILLNESS';$('#message').textContent='每道痕迹，都可以被珍惜。';$('#repair').disabled=true}
function tone(f,v,d,type){if(!enabledSound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.65,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.01)}catch{enabledSound=false;$('#sound').textContent='声音不可用'}}
$('#sound').onclick=()=>{enabledSound=!enabledSound;$('#sound').textContent=enabledSound?'声音开':'声音关';tone(880,.03,.3,'sine')};$('#repair').onclick=startRepair;$('#reset').onclick=reset;canvas.onclick=e=>{let r=canvas.getBoundingClientRect(),p={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};if(contains(p))fracture(p)};canvas.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fracture({x:400,y:285})}};
function drawGold(lines,progress=1){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';for(let seam of lines){let q=Math.max(0,Math.min(1,progress===1?1:(progress*1.6-seam.delay)));if(q<=0)continue;let b={x:seam.a.x+(seam.b.x-seam.a.x)*q,y:seam.a.y+(seam.b.y-seam.a.y)*q},g=ctx.createLinearGradient(seam.a.x,seam.a.y,b.x+.1,b.y+.1);g.addColorStop(0,'#936022');g.addColorStop(.28,'#e9bd66');g.addColorStop(.5,'#fff0aa');g.addColorStop(.8,'#cda042');g.addColorStop(1,'#edcc76');ctx.strokeStyle=g;ctx.lineWidth=2.05;ctx.shadowColor='#dbb44e';ctx.shadowBlur=progress<1?7:1.7;ctx.beginPath();ctx.moveTo(seam.a.x,seam.a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.shadowBlur=0;ctx.lineWidth=.55;ctx.strokeStyle='#fff4bd';ctx.stroke();if(q<1){ctx.fillStyle='#fff3b1';ctx.beginPath();ctx.arc(b.x,b.y,1.8,0,Math.PI*2);ctx.fill()}}ctx.restore()}
function bowl(){let g=ctx.createLinearGradient(205,208,520,428);g.addColorStop(0,'#bdd5c3');g.addColorStop(.22,'#92b7a4');g.addColorStop(.53,'#749986');g.addColorStop(.82,'#3f6b5c');g.addColorStop(1,'#244d42');ctx.fillStyle=g;ctx.fill(bowlPath);ctx.save();ctx.clip(bowlPath);let light=ctx.createRadialGradient(324,252,5,348,257,209);light.addColorStop(0,'#e4eddb99');light.addColorStop(.37,'#d1e4d36a');light.addColorStop(1,'#a8d1b100');ctx.fillStyle=light;ctx.fillRect(190,190,430,245);ctx.fillStyle='#294e43';ctx.beginPath();ctx.ellipse(400,222,184,20,0,0,Math.PI*2);ctx.fill();let inner=ctx.createLinearGradient(0,204,0,243);inner.addColorStop(0,'#527b64');inner.addColorStop(1,'#a8c5af');ctx.fillStyle=inner;ctx.beginPath();ctx.ellipse(400,220,177,14,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d1e5ce';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(400,223,190,22,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#486c53';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(400,225,195,25,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#466e5c';ctx.fillRect(346,398,108,20);ctx.strokeStyle='#8cac87';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(400,400,54,7,0,0,Math.PI);ctx.stroke();ctx.strokeStyle='#cedfc52f';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(255,266);ctx.quadraticCurveTo(268,314,293,330);ctx.stroke();drawGold(gold);ctx.restore()}
function background(t){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#efebdf');g.addColorStop(.8,'#e7e5d5');g.addColorStop(1,'#d7d5be');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);g=ctx.createRadialGradient(160,110,2,190,150,370);g.addColorStop(0,'#fffdf07a');g.addColorStop(1,'#fffae600');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#a8ae8b';ctx.fillRect(0,FLOOR,W,H-FLOOR);g=ctx.createLinearGradient(0,FLOOR,0,H);g.addColorStop(0,'#d2c6a0');g.addColorStop(1,'#e0d7ba');ctx.fillStyle=g;ctx.fillRect(0,FLOOR+2,W,H-FLOOR);ctx.strokeStyle='#9fa88155';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,FLOOR);ctx.lineTo(W,FLOOR);ctx.stroke();for(let i=0;i<20;i++){let x=(i*157.4+t*2)%W,y=90+(i*83)%230+Math.sin(t*.7+i)*10;ctx.fillStyle='#a5b19527';ctx.beginPath();ctx.arc(x,y,.8+i%3*.2,0,Math.PI*2);ctx.fill()}}
function shadow(x,y,rx,alpha){ctx.save();ctx.globalAlpha=alpha;let g=ctx.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,'#405c3a88');g.addColorStop(1,'#405c3a00');ctx.translate(x,y);ctx.scale(1,.13);ctx.fillStyle=g;ctx.translate(-x,-y);ctx.fillRect(x-rx,y-rx,rx*2,rx*2);ctx.restore()}
function physics(s,dt){if(s.sleep)return;s.vy+=640*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.angle+=s.av*dt;s.vx*=Math.exp(-.14*dt);let ca=Math.cos(s.angle),sa=Math.sin(s.angle),maxY=-Infinity,minX=Infinity,maxX=-Infinity;for(let p of s.poly){let dx=p.x-s.cx,dy=p.y-s.cy;maxY=Math.max(maxY,dx*sa+dy*ca);let x=dx*ca-dy*sa;minX=Math.min(minX,x);maxX=Math.max(maxX,x)}if(s.x+minX<6){s.x=6-minX;s.vx=Math.abs(s.vx)*.35}if(s.x+maxX>W-6){s.x=W-6-maxX;s.vx=-Math.abs(s.vx)*.35}if(s.y+maxY>FLOOR){s.y=FLOOR-maxY;if(s.vy>25&&s.bounces<2)tone(1100+Math.random()*1300,.008,.14,'sine');s.vy=-Math.abs(s.vy)*.23;s.vx*=.74;s.av*=.48;s.bounces++;if(Math.abs(s.vy)<12&&Math.abs(s.vx)<7&&Math.abs(s.av)<.18){s.vx=s.vy=s.av=0;s.sleep=true}}}
function frame(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;since+=dt;shine=Math.max(0,shine-dt*.42);background(t/1000);if(state==='whole'||state==='gilding'){shadow(405,FLOOR+3,165,.8);bowl();if(state==='gilding'){ctx.save();ctx.clip(bowlPath);drawGold(seams,Math.min(.999,since/2.7));ctx.restore();if(since>2.7){gold.push(...seams);repairs++;$('#repairs').textContent=String(repairs).padStart(2,'0');state='whole';since=0;shine=1;$('#phase').textContent='06 / WHOLE AGAIN';$('#guide').textContent='金线已留下。可以再次轻触。';$('#guide').style.opacity='1';$('#message').textContent='这一道光，也成为碗的一部分。';tone(784,.05,1.6,'sine');setTimeout(()=>tone(1176,.025,1.1,'sine'),100)}}if(shine>0){ctx.save();ctx.clip(bowlPath);let x=180+(1-shine)*480,g=ctx.createLinearGradient(x-40,0,x+40,0);g.addColorStop(0,'#fef0ab00');g.addColorStop(.5,'#fff3be66');g.addColorStop(1,'#fef0ab00');ctx.fillStyle=g;ctx.fillRect(190,195,430,225);ctx.restore()}}
else{if(state==='falling'){for(let s of shards){physics(s,dt/2);physics(s,dt/2)}if(shards.every(s=>s.sleep)){state='resting';since=0;$('#phase').textContent='03 / A QUIET PAUSE'}}if(state==='resting'&&since>1.1)startRepair();if(state==='returning'){let p=Math.min(1,since/1.7),ease=p<.5?4*p*p*p:1-(-2*p+2)**3/2;for(let s of shards){s.x=s.from.x+(s.cx-s.from.x)*ease;s.y=s.from.y+(s.cy-s.from.y)*ease-Math.sin(p*Math.PI)*33;s.angle=s.from.angle*(1-ease)}if(p===1){state='gilding';since=0;$('#phase').textContent='05 / GOLD FINDS ITS WAY'}}for(let s of shards){shadow(s.x,FLOOR+3,Math.sqrt(s.area)*.8,.18);ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);ctx.translate(-s.cx,-s.cy);ctx.save();ctx.translate(1.3,2);ctx.fillStyle='#b3c2a6';ctx.fill(s.path);ctx.restore();ctx.clip(s.path);bowl();ctx.strokeStyle='#c5d2b07a';ctx.lineWidth=1.2;ctx.stroke(s.path);ctx.restore()}}
for(let i=dust.length-1;i>=0;i--){let p=dust[i];p.age+=dt;p.vy+=350*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.age>1||p.y>FLOOR){dust.splice(i,1);continue}ctx.globalAlpha=1-p.age;ctx.fillStyle='#c6d9bc';ctx.fillRect(p.x,p.y,1.4,1.4)}ctx.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame);

</script></body></html>
