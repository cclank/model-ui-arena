<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Opus-5.5 · 金缮</title>
<!-- 设计说明：
1. 暗室、漆案、一只粉青莲瓣碗：碗用 Canvas 矢量逐层手绘（按 17° 俯角算出真实轮廓线、口沿椭圆、莲瓣浅浮雕、紫口铁足），漆面映出倒影，光柱里浮着尘埃。
2. 点击碗身任意处：以落点为心做“极坐标抖动 Voronoi”，越近越碎，再与碗的轮廓求交；相邻碎片共用同一条随机锯齿裂缝，拼回去严丝合缝，每次都不一样。
3. 碎片是真正的三维薄板刚体：带惯性张量、四元数姿态、冲量碰撞、摩擦与休眠，会翻面、弹跳、滑行，最后平躺在案上；随后沿贝塞尔弧线 + 四元数球面插值飞回原位。
4. 金从裂点出发，按裂缝网络的最短到达时间一路流开（两端相遇处合拢），熔金珠、金屑、金光扫过；金线烘进碗的纹理，再碎一次，新旧金线叠在一起。WebAudio 现场合成碎裂、落案清音与钟声。 -->
<style>
:root{--ink:#efe6d6;--dim:#9b8f7c;--gold:#e7bf6a;--line:rgba(231,191,106,.22);--serif:"STKaiti","Kaiti SC","KaiTi","BiauKai","Songti SC","STSong",serif;--sans:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0807;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;transition:opacity .5s}
canvas.fadeout{opacity:0}
.brand{position:fixed;top:26px;left:30px;pointer-events:none}
.brand h1{font:400 44px/1 var(--serif);letter-spacing:.18em;color:#f3e6cc;text-shadow:0 0 30px rgba(231,191,106,.25)}
.brand p{margin-top:10px;font-size:11.5px;letter-spacing:.32em;color:var(--dim)}
.stats{position:fixed;top:28px;right:28px;display:flex;gap:18px;font-size:12px;color:var(--dim);letter-spacing:.08em}
.stats div{text-align:center}.stats b{display:block;font:500 22px/1.1 var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:4px}
.stats b.g{color:var(--gold)}
.hint{position:fixed;left:50%;top:calc(var(--hintY,62%) );transform:translate(-50%,0);font:15px/1 var(--serif);letter-spacing:.35em;color:#d9ccb4;opacity:.9;pointer-events:none;white-space:nowrap;transition:opacity .6s;text-shadow:0 2px 12px #000}
.hint.off{opacity:0}
.ctrl{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px}
.ctrl button{white-space:nowrap;font:14px var(--sans);letter-spacing:.2em;color:var(--ink);background:rgba(20,15,11,.55);border:1px solid var(--line);border-radius:99px;padding:10px 20px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .25s}
.ctrl button:hover{border-color:rgba(231,191,106,.55);color:#fff}
.ctrl button.main{color:#1b1206;background:linear-gradient(180deg,#f2d38c,#c89a45);border-color:transparent;font-weight:600}
.ctrl button.main:disabled{opacity:.35;cursor:default}
.ctrl button.small{padding:10px 14px;letter-spacing:.08em;font-size:12px;color:var(--dim)}
.poem{position:fixed;right:34px;top:50%;transform:translateY(-58%);display:flex;flex-direction:row-reverse;gap:14px;align-items:flex-start;pointer-events:none;opacity:.42;transition:opacity 1.6s}
.poem.lit{opacity:.95}
.poem .col{writing-mode:vertical-rl;font:22px/1.5 var(--serif);letter-spacing:.42em;color:#e9dcc2}
.poem .sig{writing-mode:vertical-rl;font:12px/1.6 var(--serif);letter-spacing:.3em;color:var(--dim);margin-top:40px}
.poem .seal{writing-mode:vertical-rl;margin-top:112px;padding:5px 3px;font:12px/1.15 var(--serif);color:#f6e5d0;background:#a52f24;border-radius:3px;box-shadow:inset 0 0 0 1.5px rgba(255,230,210,.35);letter-spacing:0}
@media (max-width:760px){
  .brand{top:18px;left:18px}.brand h1{font-size:32px}.brand p{font-size:10px;letter-spacing:.2em}
  .stats{top:auto;bottom:calc(84px + env(safe-area-inset-bottom));left:0;right:0;justify-content:center;gap:22px}.stats b{font-size:18px}
  .poem{right:14px;top:18px;transform:none;gap:8px}.poem .col{font-size:15px}.poem .sig{display:none}.poem .seal{margin-top:66px;font-size:10px}
  .ctrl{gap:8px}.ctrl button{padding:10px 15px;font-size:13px;letter-spacing:.1em}.ctrl button.small{padding:10px 12px}
  .hint{font-size:13px;letter-spacing:.2em}
}
</style>
</head>
<body>
<canvas id="cv" aria-label="金缮：点击青瓷碗使其碎裂并以金修复"></canvas>
<header class="brand"><h1>金缮</h1><p>KINTSUGI · 碎了，也不必扔掉</p></header>
<section class="stats" aria-live="polite">
  <div><b id="sShard">0</b>碎片</div><div><b id="sCrack">0</b>裂缝</div><div><b id="sRepair" class="g">0</b>修复</div><div><b id="sSeam" class="g">0</b>金线</div>
</section>
<div class="hint" id="hint">轻触碗身 · 任它碎裂</div>
<div class="ctrl"><button class="main" id="bRepair" disabled>修复</button><button id="bReset">重新来过</button><button class="small" id="bSound">声 · 开</button></div>
<aside class="poem" id="poem" aria-label="题跋"><div class="col">瓷不讳其碎</div><div class="col">金不掩其痕</div><div class="sig">丙午秋 · 自题</div><div class="seal">金缮</div></aside>
<script>
"use strict";
// =====================================================================
//  基础工具：随机数、向量、四元数
// =====================================================================
const TAU = Math.PI * 2;
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len3 = (a) => Math.hypot(a[0], a[1], a[2]);
const mv = (M, v) => [M[0][0] * v[0] + M[0][1] * v[1] + M[0][2] * v[2], M[1][0] * v[0] + M[1][1] * v[1] + M[1][2] * v[2], M[2][0] * v[0] + M[2][1] * v[1] + M[2][2] * v[2]];
const mm = (A, B) => A.map((row) => [0, 1, 2].map((j) => row[0] * B[0][j] + row[1] * B[1][j] + row[2] * B[2][j]));
const tr = (A) => [0, 1, 2].map((i) => [A[0][i], A[1][i], A[2][i]]);
const qMul = (a, b) => [a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3], a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2], a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1], a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]];
const qNorm = (q) => { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / l, q[1] / l, q[2] / l, q[3] / l]; };
function qToMat([w, x, y, z]) {
  return [[1 - 2 * (y * y + z * z), 2 * (x * y - w * z), 2 * (x * z + w * y)], [2 * (x * y + w * z), 1 - 2 * (x * x + z * z), 2 * (y * z - w * x)], [2 * (x * z - w * y), 2 * (y * z + w * x), 1 - 2 * (x * x + y * y)]];
}
function qSlerp(a, b, t) {
  let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
  if (d < 0) { b = b.map((v) => -v); d = -d; }
  if (d > 0.9995) return qNorm(a.map((v, i) => v + (b[i] - v) * t));
  const th = Math.acos(d), s = Math.sin(th), wa = Math.sin((1 - t) * th) / s, wb = Math.sin(t * th) / s;
  return a.map((v, i) => v * wa + b[i] * wb);
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = { inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), out: (t) => 1 - Math.pow(1 - t, 3), outBack: (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2) };

// =====================================================================
//  相机：正交投影，俯角 17°。世界坐标 X 右、Y 上、Z 朝向观众，案面为 Y = 0。
//  碗的画面位于过原点、正对相机的“画面平面”里：图像坐标 (u, v) ↔ 世界 u·right + v·upCam，屏幕上 1:1。
// =====================================================================
const TILT = (17 * Math.PI) / 180, SE = Math.sin(TILT), CE = Math.cos(TILT);
const M0 = [[1, 0, 0], [0, CE, SE], [0, -SE, CE]];   // 列：right, upCam, normal（碎片本体坐标 → 世界）
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
let W = 0, H = 0, DPR = 1, L = null;
let bowlTex = null, goldTex = null, bgTex = null, blob = null;
let silhouette = [], clipSil = [];

function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const mobile = W < 760;
  const S = Math.round(clamp(Math.min(W * (mobile ? 0.74 : W < 1100 ? 0.44 : 0.36), H * (mobile ? 0.36 : 0.46)), 200, 430));
  const R = S / 2, hr = S * 0.4, rf = S * 0.17, hf = S * 0.05;
  const cx = W / 2, footY = Math.round(H * (mobile ? 0.55 : 0.6));
  const TW = Math.max(R * 1.45, Math.min(W * 0.47, S * 1.9)), TD = S * 0.8;
  const pad = Math.ceil(S * 0.04) + 4;
  const texW = Math.ceil(2 * R + 2 * pad), texH = Math.ceil(hr * CE + R * SE + rf * SE + 2 * pad);
  L = { S, R, hr, rf, hf, cx, footY, TW, TD, pad, texW, texH, TX0: pad + R, TY0: pad + hr * CE + R * SE, mobile, G: 2500 * (S / 320) };
  document.documentElement.style.setProperty("--hintY", `${Math.round(footY + TD * SE + S * 0.2)}px`);
  buildSilhouette();
  bowlTex = drawBowlTexture();
  goldTex = makeCanvas(L.texW, L.texH); bakeAllSeams();
  bgTex = drawBackground();
  blob = makeBlob();
}
function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
  const g = c.getContext("2d"); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return c;
}
const tx = (u) => L.TX0 + u, ty = (v) => L.TY0 - v;           // 图像坐标 → 纹理坐标（y 向下）
const scr = (u, v) => [L.cx + u, L.footY - v];                 // 碗完整时：图像坐标 → 屏幕

// =====================================================================
//  碗的几何：旋转体。外壁剖面是一段三次贝塞尔 (r, h)；轮廓线按“法线 ⟂ 视线”精确求出：
//  sinθ = (dr/dh)·tanε，u = r·cosθ，v = h·cosε − r·sinε·sinθ
// =====================================================================
function profile(s) {
  const P = [[L.rf * 1.08, L.hf], [L.R * 0.66, L.hf + 0.015 * L.hr], [L.R * 0.985, L.hr * 0.5], [L.R, L.hr]], t = 1 - s;
  const b = [t * t * t, 3 * t * t * s, 3 * t * s * s, s * s * s];
  return [b[0] * P[0][0] + b[1] * P[1][0] + b[2] * P[2][0] + b[3] * P[3][0], b[0] * P[0][1] + b[1] * P[1][1] + b[2] * P[2][1] + b[3] * P[3][1]];
}
function contourBranch() { // 右半支，从 U 形底（θ=90°）到口沿；返回 [u, v]
  const tanE = SE / CE, slope = (s) => { const [r2, h2] = profile(Math.min(1, s + 1e-4)), [r1, h1] = profile(Math.max(0, s - 1e-4)); return ((r2 - r1) / (h2 - h1)) * tanE; };
  let lo = 0, hi = 1;                                   // 二分求 dr/dh·tanε = 1 的位置（U 形底）
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (slope(mid) > 1) lo = mid; else hi = mid; }
  const pts = [];
  for (let i = 0; i <= 140; i++) {
    const s = hi + (1 - hi) * Math.pow(i / 140, 1.6), [r, h] = profile(s), th = Math.asin(clamp(slope(s), -1, 1));
    pts.push([i === 0 ? 0 : r * Math.cos(th), h * CE - r * SE * Math.sin(th)]);
  }
  return pts;
}
function buildSilhouette() {
  const br = contourBranch(); L.branch = br;
  const rimV = L.hr * CE, poly = [];
  for (let i = 0; i <= 64; i++) { const a = Math.PI - (i / 64) * Math.PI; poly.push([L.R * Math.cos(a), rimV + L.R * SE * Math.sin(a)]); } // 口沿后半圈
  let cross = null;
  for (let i = br.length - 1; i > 0; i--) {                    // 右轮廓自上而下，直到与圈足外侧 u = rf 相交
    const a = br[i], b = br[i - 1];
    if (a[0] >= L.rf && b[0] < L.rf) { const t = (a[0] - L.rf) / (a[0] - b[0]); cross = [L.rf, a[1] + (b[1] - a[1]) * t]; poly.push(a, cross); break; }
    if (i !== br.length - 1) poly.push(a);
  }
  L.footJoinV = cross ? cross[1] : L.hf * CE;
  for (let i = 0; i <= 40; i++) { const a = (i / 40) * Math.PI; poly.push([L.rf * Math.cos(a), -L.rf * SE * Math.sin(a)]); } // 圈足前沿
  poly.push([-L.rf, L.footJoinV]);
  const left = [];
  for (let i = 0; i < br.length; i++) if (br[i][0] >= L.rf) left.push([-br[i][0], br[i][1]]);
  poly.push(...left);
  silhouette = poly.filter((p, i) => i === 0 || Math.hypot(p[0] - poly[i - 1][0], p[1] - poly[i - 1][1]) > 0.3);
  const cy = rimV * 0.5;
  clipSil = silhouette.map(([u, v]) => [u * (1 + 2.2 / L.S), cy + (v - cy) * (1 + 2.2 / L.S)]); // 略微外扩，避免裁掉抗锯齿边
}
function pointInPoly(p, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < ((b[0] - a[0]) * (p[1] - a[1])) / (b[1] - a[1]) + a[0]) c = !c;
  }
  return c;
}
function polyArea(p) { let a = 0; for (let i = 0; i < p.length; i++) { const q = p[(i + 1) % p.length]; a += p[i][0] * q[1] - q[0] * p[i][1]; } return a / 2; }
function polyCentroid(p) {
  let a = 0, x = 0, y = 0;
  for (let i = 0; i < p.length; i++) { const q = p[(i + 1) % p.length], c = p[i][0] * q[1] - q[0] * p[i][1]; a += c; x += (p[i][0] + q[0]) * c; y += (p[i][1] + q[1]) * c; }
  return [x / (3 * a), y / (3 * a)];
}

// =====================================================================
//  手绘青瓷碗（Canvas 矢量，一次绘入离屏纹理；碎片都从这张纹理裁出）
// =====================================================================
function drawBowlTexture() {
  const c = makeCanvas(L.texW, L.texH), g = c.getContext("2d"), { R, hr, rf, S } = L, rimV = hr * CE;
  const path = (pts) => { g.beginPath(); pts.forEach(([u, v], i) => (i ? g.lineTo(tx(u), ty(v)) : g.moveTo(tx(u), ty(v)))); g.closePath(); };
  const ell = (cu, cv0, rx, ry) => { g.beginPath(); g.ellipse(tx(cu), ty(cv0), rx, ry, 0, 0, TAU); };
  // —— 圈足：下段露胎（铁褐色“铁足”），上段为积釉 ——
  const footPts = [[-rf, L.footJoinV + S * 0.01], [rf, L.footJoinV + S * 0.01]];
  for (let i = 0; i <= 40; i++) { const a = (i / 40) * Math.PI; footPts.push([rf * Math.cos(a), -rf * SE * Math.sin(a)]); }
  path(footPts);
  let gr = g.createLinearGradient(tx(-rf), 0, tx(rf), 0);
  gr.addColorStop(0, "#3f6a5a"); gr.addColorStop(0.35, "#6f9d88"); gr.addColorStop(0.7, "#557f6d"); gr.addColorStop(1, "#33584a");
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  const band = rf * SE + S * 0.022;
  gr = g.createLinearGradient(tx(-rf), 0, tx(rf), 0);
  gr.addColorStop(0, "#4a2a1a"); gr.addColorStop(0.4, "#8a563a"); gr.addColorStop(0.75, "#6d3f28"); gr.addColorStop(1, "#3c2014");
  g.fillStyle = gr; g.beginPath();
  for (let i = 0; i <= 40; i++) { const a = (i / 40) * Math.PI, w = Math.sin(a * 7) * S * 0.0025; g.lineTo(tx(rf * Math.cos(a)), ty(-rf * SE * Math.sin(a) + band + w)); }
  for (let i = 40; i >= 0; i--) { const a = (i / 40) * Math.PI; g.lineTo(tx(rf * Math.cos(a) * 1.02), ty(-rf * SE * Math.sin(a) - 4)); }
  g.fill();
  g.restore();
  // —— 内壁：透过口沿看到的后壁与碗心 ——
  ell(0, rimV, R, R * SE);
  gr = g.createLinearGradient(0, ty(rimV + R * SE), 0, ty(rimV - R * SE));
  gr.addColorStop(0, "#c3e0cf"); gr.addColorStop(0.45, "#9fc7b3"); gr.addColorStop(1, "#5f8e7a");
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  gr = g.createRadialGradient(tx(0), ty(rimV - R * SE * 0.35), 2, tx(0), ty(rimV - R * SE * 0.35), R * 0.55);
  gr.addColorStop(0, "rgba(52,96,80,.55)"); gr.addColorStop(1, "rgba(52,96,80,0)");
  g.fillStyle = gr; g.fillRect(0, 0, L.texW, L.texH);
  gr = g.createRadialGradient(tx(R * 0.38), ty(rimV + R * SE * 0.55), 1, tx(R * 0.38), ty(rimV + R * SE * 0.55), R * 0.35);
  gr.addColorStop(0, "rgba(255,255,255,.45)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, L.texW, L.texH);
  g.restore();
  // —— 外壁：U 形轮廓 + 口沿前半圈 ——
  const br = L.branch, body = [];
  for (let i = br.length - 1; i >= 0; i--) body.push([-br[i][0], br[i][1]]);
  for (let i = 0; i < br.length; i++) body.push(br[i]);
  for (let i = 1; i < 64; i++) { const a = (i / 64) * Math.PI; body.push([R * Math.cos(a), rimV - R * SE * Math.sin(a)]); }
  path(body);
  gr = g.createLinearGradient(tx(-R), 0, tx(R), 0);
  gr.addColorStop(0, "#3e6a59"); gr.addColorStop(0.16, "#6f9f89"); gr.addColorStop(0.36, "#a2cab5"); gr.addColorStop(0.55, "#8ab7a1");
  gr.addColorStop(0.82, "#5b8a76"); gr.addColorStop(1, "#365d4e");
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  gr = g.createLinearGradient(0, ty(rimV), 0, ty(-S * 0.02));
  gr.addColorStop(0, "rgba(230,248,238,.16)"); gr.addColorStop(0.5, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(18,52,40,.55)");
  g.fillStyle = gr; g.fillRect(0, 0, L.texW, L.texH);
  // 莲瓣浅浮雕：沿旋转体表面投影的尖拱，刻线积釉偏深、另一侧受光

  else for (const s of shards) if (s.pos[1] < S * 0.9) drawPiece(s.poly, s.pos, s.Mw, s.uc, s.vc, { mirror: true, rect: s.rect, alpha: 0.18 * clamp(1 - s.pos[1] / (S * 0.9), 0, 1) });
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const fade = ctx.createLinearGradient(0, footY - L.TD * SE, 0, footY + L.TD * SE);
  fade.addColorStop(0, "rgba(22,14,10,0)"); fade.addColorStop(0.5, "rgba(22,14,10,.35)"); fade.addColorStop(1, "rgba(18,11,8,.75)");
  ctx.fillStyle = fade; ctx.fillRect(0, footY - L.TD * SE, W, 2 * L.TD * SE);
  ctx.restore();
  // 投影
  if (intact) { drawShadow(cx, footY + 1, L.rf * 1.35, L.rf * 1.35 * SE + 3, 0.75); drawShadow(cx + S * 0.05, footY, L.R * 1.25, L.R * SE * 1.1, 0.35); }
  else for (const s of shards) { const hgt = Math.max(0, s.pos[1]); drawShadow(cx + s.pos[0] + hgt * 0.15, footY + s.pos[2] * SE, s.ext * 0.9 + hgt * 0.05, (s.ext * 0.9 + hgt * 0.05) * SE + 1.5, 0.5 * clamp(1 - hgt / (S * 0.8), 0, 1)); }
  // 碗 / 碎片（按深度从远到近）
  if (intact) drawPiece(silhouette, [0, 0, 0], M0, 0, 0, {});
  else [...shards].sort((a, b) => a.pos[2] - b.pos[2]).forEach((s) => drawPiece(s.poly, s.pos, s.Mw, s.uc, s.vc, { thick: true, rect: s.rect }));
  // 裂纹出现（crack 阶段：从落点向外 0.24 s 蔓延）与归位后的细裂线
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (m === "crack" || m === "seam") {
    const reach = m === "crack" ? (state.t / 0.22) * S * 1.2 : Infinity;
    ctx.lineCap = "round";
    for (const c of cracks) {
      const cl = cum(c.pts), d0 = Math.min(Math.hypot(c.A[0] - impact[0], c.A[1] - impact[1]), Math.hypot(c.B[0] - impact[0], c.B[1] - impact[1]));
      if (d0 > reach) continue;
      ctx.strokeStyle = m === "crack" ? "rgba(18,36,30,.85)" : "rgba(20,40,32,.55)"; ctx.lineWidth = m === "crack" ? 1.4 : 0.9;
      ctx.beginPath(); c.pts.forEach((p, i) => { const q = scr(p[0], p[1]); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke();
      if (m === "crack") { ctx.strokeStyle = "rgba(230,248,240,.35)"; ctx.lineWidth = 0.6; ctx.stroke(); }
    }
  }
  // 金线生长：两端各自按到达时间推进，熔金珠 + 金屑
  if (m === "seam" && flow) {
    const t = flow.t, wB = Math.max(1.6, S * 0.0072);
    for (const e of flow.edges) {
      const pa = clamp((t - e.ta) * e.speed, 0, e.len), pb = clamp((t - e.tb) * e.speed, 0, e.len);
      if (pa + pb >= e.len) { goldStroke(ctx, e.pts, e.cl, 0, e.len, wB, ([u, v]) => scr(u, v), 1); continue; }
      const tips = [];
      if (pa > 0) { goldStroke(ctx, e.pts, e.cl, 0, pa, wB, ([u, v]) => scr(u, v), 1); tips.push(pointAt(e, pa)); }
      if (pb > 0) { goldStroke(ctx, e.pts, e.cl, e.len - pb, e.len, wB, ([u, v]) => scr(u, v), 1); tips.push(pointAt(e, e.len - pb)); }
      for (const tp of tips) if (tp) { // 熔金珠：本体正常叠放（多珠重合也不会糊成白团），外加很淡的加色辉光
        const r = wB * (1.25 + 0.3 * Math.sin(clock * 20 + tp[0])), g = ctx.createRadialGradient(tp[0] - r * 0.3, tp[1] - r * 0.3, 0, tp[0], tp[1], r);
        g.addColorStop(0, "#fffbe6"); g.addColorStop(0.45, "#ffd36b"); g.addColorStop(1, "#c98a24");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(tp[0], tp[1], r, 0, TAU); ctx.fill();
        const h = ctx.createRadialGradient(tp[0], tp[1], 0, tp[0], tp[1], r * 4);
        h.addColorStop(0, "rgba(255,200,100,.16)"); h.addColorStop(1, "rgba(255,200,100,0)");
        ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = h; ctx.beginPath(); ctx.arc(tp[0], tp[1], r * 4, 0, TAU); ctx.fill(); ctx.restore();
        if (Math.random() < 0.35) sparks.push({ x: tp[0], y: tp[1], vx: (Math.random() - 0.5) * 40, vy: -20 - Math.random() * 40, life: 1 });
      }
    }
  }
  // 完成时的金光扫过（只照亮金线与釉面高处）
  if (m === "sweep" && state.sweep >= 0) {
    const k = ease.inOut(state.sweep), x = cx - L.R * 1.6 + k * L.R * 3.2, band = L.R * 0.5;
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    ctx.beginPath(); silhouette.forEach(([u, v], i) => { const p = scr(u, v); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.closePath(); ctx.clip();
    const g = ctx.createLinearGradient(x - band, footY, x + band, footY - L.hr);
    g.addColorStop(0, "rgba(255,210,130,0)"); g.addColorStop(0.5, "rgba(255,226,160,.28)"); g.addColorStop(1, "rgba(255,210,130,0)");
    ctx.fillStyle = g; ctx.fillRect(cx - L.R * 1.2, footY - L.hr * 1.4, L.R * 2.4, L.hr * 1.6);
    ctx.globalAlpha = Math.sin(k * Math.PI) * 0.9; ctx.drawImage(goldTex, L.cx - L.TX0, L.footY - L.TY0, L.texW, L.texH);
    ctx.restore();
  }
  // 金线上偶现的微光
  if (intact && seams.length && Math.random() < rawDt * 2.2) {
    const sm = seams[(Math.random() * seams.length) | 0], p = sm.pts[(Math.random() * sm.pts.length) | 0];
    glints.push({ p: scr(p[0] * S, p[1] * S), life: 1 });
  }
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for (let i = glints.length - 1; i >= 0; i--) {
    const gl = glints[i]; gl.life -= rawDt / 0.9;
    if (gl.life <= 0 || !intact) { glints.splice(i, 1); continue; }
    const a = Math.sin(gl.life * Math.PI), r = S * 0.03 * a;
    ctx.strokeStyle = `rgba(255,236,180,${0.8 * a})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(gl.p[0] - r, gl.p[1]); ctx.lineTo(gl.p[0] + r, gl.p[1]); ctx.moveTo(gl.p[0], gl.p[1] - r); ctx.lineTo(gl.p[0], gl.p[1] + r); ctx.stroke();
    ctx.fillStyle = `rgba(255,245,210,${a})`; ctx.beginPath(); ctx.arc(gl.p[0], gl.p[1], 1.3, 0, TAU); ctx.fill();
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.life -= rawDt / 0.7; p.x += p.vx * rawDt; p.y += p.vy * rawDt; p.vy += 30 * rawDt;
    if (p.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(255,214,120,${p.life})`; ctx.fillRect(p.x - 0.8, p.y - 0.8, 1.6, 1.6);
  }
  // 尘埃
  for (const d of motes) {
    d.x += (d.vx + Math.sin(clock * 0.3 + d.p) * 3) * rawDt; d.y += d.vy * rawDt;
    if (d.y < -5) { d.y = L.footY; d.x = Math.random() * W * 0.7; }
    const inBeam = clamp(1 - Math.abs(d.x - (W * 0.16 + (d.y / L.footY) * (cx - W * 0.1))) / (W * 0.22), 0, 1);
    ctx.fillStyle = `rgba(255,232,190,${(0.12 + 0.5 * inBeam) * (0.5 + 0.5 * Math.sin(clock * 1.3 + d.p))})`;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
  // 釉屑
  for (let i = chips.length - 1; i >= 0; i--) {
    const p = chips[i]; p.vy += L.G * 0.8 * rawDt; p.x += p.vx * rawDt; p.y += p.vy * rawDt;
    if (p.y > p.floor && p.vy > 0) { if (p.bounced) { p.vy = 0; p.vx *= 0.8; p.y = p.floor; } else { p.vy *= -0.3; p.vx *= 0.6; p.bounced = true; p.y = p.floor; } }
    p.life -= rawDt / (p.bounced ? 1.6 : 3);
    if (p.life <= 0) { chips.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(p.life * 1.5, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s * 0.7);
  }
  ctx.globalAlpha = 1;
  // 首次引导：碗上呼吸的光圈
  if (m === "idle" && state.first) {
    const k = (clock % 2.4) / 2.4, [px, py] = scr(-L.R * 0.18, L.hr * 0.45);
    ctx.strokeStyle = `rgba(255,236,190,${0.6 * (1 - k)})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(px, py, 6 + k * S * 0.12, (6 + k * S * 0.12) * 0.7, 0, 0, TAU); ctx.stroke();
    ctx.fillStyle = "rgba(255,240,210,.8)"; ctx.beginPath(); ctx.arc(px, py, 3, 0, TAU); ctx.fill();
  }
}

// =====================================================================
//  交互
// =====================================================================
cv.addEventListener("pointerdown", (e) => {
  sound.init();
  const u = e.clientX - L.cx, v = L.footY - e.clientY;
  if (state.mode === "idle") {
    if (pointInPoly([u, v], silhouette)) breakAt(u, v);
    else { const el = $("hint"); el.textContent = "点在碗上"; el.classList.remove("off"); clearTimeout(el._t); el._t = setTimeout(() => setMode("idle"), 1200); }
  } else if (state.mode === "rest") startReturn();
});
$("bRepair").onclick = () => { sound.init(); if (state.mode === "fall" || state.mode === "rest") startReturn(); };
$("bReset").onclick = () => { sound.init(); resetAll(); };
$("bSound").onclick = () => { sound.init(); $("bSound").textContent = sound.toggle() ? "声 · 开" : "声 · 关"; };
addEventListener("resize", () => {
  if (state.mode !== "idle") { // 窗口变化时先按旧尺度完成本次修复，再重排，避免碎片与金线坐标失配
    if (flow && ["fall", "rest", "ret", "seam"].includes(state.mode)) finishSeams();
    state.sweep = -1; setMode("idle");
  }
  layout(); initMotes();
});
window.__kintsugi = { breakAt: (u, v) => breakAt(u * L.S, v * L.S), repair: () => startReturn(), state, get shards() { return shards; }, get L() { return L; } };
layout(); initMotes(); setMode("idle"); updateStats();
requestAnimationFrame(frame);
</script>
</body>
</html>
