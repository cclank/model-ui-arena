*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#ece8de;color:#344745;font-family:Arial,"PingFang SC",sans-serif;display:grid;place-items:center;padding:26px}main{width:min(100%,1020px)}header,footer{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-size:13px;letter-spacing:.24em}.edition{font-size:9px;letter-spacing:.15em;color:#9c9988}header{padding-bottom:24px;border-bottom:1px solid #77837528}.intro{display:flex;justify-content:space-between;align-items:end;margin:30px 0 0}.tag{font-size:9px;letter-spacing:.18em;color:#948b6d}h1{font-family:Georgia,"Songti SC",serif;font-size:40px;font-weight:normal;letter-spacing:-.03em;margin:12px 0 0}.verse{font-size:11px;line-height:1.9;color:#8a8e7e;text-align:right}.stage{position:relative}canvas{display:block;width:100%;aspect-ratio:1000/600;touch-action:manipulation;cursor:pointer}.phase{position:absolute;left:50%;top:12%;transform:translateX(-50%);text-align:center;pointer-events:none;width:90%}.phase small{display:block;font-size:8px;letter-spacing:.25em;color:#9a937c;margin-bottom:12px}.phase strong{font-size:11px;font-weight:normal;color:#75887c}.stepbar{display:flex;justify-content:center;gap:22px;font-size:9px;color:#b1b3a2;margin:0 0 28px}.stepbar span{transition:color .4s}.stepbar span.active{color:#a27d39}.stepbar span.active:before{content:'';display:inline-block;width:4px;height:4px;background:#ae8b49;border-radius:50%;vertical-align:middle;margin-right:5px}.panel{border-top:1px solid #77837528;border-bottom:1px solid #77837528;padding:20px 0;display:flex;justify-content:space-between;align-items:center;gap:18px}.metrics{display:flex;gap:38px}.metrics small{display:block;font-size:9px;color:#939884;letter-spacing:.07em;margin-bottom:7px}.metrics strong{font-weight:normal;font-size:25px;color:#56756c;font-variant-numeric:tabular-nums}.actions{display:flex;gap:8px}button{font:inherit;color:#536c61;border:1px solid #a6b4a4;border-radius:22px;background:transpare </style></head><body data-state="whole"><main><header><span class="brand">拾 光 / SHI GUANG</span><span class="edition">THE ART OF BECOMING WHOLE.</span></header><div class="intro"><div><div class="tag">AN INTERACTIVE STUDY IN KINTSUGI</div><h1>裂开之后，光住进来。</h1></div><p class="verse">我把散落的时刻拾起，<br>让每一道缝，都有了去处。</p></div><section class="stage"><canvas id="bowl" width="1000" height="600" aria-label="可点击打碎并自动金缮修复的青瓷碗"></canvas><div class="phase"><small id="phase-name">I / STILLNESS</small><strong id="guidance">轻触碗身，看它如何重新完整。</strong></div></section><div class="stepbar" id="steps"><span class="active">静置</span><span>碎裂</span><span>停驻</span><span>归位</span><span>鎏金</span></div><div class="panel"><div class="metrics"><div><small>碎片 / SHARDS</small><strong id="shards">—</strong></div><div><small>裂缝 / SEAMS</small><strong id="seams">—</strong></div><div><small>修复 / REPAIRS</small><strong id="repairs">0</strong></div></div><div class="actions"><button class="primary" id="repair" disabled>修复</button><button id="reset">重新来过</button></div></div><footer><span>GPT-6.1-SOL / LIVE VORONOI · RIGID BODY</span><button class="sound" id="sound" aria-pressed="false">声音关闭</button></footer></main>
<script>
const $=id=>document.getElementById(id),canvas=$('bowl'),ctx=canvas.getContext('2d'),W=1000,H=600,tableY=449;
const outline=[{x:250,y:239},{x:750,y:239},...Array.from({length:65},(_,i)=>{const a=i/64*Math.PI;return{x:500+250*Math.cos(a),y:239+187*Math.sin(a)}})];
let state='whole',elapsed=0,fragments=[],newSeams=[],gold=[],repairs=0,dust=[],last=performance.now(),sound=false,audio=null,returnStarts=[],crackPoint={x:500,y:300};
const phases={whole:['I / STILLNESS','轻触碗身，看它如何重新完整。',0],falling:['II / FRACTURE','碎片有它们各自的落点。',1],rest:['III / A MOMENT APART','散落片刻，也能等待重逢。',2],returning:['IV / RETURN','每一片，都记得原来的位置。',3],gilding:['V / GOLDEN SEAMS','光沿着裂缝，慢慢生长。',4],healed:['VI / BECOMING WHOLE','新生的金线留下了。可以再次轻触。',0]};
function setState(s){state=s;elapsed=0;document.body.dataset.state=s;const p=phases[s];$('phase-name').textContent=p[0];$('guidance').textContent=p[1];[...$('steps').children].forEach((e,i)=>e.classList.toggle('active',i===p[2]));$('repair').disabled=!['falling','rest'].includes(s)}
function area(poly){let a=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];a+=p.x*q.y-q.x*p.y}return Math.abs(a/2)}
function centroid(poly){let a=0,x=0,y=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],cross=p.x*q.y-q.x*p.y;a+=cross;x+=(p.x+q.x)*cross;y+=(p.y+q.y)*cross}return{x:x/(3*a),y:y/(3*a)}}
function contains(p){let hit=false;for(let i=0,j=outline.length-1;i<outline.length;j=i++){const a=outline[i],b=outline[j];if(((a.y>p.y)!==(b.y>p.y))&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)hit=!hit}return hit}
// Sutherland-Hodgman half-plane clipping: each Voronoi cell begins with the SAME
// convex bowl outline. All resulting cells tile it without overlap or missing area.
function halfPlane(poly,nx,ny,d){const result=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],da=a.x*nx+a.y*ny-d,db=b.x*nx+b.y*ny-d;if(da<=1e-7)result.push(a);if((da<=0)!==(db<=0)){const t=da/(da-db);result.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}}return result}

// Clip old gold once into each convex shard, avoiding an all-seams loop per shard/frame.
function clipGold(line,poly){let enter=0,leave=1;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],ex=b.x-a.x,ey=b.y-a.y,c0=ex*(line.a.y-a.y)-ey*(line.a.x-a.x),c1=ex*(line.b.y-a.y)-ey*(line.b.x-a.x);if(c0<-1e-7&&c1<-1e-7)return null;if(c0<0&&c1>=0)enter=Math.max(enter,c0/(c0-c1));if(c1<0&&c0>=0)leave=Math.min(leave,c0/(c0-c1));if(enter>leave)return null}const dx=line.b.x-line.a.x,dy=line.b.y-line.a.y;if((leave-enter)*Math.hypot(dx,dy)<1e-5)return null;return{a:{x:line.a.x+dx*enter,y:line.a.y+dy*enter},b:{x:line.a.x+dx*leave,y:line.a.y+dy*leave},delay:0}}
function randomInside(){let p;do{p={x:250+Math.random()*500,y:239+Math.random()*187}}while(!contains(p));return p}
function fracture(point){crackPoint=point;const seeds=Array.from({length:18},randomInside);for(let i=0;i<22;i++){let p,tries=0;do{const a=Math.random()*6.283,r=Math.sqrt(Math.random())*(25+Math.random()*110);p={x:point.x+Math.cos(a)*r,y:point.y+Math.sin(a)*r};tries++}while(!contains(p)&&tries<60);seeds.push(contains(p)?p:randomInside())}
fragments=seeds.map((s,i)=>{let cell=outline.map(p=>({...p}));for(let j=0;j<seeds.length;j++){if(i===j)continue;const t=seeds[j];cell=halfPlane(cell,t.x-s.x,t.y-s.y,(t.x*t.x+t.y*t.y-s.x*s.x-s.y*s.y)/2);if(!cell.length)break}if(cell.length<3||area(cell)<.0001)return null;const c=centroid(cell),a=Math.atan2(c.y-point.y,c.x-point.x);return{poly:cell,c,x:c.x,y:c.y,a:0,vx:Math.cos(a)*(70+Math.random()*130),vy:-80-Math.random()*160,omega:(Math.random()-.5)*8,quiet:0,settled:false,mass:area(cell)}}).filter(Boolean);
for(const f of fragments)f.materialGold=gold.map(g=>clipGold(g,f.poly)).filter(Boolean);
const edges=new Map(),key=p=>Math.round(p.x*50)+','+Math.round(p.y*50);for(const f of fragments)for(let i=0;i<f.poly.length;i++){const a=f.poly[i],b=f.poly[(i+1)%f.poly.length];if(Math.hypot(a.x-b.x,a.y-b.y)<.02)continue;const k=[key(a),key(b)].sort().join('|');if(edges.has(k))edges.get(k).count++;else edges.set(k,{a,b,count:1})}newSeams=[...edges.values()].filter(e=>e.count>1).map((e,i)=>({...e,delay:Math.random()*.55}));dust=Array.from({length:65},()=>({x:point.x,y:point.y,vx:(Math.random()-.5)*260,vy:-60-Math.random()*190,life:1,size:Math.random()*2+1}));$('shards').textContent=fragments.length;$('seams').textContent=newSeams.length;setState('falling');tone(1600,.12,.09);tone(2800,.05,.025)}
function tone(freq,duration,volume){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.5,audio.currentTime+duration);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration+.02)}catch{sound=false}}
function beginRepair(){if(!['falling','rest'].includes(state))return;returnStarts=fragments.map(f=>({x:f.x,y:f.y,a:f.a}));setState('returning');tone(650,.7,.04)}
canvas.onpointerdown=e=>{if(!['whole','healed'].includes(state))return;const r=canvas.getBoundingClientRect(),p={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};if(contains(p))fracture(p)};$('repair').onclick=beginRepair;$('reset').onclick=()=>{fragments=[];newSeams=[];gold=[];dust=[];repairs=0;$('repairs').textContent=0;$('shards').textContent='—';$('seams').textContent='—';setState('whole')};$('sound').onclick=()=>{sound=!sound;$('sound').setAttribute('aria-pressed',sound);$('sound').textContent=sound?'声音开启':'声音关闭';if(sound)tone(800,.25,.03)};
function path(poly,ox=0,oy=0){ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(p.x-ox,p.y-oy):ctx.moveTo(p.x-ox,p.y-oy));ctx.closePath()}
function glaze(oy=0){const g=ctx.createLinearGradient(350,230-oy,560,441-oy);g.addColorStop(0,'#a7cac0');g.addColorStop(.12,'#73a59d');g.addColorStop(.44,'#5f938b');g.addColorStop(.72,'#36675f');g.addColorStop(1,'#173c38');return g}
function drawGold(lines,ox=0,oy=0,progress=1){ctx.lineCap='round';const g=ctx.createLinearGradient(250-ox,250-oy,710-ox,430-oy);g.addColorStop(0,'#ffe7a3');g.addColorStop(.3,'#b38534');g.addColorStop(.55,'#f9db8c');g.addColorStop(.8,'#a16e24');g.addColorStop(1,'#ffe2a0');for(const line of lines){const p=progress===1?1:Math.max(0,Math.min(1,(progress-line.delay)/.45));if(p===0)continue;ctx.beginPath();ctx.moveTo(line.a.x-ox,line.a.y-oy);ctx.lineTo(line.a.x+(line.b.x-line.a.x)*p-ox,line.a.y+(line.b.y-line.a.y)*p-oy);ctx.strokeStyle='#d9b46a55';ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle=g;ctx.lineWidth=1.9;ctx.stroke();ctx.strokeStyle='#fff2b8aa';ctx.lineWidth=.55;ctx.stroke()}}
function drawPiece(f){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);path(f.poly,f.c.x,f.c.y);ctx.save();ctx.shadowColor='#153c3655';ctx.shadowOffsetY=3;ctx.shadowBlur=3;ctx.fillStyle=glaze(f.c.y);ctx.fill();ctx.restore();ctx.clip();ctx.fillStyle=glaze(f.c.y);ctx.fillRect(250-f.c.x,230-f.c.y,500,220);const g=ctx.createRadialGradient(360-f.c.x,267-f.c.y,2,360-f.c.x,267-f.c.y,190);g.addColorStop(0,'#e7f0d466');g.addColorStop(1,'#dcead300');ctx.fillStyle=g;ctx.fillRect(250-f.c.x,230-f.c.y,500,230);drawGold(f.materialGold,f.c.x,f.c.y);ctx.restore();ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);path(f.poly,f.c.x,f.c.y);ctx.strokeStyle='#d1d4b47a';ctx.lineWidth=.7;ctx.stroke();ctx.restore()}
function intact(){const shadow=ctx.createRadialGradient(500,457,10,500,457,290);shadow.addColorStop(0,'#325b4b22');shadow.addColorStop(1,'#325b4b00');ctx.save();ctx.translate(0,342);ctx.scale(1,.25);ctx.fillStyle=shadow;ctx.fillRect(180,200,640,550);ctx.restore();ctx.beginPath();ctx.ellipse(500,430,91,18,0,0,6.283);ctx.fillStyle='#4a7465';ctx.fill();ctx.beginPath();ctx.ellipse(500,425,89,13,0,0,6.283);ctx.fillStyle='#a0bd9f';ctx.fill();path(outline);ctx.fillStyle=glaze();ctx.fill();ctx.save();ctx.clip();const g=ctx.createRadialGradient(360,267,2,360,267,190);g.addColorStop(0,'#e7f0d477');g.addColorStop(1,'#dcead300');ctx.fillStyle=g;ctx.fillRect(230,225,550,250);drawGold(gold);if(state==='gilding')drawGold(newSeams,0,0,elapsed/2.8);ctx.restore();ctx.beginPath();ctx.ellipse(500,239,250,35,0,0,6.283);ctx.fillStyle='#8bb2a1';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#d2d8b7';ctx.stroke();ctx.beginPath();ctx.ellipse(500,240,235,27,0,0,6.283);const inner=ctx.createLinearGradient(0,213,0,267);inner.addColorStop(0,'#1f514d');inner.addColorStop(1,'#799d83');ctx.fillStyle=inner;ctx.fill();ctx.beginPath();ctx.ellipse(499,240,229,24,0,0,Math.PI);ctx.strokeStyle='#b9c6a7aa';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.moveTo(290,282);ctx.bezierCurveTo(335,348,395,398,446,408);ctx.strokeStyle='#bdcfb340';ctx.lineWidth=6;ctx.stroke()}
// Collision uses the lowest rotated polygon vertex, so shards never penetrate the table.
function simulate(dt){for(const f of fragments){if(f.settled)continue;f.vy+=900*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.a+=f.omega*dt;const sa=Math.sin(f.a),ca=Math.cos(f.a);let bottom=-Infinity;for(const p of f.poly)bottom=Math.max(bottom,f.y+(p.x-f.c.x)*sa+(p.y-f.c.y)*ca);if(bottom>=tableY){f.y-=bottom-tableY;if(f.vy>0){if(f.vy>90)tone(700+Math.random()*900,.05,.009);f.vy*=-.25}f.vx*=Math.pow(.035,dt);f.omega*=Math.pow(.005,dt);if(Math.abs(f.vy)<18&&Math.abs(f.vx)<8&&Math.abs(f.omega)<.25)f.quiet+=dt;else f.quiet=0;if(f.quiet>.16){f.settled=true;f.vx=f.vy=f.omega=0}}if(f.x<95||f.x>905){f.x=Math.max(95,Math.min(905,f.x));f.vx*=-.3}}}
function frame(now){const dt=Math.min((now-last)/1000,.025);last=now;elapsed+=dt;ctx.clearRect(0,0,W,H);const light=ctx.createRadialGradient(380,255,10,450,320,430);light.addColorStop(0,'#fffdf342');light.addColorStop(1,'#ece8de00');ctx.fillStyle=light;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d5d2bb';ctx.beginPath();ctx.moveTo(78,449);ctx.lineTo(922,449);ctx.lineTo(981,526);ctx.lineTo(19,526);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff9e3';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(78,449);ctx.lineTo(922,449);ctx.stroke();ctx.fillStyle='#bdbda2';ctx.fillRect(19,526,962,6);ctx.strokeStyle='#babda12a';for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(55,468+i*7);ctx.bezierCurveTo(280,456+i*9,650,481+i*5,950,475+i*7);ctx.stroke()}
if(state==='falling'){simulate(dt);if(elapsed>2.8&&fragments.every(f=>f.settled))setState('rest')}if(state==='rest'&&elapsed>1.25)beginRepair();if(state==='returning'){const t=Math.min(1,elapsed/1.8),e=t*t*(3-2*t);fragments.forEach((f,i)=>{const s=returnStarts[i];f.x=s.x+(f.c.x-s.x)*e;f.y=s.y+(f.c.y-s.y)*e-Math.sin(Math.PI*t)*55;f.a=s.a*(1-e)});if(t>=1)setState('gilding')}if(state==='gilding'&&elapsed>=2.9){gold.push(...newSeams);repairs++;$('repairs').textContent=repairs;setState('healed');tone(1100,1.3,.035)}
if(['whole','healed','gilding'].includes(state))intact();else for(const f of fragments)drawPiece(f);for(let i=dust.length-1;i>=0;i--){const p=dust[i];p.vy+=650*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*.85;if(p.life<=0){dust.splice(i,1);continue}ctx.globalAlpha=p.life*.6;ctx.fillStyle='#c6d5b8';ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;
for(let i=0;i<12;i++){const x=(i*87+now*.003*(i%3+1))%W,y=150+Math.sin(i*2.3+now*.00014)*170;ctx.fillStyle='#b9ab7a25';ctx.beginPath();ctx.arc(x,y,1.1,0,6.283);ctx.fill()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.kintsugiAudit=()=>({state,repairs,shards:fragments.length,seams:newSeams.length,outlineArea:area(outline),cellArea:fragments.reduce((s,f)=>s+f.mass,0),geometry:fragments.map(f=>f.poly.map(p=>[p.x,p.y])),floorPenetration:fragments.length?Math.max(...fragments.map(f=>Math.max(...f.poly.map(p=>f.y+(p.x-f.c.x)*Math.sin(f.a)+(p.y-f.c.y)*Math.cos(f.a)))-tableY)):0,goldSeams:gold.length});
if(new URLSearchParams(location.search).has('audit')){const out=document.createElement('output');out.id='audit';out.hidden=true;document.body.append(out);setInterval(()=>out.textContent=JSON.stringify(window.kintsugiAudit()),100)}
</script></body></html>
