<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金缮 · 碎后见光</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#354e49 0,#152524 55%,#0c1919 100%);color:#f5eddb;font-family:Arial,"PingFang SC",sans-serif;padding:18px}.app{width:min(100%,980px);position:relative;text-align:center}.eyebrow{font-size:11px;letter-spacing:.38em;color:#c5ae7d;margin-bottom:11px}.app h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(36px,6vw,64px);font-weight:400;letter-spacing:.3em;margin:0}.intro{font-size:13px;letter-spacing:.2em;color:#b6c4ba;margin:10px 0 5px}.art{width:100%;height:auto;display:block;cursor:pointer;touch-action:manipulation;user-select:none}.controls{display:flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap;margin-top:-14px;position:relative}.controls button{font:600 13px Arial,"PingFang SC",sans-serif;letter-spacing:.14em;border:1px solid #b5a070;color:#f5e5bd;background:#b0a17718;border-radius:30px;padding:11px 22px;cursor:pointer;transition:background .25s,transform .25s}.controls button:hover{background:#b0a17735;transform:translateY(-2px)}.controls button:disabled{opacity:.4;cursor:default}.status{color:#c8d6c8;font-size:12px;letter-spacing:.13em;min-width:150px}.stats{margin:25px auto 0;display:flex;justify-content:center;gap:45px;border-top:1px solid #a9b59d36;padding-top:18px;width:min(100%,530px)}.stats small{display:block;font-size:10px;letter-spacing:.2em;color:#95a99b;margin-bottom:5px}.stats strong{font-family:Georgia,serif;font-size:23px;font-weight:400}.verse{font-family:Georgia,"Songti SC",serif;font-size:13px;color:#acb8a5;letter-spacing:.15em;margin:20px 0 5px}.gold-line{fill:none;stroke:#e4bb62;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;filter:url(#goldGlow)}.gold-core{fill:none;stroke:#fff0b0;stroke-width:1.2;stroke-linecap:round}.piece{will-change:transform}@media(max-width:500px){body{padding:12px}.intro{font-size:11px}.controls{margin-top:-4px}.stats{gap:24px}.verse{font-size:11px}}
</style></head><body><main class="app"><div class="eyebrow">KINTSUGI / 一器一生</div><h1>金缮</h1><p class="intro">轻触青瓷 · 看裂痕如何成为光</p>
<svg class="art" id="art" viewBox="0 0 800 600" role="img" aria-label="可点击打碎并以金线修复的青瓷碗">
<defs>
 <radialGradient id="halo"><stop stop-color="#e6dab1" stop-opacity=".19"/><stop offset="1" stop-color="#e6dab1" stop-opacity="0"/></radialGradient>
 <linearGradient id="wall" x2=".7" y2="1"><stop stop-color="#a8d5c4"/><stop offset=".18" stop-color="#5c9b8d"/><stop offset=".58" stop-color="#376c68"/><stop offset="1" stop-color="#204447"/></linearGradient>
 <linearGradient id="inner" x2="0" y2="1"><stop stop-color="#2e5f60"/><stop offset=".5" stop-color="#77b0a0"/><stop offset="1" stop-color="#214849"/></linearGradient>
 <linearGradient id="foot" x2="0" y2="1"><stop stop-color="#2b5c59"/><stop offset="1" stop-color="#122f32"/></linearGradient>
 <linearGradient id="table" x2="0" y2="1"><stop stop-color="#715a3d"/><stop offset=".15" stop-color="#3b352b"/><stop offset=".8" stop-color="#141e1d"/><stop offset="1" stop-color="#111b1a"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter><filter id="goldGlow"><feGaussianBlur stdDeviation=".85"/></filter>
 <clipPath id="bowlClip"><path d="M203 252 Q400 214 597 252 C581 348 548 413 489 449 Q400 470 311 449 C252 413 219 348 203 252Z"/><ellipse cx="400" cy="252" rx="197" ry="29"/><path d="M335 439 Q400 455 465 439 L476 466 Q400 486 324 466Z"/></clipPath>
 <g id="artwork">
  <path d="M335 439 Q400 455 465 439 L476 466 Q400 486 324 466Z" fill="url(#foot)" stroke="#15383b" stroke-width="5"/>
  <path d="M203 252 Q400 214 597 252 C581 348 548 413 489 449 Q400 470 311 449 C252 413 219 348 203 252Z" fill="url(#wall)" stroke="#1d4a4b" stroke-width="5"/>
  <path d="M230 290 Q247 394 312 430 Q400 464 492 432" fill="none" stroke="#d3e6ce" stroke-width="10" opacity=".14"/>
  <path d="M218 263 Q400 226 582 263" fill="none" stroke="#e2eee0" stroke-width="8" opacity=".24"/>
  <ellipse cx="400" cy="252" rx="197" ry="29" fill="#74a99b" stroke="#b5d3bc" stroke-width="5"/>
  <ellipse cx="400" cy="248" rx="176" ry="18" fill="url(#inner)"/>
  <path d="M238 249 Q400 219 562 249" fill="none" stroke="#dbe9d4" stroke-width="4" opacity=".54"/>
  <path d="M358 463 Q400 473 441 463" fill="none" stroke="#8bb09c" stroke-width="4"/>
 </g>
</defs>
<ellipse cx="400" cy="263" rx="310" ry="230" fill="url(#halo)"/>
<g opacity=".22" fill="#e8e0be"><circle cx="123" cy="197" r="2"/><circle cx="690" cy="150" r="1.4"/><circle cx="623" cy="344" r="1.2"/><circle cx="170" cy="354" r="1.4"/><circle cx="563" cy="86" r="1.6"/></g>
<path d="M0 488 H800 V600 H0Z" fill="url(#table)"/><path d="M0 488 H800" stroke="#b29965" stroke-width="3" opacity=".6"/><ellipse cx="400" cy="489" rx="226" ry="19" fill="#050e0e" opacity=".52" filter="url(#soft)"/><path d="M230 515 Q400 550 570 515" stroke="#9eaa8f" stroke-width="13" opacity=".08" fill="none" filter="url(#soft)"/>
<use id="intact" href="#artwork"/><g id="fragmentLayer"></g><g id="goldLayer" clip-path="url(#bowlClip)"></g><g id="shimmer"></g>
<text x="70" y="555" fill="#a8a38b" font-size="12" letter-spacing="4">THE ART OF MENDING</text><text x="659" y="555" fill="#a8a38b" font-size="12" letter-spacing="4">01 / 瓷</text>
</svg>
<div class="controls"><button id="repair" disabled>修复</button><button id="reset">重新来过</button><span class="status" id="status">轻触碗身，留下第一道裂痕</span></div>
<div class="stats"><div><small>碎片数</small><strong id="pieces">0</strong></div><div><small>裂缝数</small><strong id="cracks">0</strong></div><div><small>修复次数</small><strong id="repairs">0</strong></div></div><p class="verse">碎过的地方，也能有自己的光。</p></main>
<script>
const svg=document.querySelector("#art"),layer=document.querySelector("#fragmentLayer"),gold=document.querySelector("#goldLayer"),intact=document.querySelector("#intact"),repairButton=document.querySelector("#repair"),status=document.querySelector("#status"),defs=svg.querySelector("defs");let state="ready",pieces=[],crackSegments=[],repairCount=0,phaseStart=0,repairOrigins=[],goldTimer=0,lastFrame=0;
const $=s=>document.querySelector(s),rand=(a,b)=>a+Math.random()*(b-a);
function inside(x,y){if(y>=439&&y<=469&&Math.abs(x-400)<77)return true;if(y<225||y>455)return false;if(y<260)return ((x-400)/197)**2+((y-252)/29)**2<1;const d=y-260,half=193-.43*d-.0008*d*d;return Math.abs(x-400)<half}
function inPoly(poly,x,y){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function halfPlane(poly,a,b){const nx=2*(b.x-a.x),ny=2*(b.y-a.y),c=b.x*b.x+b.y*b.y-a.x*a.x-a.y*a.y,result=[];for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],vp=nx*p.x+ny*p.y-c,vq=nx*q.x+ny*q.y-c;if(vp<=0)result.push(p);if((vp<0&&vq>0)||(vp>0&&vq<0)){const t=vp/(vp-vq);result.push({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t})}}return result}
function seedNear(x,y){for(let i=0;i<90;i++){const a=rand(0,Math.PI*2),r=Math.sqrt(Math.random())*rand(25,115),sx=x+Math.cos(a)*r,sy=y+Math.sin(a)*r;if(inside(sx,sy))return{x:sx,y:sy}}return{x:rand(320,480),y:rand(300,400)}}
function seedWide(){for(let i=0;i<100;i++){const x=rand(210,590),y=rand(235,465);if(inside(x,y))return{x,y}}return{x:400,y:350}}
function key(a,b){const s=p=>p.x.toFixed(2)+","+p.y.toFixed(2),aa=s(a),bb=s(b);return aa<bb?aa+"|"+bb:bb+"|"+aa}
function makeFracture(x,y){const count=32+Math.floor(Math.random()*13),seeds=Array.from({length:count},(_,i)=>i<count*.49?seedNear(x,y):seedWide()),rectangle=[{x:198,y:220},{x:602,y:220},{x:602,y:475},{x:198,y:475}];const cells=seeds.map((a,i)=>seeds.reduce((poly,b,j)=>i===j?poly:halfPlane(poly,a,b),rectangle));const edges=new Map();pieces=[];crackSegments=[];layer.replaceChildren();defs.querySelectorAll("[data-cell]").forEach(n=>n.remove());
 cells.forEach((poly,i)=>{if(poly.length<3)return;const pivot=seeds[i],clip=document.createElementNS("http://www.w3.org/2000/svg","clipPath");clip.id="cell-"+i;clip.dataset.cell="true";const polygon=document.createElementNS("http://www.w3.org/2000/svg","polygon");polygon.setAttribute("points",poly.map(p=>p.x.toFixed(2)+","+p.y.toFixed(2)).join(" "));clip.append(polygon);defs.append(clip);
 const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.classList.add("piece");g.setAttribute("clip-path","url(#cell-"+i+")");const use=document.createElementNS("http://www.w3.org/2000/svg","use");use.setAttribute("href","#artwork");g.append(use);layer.append(g);
 const samples=[];let minX=Math.max(198,Math.floor(Math.min(...poly.map(p=>p.x)))),maxX=Math.min(602,Math.ceil(Math.max(...poly.map(p=>p.x)))),minY=Math.max(220,Math.floor(Math.min(...poly.map(p=>p.y)))),maxY=Math.min(475,Math.ceil(Math.max(...poly.map(p=>p.y))));
 for(let yy=minY;yy<=maxY;yy+=7)for(let xx=minX;xx<=maxX;xx+=7)if(inside(xx,yy)&&inPoly(poly,xx,yy))samples.push({x:xx,y:yy});if(!samples.length)samples.push(pivot);
 pieces.push({g,pivot,samples,dx:0,dy:0,angle:0,vx:(pivot.x-x)*rand(1.0,2.2)+rand(-70,70),vy:rand(-260,-70),va:rand(-230,230),still:false});
 for(let j=0;j<poly.length;j++){const a=poly[j],b=poly[(j+1)%poly.length],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};if(inside(mid.x,mid.y)&&Math.hypot(a.x-b.x,a.y-b.y)>7)edges.set(key(a,b),{a,b})}
 });
 crackSegments=[...edges.values()];$("#pieces").textContent=pieces.length;$("#cracks").textContent=crackSegments.length;intact.style.display="none";gold.style.opacity="0";layer.style.display="";repairButton.disabled=false;state="falling";phaseStart=performance.now();status.textContent="瓷片坠落 · 静候归位";
}
function transform(piece){piece.g.setAttribute("transform","translate("+piece.dx.toFixed(2)+" "+piece.dy.toFixed(2)+") rotate("+piece.angle.toFixed(2)+" "+piece.pivot.x+" "+piece.pivot.y+")")}
function bottom(piece){const a=piece.angle*Math.PI/180,s=Math.sin(a),c=Math.cos(a),p=piece.pivot;let y=-Infinity;for(const q of piece.samples)y=Math.max(y,p.y+piece.dy+(q.x-p.x)*s+(q.y-p.y)*c);return y+4}
function beginRepair(){if(state!=="falling"&&state!=="settling")return;state="returning";phaseStart=performance.now();repairOrigins=pieces.map(p=>({dx:p.dx,dy:p.dy,angle:p.angle}));repairButton.disabled=true;status.textContent="碎片归位 · 金缮将启"}
function gild(){layer.style.display="none";intact.style.display="";gold.style.opacity="1";const newLines=document.createElementNS("http://www.w3.org/2000/svg","g");gold.append(newLines);crackSegments.forEach((edge,i)=>{const d="M"+edge.a.x.toFixed(2)+","+edge.a.y.toFixed(2)+" L"+edge.b.x.toFixed(2)+","+edge.b.y.toFixed(2),len=Math.hypot(edge.a.x-edge.b.x,edge.a.y-edge.b.y);for(const cls of ["gold-line","gold-core"]){const path=document.createElementNS("http://www.w3.org/2000/svg","path");path.setAttribute("d",d);path.setAttribute("class",cls);path.style.strokeDasharray=len;path.style.strokeDashoffset=len;path.style.transition="stroke-dashoffset 1s ease-out "+(i%12)*.055+"s";newLines.append(path);requestAnimationFrame(()=>path.style.strokeDashoffset="0")}});state="gilding";phaseStart=performance.now();status.textContent="金线生长 · 裂痕有光"}
function reset(){state="ready";layer.replaceChildren();gold.replaceChildren();defs.querySelectorAll("[data-cell]").forEach(n=>n.remove());pieces=[];crackSegments=[];repairCount=0;intact.style.display="";gold.style.opacity="1";repairButton.disabled=true;$("#pieces").textContent="0";$("#cracks").textContent="0";$("#repairs").textContent="0";status.textContent="轻触碗身，留下第一道裂痕"}
function frame(t){let dt=Math.min((t-lastFrame)/1000||0,.035);lastFrame=t;if(state==="falling"){let moving=false;for(const p of pieces){if(p.still)continue;p.vy+=950*dt;p.dx+=p.vx*dt;p.dy+=p.vy*dt;p.angle+=p.va*dt;const floor=491;if(bottom(p)>=floor){p.dy-=bottom(p)-floor;if(Math.abs(p.vy)>55){p.vy=-Math.abs(p.vy)*.32;p.vx*=.67;p.va*=.55}else{p.vy=0;p.vx*=Math.pow(.12,dt);p.va*=Math.pow(.08,dt);if(Math.abs(p.vx)<4&&Math.abs(p.va)<8){p.vx=0;p.va=0;p.still=true}}}transform(p);moving ||=!p.still}
 if(!moving||t-phaseStart>3400){for(const p of pieces){p.still=true;p.vx=p.vy=p.va=0}state="settling";phaseStart=t;status.textContent="碎片已静 · 即将修复"}}
 if(state==="settling"&&t-phaseStart>750)beginRepair();
 if(state==="returning"){const k=Math.min(1,(t-phaseStart)/1500),ease=1-Math.pow(1-k,3);pieces.forEach((p,i)=>{p.dx=repairOrigins[i].dx*(1-ease);p.dy=repairOrigins[i].dy*(1-ease);p.angle=repairOrigins[i].angle*(1-ease);transform(p)});if(k>=1)gild()}
 if(state==="gilding"&&t-phaseStart>1900){state="complete";repairCount++;$("#repairs").textContent=repairCount;status.textContent="修复完成 · 再次轻触，可重生"}
 requestAnimationFrame(frame)}
svg.addEventListener("pointerdown",e=>{if(state!=="ready"&&state!=="complete")return;const point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;const local=point.matrixTransform(svg.getScreenCTM().inverse());if(inside(local.x,local.y))makeFracture(local.x,local.y)});
repairButton.onclick=beginRepair;$("#reset").onclick=reset;requestAnimationFrame(frame);
</script></body></html>
