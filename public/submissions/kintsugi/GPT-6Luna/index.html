<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>拾光 / Kintsugi</title>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101819;color:#e9e6da;font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.page{min-height:100svh;display:grid;place-items:center;padding:20px}.work{width:min(100%,920px);border:1px solid #3d4944;border-radius:20px;overflow:hidden;background:#141e1d;box-shadow:0 26px 80px #0008}.head{display:flex;justify-content:space-between;align-items:center;padding:21px 25px;border-bottom:1px solid #ffffff15}.brand{letter-spacing:.2em;font-size:10px;color:#d8c891}.place{color:#82918a;font-size:9px;letter-spacing:.13em;margin-top:4px}.quote{font:italic 12px Georgia,serif;color:#c3c0a5}.stage{position:relative;background:#182320}.art{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair}.guide{position:absolute;top:18px;left:20px;color:#91a196;font-size:9px;letter-spacing:.15em;pointer-events:none}.bottom{display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px;padding:16px 21px}.stats{display:flex;gap:24px}.stat span{display:block;color:#76877f;font-size:8px;letter-spacing:.14em}.stat b{display:block;margin-top:4px;color:#ddd8c2;font:13px ui-monospace,monospace}.buttons{display:flex;gap:7px}.btn{border:1px solid #5f695c;border-radius:999px;padding:9px 13px;background:#202c28;color:#e1decf;font:inherit;font-size:10px;cursor:pointer}.btn.primary{background:#c6a955;color:#1d211c;border-color:#d6bb70}.btn:disabled{opacity:.45;cursor:default}.foot{border-top:1px solid #ffffff13;padding:12px 22px;color:#697a72;font-size:8px;letter-spacing:.11em;display:flex;justify-content:space-between}

</style></head><body><main class="page"><article class="work"><header class="head"><div><div class="brand">拾光 <span style="color:#758178">/</span> KINTSUGI STUDY</div><div class="place">青瓷 · 案几 · 每一次裂开，都是新的纹路</div></div><div class="quote">“裂痕让光有了可以停留的地方。”</div></header><section class="stage"><canvas class="art" id="art" width="760" height="550" aria-label="点击碗身，让青瓷碎裂并以金缮修复"></canvas><div class="guide" id="guide">点一下碗身 · WATCH IT REPAIR</div></section><section class="bottom"><div class="stats"><div class="stat"><span>碎片 SHARDS</span><b id="shards">—</b></div><div class="stat"><span>裂缝 SEAMS</span><b id="seams">0</b></div><div class="stat"><span>修复 REPAIRS</span><b id="repairs">0</b></div></div><div class="buttons"><button class="btn" id="fix">立即修复</button><button class="btn primary" id="reset">重新来过</button></div></section><footer class="foot"><span>VORONOI FRACTURE · RIGID SHARDS · REAL-TIME GOLD</span><span>CLICK THE BOWL TO BEGIN</span></footer></article></main>
<script>
const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d'),W=760,H=550,C={x:380,y:276},bowl=[[-132,-91],[-126,-47],[-111,-4],[-91,34],[-66,65],[-37,83],[37,83],[66,65],[91,34],[111,-4],[126,-47],[132,-91]].map(([x,y])=>({x:C.x+x,y:C.y+y}));let shards=[],seams=[],gold=[],mode='whole',repairCount=0,settledFor=0,goldProgress=0,last=0,click={x:380,y:260};const $=s=>document.querySelector(s);function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=760*d;canvas.height=550*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function clip(poly,nx,ny,c){let out=[];for(let i=0;i<poly.length;i++){let a=poly[i],b=poly[(i+1)%poly.length],da=nx*a.x+ny*a.y-c,db=nx*b.x+ny*b.y-c,ia=da<=1e-7,ib=db<=1e-7;if(ia)out.push(a);if(ia!==ib){let t=da/(da-db);out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}}return out}function inside(p,poly){let v=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)v=!v}return v}function centroid(p){let x=0,y=0;p.forEach(v=>{x+=v.x;y+=v.y});return{x:x/p.length,y:y/p.length}}function makePieces(x,y){click={x,y};const sites=[];for(let i=0;i<38;i++){let a=Math.random()*6.283,r=Math.random()*(i%3===0?86:136);let p={x:Math.max(C.x-128,Math.min(C.x+128,x+Math.cos(a)*r)),y:Math.max(C.y-87,Math.min(C.y+82,y+Math.sin(a)*r))};if(inside(p,bowl))sites.push(p)}while(sites.length<28){let p={x:C.x+(Math.random()-.5)*240,y:C.y+(Math.random()-.5)*154};if(inside(p,bowl))sites.push(p)}let cells=sites.map((s,i)=>{let p=bowl;for(let j=0;j<sites.length&&p.length;j++)if(i!==j){let o=sites[j];p=clip(p,2*(o.x-s.x),2*(o.y-s.y),o.x*o.x+o.y*o.y-s.x*s.x-s.y*s.y)}return p});shards=cells.filter(p=>p.length>=3).map(poly=>{let m=centroid(poly),dx=m.x-x,dy=m.y-y,d=Math.hypot(dx,dy)||1;return{local:poly.map(v=>({x:v.x-m.x,y:v.y-m.y})),x:m.x,y:m.y,ox:m.x,oy:m.y,a:0,vx:(dx/d)*(80+Math.random()*105)+(Math.random()-.5)*60,vy:(dy/d)*(45+Math.random()*70)-35,va:(Math.random()-.5)*5.5,rest:false}});seams=[];for(let i=0;i<cells.length;i++)for(let j=i+1;j<cells.length;j++){let a=cells[i],s=sites[i],o=sites[j];for(let k=0;k<a.length;k++){let p=a[k],q=a[(k+1)%a.length],d1=Math.abs((p.x-s.x)**2+(p.y-s.y)**2-((p.x-o.x)**2+(p.y-o.y)**2)),d2=Math.abs((q.x-s.x)**2+(q.y-s.y)**2-((q.x-o.x)**2+(q.y-o.y)**2));if(d1<.8&&d2<.8&&Math.hypot(q.x-p.x,q.y-p.y)>4)seams.push([p,q])}}goldProgress=0;settledFor=0;mode='fall';$('#shards').textContent=String(shards.length).padStart(2,'0');$('#seams').textContent=String(seams.length).padStart(2,'0');$('#guide').textContent='碎片落在案几上，片刻后会归位';$('#fix').disabled=false}function repair(){if(mode!=='fall')return;shards.forEach(s=>{s.fx=s.x;s.fy=s.y;s.fa=s.a});mode='return';$('#guide').textContent='碎片正在归来'}$('#fix').onclick=repair;$('#reset').onclick=()=>{shards=[];seams=[];gold=[];mode='whole';goldProgress=0;repairCount=0;$('#repairs').textContent='0';$('#seams').textContent='0';$('#shards').textContent='—';$('#guide').textContent='点一下碗身 · WATCH IT REPAIR'};canvas.addEventListener('pointerdown',e=>{if(mode!=='whole')return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*760,y=(e.clientY-r.top)/r.height*550;if(inside({x,y},bowl))makePieces(x,y)});function pathPoly(points){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath()}function drawBowl(){let g=ctx.createLinearGradient(0,180,0,390);g.addColorStop(0,'#c5ded0');g.addColorStop(.28,'#77a395');g.addColorStop(.66,'#3f786e');g.addColorStop(1,'#254f4b');pathPoly(bowl);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#d8e1c477';ctx.stroke();ctx.beginPath();ctx.ellipse(C.x,C.y-89,131,15,0,0,Math.PI*2);ctx.fillStyle='#315750';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#d7e3c9';ctx.stroke();ctx.beginPath();ctx.ellipse(C.x,C.y-91,118,8,0,0,Math.PI*2);ctx.strokeStyle='#8ab3a0';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.ellipse(C.x,C.y+82,37,7,0,0,Math.PI*2);ctx.fillStyle='#294c45';ctx.fill();ctx.beginPath();ctx.ellipse(C.x,C.y+83,29,4,0,0,Math.PI*2);ctx.strokeStyle='#d1c99f';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.ellipse(C.x-39,C.y-27,42,17,-.55,Math.PI,Math.PI*1.9);ctx.strokeStyle='#f1f3d2aa';ctx.lineWidth=5;ctx.stroke()}function background(t){let g=ctx.createLinearGradient(0,0,760,550);g.addColorStop(0,'#23312b');g.addColorStop(.56,'#18231f');g.addColorStop(1,'#111a18');ctx.fillStyle=g;ctx.fillRect(0,0,760,550);let rg=ctx.createRadialGradient(380,267,10,380,267,300);rg.addColorStop(0,'#d3c38e1e');rg.addColorStop(1,'#d3c38e00');ctx.fillStyle=rg;ctx.fillRect(0,0,760,550);for(let i=0;i<22;i++){let x=(i*113+t*.007)%760,y=(i*71)%300;ctx.fillStyle=`rgba(235,226,184,${.04+.04*Math.sin(t/1300+i)})`;ctx.fillRect(x,y,1.2,1.2)}ctx.fillStyle='#514638';ctx.fillRect(0,430,760,120);ctx.fillStyle='#78664d';ctx.fillRect(0,430,760,5);ctx.fillStyle='#66573f';ctx.fillRect(0,435,760,2);ctx.fillStyle='#89765a';ctx.fillRect(0,483,760,5);ctx.fillStyle='#312d25';ctx.fillRect(32,438,9,104);ctx.fillRect(718,438,9,104);ctx.fillStyle='#b8a17c';ctx.fillRect(0,546,760,4);for(let i=0;i<12;i++){ctx.strokeStyle=`rgba(220,190,138,${.05+i*.002})`;ctx.beginPath();ctx.moveTo(0,445+i*9);ctx.lineTo(760,445+i*9);ctx.stroke()}}function transformed(s){let c=Math.cos(s.a),si=Math.sin(s.a);return s.local.map(p=>({x:s.x+p.x*c-p.y*si,y:s.y+p.x*si+p.y*c}))}function drawShard(s,i){let p=transformed(s);pathPoly(p);let g=ctx.createLinearGradient(s.x-40,s.y-50,s.x+45,s.y+55);g.addColorStop(0,'#c9dfd1');g.addColorStop(.38,'#70a094');g.addColorStop(1,'#27534b');ctx.fillStyle=g;ctx.fill();ctx.lineWidth=.8;ctx.strokeStyle='#d3dcbd99';ctx.stroke();ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);ctx.lineTo(p[1].x,p[1].y);ctx.lineTo(s.x,s.y);ctx.closePath();ctx.fillStyle='#e8f0d522';ctx.fill()}function linePartial(a,b,p){let x=a.x+(b.x-a.x)*p,y=a.y+(b.y-a.y)*p;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(x,y);ctx.stroke()}function render(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;background(t);ctx.save();ctx.fillStyle='#03070666';ctx.beginPath();ctx.ellipse(C.x,436,170,10,0,0,7);ctx.fill();ctx.restore();if(mode!=='whole'){if(mode==='fall'){let awake=false;for(let s of shards){if(s.rest)continue;awake=true;s.vy+=460*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.a+=s.va*dt;let min=Infinity;for(let p of transformed(s))min=Math.min(min,p.y);if(min>428){s.y-=min-428;s.vy=s.vy<38?0:-s.vy*.22;s.vx*=.81;s.va*=.74;if(Math.abs(s.vx)<5&&Math.abs(s.vy)<8&&Math.abs(s.va)<.3)s.rest=true}}if(!awake){settledFor+=dt;if(settledFor>1.15)repair()}}if(mode==='return'){let done=true;for(let s of shards){s.rt=(s.rt||0)+dt/1.15;let p=Math.min(1,s.rt),e=1-Math.pow(1-p,3);s.x=s.fx+(s.ox-s.fx)*e;s.y=s.fy+(s.oy-s.fy)*e;s.a=s.fa*(1-e);if(p<1)done=false}if(done){mode='gold';goldProgress=0;$('#guide').textContent='金线沿着每一道裂缝生长'}}if(mode==='gold'){goldProgress=Math.min(1,goldProgress+dt/2.2);if(goldProgress>=1){mode='whole';gold=gold.concat(seams);repairCount++;$('#repairs').textContent=String(repairCount);$('#guide').textContent='修复完成 · 金线留在瓷上，可以再次点击'}}}if(mode==='whole'){drawBowl();gold.forEach(s=>{ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);ctx.lineTo(s[1].x,s[1].y);ctx.strokeStyle='#d2a945';ctx.lineWidth=2.5;ctx.shadowColor='#f1ce69';ctx.shadowBlur=5;ctx.stroke();ctx.shadowBlur=0})}else shards.forEach(drawShard);if(mode==='gold'){ctx.lineCap='round';ctx.strokeStyle='#efcf73';ctx.shadowColor='#f1d178';ctx.shadowBlur=7;ctx.lineWidth=2.7;let n=seams.length;seams.forEach((s,i)=>{let p=Math.max(0,Math.min(1,goldProgress*n-i));if(p>0)linePartial(s[0],s[1],p)});ctx.shadowBlur=0}requestAnimationFrame(render)}$('#repairs').textContent='0';requestAnimationFrame(render);
</script></body></html>
