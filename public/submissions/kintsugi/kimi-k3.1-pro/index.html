<style>

</style>

<body>
<main class="app"><header class="top"><div class="brand"><div class="seal">缮</div><div><strong>金缮 · KINTSUGI</strong><small>FRACTURE / GRAVITY / REPAIR STUDY</small></div></div><div class="stats"><div class="stat"><span>SHARDS / 碎片</span><strong id="shardCount">00</strong></div><div class="stat"><span>CRACKS / 裂缝</span><strong id="crackCount">00</strong></div><div class="stat"><span>REPAIRS / 修复</span><strong id="repairCount">00</strong></div></div></header>

<rect width="1200" height="800" fill="url(#wall)"/>
<path d="M0 0H390L710 720H290Z" fill="#fffce8" opacity=".18"/><path d="M95 0L410 720M310 0L625 720" stroke="#fffef2" stroke-opacity=".18" stroke-width="3"/>
<g opacity=".28" fill="#7f8a70"><circle cx="228" cy="246" r="2"><animate attributeName="cy" values="246;208;246" dur="9s" repeatCount="indefinite"/></circle><circle cx="925" cy="324" r="1.5"><animate attributeName="cy" values="324;270;324" dur="12s" repeatCount="indefinite"/></circle><circle cx="1020" cy="194" r="2"><animate attributeName="cy" values="194;154;194" dur="10s" repeatCount="indefinite"/></circle></g>
<rect y="720" width="1200" height="80" fill="url(#wood)"/><rect y="719" width="1200" height="3" fill="#aa8260" opacity=".65"/><path d="M0 756Q260 739 510 759T1200 750M0 783Q330 762 620 784T1200 775" fill="none" stroke="#b18a64" stroke-opacity=".13" stroke-width="2"/>
<ellipse cx="600" cy="727" rx="310" ry="30" fill="#192d29" opacity=".23" filter="url(#blur)"/><ellipse id="contactShadow" cx="600" cy="721" rx="235" ry="15" fill="#172b27" opacity=".35"/>
<ellipse cx="600" cy="738" rx="220" ry="22" fill="#a4c0a0" opacity=".07"/>
<g id="intact" filter="url(#bowlShadow)"><use href="#bowlArtwork"/></g><g id="shards"></g>
<g id="goldLayer" clip-path="url(#bowlClip)" style="display:none"><g id="goldHistory" fill="none" stroke="url(#gold)" stroke-linecap="round"></g><g id="newGold" class="new-gold" fill="none" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round"></g></g>
<g id="inscription" transform="translate(942 492)"><path d="M0 0v127" stroke="#9c8a64" stroke-width="1"/><text x="19" y="4" fill="#58685c" font-family="Georgia,'Songti SC',serif" font-size="17" letter-spacing="6"><tspan x="19" dy="0">裂</tspan><tspan x="19" dy="30">而</tspan><tspan x="19" dy="30">有</tspan><tspan x="19" dy="30">光</tspan></text><rect x="12" y="137" width="25" height="25" fill="none" stroke="#a87632"/><text x="17" y="155" fill="#a87632" font-size="13" font-family="serif">缮</text></g>
</svg><div class="state-line" aria-live="polite"><strong id="stateText">点击碗身，让光进入裂缝</strong><span id="stateSub">TOUCH THE BOWL · EVERY FRACTURE IS UNIQUE</span></div></section>
<div class="controls"><button class="primary" id="repair" disabled>修复 / REPAIR</button><button id="reset">重新来过 / RESET</button><button id="sound" aria-pressed="true">SOUND · ON</button></div>
<footer class="footer"><span><i>○</i>实时 VORONOI 断裂 · 刚体重力 · 金线路径生长</span><span>不是掩饰伤痕，而是让经历成为光。</span></footer></main>
<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id),svg=$('art'),shardsGroup=$('shards'),cellDefs=$('cellDefs'),goldLayer=$('goldLayer'),historyGroup=$('goldHistory'),newGold=$('newGold'),intact=$('intact');
let state='intact',pieces=[],edges=[],repairs=0,lastTime=performance.now(),autoTimer=null,finishTimer=null,repairStart=0,soundOn=true,audioCtx=null,lastPing=0;
const tableY=720,gravity=920,TAU=Math.PI*2,bowlOutline=[];
for(const id of['bodyShape','footShape']){const path=$(id),length=path.getTotalLength();for(let i=0;i<160;i++){const p=path.getPointAtLength(length*i/160);bowlOutline.push({x:p.x,y:p.y})}}
for(let i=0;i<120;i++)bowlOutline.push({x:600+250*Math.cos(i/120*TAU),y:340+45*Math.sin(i/120*TAU)});
function insideBowl(x,y){const rim=((x-600)/250)**2+((y-340)/45)**2<=1,foot=x>=515&&x<=685&&y>=610&&y<=662;if(y<330||y>642)return rim||foot;const t=(y-340)/302,half=250-170*t;return Math.abs(x-600)<=half||rim||foot}
function clipHalfPlane(poly,nx,ny,c){const out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],da=nx*a.x+ny*a.y-c,db=nx*b.x+ny*b.y-c,ain=da<=1e-7,bin=db<=1e-7;if(ain)out.push(a);if(ain!==bin){const t=da/(da-db);out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}}return out}
function voronoi(sites){const box=[{x:310,y:280},{x:890,y:280},{x:890,y:680},{x:310,y:680}];return sites.map((s,i)=>{let poly=box.map(p=>({...p}));for(let j=0;j<sites.length&&poly.length;j++){if(i===j)continue;const o=sites[j],nx=2*(o.x-s.x),ny=2*(o.y-s.y),c=o.x*o.x+o.y*o.y-s.x*s.x-s.y*s.y;poly=clipHalfPlane(poly,nx,ny,c)}return{site:s,poly}})}
function centroid(poly,site){let a=0,x=0,y=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],f=p.x*q.y-q.x*p.y;a+=f;x+=(p.x+q.x)*f;y+=(p.y+q.y)*f}return Math.abs(a)<.01?{...site}:{x:x/(3*a),y:y/(3*a)}}
function edgeList(cells){const map=new Map();for(const cell of cells){const p=cell.poly;for(let i=0;i<p.length;i++){let a=p[i],b=p[(i+1)%p.length];if(Math.hypot(a.x-b.x,a.y-b.y)<1)continue;const norm=v=>({x:Math.round(v.x*100)/100,y:Math.round(v.y*100)/100});a=norm(a);b=norm(b);const ka=`${a.x},${a.y}`,kb=`${b.x},${b.y}`,key=ka<kb?`${ka}|${kb}`:`${kb}|${ka}`;map.set(key,{a,b})}}return[...map.values()]}
function makeSites(point){const count=30+Math.floor(Math.random()*9),sites=[point];for(let i=0;i<11;i++){const a=Math.random()*TAU,r=22+Math.random()*105,p={x:point.x+Math.cos(a)*r,y:point.y+Math.sin(a)*r};if(insideBowl(p.x,p.y)&&sites.every(s=>Math.hypot(s.x-p.x,s.y-p.y)>9))sites.push(p)}let guard=0;while(sites.length<count&&guard++<4000){const p={x:335+Math.random()*530,y:296+Math.random()*366};if(insideBowl(p.x,p.y)&&sites.every(s=>Math.hypot(s.x-p.x,s.y-p.y)>17))sites.push(p)}return sites}
function initAudio(){if(!soundOn)return null;if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,duration,volume=.04,delay=0,type='sine'){const ac=initAudio();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+duration+.03)}
function shatterSound(){const ac=initAudio();if(!ac)return;const buffer=ac.createBuffer(1,ac.sampleRate*.32,ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);const source=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();source.buffer=buffer;filter.type='highpass';filter.frequency.value=1600;gain.gain.value=.13;source.connect(filter).connect(gain).connect(ac.destination);source.start();[1160,1740,2310].forEach((f,i)=>tone(f,.18,.025,i*.018,'triangle'))}
function setState(main,sub){$('stateText').textContent=main;$('stateSub').textContent=sub;$('repair').disabled=state!=='falling'}
function pointInPolygon(point,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>point.y)!==(b.y>point.y)&&point.x<(b.x-a.x)*(point.y-a.y)/(b.y-a.y)+a.x)inside=!inside}return inside}
function supportRadius(p,angle){const rad=angle*Math.PI/180,s=Math.sin(rad),c=Math.cos(rad);let max=0;for(const v of p.support){const x=v.x-p.cx,y=v.y-p.cy;max=Math.max(max,x*s+y*c)}return max}
function transformPiece(p){p.el.setAttribute('transform',`translate(${p.dx.toFixed(2)} ${p.dy.toFixed(2)}) rotate(${p.rot.toFixed(2)} ${p.cx.toFixed(2)} ${p.cy.toFixed(2)})`)}
function archiveGold(){for(const line of[...newGold.children]){line.style.transition='none';line.setAttribute('stroke-dashoffset','0');line.classList.add('old');historyGroup.append(line)}newGold.replaceChildren()}
function buildGold(){newGold.replaceChildren();const visible=edges.filter(e=>insideBowl((e.a.x+e.b.x)/2,(e.a.y+e.b.y)/2));for(const e of edges){const line=document.createElementNS(NS,'line');line.setAttribute('x1',e.a.x);line.setAttribute('y1',e.a.y);line.setAttribute('x2',e.b.x);line.setAttribute('y2',e.b.y);line.setAttribute('pathLength','1');line.setAttribute('stroke-dasharray','1');line.setAttribute('stroke-dashoffset','1');newGold.append(line)}$('crackCount').textContent=String(visible.length).padStart(2,'0')}
function shatter(point){if(state!=='intact')return;clearTimeout(autoTimer);clearTimeout(finishTimer);shardsGroup.style.display='';archiveGold();const cells=voronoi(makeSites(point));edges=edgeList(cells);buildGold();goldLayer.style.display='none';intact.style.display='none';shardsGroup.replaceChildren();cellDefs.innerHTML=cells.map((c,i)=>`<clipPath id="cell-${i}" clipPathUnits="userSpaceOnUse"><polygon points="${c.poly.map(p=>`${p.x},${p.y}`).join(' ')}"/></clipPath>`).join('');shardsGroup.innerHTML=cells.map((c,i)=>`<g class="shard" data-piece="${i}"><g clip-path="url(#bowlClip)"><g clip-path="url(#cell-${i})"><use href="#bowlArtwork"/><polygon points="${c.poly.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="#294f49" stroke-width="3" stroke-linejoin="round"/></g></g></g>`).join('');
pieces=cells.map((c,i)=>{const center=centroid(c.poly,c.site),dx=center.x-point.x,dy=center.y-point.y,support=[...c.poly.filter(p=>insideBowl(p.x,p.y)),...bowlOutline.filter(p=>pointInPolygon(p,c.poly))];return{el:shardsGroup.children[i],poly:c.poly,support,cx:center.x,cy:center.y,dx:0,dy:0,vx:dx*1.25+(Math.random()-.5)*85,vy:dy*.65-45-Math.random()*75,rot:0,vr:(Math.random()-.5)*210,rest:false,delay:(i%7)*45}});pieces.forEach(transformPiece);$('shardCount').textContent=String(pieces.length).padStart(2,'0');state='falling';setState('破碎，也是另一种开始','GRAVITY AT WORK · TAP REPAIR WHEN READY');shatterSound();autoTimer=setTimeout(repair,3300)}
function physics(dt,now){for(const p of pieces){if(!p.rest){p.vy+=gravity*dt;p.dx+=p.vx*dt;p.dy+=p.vy*dt;p.rot+=p.vr*dt;const support=supportRadius(p,p.rot),bottom=p.cy+p.dy+support;if(bottom>=tableY){p.dy=tableY-p.cy-support;if(Math.abs(p.vy)>55){if(now-lastPing>75&&Math.abs(p.vy)>140){tone(720+Math.random()*900,.07,.018,0,'triangle');lastPing=now}p.vy=-Math.abs(p.vy)*.27;p.vx*=.76;p.vr*=.68}else{p.vy=0;p.vx*=Math.pow(.06,dt);p.vr*=Math.pow(.04,dt);if(Math.abs(p.vx)<7&&Math.abs(p.vr)<7){p.rest=true;p.vx=p.vy=p.vr=0}}}if(p.cx+p.dx<45){p.dx=45-p.cx;p.vx=Math.abs(p.vx)*.5}else if(p.cx+p.dx>1155){p.dx=1155-p.cx;p.vx=-Math.abs(p.vx)*.5}transformPiece(p)}}}
function repair(){if(state!=='falling')return;clearTimeout(autoTimer);state='repairing';repairStart=performance.now();for(const p of pieces){p.from={dx:p.dx,dy:p.dy,rot:p.rot};p.rest=false}setState('碎片记得原来的形状','RETURNING · EVERY SHARED EDGE STILL MATCHES');tone(392,.6,.025,0,'sine')}
function repairFrame(now){let complete=true;for(const p of pieces){const q=Math.max(0,Math.min(1,(now-repairStart-p.delay)/1450));if(q<1)complete=false;const e=1-Math.pow(1-q,3),arc=Math.sin(q*Math.PI)*65;p.dx=p.from.dx*(1-e);p.dy=p.from.dy*(1-e)-arc;p.rot=p.from.rot*(1-e);transformPiece(p)}if(complete)finishRepair()}
function finishRepair(){state='gilding';shardsGroup.style.display='none';intact.style.display='';intact.removeAttribute('filter');goldLayer.style.display='';repairs++;$('repairCount').textContent=String(repairs).padStart(2,'0');setState('以金缮之，以光续之','LIQUID GOLD FOLLOWS EVERY NEW FRACTURE');const lines=[...newGold.children];lines.forEach((line,i)=>{line.style.transition=`stroke-dashoffset .85s cubic-bezier(.3,.7,.2,1) ${i*9}ms`;requestAnimationFrame(()=>line.setAttribute('stroke-dashoffset','0'))});[523.25,659.25,783.99].forEach((f,i)=>tone(f,1.25,.035,i*.12,'sine'));finishTimer=setTimeout(()=>{state='intact';setState('伤痕仍在，器物已成新歌','TOUCH AGAIN · OLD AND NEW GOLD WILL REMAIN');$('repair').disabled=true},1700)}
function reset(){clearTimeout(autoTimer);clearTimeout(finishTimer);state='intact';pieces=[];edges=[];repairs=0;shardsGroup.replaceChildren();cellDefs.replaceChildren();newGold.replaceChildren();historyGroup.replaceChildren();intact.style.display='';intact.setAttribute('filter','url(#bowlShadow)');goldLayer.style.display='none';shardsGroup.style.display='';$('shardCount').textContent=$('crackCount').textContent=$('repairCount').textContent='00';setState('点击碗身，让光进入裂缝','TOUCH THE BOWL · EVERY FRACTURE IS UNIQUE');$('repair').disabled=true}
function pointFromEvent(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}

$('repair').onclick=repair;$('reset').onclick=reset;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=`SOUND · ${soundOn?'ON':'OFF'}`;$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)tone(660,.12,.025)};
function frame(now){const dt=Math.min(.032,(now-lastTime)/1000);lastTime=now;if(state==='falling')physics(dt,now);else if(state==='repairing')repairFrame(now);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
