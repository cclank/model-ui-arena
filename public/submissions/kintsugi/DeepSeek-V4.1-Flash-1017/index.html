        if (!S.settledAt && (allSleep || now - S.releaseAt > 3.0)){
          S.settledAt = now;
          S.stage = 'waiting';
          S.stageT = now;
          S.autoRepairAt = now + 2.8;   // 静止后静候约三秒，自动归位
          setPhase('waiting');
          setHint('waiting');
          announce('碎片已落在案几上，约三秒后自动归位');
        }
      }
    } else if (S.stage === 'waiting'){
      stepPhysics(dt);
      const remain = Math.max(0, S.autoRepairAt - now);
      const tenths = Math.ceil(remain*10)/10;
      if (tenths !== waitTenths){
        waitTenths = tenths;
        el.hintSub.textContent = '静候 ' + tenths.toFixed(1) + ' 秒 · 金会自己回来';
      }
      if (now >= S.autoRepairAt) startRepair(now);
    } else if (S.stage === 'returning'){
      updateReturn(now);
    } else if (S.stage === 'gilding'){
      updateGild(now);
      if (S.stage === 'gilding') setPhase('gilding');
    }

    updateParticles(dt);
    updateStats();
    if (S.stage === 'idle') setPhase('idle');
  }

  function frame(){
    const now = nowS();
    let dt = now - lastT;
    if (!isFinite(dt) || dt <= 0) dt = 1/60;
    dt = Math.min(dt, 0.05);
    lastT = now;
    update(now, dt);
    render(now);
    requestAnimationFrame(frame);
  }

  /* ==========================================================================
     布局 / 初始化
     ========================================================================== */

  function layout(){
    buildBowlGeometry();
    buildBackground();
    buildVignette();
    buildSprite();
    buildReflection();
    buildBreakFlashReset();
  }

  function buildBreakFlashReset(){
    S.flashAt = -1;
    S.sweepAt = -1;
  }

  function resize(){
    W = Math.max(240, window.innerWidth || 360);
    H = Math.max(320, window.innerHeight || 640);
    DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    canvas.width = Math.round(W*DPR);
    canvas.height = Math.round(H*DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layout();
    resetSession();
  }

  function hitBowl(x, y){
    if (pointInPoly(B.outline, x, y)) return { x, y };
    const near = nearestOnOutline(x, y);
    if (near.d < Math.max(34, B.rx*0.16)){
      // 往碗心方向收一点，避免种子落在轮廓外
      const cx = B.cx, cy = B.rimY + B.bodyH*0.45;
      const dx = cx - near.x, dy = cy - near.y;
      const dl = Math.hypot(dx,dy) || 1;
      return { x: near.x + dx/dl*8, y: near.y + dy/dl*8 };
    }
    return null;
  }

  function onPointerDown(e){
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    Audio.unlock();

    if (S.stage === 'idle' || S.stage === 'healed'){
      const p = hitBowl(x, y);
      if (p){
        e.preventDefault();
        doBreak(p);
      } else {
        showToast('轻叩碗身', '把手指落在青瓷上');
        S.touched = false;
      }
    } else if (S.stage === 'falling' || S.stage === 'waiting'){
      // 点击空白处不打断；给一次提示
      if (!hitBowl(x, y)) {
        // 不打扰
      }
    }
  }

  function onPointerMove(e){
    if (e.pointerType !== 'mouse') return;
    const rect = canvas.getBoundingClientRect();
    const inside = pointInPoly(B.outline, e.clientX-rect.left, e.clientY-rect.top);
    const want = inside ? 'pointer' : 'default';
    if (canvas.style.cursor !== want) canvas.style.cursor = want;
  }

  function bindEvents(){
    window.addEventListener('resize', function(){
      clearTimeout(bindEvents._t);
      bindEvents._t = setTimeout(resize, 180);
    });

    canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
    canvas.addEventListener('pointermove', onPointerMove, { passive: true });

    window.addEventListener('pointerdown', function(){ Audio.unlock(); }, { once: true });
    window.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){
        if (S.stage === 'idle' || S.stage === 'healed'){
          e.preventDefault();
          Audio.unlock();
          doBreak({ x: B.clickCenter.x + rand(-B.rx*0.22, B.rx*0.22), y: B.rimY + B.bodyH*0.5 + rand(-20,20) });
        }
      }
      if (e.key === 'r' || e.key === 'R'){
        if (S.stage === 'falling' || S.stage === 'waiting') startRepair(nowS());
      }
    });

    el.repairBtn.addEventListener('click', function(){
      Audio.unlock();
      startRepair(nowS());
    });
    el.resetBtn.addEventListener('click', function(){
      Audio.unlock();
      resetSession();
      lastT = nowS();
    });
    el.soundBtn.addEventListener('click', function(){
      Audio.unlock();
      Audio.toggle();
      updateSoundBtn();
    });

    document.addEventListener('visibilitychange', function(){
      lastT = nowS();
    });
  }

  function init(){
    buildShadowSprite();
    resize();
    bindEvents();
    updateSoundBtn();

    // 调试增强：以 #demo 打开时 1 秒后自动击碎一次；正常打开不受影响
    if (location.hash === '#demo' || location.hash === '#demo-break'){
      setTimeout(function(){
        if (S.stage === 'idle' || S.stage === 'healed'){
          doBreak({ x: B.cx - B.rx*0.26, y: B.rimY + B.bodyH*0.5 });
        }
      }, 1000);
    }

    // 供自动化核查使用的小钩子（不影响正常交互）
    window.__kintsugi = {
      breakAt: function(x,y){ doBreak({x,y}); },
      repair: function(){ startRepair(nowS()); },
      reset: function(){ resetSession(); },
      stats: function(){
        return {
          stage: S.stage,
          shards: S.shards.length,
          cracks: S.cracks.length,
          seams: S.seams.length,
          repairs: S.repairs
        };
      }
    };

    lastT = nowS();
    render(nowS());
    requestAnimationFrame(frame);
  }

  init();
})();
</script>
</body>
</html>
