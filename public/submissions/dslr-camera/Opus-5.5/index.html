<title>Opus-5.5 · 拟物单反</title>
<!-- 设计说明：
1. 先搭了一个“迷你透视渲染器”：机身按俯视轮廓（含前凸握把）挤出、五棱镜按侧剖面挤出、镜头由 8 段同轴圆柱叠成，统一用偏航 -34°、俯视 19° 的弱透视投影成 SVG 路径，所以镜头每个截面都是严格一致的椭圆，机身与镜头不穿帮。
2. 同一盏左上前方柔光箱照亮一切：磨砂塑料只有漫反射，金属卡口/转盘/快门圈用高光指数很高的横向色带，镜片是深紫绿镀膜 + 柔光箱倒影 + 高光点；握把与前脸覆盖 feTurbulence 生成的颗粒皮纹。
3. 细节：变焦环宽棱、对焦环细棱、焦距刻度与对焦距离刻度按圆柱面逐字仿射贴合，红圈装饰环、滤镜螺纹、前端文字环、热靴触点、背带扣、AF 辅助灯、镜头释放钮、接触阴影与缝隙暗部。
4. 品牌“AURIGA / AX·7”为自创；全部图形为内联 SVG 手绘，无位图、无图标字体。点击模式转盘可逐档转动，镜片上的反光会缓慢流动。 -->
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(90% 70% at 50% 40%,#f7f5f1,#e4e0d9 70%,#d9d4cc);font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
svg{display:block;width:100vw;height:100vh}
#dialRot{transition:transform .55s cubic-bezier(.3,1.5,.5,1);transform-box:view-box;transform-origin:0 0}
#dial{cursor:pointer}
#dial:hover .dialHint{opacity:1}
.dialHint{opacity:0;transition:opacity .3s}
.glint{animation:glint 7s ease-in-out infinite}
@keyframes glint{0%,100%{transform:translate(-9px,-4px)}50%{transform:translate(7px,5px)}}
.spark{animation:spark 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spark{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.cap{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;letter-spacing:.3em;color:#8c867c;white-space:nowrap;pointer-events:none}
@media (prefers-reduced-motion:reduce){.glint,.spark{animation:none}}
</style>
</head>
