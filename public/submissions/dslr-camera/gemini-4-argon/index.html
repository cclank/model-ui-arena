<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHERIA FX-9 — 3/4 Skeuomorphic DSLR Replica</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at 48% 28%, #262c3a 0%, #12151e 55%, #080a0f 100%);
    color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 14px;
  }
  .studio-stage {
    width: 100%; max-width: 920px; border-radius: 28px;
    background: linear-gradient(180deg, #161a24 0%, #0e1118 72%, #181c26 100%);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 32px 90px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.08);
    overflow: hidden; position: relative;
  }
  svg.camera-svg { width: 100%; height: auto; display: block; }
  .glint-sweep {
    animation: sweep 5.5s ease-in-out infinite;
    transform-origin: 555px 365px;
  }
  @keyframes sweep {
    0%, 100% { transform: rotate(-4deg) translate(-6px, -4px); opacity: 0.78; }
    50% { transform: rotate(5deg) translate(8px, 5px); opacity: 0.98; }
  }
  .studio-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 20px; background: #0b0d13; border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px; color: #94a3b8; flex-wrap: wrap; gap: 8px;
  }
  .studio-controls { display: flex; gap: 8px; align-items: center; }
  .act-btn {
    border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06);
    color: #f8fafc; padding: 5px 12px; border-radius: 99px; font-size: 11px;
    font-weight: 700; cursor: pointer; letter-spacing: 0.04em; transition: 0.2s;
  }
  .act-btn:hover { background: #ef4444; border-color: #ef4444; }
  @media (max-width: 480px) {
    body { padding: 6px; }
    .studio-bar { padding: 9px 12px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="studio-stage">
  <svg class="camera-svg" viewBox="0 0 920 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3/4视角拟物单反相机纯手绘复刻">
    <defs>
      <!-- 1. 磨砂镁合金机身材质 (Matte Magnesium Alloy Body + Pebble Leather Texture) -->
      <filter id="bodyMatteNoise" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="noise"/>
        <feColorMatrix type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.13  0 0 0 0 0.16  0 0 0 0.14 0" in="noise" result="tintNoise"/>
        <feComposite in="SourceGraphic" in2="tintNoise" operator="over"/>
      </filter>

      <!-- 荔枝纹防滑橡胶蒙皮图案 (Grip Knurled Rubber Pattern) -->
      <pattern id="leatherGrip" width="6" height="6" patternUnits="userSpaceOnUse">
        <rect width="6" height="6" fill="#14171f"/>
        <circle cx="2" cy="2" r="1.35" fill="#090b10"/>
        <circle cx="5" cy="5" r="1.25" fill="#090b10"/>
        <circle cx="1.6" cy="1.6" r="0.5" fill="#2a303d"/>
        <circle cx="4.6" cy="4.6" r="0.45" fill="#2a303d"/>
      </pattern>

      <!-- 镜头变焦环与对焦环精密滚花纹理 (Lens Knurling Ribs) -->
      <pattern id="knurlRibs" width="5" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
        <rect width="2.6" height="12" fill="#1b202b"/>
        <rect x="2.6" width="1.2" height="12" fill="#353d4f"/>
        <rect x="3.8" width="1.2" height="12" fill="#0b0d12"/>
      </pattern>

      <!-- 机身主渐变（左上方主光源） -->
      <linearGradient id="bodyFrontGrad" x1="0.1" y1="0" x2="0.85" y2="1">
        <stop offset="0%" stop-color="#3a4150"/>
        <stop offset="18%" stop-color="#262b36"/>
        <stop offset="65%" stop-color="#171a22"/>
        <stop offset="100%" stop-color="#0d0f14"/>
      </linearGradient>
      <linearGradient id="bodySideGrad" x1="0" y1="0" x2="1" y2="0.8">
        <stop offset="0%" stop-color="#475063"/>
        <stop offset="28%" stop-color="#2c3240"/>
        <stop offset="80%" stop-color="#151821"/>
        <stop offset="100%" stop-color="#0b0d12"/>
      </linearGradient>
      <linearGradient id="prismTopGrad" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0%" stop-color="#4a5366"/>
        <stop offset="35%" stop-color="#282e3b"/>
        <stop offset="100%" stop-color="#12151d"/>
      </linearGradient>

      <!-- 2. 阳极氧化金属与镀铬卡口渐变 (Anodized Metal & Brushed Chrome) -->
      <linearGradient id="barrelMetal" x1="0.18" y1="0.05" x2="0.82" y2="0.95">
        <stop offset="0%" stop-color="#4c5568"/>
        <stop offset="14%" stop-color="#647087"/>
        <stop offset="32%" stop-color="#232834"/>
        <stop offset="56%" stop-color="#141820"/>
        <stop offset="78%" stop-color="#2a3140"/>
        <stop offset="92%" stop-color="#10131a"/>
        <stop offset="100%" stop-color="#090b10"/>
      </linearGradient>
      <linearGradient id="chromeMetal" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="22%" stop-color="#94a3b8"/>
        <stop offset="45%" stop-color="#e2e8f0"/>
        <stop offset="68%" stop-color="#334155"/>
        <stop offset="88%" stop-color="#cbd5e1"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
      <linearGradient id="crimsonRing" x1="0" y1="0" x2="0.8" y2="1">
        <stop offset="0%" stop-color="#ff4d4d"/>
        <stop offset="35%" stop-color="#dc2626"/>
        <stop offset="75%" stop-color="#991b1b"/>
        <stop offset="100%" stop-color="#450a0a"/>
      </linearGradient>

      <!-- 3. 多层光学镀膜玻璃渐变 (Multi-coated Optical Glass Gradients) -->
      <radialGradient id="glassDeep" cx="46%" cy="44%" r="56%">
        <stop offset="0%" stop-color="#020409"/>
        <stop offset="48%" stop-color="#071226"/>
        <stop offset="74%" stop-color="#0f2942"/>
        <stop offset="92%" stop-color="#1e1b4b"/>
        <stop offset="100%" stop-color="#090d16"/>
      </radialGradient>
      <linearGradient id="coatingMagenta" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ec4899" stop-opacity="0.52"/>
        <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
      </linearGradient>
      <linearGradient id="coatingEmerald" x1="1" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#10b981" stop-opacity="0.48"/>
        <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
      </linearGradient>
      <linearGradient id="specularWhite" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
      </linearGradient>

      <!-- 台面环境光遮蔽投影 (Contact & Ambient Occlusion Shadow) -->
      <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000000" stop-opacity="0.92"/>
        <stop offset="55%" stop-color="#02040a" stop-opacity="0.65"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- 0. 摄影棚台面高光与接触阴影 -->
    <ellipse cx="460" cy="522" rx="380" ry="52" fill="url(#floorShadow)"/>
    <ellipse cx="520" cy="534" rx="235" ry="32" fill="url(#floorShadow)"/>
    <ellipse cx="325" cy="504" rx="185" ry="18" fill="rgba(0,0,0,0.85)"/>

    <!-- ==================== 1. 机身主体 (3/4 视角立体结构) ==================== -->
    <g id="camera-body">
      <!-- 左侧手柄外轮廓与3/4透视侧面 (Ergonomic Grip & Left Side Depth Plane) -->
      <!-- 手柄顶盖斜坡 -->
      <path d="M168 184 C195 162 246 156 286 164 L322 192 L228 214 Z" fill="url(#bodySideGrad)" stroke="#475569" stroke-width="1"/>
      <!-- 机身正面主框体 (Front Face Plate in 3/4 perspective, slanting down-right slightly) -->
      <path d="M218 190 L632 168 C654 168 668 182 668 205 L668 446 C668 468 650 482 626 484 L232 496 C196 496 172 476 172 442 L172 226 C172 202 192 192 218 190 Z"
            fill="url(#bodyFrontGrad)" stroke="#334155" stroke-width="1.5"/>

      <!-- 右侧侧面厚度块（体现右后方收窄透视） -->
      <path d="M632 168 L674 182 C686 188 692 200 692 218 L692 432 C692 452 680 468 656 476 L632 484 L652 450 L652 196 Z"
            fill="#141821" stroke="#293040" stroke-width="1"/>
      <!-- 左侧挂绳金属三角环与底座 -->
      <rect x="678" y="228" width="16" height="22" rx="4" fill="url(#chromeMetal)" stroke="#0f172a" stroke-width="1.5"/>
      <polygon points="686,246 699,264 676,264" fill="none" stroke="url(#chromeMetal)" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- 机身正面右侧防滑蒙皮区 -->
      <path d="M545 204 L654 198 L654 456 L545 464 Z" fill="url(#leatherGrip)" opacity="0.88"/>
      <path d="M545 204 L654 198 L654 456 L545 464 Z" fill="none" stroke="#0b0d13" stroke-width="2"/>

      <!-- 左侧隆起人体工学手柄握把（3D 弧面 + 荔枝纹防滑橡胶 + 高光棱线） -->
      <path d="M162 198 C162 174 195 162 238 168 C275 174 298 196 302 228 L302 466 C302 492 274 508 232 508 C184 508 158 486 158 452 Z"
            fill="url(#bodySideGrad)" stroke="#3f4859" stroke-width="1.5"/>
      <!-- 手柄防滑橡胶贴皮层 -->
      <path d="M168 228 C172 212 205 208 248 214 C278 218 292 234 292 258 L292 454 C292 478 268 494 230 494 C188 494 166 476 166 446 Z"
            fill="url(#leatherGrip)" stroke="#0d1017" stroke-width="2"/>
      <!-- 手柄指槽凹陷高光与红色旗舰竖条装饰 (Flagship Red Grip Stripe) -->
      <path d="M272 246 C258 295 258 380 272 448" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M204 218 C192 290 192 395 206 482" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="5" stroke-linecap="round"/>
      <!-- 手柄前拨轮 (Front Command Dial) -->
      <g transform="translate(226, 212) rotate(-10)">
        <rect x="-28" y="-9" width="56" height="18" rx="6" fill="#0f131a" stroke="#334155" stroke-width="1.5"/>
        <rect x="-24" y="-6" width="48" height="12" rx="3" fill="url(#knurlRibs)"/>
      </g>
      <!-- 手柄顶部斜切快门按钮与电源拨杆 (Angled Shutter Release Button) -->
      <g id="shutterGroup" transform="translate(226, 174) rotate(-14)" style="cursor:pointer">
        <ellipse cx="0" cy="6" rx="28" ry="13" fill="#1e2430" stroke="#475569" stroke-width="1.5"/>
        <ellipse cx="0" cy="2" rx="21" ry="9.5" fill="url(#chromeMetal)" stroke="#0f172a" stroke-width="1.2"/>
        <ellipse id="shutterCap" cx="0" cy="0" rx="16" ry="7" fill="#cbd5e1"/>
        <ellipse cx="-5" cy="-2" rx="7" ry="2.5" fill="#ffffff" opacity="0.8"/>
      </g>

      <!-- ==================== 2. 顶部军舰头、热靴与模式转盘 ==================== -->
      <!-- 军舰头五棱镜凸起 (Pentaprism Housing) -->
      <path d="M324 192 L358 106 C365 92 380 84 402 82 L508 78 C532 78 548 86 558 104 L594 180 L324 192 Z"
            fill="url(#prismTopGrad)" stroke="#475569" stroke-width="1.6"/>
      <!-- 军舰头侧面折面高光棱线 -->
      <path d="M358 106 L392 178 M558 104 L530 174" stroke="rgba(255,255,255,0.18)" stroke-width="2" fill="none"/>
      <path d="M372 98 L542 94" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none"/>

      <!-- 顶部金属热靴 (Metal Hot Shoe) -->
      <g transform="translate(454, 76)">
        <path d="M-38 6 L-30 -8 L30 -8 L38 6 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
        <path d="M-32 4 L-26 -5 L26 -5 L32 4" fill="none" stroke="url(#chromeMetal)" stroke-width="3.5"/>
        <rect x="-18" y="-3" width="36" height="6" rx="1" fill="#0f172a"/>
        <circle cx="0" cy="0" r="2.5" fill="#f59e0b"/>
      </g>

      <!-- 自创旗舰品牌与型号雕刻字样 (Custom Non-real Brand & Model Badge) -->
      <text x="456" y="138" fill="#f1f5f9" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="5" font-family="Georgia, serif">AETHERIA</text>
      <rect x="418" y="148" width="76" height="16" rx="4" fill="#0f141d" stroke="#475569" stroke-width="1"/>
      <text x="456" y="160" fill="#f59e0b" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="2">FX-9 MK IV</text>

      <!-- 右上肩部模式转盘（带分段刻度与可点击旋转） -->
      <g id="modeDialGroup" transform="translate(608, 146)" style="cursor:pointer">
        <!-- 转盘底座 -->
        <ellipse cx="0" cy="18" rx="44" ry="15" fill="#0d1017" stroke="#334155" stroke-width="1.5"/>
        <!-- 金属滚花侧壁 -->
        <path d="M-42 4 L-42 18 A42 14 0 0 0 42 18 L42 4 Z" fill="url(#knurlRibs)" stroke="#475569" stroke-width="1.2"/>
        <!-- 转盘顶面与分段刻度 -->
        <ellipse cx="0" cy="4" rx="42" ry="14" fill="#181d27" stroke="url(#chromeMetal)" stroke-width="2"/>
        <ellipse cx="0" cy="4" rx="32" ry="10" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" stroke-dasharray="4 5"/>
        <!-- 模式文字标记 -->
        <text id="modeLabel" x="0" y="8" fill="#fde047" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">M · P · Av · Tv</text>
        <!-- 白色对准指示线 -->
        <line x1="-38" y1="6" x2="-28" y2="5" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- 左肩副参数转盘 -->
      <g transform="translate(298, 156)">
        <path d="M-28 4 L-28 14 A28 9 0 0 0 28 14 L28 4 Z" fill="url(#knurlRibs)" stroke="#475569" stroke-width="1"/>
        <ellipse cx="0" cy="4" rx="28" ry="9" fill="#1e2432" stroke="url(#chromeMetal)" stroke-width="1.5"/>
        <circle cx="0" cy="4" r="5" fill="url(#chromeMetal)"/>
      </g>

      <!-- 机身正面辅助对焦灯、景深预览钮、镜头释放钮與金字铭牌 -->
      <circle cx="338" cy="236" r="11" fill="#0f172a" stroke="url(#chromeMetal)" stroke-width="2.5"/>
      <circle cx="338" cy="236" r="6" fill="#f59e0b" opacity="0.85"/>
      <circle cx="338" cy="234" r="2.5" fill="#ffffff"/>
      <!-- 镜头卡口释放按钮 -->
      <g transform="translate(612, 336)">
        <circle r="13" fill="#0f131a" stroke="#475569" stroke-width="1.5"/>
        <circle r="9" fill="url(#chromeMetal)"/>
      </g>
      <!-- 全画幅金标铭牌 -->
      <g transform="translate(592, 418)">
        <rect x="-24" y="-11" width="48" height="22" rx="4" fill="#111622" stroke="#eab308" stroke-width="1.5"/>
        <text x="0" y="4" fill="#fde047" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">FULL 35</text>
      </g>
    </g>

    <!-- ==================== 3. 3/4 视角多层可拆镜头 (Multi-tier Detachable Lens) ==================== -->
    <!-- 镜头光轴从机身卡口中心 (458, 332) 向右前方延伸至前组镜片中心 (555, 365) -->
    <!-- 在 3/4 视角下，每个正圆截面均为长轴略微倾斜（rotate(-8)）、短轴/长轴比 ~0.90 的同轴椭圆 -->
    <g id="detachable-lens">
      <!-- 镜头在机身与台面上的投射阴影 -->
      <ellipse cx="515" cy="488" rx="158" ry="26" fill="rgba(0,0,0,0.75)"/>

      <!-- 第 1 层：机身镀铬金属卡口环 (Bayonet Chrome Mount Ring at 458, 332) -->
      <g transform="translate(458, 332) rotate(-8)">
        <ellipse cx="-6" cy="4" rx="134" ry="146" fill="rgba(0,0,0,0.65)"/>
        <ellipse cx="0" cy="0" rx="132" ry="144" fill="url(#chromeMetal)" stroke="#0f172a" stroke-width="2"/>
        <ellipse cx="5" cy="2" rx="124" ry="136" fill="url(#barrelMetal)" stroke="#475569" stroke-width="1.5"/>
      </g>

      <!-- 第 2 层：后镜筒与对焦距离刻度窗 (Rear Barrel & Focus Distance Window at 482, 340) -->
      <g transform="translate(482, 340) rotate(-8)">
        <ellipse cx="0" cy="0" rx="126" ry="138" fill="url(#barrelMetal)" stroke="#334155" stroke-width="1.8"/>
        <!-- 顶部对焦距离窗 (Distance Scale Window) -->
        <g transform="translate(0, -116)">
          <rect x="-38" y="-11" width="76" height="20" rx="4" fill="#090c12" stroke="#475569" stroke-width="1.5"/>
          <line x1="-28" y1="2" x2="28" y2="2" stroke="#64748b" stroke-width="1"/>
          <text x="-22" y="-1" fill="#38bdf8" font-size="8" font-family="monospace">0.8</text>
          <text x="-3" y="-1" fill="#fde047" font-size="8.5" font-weight="700" font-family="monospace">1.5m</text>
          <text x="20" y="-1" fill="#f8fafc" font-size="9" font-family="monospace">∞</text>
          <line x1="0" y1="2" x2="0" y2="8" stroke="#ef4444" stroke-width="2"/>
        </g>
        <!-- 侧边 AF / MF 对焦模式拨杆 -->
        <g transform="translate(-118, -22) rotate(-72)">
          <rect x="-18" y="-7" width="36" height="14" rx="4" fill="#0d1118" stroke="#475569" stroke-width="1.2"/>
          <rect x="-15" y="-4" width="16" height="8" rx="2" fill="#e2e8f0"/>
          <text x="8" y="3" fill="#94a3b8" font-size="7" font-weight="800" text-anchor="middle">AF</text>
        </g>
      </g>

      <!-- 第 3 层：宽幅变焦防滑滚花环 (Zoom Knurled Ring at 508, 349) -->
      <g transform="translate(508, 349) rotate(-8)">
        <ellipse cx="0" cy="0" rx="124" ry="136" fill="url(#knurlRibs)" stroke="#0f172a" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="124" ry="136" fill="url(#barrelMetal)" opacity="0.58"/>
        <ellipse cx="10" cy="3" rx="120" ry="132" fill="url(#barrelMetal)" stroke="#334155" stroke-width="1.5"/>
      </g>

      <!-- 第 4 层：旗舰红圈装饰环与精密对焦环 (Luxury Crimson Ring & Focus Ring at 534, 358) -->
      <g transform="translate(534, 358) rotate(-8)">
        <!-- 标志性红圈 (Crimson Luxury Ring) -->
        <ellipse cx="-5" cy="-2" rx="121" ry="133" fill="none" stroke="url(#crimsonRing)" stroke-width="6.5"/>
        <!-- 前段精细对焦滚花环 -->
        <ellipse cx="4" cy="1" rx="119" ry="131" fill="url(#knurlRibs)" stroke="#1e293b" stroke-width="2"/>
        <ellipse cx="4" cy="1" rx="119" ry="131" fill="url(#barrelMetal)" opacity="0.52"/>
      </g>

      <!-- 第 5 层：前组滤镜螺纹圈、多层同心镜筒与大口径镀膜玻璃镜片 (Front Element & Multi-coated Glass at 555, 365) -->
      <g transform="translate(555, 365) rotate(-8)">
        <!-- 前外框阳极氧化铝环 -->
        <ellipse cx="0" cy="0" rx="118" ry="130" fill="url(#barrelMetal)" stroke="#475569" stroke-width="2"/>
        <!-- 多道同心消光螺纹槽 (Concentric Filter Threads & Anti-reflective Grooves) -->
        <ellipse cx="2" cy="0" rx="111" ry="122" fill="#0e121a" stroke="#334155" stroke-width="1.5"/>
        <ellipse cx="3" cy="0" rx="105" ry="116" fill="#090c12" stroke="#262d3d" stroke-width="1.2"/>
        <ellipse cx="4" cy="0" rx="99" ry="109" fill="#06080d" stroke="#1e293b" stroke-width="1.2"/>
        <ellipse cx="5" cy="0" rx="93" ry="102" fill="#04060a" stroke="#334155" stroke-width="1"/>

        <!-- 镜头前铭文环雕刻字样 (Lens Engraving Text) -->
        <text x="0" y="-104" fill="#cbd5e1" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="2.2">AETHERIA OPTICS · 50mm F/1.2 ULTRA</text>
        <text x="0" y="112" fill="#94a3b8" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="2">Ø 82mm · NANO MULTI-COATED · JAPAN</text>

        <!-- 前组大口径凸透镜玻璃基底 (Deep Optical Glass Element) -->
        <ellipse cx="7" cy="0" rx="86" ry="95" fill="url(#glassDeep)" stroke="#0f172a" stroke-width="2"/>

        <!-- 镜片深处 9 叶片圆形光圈结构与内组透镜同心圆 (Internal Aperture Blades & Inner Elements) -->
        <ellipse cx="14" cy="2" rx="64" ry="70" fill="#030712" stroke="#1e293b" stroke-width="1.5"/>
        <ellipse cx="18" cy="3" rx="46" ry="50" fill="#02040a" stroke="#172554" stroke-width="1.5"/>
        <!-- 光圈叶片多边形与叶片缝隙线 -->
        <g id="apertureRing" transform="translate(18, 3)">
          <polygon points="0,-30 22,-20 28,4 14,26 -14,26 -28,4 -22,-20" fill="#010206" stroke="#1e293b" stroke-width="1.5"/>
          <g stroke="#334155" stroke-width="1" opacity="0.65">
            <line x1="0" y1="-30" x2="22" y2="-44"/>
            <line x1="22" y1="-20" x2="42" y2="-16"/>
            <line x1="28" y1="4" x2="40" y2="24"/>
            <line x1="14" y1="26" x2="-4" y2="46"/>
            <line x1="-14" y1="26" x2="-36" y2="30"/>
            <line x1="-28" y1="4" x2="-44" y2="-14"/>
            <line x1="-22" y1="-20" x2="-12" y2="-44"/>
          </g>
          <!-- 传感器深处微弱琥珀红反光点 -->
          <ellipse cx="4" cy="2" rx="14" ry="16" fill="#31102f" opacity="0.7"/>
          <circle cx="-3" cy="-4" r="5" fill="#38bdf8" opacity="0.35"/>
        </g>

        <!-- 镜片多层纳米镀膜反光（洋红紫 + 翡翠绿 + 柔白弧形柔光箱高光） -->
        <g class="glint-sweep">
          <!-- 左上主柔光箱品红/紫镀膜弧面反射 -->
          <path d="M-58 -42 C-32 -84 28 -88 58 -52 C22 -58 -22 -36 -48 16 C-66 -4 -68 -24 -58 -42 Z"
                fill="url(#coatingMagenta)"/>
          <!-- 左上高光白弧（模拟球面凸透镜曲率） -->
          <path d="M-46 -46 C-24 -72 16 -74 36 -54 C8 -56 -22 -38 -36 -8 C-48 -20 -52 -34 -46 -46 Z"
                fill="url(#specularWhite)"/>
          <ellipse cx="-26" cy="-52" rx="14" ry="6" transform="rotate(-28 -26 -52)" fill="#ffffff" opacity="0.82"/>
          <circle cx="-42" cy="-32" r="4.5" fill="#ffffff" opacity="0.65"/>

          <!-- 右下副反射翡翠绿/青色镀膜反光 -->
          <path d="M56 46 C32 82 -20 86 -48 56 C-12 62 28 42 46 -6 C64 12 66 30 56 46 Z"
                fill="url(#coatingEmerald)"/>
          <ellipse cx="38" cy="52" rx="18" ry="7" transform="rotate(-32 38 52)" fill="#a7f3d0" opacity="0.45"/>
        </g>

        <!-- 镜片内沿金属压圈高光丝 -->
        <ellipse cx="7" cy="0" rx="86" ry="95" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.2"/>
      </g>
    </g>

    <!-- 快门释放闪光反馈层（默认透明，点击快门时闪动） -->
    <circle id="shutterFlash" cx="562" cy="365" r="92" fill="#ffffff" opacity="0" pointer-events="none"/>
  </svg>
  <div class="studio-bar">
    <span><strong>AETHERIA FX-9 + 50mm f/1.2</strong> · 纯手绘 SVG 拟物复刻（零位图 / 零外部素材）</span>
    <div class="studio-controls">
      <button class="act-btn" id="modeSwitchBtn" type="button">转动模式盘: M 档</button>
      <button class="act-btn" id="shutterTriggerBtn" type="button">按下快门释放</button>
    </div>
  </div>
</div>
<script>
  const modes = ['M · 手动曝光', 'Av · 光圈优先', 'Tv · 快门优先', 'P · 程序自动'];
  let mIdx = 0;
  function cycleMode() {
    mIdx = (mIdx + 1) % modes.length;
    document.getElementById('modeLabel').textContent = modes[mIdx];
    document.getElementById('modeSwitchBtn').textContent = `转动模式盘: ${modes[mIdx].split(' ')[0]} 档`;
  }
  function fireShutter() {
    const flash = document.getElementById('shutterFlash');
    const ap = document.getElementById('apertureRing');
    const cap = document.getElementById('shutterCap');
    cap.setAttribute('cy', '2.5');
    ap.setAttribute('transform', 'translate(18, 3) scale(0.68)');
    flash.setAttribute('opacity', '0.55');
    setTimeout(() => {
      cap.setAttribute('cy', '0');
      ap.setAttribute('transform', 'translate(18, 3) scale(1)');
      flash.setAttribute('opacity', '0');
    }, 150);
  }
  document.getElementById('modeSwitchBtn').addEventListener('click', cycleMode);
  document.getElementById('modeDialGroup').addEventListener('click', cycleMode);
  document.getElementById('shutterTriggerBtn').addEventListener('click', fireShutter);
  document.getElementById('shutterGroup').addEventListener('click', fireShutter);
</script>
</body>
</html>
