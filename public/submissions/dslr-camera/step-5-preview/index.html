<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拟物复刻 · 单反相机</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 20px; background: #eceff3;
    font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: min(96vw, 900px); border-radius: 20px; overflow: hidden;
    box-shadow: 0 30px 70px rgba(30,40,60,.18), 0 0 0 1px rgba(255,255,255,.7);
  }
  svg { display: block; width: 100%; height: auto; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .bar button {
    border: 1px solid rgba(60,80,110,.3); background: #fff; color: #33455e;
    font-size: 13px; letter-spacing: .1em; border-radius: 999px; padding: 9px 22px; cursor: pointer;
    transition: all .25s ease; box-shadow: 0 4px 14px rgba(40,60,90,.08);
  }
  .bar button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(40,60,90,.16); }
  .bar button:active { transform: translateY(0); }
  .hint { font-size: 12px; color: #7c8ba0; letter-spacing: .12em; }
  #dialTicks { transition: transform .55s cubic-bezier(.3,.9,.3,1.25); transform-origin: 399.6px 231.4px; }
  @media (max-width: 390px) { .hint { display: none; } }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="290 185 530 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3/4 视角手绘单反相机与可拆镜头">
  <defs>
    <!-- 背景与台面 -->
    <linearGradient id="backdrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1ea"/><stop offset=".62" stop-color="#e3e0d8"/><stop offset="1" stop-color="#d3d2cd"/>

    <radialGradient id="spot" cx=".42" cy=".3" r=".75">
      <stop offset="0" stop-color="#fffefa" stop-opacity=".9"/><stop offset="1" stop-color="#fffefa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfcec8"/><stop offset="1" stop-color="#b9bab6"/>
    </linearGradient>
    <radialGradient id="shadowG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3a4048" stop-opacity=".5"/><stop offset=".55" stop-color="#3a4048" stop-opacity=".22"/><stop offset="1" stop-color="#3a4048" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowT" cx=".5" cy=".5" r=".5">

    <linearGradient id="bodySide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33383f"/><stop offset="1" stop-color="#262a30"/>

    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454a52"/><stop offset=".6" stop-color="#383d44"/><stop offset="1" stop-color="#2a2e34"/>

    <linearGradient id="ringMid" x1="0" y1="0" x2="0" y2="1">

    <!-- 玻璃 -->

      <stop offset=".72" stop-color="#0d3f52"/><stop offset="1" stop-color="#061f30"/>

    <radialGradient id="glassInner" cx=".42" cy=".32" r=".9">

    <radialGradient id="hlSoft" cx=".5" cy=".5" r=".5">

    <!-- ============ 镜头系统 ============ -->

    <ellipse cx="576" cy="432" rx="10" ry="5" fill="#bfeaf0" opacity=".28"/>
    <!-- 距离刻度 -->
