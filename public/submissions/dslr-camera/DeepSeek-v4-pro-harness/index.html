<!-- 设计说明：拟物复刻 · 单反相机（3/4 前侧上视角）
     全部由内联 SVG 手工绘制（矩形/椭圆/路径/渐变/滤镜），零贴图零素材：
     机身带右侧面与顶面透视、多层镜筒+镜片反光、军舰头/模式转盘（可点击旋转）/
     快门/热靴/握把防滑纹理；金属/玻璃/磨砂塑料三种材质在同一光源下区分。 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拟物复刻 · 单反相机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif;min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 100% at 50% 18%,#232733 0%,#12141b 68%,#0b0c11 100%);padding:16px}
svg{display:block;width:min(96vw,940px);height:auto}
svg *{transform-box:view-box}
#dialMark{transition:transform .45s cubic-bezier(.25,.8,.35,1.2);transform-origin:445px 384px;cursor:pointer}
#lensGlass{transition:transform .16s ease}
#specStreak{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-9px)}to{transform:translateX(10px)}}
#vfLed{animation:vfblink 1.6s ease-in-out infinite}
@keyframes vfblink{0%,100%{opacity:.15}50%{opacity:.9}}
.hint{color:#7c8496;font-size:11px;letter-spacing:.2em;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div>
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="手绘单反相机拟物复刻">
<defs>
  <radialGradient id="studio" cx=".5" cy=".32" r=".95">
    <stop offset="0" stop-color="#2b303c"/><stop offset=".6" stop-color="#171a21"/><stop offset="1" stop-color="#0d0e13"/>
  </radialGradient>
  <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3a3e47"/><stop offset=".55" stop-color="#2c2f37"/><stop offset="1" stop-color="#1e2128"/>
  </linearGradient>
  <linearGradient id="bodyTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4a4f5a"/><stop offset="1" stop-color="#2b2e36"/>
  </linearGradient>
  <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2a2d34"/><stop offset="1" stop-color="#15171c"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2f4f7"/><stop offset=".3" stop-color="#b9bfc9"/><stop offset=".55" stop-color="#6f747e"/><stop offset=".8" stop-color="#c3c8d1"/><stop offset="1" stop-color="#8b9099"/>
  </linearGradient>
  <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#565b64"/><stop offset=".5" stop-color="#33363d"/><stop offset="1" stop-color="#22242a"/>
  </linearGradient>
  <linearGradient id="rubber" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2e3138"/><stop offset="1" stop-color="#101114"/>
  </linearGradient>
  <linearGradient id="redRing" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d81825"/><stop offset=".5" stop-color="#a50e1a"/><stop offset="1" stop-color="#5e060d"/>
  </linearGradient>
  <radialGradient id="glass" cx=".36" cy=".3" r=".95">
    <stop offset="0" stop-color="#5c6a9c"/><stop offset=".35" stop-color="#2c3556"/><stop offset=".72" stop-color="#141a33"/><stop offset="1" stop-color="#080b18"/>
  </radialGradient>
  <radialGradient id="glassInner" cx=".5" cy=".45" r=".6">
    <stop offset="0" stop-color="#0a0d1c"/><stop offset="1" stop-color="#05070f"/>
  </radialGradient>
  <linearGradient id="gripGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#232529"/><stop offset="1" stop-color="#0e0f12"/>
  </linearGradient>
  <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7a808a"/><stop offset="1" stop-color="#454a53"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="soft8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft18" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0.09 0 0 0 0.58  0 0.09 0 0 0.60  0 0 0.09 0 0.64  0 0 0 0.10 0"/>
  </filter>
  <pattern id="ridges" width="8" height="40" patternUnits="userSpaceOnUse">
    <path d="M4 0 V40" stroke="#2b2d33" stroke-width="2.6"/>
  </pattern>
  <clipPath id="bodyClip"><path d="M324 440 Q300 440 300 464 L300 716 Q300 740 324 740 L936 740 Q960 740 960 716 L960 464 Q960 440 936 440 Z"/></clipPath>
  <clipPath id="gripClip"><path d="M772 458 C 812 450, 848 452, 862 466 L916 704 C 922 722, 912 738, 892 738 L786 738 C 762 738, 748 722, 744 700 L730 486 C 728 464, 746 456, 772 458 Z"/></clipPath>
</defs>

<!-- 摄影棚背景 -->
<rect width="1200" height="900" fill="url(#studio)"/>
<ellipse cx="600" cy="796" rx="315" ry="34" fill="#000" opacity=".5" filter="url(#soft18)"/>
<ellipse cx="600" cy="788" rx="205" ry="20" fill="#000" opacity=".35" filter="url(#soft8)"/>

<g id="camera">

      <g fill="#3a3e45" font-size="10" font-weight="700" text-anchor="middle">

  <!-- 快门按钮 -->

  </g>

  <!-- 热靴 -->

    <path d="M585 360 L715 360 L770 332 L640 332 Z" fill="#14161a"/>
    <path d="M588 358 L712 358 L712 351 L588 351 Z" fill="url(#metal)"/>

  </g>

  <!-- 取景器提示灯 -->
  <circle id="vfLed" cx="808" cy="428" r="3" fill="#ff4d5e" opacity=".3"/>

  <!-- 背带扣 -->

  <path d="M942 434 Q952 430 956 442 L956 454 Q952 464 942 460 Z" fill="url(#metalDark)"/>

  <path d="M306 446 L954 446" stroke="#6d7483" stroke-width="2.4" opacity=".35"/>
  <path d="M306 733 L954 733" stroke="#101114" stroke-width="2" opacity=".5"/>
  <path d="M348 470 L348 700" stroke="#101114" stroke-width="1.6" opacity=".3"/>
  <text x="338" y="726" fill="#9298a3" font-size="13" letter-spacing="3">V4 PRO MARK II</text>
  <g fill="#1a1c22">
    <rect x="330" y="560" width="30" height="34" rx="6"/>
    <circle cx="345" cy="577" r="2.6"/>
  </g>
  <circle cx="556" cy="452" r="5" fill="#7d1f24"/><circle cx="556" cy="452" r="5" fill="none" stroke="#3a0e11" stroke-width="1.4"/>
  <circle cx="556" cy="452" r="9" fill="none" stroke="#6d7483" stroke-width="1.4" opacity=".6"/>
  <g fill="#0d0e12">
    <circle cx="742" cy="448" r="2.6"/><circle cx="756" cy="448" r="2.6"/><circle cx="770" cy="448" r="2.6"/>
  </g>
  <g stroke="#101114" stroke-width="1.6" opacity=".4">
    <line x1="340" y1="470" x2="340" y2="496"/><line x1="428" y1="448" x2="428" y2="470"/>
  </g>
  <circle cx="630" cy="736" r="7" fill="#14161a"/><circle cx="630" cy="736" r="3.4" fill="#3a3e45"/>

  <!-- 握把 -->
  <path d="M772 458 C 812 450, 848 452, 862 466 L916 704 C 922 722, 912 738, 892 738 L786 738 C 762 738, 748 722, 744 700 L730 486 C 728 464, 746 456, 772 458 Z" fill="url(#gripGrad)"/>
  <path d="M772 458 C 812 450, 848 452, 862 466 L916 704 C 922 722, 912 738, 892 738 L786 738 C 762 738, 748 722, 744 700 L730 486 C 728 464, 746 456, 772 458 Z" fill="url(#ridges)" clip-path="url(#gripClip)"/>
  <path d="M772 458 C 812 450, 848 452, 862 466" stroke="#5d636e" stroke-width="3" fill="none" opacity=".55"/>
  <path d="M862 466 C 890 520, 908 620, 916 704" stroke="#000" stroke-width="3" fill="none" opacity=".4"/>

    <ellipse cx="630" cy="570" rx="148" ry="136" fill="none" stroke="#000" stroke-width="2.5" opacity=".55"/>

<!-- 快门闪光遮罩 -->
<rect id="flash" width="1200" height="900" fill="#fff" opacity="0" pointer-events="none"/>
</svg>
<div class="hint">纯手绘 SVG · 点击模式转盘旋转 · 点击快门触发闪光</div>
</div>
<script>
const dialMark=document.getElementById('dialMark');
let ang=0;
document.getElementById('dial').addEventListener('click',()=>{
  ang=(ang+30)%360;
  dialMark.style.transform='rotate('+ang+'deg)';
});
const flash=document.getElementById('flash'),lensGlass=document.getElementById('lensGlass');
document.getElementById('shutter').addEventListener('click',()=>{
  lensGlass.style.transform='translate(0,4px)';
  setTimeout(()=>{lensGlass.style.transform='';},160);
  flash.animate([{opacity:0},{opacity:.85},{opacity:0}],{duration:340,easing:'ease-out'});
});
</script>
</body>
</html>
