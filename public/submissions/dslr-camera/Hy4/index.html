<!doctype html>
<html lang="zh-CN">

<title>DSLR Camera Replica · Hy4</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;place-items:center;background:#eef1f5;font:400 14px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif}
.stage{width:100%;max-width:1180px;box-shadow:0 40px 90px -50px #43506b}
svg{display:block;width:100%;height:auto}
/* 轻微动效：镜片反光流动 + 模式转盘可点击转动（首帧即为完整静态观感） */
.glintWrap{animation:glint 6.5s cubic-bezier(.5,0,.5,1) infinite}
@keyframes glint{
  0%{transform:translateY(-98px);opacity:0}
  10%{opacity:.5}
  38%{opacity:.5}
  52%{transform:translateY(98px);opacity:0}
  100%{transform:translateY(98px);opacity:0}}
#dialRot{transform-box:fill-box;transform-origin:50% 50%;
  transition:transform .55s cubic-bezier(.25,.9,.2,1);cursor:pointer}
#dialRot:hover{filter:brightness(1.09)}
.hint{font:500 11px/1 -apple-system,system-ui;letter-spacing:.14em;fill:#8b95a8}
.plate{font:700 15px/1 -apple-system,system-ui;letter-spacing:.22em;fill:#e9edf4}
.sub{font:600 9.5px/1 -apple-system,system-ui;letter-spacing:.18em;fill:#aab3c2}
.tick{stroke:#0e1116;stroke-width:1.6;stroke-linecap:round;opacity:.65}
.tick.w{stroke:#e8ecf2;opacity:.9}
.mode{font:700 8.5px/1 ui-monospace,Menlo,monospace;fill:#dfe5ee}
.scale{font:500 9px/1 ui-monospace,Menlo,monospace;fill:#cfd6e0}
.shutter{transform-box:fill-box;transform-origin:50% 50%;transition:transform .12s}
.shutter:active{transform:translateY(1px)}
</style>
</head>
<body>

<script>
const NS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

/* ---------- 镜筒：按“环表”程序化生成（纯 SVG 形状，无位图） ----------
   局部坐标系由 matrix(0.225,-0.974,0.974,0.225,520,332) 定义：
   局部 +Y = 镜筒轴向（屏幕上向右下，指向观察者），局部 +X = 屏幕上方。
   K=0.67 为截面圆的正投影短长轴比（由 lens 轴与视线夹角算出）。        */
const K=0.67,barrel=document.getElementById("barrel");
const RINGS=[[0,78,""],[12,76,""],[38,82,"rib"],[86,82,""],[94,74,""],
             [104,79,"rib"],[150,79,""],[158,71,"scale"],[190,71,""],
             [198,73,"red"],[206,73,"thread"],[215,68,""]];
function capsule(t1,r1,t2,r2){
  const y1=(K*r1).toFixed(2),y2=(K*r2).toFixed(2);
  return `M${r1},${t1} L${r2},${t2} A${r2},${y2} 0 0 1 ${-r2},${t2} L${-r1},${t1} A${r1},${y1} 0 0 1 ${r1},${t1} Z`;
}
for(let i=0;i<RINGS.length-1;i++){
  const [t1,r1,s1]=RINGS[i],[t2,r2]=RINGS[i+1];
  if(i>0&&r1<RINGS[i-1][1]){                       // 收缩台阶：朝前的环形端面
    const rp=RINGS[i-1][1];
    barrel.appendChild(el("ellipse",{cx:0,cy:t1,rx:rp,ry:(K*rp).toFixed(2),fill:"url(#stepG)"}));
  }
  const r=(r1+r2)/2;
  barrel.appendChild(el("path",{d:capsule(t1,r1,t2,r2),
    fill:s1==="red"?"url(#redG)":"url(#metalG)"}));
  if(s1==="rib"||s1==="thread"){
    const N=s1==="thread"?44:27;
    for(let j=0;j<=N;j++){
      const th=Math.PI*j/N,x=r*Math.cos(th),dy=-K*r*Math.sin(th);
      barrel.appendChild(el("line",{x1:x.toFixed(2),y1:(t1+dy).toFixed(2),
        x2:x.toFixed(2),y2:(t2+dy).toFixed(2),stroke:"#000","stroke-opacity":.30,
        "stroke-width":s1==="thread"?1.1:1.9}));
      barrel.appendChild(el("line",{x1:(x+1.4).toFixed(2),y1:(t1+dy).toFixed(2),
        x2:(x+1.4).toFixed(2),y2:(t2+dy).toFixed(2),stroke:"#fff","stroke-opacity":.2,
        "stroke-width":s1==="thread"?.7:1}));
    }
  }
  if(s1==="scale"){                                // 对焦距离刻度：贴合柱面（θ 从 8° 到 32°）
    const g=el("g",{}),R=71;
    [["∞",168],["3",178],["1",188]].forEach(([lab,t])=>{
      const a1=8*Math.PI/180,a2=32*Math.PI/180;
      g.appendChild(el("line",{x1:(R*Math.cos(a1)).toFixed(1),y1:(t-K*R*Math.sin(a1)).toFixed(1),
        x2:(R*Math.cos(a2)).toFixed(1),y2:(t-K*R*Math.sin(a2)).toFixed(1),
        class:"tick w","stroke-width":1.4}));
      const lt=t-K*R*Math.sin(43*Math.PI/180);
      const g2=el("g",{transform:"rotate(90)"});
      const tx=el("text",{x:lt.toFixed(1),y:-52,class:"scale","text-anchor":"middle"});
      tx.textContent=lab;g2.appendChild(tx);g.appendChild(g2);
    });
    barrel.appendChild(g);
  }
}
/* 卡口对位白点 */
barrel.appendChild(el("circle",{cx:74,cy:2,r:3.8,fill:"#f2f5fa",stroke:"#6d747d","stroke-width":.8}));

/* ---------- 模式转盘刻度与档位 ---------- */
const dialRot=document.getElementById("dialRot");
const DC=[620,260],RX=31,RY=12.6;
for(let i=0;i<12;i++){
  const a=i*Math.PI/6,r=i%3===0?0.78:0.88;
  const x1=DC[0]+Math.cos(a)*RX*r,y1=DC[1]+Math.sin(a)*RY*r;
  const x2=DC[0]+Math.cos(a)*RX*0.6,y2=DC[1]+Math.sin(a)*RY*0.6;
  dialRot.appendChild(el("line",{x1:x1.toFixed(1),y1:y1.toFixed(1),x2:x2.toFixed(1),
    y2:y2.toFixed(1),class:"tick"+(i%3===0?" w":""),"stroke-width":i%3===0?2:1.2}));
}
[["M",-90],["A",-30],["S",30],["P",90]].forEach(([m,deg])=>{
  const a=deg*Math.PI/180;
  const t=el("text",{x:(DC[0]+Math.cos(a)*RX*0.42).toFixed(1),
    y:(DC[1]+Math.sin(a)*RY*0.42+2.8).toFixed(1),class:"mode","text-anchor":"middle"});
  t.textContent=m;dialRot.appendChild(t);
});
/* 点击转盘切换档位 */
const MODES=["M","A","S","P"];let mi=0,dialAngle=0;
dialRot.addEventListener("click",()=>{
  mi=(mi+1)%MODES.length;dialAngle+=45;
  dialRot.style.transform="rotate("+dialAngle+"deg)";
  document.getElementById("modeTxt").textContent="MODE  "+MODES[mi];
});
/* 快门按钮轻反馈 */
const sh=document.querySelector(".shutter");
sh.addEventListener("pointerdown",()=>sh.style.transform="translateY(1.6px)");
sh.addEventListener("pointerup",()=>sh.style.transform="");
sh.addEventListener("pointerleave",()=>sh.style.transform="");
</script>
</body>
</html>
