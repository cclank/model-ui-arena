<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURELIS VX-7D | Full-frame DSLR</title>
<style>
  *{box-sizing:border-box}
  html{background:#e9e2d7}
  html,body{margin:0;min-height:100%}
  body{
    min-height:100svh; overflow-x:hidden; color:#241f19;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(120% 85% at 30% 14%, #fdf9f1 0%, #f4eee4 30%, #ebe4d8 55%, #ded6c8 82%, #d2c9ba 100%);
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(115% 90% at 50% 42%, transparent 52%, rgba(72,59,43,.16) 100%);
  }
  .stage{
    position:relative; z-index:1; min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    padding:2.5svh 0 15svh;
  }
  .shot{
    width:min(96vw, 84svh * 1.142857, 1180px);
    aspect-ratio:1200 / 1050;
    filter:drop-shadow(0 34px 34px rgba(73,58,39,.10));
  }
  .shot svg{display:block; width:100%; height:auto; overflow:visible}
  .hit-dial, .hit-shutter, #mode-dial, #shutter{cursor:pointer}
  #mode-dial:focus-visible, #shutter:focus-visible{outline:none}
  #mode-dial:focus-visible ellipse:last-of-type, #shutter:focus-visible ellipse:last-of-type{stroke:#c9bda7;stroke-width:2}
  .hit-dial, .hit-shutter{-webkit-tap-highlight-color:transparent}
  #shutterPress{transition:transform .09s cubic-bezier(.4,0,.2,1)}
  #shutterPress.pressed{transform:translateY(4px)}
  .glint{animation:glint 16s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
  @keyframes glint{
    0%,100%{transform:translate(0px,0px) rotate(0deg); opacity:.92}
    40%{transform:translate(9px,-6px) rotate(.7deg); opacity:1}
    70%{transform:translate(-4px,3px) rotate(-.4deg); opacity:.84}
  }
  .caption{
    position:absolute; z-index:2; left:0; right:0; bottom:max(20px, 4.2svh);
    text-align:center; pointer-events:none;
  }
  .rule{width:34px; height:1px; margin:0 auto 14px; background:rgba(72,61,46,.32)}
  .brand{margin:0 0 9px; font-size:10px; font-weight:600; letter-spacing:.56em; color:#6e6353; text-indent:.56em}
  .model{margin:0; font-size:clamp(28px,3.4vw,42px); line-height:1; font-weight:300; letter-spacing:.16em; color:#221d17; text-indent:.16em}
  .specs{margin:12px 0 0; font-size:9px; font-weight:500; letter-spacing:.26em; color:#7c7161; text-transform:uppercase}
  .dot{display:inline-block; width:3px; height:3px; margin:0 12px 2px; border-radius:50%; background:#a2957f; vertical-align:middle}
  .hint{margin:15px 0 0; font-size:7.5px; letter-spacing:.3em; color:#8b7f6d; opacity:.72; text-transform:uppercase}
  @media (max-width:620px){
    .stage{padding:1svh 0 16svh}
    .shot{width:94vw}
    .caption{bottom:5svh}
    .model{font-size:27px}
    .specs{font-size:7.6px; letter-spacing:.2em; margin-top:10px}
    .dot{margin:0 7px 2px}
    .brand{font-size:8.5px}
    .hint{margin-top:11px; font-size:6.8px}
  }
  @media (prefers-reduced-motion: reduce){
    .glint{animation:none}
    #shutterPress{transition:none}
  }
</style>

<script>
(function(){
  "use strict";
  var svg=document.querySelector("svg.camera");
  var marks=document.getElementById("modeMarks");
  var reduce=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var beta=0, target=0, spinTimer=0;
  var cx=marks?parseFloat(marks.getAttribute("data-cx"))||0:0;
  var cy=marks?parseFloat(marks.getAttribute("data-cy"))||0:0;
  var rx=marks?parseFloat(marks.getAttribute("data-rx"))||1:1;
  var ry=marks?parseFloat(marks.getAttribute("data-ry"))||1:1;
  var ticks=marks?Array.prototype.slice.call(marks.querySelectorAll(".dialTick")):[];
  var labels=marks?Array.prototype.slice.call(marks.querySelectorAll(".dialLabel")):[];
  function render(a){
    var i,el,base,ang,x1,y1,x2,y2,px,py;
    for(i=0;i<ticks.length;i++){
      el=ticks[i]; base=parseFloat(el.getAttribute("data-a"))||0; ang=base+a;
      x1=cx+rx*.80*Math.sin(ang); y1=cy-ry*.80*Math.cos(ang);
      x2=cx+rx*.93*Math.sin(ang); y2=cy-ry*.93*Math.cos(ang);
      el.setAttribute("d","M "+x1.toFixed(2)+","+y1.toFixed(2)+" L "+x2.toFixed(2)+","+y2.toFixed(2));
    }
    for(i=0;i<labels.length;i++){
      el=labels[i]; base=parseFloat(el.getAttribute("data-a"))||0; ang=base+a;
      px=cx+rx*.615*Math.sin(ang); py=cy-ry*.615*Math.cos(ang);
      el.setAttribute("transform","translate("+px.toFixed(2)+","+py.toFixed(2)+") scale(1 .84)");
    }
  }
  function spin(){
    if(!marks) return;
    target+=45;
    if(reduce){ beta=target; render(beta); return; }
    if(spinTimer) clearInterval(spinTimer);
    var start=beta, t0=performance.now();
    spinTimer=setInterval(function(){
      var k=Math.min(1,(performance.now()-t0)/280);
      var e=1-Math.pow(1-k,3);
      beta=start+(target-start)*e;
      render(beta);
      if(k>=1){ clearInterval(spinTimer); spinTimer=0; beta=target; render(beta); }
    },16);
  }
  function fire(){
    if(!press) return;
    press.classList.add("pressed");
    setTimeout(function(){ press.classList.remove("pressed"); },130);
  }
  svg.addEventListener("click",function(e){
    var t=e.target;
    if(t.closest && (t.closest(".hit-dial")||t.closest("#mode-dial"))){ spin(); return; }
    if(t.closest && (t.closest(".hit-shutter")||t.closest("#shutter"))){ fire(); }
  });
  var dial=document.getElementById("mode-dial");
  if(dial){ dial.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); spin(); } }); }
  var shut=document.getElementById("shutter");
  if(shut){ shut.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fire(); } }); }
})();
</script>
