        </g>

<script>
(function(){
  var dial=document.getElementById('dialRot');
  var hit=document.getElementById('modeDial');
  if(!dial||!hit) return;
  var angle=0,target=0,raf=0;
  function step(){
    angle+=(target-angle)*0.22;
    if(Math.abs(target-angle)<0.05) angle=target;
    dial.setAttribute('transform','rotate('+angle.toFixed(2)+' 49 -28)');
    raf=(angle!==target)?requestAnimationFrame(step):0;
  }
  function turn(){
    target+=90;
    if(!raf) raf=requestAnimationFrame(step);
  }
  hit.addEventListener('click',turn);
  hit.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();turn();}
  });
})();
</script>
