<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AETHERA R7 — 3/4 View</title>
<style>
/* ============================================================
   AETHERA R7  ·  单反相机 3/4 视角  ·  纯 HTML + CSS + SVG + JS
   场景构成：
     floor      —— 台面 + 接触投影 / 落影（3D 平面）
     rig        —— rotateX(-14deg) rotateY(33deg) 的 3D 机身
     每块面板是一张手写内联 SVG；镜筒与转盘由 JS 用切平面片
     拼成（无任何位图 / 外部资源 / 网络字体）。
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0b0d}
body{
  font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
}
/* ---------- 背景：干净的深色影棚 ---------- */
.viewport{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:
    radial-gradient(130% 95% at 22% 8%, rgba(255,244,226,.115), rgba(255,244,226,0) 56%),
    radial-gradient(85% 75% at 74% 94%, rgba(0,0,0,.66), rgba(0,0,0,0) 64%),
    linear-gradient(178deg,#1c1f25 0%,#141619 44%,#0a0b0d 100%);
}
/* 整体等比缩放：390px 宽时比例完全不变形 */
.scaler{
  position:relative;flex:none;width:1140px;height:790px;
  transform:scale(min(1, 100vw/1170, 88vh/845));
  -webkit-transform:scale(min(1, 100vw/1170, 88vh/845));
}
.stage{position:absolute;inset:0;perspective:1520px;perspective-origin:50% 43%}
.rigPos{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50px,34px)}
.rig{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;
     transform:rotateX(-14deg) rotateY(33deg)}
.pl{position:absolute;display:block}
svg.art{display:block;overflow:visible}
.g3{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.facet{position:absolute;backface-visibility:hidden}
.ptxt,.plate-btn{cursor:pointer}

/* ---------- SVG 排印 ---------- */
.wm      {font:600 9.4px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.215em;fill:#cdd2da}
.wm2     {font:400 4.6px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.34em;fill:#8d939d}
.mdl     {font:700 17px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.1em;fill:#d7dbe2}
.tiny    {font:600 5px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.26em;fill:#7f858f}
.mic     {font:500 3.5px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.16em;fill:#6c727b}
.lcd     {font:600 8px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;fill:#cfe6cf}
.dialtxt {font:700 6.2px/1 "Helvetica Neue",Arial,sans-serif;fill:#e2e6ec;text-anchor:middle}
.ring    {font:600 5.4px/1 "Helvetica Neue",Arial,sans-serif;fill:#e8ebf0;text-anchor:middle;
          -webkit-text-stroke:.18px rgba(0,0,0,.55)}
.faceletter{position:absolute;left:50%;transform-origin:50% 50%;font:700 5.6px/1 "Helvetica Neue",Arial,sans-serif;
            color:#eef1f5;text-align:center;white-space:nowrap;
            text-shadow:0 0 1px rgba(0,0,0,.8);-webkit-text-stroke:.15px rgba(0,0,0,.5)}

/* ---------- 页面底部细排 ---------- */
.credit{position:fixed;left:0;right:0;bottom:22px;text-align:center;
        font:500 9px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.42em;
        color:rgba(190,198,210,.28);pointer-events:none;user-select:none}
.credit b{font-weight:600;color:rgba(210,216,226,.42)}

/* ---------- 动效（静态首帧即正确：0% 为默认姿态） ---------- */
@media (prefers-reduced-motion:no-preference){
  #glassShine{transform-box:fill-box;transform-origin:50% 50%;
    animation:sheen 11s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes sheen{
    0%,100%{transform:translate(-4.5%,-4%) rotate(-3deg);opacity:.92}
    50%    {transform:translate(5%,4.5%) rotate(3.5deg);opacity:1}
  }
  #glassKick{transform-box:fill-box;transform-origin:50% 50%;
    animation:kick 17s ease-in-out infinite}
  @keyframes kick{0%,100%{opacity:.55}55%{opacity:1}}
  #ringBloom{animation:bloom 13s ease-in-out infinite}
  @keyframes bloom{0%,100%{opacity:.7}50%{opacity:1}}
}
#modeDial,#shutterBtn{transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
</style>
</head>
<body>
<main class="viewport">
 <div class="scaler">
  <div class="stage">
   <div class="rigPos">
    <div class="rig" id="rig">

     <!-- ===================== 台面 / 落影 ===================== -->
     <div class="pl" style="width:2600px;height:2200px;left:-1300px;top:-1100px;
          transform:rotateX(-90deg) translateZ(150px)">
      <svg class="art" width="2600" height="2200" viewBox="-1300 -1100 2600 2200">
       <defs>
        <radialGradient id="pool" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#fff3e2" stop-opacity=".085"/>
          <stop offset=".55" stop-color="#fff3e2" stop-opacity=".028"/>
          <stop offset="1" stop-color="#fff3e2" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vig" cx=".5" cy=".5" r=".5">
          <stop offset=".2" stop-color="#000" stop-opacity="0"/>
          <stop offset=".72" stop-color="#000" stop-opacity=".34"/>
          <stop offset="1" stop-color="#000" stop-opacity=".72"/>
        </radialGradient>
        <radialGradient id="shFar" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#000" stop-opacity=".55"/>
          <stop offset=".45" stop-color="#000" stop-opacity=".3"/>
          <stop offset="1" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="shMid" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#000" stop-opacity=".62"/>
          <stop offset=".38" stop-color="#000" stop-opacity=".34"/>
          <stop offset="1" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="shCore" cx=".5" cy=".5" r=".5">
          <stop offset=".35" stop-color="#000" stop-opacity=".9"/>
          <stop offset=".72" stop-color="#000" stop-opacity=".5"/>
          <stop offset="1" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bounce" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#9fb4cc" stop-opacity=".1"/>
          <stop offset="1" stop-color="#9fb4cc" stop-opacity="0"/>
        </radialGradient>
       </defs>
       <!-- 地面明暗：光来自左上前方 -->
       <ellipse cx="-430" cy="-150" rx="900" ry="620" fill="url(#pool)"/>
       <ellipse cx="360" cy="470" rx="1250" ry="760" fill="url(#vig)"/>
       <ellipse cx="-300" cy="-360" rx="700" ry="380" fill="url(#bounce)"/>

       <ellipse cx="330" cy="430" rx="560" ry="250" fill="url(#shFar)"/>
       <ellipse cx="215" cy="360" rx="430" ry="185" fill="url(#shMid)"/>
       <ellipse cx="60" cy="190" rx="290" ry="128" fill="url(#shCore)"/>
       <ellipse cx="8" cy="112" rx="238" ry="106" fill="url(#shCore)"/>
      </svg>
     </div>

     <!-- ===================== 机身：背面（安全层） ===================== -->
     <div class="pl" style="width:452px;height:300px;left:-226px;top:-150px;
          transform:rotateY(180deg) translateZ(226px)">
      <svg class="art" width="452" height="300" viewBox="-226 -150 452 300">
       <defs><linearGradient id="bkG" x1="-226" y1="-150" x2="226" y2="150" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2a2d33"/><stop offset="1" stop-color="#0f1114"/>
       </linearGradient></defs>
       <rect x="-226" y="-150" width="452" height="300" rx="15" fill="url(#bkG)"/>
      </svg>
     </div>

     <!-- ===================== 机身：右侧（背光面） ===================== -->
     <div class="pl" style="width:220px;height:300px;left:-110px;top:-150px;
          transform:rotateY(90deg) translateZ(226px)">
      <svg class="art" width="220" height="300" viewBox="-110 -150 220 300">
       <defs><linearGradient id="rtsG" x1="-110" y1="0" x2="110" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#0e1013"/><stop offset="1" stop-color="#1a1d21"/>
       </linearGradient></defs>
       <rect x="-110" y="-150" width="220" height="300" rx="12" fill="url(#rtsG)"/>
      </svg>
     </div>

     <!-- ===================== 机身：底面 ===================== -->
     <div class="pl" style="width:452px;height:220px;left:-226px;top:-110px;
          transform:rotateX(-90deg) translateZ(150px)">
      <svg class="art" width="452" height="220" viewBox="-226 -110 452 220">
       <defs><linearGradient id="btmG" x1="-226" y1="0" x2="226" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#0c0e11"/><stop offset="1" stop-color="#131518"/>
       </linearGradient></defs>
       <rect x="-226" y="-110" width="452" height="220" rx="10" fill="url(#btmG)"/>
      </svg>
     </div>

     <!-- ===================== 机身：左侧面（可见，元素右 = 机身前方） ===================== -->
     <div class="pl" style="width:220px;height:300px;left:-110px;top:-150px;
          transform:rotateY(-90deg) translateZ(226px)">
      <svg class="art" width="220" height="300" viewBox="-110 -150 220 300">
       <defs>
        <clipPath id="sClip"><rect x="-110" y="-150" width="220" height="300" rx="13"/></clipPath>
        <linearGradient id="sdBase" x1="-110" y1="-150" x2="110" y2="150" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#4b5059"/><stop offset=".34" stop-color="#383c44"/>
          <stop offset=".72" stop-color="#212429"/><stop offset="1" stop-color="#101215"/>
        </linearGradient>
        <linearGradient id="sdDoor" x1="0" y1="-40" x2="0" y2="96" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#3d414a"/><stop offset=".5" stop-color="#2a2d33"/>
          <stop offset="1" stop-color="#191b1f"/>
        </linearGradient>
        <linearGradient id="sdAoF" x1="46" y1="0" x2="110" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".62"/>
        </linearGradient>
        <linearGradient id="sdAoB" x1="0" y1="150" x2="0" y2="118" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="lugM" x1="0" y1="-30" x2="0" y2="24" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#c2c8d1"/><stop offset=".45" stop-color="#8b919b"/>
          <stop offset="1" stop-color="#4d525a"/>
        </linearGradient>
        <pattern id="sdGrain" width="5" height="5" patternUnits="userSpaceOnUse">
          <circle cx="1.1" cy="1.1" r=".5" fill="#fff" opacity=".045"/>
          <circle cx="3.6" cy="3.6" r=".55" fill="#000" opacity=".16"/>
        </pattern>
       </defs>
       <g clip-path="url(#sClip)">
        <rect x="-110" y="-150" width="220" height="300" fill="url(#sdBase)"/>
        <!-- 上肩亮带 -->
        <path d="M -110 -150 L 110 -150 L 110 -104 L -110 -116 Z" fill="#5b616b" opacity=".3"/>
        <rect x="-110" y="-116" width="220" height="266" fill="url(#sdGrain)"/>
        <!-- 电池 / 卡舱盖板 -->
        <rect x="-64" y="-34" width="126" height="132" rx="9" fill="url(#sdDoor)"/>
        <rect x="-64" y="-34" width="126" height="132" rx="9" fill="url(#sdGrain)" opacity=".8"/>
        <path d="M -62 -30 L 60 -30" stroke="#fff" stroke-opacity=".16" stroke-width="1.1" fill="none"/>
        <path d="M -62 96 L 60 96" stroke="#000" stroke-opacity=".55" stroke-width="1.6" fill="none"/>
        <!-- 盖板开启纹（防滑） -->
        <g stroke="#000" stroke-opacity=".4" stroke-width="1.5">
         <path d="M 46 -18 L 46 82"/><path d="M 52 -18 L 52 82"/><path d="M 58 -16 L 58 80"/>
        </g>
        <g stroke="#fff" stroke-opacity=".1" stroke-width="1">
         <path d="M 48 -18 L 48 82"/><path d="M 54 -18 L 54 82"/><path d="M 60 -16 L 60 80"/>
        </g>
        <!-- 麦克风孔 -->
        <g fill="#0a0c0e" opacity=".85">
         <circle cx="-84" cy="-70" r="2.6"/><circle cx="-76" cy="-70" r="2.6"/>
         <circle cx="-84" cy="-62" r="2.6"/><circle cx="-76" cy="-62" r="2.6"/>
        </g>
        <circle cx="-80" cy="-66" r="7" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="1"/>
        <!-- 背带耳（前后各一） -->
        <g>
         <path d="M 40 -104 L 76 -104 L 72 -80 L 44 -80 Z" fill="url(#lugM)"/>
         <path d="M 48 -100 L 68 -100 L 66 -87 L 50 -87 Z" fill="#14161a"/>
         <path d="M -86 -104 L -50 -104 L -54 -80 L -82 -80 Z" fill="url(#lugM)"/>
         <path d="M -78 -100 L -58 -100 L -60 -87 L -76 -87 Z" fill="#14161a"/>
        </g>
        <!-- 螺钉 -->
        <g>
         <circle cx="-88" cy="108" r="6" fill="#2a2d33" stroke="#000" stroke-opacity=".45"/>
         <path d="M -92 108 L -84 108" stroke="#0b0d10" stroke-width="1.6"/>
         <circle cx="-88" cy="108" r="6" fill="none" stroke="#fff" stroke-opacity=".14"/>
         <circle cx="20" cy="118" r="5" fill="#2a2d33" stroke="#000" stroke-opacity=".4"/>
         <path d="M 16 118 L 24 118" stroke="#0b0d10" stroke-width="1.4"/>
        </g>
        <!-- 型号钢印 -->
        <text x="-64" y="132" class="mic" transform="rotate(0)">AETHERA  R7</text>
        <!-- 前后环境光遮蔽 -->
        <rect x="40" y="-150" width="70" height="300" fill="url(#sdAoF)"/>
        <rect x="-110" y="112" width="220" height="38" fill="url(#sdAoB)"/>
        <rect x="-110" y="-150" width="6" height="300" fill="#fff" opacity=".1"/>
       </g>
      </svg>
     </div>

     <!-- ===================== 机身：顶板（元素下 = 机身前方） ===================== -->
     <div class="pl" style="width:452px;height:220px;left:-226px;top:-110px;
          transform:rotateX(90deg) translateZ(150px)">
      <svg class="art" width="452" height="220" viewBox="-226 -110 452 220">
       <defs>
        <clipPath id="tClip"><rect x="-226" y="-110" width="452" height="220" rx="11"/></clipPath>
        <linearGradient id="tpG" x1="-226" y1="-110" x2="180" y2="110" gradientUnits="userSpaceOnUse">

          <stop offset=".55" stop-color="#33373d"/><stop offset="1" stop-color="#1c1f23"/>
        </linearGradient>
        <linearGradient id="tpSheen" x1="-226" y1="-110" x2="60" y2="110" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
          <stop offset=".42" stop-color="#fff" stop-opacity=".03"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="tpEdgeF" x1="0" y1="110" x2="0" y2="86" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="lcdG" cx=".42" cy=".36" r=".78">
          <stop offset="0" stop-color="#243029"/><stop offset=".6" stop-color="#161d19"/>

        <linearGradient id="lcdSheen" x1="0" y1="-92" x2="0" y2="-20" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#cfe6cf" stop-opacity=".14"/>
          <stop offset="1" stop-color="#cfe6cf" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="btnG" x1="0" y1="-96" x2="0" y2="-56" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#585d66"/><stop offset=".5" stop-color="#34383f"/>
          <stop offset="1" stop-color="#1b1d21"/>
        </linearGradient>
       </defs>
       <g clip-path="url(#tClip)">
        <rect x="-226" y="-110" width="452" height="220" fill="url(#tpG)"/>
        <rect x="-226" y="-110" width="452" height="220" fill="url(#tpSheen)"/>

        <path d="M -80 -26 L -66 -26 L -62 118 L -76 118 Z" fill="#fff" opacity=".05"/>
        <!-- 顶部液晶屏 -->
        <rect x="92" y="-94" width="122" height="76" rx="5" fill="#0a0c0e"/>
        <rect x="95" y="-91" width="116" height="70" rx="3.4" fill="url(#lcdG)"/>
        <rect x="95" y="-91" width="116" height="70" rx="3.4" fill="url(#lcdSheen)"/>
        <rect x="95" y="-91" width="116" height="70" rx="3.4" fill="none" stroke="#000" stroke-opacity=".6"/>
        <text x="102" y="-62" class="lcd" opacity=".92">1/250</text>
        <text x="146" y="-62" class="lcd" opacity=".92">F2.8</text>
        <text x="102" y="-44" class="lcd" opacity=".8">ISO 400</text>
        <g fill="#cfe6cf" opacity=".55">
         <rect x="176" y="-70" width="6" height="22" rx="1"/><rect x="186" y="-70" width="6" height="22" rx="1"/>
         <rect x="196" y="-70" width="6" height="22" rx="1"/>
        </g>
        <text x="102" y="-30" class="mic" fill="#9fb8a2" opacity=".7">RAW  JPEG</text>
        <!-- 快门 / 电源标注 -->
        <text x="-176" y="96" class="tiny">ON</text>
        <text x="-176" y="52" class="tiny" opacity=".8">OFF</text>
        <path d="M -166 90 L -166 58" stroke="#c9ced7" stroke-opacity=".55" stroke-width="1.4" fill="none"/>
        <!-- 小按键（ISO / 补偿） -->
        <g>
         <ellipse cx="-196" cy="44" rx="15" ry="13" fill="#0b0d10"/>
         <ellipse cx="-196" cy="42" rx="14.4" ry="12.4" fill="url(#btnG)"/>
         <ellipse cx="-199" cy="39" rx="6" ry="4" fill="#fff" opacity=".1"/>
         <ellipse cx="-196" cy="42" rx="14.4" ry="12.4" fill="none" stroke="#000" stroke-opacity=".45"/>

        <rect x="-226" y="86" width="452" height="24" fill="url(#tpEdgeF)"/>

      </svg>
     </div>

     <!-- ===================== 军舰头：斜侧面 ×2 ===================== -->
     <div class="pl" style="width:120px;height:80px;left:-60px;top:-40px;
          transform:translate3d(-43px,-189px,-64px) rotateZ(13deg) rotateY(-90deg)">
      <svg class="art" width="120" height="80" viewBox="-60 -40 120 80">
       <defs><linearGradient id="hSlL" x1="0" y1="-40" x2="0" y2="40" gradientUnits="userSpaceOnUse">

       <rect x="-60" y="-40" width="120" height="80" fill="url(#hSlL)"/>
       <rect x="-60" y="30" width="120" height="10" fill="#000" opacity=".3"/>
       <rect x="-60" y="-40" width="120" height="3" fill="#fff" opacity=".22"/>
      </svg>
     </div>
     <div class="pl" style="width:120px;height:80px;left:-60px;top:-40px;
          transform:translate3d(43px,-189px,-64px) rotateZ(-13deg) rotateY(90deg)">
      <svg class="art" width="120" height="80" viewBox="-60 -40 120 80">
       <defs><linearGradient id="hSlR" x1="0" y1="-40" x2="0" y2="40" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#4b505a"/><stop offset=".5" stop-color="#2c3036"/>
        <stop offset="1" stop-color="#141618"/>
       </linearGradient></defs>
       <rect x="-60" y="-40" width="120" height="80" fill="url(#hSlR)"/>
      </svg>
     </div>

     <!-- ===================== 军舰头：顶面（热靴所在） ===================== -->
     <div class="pl" style="width:68px;height:120px;left:-34px;top:-60px;
          transform:translate3d(0,0,-64px) rotateX(90deg) translateZ(228px)">
      <svg class="art" width="68" height="120" viewBox="-34 -60 68 120">
       <defs>
        <linearGradient id="hTopG" x1="-34" y1="-60" x2="34" y2="60" gradientUnits="userSpaceOnUse">
         <stop offset="0" stop-color="#767c86"/><stop offset=".5" stop-color="#4d525b"/>
         <stop offset="1" stop-color="#2a2d33"/>
        </linearGradient>
        <radialGradient id="hAo" cx=".5" cy=".5" r=".5">
         <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/>
        </radialGradient>
       </defs>
       <rect x="-34" y="-60" width="68" height="120" rx="5" fill="url(#hTopG)"/>
       <rect x="-30" y="-54" width="60" height="108" rx="4" fill="url(#hAo)"/>
       <!-- 热靴底座凹槽 -->
       <rect x="-25" y="-49" width="50" height="63" rx="2.4" fill="#191b1f"/>
       <rect x="-25" y="-49" width="50" height="63" rx="2.4" fill="none" stroke="#000" stroke-opacity=".6"/>

<script>
(function(){
'use strict';
var doc=document;
var rig=doc.getElementById('rig');
if(!rig) return;

/* ---------- 统一光源：左上前方 ---------- */
var Lx=-0.52, Ly=-0.70, Lz=0.49;                 // 表面 → 光，单位向量
var hx=Lx, hy=Ly, hz=Lz+1;                       // 视线 (0,0,1) 与光的半程向量
var hl=Math.sqrt(hx*hx+hy*hy+hz*hz); hx/=hl; hy/=hl; hz/=hl;
var YAW=33*Math.PI/180, PIT=-14*Math.PI/180;     // 与 .rig 的旋转保持一致

/* ---------- 把世界方向投影为屏幕角度（y 向下） ---------- */
function sAng(vx,vy,vz){
  var x1=vx*Math.cos(YAW)+vz*Math.sin(YAW), y1=vy, z1=-vx*Math.sin(YAW)+vz*Math.cos(YAW);
  var x2=x1, y2=y1*Math.cos(PIT)-z1*Math.sin(PIT);
  return Math.atan2(y2,x2);
}
function C(v){ return v<0?0:(v>255?255:v)|0; }

/* 切面片通用样式层：上缘受光高光 + 下缘暗槽 */
var EDGE='linear-gradient(to bottom,rgba(255,255,255,.34) 0,rgba(255,255,255,.10) 5%,'+
         'rgba(255,255,255,0) 22%,rgba(0,0,0,0) 84%,rgba(0,0,0,.82) 97%,rgba(0,0,0,.92) 100%)';
var EDGE_V='linear-gradient(to bottom,rgba(255,255,255,.30) 0,rgba(255,255,255,.06) 4%,'+
           'rgba(255,255,255,0) 14%,rgba(0,0,0,.22) 92%,rgba(0,0,0,.5) 100%)';
/* 橡胶细密纹理（周向） */
var RUBBER='repeating-linear-gradient(to right,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 2px,'+
           'rgba(0,0,0,.22) 2px,rgba(0,0,0,.22) 4.2px,rgba(255,255,255,0) 4.2px,rgba(255,255,255,0) 7px)';
/* 金属滚花（周向 + 轴向） */
var KNURL='repeating-linear-gradient(to right,rgba(255,255,255,.10) 0,rgba(255,255,255,.10) 1.4px,'+
          'rgba(0,0,0,.28) 1.4px,rgba(0,0,0,.28) 3px,rgba(255,255,255,0) 3px,rgba(255,255,255,0) 6px),'+
          'repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 2px,'+
          'rgba(0,0,0,.16) 2px,rgba(0,0,0,.16) 4.6px,rgba(255,255,255,0) 4.6px,rgba(255,255,255,0) 9px)';
/* 手柄防滑颗粒（双轴交叉） */
var GRIPTEX='repeating-linear-gradient(to right,rgba(255,255,255,.055) 0,rgba(255,255,255,.055) 1.7px,'+
            'rgba(0,0,0,.2) 1.7px,rgba(0,0,0,.2) 3.6px,rgba(255,255,255,0) 3.6px,rgba(255,255,255,0) 9.6px),'+
            'repeating-linear-gradient(to bottom,rgba(255,255,255,.045) 0,rgba(255,255,255,.045) 1.7px,'+
            'rgba(0,0,0,.17) 1.7px,rgba(0,0,0,.17) 3.6px,rgba(255,255,255,0) 3.6px,rgba(255,255,255,0) 9.6px)';

function mkFacet(w,h){
  var d=doc.createElement('div');
  d.className='facet';
  d.style.width=w.toFixed(2)+'px'; d.style.height=h.toFixed(2)+'px';
  d.style.left=(-w/2).toFixed(2)+'px'; d.style.top=(-h/2).toFixed(2)+'px';
  return d;
}
/* 生成一段圆周的明暗渐变（10 个采样点 → 连续的高光滑移带） */
function shadeStops(o,phi,dn){
  var out=[],half=Math.PI/dn;
  for(var k=0;k<=10;k++){
    var s=-1+2*k/10, psi=phi+s*half;
    var nx=Math.sin(psi), ny=-Math.cos(psi);
    var lit=Math.max(0,nx*Lx+ny*Ly);
    var sp=Math.pow(Math.max(0,nx*hx+ny*hy),o.sh)*o.sa;
    var m=(0.28+0.98*lit)*o.ribV;
    out.push('rgb('+C(o.c[0]*m+255*sp)+','+C(o.c[1]*m+255*sp*1.03)+','+C(o.c[2]*m+255*sp*1.07)+') '+(k*10)+'%');
  }
  return 'linear-gradient(to right,'+out.join(',')+')';
}

/* ---------- 轴向 = 局部 Z 的圆柱（镜头筒：轴 = 世界 Z） ---------- */
function cylZ(host,o){
  var N=o.n,R=o.r,len=o.z1-o.z0,zm=(o.z0+o.z1)/2;
  var w=2*R*Math.tan(Math.PI/N);
  for(var i=0;i<N;i++){
    var phi=(i+0.5)*2*Math.PI/N;
    var f=mkFacet(w,len);
    var bg='';
    if(o.edge!==false) bg+=EDGE+',';
    if(o.tex) bg+=o.tex+',';
    bg+=shadeStops(o,phi,N);
    f.style.background=bg;
    f.style.transform='translate3d('+(R*Math.sin(phi)).toFixed(2)+'px,'+
                      (-R*Math.cos(phi)).toFixed(2)+'px,'+zm.toFixed(2)+'px) rotateZ('+
                      (phi*57.29578).toFixed(2)+'deg) rotateX(90deg)';
    host.appendChild(f);
  }
}

/* ---------- 轴向 = 世界 Y 的圆柱（转盘 / 手柄弧面） ---------- */
function cylY(host,o){
  var N=o.n,R=o.r,len=o.y1-o.y0,ym=(o.y0+o.y1)/2;
  var w=2*R*Math.tan(Math.PI/N);
  for(var i=0;i<N;i++){
    var psi=(i+0.5)*2*Math.PI/N;
    var st=[],half=Math.PI/N;
    for(var k=0;k<=10;k++){
      var s=-1+2*k/10, ph=psi+s*half;
      var nx=Math.sin(ph), nz=Math.cos(ph);
      var lit=Math.max(0,nx*Lx+nz*Lz);
      var sp=Math.pow(Math.max(0,nx*hx+nz*hz),o.sh)*o.sa;
      var m=(0.28+0.98*lit)*o.ribV;
      st.push('rgb('+C(o.c[0]*m+255*sp)+','+C(o.c[1]*m+255*sp*1.03)+','+C(o.c[2]*m+255*sp*1.07)+') '+(k*10)+'%');
    }
    var f=mkFacet(w,len);
    var bg=(o.tex||'')+(o.tex?',':'')+(o.edge===false?'':(o.edgeMode?EDGE_V:EDGE_V)+',')+
           'linear-gradient(to right,'+st.join(',')+')';
    f.style.background=bg;
    f.style.transform='translate3d('+(R*Math.sin(psi)).toFixed(2)+'px,'+ym.toFixed(2)+'px,'+
                      (R*Math.cos(psi)).toFixed(2)+'px) rotateY('+(psi*57.29578).toFixed(2)+'deg)';
    host.appendChild(f);
  }
}
/* 部分圆弧（手柄） */
function arcY(host,o){
  var a0=o.a0*Math.PI/180,a1=o.a1*Math.PI/180,N=o.n,R=o.r;
  var len=o.y1-o.y0,ym=(o.y0+o.y1)/2,w=2*R*Math.tan((a1-a0)/(2*N)),half=(a1-a0)/(2*N);
  for(var i=0;i<N;i++){
    var psi=a0+(a1-a0)*(i+0.5)/N, st=[];
    for(var k=0;k<=10;k++){
      var s=-1+2*k/10, ph=psi+s*half;
      var nx=Math.sin(ph), nz=Math.cos(ph);
      var lit=Math.max(0,nx*Lx+nz*Lz);
      var sp=Math.pow(Math.max(0,nx*hx+nz*hz),o.sh)*o.sa;
      var m=(0.26+0.96*lit)*o.ribV;
      st.push('rgb('+C(o.c[0]*m+255*sp)+','+C(o.c[1]*m+255*sp*1.03)+','+C(o.c[2]*m+255*sp*1.07)+') '+(k*10)+'%');
    }
    var f=mkFacet(w,len);
    f.style.background=o.tex+','+EDGE_V+',linear-gradient(to right,'+st.join(',')+')';
    f.style.transform='translate3d('+(R*Math.sin(psi)).toFixed(2)+'px,'+ym.toFixed(2)+'px,'+
                      (R*Math.cos(psi)).toFixed(2)+'px) rotateY('+(psi*57.29578).toFixed(2)+'deg)';
    host.appendChild(f);
  }
}

/* ======================= 镜头筒：多层镜筒 ======================= */
var barrel=doc.getElementById('barrelHost');
if(barrel){
  var RINGS=[
    /* 后金属环 */      {n:36,r:126,z0:11,z1:35, c:[116,122,132],sh:26,sa:.72,tex:KNURL},
    /* 变焦环（橡胶） */  {n:40,r:130,z0:35,z1:120,c:[32,33,37],  sh:26,sa:.18,tex:RUBBER},
    /* 对焦环（金属滚花）*/ {n:40,r:127,z0:120,z1:158,c:[124,130,140],sh:22,sa:.85,tex:KNURL},
    /* 刻度带 */        {n:36,r:123,z0:158,z1:171,c:[22,24,28],  sh:30,sa:.2},
    /* 铭牌环 */        {n:36,r:120,z0:171,z1:187,c:[30,32,36],  sh:28,sa:.24},
    /* 红圈 */          {n:36,r:126,z0:187,z1:198,c:[186,28,42],sh:24,sa:.62},
    /* 滤镜环 */        {n:36,r:124,z0:198,z1:207,c:[122,128,138],sh:24,sa:.7},
    /* 前圈 */          {n:36,r:120,z0:207,z1:218,c:[98,103,112], sh:20,sa:.88}
  ];
  for(var i=0;i<RINGS.length;i++){
    var o=RINGS[i];
    o.ribV=1; o.edge=true;
    cylZ(barrel,o);
  }
  /* 前筒内部的暗腔（遮住接缝） */
  var cav=doc.createElement('div');
  cav.className='facet';
  cav.style.cssText='left:-118px;top:-118px;width:236px;height:236px;border-radius:50%;'+
                    'background:radial-gradient(circle at 42% 36%,#0a0d11,#04050a 70%,#010203);';
  cav.style.transform='translateZ(212px)';
  barrel.appendChild(cav);
}

/* ======================= 对焦距离刻度（缓慢转动） ======================= */
var scaleLayer=doc.getElementById('scaleLayer');
var scaleItems=[], spinAngle=0;
if(scaleLayer){
  var TEXTS=['0.35','0.5','0.7','1','1.5','2','3','5','10','20','∞'];
  var RS=122.5, ZS=0;
  for(var i=0;i<40;i++){
    var t=doc.createElement('div');
    var major=(i%3===0);
    var tw=major?9.5:5.5;
    t.style.cssText='position:absolute;width:'+tw+'px;height:'+(major?1.5:1)+'px;'+
      'left:'+(-tw/2)+'px;top:'+(major?-5.5:-3.5)+'px;border-radius:.6px;'+
      'background:rgba(236,240,246,'+(major?.92:.55)+');';
    scaleLayer.appendChild(t);
    scaleItems.push({el:t,base:i*9,kind:'t'});
  }
  for(var j=0;j<TEXTS.length;j++){
    var lb=doc.createElement('div');
    lb.className='faceletter';
    lb.textContent=TEXTS[j];
    lb.style.width='30px'; lb.style.marginLeft='-15px';
    lb.style.top='3px';
    scaleLayer.appendChild(lb);
    scaleItems.push({el:lb,base:j*(360/TEXTS.length),kind:'l'});
  }
  function layoutScale(deg){
    for(var k=0;k<scaleItems.length;k++){
      var it=scaleItems[k];
      var psi=((it.base+deg)*Math.PI)/180;
      var ax=sAng(-Math.cos(psi),Math.sin(psi),0);
      var rot=(-90+90-ax)*57.29578;
      it.el.style.transform='translate3d('+(RS*Math.sin(psi)).toFixed(2)+'px,'+
        (-RS*Math.cos(psi)).toFixed(2)+'px,'+ZS+'px) rotateZ('+(psi*57.29578).toFixed(2)+'deg) rotateX(90deg)'+
        (it.kind==='l'?' rotate('+rot.toFixed(2)+'deg)':'');
    }
  }
  layoutScale(0);
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!reduce){
    var t0=null;
    function spin(ts){
      if(t0===null) t0=ts;
      var sec=(ts-t0)/1000;
      /* 缓入缓出的一圈对焦行程，周期约 26 秒 */
      spinAngle=360*(0.5-0.5*Math.cos(sec*2*Math.PI/26));
      layoutScale(spinAngle);
      requestAnimationFrame(spin);
    }
    requestAnimationFrame(spin);
  }
}

/* ======================= 手柄弧面 ======================= */
var grip=doc.getElementById('gripGroup');
if(grip){

  seam.style.transform='translate3d(52px,0,0)';

/* ======================= 模式转盘刻度与字母 ======================= */
var dTicks=doc.getElementById('dTicks'), dMinor=doc.getElementById('dTicksMinor'),
    dModes=doc.getElementById('dModes');
var MODES=['M','A','S','P','A3','S1','C1','B','U1','U2','U3','SCN'];
if(dTicks&&dMinor&&dModes){
  var NS='http://www.w3.org/2000/svg';
  for(var i=0;i<12;i++){
    var a=(-90+i*30)*Math.PI/180;
    var p1=doc.createElementNS(NS,'path');
    p1.setAttribute('d','M 0 -30.5 L 0 -26.6');
    p1.setAttribute('transform','rotate('+(i*30-90)+')');
    dTicks.appendChild(p1);
    for(var j=1;j<3;j++){
      var p2=doc.createElementNS(NS,'path');
      p2.setAttribute('d','M 0 -30.2 L 0 -28.4');
      p2.setAttribute('transform','rotate('+(i*30+j*10-90)+')');
      dMinor.appendChild(p2);
    }
    var tx=doc.createElementNS(NS,'text');
    tx.setAttribute('x',0); tx.setAttribute('y',0);
    tx.setAttribute('class','dialtxt');
    tx.setAttribute('transform','translate('+(20.5*Math.sin(a)).toFixed(2)+','+
                     (-20.5*Math.cos(a)).toFixed(2)+') rotate('+(i*30).toFixed(1)+')');
    tx.textContent=MODES[i];
    dModes.appendChild(tx);
  }
}

/* ======================= 各转盘侧壁（切面片） ======================= */
function dial(hostId,r,h,c,sh,sa,tex,n){
  var host=doc.getElementById(hostId);
  if(host) cylY(host,{n:n||26,r:r,y0:0,y1:h,c:c,sh:sh,sa:sa,ribV:1,tex:tex,edgeMode:true});
}
dial('modeDialSide',38,18,[104,110,120],22,.7,KNURL,30);
dial('shutterSide',23,13,[120,126,136],26,.6,null,22);

dial('driveDialSide',22,13,[96,101,110],24,.55,null,20);

/* ======================= 交互：模式转盘 / 快门 / 微视差 ======================= */
var modeDial=doc.getElementById('modeDial'), shutter=doc.getElementById('shutterBtn');
var dialAngle=-24, dialTarget=-24;
if(modeDial){
  modeDial.addEventListener('click',function(){
    dialTarget+=45;
    modeDial.style.transform='translate3d(132px,-150px,-60px) rotateX(90deg) rotateZ('+dialTarget+'deg)';
  });
}
if(shutter){
  shutter.addEventListener('pointerdown',function(){
    shutter.style.transform='translate3d(-150px,-147px,-32px) rotateX(90deg)';
  });
  shutter.addEventListener('pointerup',function(){
    shutter.style.transform='translate3d(-150px,-150px,-32px) rotateX(90deg)';
  });
  shutter.addEventListener('pointerleave',function(){
    shutter.style.transform='translate3d(-150px,-150px,-32px) rotateX(90deg)';
  });
}
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!reduce&&window.matchMedia&&window.matchMedia('(pointer:fine)').matches){
  var rigEl=doc.querySelector('.rig'), tx0=0, ty0=0, cx=0, cy=0;
  window.addEventListener('pointermove',function(e){
    tx0=(e.clientX/window.innerWidth-0.5)*2;
    ty0=(e.clientY/window.innerHeight-0.5)*2;
  });
  (function loop(){
    cx+=(tx0-cx)*0.045; cy+=(ty0-cy)*0.045;
    rigEl.style.transform='rotateX('+(-14+cy*2.4).toFixed(3)+'deg) rotateY('+(33-cx*2.6).toFixed(3)+'deg)';
    requestAnimationFrame(loop);
  })();
}
})();
</script>
