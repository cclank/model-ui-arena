<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#f4f6f9 0%,#dfe3ea 55%,#c9cfd9 100%);font-family:-apple-system,"PingFang SC",sans-serif}
.stage{position:relative;width:min(97vw,940px);filter:drop-shadow(0 30px 50px rgba(30,40,60,.28))}
svg{display:block;width:100%;height:auto}
.hint{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font-size:12px;letter-spacing:.28em;color:#7c8698}
/* 镜片反光流动 */
.sweep{animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translate(-46px,-30px);opacity:.15}45%{opacity:.75}50%{transform:translate(52px,34px);opacity:.55}55%{opacity:.15}}
.coat{animation:coat 9s ease-in-out infinite alternate}
@keyframes coat{from{opacity:.25}to{opacity:.55}}
.led{animation:led 2.6s steps(1) infinite}
@keyframes led{0%,70%{opacity:.25}75%,100%{opacity:1}}
#dialTop{transition:transform .45s cubic-bezier(.34,1.56,.64,1);transform-box:view-box;transform-origin:470px 238px}
.shutter{cursor:pointer;transition:transform .12s}
.shutter:active{transform:translateY(3px)}
</style>

<script>
// 少量脚本：为变焦 / 对焦环生成轴向滚花纹理（手绘几何，非素材）
(function(){
  const NS="http://www.w3.org/2000/svg";
  const ax=164.6*Math.PI/180;                 // 镜筒轴向（画面方向角）
  const a={x:Math.cos(ax),y:Math.sin(ax)}, b={x:-Math.sin(ax),y:Math.cos(ax)};
  const K=0.8;                                 // 3/4 透视压缩系数
  function band(c1,R1,c2,R2,n){
    let hi="";
    for(let i=0;i<n;i++){
      const p=i/n*2*Math.PI, cs=Math.cos(p), sn=Math.sin(p);
      const x1=c1.x+K*R1*cs*a.x+R1*sn*b.x, y1=c1.y+K*R1*cs*a.y+R1*sn*b.y;
      const x2=c2.x+K*R2*cs*a.x+R2*sn*b.x, y2=c2.y+K*R2*cs*a.y+R2*sn*b.y;
      hi+=(i%3===0)?`M${x1.toFixed(1)},${y1.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)} `:"";
    }
    return hi;
  }
  const zoom=band({x:316,y:382},80,{x:274,y:393},84,44);
  const foc =band({x:274,y:393},84,{x:248,y:400},88,44);
  document.getElementById("ribZoom").setAttribute("d",zoom);
  document.getElementById("ribFocus").setAttribute("d",foc);
  document.getElementById("ribZoomHi").setAttribute("d",band({x:316,y:382},80,{x:274,y:393},84,11));
  document.getElementById("ribFocusHi").setAttribute("d",band({x:274,y:393},84,{x:248,y:400},88,11));
})();
// 点击模式转盘：30° 分档位旋转（M → A → S → P）
(function(){
  const MODES=["M","A","S","P"];let idx=0;
  const dial=document.getElementById("dialTop");
  const svgDial=dial.closest("g");
  document.addEventListener("pointerdown",e=>{
    const r=svgDial.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2*(238/250);
    if(Math.hypot(e.clientX-cx,e.clientY-cy)>Math.max(40,r.width*0.07))return;
    idx=(idx+1)%4;
    dial.style.transform=`rotate(${idx*30}deg)`;
    document.title="NOVAX AURA-9 · 模式 "+MODES[idx];
  },{passive:true});
})();
</script>
