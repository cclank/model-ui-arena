<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花火 / Make a little magic</title>
<!-- 设计说明：午夜靛蓝与手写般的金色轨迹，点击即点亮夜空。
烟花由重力、阻尼、寿命与加色尾迹构成，限制粒子数量。
支持鼠标、触摸、三种配色和自动演出，声音默认关闭。 -->
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1d;color:#f4e8d5;font-family:Arial,"PingFang SC",sans-serif;overflow:hidden;height:100svh}canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:fixed;inset:0;pointer-events:none;padding:35px 42px;display:flex;flex-direction:column;justify-content:space-between}.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:4px}.tiny{font:9px monospace;letter-spacing:2px;color:#7d88a0}.hero{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);text-align:center;width:95%;transition:opacity 1s}.hero h1{font:italic clamp(56px,10vw,112px) Georgia,serif;line-height:1;letter-spacing:-4px;font-weight:400;margin:20px 0;color:#eee3d2;text-shadow:0 4px 25px #070c20}.hero .cn{font-size:12px;letter-spacing:6px;color:#a39886}.hint{font-size:10px;letter-spacing:2px;color:#747e96;margin-top:28px}.controls{pointer-events:auto;display:flex;gap:7px;align-items:center;padding:7px;background:#151c2bcc;border:1px solid #2d3548;border-radius:30px;backdrop-filter:blur(10px)}button{cursor:pointer;border:0;background:transparent;color:#8190aa;font-size:10px;padding:9px 11px;border-radius:20px}.active{color:#f2dfbd;background:#2d3040}button:focus-visible{outline:2px solid #efbf87}.counter{font:12px monospace;color:#e4c49b}.counter small{display:block;font-size:8px;color:#636f88;letter-spacing:2px;margin-top:7px}.skyline{position:absolute;bottom:60px;left:0;width:100%;height:80px;opacity:.45}.skyline path{fill:#10192c}.side{writing-mode:vertical-rl;position:absolute;right:43px;top:42%;font-size:9px;letter-spacing:4px;color:#485b76}
@media(max-width:550px){.overlay{padding:25px 22px}.top .tiny{font-size:8px;letter-spacing:1px}.hero h1{font-size:69px;letter-spacing:-3px}.hero .cn{font-size:10px;letter-spacing:4px}.bottom{align-items:flex-end}.controls{gap:0;padding:4px}button{padding:9px 8px;font-size:9px}.side{right:22px}.counter{font-size:10px}.counter small{font-size:7px}}
</style></head><body><canvas id="sky" aria-label="可交互烟花夜空"></canvas><div class="overlay"><header class="top"><div class="brand">花火 / HANABI</div><div class="tiny">A SMALL CELEBRATION OF NOW</div></header><div class="hero" id="hero"><div class="cn">让这一刻，亮起来。</div><h1>Make a little<br>magic.</h1><div class="hint">点击夜空 · 或用手指轻触</div></div><div class="side">EVERY SPARK HAS A STORY</div><svg class="skyline" viewBox="0 0 1000 100" preserveAspectRatio="none"><path d="M0 100V80h40V50h17v30h25V40h20v40h40V63h70v17h20V25h12V10h3v15h12v55h65V49h35v31h55V65h22v15h80V40h45v40h65V60h55v20h28V35h13V20h4v15h12v45h80V50h50v30h100V65h30v15h90V47h36v33h90v20Z"/></svg><footer class="bottom"><div class="counter"><span id="count">000</span> MOMENTS<small>CLICK ANYWHERE TO CELEBRATE</small></div><div class="controls" aria-label="烟花控制"><button class="active" data-p="0">香槟</button><button data-p="1">极光</button><button data-p="2">霓虹</button><button id="auto">自动</button><button id="sound">声音关</button></div></footer></div>
<script>
const canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);let w,h,dpr,particles=[],stars=[],palette=0,shots=0,auto=false,sound=false,audio,last=0,lastAuto=0;
const colors=[['#ffcf84','#fff1c5','#eaaa68'],['#94e6cf','#8ca6ff','#dfd0ff'],['#ff669e','#6ccfff','#d6fc8c']];function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#080d1d';ctx.fillRect(0,0,w,h);stars=Array.from({length:90},()=>({x:Math.random()*w,y:Math.random()*h*.8,a:Math.random()*.4+.1}))}resize();addEventListener('resize',resize);
function boom(x,y,quiet=false){if(!quiet){shots++;$('#count').textContent=String(shots).padStart(3,'0');$('#hero').style.opacity='.14'}let n=70+Math.floor(Math.random()*55),speed=65+Math.random()*105,color=colors[palette][Math.floor(Math.random()*3)],ring=Math.random()<.4;for(let i=0;i<n;i++){let a=i/n*Math.PI*2,v=speed*(ring?.9+Math.random()*.1:.3+Math.random()*.7);particles.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1.3+Math.random()*1.1,age:0,color,width:.8+Math.random()*1.3})}if(particles.length>2200)particles.splice(0,particles.length-2200);if(sound&&!quiet)tone()}
function tone(){try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(100+Math.random()*80,t);o.frequency.exponentialRampToValueAtTime(30,t+.25);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.45)}catch{sound=false;$('#sound').textContent='声音不可用'}}
document.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;boom(e.clientX,e.clientY)});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{palette=+b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x===b))});$('#auto').onclick=()=>{auto=!auto;$('#auto').classList.toggle('active',auto)};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'声音开':'声音关';$('#sound').classList.toggle('active',sound);if(sound)tone()};
function frame(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(8,13,29,${1-Math.exp(-dt*6)})`;ctx.fillRect(0,0,w,h);for(let s of stars){ctx.fillStyle=`rgba(166,190,221,${s.a*(.7+.3*Math.sin(t*.0007+s.x))})`;ctx.fillRect(s.x,s.y,1,1)}ctx.globalCompositeOperation='lighter';for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.age+=dt;if(p.age>p.life){particles.splice(i,1);continue}p.px=p.x;p.py=p.y;p.vx*=Math.exp(-dt*.8);p.vy=p.vy*Math.exp(-dt*.55)+42*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=(1-p.age/p.life)**1.2;ctx.strokeStyle=p.color;ctx.lineWidth=p.width;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();if(Math.random()<.05){ctx.fillStyle='#fff';ctx.fillRect(p.x-1,p.y-1,2,2)}}ctx.globalAlpha=1;if(auto&&t-lastAuto>900){lastAuto=t;boom(w*(.15+Math.random()*.7),h*(.15+Math.random()*.5))}requestAnimationFrame(frame)}requestAnimationFrame(frame);setTimeout(()=>{boom(w*.26,h*.26,true);boom(w*.77,h*.4,true)},650);
</script></body></html>
