<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Spark Fireworks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh; overflow: hidden; background: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .hud {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
      padding: 8px 18px; color: #e2e8f0; font-size: 0.85rem; pointer-events: none;
      display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .hud-badge { color: #f43f5e; font-weight: 700; }
  </style>
</head>
<body>
  <div class="hud">
    <span>✨ 点击屏幕绽放烟花</span>
    <span class="hud-badge" id="countBadge">粒子数: 0</span>
  </div>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const countBadge = document.getElementById('countBadge');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const colors = [
      '#f43f5e', '#ec4899', '#d946ef', '#8b5cf6',
      '#3b82f6', '#06b6d4', '#10b981', '#f59e0b', '#fbbf24'
    ];

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 1.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.friction = 0.96;
        this.gravity = 0.08;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.01;
        this.size = Math.random() * 2.5 + 1.5;
      }
      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function createFirework(x, y) {
      const color1 = colors[Math.floor(Math.random() * colors.length)];
      const color2 = colors[Math.floor(Math.random() * colors.length)];
      const count = Math.floor(Math.random() * 40) + 60;
      for (let i = 0; i < count; i++) {
        const color = Math.random() > 0.4 ? color1 : color2;
        particles.push(new Particle(x, y, color));
      }
    }

    function spawnRandom() {
      const x = Math.random() * (canvas.width * 0.8) + canvas.width * 0.1;
      const y = Math.random() * (canvas.height * 0.5) + canvas.height * 0.15;
      createFirework(x, y);
    }

    // 初始放几个
    createFirework(canvas.width / 2, canvas.height * 0.4);
    setTimeout(spawnRandom, 400);

    window.addEventListener('pointerdown', (e) => {
      createFirework(e.clientX, e.clientY);
    });

    function loop() {
      ctx.fillStyle = 'rgba(5, 5, 8, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          p.draw(ctx);
        }
      }

      countBadge.textContent = `粒子数: ${particles.length}`;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
