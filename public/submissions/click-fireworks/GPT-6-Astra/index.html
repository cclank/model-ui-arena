<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afterglow — Make a little wonder</title>
<!-- A nocturnal waterside celebration. Bounded particles integrate velocity, drag and gravity; bloom-like trails and mirrored light decay naturally. Pointer and keyboard input both launch bursts. -->
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1d;color:#f2ede2;font-family:Arial,sans-serif;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header,footer{position:fixed;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}header{top:31px}.logo{font:italic 25px Georgia;letter-spacing:-.5px}.edition{font:9px/1.7 monospace;letter-spacing:2px;text-align:right;color:#b0b2bd}.message{position:fixed;left:0;right:0;top:42%;text-align:center;pointer-events:none;transition:opacity 1s}.message h1{font:normal clamp(40px,6.7vw,85px)/1.05 Georgia;margin:0 20px 19px;letter-spacing:-2px}.message p{font:9px monospace;letter-spacing:3px;color:#a9a8b8}.message span{font-style:italic;color:#e6c896}.active .message{opacity:.16}footer{bottom:28px;font:9px monospace;letter-spacing:1px;color:#9c9fad}.tools{pointer-events:auto;display:flex;gap:8px}button{border:1px solid #ffffff25;background:#13192bc4;color:#cdcbd3;padding:10px 14px;border-radius:22px;font:9px monospace;cursor:pointer}button[aria-pressed=true]{color:#efdab3;border-color:#ceb57c}button:focus-visible{outline:2px solid #f0d9aa;outline-offset:4px}.hint{position:fixed;left:40px;bottom:84px;font:9px/1.8 monospace;letter-spacing:1px;color:#6c758d;pointer-events:none}@media(max-width:550px){header,footer{left:22px;right:22px}.edition{font-size:7px}.hint{left:22px;font-size:8px}.message h1{font-size:47px}.message p{font-size:8px;letter-spacing:2px}footer{font-size:8px}button{padding:10px;font-size:8px}}
</style></head><body>
<canvas id="sky" tabindex="0" aria-label="Interactive fireworks. Click, touch or press space to launch a firework."></canvas><header><span class="logo">afterglow.</span><span class="edition">AN OPEN SKY<br>A SMALL CELEBRATION</span></header><div class="message"><h1>Make a little<br><span>wonder.</span></h1><p>TOUCH THE NIGHT. LEAVE SOME LIGHT.</p></div><div class="hint">CLICK ANYWHERE · SPACE TO LAUNCH<br>EVERY MOMENT IS WORTH A LITTLE LIGHT.</div><footer><span id="count">00 MOMENTS LIT</span><div class="tools"><button id="palette" aria-label="Change firework palette">PALETTE: GOLD</button><button id="auto" aria-pressed="false">AUTO SHOW</button></div></footer>
<script>
const c=document.getElementById('sky'),ctx=c.getContext('2d'),$=id=>document.getElementById(id),palettes=[[38,44,50,26],[175,192,215,270],[324,350,23,45]],names=['GOLD','AURORA','ROSE'];let w,h,dpr,particles=[],rings=[],stars=[],count=0,palette=0,auto=false,last=0,next=0,raf;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#080d1d';ctx.fillRect(0,0,w,h);stars=Array.from({length:100},(_,i)=>({x:(Math.sin(i*134.7)*.5+.5)*w,y:(Math.sin(i*73.8)*.5+.5)*h*.78,r:i%7?0.6:1.1}));}
function burst(x,y,interactive=true){if(interactive){document.body.classList.add('active');count++;}$('count').textContent=String(count).padStart(2,'0')+' MOMENTS LIT';const n=reduce?46:145,hue=palettes[palette][count%4],power=145+(count*37%110);for(let i=0;i<n;i++){const a=i/n*Math.PI*2+Math.random()*.07,speed=power*(.38+Math.random()*.9);particles.push({x,y,px:x,py:y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:1.5+Math.random()*1.8,max:3.3,hue:hue+Math.random()*12,size:Math.random()*1.6+.8,phase:Math.random()*6});}if(particles.length>2500)particles.splice(0,particles.length-2500);rings.push({x,y,life:1,r:0,hue});if(rings.length>20)rings.shift();}
function frame(now){const dt=Math.min((now-last)/1000||.016,.04);last=now;ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(8,13,29,${reduce?.3:.065})`;ctx.fillRect(0,0,w,h);for(const s of stars){ctx.globalAlpha=.3+Math.sin(now*.0007+s.x)*.12;ctx.fillStyle='#bdc9e3';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}ctx.globalAlpha=1;const horizon=h*.82;ctx.fillStyle='#0b1223';ctx.fillRect(0,horizon,w,h-horizon);ctx.strokeStyle='#253042';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(w,horizon);ctx.stroke();ctx.globalCompositeOperation='lighter';
particles=particles.filter(p=>p.life>0);for(const p of particles){p.px=p.x;p.py=p.y;p.vx*=Math.exp(-dt*.68);p.vy=p.vy*Math.exp(-dt*.68)+27*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;const a=Math.max(0,p.life/p.max),twinkle=p.life<1?.35+.65*Math.abs(Math.sin(now*.018+p.phase)):1;ctx.strokeStyle=`hsla(${p.hue},92%,73%,${a*twinkle})`;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.fillStyle=`hsla(${p.hue},90%,86%,${a})`;ctx.fillRect(p.x,p.y,p.size,p.size);if(p.y<horizon){const ry=horizon+(horizon-p.y)*.25;ctx.fillStyle=`hsla(${p.hue},75%,55%,${a*.12})`;ctx.fillRect(p.x+Math.sin(ry*.3+now*.002)*8,ry,5+p.size*2,1.5);}}
rings=rings.filter(r=>r.life>0);for(const r of rings){r.life-=dt*1.6;r.r+=dt*80;ctx.strokeStyle=`hsla(${r.hue},85%,78%,${Math.max(0,r.life)*.13})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();}ctx.globalCompositeOperation='source-over';if(auto&&now>next){burst(w*(.18+Math.random()*.64),h*(.16+Math.random()*.42));next=now+850;}raf=requestAnimationFrame(frame);}
c.onpointerdown=e=>burst(e.clientX,e.clientY);c.onkeydown=e=>{if(e.code==='Space'||e.key==='Enter'){e.preventDefault();burst(w*(.25+Math.random()*.5),h*(.2+Math.random()*.35));}};$('palette').onclick=()=>{palette=(palette+1)%3;$('palette').textContent='PALETTE: '+names[palette];};$('auto').onclick=()=>{auto=!auto;$('auto').setAttribute('aria-pressed',auto);next=0;};addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden){last=performance.now();raf=requestAnimationFrame(frame);}});resize();burst(w*.77,h*.26,false);setTimeout(()=>burst(w*.18,h*.54,false),520);raf=requestAnimationFrame(frame);
</script></body></html>
