<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>点击放烟花 · Click Fireworks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04050e;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#c9d3f2;user-select:none;-webkit-user-select:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:18px;top:max(16px,env(safe-area-inset-top));pointer-events:none;text-shadow:0 2px 14px #000}
#hud b{display:block;font-size:15px;font-weight:600;letter-spacing:.24em;color:#fff}
#hud span{font-size:10px;letter-spacing:.16em;opacity:.5}
#stat{position:fixed;right:18px;top:max(18px,env(safe-area-inset-top));font-size:10px;letter-spacing:.1em;opacity:.42;text-align:right;pointer-events:none;font-variant-numeric:tabular-nums}
#tip{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 20px;border-radius:999px;background:rgba(120,140,255,.1);border:1px solid rgba(175,190,255,.22);backdrop-filter:blur(8px);font-size:12px;letter-spacing:.06em;white-space:nowrap;transition:opacity .8s;pointer-events:none}
#tip b{color:#ffd98a;font-weight:600}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 38%,rgba(2,3,10,.6) 100%)}
@keyframes fl{from{opacity:1}to{opacity:0}}
@keyframes br{0%,100%{box-shadow:0 0 0 rgba(180,200,255,0)}50%{box-shadow:0 0 22px rgba(180,200,255,.28)}}
#tip{animation:br 2.6s ease-in-out infinite}
@media(max-width:430px){#hud b{font-size:13px}#stat{font-size:9px;right:14px}#tip{font-size:11px;padding:8px 15px}}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="c"></canvas>
<div id="flash"></div><div id="vig"></div>
<div id="hud"><b>点击放烟花</b><span>CLICK / TAP / DRAG ANYWHERE</span></div>
<div id="stat">—</div>
<div id="tip">点击或拖动任意位置 <b>升空一朵烟花</b></div>
<script>
const cv=document.getElementById('c'),G=cv.getContext('2d'),BG=document.getElementById('bg'),SG=BG.getContext('2d'),
FL=document.getElementById('flash'),TIP=document.getElementById('tip'),ST=document.getElementById('stat');
const HUE=[0,20,38,58,120,175,196,255,292,330],TAU=6.2832;
let W=0,H=0,GY=0,D=1,USED=0,booms=0,fps=60,last=0,fn=0,auto=0,stars=[],dTS=0,dN=0;
// —— 静态夜空：渐变 + 星云 + 星空 + 天际线 ——
function paintSky(){
 const g=SG.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#04050e');g.addColorStop(.48,'#0a0e28');g.addColorStop(.8,'#171338');g.addColorStop(1,'#2b1c44');
 SG.fillStyle=g;SG.fillRect(0,0,W,H);
 for(let i=0;i<4;i++){const cx=W*(.14+i*.25),cy=H*(.05+i*.11),r=Math.max(W,H)*(.3+i*.11);
  const q=SG.createRadialGradient(cx,cy,0,cx,cy,r);
  q.addColorStop(0,'hsla('+(235+i*28)+',92%,62%,.10)');q.addColorStop(1,'hsla(0,0%,0%,0)');
  SG.fillStyle=q;SG.fillRect(cx-r,cy-r,r*2,r*2)}
 if(!stars.length){const n=Math.min(160,Math.round(W*H/9000));for(let i=0;i<n;i++)stars.push([Math.random()*W,Math.random()*H*.74,Math.random()*1.2+.25,Math.random()*7])}
 for(const s of stars){SG.globalAlpha=.2+.5*Math.abs(Math.sin(s[3]+s[0]*.05));SG.fillStyle='#dce8ff';
  SG.beginPath();SG.arc(s[0],s[1],s[2],0,TAU);SG.fill()}
 SG.globalAlpha=1;
 const gy=GY=H*.855,cols=Math.max(16,Math.round(W/34));
 for(let i=0;i<cols;i++){const cw=W/cols,bw=cw*(.55+Math.random()*.45),bh=9+Math.random()*H*.14,bx=i*cw+(cw-bw)/2;
  SG.fillStyle='#06070f';SG.fillRect(bx,gy-bh,bw,H-gy+1);
  SG.fillStyle='rgba(255,196,110,.55)';
  for(let j=0;j<4;j++)if(Math.random()<.35)SG.fillRect(bx+2+Math.random()*Math.max(1,bw-5),gy-bh+3+Math.random()*Math.max(1,bh-6),1.6,2.2)}
 const w=SG.createLinearGradient(0,gy,0,H);
 w.addColorStop(0,'rgba(150,110,200,.17)');w.addColorStop(1,'rgba(5,6,15,.93)');
 SG.fillStyle=w;SG.fillRect(0,gy,W,H-gy)}
function fit(){const d=D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 for(const c of [cv,BG]){c.width=W*d|0;c.height=H*d|0;c.style.width=W+'px';c.style.height=H+'px';c.getContext('2d').setTransform(d,0,0,d,0,0)}
 paintSky()}
// —— 辉光贴图：一次生成 10 个色相，绘制时只做 drawImage ——
const SPR=HUE.map(h=>{const c=document.createElement('canvas');c.width=c.height=48;
 const g=c.getContext('2d'),q=g.createRadialGradient(24,24,0,24,24,24);
 q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(.15,'hsla('+h+',100%,80%,.95)');
 q.addColorStop(.45,'hsla('+h+',100%,58%,.32)');q.addColorStop(1,'hsla('+h+',100%,50%,0)');
 g.fillStyle=q;g.fillRect(0,0,48,48);return c});
// —— 预分配粒子池（定长，零运行时分配）——
const N=1900,PP=new Array(N);let cur=0,lv=0;
for(let i=0;i<N;i++)PP[i]={l:0,x:0,y:0,vx:0,vy:0,h:0,m:1,s:1,k:0,t:0};
function slot(){for(let i=0;i<N;i++){const p=PP[cur];cur=(cur+1)%N;if(p.l<=0)return p}return null}
function spark(x,y,vx,vy,h,l,s,k){const p=slot();if(!p)return null;
 p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.h=h;p.l=p.m=l;p.s=s;p.k=k;p.t=Math.random()*TAU;lv++;return p}
// k: 0 火星 / 1 柳条(长垂) / 2 噼啪余烬 / 3 烟雾
function boom(x,y,h,pw){
 FL.style.background='radial-gradient(circle at '+x+'px '+y+'px,hsla('+HUE[h]+',100%,82%,'+(.18+pw*.2)+'),hsla('+HUE[h]+',100%,62%,.07) 24%,transparent 55%)';
 FL.style.animation='none';void FL.offsetWidth;FL.style.animation='fl .6s ease-out forwards';booms++;
 const n=(64+pw*30)|0,u=2.2+Math.random()*3,k=(Math.random()*4)|0;
 const ring=(c,sp,l,sz,hh,kd)=>{for(let i=0;i<c;i++){const t=i/c*TAU+Math.random()*.02,v=sp*(.84+Math.random()*.32);
  spark(x+Math.cos(t)*5,y+Math.sin(t)*5,Math.cos(t)*v,Math.sin(t)*v-(kd===1?1.5:0),hh,l*(.7+Math.random()*.6),sz*(.75+Math.random()*.6),kd)}};
 if(k===0)ring(n,u,1.7,2.5,h,0);
 else if(k===1)ring(n,u*.6,1.5,2.2,(h+3)%10,1);
 else if(k===2){ring(n,u*.5,1.3,2.2,h,0);ring(n,u*1.55,1.8,2.1,(h+5)%10,0)}
 else for(let i=0;i<n;i++){const t=Math.random()*TAU,v=u*(.2+Math.random()*1.2);
  spark(x,y,Math.cos(t)*v,Math.sin(t)*v,h,.9+Math.random()*1.5,2.2+Math.random()*1.7,0)}
 for(let i=0;i<5;i++)spark(x+(Math.random()-.5)*26,y+(Math.random()-.5)*16,(Math.random()-.5)*.6,-.3-Math.random()*.6,h,1.6+Math.random()*1.4,20+Math.random()*24,3)}
const RK=[];
// 连点加成：150ms 内的连续点击会额外分裂出副炮
function launch(x,y){if(RK.length>13)return;
 const now=performance.now();
 dN=now-dTS<150?Math.min(dN+1,3):0;dTS=now;
 RK.push({x:x+(Math.random()-.5)*70,y:y+96,tx:x,ty:y,vx:(Math.random()-.5)*.55,vy:-(5.6+Math.random()*3.2),h:(Math.random()*10)|0,w:0});
 for(let i=0;i<dN;i++)setTimeout(()=>{if(RK.length<13)RK.push({x:x+(Math.random()-.5)*90,y:y+96,tx:x+(Math.random()-.5)*110,ty:y+(Math.random()-.5)*70,vx:(Math.random()-.5)*.6,vy:-(5.6+Math.random()*3.2),h:(Math.random()*10)|0,w:0})},90+i*110)}
function fly(dt){for(let i=RK.length-1;i>=0;i--){const r=RK[i];r.w++;r.vy+=.1;r.x+=r.vx;r.y+=r.vy;
 if((r.w&1)===0&&r.w<70)spark(r.x,r.y,(Math.random()-.5)*.8,.9,r.h,.45,2.6,0);
 if(r.vy>=-1.15||r.y<=r.ty){boom(r.tx,r.ty,r.h,1+Math.random()*.9);RK.splice(i,1)}}}
function step(dt){
 for(let i=0;i<N;i++){const p=PP[i];if(p.l<=0)continue;
  p.l-=dt;if(p.l<=0){p.l=0;lv--;continue}
  if(p.k===3){p.vy-=.006*p.m;p.vx*=.986;p.vy*=.986}
  else{p.vy+=p.k===1?.075:.05;p.vx*=.987;p.vy*=.987}
  p.x+=p.vx;p.y+=p.vy;
  if(p.k<2&&p.l<p.m*.42&&Math.random()<.055)spark(p.x,p.y,(Math.random()-.5)*1.6,(Math.random()-.5)*1.6,p.h,.3+Math.random()*.22,1.6,2)}}
function draw(){
 G.globalCompositeOperation='destination-out';G.fillStyle='rgba(0,0,0,.32)';G.fillRect(0,0,W,H);
 G.globalCompositeOperation='lighter';
 for(let i=0;i<N;i++){const p=PP[i];if(p.l<=0)continue;const t=p.l/p.m;
  if(p.k===3){G.globalAlpha=t*t*.055;G.fillStyle='#9aa4d8';G.beginPath();G.arc(p.x,p.y,p.s*(2.4-t),0,TAU);G.fill();continue}
  const s=p.s*(.55+t*1.15),fl=.45+.55*Math.abs(Math.sin(p.t*9+p.x*.05));
  G.globalAlpha=Math.min(1,t*1.3)*fl;G.drawImage(SPR[p.h],p.x-s*.5,p.y-s*.5,s,s)}
 for(let i=0;i<RK.length;i++){const r=RK[i];G.globalAlpha=.95;G.drawImage(SPR[r.h],r.x-7,r.y-7,14,14)}
 // 水面倒影：以地平线镜像自身，加法混合后被地平线裁切
 G.save();G.beginPath();G.rect(0,GY,W,H-GY);G.clip();
 G.setTransform(D,0,0,-D,0,2*GY*D);G.globalAlpha=.3;G.drawImage(cv,0,0,W,H);
 G.setTransform(D,0,0,D,0,0);G.restore();
 G.globalAlpha=1;G.globalCompositeOperation='source-over'}
function frame(ts){
 requestAnimationFrame(frame);
 if(!last)last=ts;let dt=(ts-last)/1000;last=ts;if(dt>.05)dt=.05;
 fly(dt);step(dt);draw();fn++;
 if(fn%15===0){fps=fps*.8+(1/Math.max(dt,.001))*.2;
  ST.innerHTML=(fps|0)+' FPS · '+booms+' 朵 · '+lv+' 粒子'}}
const down=new Map();
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
function used(){if(USED)return;USED=1;TIP.style.opacity=0;clearInterval(auto)}
addEventListener('pointerdown',e=>{down.set(e.pointerId,[e.clientX,e.clientY,performance.now()]);
 const q=pos(e);launch(q[0],q[1]);used();e.preventDefault()},{passive:false});
addEventListener('pointermove',e=>{const d=down.get(e.pointerId);if(!d)return;
 const t=performance.now();
 if(Math.abs(e.clientX-d[0])+Math.abs(e.clientY-d[1])>40&&t-d[2]>60){d[0]=e.clientX;d[1]=e.clientY;d[2]=t;const q=pos(e);launch(q[0],q[1])}},{passive:true});
['pointerup','pointercancel','pointerleave'].forEach(k=>addEventListener(k,e=>down.delete(e.pointerId)));
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));
auto=setInterval(()=>{if(!USED&&RK.length<3)launch(W*(.18+Math.random()*.64),H*(.2+Math.random()*.28))},1500);
launch(W*.5,H*.46);setTimeout(()=>{if(!USED)launch(W*.27,H*.3)},640);setTimeout(()=>{if(!USED)launch(W*.73,H*.33)},1280);
fit();requestAnimationFrame(frame);
</script>
</body>
</html>
