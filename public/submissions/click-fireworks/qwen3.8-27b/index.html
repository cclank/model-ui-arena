<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜樱烟火 · FIREWORKS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(90% 60% at 50% 118%, rgba(255,150,80,.20), transparent 60%),
      radial-gradient(140% 100% at 50% -20%, #101b3f 0%, #070c1d 58%, #04060f 100%);
    font-family:"SF Pro Display",-apple-system,"PingFang SC",system-ui,sans-serif;
    touch-action:manipulation; cursor:crosshair;
  }
  #sky { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hint {
    position:fixed; left:50%; bottom:9%; transform:translateX(-50%); color:rgba(235,240,255,.85);
    font-size:14px; letter-spacing:.32em; padding:10px 22px; border:1px solid rgba(255,255,255,.22);
    border-radius:99px; background:rgba(10,16,36,.4); backdrop-filter:blur(4px); pointer-events:none;
    animation:float 2.6s ease-in-out infinite; transition:opacity .8s; white-space:nowrap;
  }
  .hint.gone { opacity:0; }
  @keyframes float { 50%{transform:translateX(-50%) translateY(-7px)} }
  .tag { position:fixed; top:18px; left:22px; color:rgba(235,240,255,.5); font-size:11px; letter-spacing:.4em; pointer-events:none; }
  .count { position:fixed; top:18px; right:22px; color:rgba(235,240,255,.4); font-size:11px;
    font-variant-numeric:tabular-nums; letter-spacing:.12em; pointer-events:none; }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="tag">NIGHT BLOOM</div>
  <div class="count" id="stat">粒子 0</div>
  <div class="hint" id="hint">轻 触 屏 幕 · 绽 放 烟 火</div>
<script>
(function () {
  "use strict";
  var cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  var W = 0, H = 0, DPR = Math.min(2, devicePixelRatio || 1);
  var stars = [], rockets = [], parts = [];
  var MAX_PARTS = 2200, t0 = performance.now();

  function resize() {
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    paintSkyBase();
  }
  // 星空底图：只画一次到离屏，避免每帧重绘 140 颗星
  var base = document.createElement("canvas");
  function paintSkyBase() {
    base.width = W * DPR; base.height = H * DPR;
    var b = base.getContext("2d");
    b.setTransform(DPR, 0, 0, DPR, 0, 0);
    b.clearRect(0, 0, W, H);
    stars = [];
    for (var i = 0; i < 140; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H * .92, r: Math.random() * 1.1 + .25, tw: Math.random() * 6.28, sp: .5 + Math.random() * 1.5 });
    }
    stars.forEach(function (s) {
      b.globalAlpha = .35 + s.r * .4;
      b.fillStyle = "#cdd8ff";
      b.beginPath(); b.arc(s.x, s.y, s.r, 0, 7); b.fill();
    });
    b.globalAlpha = 1;
  }

  var HUES = [48, 12, 330, 200, 275, 160]; // 金/红/粉/蓝/紫/青
  function launch(x, y) {
    // 烟花弹：底部升空，缓动飞向目标点，顶点绽放（确定落点，体验可预期）
    rockets.push({
      sx: x + (Math.random() - .5) * 60, sy: H + 8, tx: x, ty: y,
      t0: performance.now(), dur: 620 + Math.random() * 260,
      hue: HUES[(Math.random() * HUES.length) | 0]
    });
  }
  function burst(x, y, hue) {
    if (parts.length > MAX_PARTS) return; // 性能护栏：粒子上限，防连续点击卡死
    var n = 95 + (Math.random() * 75 | 0);
    var R = 70 + Math.random() * 130;                       // 随机爆炸半径
    var second = Math.random() < .4 ? hue + 60 + Math.random() * 40 : -1; // 40% 概率双色
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283, sp = (0.25 + Math.pow(Math.random(), .6) * 0.75);
      parts.push({
        x: x, y: y, vx: Math.cos(a) * sp * R * .055, vy: Math.sin(a) * sp * R * .055,
        life: 1, decay: .008 + Math.random() * .011,
        hue: (second >= 0 && i % 3 === 0 ? second : hue) + (Math.random() * 24 - 12),
        r: 1 + Math.random() * 1.8, tw: Math.random() * 6.28, tws: 6 + Math.random() * 10
      });
    }
  }
  function add(ev) {
    document.getElementById("hint").classList.add("gone");
    var x = ev.clientX !== undefined ? ev.clientX : (ev.touches ? ev.touches[0].clientX : innerWidth / 2);
    var y = ev.clientY !== undefined ? ev.clientY : (ev.touches ? ev.touches[0].clientY : innerHeight * .4);
    launch(Math.max(30, Math.min(W - 30, x)), Math.max(60, Math.min(H * .8, y)));
  }
  addEventListener("pointerdown", add);

  function frame(now) {
    // 每帧清屏 + 以“速度线段”画拖尾：无累积填充，背景渐变恒可见，内存零增长
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(base, 0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i], k = Math.min(1, (now - r.t0) / r.dur), e = 1 - Math.pow(1 - k, 2);
      var x = r.sx + (r.tx - r.sx) * e, y = r.sy + (r.ty - r.sy) * e;
      var px = r.sx + (r.tx - r.sx) * Math.min(1, k * .94), py = r.sy + (r.ty - r.sy) * Math.min(1, k * .94);
      ctx.strokeStyle = "hsla(" + r.hue + ",90%,72%,.9)"; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = "hsla(" + r.hue + ",95%,82%,1)";
      ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();
      if (k >= 1) { rockets.splice(i, 1); burst(r.tx, r.ty, r.hue); }
    }
    var alive = 0;
    for (var j = parts.length - 1; j >= 0; j--) {
      var p = parts[j];
      p.vy += .0035; p.vx *= .985; p.vy *= .985;          // 重力 + 空气阻力
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if (p.life <= 0) { parts.splice(j, 1); continue; }
      alive++;
      var tw = .72 + .28 * Math.sin(now * .001 * p.tws + p.tw); // 闪烁
      var col = "hsl(" + p.hue + ",95%," + (52 + p.life * 22) + "%)";
      ctx.globalAlpha = p.life * tw;
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.lineWidth = p.r * (0.6 + p.life);
      // 尾迹：沿速度反向的短线段，速度越快尾迹越长
      ctx.beginPath();
      ctx.moveTo(p.x - p.vx * 4.5, p.y - p.vy * 4.5);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + p.life) * .7, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    document.getElementById("stat").textContent = "粒子 " + parts.length + " / " + MAX_PARTS;
    // 氛围自播：无人交互时每 ~2.4s 自动放一枚
    if (now - frame.lastAuto > 2400) {
      frame.lastAuto = now;
      launch(W * (.2 + Math.random() * .6), H * (.18 + Math.random() * .35));
    }
    requestAnimationFrame(frame);
  }
  resize();
  addEventListener("resize", resize);
  launch(W * .5, H * .3); // 开场礼炮
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
