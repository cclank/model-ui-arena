<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点击放烟花</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05070f; }
  body { font-family: "Avenir Next", "PingFang SC", sans-serif; cursor: crosshair; }
  #sky { position: fixed; inset: 0; display: block; }
  .hint {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    color: rgba(255,255,255,.85); font-size: 14px; letter-spacing: .25em; white-space: nowrap;
    padding: 10px 22px; border: 1px solid rgba(255,255,255,.22); border-radius: 999px;
    background: rgba(10,14,26,.4); backdrop-filter: blur(6px);
    animation: float 3s ease-in-out infinite; pointer-events: none; user-select: none;
  }
  @keyframes float { 50% { transform: translateX(-50%) translateY(-7px); } }
  .hint b { color: #ffd98a; font-weight: 600; }
  .sig { position: fixed; right: 18px; top: 16px; color: rgba(255,255,255,.4); font-size: 11px; letter-spacing: .2em; pointer-events: none; }
  @media (max-width: 390px) { .hint { font-size: 12px; letter-spacing: .12em; bottom: 22px; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="hint">点击夜空 · 绽放 <b>烟花</b></div>
<div class="sig">FIREWORKS · 2026</div>
<script>
  const cv = document.getElementById('sky'), cx = cv.getContext('2d');
  let W, H, stars = [], rockets = [], parts = [], flashes = [];
  const PALETTES = [
    ['#ff5f6d', '#ffc371', '#fff'], ['#36d1dc', '#5b86e5', '#c9f6ff'],
    ['#f7b733', '#fc4a1a', '#ffe9b0'], ['#a18cd1', '#fbc2eb', '#fff'],
    ['#43e97b', '#38f9d7', '#eafff7'], ['#fa709a', '#fee140', '#fff5d6']
  ];
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; makeStars(); }
  addEventListener('resize', resize);
  function makeStars() {
    stars = Array.from({ length: Math.min(220, W / 6 | 0) }, () => ({
      x: Math.random() * W, y: Math.random() * H * .75, r: Math.random() * 1.3 + .2,
      p: Math.random() * Math.PI * 2, s: .5 + Math.random()
    }));
  }
  const rnd = (a, b) => a + Math.random() * (b - a);
  function launch(tx, ty) {
    const x = tx ?? rnd(W * .15, W * .85);
    rockets.push({ x, y: H, tx: x, ty: ty ?? rnd(H * .12, H * .42), v: 0, hue: PALETTES[Math.random() * PALETTES.length | 0], big: Math.random() < .18 });
    flashes.push({ a: 0 });
  }
  function explode(r) {
    const n = r.big ? 190 : rnd(90, 140) | 0, sp = r.big ? rnd(5.5, 7.5) : rnd(3.2, 5.2);
    for (let i = 0; i < n; i++) {
      const ang = Math.PI * 2 * i / n + rnd(-.04, .04), v = sp * (0.35 + Math.random() * .8);
      parts.push({ x: r.tx, y: r.ty, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
        c: r.hue[Math.random() * r.hue.length | 0], life: 1, dec: rnd(.008, .018), gl: Math.random() < .3, sz: rnd(1.2, 2.6) });
    }
    flashes.push({ a: .5 });
  }
  cv.addEventListener('pointerdown', e => launch(e.clientX, e.clientY));
  function frame(t) {
    cx.fillStyle = 'rgba(5,7,15,.22)'; cx.fillRect(0, 0, W, H);
    stars.forEach(s => { s.p += .02 * s.s; cx.globalAlpha = .35 + .45 * Math.sin(s.p); cx.fillStyle = '#dfe8ff'; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 7); cx.fill(); });
    cx.globalAlpha = 1;
    flashes = flashes.filter(f => (f.a -= .05) > 0);
    flashes.forEach(f => { cx.fillStyle = `rgba(255,244,214,${f.a * .12})`; cx.fillRect(0, 0, W, H); });
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.v += .16; r.y -= r.v;
      cx.fillStyle = '#ffd98a'; cx.beginPath(); cx.arc(r.x, r.y, 2, 0, 7); cx.fill();
      cx.strokeStyle = 'rgba(255,200,120,.5)'; cx.lineWidth = 1.4;
      cx.beginPath(); cx.moveTo(r.x, r.y + 10); cx.lineTo(r.x, r.y); cx.stroke();
      if (r.y <= r.ty || r.v <= 0) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vx *= .985; p.vy = p.vy * .985 + .045; p.x += p.vx; p.y += p.vy; p.life -= p.dec;
      if (p.life <= 0 || parts.length > 2400) { parts.splice(i, 1); continue; }
      cx.globalAlpha = p.gl ? p.life * (0.4 + 0.6 * Math.abs(Math.sin(t / 90 + i))) : p.life;
      cx.fillStyle = p.c;
      if (p.gl) { cx.shadowColor = p.c; cx.shadowBlur = 8; }
      cx.beginPath(); cx.arc(p.x, p.y, p.sz, 0, 7); cx.fill();
      cx.shadowBlur = 0;
      if (Math.random() < .06) parts.push({ x: p.x, y: p.y, vx: p.vx * .2, vy: p.vy * .2, c: p.c, life: .5, dec: .03, gl: true, sz: 1 });
    }
    cx.globalAlpha = 1;
    if (parts.length > 2400) parts.splice(0, parts.length - 2400);
    requestAnimationFrame(frame);
  }
  resize();
  setTimeout(() => launch(W * .5, H * .3), 500);
  requestAnimationFrame(frame);
</script>
</body>
</html>
