<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Some kind of magic — Fireworks</title>
<!-- 深蓝夜幕和柔金烟花构成安静的庆典，点击即在指尖升起一束光。
     三种配色、拖动连放和自动表演，具备火箭尾迹、重力下坠及水面倒影。
     粒子定量回收、帧间时间归一、后台暂停，适配鼠标与触摸。 -->
<style>
*{box-sizing:border-box}body{margin:0;background:#080e1d;color:#efe8d8;font-family:Arial,Helvetica,sans-serif;overflow:hidden;min-height:100svh}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}main{position:relative;min-height:100svh;pointer-events:none;padding:29px 35px;display:flex;flex-direction:column}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:10px monospace;letter-spacing:3px}.pill{font:9px monospace;letter-spacing:1px;border:1px solid #e6d0a533;padding:8px 10px;border-radius:20px;color:#bcb5a9}.intro{margin-top:45px}.eyebrow{font:8px monospace;letter-spacing:2.5px;color:#978f87}h1{font:normal clamp(38px,7vw,68px)/1.06 Georgia,serif;letter-spacing:-2.5px;margin:14px 0 17px}h1 em{font-weight:400;color:#dcc6a3}p{font-size:11px;color:#9c9d9d;line-height:1.6}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#d6ba8e;box-shadow:0 0 10px #e5caa5;margin-right:8px}.bottom{margin-top:auto;padding-top:200px;display:grid;gap:21px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:auto}.palettes{display:flex;padding:5px;border:1px solid #dac09d2a;border-radius:30px;background:#0d162799;backdrop-filter:blur(12px);gap:2px}button{font:10px Arial;cursor:pointer;background:none;color:#b9b3ac;border:0;padding:9px 12px;border-radius:24px;transition:background .3s}button[aria-pressed=true]{background:#e6d7b9;color:#343328}.palettes button i{display:inline-block;width:5px;height:5px;background:var(--swatch);border-radius:50%;margin-right:6px}button:hover{background:#ffffff15}button[aria-pressed=true]:hover{background:#e6d7b9}button:focus-visible{outline:2px solid #e6d7b9;outline-offset:4px}#auto{border:1px solid #dac09d3b;padding:13px 16px;background:#111c2c99;font-size:9px}#auto[aria-pressed=true]{background:#e6d7b9;color:#343328}.foot{border-top:1px solid #e3caaa20;padding-top:16px;display:flex;justify-content:space-between;font:8px monospace;letter-spacing:1.5px;color:#9d9b93}.hint{position:absolute;top:54%;left:50%;transform:translate(-50%,-50%);font:8px monospace;letter-spacing:2px;white-space:nowrap;color:#b5ad9a;opacity:.6;transition:opacity 1s}.hint:before{content:'+';font-size:24px;display:block;text-align:center;margin-bottom:9px;font-weight:200;color:#d2bea0}
@media(max-width:450px){main{padding:24px}.intro{margin-top:36px}h1{font-size:44px;letter-spacing:-2px}.toolbar{gap:8px}.palettes button{font-size:9px;padding:9px}#auto{padding:13px 12px}.brand{font-size:9px}.pill{font-size:8px}.bottom{padding-top:170px}.foot{font-size:7px;letter-spacing:1px}}
</style>
<canvas id="sky" role="img" aria-label="Interactive night sky. Click to launch fireworks."></canvas><main><header class="row"><span class="brand">NIGHTFALL / 001</span><span class="pill"><span id="count">00</span> WISHES MADE</span></header><section class="intro"><div class="eyebrow">THE SKY IS YOURS TONIGHT</div><h1>Some kind<br>of <em>magic.</em></h1><p><i class="dot"></i>Click anywhere. Make a little wonder.</p></section><div class="hint" id="hint">MAKE YOUR FIRST WISH</div><div class="bottom"><div class="toolbar"><div class="palettes" role="group" aria-label="Firework palette"><button data-palette="0" aria-pressed="true" style="--swatch:#b38b48"><i></i>Gold</button><button data-palette="1" aria-pressed="false" style="--swatch:#8ce2d1"><i></i>Aurora</button><button data-palette="2" aria-pressed="false" style="--swatch:#e397b5"><i></i>Rose</button></div><button id="auto" aria-pressed="false">Auto show</button></div><footer class="foot"><span>A SMALL CELEBRATION OF RIGHT NOW.</span><span id="live">READY WHEN YOU ARE</span></footer></div></main>
<script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;let w,h,dpr,particles=[],rockets=[],palette=0,count=0,auto=false,seed=73491,last=0,raf,next=0,held=false,previousLaunch=0;const colors=[['#ffe9b7','#dba769','#fff9df'],['#b1b5ff','#83e6dc','#e9edfc'],['#f3b4cc','#f2859e','#ffe7c7']];function random(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#080e1d';ctx.fillRect(0,0,w,h)}addEventListener('resize',resize);resize();
function explode(x,y,p=palette){const n=reduced?36:110+Math.floor(random()*65),shape=Math.floor(random()*3),radius=2+random()*2;for(let i=0;i<n;i++){const angle=i/n*Math.PI*2+(random()-.5)*.04,v=radius*(shape===0?.9+random()*.18:Math.sqrt(random()))*(w<500?.85:1.15);particles.push({x,y,px:x,py:y,vx:Math.cos(angle)*v,vy:Math.sin(angle)*v,life:1,max:65+random()*70,color:colors[p][i%3],size:random()<.12?1.7:.8,twinkle:random()>.72})}if(particles.length>2200)particles.splice(0,particles.length-2200)}
function launch(x,y){count++;$('count').textContent=String(count).padStart(2,'0');$('hint').style.opacity=0;explode(x,y);if(!reduced&&rockets.length<24)rockets.push({x:x+(random()-.5)*100,y:h*.87,tx:x,ty:y,px:x,py:h*.87,life:0,p:palette});}
document.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;held=true;previousLaunch=performance.now();launch(e.clientX,e.clientY)});document.addEventListener('pointermove',e=>{if(held&&performance.now()-previousLaunch>130&&!e.target.closest('button')){previousLaunch=performance.now();launch(e.clientX,e.clientY)}});addEventListener('pointerup',()=>held=false);addEventListener('pointercancel',()=>held=false);document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();launch(w*(.2+random()*.6),h*(.28+random()*.36))}});
document.querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>{palette=+b.dataset.palette;document.querySelectorAll('[data-palette]').forEach(x=>x.setAttribute('aria-pressed',x===b))});$('auto').onclick=()=>{auto=!auto;$('auto').setAttribute('aria-pressed',auto);$('auto').textContent=auto?'Stop show':'Auto show';next=0};
function draw(t){const dt=Math.min(2,(t-last)/16.667||1);last=t;ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(8,14,29,${1-Math.pow(.8,dt)})`;ctx.fillRect(0,0,w,h);for(let i=0;i<70;i++){const x=((i*137.731)%997)/997*w,y=((i*53.273)%563)/563*h*.82;ctx.fillStyle=`rgba(213,222,237,${.08+.18*(.5+.5*Math.sin(t/2200+i))})`;ctx.fillRect(x,y,i%11===0?1.3:.7,i%11===0?1.3:.7)}
ctx.fillStyle='#09111b';ctx.beginPath();ctx.moveTo(0,h);ctx.lineTo(0,h*.89);for(let x=0;x<=w+12;x+=12)ctx.lineTo(x,h*.885-Math.abs(Math.sin(x*.031)*Math.cos(x*.081))*13);ctx.lineTo(w,h);ctx.fill();ctx.fillStyle='#15212e';ctx.fillRect(0,h*.908,w,.5);ctx.globalCompositeOperation='lighter';
for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.px=r.x;r.py=r.y;r.x+=(r.tx-r.x)*.055*dt;r.y+=(r.ty-r.y)*.055*dt;r.life+=dt;ctx.strokeStyle='#b18b50aa';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(r.px,r.py);ctx.lineTo(r.x,r.y);ctx.stroke();if(r.life>70||Math.hypot(r.tx-r.x,r.ty-r.y)<12)rockets.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.px=p.x;p.py=p.y;p.vx*=Math.pow(.987,dt);p.vy=p.vy*Math.pow(.987,dt)+.025*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt/p.max;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life*(p.twinkle?.45+.55*Math.abs(Math.sin(t*.015+i)):1);ctx.strokeStyle=p.color;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();if(p.life>.7){ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,1.2,1.2)}const reflect=h*.915+(h*.88-p.y)*.22;if(reflect<h&&reflect>h*.91){ctx.globalAlpha*=.1;ctx.fillStyle=p.color;ctx.fillRect(p.x+Math.sin(t*.002+p.y)*4,reflect,2.5,1)}}ctx.globalAlpha=1;
if(auto&&t>next){launch(w*(.15+random()*.7),h*(.24+random()*.4));next=t+(reduced?2000:800)+random()*600}if(Math.floor(t/500)!==Math.floor((t-16)/500))$('live').textContent=particles.length?particles.length+' SPARKS ALIVE':'THE NIGHT IS STILL YOUNG';raf=requestAnimationFrame(draw)}
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);held=false;if(!document.hidden){last=performance.now();raf=requestAnimationFrame(draw)}});requestAnimationFrame(draw);setTimeout(()=>{if(!count&&!document.hidden){explode(w*.7,h*.45);$('live').textContent='YOUR TURN TO LIGHT THE SKY'}},500);
</script></html>
