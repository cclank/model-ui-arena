<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nocturne — 点击点亮夜空</title>
<style>
:root{color-scheme:dark;--ink:#f5efe6;--muted:#8c94ad;--gold:#f4c984;--line:#ffffff1b}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:radial-gradient(ellipse at 50% 110%,#202040 0,#0b1027 44%,#040713 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;touch-action:none;cursor:crosshair}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 18%,#ffffff70 0 1px,transparent 1.5px),radial-gradient(circle at 82% 24%,#ffffff60 0 1px,transparent 1.5px),radial-gradient(circle at 63% 8%,#ffffff55 0 1px,transparent 1.5px);background-size:173px 181px,239px 223px,311px 277px;opacity:.45}
canvas{position:fixed;inset:0;width:100%;height:100%}.moon{position:fixed;right:8vw;top:11vh;width:64px;height:64px;border-radius:50%;background:#f3e9ce;box-shadow:0 0 35px #e6dcae30,0 0 100px #b8c8ff20;opacity:.8;pointer-events:none}.moon:after{content:"";position:absolute;width:52px;height:52px;left:-12px;top:-7px;border-radius:50%;background:#090e22}
header{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:28px clamp(20px,4vw,52px);pointer-events:none}.brand{display:flex;align-items:center;gap:12px}.emblem{width:32px;height:32px;border:1px solid var(--gold);border-radius:50%;position:relative}.emblem:before,.emblem:after{content:"";position:absolute;left:50%;top:50%;background:var(--gold);transform:translate(-50%,-50%)}.emblem:before{width:16px;height:1px}.emblem:after{width:1px;height:16px}.brand strong{display:block;font-size:11px;letter-spacing:.26em}.brand span{display:block;color:var(--muted);font-size:8px;letter-spacing:.16em;margin-top:5px}.controls{display:flex;gap:8px;pointer-events:auto}button{border:1px solid var(--line);border-radius:99px;background:#0b102480;color:var(--muted);backdrop-filter:blur(12px);padding:9px 13px;font:600 9px/1 inherit;letter-spacing:.12em;cursor:pointer;transition:.2s}button:hover{color:var(--gold);border-color:#f4c98460}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button[aria-pressed=true]{color:var(--gold)}
.title{position:fixed;left:clamp(20px,5vw,64px);top:24%;pointer-events:none;mix-blend-mode:screen}.title p{margin:0 0 9px;color:var(--gold);font-size:9px;letter-spacing:.32em}.title h1{margin:0;font:300 clamp(30px,4.5vw,64px)/1.05 Georgia,"Songti SC",serif;letter-spacing:.08em;color:#f5efe61c}.title h1 span{display:block;font-size:.42em;margin-top:12px;letter-spacing:.3em;color:#f5efe622}
.hint{position:fixed;left:50%;bottom:11%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;transition:opacity .6s}.hint.hidden{opacity:0}.tap{width:36px;height:36px;border:1px solid #f4c98465;border-radius:50%;position:relative;animation:ripple 2.4s infinite}.tap:before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px #f4c98480}.hint span{font-size:10px;letter-spacing:.22em;color:#d9d6d2b0;white-space:nowrap}.hint small{font-size:8px;letter-spacing:.15em;color:var(--muted)}@keyframes ripple{50%{box-shadow:0 0 0 12px #f4c98405,0 0 0 25px #f4c98402}}
footer{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:24px clamp(20px,4vw,52px);pointer-events:none}.telemetry{display:flex;gap:24px}.metric label{display:block;color:var(--muted);font-size:8px;letter-spacing:.14em;margin-bottom:5px}.metric strong{font:500 11px/1 ui-monospace,monospace}.edition{color:var(--muted);font:8px/1.5 ui-monospace,monospace;letter-spacing:.15em;text-align:right}
@media(max-width:600px){header{padding:20px 16px}.brand span{display:none}.moon{width:48px;height:48px;right:7vw;top:15vh}.moon:after{width:40px;height:40px}.title{left:18px;top:25%}.title h1{font-size:30px}.controls button{padding:8px 10px;font-size:8px}.hint{bottom:14%}footer{padding:18px 16px}.telemetry{gap:15px}.edition{display:none}.metric:last-child{display:none}}
@media(prefers-reduced-motion:reduce){.tap{animation:none}}
</style>
</head>
<body>
<div class="moon" aria-hidden="true"></div><canvas id="scene" aria-label="点击任意位置绽放烟花"></canvas>
<header><div class="brand"><i class="emblem"></i><div><strong>NOCTURNE / 夜宴</strong><span>AN INTERACTIVE CELEBRATION</span></div></div><div class="controls"><button id="auto" aria-pressed="true">AUTO · ON</button><button id="clear">CLEAR SKY</button></div></header>
<div class="title" aria-hidden="true"><p>A MOMENT OF LIGHT</p><h1>让此刻璀璨<span>TOUCH THE NIGHT</span></h1></div>
<div class="hint" id="hint"><i class="tap"></i><span>轻点夜空，绽放一瞬</span><small>CLICK ANYWHERE · SPACE TO SURPRISE</small></div>
<footer><div class="telemetry"><div class="metric"><label>ACTIVE PARTICLES</label><strong id="count">0000</strong></div><div class="metric"><label>FIREWORKS</label><strong id="fired">000</strong></div><div class="metric"><label>FRAME RATE</label><strong id="fps">60 FPS</strong></div></div><div class="edition">FESTIVAL STUDY N° 09<br>MULTI-COLOR / REALTIME</div></footer>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:true}),particles=[],rockets=[],rings=[],stars=[],buildings=[];
let W=0,H=0,dpr=1,last=performance.now(),lastAuto=0,auto=!matchMedia('(prefers-reduced-motion: reduce)').matches,fired=0,frames=0,fpsTime=last,interacted=false,seed=2027;
const $=id=>document.getElementById(id),rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars.length=buildings.length=0;for(let i=0;i<Math.min(150,W/7);i++)stars.push({x:rand()*W,y:rand()*H*.72,r:.3+rand()*1.1,p:rand()*6.28});let x=-5;while(x<W+10){const w=24+rand()*45,h=35+rand()*Math.min(180,H*.22);buildings.push({x,w,h,lights:Array.from({length:Math.floor(w*h/900)},()=>({x:rand(),y:rand(),on:rand()>.42}))});x+=w+2+rand()*7}}
function background(t){ctx.globalCompositeOperation='source-over';for(const s of stars){ctx.globalAlpha=.22+.25*Math.sin(t*.001+s.p);ctx.fillStyle='#dce5ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;const horizon=H*.94;for(const b of buildings){ctx.fillStyle='#070b18';ctx.fillRect(b.x,horizon-b.h,b.w,b.h);ctx.fillStyle='#080d1d';ctx.fillRect(b.x-2,horizon-b.h-4,b.w+4,4);for(const l of b.lights){if(!l.on)continue;ctx.fillStyle=rand()>.998?'#f4c984':'#a7915b55';ctx.fillRect(b.x+5+l.x*(b.w-10),horizon-b.h+8+l.y*(b.h-14),2,3)}}ctx.fillStyle='#050914';ctx.fillRect(0,horizon,W,H-horizon)}
function launch(x,y){if(rockets.length>18)return;const sx=W*.5+(rand()-.5)*W*.55,sy=H+8,dx=x-sx,dy=y-sy,d=Math.hypot(dx,dy),speed=Math.max(7,d/45);rockets.push({x:sx,y:sy,px:sx,py:sy,vx:dx/d*speed,vy:dy/d*speed,tx:x,ty:y,hue:rand()*360});rings.push({x,y,r:2,life:1,hue:48});if(!interacted){interacted=true;$('hint').classList.add('hidden')}}
function explode(x,y,hue){fired++;const type=Math.floor(rand()*4),palettes=[[hue,(hue+35)%360,(hue+180)%360],[48,20,4],[190,210,265],[320,350,45]][Math.floor(rand()*4)],n=type===3?110:82;for(let i=0;i<n&&particles.length<2200;i++){const a=i/n*Math.PI*2+rand()*.08,ring=type===1,willow=type===2,speed=ring?4.8+rand()*.5:willow?2+rand()*4.2:1.4+Math.sqrt(rand())*5.7,life=willow?95+rand()*55:55+rand()*45;particles.push({x,y,px:x,py:y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed*(ring?.62:1),life,max:life,hue:palettes[i%palettes.length]+rand()*12,drag:willow?.988:.975,gravity:willow?.055:.038,size:.7+rand()*1.25,twinkle:rand()*6.28})}if(type===3)for(let i=0;i<36&&particles.length<2200;i++){const a=i/36*Math.PI*2;particles.push({x,y,px:x,py:y,vx:Math.cos(a)*2.1,vy:Math.sin(a)*2.1,life:70,max:70,hue:(hue+180)%360,drag:.98,gravity:.03,size:1.2,twinkle:a})}rings.push({x,y,r:4,life:1,hue});if(particles.length>2200)particles.splice(0,particles.length-2200)}
function animate(t){const dt=Math.min(2.2,(t-last)/16.667||1);last=t;ctx.globalCompositeOperation='destination-out';ctx.fillStyle=`rgba(0,0,0,${Math.min(.32,.18*dt)})`;ctx.fillRect(0,0,W,H);background(t);ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.px=r.x;r.py=r.y;r.x+=r.vx*dt;r.y+=r.vy*dt;ctx.strokeStyle=`hsl(${r.hue} 90% 72% / .8)`;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(r.px-r.vx*3,r.py-r.vy*3);ctx.lineTo(r.x,r.y);ctx.stroke();if(Math.hypot(r.tx-r.x,r.ty-r.y)<Math.hypot(r.vx,r.vy)*dt*1.4){explode(r.tx,r.ty,r.hue);rockets.splice(i,1)}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.px=p.x;p.py=p.y;p.vx*=Math.pow(p.drag,dt);p.vy=p.vy*Math.pow(p.drag,dt)+p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;const a=Math.max(0,p.life/p.max),flicker=.65+.35*Math.sin(t*.02+p.twinkle);if(p.life<=0){particles.splice(i,1);continue}ctx.strokeStyle=`hsla(${p.hue},95%,${62+a*25}%,${a*flicker})`;ctx.lineWidth=p.size*a+.25;ctx.beginPath();ctx.moveTo(p.px-p.vx*1.5,p.py-p.vy*1.5);ctx.lineTo(p.x,p.y);ctx.stroke();if(a>.7){ctx.fillStyle=`hsla(${p.hue},100%,90%,${a})`;ctx.fillRect(p.x-.5,p.y-.5,1,1)}}
for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=2.8*dt;r.life-=.035*dt;ctx.strokeStyle=`hsla(${r.hue},90%,75%,${Math.max(0,r.life)*.45})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();if(r.life<=0)rings.splice(i,1)}
ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';if(auto&&t-lastAuto>3100&&rockets.length<4){launch(W*(.2+rand()*.65),H*(.16+rand()*.34));lastAuto=t}frames++;if(t-fpsTime>700){$('fps').textContent=Math.round(frames*1000/(t-fpsTime))+' FPS';frames=0;fpsTime=t;$('count').textContent=String(particles.length).padStart(4,'0');$('fired').textContent=String(fired).padStart(3,'0')}requestAnimationFrame(animate)}
addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;launch(e.clientX,e.clientY)});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();launch(W*(.15+rand()*.7),H*(.15+rand()*.4))}});
$('auto').onclick=()=>{auto=!auto;$('auto').textContent=`AUTO · ${auto?'ON':'OFF'}`;$('auto').setAttribute('aria-pressed',String(auto))};$('clear').onclick=()=>{particles.length=rockets.length=rings.length=0;ctx.clearRect(0,0,W,H)};
addEventListener('resize',resize);resize();requestAnimationFrame(animate);
</script>
</body></html>
