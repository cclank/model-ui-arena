<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今晚，天空属于你 · Fireworks</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#08141e;color:#ece9df;font-family:Arial,"PingFang SC",sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}header{position:absolute;top:32px;left:36px;right:36px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.logo{font-size:13px;letter-spacing:.24em}.edition{font-size:9px;letter-spacing:.18em;color:#a3b4be}.intro{position:absolute;left:8%;top:19%;pointer-events:none;transition:opacity 1s}.tag{font-size:10px;letter-spacing:.3em;color:#e6b68c}h1{font-family:Georgia,"Songti SC",serif;font-weight:normal;font-size:clamp(40px,5.3vw,76px);letter-spacing:-.06em;line-height:1.13;margin:17px 0}h1 em{font-weight:normal;color:#e9bc99}p{font-size:12px;color:#91a7b7;line-height:1.9}.horizon{position:absolute;bottom:0;left:0;width:100%;height:20%;pointer-events:none;opacity:.75}.controls{position:absolute;bottom:34px;left:36px;right:36px;display:flex;justify-content:space-between;align-items:end;gap:18px}.actions{display:flex;align-items:center;gap:8px}button{background:#122632b3;color:#d6dbd7;border:1px solid #29414b;border-radius:24px;padding:11px 16px;font-size:11px;cursor:pointer;backdrop-filter:blur(12px)}button:hover,button[aria-pressed=true]{border-color:#dbb395;color:#f1cbb1}.stats{text-align:right;font-size:10px;color:#95a9b2;line-height:1.8;font-variant-numeric:tabular-nums}.stats strong{color:#f0c4a7;font-weight:normal;font-size:20px}.cross{position:absolute;left:50%;top:50%;width:20px;height:20px;pointer-events:none;opacity:.22}.cross:before,.cross:after{content:'';position:absolute;background:#ccdde2}.cross:before{left:10px;top:0;width:1px;height:21px}.cross:after{left:0;top:10px;width:21px;height:1px}.instruction{position:absolute;left:50%;top:70%;transform:translateX(-50%);font-size:10px;letter-spacing:.18em;color:#7e99a6;pointer-events:none;white-space:nowrap;animation:breathe 3s infinite}@keyframes breathe{50%{opacity:.35}}@media(max-width:550px){header{top:25px;left:22px;right:22px}.edition{font-size:8px;letter-spacing:.03em}.intro{left:7%;top:19%}h1{font-size:45px}.controls{left:22px;right:22px;bottom:26px;flex-wrap:wrap}.actions{gap:5px}button{font-size:10px;padding:10px 12px}.stats{font-size:9px}.instruction{top:68%;font-size:9px}.horizon{height:16%}}
</style></head><body><canvas id="sky" aria-label="点击或触摸任意位置发射烟花"></canvas><header><span class="logo">花 火 / HANABI</span><span class="edition">AN INTERACTIVE NIGHT · 01</span></header><div class="intro" id="intro"><div class="tag">MAKE A WISH. LET IT GLOW.</div><h1>今晚，<br>天空属于<em>你。</em></h1><p>轻触夜空，留下片刻绚烂。<br>每一束光，都是一个新的愿望。</p></div><div class="cross"></div><div class="instruction" id="hint">点击任意位置 · 点亮夜空</div><svg class="horizon" viewBox="0 0 1400 180" preserveAspectRatio="none" aria-hidden="true"><path d="M0 80h34V54h30v40h23V30h38v65h33V65h44v45h58V48h32v67h40V82h33V10h27v77h48V45h36v62h20V78h44v44h65V70h25v40h45V35h41v60h26V62h27v62h49V89h55V49h30v80h26V70h49v40h48V21h25v88h67V54h28v48h59V86h28V43h26v48h68V60h36v50h65v70H0Z" fill="#0b1d29"/><path d="M0 145Q350 127 700 149T1400 143V180H0Z" fill="#07131b"/></svg><div class="controls"><div class="actions"><button id="auto" aria-pressed="false">自动绽放</button><button id="palette">暖金 · 配色</button><button id="clear">清空夜空</button></div><div class="stats"><strong id="count">0</strong> 束愿望<br><span id="particles">0</span> 颗光点 · <span id="fps">60</span> FPS</div></div>
<script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let w,h,dpr,particles=[],rockets=[],sparks=[],stars=[],count=0,last=performance.now(),auto=false,lastAuto=0,palette=0,frames=0,timer=0;const palettes=[[25,37,47,348],[178,194,222,278],[320,345,18,55]];
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#08141e';ctx.fillRect(0,0,w,h);stars=Array.from({length:100},()=>({x:Math.random()*w,y:Math.random()*h*.8,r:Math.random()*1.1+.3,a:Math.random()*.5+.15}))}addEventListener('resize',resize);resize();
function explode(x,y,color){const n=100+Math.floor(Math.random()*60),radius=3+Math.random()*2;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+Math.random()*.1,s=radius*(.6+Math.random()*.7);particles.push({x,y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,max:1,decay:.004+Math.random()*.008,color:color+Math.random()*12-6,r:Math.random()*1.1+.6})}particles=particles.slice(-4500);count++;$('count').textContent=count;document.body.dataset.bursts=count}
function launch(x,y){const hue=palettes[palette][Math.floor(Math.random()*4)];rockets.push({x:w*(.25+Math.random()*.5),y:h,tx:x,ty:y,hue,t:0});rockets=rockets.slice(-32);$('hint').style.opacity='0';$('intro').style.opacity=count>2?'.22':'.6'}
addEventListener('pointerdown',e=>{if(!e.target.closest('button'))launch(e.clientX,e.clientY)});$('auto').onclick=()=>{auto=!auto;$('auto').setAttribute('aria-pressed',auto);$('auto').textContent=auto?'停止自动':'自动绽放'};$('palette').onclick=()=>{palette=(palette+1)%3;$('palette').textContent=['暖金','冷蓝','绯红'][palette]+' · 配色'};$('clear').onclick=()=>{particles=[];rockets=[];count=0;$('count').textContent=0;ctx.fillStyle='#08141e';ctx.fillRect(0,0,w,h);$('intro').style.opacity=1;$('hint').style.opacity=1};
function frame(now){const dt=Math.min((now-last)/16.667,2.4);last=now;ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(8,20,30,.19)';ctx.fillRect(0,0,w,h);for(const s of stars){ctx.fillStyle=`rgba(181,202,214,${s.a*(.7+.3*Math.sin(now*.0007+s.x))})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalCompositeOperation='lighter';for(let i=rockets.length-1;i>=0;i--){const r=rockets[i],x=r.x,y=r.y;r.x+=(r.tx-r.x)*.14*dt;r.y+=(r.ty-r.y)*.14*dt;r.t+=dt;ctx.strokeStyle=`hsla(${r.hue},90%,75%,.6)`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(r.x,r.y);ctx.stroke();if(Math.hypot(r.tx-r.x,r.ty-r.y)<8||r.t>60){explode(r.tx,r.ty,r.hue);rockets.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.px=p.x;p.py=p.y;p.vx*=Math.pow(.988,dt);p.vy=p.vy*Math.pow(.988,dt)+.035*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=p.decay*dt;if(p.life<=0||p.y>h+30){particles.splice(i,1);continue}ctx.strokeStyle=`hsla(${p.color},90%,${60+p.life*20}%,${p.life*(Math.random()>.06?1:.2)})`;ctx.lineWidth=p.r*p.life;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke()}if(auto&&now-lastAuto>1100){lastAuto=now;launch(w*(.15+Math.random()*.7),h*(.2+Math.random()*.4))}frames++;if(now-timer>500){$('particles').textContent=particles.length;$('fps').textContent=Math.round(frames*1000/(now-timer));frames=0;timer=now}requestAnimationFrame(frame)}requestAnimationFrame(frame);setTimeout(()=>launch(w*.72,h*.3),550);
</script></body></html>
