<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>花火 / A night to remember</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;color:#e7f0ed;font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 56%,transparent 10%,#050a10aa 100%),linear-gradient(180deg,#07111b 0%,#0c1d28 65%,#101a20 100%);z-index:0}.hud{position:fixed;z-index:1;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,5vw,48px);pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{letter-spacing:.2em;font-size:10px;color:#c0d8d1}.meta{color:#88a29d;letter-spacing:.16em;text-align:right;font-size:9px}.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;width:min(86vw,470px)}.kicker{letter-spacing:.31em;color:#9ebbb6;font-size:9px}.title{font:300 clamp(43px,10vw,82px)/1.08 Georgia,serif;letter-spacing:.025em;margin:17px 0 12px;background:linear-gradient(120deg,#ecf5e7,#b7d2c8,#edcd91);color:transparent;background-clip:text}.copy{color:#98aca9;font-size:12px;letter-spacing:.08em}.hint{margin-top:33px;color:#748f8e;font-size:10px;letter-spacing:.14em;animation:pulse 2.3s ease-in-out infinite}.bottom{display:flex;align-items:end;justify-content:space-between}.counter{font:22px Georgia,serif;color:#d7e7dc}.counter small{font:9px ui-sans-serif,system-ui;color:#79918d;letter-spacing:.14em;margin-left:7px}.controls{display:flex;gap:8px;pointer-events:auto}.button{border:1px solid #54716b88;background:#0b1d24bb;color:#d5e6dd;border-radius:999px;padding:10px 14px;font:inherit;font-size:10px;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(12px)}.button:hover{background:#1b3939}.button.active{border-color:#e2c27f;color:#efd38e}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);color:#b4c8bf;font-size:10px;letter-spacing:.15em;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}@keyframes pulse{50%{opacity:.45}}
</style></head><body><canvas id="sky" aria-label="点击夜空绽放烟花"></canvas><div class="vignette"></div><main class="hud"><header class="top"><div class="brand">AFTERGLOW <span style="color:#627b77">/</span> 花火</div><div class="meta"><div>OPEN SKY · 01</div><div id="count">00 BURSTS</div></div></header><section class="center"><div class="kicker">A NIGHT TO REMEMBER</div><h1 class="title">让光停留</h1><div class="copy">每一次点击，都是一朵只属于你的烟花。</div><div class="hint">点击夜空任意位置 · CLICK ANYWHERE</div></section><footer class="bottom"><div class="counter" id="clock">00:00<small>LOCAL NIGHT</small></div><div class="controls"><button class="button" id="auto">自动绽放</button><button class="button" id="clear">清空夜空</button></div></footer></main><div class="toast" id="toast"></div>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:true}),colors=['#f5cf83','#a8dfcb','#e5a2aa','#a8c9f2','#f6e9bd','#cfb5f4'];let w=0,h=0,dpr=1,particles=[],rockets=[],bursts=0,auto=false,last=0;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize,{passive:true});resize();function launch(x,y){if(particles.length>2600)particles.splice(0,particles.length-1800);let c=colors[Math.random()*colors.length|0],n=72+(Math.random()*45|0),r=2+Math.random()*2;for(let i=0;i<n;i++){let a=i/n*Math.PI*2+Math.random()*.04,v=(1.1+Math.random()*4.7)*(Math.random()<.08?1.5:1);particles.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c,life:.75+Math.random()*.8,max:1.55,size:.7+Math.random()*1.8,tw:Math.random()*6.28})}for(let i=0;i<18;i++){let a=Math.random()*6.28,v=Math.random()*1.6;particles.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:'#fff5d4',life:.2+Math.random()*.35,max:.55,size:.5+Math.random(),tw:0})}bursts++;document.querySelector('#count').textContent=String(bursts).padStart(2,'0')+' BURSTS'}function fire(x,y){rockets.push({x:Math.random()*w,y:h+10,tx:x,ty:y,life:0.28+Math.random()*.38,c:colors[Math.random()*colors.length|0]})}canvas.addEventListener('pointerdown',e=>launch(e.clientX,e.clientY));function frame(t){let dt=Math.min(.032,(t-last)/1000||.016);last=t;ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(6,14,21,.22)';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='lighter';for(let i=rockets.length-1;i>=0;i--){let q=rockets[i];q.life-=dt;let p=1-Math.max(0,q.life)/.65;q.y+=(q.ty-q.y)*Math.min(1,dt*7);q.x+=(q.tx-q.x)*Math.min(1,dt*7);ctx.fillStyle=q.c;ctx.globalAlpha=.65;ctx.fillRect(q.x,q.y,2,4);if(q.life<=0){launch(q.tx,q.ty);rockets.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.px=p.x;p.py=p.y;p.vx*=Math.pow(.986,dt*60);p.vy=(p.vy+1.24*dt)*Math.pow(.991,dt*60);p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;let a=Math.min(1,p.life/.22)*(p.life/p.max);ctx.globalAlpha=Math.max(0,a);ctx.strokeStyle=p.c;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();if(Math.random()<.07&&p.life>.15){ctx.fillStyle='#fff8d9';ctx.fillRect(p.x,p.y,1,1)}}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';if(auto&&t-lastAuto>1150){fire(w*(.18+Math.random()*.64),h*(.18+Math.random()*.4));lastAuto=t}requestAnimationFrame(frame)}let lastAuto=0;requestAnimationFrame(frame);document.querySelector('#auto').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('active',auto);e.currentTarget.textContent=auto?'停止自动':'自动绽放';if(auto)lastAuto=performance.now()-1000};document.querySelector('#clear').onclick=()=>{particles=[];rockets=[];ctx.clearRect(0,0,w,h);const t=document.querySelector('#toast');t.textContent='夜空已重置';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1000)};setInterval(()=>{let d=new Date();document.querySelector('#clock').innerHTML=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}<small>LOCAL NIGHT</small>`},1000);
</script></body></html>
