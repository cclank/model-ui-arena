<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Index — Market watch</title>
<!-- A quiet, precise financial terminal with deterministic local quotes. Selecting a security or period redraws its chart; pointer and keyboard exploration reveal the series. -->
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#e6e9e6;padding:24px;display:grid;place-items:center;font-family:Arial,sans-serif;color:#e3eadf}main{width:min(1030px,100%);background:#17201c;border:1px solid #39463b;border-radius:16px;overflow:hidden;box-shadow:0 28px 65px #16301a2a}header{display:flex;justify-content:space-between;align-items:center;padding:25px 30px;border-bottom:1px solid #344036}.brand{font:bold 23px Georgia;letter-spacing:-1px}.brand i{color:#d9f487;font-style:normal}.market{font:9px monospace;color:#9da996;letter-spacing:1px}.market:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#d9f487;margin-right:7px;box-shadow:0 0 10px #d9f45855}.layout{display:grid;grid-template-columns:260px 1fr}.watchlist{border-right:1px solid #344036;padding:25px 17px}.label{font:9px monospace;letter-spacing:2px;color:#8b9b86;margin:0 11px 20px}.stock{width:100%;background:transparent;color:inherit;border:1px solid transparent;border-radius:7px;padding:16px 12px;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:7px}.stock[aria-pressed=true]{background:#2c382c;border-color:#536048}.stock+.stock{margin-top:8px}.ticker{font:bold 14px monospace}.company{font-size:10px;color:#94a18d}.price{font:13px monospace;text-align:right}.change{font:10px monospace;text-align:right}.up{color:#cce993}.down{color:#f59b86}.spark{grid-column:1/-1;height:24px;width:100%;opacity:.6}.panel{padding:29px 32px 24px;min-width:0}.heading,.periods,.chart-foot,footer{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;font-weight:500;margin:0 0 7px}.exchange{font:9px monospace;letter-spacing:1px;color:#8e9a85}.badge{border:1px solid #4a5643;border-radius:20px;padding:6px 9px;font:9px monospace;color:#a7b196}.quote{font:52px/1 monospace;letter-spacing:-3px;margin:26px 0 9px}.quote span{font-size:17px;letter-spacing:0;color:#84957c;margin-left:9px}.delta{font:12px monospace}.periods{margin:25px 0 8px;border-top:1px solid #344036;padding-top:20px}.periods>span{font:9px monospace;color:#899982}.tabs{display:flex;gap:5px}.tabs button{background:none;border:0;color:#8e9e85;font:10px monospace;cursor:pointer;padding:6px 10px;border-radius:4px}.tabs button[aria-pressed=true]{background:#dae99e;color:#263422}.chart-wrap{height:210px;position:relative;touch-action:pan-y}.chart-wrap svg{height:100%;width:100%;overflow:visible}.tooltip{position:absolute;top:4px;left:8px;background:#e3edbe;color:#293324;padding:6px 8px;font:10px monospace;border-radius:3px;pointer-events:none;opacity:0}.chart-wrap:hover .tooltip,.chart-wrap:focus .tooltip{opacity:1}.chart-foot{font:9px monospace;color:#829178}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:25px;padding-top:20px;border-top:1px solid #344036}.stats span{display:block;color:#8a9a81;font:8px monospace;letter-spacing:1px;margin-bottom:7px}.stats b{font:14px monospace}footer{padding:17px 29px;border-top:1px solid #344036;font:8px/1.7 monospace;color:#7e9076;gap:20px}button:focus-visible,.chart-wrap:focus-visible{outline:2px solid #d9f487;outline-offset:3px}.tick{animation:tick .5s}@keyframes tick{50%{color:#edffd5}}@media(max-width:700px){body{padding:16px}.layout{grid-template-columns:1fr}.watchlist{border:0;border-bottom:1px solid #344036;display:grid;grid-template-columns:repeat(3,1fr);padding:14px 12px;gap:6px}.watchlist>.label{display:none}.stock{display:block;padding:10px 7px}.stock+.stock{margin:0}.company,.spark{display:none}.ticker{font-size:12px}.price{text-align:left;font-size:11px;margin-top:9px}.change{text-align:left;font-size:9px;margin-top:5px}.panel{padding:23px 22px}header{padding:22px}.quote{font-size:43px}.market{font-size:8px}.chart-wrap{height:170px}footer{padding:15px 22px;font-size:7px}.stats b{font-size:12px}}
</style></head><body><main>
<header><span class="brand">index<i>↗</i></span><span class="market">MARKET WATCH / SIMULATED</span></header><div class="layout"><aside class="watchlist" id="watch"><div class="label">YOUR WATCHLIST / 03</div></aside>
<section class="panel"><div class="heading"><div><h1 id="name"></h1><div class="exchange" id="exchange"></div></div><span class="badge">EQUITY</span></div><div class="quote"><b id="price"></b><span>USD</span></div><div class="delta" id="delta"></div><div class="periods"><span>PRICE OVERVIEW</span><div class="tabs" id="tabs"><button aria-pressed="true">1D</button><button aria-pressed="false">1W</button><button aria-pressed="false">1M</button><button aria-pressed="false">1Y</button></div></div>
<div class="chart-wrap" id="chart-wrap" tabindex="0" role="img" aria-label="Stock price chart. Left and right arrow keys explore prices."><svg id="chart" viewBox="0 0 600 200" preserveAspectRatio="none"></svg><output class="tooltip" id="tip"></output></div><div class="chart-foot"><span id="from">09:30</span><span>LOCAL SAMPLE SERIES</span><span id="to">16:00</span></div><div class="stats"><div><span>SESSION HIGH</span><b id="high"></b></div><div><span>SESSION LOW</span><b id="low"></b></div><div><span>VOLUME</span><b id="volume"></b></div></div></section></div>
<footer><span>SIMULATED QUOTES · LOCAL DATA</span><span id="updated">STREAM CONNECTED</span></footer></main><script>
const $=id=>document.getElementById(id),stocks=[{symbol:'AAPL',name:'Apple Inc.',base:228.64,prev:225.81,volume:'42.8M',seed:1},{symbol:'NVDA',name:'NVIDIA Corporation',base:134.72,prev:138.43,volume:'187.2M',seed:5},{symbol:'MSFT',name:'Microsoft Corporation',base:424.18,prev:420.28,volume:'18.6M',seed:8}];let active=0,range=0,tick=0,series=[],cursor=30;const money=v=>v.toFixed(2),delta=s=>s.base-s.prev,up=s=>delta(s)>=0,sign=v=>v>=0?'+':'−';
function makeSeries(s){const n=64,multi=[1,2,4,11][range];return Array.from({length:n},(_,i)=>s.base+(Math.sin(i*.38+s.seed)*.55+Math.sin(i*.94)*.14-Math.sin(63*.38+s.seed)*.55-Math.sin(63*.94)*.14+(i-63)*delta(s)/63)*multi);}
function spark(s){const values=makeSeries(s),lo=Math.min(...values),span=Math.max(...values)-lo||1;return values.map((v,j)=>(j?'L':'M')+j*200/63+','+(22-(v-lo)/span*20)).join(' ');}
function watch(){for(const [i,s]of stocks.entries()){let b=$('s'+i);if(!b){b=document.createElement('button');b.id='s'+i;b.className='stock';b.onclick=()=>{active=i;render();};$('watch').append(b);}b.setAttribute('aria-pressed',i===active);b.innerHTML=`<div class="ticker">${s.symbol}</div><div class="price">${money(s.base)}</div><div class="company">${s.name}</div><div class="change ${up(s)?'up':'down'}">${sign(delta(s))}${Math.abs(delta(s)/s.prev*100).toFixed(2)}%</div><svg class="spark" viewBox="0 0 200 24" preserveAspectRatio="none"><path d="${spark(s)}" fill="none" stroke="${up(s)?'#cce993':'#f59b86'}" stroke-width="1.3"/></svg>`;}}
function render(){watch();const s=stocks[active],d=delta(s);$('name').textContent=s.name;$('exchange').textContent=s.symbol+' / NASDAQ';$('price').textContent=money(s.base);$('delta').className='delta '+(up(s)?'up':'down');$('delta').textContent=`${sign(d)}${money(Math.abs(d))} (${sign(d)}${Math.abs(d/s.prev*100).toFixed(2)}%) today`;series=makeSeries(s);const lo=Math.min(...series),hi=Math.max(...series),col=up(s)?'#d3ec94':'#f0a08c',points=series.map((v,i)=>[i*600/63,176-(v-lo)/(hi-lo)*148]),path=points.map((p,i)=>(i?'L':'M')+p.join(',')).join(' ');$('chart').innerHTML=`<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${col}" stop-opacity=".2"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`+[25,75,125,175].map(y=>`<path d="M0 ${y}H600" stroke="#394532" stroke-dasharray="2 6" stroke-width=".7"/>`).join('')+`<path d="${path}L600 200H0Z" fill="url(#fade)"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/><line id="cross" x1="300" x2="300" y1="0" y2="200" stroke="#8a9c70" stroke-dasharray="3 3" opacity=".5"/>`;$('high').textContent=money(hi);$('low').textContent=money(lo);$('volume').textContent=s.volume;$('from').textContent=['09:30','MON','DAY 01','JAN'][range];$('to').textContent=['16:00','FRI','DAY 30','DEC'][range];explore(cursor);}
function explore(i){cursor=Math.max(0,Math.min(63,i));$('tip').textContent=`${stocks[active].symbol} · ${money(series[cursor])} USD · ${cursor+1}/64`;$('cross').setAttribute('x1',cursor*600/63);$('cross').setAttribute('x2',cursor*600/63);}
$('chart-wrap').onpointermove=e=>{const r=e.currentTarget.getBoundingClientRect();explore(Math.round((e.clientX-r.left)/r.width*63));};$('chart-wrap').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();explore(cursor+(e.key==='ArrowRight'?1:-1));}};
document.querySelectorAll('#tabs button').forEach((b,i)=>b.onclick=()=>{range=i;document.querySelectorAll('#tabs button').forEach((x,j)=>x.setAttribute('aria-pressed',i===j));render();});
setInterval(()=>{if(document.hidden)return;tick++;stocks.forEach((s,i)=>s.base+=Math.sin(tick*.8+i)*.035);render();$('updated').textContent='LAST TICK '+new Date().toLocaleTimeString('en-GB');},4000);render();
</script></body></html>
