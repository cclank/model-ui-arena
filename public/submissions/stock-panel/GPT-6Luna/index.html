<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Meridian / 市场观察</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#0a0e12;color:#e7eced;font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}.panel{width:min(100%,760px);background:#11171c;border:1px solid #273139;border-radius:20px;box-shadow:0 30px 80px #0008;overflow:hidden}.bar{height:4px;background:linear-gradient(90deg,#a7d3c0 0 31%,#293b38 31% 100%)}header{display:flex;align-items:center;justify-content:space-between;padding:23px 27px 17px}.brand{font-size:11px;letter-spacing:.2em;font-weight:650}.sub{color:#718189;font-size:9px;letter-spacing:.15em;margin-top:4px}.live{color:#a6d6bd;font-size:10px}.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#88d3ac;margin-right:7px;box-shadow:0 0 8px #74d6a8}.market{display:flex;gap:7px;padding:0 24px 17px;overflow:auto}.ticker{flex:1;min-width:136px;text-align:left;border:1px solid #29333a;background:#161e23;color:inherit;border-radius:13px;padding:12px;cursor:pointer}.ticker.active{border-color:#85b99e;background:#1a2824;box-shadow:inset 0 0 0 1px #85b99e22}.ticker-top{display:flex;justify-content:space-between;color:#8a9aa0;font-size:9px}.ticker strong{display:block;font-size:12px;color:#edf1ef;letter-spacing:.04em}.price{font:22px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:8px;font-variant-numeric:tabular-nums}.chg{font-size:10px;color:#86d0ac}.neg{color:#ef967e}.content{padding:0 27px 23px}.asset{display:flex;align-items:flex-end;justify-content:space-between}.asset h1{margin:0;font-size:18px;letter-spacing:.01em}.asset small{color:#798990}.quote{font:29px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:9px}.gain{color:#8ed0ac;font-size:11px;margin-left:8px}.tabs{display:flex;align-items:center;gap:5px}.tab{border:0;background:transparent;color:#809096;padding:6px 9px;border-radius:7px;font:inherit;font-size:10px;cursor:pointer}.tab.active{background:#263631;color:#c0e0cc}.chartbox{margin-top:10px;position:relative;border-bottom:1px solid #303a40;background:linear-gradient(180deg,#6aa78812,transparent);height:190px}.chartbox svg{width:100%;height:100%;overflow:visible}.grid line{stroke:#243037;stroke-dasharray:2 5}.line{fill:none;stroke:#9bd2b3;stroke-width:2;vector-effect:non-scaling-stroke}.area{fill:url(#fill)}.cross{stroke:#b4ddc5;stroke-width:1;stroke-dasharray:3 5;opacity:0}.point{fill:#d5efde;stroke:#233d30;stroke-width:4;opacity:0}.chartbox:hover .cross,.chartbox:hover .point{opacity:1}.tooltip{position:absolute;top:9px;left:10px;color:#9bb0b5;font-size:9px}.axis{display:flex;justify-content:space-between;color:#697a81;font-size:9px;padding-top:9px}.bottom{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #29333a;padding-top:15px;margin-top:18px;gap:8px}.metric span{display:block;color:#728189;font-size:9px}.metric b{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;display:block;margin-top:5px}.risk{margin-top:13px;color:#75858c;font-size:9px;display:flex;justify-content:space-between}.risk b{color:#d5c08d;font-weight:500}
@media(max-width:560px){body{padding:10px}.panel{border-radius:17px}.market{padding:0 13px 14px}.ticker{min-width:115px;padding:10px}.content{padding:0 16px 18px}header{padding:19px 16px 14px}.chartbox{height:165px}.bottom{gap:4px}}
</style></head><body><main class="panel"><div class="bar"></div><header><div><div class="brand">MERIDIAN <span style="color:#7e9187">/</span> 市场观察</div><div class="sub">MARKET SIGNAL · LOCAL SIMULATION</div></div><div class="live">LIVE SIM</div></header><nav class="market" id="tickers"></nav><section class="content"><div class="asset"><div><h1 id="name"></h1><small id="exchange"></small></div><div class="tabs" id="tabs"></div></div><div class="quote" id="quote"></div><div class="chartbox"><div class="tooltip" id="hint">悬停图表查看 · 价格模拟</div><svg viewBox="0 0 680 190" preserveAspectRatio="none" aria-label="价格趋势图"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8cc5a5" stop-opacity=".22"/><stop offset="1" stop-color="#8cc5a5" stop-opacity="0"/></linearGradient></defs><g class="grid"><line x1="0" y1="35" x2="680" y2="35"/><line x1="0" y1="82" x2="680" y2="82"/><line x1="0" y1="129" x2="680" y2="129"/></g><path class="area" id="area"/><path class="line" id="line"/><line class="cross" id="cross" y1="5" y2="180"/><circle class="point" id="point" r="5"/></svg></div><div class="axis"><span id="start"></span><span>09:30</span><span>12:00</span><span>15:00</span></div><div class="bottom"><div class="metric"><span>开盘 OPEN</span><b id="open"></b></div><div class="metric"><span>日内区间 RANGE</span><b id="range"></b></div><div class="metric"><span>成交量 VOLUME</span><b id="vol"></b></div></div><div class="risk"><span>风险观察 <b id="risk"></b></span><span>数据由本地模型生成</span></div></section></main>
<script>
const assets=[{s:'AAPL',name:'Apple Inc.',exchange:'NASDAQ · USD',price:228.42,change:1.26,vol:'42.8M',risk:'低波动',seed:2.1},{s:'NVDA',name:'NVIDIA Corp.',exchange:'NASDAQ · USD',price:142.76,change:2.84,vol:'188.2M',risk:'高波动',seed:1.25},{s:'TSLA',name:'Tesla, Inc.',exchange:'NASDAQ · USD',price:326.15,change:-1.13,vol:'76.4M',risk:'波动扩大',seed:3.4}];const ranges=['1D','1W','1M'];let ai=0,period='1D',data=[];const $=s=>document.querySelector(s);assets.forEach((a,i)=>{let b=document.createElement('button');b.className='ticker';b.onclick=()=>{ai=i;render()};$('#tickers').append(b)});ranges.forEach(r=>{let b=document.createElement('button');b.className='tab';b.textContent=r;b.onclick=()=>{period=r;render()};$('#tabs').append(b)});const nf=(n)=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});function render(){const a=assets[ai],sign=a.change>=0?'+':'';$('#tickers').querySelectorAll('.ticker').forEach((b,i)=>{const q=assets[i];b.classList.toggle('active',i===ai);b.innerHTML=`<div class="ticker-top"><strong>${q.s}</strong><span class="${q.change<0?'neg':'chg'}">${q.change>0?'▲':'▼'} ${Math.abs(q.change).toFixed(2)}%</span></div><div class="price">${nf(q.price)}</div>`});$('#tabs').querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.textContent===period));$('#name').textContent=a.name;$('#exchange').textContent=a.exchange;$('#quote').innerHTML=`$${nf(a.price)} <span class="gain ${a.change<0?'neg':''}">${sign}${a.change.toFixed(2)}%</span>`;$('#open').textContent=`$${nf(a.price/(1+a.change/100))}`;$('#range').textContent=`${nf(a.price*.974)} — ${nf(a.price*1.019)}`;$('#vol').textContent=a.vol;$('#risk').textContent=a.risk;$('#start').textContent=period==='1D'?'09:30':period==='1W'?'MON':'JUN 01';const length=period==='1D'?34:period==='1W'?25:30,amp=period==='1D'?.045:period==='1W'?.08:.14;data=Array.from({length},(_,i)=>{let trend=Math.sin(i*.32+a.seed)*.018+Math.cos(i*.13+a.seed*2)*.022+i/(length-1)*a.change/100*.7;return .52-trend-Math.sin(i*1.71+a.seed)*amp*.24});let pts=data.map((v,i)=>[i/(length-1)*680,Math.max(8,Math.min(175,v*190))]);let path=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');$('#line').setAttribute('d',path);$('#area').setAttribute('d',`${path} L680,190 L0,190 Z`);$('#cross').style.opacity=0;$('#point').style.opacity=0;$('#hint').textContent=`${period} · 日内走势 · ${a.s}`;$('#risk').style.color=a.change<0?'#e8a18b':'#d5c08d'}$('.chartbox').onmousemove=e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*680,i=Math.max(0,Math.min(data.length-1,Math.round(x/680*(data.length-1)))),y=data[i]*190;$('#cross').setAttribute('x1',x);$('#cross').setAttribute('x2',x);$('#point').setAttribute('cx',x);$('#point').setAttribute('cy',y);$('#hint').textContent=`${assets[ai].s} · $${nf(assets[ai].price*(1+(data[i]-.5)*.11))} · ${Math.round(i/(data.length-1)*100)}%`};$('.chartbox').onmouseleave=()=>{$('#hint').textContent=`${period} · 日内走势 · ${assets[ai].s}`};render();setInterval(()=>{assets.forEach(a=>a.price+=Math.sin(Date.now()/7000+a.seed)*.015);render()},5000);
</script></body></html>
