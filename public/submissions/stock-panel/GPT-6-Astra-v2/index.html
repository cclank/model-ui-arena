<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal — Market watch</title>
<!-- 清冷金融终端配以薄荷绿色，强调价格层级与可读的涨跌方向。
     三支股票、四档周期、悬停读数与可暂停的模拟行情形成完整观察流程。
     原生 SVG 绘制趋势与成交量；所有行情在本地确定性生成。 -->
<style>
*{box-sizing:border-box}body{margin:0;background:#101717;color:#e2ebe5;font-family:Arial,Helvetica,sans-serif;min-height:100svh;display:grid;place-items:center}main{width:min(100% - 48px,850px);padding:30px 0}header,.row,footer{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:17px;letter-spacing:-.5px;font-weight:700}.brand i{display:inline-block;width:14px;height:16px;margin-right:9px;border-left:3px solid #c2e9a8;border-right:3px solid #c2e9a8;transform:skew(-15deg);vertical-align:middle}.mono{font:9px 'Courier New',monospace;letter-spacing:1px;color:#758c82}.status{color:#aedb9c;font:8px monospace;letter-spacing:1px}.status:before{content:'';display:inline-block;width:5px;height:5px;background:currentColor;box-shadow:0 0 7px #a9db7e88;margin-right:6px;border-radius:50%}.top{margin-top:33px;margin-bottom:22px}h1{font-size:30px;font-weight:400;letter-spacing:-1px;margin:7px 0}.date{font-size:10px;color:#839a8d}.watchlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.stock{position:relative;text-align:left;padding:17px;border:1px solid #2b3a34;border-radius:10px;background:#16211e;cursor:pointer;color:inherit;transition:background .3s,border-color .3s}.stock[aria-pressed=true]{background:#dce9d6;border-color:#dce9d6;color:#20392e}.stock .symbol{font-size:11px;font-weight:700;letter-spacing:.4px}.stock small{font-size:9px;color:#85998b;display:block;margin:5px 0 16px}.stock[aria-pressed=true] small{color:#657f6e}.stock strong{font-size:22px;font-weight:500;letter-spacing:-.7px;display:block}.change{font:10px monospace;margin-top:7px;display:block}.up{color:#afd291}.down{color:#ef9a91}.stock[aria-pressed=true] .up{color:#438552}.stock[aria-pressed=true] .down{color:#ba514a}.mini{position:absolute;right:12px;top:14px;width:37px;height:18px;opacity:.75}
.panel{padding:24px 25px 17px;background:#15201d;border:1px solid #2a3932;border-radius:12px;margin-top:17px}.title{font-size:13px;font-weight:500}.sub{margin-top:6px;font:9px monospace;color:#768f81}.ranges{display:flex;gap:4px}button{font-family:inherit}button:focus-visible{outline:2px solid #c0e3a3;outline-offset:4px}.ranges button{padding:7px 10px;font:9px monospace;color:#829f8a;cursor:pointer;border:0;background:none;border-radius:5px}.ranges button[aria-pressed=true]{background:#334535;color:#d1eac0}.ranges button:hover{color:#e1f3d4}.quote{display:flex;align-items:center;gap:13px;margin:23px 0 12px;flex-wrap:wrap}.price{font-size:36px;letter-spacing:-1.7px;font-variant-numeric:tabular-nums}.quote .change{padding:6px 8px;border:1px solid #314834;border-radius:5px;margin:0;font-size:10px}.chart-wrap{position:relative}.chart{width:100%;height:220px;overflow:visible;display:block;touch-action:pan-y}.axis{font:9px monospace;fill:#638372}.chart-tooltip{position:absolute;top:4px;left:12px;background:#223b2e;border:1px solid #4a6950;border-radius:4px;padding:6px 9px;font:9px monospace;color:#d5e9c4;pointer-events:none;opacity:0}.period-labels{display:flex;justify-content:space-between;font:8px monospace;color:#6d8978;padding:9px 43px 0 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #2b3b31;padding-top:19px;margin-top:21px;gap:12px}.stats span{display:block;font:8px monospace;color:#759180;letter-spacing:1px}.stats b{display:block;font:12px monospace;font-weight:400;margin-top:8px}.insight{display:flex;align-items:center;gap:9px;font-size:10px;color:#b4c4ae;margin-top:20px}.insight i{width:5px;height:5px;background:#c4cb87;border-radius:50%}.insight small{font:9px monospace;color:#7f9278}footer{border-top:1px solid #2b3b31;margin-top:26px;padding-top:17px;font:8px monospace;color:#6b8574;letter-spacing:.6px}#stream{background:none;color:#93b083;border:1px solid #344631;border-radius:5px;padding:7px 10px;font:9px monospace;cursor:pointer}.flash{animation:flash .5s}@keyframes flash{50%{opacity:.55}}@media(max-width:500px){main{width:calc(100% - 36px);padding:23px 0}.top{margin-top:27px}.watchlist{gap:7px}.stock{padding:13px 10px}.stock strong{font-size:18px}.stock small{font-size:7px;margin-bottom:15px}.stock .symbol{font-size:10px}.mini{right:9px;top:12px;width:23px}.change{font-size:8px}.panel{padding:20px 17px 17px}.chart{height:190px}.price{font-size:32px}.title{font-size:12px}.ranges button{padding:6px 7px}.stats{gap:5px}.stats span{font-size:7px}.stats b{font-size:10px}.insight{font-size:9px}.insight small{display:none}.date{font-size:8px}h1{font-size:28px}}
</style>
<main><header><span class="brand"><i></i>signal</span><span class="status" id="status">LIVE SIMULATION</span></header><div class="top row"><div><div class="mono">YOUR DAILY PERSPECTIVE</div><h1>Keep an eye on it.</h1></div><div class="date" id="date"></div></div><section class="watchlist" id="watchlist" aria-label="Stock watchlist"></section>
<section class="panel" aria-label="Selected stock details"><div class="row"><div><div class="title" id="name"></div><div class="sub" id="exchange"></div></div><nav class="ranges" aria-label="Chart period"><button data-period="1D" aria-pressed="true">1D</button><button data-period="1W" aria-pressed="false">1W</button><button data-period="1M" aria-pressed="false">1M</button><button data-period="1Y" aria-pressed="false">1Y</button></nav></div><div class="quote"><span class="price" id="price"></span><span class="change" id="change"></span></div>
<div class="chart-wrap"><svg class="chart" id="chart" viewBox="0 0 700 210" preserveAspectRatio="none" role="img" aria-label="Interactive simulated price history"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b5df97" stop-opacity=".17"/><stop offset="1" stop-color="#b5df97" stop-opacity="0"/></linearGradient></defs><g id="grid"></g><g id="volume" opacity=".25"></g><path id="fill" fill="url(#area)"/><path id="trace" fill="none" stroke="#b9df9d" stroke-width="2" vector-effect="non-scaling-stroke"/><g id="cursor" style="display:none"><path id="cross" stroke="#82a36f" stroke-dasharray="3 4"/><circle id="point" r="4" fill="#d6edb9" stroke="#324a32" stroke-width="3"/></g></svg><output class="chart-tooltip" id="tooltip"></output></div><div class="period-labels" id="labels"></div>
<div class="stats"><div><span>OPEN</span><b id="open"></b></div><div><span>DAY HIGH</span><b id="high"></b></div><div><span>DAY LOW</span><b id="low"></b></div><div><span>VOLUME</span><b id="vol"></b></div></div></section><div class="insight"><i></i><span id="insight"></span><small>LOCAL SYNTHETIC FEED</small></div><footer><span id="updated">ILLUSTRATIVE PRICES · USD</span><button id="stream">Pause updates</button></footer></main>
<script>
const $=id=>document.getElementById(id),stocks=[{symbol:'AAPL',name:'Apple Inc.',price:232.84,base:229.17,open:230.04,volume:'42.8M'},{symbol:'NVDA',name:'NVIDIA Corp.',price:142.76,base:138.98,open:139.2,volume:'181.6M'},{symbol:'MSFT',name:'Microsoft Corp.',price:417.23,base:421.14,open:420.2,volume:'22.3M'}];let index=0,period='1D',step=0,playing=true,points=[],values=[],dayBounds=stocks.map(s=>({low:Math.min(s.open,s.price)*.997,high:Math.max(s.open,s.price)*1.003}));
const delta=s=>(s.price-s.base)/s.base*100,sign=n=>n>=0?'+':'−',price=n=>n.toFixed(2),direction=s=>delta(s)>=0?'up':'down';function change(s){return `${sign(delta(s))}${Math.abs(s.price-s.base).toFixed(2)} (${sign(delta(s))}${Math.abs(delta(s)).toFixed(2)}%)`}
function cards(){if(!$('watchlist').children.length)$('watchlist').innerHTML=stocks.map((s,i)=>`<button class="stock" data-stock="${i}" aria-pressed="${i===index}" aria-label="Select ${s.name}"><span class="symbol">${s.symbol}</span><small>${s.name}</small><svg class="mini" viewBox="0 0 40 20" aria-hidden="true"><path d="M1 ${i===2?3:17} L8 12 L14 14 L20 8 L26 11 L32 5 L39 ${i===2?18:2}" stroke="currentColor" fill="none"/></svg><strong></strong><span class="change"></span></button>`).join('');document.querySelectorAll('[data-stock]').forEach((b,i)=>{b.setAttribute('aria-pressed',i===index);b.querySelector('strong').textContent='$'+price(stocks[i].price);const c=b.querySelector('.change');c.className='change '+direction(stocks[i]);c.textContent=sign(delta(stocks[i]))+Math.abs(delta(stocks[i])).toFixed(2)+'%';b.onclick=()=>{index=i;render()}})}
function data(){const s=stocks[index],n=80,scale={'1D':1,'1W':2.8,'1M':5.2,'1Y':16}[period],start=s.base*(1-(scale-1)*.009);values=Array.from({length:n},(_,i)=>{const p=i/(n-1);return start+(s.price-start)*p+Math.sin(p*Math.PI)*(Math.sin(i*1.77+index)*.28+Math.sin(i*.59+index)*.7+Math.sin(i*.17)*1.15)*scale});const min=Math.min(...values),max=Math.max(...values),spread=max-min||1;points=values.map((v,i)=>[i/(n-1)*636,172-(v-min+spread*.15)/(spread*1.3)*158]);const path='M'+points.map(p=>p.join(',')).join(' L');$('trace').setAttribute('d',path);$('fill').setAttribute('d',path+' L636 185 L0 185Z');$('grid').innerHTML=Array.from({length:4},(_,i)=>{const y=20+i*48,v=min-spread*.15+(172-y)/158*spread*1.3;return `<path d="M0 ${y}H637" stroke="#2b3c32" stroke-dasharray="2 5"/><text x="650" y="${y+3}" class="axis">${v.toFixed(1)}</text>`}).join('');$('volume').innerHTML=points.map((p,i)=>`<rect x="${p[0]}" y="${209-(6+(Math.sin(i*3.13)+1)*8)}" width="4" height="${6+(Math.sin(i*3.13)+1)*8}" fill="#94b080"/>`).join('');const labels={'1D':['09:30','11:00','12:30','14:00','16:00'],'1W':['MON','TUE','WED','THU','FRI'],'1M':['WEEK 1','WEEK 2','WEEK 3','WEEK 4'],'1Y':['JAN','APR','JUL','OCT','DEC']};$('labels').innerHTML=labels[period].map(x=>`<span>${x}</span>`).join('')}
function render(){const s=stocks[index],b=dayBounds[index];cards();$('name').textContent=s.name;$('exchange').textContent=s.symbol+' / NASDAQ · USD';$('price').textContent='$'+price(s.price);$('change').textContent=change(s);$('change').className='change '+direction(s);$('open').textContent=price(s.open);$('high').textContent=price(b.high);$('low').textContent=price(b.low);$('vol').textContent=s.volume;$('insight').textContent=`${s.symbol} · ${((b.high-b.low)/s.open*100).toFixed(2)}% intraday range`;document.querySelectorAll('[data-period]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.period===period));data()}
document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;$('cursor').style.display='none';$('tooltip').style.opacity=0;render()});
$('chart').onpointermove=e=>{const r=$('chart').getBoundingClientRect(),n=Math.max(0,Math.min(points.length-1,Math.round((e.clientX-r.left)/r.width*700/636*(points.length-1)))),p=points[n];$('cursor').style.display='';$('cross').setAttribute('d',`M${p[0]} 0V210`);$('point').setAttribute('cx',p[0]);$('point').setAttribute('cy',p[1]);$('tooltip').style.opacity=1;$('tooltip').textContent=period+' · SAMPLE '+(n+1)+' · $'+price(values[n]);};$('chart').onpointerleave=()=>{$('cursor').style.display='none';$('tooltip').style.opacity=0};
$('stream').onclick=()=>{playing=!playing;$('stream').textContent=playing?'Pause updates':'Resume updates';$('status').textContent=playing?'LIVE SIMULATION':'SIMULATION PAUSED'};setInterval(()=>{if(!playing||document.hidden)return;step++;stocks.forEach((s,i)=>{s.price+=Math.sin(step*1.9+i)*.12;dayBounds[i].high=Math.max(dayBounds[i].high,s.price);dayBounds[i].low=Math.min(dayBounds[i].low,s.price)});render();$('updated').textContent='SIMULATED UPDATE '+new Date().toLocaleTimeString('en-GB');$('price').classList.remove('flash');void $('price').offsetWidth;$('price').classList.add('flash')},4000);$('date').textContent=new Date().toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'});render();
</script></html>
