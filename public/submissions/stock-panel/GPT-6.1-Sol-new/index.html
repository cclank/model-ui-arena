<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INDEX / Market observatory</title>
<!-- 设计说明：深蓝交易桌，荧光绿承载上涨，珊瑚红承载下跌。
三支模拟股票、可切换主图与流式更新共享同一数据状态。
支持暂停、时间范围和走势图悬停读数，明确标注模拟行情。 -->
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:25px;background:#090f18;color:#edf2f3;font:13px Arial,"PingFang SC",sans-serif}.panel{width:min(920px,100%);background:#111b29;border:1px solid #263444;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px #0005}.header{padding:25px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #263444}.logo{font-size:20px;font-weight:800;letter-spacing:5px}.logo span{color:#b2ee9b}.header small{font-size:9px;letter-spacing:2px;color:#7a8da3}.status{display:flex;gap:15px;align-items:center;color:#b2ee9b;font-size:10px}.status i{width:5px;height:5px;border-radius:50%;background:#b2ee9b;box-shadow:0 0 12px #b2ee9b}.toggle{padding:7px 12px;border-radius:6px;border:1px solid #344357;background:#1a2737;color:#a1b3c8;cursor:pointer;font-size:10px}.summary{padding:28px 30px;display:flex;justify-content:space-between;gap:20px}.label{font-size:9px;color:#7b8da3;letter-spacing:2px}.name{font-size:16px;margin:10px 0}.price{font:48px Arial,sans-serif;letter-spacing:-2px;font-variant-numeric:tabular-nums}.price small{font-size:17px;color:#657c94;letter-spacing:0;margin-right:8px}.change{font-size:12px;margin-top:9px;color:#b2ee9b}.down{color:#fa908a!important}.big-stat{padding-top:18px;text-align:right;font-family:monospace;font-size:13px;color:#dbe4ed}.big-stat div{margin:14px 0}.big-stat span{color:#667d95;font-size:10px;display:inline-block;min-width:90px}.chart-wrap{padding:0 20px;position:relative}.toolbar{padding:0 10px;display:flex;justify-content:space-between;align-items:center}.ranges{display:flex;gap:8px}.ranges button{font-size:10px;padding:6px 9px;background:transparent;color:#71859e;border:0;border-radius:5px;cursor:pointer}.ranges .active{background:#24342b;color:#b2ee9b}.chart-label{font:10px monospace;color:#71859e}.chart{width:100%;height:190px;display:block;overflow:visible;touch-action:pan-y}.axis{font:9px monospace;fill:#5d738b}.grid{stroke:#223043;stroke-width:1;stroke-dasharray:3 5}.plot{fill:none;stroke:#b2ee9b;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.tooltip{position:absolute;pointer-events:none;display:none;top:45px;left:40px;background:#253449;padding:8px 12px;border:1px solid #44556a;border-radius:6px;font:11px monospace}.list{padding:18px 30px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stock{padding:16px;background:#152132;border:1px solid #26394e;border-radius:10px;cursor:pointer;transition:border .3s,background .3s;color:inherit;text-align:left}.stock.selected{border-color:#8cbd76;background:#1a2b2e}.stock-head{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:bold;letter-spacing:1px}.stock-head small{font-size:8px;color:#70879d;font-weight:400}.stock-value{font-size:20px;margin-top:16px;font-variant-numeric:tabular-nums}.stock-change{font-size:10px;color:#b2ee9b;margin-top:5px}.spark{display:block;width:100%;height:25px;margin-top:12px}.footer{display:flex;justify-content:space-between;gap:15px;border-top:1px solid #253346;padding:16px 30px;color:#667c94;font-size:9px}.footer strong{font-weight:400;color:#aa9770}
@media(max-width:550px){body{padding:14px}.header{padding:22px 20px}.header small{display:none}.summary{padding:26px 20px 20px}.price{font-size:42px}.big-stat{font-size:11px}.big-stat span{min-width:60px;font-size:8px}.list{padding:18px 16px;gap:7px}.stock{padding:12px 9px}.stock-head{font-size:9px;letter-spacing:0}.stock-head small{display:none}.stock-value{font-size:16px}.stock-change{font-size:9px}.footer{padding:16px 20px;font-size:8px;line-height:1.6}.chart{height:180px}}
</style></head><body><main class="panel"><header class="header"><div><div class="logo">INDEX<span>®</span></div><small>MARKET OBSERVATORY</small></div><div class="status"><i></i><span id="live">SIMULATED LIVE</span><button class="toggle" id="pause">暂停行情</button></div></header><section class="summary"><div><div class="label">MARKET / US EQUITIES</div><div class="name" id="name"></div><div class="price"><small>$</small><span id="price"></span></div><div class="change" id="change"></div></div><div class="big-stat"><div><span>SESSION HIGH</span> <b id="high"></b></div><div><span>SESSION LOW</span> <b id="low"></b></div><div><span>VOLATILITY</span> <b id="vol"></b></div></div></section><section class="chart-wrap"><div class="toolbar"><div class="ranges"><button data-range="12">1H</button><button data-range="30" class="active">1D</button><button data-range="60">1W</button></div><span class="chart-label" id="chartlabel">TODAY'S PRICE ACTION</span></div><svg class="chart" id="chart" viewBox="0 0 800 190" preserveAspectRatio="none" aria-label="所选股票价格走势图"><defs><linearGradient id="gradient" x2="0" y2="1"><stop id="colorstop" stop-color="#b2ee9b" stop-opacity=".16"/><stop offset="1" stop-color="#b2ee9b" stop-opacity="0"/></linearGradient></defs><g id="grid"></g><path id="area" fill="url(#gradient)"/><path class="plot" id="plot"/><circle id="end" r="3" fill="#b2ee9b"/><g id="cursor" style="display:none"><line y1="14" y2="163" stroke="#729580" stroke-dasharray="3 3" id="cross"/><circle id="marker" r="4" fill="#111b29" stroke="#b2ee9b" stroke-width="2"/></g></svg><div class="tooltip" id="tip"></div></section><section class="list" id="list"></section><footer class="footer"><span>本地模拟行情 · <span id="timestamp"></span></span><strong>价格含随机波动，仅供界面演示</strong></footer></main>
<script>
const $=s=>document.querySelector(s);let selected=0,count=30,paused=false;let seed=9182;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const stocks=[{symbol:'NVDA',name:'NVIDIA Corporation',base:128.6,price:132.74,vol:'2.84%'},{symbol:'AAPL',name:'Apple Inc.',base:228.9,price:226.35,vol:'1.21%'},{symbol:'MSFT',name:'Microsoft Corporation',base:418.5,price:423.68,vol:'1.67%'}];
stocks.forEach(s=>{s.history=Array.from({length:60},(_,i)=>s.base+(s.price-s.base)*i/59+(random()-.5)*s.base*.009);s.history[59]=s.price});
function geometry(a,w=748,h=135,x=20,y=18){let lo=Math.min(...a),hi=Math.max(...a),span=Math.max(.02,hi-lo);return a.map((v,i)=>[x+i/(a.length-1)*w,y+h-(v-lo)/span*h])}const path=p=>'M'+p.map(x=>x.join(',')).join(' L');
function render(){let s=stocks[selected],delta=s.price-s.base,up=delta>=0,color=up?'#b2ee9b':'#fa908a';$('#name').textContent=s.symbol+' / '+s.name;$('#price').textContent=s.price.toFixed(2);$('#change').textContent=`${up?'+':''}${delta.toFixed(2)} (${up?'+':''}${(delta/s.base*100).toFixed(2)}%) 本日`;$('#change').classList.toggle('down',!up);$('#high').textContent=Math.max(...s.history).toFixed(2);$('#low').textContent=Math.min(...s.history).toFixed(2);$('#vol').textContent=s.vol;let a=s.history.slice(-count),p=geometry(a);$('#plot').setAttribute('d',path(p));$('#plot').style.stroke=color;$('#colorstop').setAttribute('stop-color',color);$('#area').setAttribute('d',path(p)+' L768,163 L20,163Z');$('#end').setAttribute('cx',p.at(-1)[0]);$('#end').setAttribute('cy',p.at(-1)[1]);$('#end').setAttribute('fill',color);$('#grid').innerHTML=[20,65,110,155].map(y=>`<line class="grid" x1="20" x2="768" y1="${y}" y2="${y}"/>`).join('')+['09:30','11:00','12:30','14:00','16:00'].map((t,i)=>`<text class="axis" x="${20+185*i}" y="184" text-anchor="${i===4?'end':'start'}">${t}</text>`).join('');$('#list').innerHTML=stocks.map((t,i)=>{let d=t.price-t.base,u=d>=0;return `<button class="stock ${selected===i?'selected':''}" data-i="${i}" aria-pressed="${selected===i}"><div class="stock-head">${t.symbol}<small>NASDAQ</small></div><div class="stock-value">$${t.price.toFixed(2)}</div><div class="stock-change ${u?'':'down'}">${u?'+':''}${(d/t.base*100).toFixed(2)}% · ${u?'上涨':'下跌'}</div><svg class="spark" viewBox="0 0 150 25" preserveAspectRatio="none"><path d="${path(geometry(t.history.slice(-30),148,22,1,1))}" fill="none" stroke="${u?'#b2ee9b':'#fa908a'}" stroke-width="1.5"/></svg></button>`}).join('');$('#timestamp').textContent=new Date().toLocaleTimeString('zh-CN')}
$('#list').onclick=e=>{let b=e.target.closest('[data-i]');if(b){selected=Number(b.dataset.i);render()}};$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'恢复行情':'暂停行情';$('#live').textContent=paused?'STREAM PAUSED':'SIMULATED LIVE'};document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{count=Number(b.dataset.range);document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===b));$('#chartlabel').textContent={'12':'LAST HOUR','30':"TODAY'S PRICE ACTION",'60':'WEEKLY PRICE ACTION'}[count];render()});
$('#chart').onpointermove=e=>{let r=e.currentTarget.getBoundingClientRect(),f=Math.max(0,Math.min(1,((e.clientX-r.left)/r.width*800-20)/748)),a=stocks[selected].history.slice(-count),i=Math.round(f*(a.length-1)),[x,y]=geometry(a)[i];$('#cursor').style.display='';$('#cross').setAttribute('x1',x);$('#cross').setAttribute('x2',x);$('#marker').setAttribute('cx',x);$('#marker').setAttribute('cy',y);$('#tip').style.display='block';$('#tip').textContent=`${stocks[selected].symbol} · $${a[i].toFixed(2)}`;$('#tip').style.left=Math.min(r.width-140,Math.max(25,e.clientX-r.left))+'px'};$('#chart').onpointerleave=()=>{$('#cursor').style.display='none';$('#tip').style.display='none'};
setInterval(()=>{if(paused||document.hidden)return;stocks.forEach(s=>{s.price=Math.max(1,s.price+(random()-.5)*s.base*.0012);s.history.push(s.price);s.history.shift()});render()},1800);render();
</script></body></html>
