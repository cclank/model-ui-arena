<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MERIDIAN · Market watch</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#101718;color:#e8ede9;font-family:Arial,"PingFang SC",sans-serif;display:grid;place-items:center;padding:28px}main{width:min(100%,1040px)}header,.row,.summary,.charthead,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{letter-spacing:.24em;font-size:14px;font-weight:bold}.brand span{color:#96d5ae}header{padding-bottom:26px;border-bottom:1px solid #293536}.live{font-size:10px;color:#9daaab;display:flex;gap:8px;align-items:center}.live i{width:6px;height:6px;background:#9bddb0;border-radius:50%;box-shadow:0 0 0 4px #9bddb016;animation:blink 2s infinite}.intro{display:flex;justify-content:space-between;align-items:end;margin:35px 0 29px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#8b9d99}h1{font-size:34px;font-weight:normal;letter-spacing:-.04em;margin:12px 0 0}#updated{font-size:10px;color:#869995}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:22px}.panel{background:#182224;border:1px solid #2d3938;border-radius:20px;padding:26px}.summary{align-items:start;margin-bottom:15px}.name{font-size:11px;color:#99b0a6;line-height:1.6}.price{font-size:56px;letter-spacing:-.055em;font-variant-numeric:tabular-nums;margin-top:9px}.price small{font-size:16px;color:#8fa79a;vertical-align:top;line-height:2.5;margin-right:5px}.change{font-size:12px;margin-top:10px}.up{color:#a5dcad}.down{color:#f09978}.badge{font-size:10px;border:1px solid #a7dcb338;padding:6px 10px;border-radius:20px;color:#a9d3ad}.charthead{font-size:10px;color:#8d9e9b;margin-top:28px}.ranges{display:flex;gap:3px}button{font:inherit;cursor:pointer;color:inherit}.ranges button{background:transparent;border:0;padding:6px 8px;font-size:10px;border-radius:5px;color:#879d94}.ranges button[aria-pressed=true]{background:#35493d;color:#b4dfb6}.chart{position:relative;margin-top:15px}.chart svg{width:100%;height:190px;display:block;overflow:visible}.axes{display:flex;justify-content:space-between;color:#789086;font-size:9px;margin-top:8px}.list-title{font-size:10px;letter-spacing:.12em;color:#8fa79a;padding-bottom:20px}.stock{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:12px;background:transparent;padding:15px 12px;margin-bottom:8px}.stock:hover,.stock[aria-pressed=true]{background:#23312e;border-color:#40534a}.stock strong{font-size:13px;letter-spacing:.05em}.stock small{display:block;font-size:10px;margin-top:7px;color:#8da397}.quote{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}.quote span{display:block;font-size:11px;margin-top:6px}.sparks{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#84998f;font-size:9px}.sparks svg{width:105px;height:30px}.bottom{border-top:1px solid #2b3b34;margin-top:23px;padding-top:19px;color:#7d978a;font-size:10px}.bottom strong{color:#c2d2c4;font-weight:normal}.risk{margin:24px 0 0;padding:14px 18px;border:1px solid #394238;border-radius:10px;font-size:10px;color:#aaab8e;line-height:1.6;display:flex;gap:10px}.risk i{width:5px;height:5px;border-radius:50%;background:#b6a477;flex-shrink:0;margin-top:5px}footer{font-size:9px;letter-spacing:.12em;color:#657b70;margin-top:25px;display:flex;justify-content:space-between}@keyframes blink{50%{opacity:.3}}@media(max-width:650px){body{padding:20px}.grid{grid-template-columns:1fr;gap:14px}.panel{padding:22px}h1{font-size:29px}.intro{margin-top:27px}#updated{display:none}.price{font-size:48px}.chart svg{height:145px}.stock{padding:13px 10px;margin-bottom:3px}.sparks{display:none}.list-title{padding-bottom:10px}.risk{font-size:9px}footer{font-size:8px}}
</style></head><body><main><header><div class="brand"><span>M</span> / MERIDIAN</div><div class="live"><i></i>模拟行情 · LOCAL</div></header><div class="intro"><div><div class="eyebrow">A QUIETER VIEW OF THE MARKET</div><h1>看见市场的脉搏。</h1></div><span id="updated"></span></div><div class="grid"><section class="panel"><div class="summary"><div><div class="name" id="name"></div><div class="price"><small>$</small><span id="price"></span></div><div id="change" class="change"></div></div><div class="badge">关注中</div></div><div class="charthead"><span>价格走势 <span id="period"></span></span><div class="ranges"><button data-range="1" aria-pressed="true">1D</button><button data-range="5" aria-pressed="false">1W</button><button data-range="22" aria-pressed="false">1M</button></div></div><div class="chart"><svg id="chart" viewBox="0 0 500 180" aria-label="所选股票模拟价格曲线"></svg><div class="axes"><span id="axis-start">09:30</span><span>12:00</span><span id="axis-end">16:00</span></div></div><div class="bottom"><span>成交量 <strong id="volume"></strong></span><span>日内振幅 <strong id="volatility"></strong></span></div></section><aside class="panel"><div class="list-title">WATCHLIST / 自选</div><div id="stocks"></div><div class="bottom"><span>三支股票</span><strong>每 3 秒刷新</strong></div></aside></div><div class="risk"><i></i><span>演示数据来自本地模拟。价格波动有风险，当前页面不提供交易或投资建议。</span></div><footer><span>GPT-6.1-SOL / FINANCIAL STUDY</span><span>FOLLOW THE SIGNAL.</span></footer></main>
<script>
const $=id=>document.getElementById(id);let selected=0,range=1,seed=6131;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const stocks=[{ticker:'NVDA',name:'NVIDIA Corporation',price:184.27,close:180.54,volume:'32.8M'},{ticker:'AAPL',name:'Apple Inc.',price:242.62,close:245.37,volume:'18.4M'},{ticker:'MSFT',name:'Microsoft Corporation',price:518.43,close:515.91,volume:'12.1M'}];stocks.forEach(s=>{s.history=Array.from({length:60},(_,i)=>s.close+(s.price-s.close)*i/59+Math.sin(i*.42)*.6+(rand()-.5)*.8);s.history[59]=s.price});
function path(values,w=500,h=166){const min=Math.min(...values)-.4,max=Math.max(...values)+.4;return values.map((v,i)=>[i*w/(values.length-1),h-((v-min)/(max-min))*(h-20)]).map((p,i)=>(i?'L':'M')+p.join(',')).join(' ')}
function render(){const s=stocks[selected],diff=s.price-s.close,pct=diff/s.close*100,color=diff>=0?'#a5dcad':'#f09978',values=s.history.map((v,i)=>range===1?v:s.close+(v-s.close)*Math.sqrt(range)+Math.sin(i*.16)*range*.25),p=path(values);$('name').textContent=s.ticker+' / '+s.name;$('price').textContent=s.price.toFixed(2);$('change').className='change '+(diff>=0?'up':'down');$('change').textContent=(diff>=0?'↑ +':'↓ −')+Math.abs(diff).toFixed(2)+' ('+(diff>=0?'+':'−')+Math.abs(pct).toFixed(2)+'%)';$('period').textContent=range===1?'今日':range===5?'本周':'本月';$('chart').innerHTML=`<defs><linearGradient id="area" x2="0" y2="1"><stop stop-color="${color}" stop-opacity=".24"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`+[35,80,125,165].map(y=>`<path d="M0 ${y}H500" stroke="#8fac9630" stroke-dasharray="3 5"/>`).join('')+`<path d="${p}L500 180H0Z" fill="url(#area)"/><path d="${p}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="500" cy="${p.split(',').pop()}" r="4" fill="${color}"/>`;$('volume').textContent=s.volume;$('volatility').textContent=((Math.max(...s.history)-Math.min(...s.history))/s.price*100).toFixed(2)+'%';$('axis-start').textContent=range===1?'09:30':range===5?'周一':'第 1 日';$('axis-end').textContent=range===1?'16:00':range===5?'周五':'第 30 日';$('stocks').innerHTML=stocks.map((a,i)=>{const d=a.price-a.close,per=d/a.close*100;return `<button class="stock" data-stock="${i}" aria-pressed="${selected===i}"><div class="row"><div><strong>${a.ticker}</strong><small>${a.name}</small></div><div class="quote">$${a.price.toFixed(2)}<span class="${d>=0?'up':'down'}">${d>=0?'↑ +':'↓ −'}${Math.abs(per).toFixed(2)}%</span></div></div><div class="sparks"><span>NASDAQ · USD</span><svg viewBox="0 0 100 28"><path d="${path(a.history,100,27)}" fill="none" stroke="${d>=0?'#a5dcad':'#f09978'}" stroke-width="1.2"/></svg></div></button>`}).join('');$('updated').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}
$('stocks').onclick=e=>{const b=e.target.closest('[data-stock]');if(b){selected=+b.dataset.stock;render()}};document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=+b.dataset.range;document.querySelectorAll('[data-range]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});setInterval(()=>{stocks.forEach(s=>{s.price+= (rand()-.48)*.35;s.history.shift();s.history.push(s.price)});render()},3000);render();
</script></body></html>
