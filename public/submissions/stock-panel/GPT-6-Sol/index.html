<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARKET / 行情观察</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b131b;color:#f3f6f5;font-family:Arial,"PingFang SC",sans-serif;display:grid;place-items:center;padding:20px}.board{width:min(100%,930px);border:1px solid #24404a;border-radius:20px;background:#101f29;box-shadow:0 30px 80px #0007;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:25px 30px;border-bottom:1px solid #25404a}.brand{font-weight:800;font-size:22px;letter-spacing:.12em}.brand em{font-style:normal;color:#66d7b1}.tag{font-size:11px;color:#7fa1a9;letter-spacing:.1em}.live{display:inline-block;background:#55d8a8;width:6px;height:6px;border-radius:50%;margin-right:6px;box-shadow:0 0 9px #55d8a8;animation:blink 2s infinite}.layout{display:grid;grid-template-columns:275px 1fr}.list{border-right:1px solid #25404a;padding:12px}.stock{display:block;width:100%;border:1px solid transparent;border-radius:11px;background:transparent;color:inherit;text-align:left;padding:17px;cursor:pointer;margin:5px 0}.stock.active{background:#1a3039;border-color:#31535b}.stock:hover{background:#1a3039}.stock-top,.stock-bottom{display:flex;justify-content:space-between;align-items:center}.symbol{font-size:17px;font-weight:800;letter-spacing:.06em}.name{font-size:11px;color:#8caaaf;margin-top:5px}.mini{width:85px;height:30px}.stock-bottom{margin-top:8px}.price{font-variant-numeric:tabular-nums;font-size:18px;font-weight:700}.change{font-size:12px;font-weight:700}.up{color:#68d8aa}.down{color:#ff8e92}.detail{padding:29px 34px 20px;min-width:0}.detail-title{font-size:13px;color:#8daeb5;letter-spacing:.15em}.hero{display:flex;align-items:baseline;gap:15px;margin-top:12px}.hero strong{font-size:clamp(37px,6vw,60px);font-variant-numeric:tabular-nums;letter-spacing:-.04em}.hero span{font-size:17px}.period{display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:#86a4ae;font-size:11px}.period .chip{border:1px solid #346075;color:#b5d3d8;border-radius:20px;padding:7px 10px}.chart{width:100%;height:215px;margin-top:8px;overflow:visible}.grid line{stroke:#29444c;stroke-dasharray:3 6}.chart-labels{display:flex;justify-content:space-between;color:#6e929d;font-size:10px;letter-spacing:.06em}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #25404a;margin-top:28px;padding-top:20px;gap:10px}.metric small{display:block;color:#7897a1;margin-bottom:7px}.metric strong{font-size:15px}footer{padding:15px 30px;background:#0d1a22;border-top:1px solid #24404a;color:#819da7;font-size:11px}.flash{animation:flash .45s ease-out}@keyframes blink{50%{opacity:.2}}@keyframes flash{from{background:#335d60}to{background:transparent}}@media(max-width:680px){body{padding:8px}.layout{display:block}.list{border-right:0;border-bottom:1px solid #25404a;display:flex;overflow-x:auto;gap:7px}.stock{min-width:160px;padding:11px}.mini{display:none}.stock-bottom{display:block}.detail{padding:20px 18px}.chart{height:170px}header{padding:17px}footer{padding:15px}}
</style></head><body><main class="board"><header><div class="brand">MARK<em>ET</em> / 观察</div><div class="tag"><span class="live"></span>本地模拟行情</div></header><div class="layout"><nav class="list" id="list" aria-label="选择股票"></nav><section class="detail"><div class="detail-title" id="title"></div><div class="hero"><strong id="heroPrice"></strong><span id="heroChange"></span></div><div class="period"><span>日内趋势 · 模拟刷新</span><span class="chip" id="time"></span></div><svg class="chart" id="chart" viewBox="0 0 600 215" preserveAspectRatio="none" role="img" aria-label="价格趋势图"><g class="grid"><line x1="0" y1="30" x2="600" y2="30"/><line x1="0" y1="107" x2="600" y2="107"/><line x1="0" y1="185" x2="600" y2="185"/></g><path id="area" opacity=".12"/><path id="line" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle id="point" r="5"/></svg><div class="chart-labels"><span>09:30</span><span>11:00</span><span>13:00</span><span>15:00</span></div><div class="metrics"><div class="metric"><small>今日最高</small><strong id="high"></strong></div><div class="metric"><small>今日最低</small><strong id="low"></strong></div><div class="metric"><small>波动区间</small><strong id="range"></strong></div></div></section></div><footer>演示数据仅用于界面测评，不构成投资建议。每 3 秒生成一笔模拟报价。</footer></main><script>
const stocks=[{sym:"NOVA",name:"北辰科技",base:168.4,price:174.28,trend:1,values:[155,157,156,160,159,162,161,165,164,166,168,167,170,169,172,174]},{sym:"RIVR",name:"河川能源",base:87.6,price:84.21,trend:-1,values:[90,89,91,88,89,87,88,86,87,85,86,84,85,84,83,84]},{sym:"ORBT",name:"轨道工业",base:302.3,price:310.74,trend:1,values:[298,300,299,302,301,303,305,304,306,307,306,309,308,311,310,311]}];
let selected=0;const $=s=>document.querySelector(s),fmt=n=>n.toFixed(2);
function coordinates(values,w=600,h=215){const lo=Math.min(...values)-2,hi=Math.max(...values)+2,pad=h<50?4:18;return values.map((v,i)=>[i*w/(values.length-1),h-pad-(v-lo)/(hi-lo)*(h-2*pad)])}
function path(points){return "M"+points.map(p=>p.map(x=>x.toFixed(1)).join(",")).join(" L")}
function render(){
 $("#list").innerHTML=stocks.map((s,i)=>{const delta=s.price-s.base,pct=delta/s.base*100,pts=coordinates(s.values,85,30);return '<button class="stock '+(i===selected?"active":"")+'" data-i="'+i+'"><div class="stock-top"><div><div class="symbol">'+s.sym+'</div><div class="name">'+s.name+'</div></div><svg class="mini" viewBox="0 0 85 30"><path d="'+path(pts)+'" fill="none" stroke="'+(delta>=0?"#68d8aa":"#ff8e92")+'" stroke-width="2"/></svg></div><div class="stock-bottom"><span class="price">¥'+fmt(s.price)+'</span><span class="change '+(delta>=0?"up":"down")+'">'+(delta>=0?"+":"")+pct.toFixed(2)+'%</span></div></button>'}).join("");
 const s=stocks[selected],delta=s.price-s.base,positive=delta>=0,color=positive?"#68d8aa":"#ff8e92",pts=coordinates(s.values);
 $("#title").textContent=s.name+" / "+s.sym;$("#heroPrice").textContent="¥"+fmt(s.price);$("#heroChange").textContent=(positive?"+":"")+fmt(delta)+" ("+(positive?"+":"")+(delta/s.base*100).toFixed(2)+"%)";$("#heroChange").className=positive?"up":"down";
 $("#line").setAttribute("d",path(pts));$("#line").setAttribute("stroke",color);$("#area").setAttribute("d",path(pts)+" L600,215 L0,215 Z");$("#area").setAttribute("fill",color);$("#point").setAttribute("cx",pts.at(-1)[0]);$("#point").setAttribute("cy",pts.at(-1)[1]);$("#point").setAttribute("fill",color);
 $("#high").textContent="¥"+fmt(Math.max(...s.values));$("#low").textContent="¥"+fmt(Math.min(...s.values));$("#range").textContent=fmt(Math.max(...s.values)-Math.min(...s.values));$("#time").textContent=new Date().toLocaleTimeString("zh-CN",{hour12:false});
}
$("#list").onclick=e=>{const b=e.target.closest("button");if(b){selected=+b.dataset.i;render()}};
setInterval(()=>{stocks.forEach(s=>{s.price=Math.max(1,s.price+(Math.random()-.47)*.7);s.values.shift();s.values.push(s.price)});render();$("#heroPrice").classList.remove("flash");void $("#heroPrice").offsetWidth;$("#heroPrice").classList.add("flash")},3000);render();
</script></body></html>
