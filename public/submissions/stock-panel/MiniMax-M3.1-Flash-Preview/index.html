<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>观澜行情 · 实时股票面板</title>
<style>
:root{--bg:#070a10;--pn:#0d131c;--ln:#1c2533;--tx:#e9eff8;--dm:#7f8fa6;--up:#ff4f63;--dn:#10d6a0;--ac:#ffb020}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1100px 620px at 12% -14%,#16273d 0%,#070a10 62%) fixed,var(--bg);color:var(--tx);font:14px/1.45 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:1060px;margin:0 auto;padding:18px 15px 30px}
.card{background:linear-gradient(180deg,#111925,#0b111a);border:1px solid var(--ln);border-radius:15px}
.top{display:flex;align-items:center;gap:11px;padding:11px 14px}
.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--ac),#ff6a3d);display:grid;place-items:center;color:#23170a;font-weight:800;font-size:16px}
h1{font-size:15px;letter-spacing:.5px}
h1 span{display:block;font-size:10.5px;color:var(--dm);letter-spacing:1.8px;font-weight:500;margin-top:1px}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dm)}.live b{color:var(--tx);font-size:12.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dn);box-shadow:0 0 0 0 rgba(16,214,160,.55);animation:bp 2s infinite}
@keyframes bp{70%{box-shadow:0 0 0 9px rgba(16,214,160,0)}100%{box-shadow:0 0 0 0 rgba(16,214,160,0)}}
.grid{display:grid;grid-template-columns:288px 1fr;gap:14px;margin-top:14px}
.wl{padding:9px}
.wt{display:flex;justify-content:space-between;padding:5px 10px 8px;font-size:10.5px;color:var(--dm);letter-spacing:1.6px}
.row{display:grid;grid-template-columns:1fr 54px 68px;gap:7px;align-items:center;padding:9px 10px;border-radius:11px;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s}
.row:hover{background:#161e2b}
.row.sel{border-color:rgba(255,176,32,.4);background:linear-gradient(90deg,rgba(255,176,32,.14),rgba(255,176,32,0))}
.nm{font-size:13.5px;font-weight:600}
.code{font-size:10.5px;color:var(--dm);letter-spacing:.6px;margin-top:1px}
.sp{width:54px;height:22px;opacity:.9}
.px{font-size:14px;font-weight:700;text-align:right;border-radius:5px;padding:1px 3px}
.chg{font-size:11px;font-weight:700;text-align:right;margin-top:3px;padding:1px 4px;border-radius:5px;border:1px solid}
.chg.u{color:var(--up);background:rgba(255,79,99,.12);border-color:rgba(255,79,99,.32)}
.chg.d{color:var(--dn);background:rgba(16,214,160,.12);border-color:rgba(16,214,160,.32)}
.risk{margin:9px 4px 3px;padding:9px 11px;border:1px solid rgba(255,176,32,.32);background:rgba(255,176,32,.07);border-radius:11px;font-size:12px;color:#ffd8a0;line-height:1.5}
.risk b{color:#fff}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 16px 6px}.hq{text-align:right}
.last{font-size:38px;font-weight:700;line-height:1.05;letter-spacing:-.5px;border-radius:7px;padding:0 4px}
.u{color:var(--up)}.d{color:var(--dn)}
.pill{display:inline-flex;gap:8px;align-items:center;margin-top:6px;padding:3px 10px;border-radius:8px;font-size:13px;font-weight:700;border:1px solid}
.pill.u{background:rgba(255,79,99,.13);border-color:rgba(255,79,99,.34)}
.pill.d{background:rgba(16,214,160,.13);border-color:rgba(16,214,160,.34)}
@keyframes fu{from{background:rgba(255,79,99,.3)}to{background:rgba(255,79,99,0)}}
@keyframes fd{from{background:rgba(16,214,160,.3)}to{background:rgba(16,214,160,0)}}
.fu{animation:fu .6s ease-out}.fd{animation:fd .6s ease-out}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 16px 2px;flex-wrap:wrap}
.seg{display:flex;gap:4px}
.seg button{background:#141c28;border:1px solid var(--ln);color:var(--dm);font:inherit;font-size:12px;padding:4px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:rgba(255,176,32,.16);border-color:rgba(255,176,32,.45);color:var(--ac);font-weight:600}
.seg button.off{color:var(--up);border-color:rgba(255,79,99,.4)}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dm)}
.lg i{width:12px;height:2.5px;border-radius:2px;display:inline-block}
.lg .s1{background:var(--up)}.lg .s2{background:#ffc94d;height:0;border-top:2px dashed #ffc94d}.lg .s3{background:#63788f;height:9px;width:5px;border-radius:1px}
.cw{position:relative;padding:2px 8px 0}
.cw svg{width:100%;height:252px;display:block}
.tip{position:absolute;transform:translate(-50%,-118%);background:#0a1018;border:1px solid #2b3a4e;border-radius:8px;padding:5px 9px;font-size:11.5px;white-space:nowrap;opacity:0;transition:opacity .12s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.tip b{color:#fff}
.rg{padding:4px 18px 2px}
.rl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dm)}
.rl b{color:var(--tx);margin-left:4px}
.track{position:relative;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--dn),#2c3a4d 50%,var(--up));margin:8px 0 3px}
.mk{position:absolute;top:-4px;width:3px;height:14px;border-radius:2px;background:#fff;box-shadow:0 0 9px #fff;transition:left .5s ease}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin:12px 16px 16px}
.st{background:#0e151f;padding:8px 11px}.st em{display:block;font-style:normal;font-size:10.5px;color:var(--dm)}.st b{font-size:13.5px;font-weight:600}
footer{padding:12px 4px 0;font-size:11px;color:#5d6d82;text-align:center}
@media(max-width:800px){.grid{grid-template-columns:1fr}.last{font-size:31px}.wrap{padding:12px 11px 24px}.stats{margin:10px 12px 12px}.bar,.hero,.rg{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="card top">
    <div class="mark">澜</div>
    <h1>观澜行情<span>GUANLAN MARKET · 本地模拟数据</span></h1>
    <div class="live"><i class="dot"></i><span id="st">交易中 · 沪深A股</span><b class="n" id="clk"></b><b class="n" id="cnt"></b></div>
  </header>
  <div class="grid">
    <div class="card wl">
      <div class="wt"><span>自选列表 WATCHLIST</span><span>点击切换</span></div>
      <div id="rows"></div>
      <div class="risk" id="risk">⚠ 波动提示：初始化行情…</div>
    </div>
    <div class="card">
      <div class="hero">
        <div><div class="nm" id="hN">—</div><div class="code" id="hC">—</div></div>
        <div class="hq"><div class="last n" id="hL">—</div><div class="pill u n" id="hP">—</div></div>
      </div>
      <div class="bar">
        <div class="seg" id="seg"><button class="on" data-i="0">分时</button><button data-i="1">5日</button><button data-i="2">月K</button><button id="tg">暂停</button></div>
        <div class="lg"><i class="s1"></i>最新价<i class="s2"></i>MA8<i class="s3"></i>成交量</div>
      </div>
      <div class="cw">
        <svg id="ch">
          <defs>
            <linearGradient id="gu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4f63" stop-opacity=".42"/><stop offset="1" stop-color="#ff4f63" stop-opacity="0"/></linearGradient>
            <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10d6a0" stop-opacity=".38"/><stop offset="1" stop-color="#10d6a0" stop-opacity="0"/></linearGradient>
          </defs>
          <g id="gl"></g><g id="vb"></g>
          <line id="bl" y1="0" y2="156" stroke="#ffb020" stroke-dasharray="4 4" opacity=".6"/>
          <text id="blt" font-size="10.5" fill="#ffb020"></text>
          <path id="ar"/><path id="ma" fill="none" stroke="#ffc94d" stroke-width="1.2" stroke-dasharray="4 3" opacity=".95"/>
          <path id="ln" fill="none" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
          <g id="cxg" style="display:none"><line id="cxl" y1="10" y2="224" stroke="#8fa3bd" stroke-dasharray="3 3"/><circle id="cxc" r="3.6" fill="#0b1119" stroke="#fff" stroke-width="1.6"/><text id="cxt" font-size="10.5" fill="#dceaf8" stroke="#0b1119" stroke-width="3" paint-order="stroke"></text></g>
          <circle id="pp" r="3.4" opacity=".5"><animate attributeName="r" values="3.4;13" dur="1.7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0" dur="1.7s" repeatCount="indefinite"/></circle>
          <circle id="pt" r="4" fill="#fff" stroke-width="0"/>
        </svg>
        <div class="tip n" id="tip"></div>
      </div>
      <div class="rg">
        <div class="rl"><span>日内最低 <b id="rlo">—</b></span><span>振幅 <b id="ramp">—</b></span><span>日内最高 <b id="rhi">—</b></span></div>
        <div class="track"><i class="mk" id="rmk"></i></div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <footer>数据由本地随机游走模拟生成，不代表真实行情 · 颜色约定：红涨 / 绿跌（A 股习惯） · 本页不构成任何投资建议</footer>
</div>
<script>
const q=s=>document.querySelector(s),U='#ff4f63',D='#10d6a0',PY0=14,PY1=156,VT=176,VB=224,H=252;
let sd=20260908;const rnd=()=>((sd=(sd*1103515245+12345)&0x7fffffff)/0x7fffffff);
const BF=v=>v>=1e8?(v/1e8).toFixed(2)+'亿':v>=1e4?(v/1e4).toFixed(2)+'万':v.toFixed(0);
const TFS=[{k:78,s:.30,d:'昨收'},{k:64,s:1.45,d:'5日前收盘'},{k:30,s:2.10,d:'上月收盘'}];
const B=[{s:'600519',n:'贵州茅台',ex:'SH',p:1663.2,v:.34,rot:.31,vol:2.86e4},
{s:'300750',n:'宁德时代',ex:'SZ',p:186.94,v:.78,rot:1.24,vol:8.42e4},
{s:'601318',n:'中国平安',ex:'SH',p:44.63,v:.50,rot:.62,vol:1.12e5},
{s:'000001',n:'平安银行',ex:'SZ',p:11.02,v:.64,rot:1.06,vol:9.63e4}];
let sel=0,W=700,PR=56,disp=null,tk=0,run=true;
const cur=()=>B[sel];
q('#stats').innerHTML=['今开','最高','最低','','成交量','成交额','换手率','振幅'].map((k,i)=>`<div class="st"><em id="k${i}">${k}</em><b class="n" id="s${i}">—</b></div>`).join('');
function rebuild(o){const c=TFS[o.t];let p=o.p*(1+(rnd()-.5)*c.s*o.v*.05),a=[p];
 for(let i=1;i<c.k;i++){p*=1+c.s*o.v*.011*(rnd()-.5);a.push(p)}
 o.d=a;o.pc=a[0];o.dly=c.d;o.vs=a.map(()=>o.v*2e4*(.35+rnd()));o.dhi=Math.max.apply(null,a);o.dlo=Math.min.apply(null,a);o.amp=(o.dhi-o.dlo)/o.pc*100}
q('#rows').innerHTML=B.map((o,i)=>`<div class="row${i?'':' sel'}" data-i="${i}"><div><div class="nm">${o.n}</div><div class="code">${o.ex} ${o.s}</div></div><svg class="sp" viewBox="0 0 54 22" preserveAspectRatio="none"><path fill="none" stroke-width="1.4"/></svg><div><div class="px n"></div><div class="chg n"></div></div></div>`).join('');
B.forEach(o=>{o.t=0;rebuild(o);o.p=o.d[o.d.length-1]});
const RN=[...document.querySelectorAll('.row')].map(r=>({p:r.querySelector('.px'),c:r.querySelector('.chg'),s:r.querySelector('path')}));
function spark(o){const s=o.d,lo=Math.min.apply(null,s),d=(Math.max.apply(null,s)-lo)||1;
 return s.map((v,i)=>(i?'L':'M')+(i/(s.length-1)*54).toFixed(1)+' '+(19-(v-lo)/d*16).toFixed(1)).join('')}
function flash(e,u){e.classList.remove('fu','fd');void e.offsetWidth;e.classList.add(u?'fu':'fd')}
function rowsTick(){B.forEach((o,i)=>{const c=o.p-o.pc,p=c/o.pc*100,u=c>=0,r=RN[i];
 r.p.textContent=o.p.toFixed(2);flash(r.p,u);r.p.classList.toggle('u',u);
 r.c.className='chg n '+(u?'u':'d');r.c.textContent=(u?'▲ +':'▼ ')+c.toFixed(2)+' ('+(u?'+':'')+p.toFixed(2)+'%)';
 const up=o.p>=o.pc;r.s.setAttribute('d',spark(o));r.s.setAttribute('stroke',up?U:D)})}
function hero(o){const c=o.p-o.pc,p=c/o.pc*100,u=c>=0,pl=q('#hP');
 q('#hN').textContent=o.n;q('#hC').textContent=o.ex+' '+o.s+' · 主板/创业板 · 连续竞价';
 pl.className='pill n '+(u?'u':'d');pl.textContent=(u?'▲ +':'▼ ')+c.toFixed(2)+'　'+(u?'+':'')+p.toFixed(2)+'%';
 const L=q('#hL');L.classList.toggle('u',u);L.classList.toggle('d',!u);flash(L,u);
 const S=[o.d[0].toFixed(2),o.dhi.toFixed(2),o.dlo.toFixed(2),o.pc.toFixed(2),BF(o.vol)+'手',BF(o.vol*100*o.p)+'元',o.rot.toFixed(2)+'%',o.amp.toFixed(2)+'%'];
 S.forEach((v,i)=>q('#s'+i).textContent=v);q('#k3').textContent=o.dly;
 q('#rlo').textContent=o.dlo.toFixed(2);q('#rhi').textContent=o.dhi.toFixed(2);q('#ramp').textContent=o.amp.toFixed(2)+'%';
 q('#rmk').style.left=(100*(o.p-o.dlo)/((o.dhi-o.dlo)||1))+'%'}
function risk(o){const a=o.amp,lv=a>2.2?['高',U,'振幅已达 '+a.toFixed(2)+'%，盘中波动放大，警惕追高与滑点']:
 a>1.2?['中','#ffb020','振幅 '+a.toFixed(2)+'%，多空拉锯中，留意量能与分时背离']:
 ['低',D,'振幅仅 '+a.toFixed(2)+'%，波动平稳，趋势延续概率较高'];
 const e=q('#risk');e.style.borderColor=lv[1]+'55';e.innerHTML=`⚠ <b>${lv[0]}波动</b> · ${o.n} ${lv[2]}`}
function sc(o,s){let lo=Math.min(o.pc,Math.min.apply(null,s)),hi=Math.max(o.pc,Math.max.apply(null,s)),pd=(hi-lo)*.16||1;return[lo-pd,hi+pd]}
function draw(){const o=cur(),s=o.d,n=s.length,u=o.p>=o.pc,c=u?U:D,PW=W-PR;
 const[lo,hi]=sc(o,s);
 const X=i=>(i/(n-1)*PW).toFixed(1),Y=v=>PY1-(v-lo)/(hi-lo)*(PY1-PY0);
 let g='';for(let k=0;k<4;k++){const y=(PY0+k*(PY1-PY0)/3).toFixed(1),v=hi-(hi-lo)*k/3;
  g+=`<line x1="0" y1="${y}" x2="${PW}" y2="${y}" stroke="#1c2533" stroke-dasharray="3 4"/><text x="${PW+7}" y="${+y+4}" fill="#6d7d93" font-size="10.5">${v.toFixed(2)}</text>`}
 for(let k=0;k<4;k++){const i=Math.round(k*(n-1)/3);g+=`<text x="${X(i)}" y="${H-6}" fill="#5d6d82" font-size="10" text-anchor="${k===3?'end':k?'middle':'start'}">${tlab(o,i,n)}</text>`}
 q('#gl').innerHTML=g;
 const line=s.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v).toFixed(1)).join('');
 q('#ln').setAttribute('d',line);q('#ln').setAttribute('stroke',c);
 q('#ar').setAttribute('d',line+`L${X(n-1)} ${PY1}L0 ${PY1}Z`);q('#ar').setAttribute('fill',`url(#${u?'gu':'gd'})`);
 let mp='';for(let i=7;i<n;i++){let a=0;for(let j=i-7;j<=i;j++)a+=s[j];mp+=(i===7?'M':'L')+X(i)+' '+(Y(a/8)).toFixed(1)}
 q('#ma').setAttribute('d',mp);
 const mv=Math.max.apply(null,o.vs)||1,bw=PW/n;let b='';
 o.vs.forEach((v,i)=>{const h=Math.max(1,v/mv*(VB-VT));b+=`<rect x="${(i/(n-1)*PW-bw/2).toFixed(1)}" y="${(VB-h).toFixed(1)}" width="${Math.max(.8,bw-.7).toFixed(1)}" height="${h.toFixed(1)}" rx=".8" fill="${c}" opacity="${i===n-1?1:.42}"/>`});
 q('#vb').innerHTML=b;
 q('#bl').setAttribute('x1',0);q('#bl').setAttribute('x2',PW);q('#bl').setAttribute('y1',Y(o.pc));q('#bl').setAttribute('y2',Y(o.pc));
 q('#blt').setAttribute('x',PW+7);q('#blt').setAttribute('y',Y(o.pc)-4);q('#blt').textContent=o.dly;
 q('#pt').setAttribute('cx',X(n-1));q('#pt').setAttribute('cy',Y(o.p));q('#pt').setAttribute('fill',c);q('#pt').setAttribute('stroke','#fff');
 q('#pp').setAttribute('cx',X(n-1));q('#pp').setAttribute('cy',Y(o.p));q('#pp').setAttribute('fill',c);
 q('#cxt').setAttribute('x',PW+7)}
function tlab(o,i,n){if(o.t)return o.dly.slice(0,2)+'·D'+(i+1);
 let m=570+Math.round(i*240/(n-1));if(m>690)m+=90;
 return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function fit(){W=Math.max(260,q('#ch').clientWidth||700);PR=W<430?44:56;q('#ch').setAttribute('viewBox',`0 0 ${W} ${H}`);draw()}
function tick(){tk++;q('#cnt').textContent='· '+tk+' 次刷新';
 B.forEach(o=>{o.p*=1+o.v*.0011*(rnd()*2-1);o.d.push(o.p);if(o.d.length>TFS[o.t].k)o.d.shift();
  o.vs.push(o.v*2e4*(.5+rnd()*1.5));if(o.vs.length>o.d.length)o.vs.shift();
  o.vol+=Math.round(o.v*22*(.3+rnd()*2));o.rot+=(rnd()-.5)*.004;
  o.dhi=Math.max(o.dhi,o.p);o.dlo=Math.min(o.dlo,o.p);o.amp=(o.dhi-o.dlo)/o.pc*100});
 rowsTick();hero(cur());draw();risk(cur())}
function loop(){const o=cur();if(disp===null)disp=o.p;disp+=(o.p-disp)*.15;
 const L=q('#hL');L.textContent=disp.toFixed(2);requestAnimationFrame(loop)}
q('#rows').addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;
 sel=+r.dataset.i;[...q('#rows').children].forEach(x=>x.classList.toggle('sel',x===r));
 disp=null;hero(cur());draw();risk(cur())});
q('#seg').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;
 [...e.currentTarget.querySelectorAll('button[data-i]')].forEach(x=>x.classList.toggle('on',x===b));
 cur().t=+b.dataset.i;rebuild(cur());cur().p=cur().d[cur().d.length-1];disp=null;hero(cur());draw();risk(cur());rowsTick()});
q('#tg').addEventListener('click',e=>{run=!run;e.target.textContent=run?'暂停':'已暂停';e.target.classList.toggle('off',!run)});
setInterval(()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');q('#clk').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())},1000);
addEventListener('resize',fit);
q('#ch').addEventListener('pointermove',e=>{const o=cur(),s=o.d,n=s.length,r=q('#ch').getBoundingClientRect(),PW=W-PR;
 const x=(e.clientX-r.left)/r.width*W;const g=q('#cxg'),t=q('#tip');
 if(x>PW-1){g.style.display='none';t.style.opacity=0;return}
 const i=Math.max(0,Math.min(n-1,Math.round(x/PW*(n-1)))),[lo,hi]=sc(o,s);
 const X=i=>(i/(n-1)*PW).toFixed(1),Y=v=>PY1-(v-lo)/(hi-lo)*(PY1-PY0);
 g.style.display='';q('#cxl').setAttribute('x1',X(i));q('#cxl').setAttribute('x2',X(i));
 q('#cxc').setAttribute('cx',X(i));q('#cxc').setAttribute('cy',Y(s[i]));q('#cxt').setAttribute('y',Y(s[i])-6);
 const c=s[i]-o.pc;t.style.opacity=1;t.style.left=X(i)/W*100+'%';t.style.top=Y(s[i])/H*100+'%';
 t.innerHTML=`<b>${o.n} ${tlab(o,i,n)}</b><br>${s[i].toFixed(2)}　<span style="color:${c>=0?U:D}">${c>=0?'▲ +':'▼ '}${c.toFixed(2)} (${(c/o.pc*100>=0?'+':'')+(c/o.pc*100).toFixed(2)}%)</span>`});
q('#ch').addEventListener('pointerleave',()=>{q('#cxg').style.display='none';q('#tip').style.opacity=0});
fit();rowsTick();hero(cur());draw();risk(cur());loop();tick();
setInterval(()=>{if(run)tick()},1000);
</script>
</body>
</html>
