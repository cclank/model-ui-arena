<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Board · 股票行情面板</title>
<style>
  :root{--bg:#0a0d14;--panel:#11161f;--panel2:#171d29;--line:rgba(255,255,255,.07);--ink:#eef2f8;--muted:#8792a6;--accent:#5b9dff}
  [data-conv="cn"]{--up:#ff4d5e;--dn:#22c993}[data-conv="us"]{--up:#22c993;--dn:#ff4d5e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(80% 40% at 50% 0%,#182238,var(--bg) 70%);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif;display:grid;place-items:start center;padding:14px}
  .panel{width:min(100%,460px);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px;display:grid;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:800;letter-spacing:.02em}
  .sub{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .live{width:7px;height:7px;border-radius:50%;background:var(--dn);box-shadow:0 0 10px var(--dn);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}
  .pill{border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 11px/1 inherit;padding:8px 11px;border-radius:999px;cursor:pointer;transition:.2s}
  .pill:hover{border-color:var(--accent)}.pill.on{background:var(--accent);color:#06101f;border-color:var(--accent)}
  .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .strip div{background:var(--panel2);border-radius:12px;padding:8px 10px;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.06em}
  .strip b{display:block;font-size:15px;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
  .detail{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px;display:grid;gap:8px}
  .dh{display:flex;justify-content:space-between;align-items:flex-start}
  .dh b{font-size:16px}.dh span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .dp{text-align:right}.dp b{font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .chip{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
  .u{color:var(--up)}.d{color:var(--dn)}.chip.u{background:color-mix(in srgb,var(--up) 18%,transparent)}.chip.d{background:color-mix(in srgb,var(--dn) 18%,transparent)}
  #chart{width:100%;height:150px;display:block}
  .dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:10.5px;color:var(--muted)}
  .dstats b{display:block;color:var(--ink);font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:2px}
  .alert{display:none;font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:10px;background:rgba(255,176,32,.12);color:#ffb020;border:1px solid rgba(255,176,32,.3)}
  .alert.show{display:block}
  .list{display:grid;gap:6px}
  .row{display:grid;grid-template-columns:minmax(0,1.2fr) 82px minmax(0,1.1fr);align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:var(--panel2);border:1px solid transparent;cursor:pointer;transition:border-color .2s,transform .15s}
  .row:hover{border-color:var(--line)}.row.sel{border-color:var(--accent)}
  .nm b{display:block;font-size:13.5px}.nm span{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .nm i{font-style:normal;font-size:9.5px;color:#ffb020;margin-left:4px;font-weight:800}
  .spark{width:82px;height:30px}
  .px{text-align:right;font-variant-numeric:tabular-nums}.px b{display:block;font-size:14.5px;transition:color .3s}
  .px span{font-size:11px;font-weight:700}
  .px b.fu{animation:fu .6s}.px b.fd{animation:fd .6s}
  @keyframes fu{0%{color:var(--up);text-shadow:0 0 12px var(--up)}}@keyframes fd{0%{color:var(--dn);text-shadow:0 0 12px var(--dn)}}
  footer{font-size:10.5px;color:var(--muted);line-height:1.5;padding:0 2px}
  @media (max-width:400px){.row{grid-template-columns:minmax(0,1.1fr) 64px minmax(0,1.1fr);gap:6px}.spark{width:64px}}
</style>
</head>
<body data-conv="cn">
<main class="panel">
  <header>
    <div><h1>行情看板 · Quote Board</h1><div class="sub"><i class="live"></i><span id="status">模拟实时推送 · 每 0.8s 刷新</span></div></div>
    <div><button class="pill on" id="conv">红涨绿跌</button> <button class="pill" id="sort">按涨跌排序</button></div>
  </header>
  <section class="strip"><div>上涨 / 下跌<b id="ud">0 / 0</b></div><div>平均涨跌幅<b id="avg">0.00%</b></div><div>最新推送<b id="tick">--:--:--</b></div></section>
  <section class="detail">
    <div class="dh"><div><b id="dn"></b><span id="dc"></span></div><div class="dp"><b id="dp"></b><div><span class="chip" id="dchg"></span></div></div></div>
    <svg id="chart"></svg>
    <div class="dstats"><div>今开<b id="dopen"></b></div><div>最高<b id="dhi"></b></div><div>最低<b id="dlo"></b></div><div>振幅<b id="damp"></b></div></div>
    <div class="alert" id="alert"></div>
  </section>
  <section class="list" id="list"></section>
  <footer>风险提示：以上为本地随机游走生成的模拟行情，不构成任何投资建议。市场有风险，投资需谨慎；涨跌幅超过 ±3% 或振幅超过 4% 时面板会给出波动提示。</footer>
</main>
<script>
  const $ = (i) => document.getElementById(i), NS = "http://www.w3.org/2000/svg";
  const STOCKS = [
    { n: "贵州茅台", c: "600519.SH", p: 1712.5, v: .0016 }, { n: "宁德时代", c: "300750.SZ", p: 246.8, v: .003 }, { n: "腾讯控股", c: "00700.HK", p: 398.6, v: .0022 },
    { n: "比亚迪", c: "002594.SZ", p: 288.3, v: .0034 }, { n: "中芯国际", c: "688981.SH", p: 96.4, v: .0045 }, { n: "阿里巴巴", c: "09988.HK", p: 112.9, v: .0028 }
  ];
  const gauss = () => Math.random() + Math.random() + Math.random() - 1.5, f2 = (x) => x.toFixed(2), pct = (s) => (s.p - s.o) / s.o * 100;
  const sign = (x) => (x > 0 ? "+" : x < 0 ? "−" : "") + f2(Math.abs(x)), arrow = (x) => x > 0 ? "▲" : x < 0 ? "▼" : "•", cls = (x) => x > 0 ? "u" : x < 0 ? "d" : "";
  STOCKS.forEach((s) => { s.o = s.p; s.h = []; for (let i = 0; i < 60; i++) { step(s); } });       // 用随机游走生成开盘以来的 60 个历史点
  function step(s) { const r = gauss() * s.v * (1 + Math.abs(pct(s)) * .15) - (s.p - s.o) / s.o * .02; s.p = Math.max(.01, +(s.p * (1 + r)).toFixed(2)); s.h.push(s.p); if (s.h.length > 60) s.h.shift(); }
  let sel = 0, sorted = false;
  const rows = STOCKS.map((s, i) => {
    const el = document.createElement("div"); el.className = "row"; el.dataset.i = i;
    el.innerHTML = `<div class="nm"><b>${s.n}<i></i></b><span>${s.c}</span></div><svg class="spark" viewBox="0 0 82 30" preserveAspectRatio="none"><polyline fill="none" stroke-width="1.6" stroke-linejoin="round"/></svg><div class="px"><b></b><span></span></div>`;
    el.onclick = () => { sel = i; render(); }; return el;
  });
  function render() {
    const order = [...STOCKS.keys()].sort((a, b) => sorted ? pct(STOCKS[b]) - pct(STOCKS[a]) : a - b), up = STOCKS.filter((s) => s.p > s.o).length;
    order.forEach((i) => { const s = STOCKS[i], el = rows[i], c = pct(s), k = cls(c), min = Math.min(...s.h), max = Math.max(...s.h);
      el.classList.toggle("sel", i === sel); el.querySelector(".nm i").textContent = Math.abs(c) >= 3 ? "波动" : "";
      const pl = el.querySelector("polyline"); pl.setAttribute("points", s.h.map((v, j) => `${j / 59 * 82},${28 - (v - min) / (max - min || 1) * 26 + 1}`).join(" ")); pl.setAttribute("stroke", `var(--${k === "d" ? "dn" : "up"})`);
      const b = el.querySelector(".px b"); if (b.textContent && +b.textContent !== s.p) { b.classList.remove("fu", "fd"); void b.offsetWidth; b.classList.add(s.p > +b.textContent ? "fu" : "fd"); }
      b.textContent = f2(s.p); const sp = el.querySelector(".px span"); sp.className = k; sp.textContent = `${arrow(c)} ${sign(s.p - s.o)}  ${sign(c)}%`; $("list").appendChild(el); });
    $("ud").innerHTML = `<span class="u">${up}</span> / <span class="d">${STOCKS.length - up}</span>`;
    const avg = STOCKS.reduce((a, s) => a + pct(s), 0) / STOCKS.length; $("avg").textContent = sign(avg) + "%"; $("avg").className = cls(avg);
    $("tick").textContent = new Date().toTimeString().slice(0, 8); detail(STOCKS[sel]);
  }
  function detail(s) {
    const c = pct(s), k = cls(c), hi = Math.max(...s.h), lo = Math.min(...s.h), amp = (hi - lo) / s.o * 100;
    $("dn").textContent = s.n; $("dc").textContent = s.c + " · 60 tick"; $("dp").textContent = f2(s.p); $("dp").className = k;
    $("dchg").textContent = `${arrow(c)} ${sign(s.p - s.o)} (${sign(c)}%)`; $("dchg").className = "chip " + k;
    $("dopen").textContent = f2(s.o); $("dhi").textContent = f2(hi); $("dhi").className = "u"; $("dlo").textContent = f2(lo); $("dlo").className = "d"; $("damp").textContent = f2(amp) + "%";
    const warn = Math.abs(c) >= 3 ? `⚠ ${s.n} 涨跌幅已达 ${sign(c)}%，波动剧烈，请注意风险` : amp >= 4 ? `⚠ ${s.n} 振幅 ${f2(amp)}%，盘中波动偏大` : "";
    $("alert").textContent = warn; $("alert").classList.toggle("show", !!warn);
    const svg = $("chart"), W = svg.clientWidth || 400, H = 150, top = 14, bot = 34, x = (i) => 8 + i / 59 * (W - 60), y = (v) => top + (hi - v) / (hi - lo || 1) * (H - top - bot);
    const line = s.h.map((v, i) => `${x(i)},${y(v)}`).join(" "), col = k === "d" ? "var(--dn)" : "var(--up)";
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = `<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      ${[0, .5, 1].map((t) => `<line x1="8" x2="${W - 52}" y1="${top + t * (H - top - bot)}" y2="${top + t * (H - top - bot)}" stroke="rgba(255,255,255,.06)"/>`).join("")}
      ${s.h.map((v, i) => `<rect x="${x(i) - 1.5}" y="${H - 6 - (Math.abs(v - (s.h[i - 1] ?? v)) / s.o * 100 * 6 + 1) * 3}" width="3" height="${(Math.abs(v - (s.h[i - 1] ?? v)) / s.o * 100 * 6 + 1) * 3}" fill="${v >= (s.h[i - 1] ?? v) ? "var(--up)" : "var(--dn)"}" opacity=".35"/>`).join("")}
      <polygon points="${x(0)},${H - bot} ${line} ${x(59)},${H - bot}" fill="url(#ar)"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
      <line x1="8" x2="${W - 52}" y1="${y(s.o)}" y2="${y(s.o)}" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 4"/><text x="10" y="${y(s.o) + (y(s.o) < H / 2 ? 12 : -5)}" font-size="10" fill="#8792a6">开 ${f2(s.o)}</text>
      <circle cx="${x(59)}" cy="${y(s.p)}" r="3.5" fill="${col}"><animate attributeName="r" values="3.5;6;3.5" dur="1.4s" repeatCount="indefinite"/></circle>
      <rect x="${W - 50}" y="${Math.min(H - bot - 8, Math.max(top - 8, y(s.p) - 9))}" width="48" height="18" rx="5" fill="${col}"/><text x="${W - 26}" y="${Math.min(H - bot - 8, Math.max(top - 8, y(s.p) - 9)) + 13}" font-size="11" font-weight="800" text-anchor="middle" fill="#06101f">${f2(s.p)}</text>
      <text x="8" y="${top - 4}" font-size="9.5" fill="#8792a6">高 ${f2(hi)}</text><text x="8" y="${H - bot + 12}" font-size="9.5" fill="#8792a6">低 ${f2(lo)}</text><text x="${W - 52}" y="${H - 4}" font-size="9" fill="#8792a6" text-anchor="end">成交量（模拟）</text>`;
  }
  $("conv").onclick = () => { const cn = document.body.dataset.conv === "cn"; document.body.dataset.conv = cn ? "us" : "cn"; $("conv").textContent = cn ? "绿涨红跌" : "红涨绿跌"; };
  $("sort").onclick = () => { sorted = !sorted; $("sort").classList.toggle("on", sorted); render(); };
  addEventListener("resize", () => detail(STOCKS[sel]));
  render(); setInterval(() => { STOCKS.forEach(step); render(); }, 800);
</script>
</body>
</html>
