<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaPulse Market Terminal</title>
<style>
  :root {
    --bg: #080b11; --panel: #101622; --border: #1e293b; --text: #f1f5f9;
    --sub: #64748b; --up: #10b981; --up-bg: rgba(16,185,129,0.13);
    --down: #f43f5e; --down-bg: rgba(244,63,94,0.13); --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 0%, #131c2e, var(--bg) 70%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 14px;
  }
  .terminal {
    width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 24px; padding: 18px 16px; box-shadow: 0 24px 50px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; gap: 14px;
  }
  .header { display: flex; justify-content: space-between; align-items: center; }
  .title-wrap { display: flex; align-items: center; gap: 8px; }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--up);
    box-shadow: 0 0 10px var(--up); animation: blink 1.4s infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .h-title { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; }
  .alert-pill {
    font-size: 11px; padding: 4px 9px; border-radius: 99px; font-weight: 600;
    background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3);
  }
  .main-chart-box {
    background: rgba(0,0,0,0.28); border: 1px solid var(--border);
    border-radius: 18px; padding: 14px 12px;
  }
  .mc-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .mc-sym { font-size: 18px; font-weight: 800; }
  .mc-name { font-size: 11px; color: var(--sub); margin-left: 6px; }
  .mc-price { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .mc-chg { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-left: 6px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .bg-up { background: var(--up-bg); color: var(--up); }
  .bg-down { background: var(--down-bg); color: var(--down); }
  svg#mainChart { width: 100%; height: 110px; overflow: visible; display: block; }
  .stock-list { display: flex; flex-direction: column; gap: 8px; }
  .stock-row {
    display: grid; grid-template-columns: 1.15fr 0.9fr 1fr; align-items: center;
    padding: 11px 12px; border-radius: 14px; background: rgba(255,255,255,0.025);
    border: 1px solid transparent; cursor: pointer; transition: 0.2s;
  }
  .stock-row.active { border-color: var(--accent); background: rgba(56,189,248,0.07); }
  .s-sym { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .s-sub { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .s-spark { width: 68px; height: 26px; justify-self: center; }
  .s-right { text-align: right; font-variant-numeric: tabular-nums; }
  .s-price { font-size: 14px; font-weight: 700; }
  .s-badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px;
    border-radius: 6px; margin-top: 3px;
  }
  .risk-bar {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--sub); padding-top: 6px; border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
<div class="terminal">
  <div class="header">
    <div class="title-wrap">
      <span class="live-dot"></span>
      <span class="h-title">ALPHAPULSE // 实时行情</span>
    </div>
    <span class="alert-pill" id="volAlert">波动率: 正常 (VIX 14.8)</span>
  </div>
  <div class="main-chart-box">
    <div class="mc-top">
      <div><span class="mc-sym" id="fSym">NVDA</span><span class="mc-name" id="fName">NVIDIA Corp.</span></div>
      <div>
        <span class="mc-price" id="fPrice">$138.40</span>
        <span class="mc-chg bg-up" id="fChg">▲ +3.42%</span>
      </div>
    </div>
    <svg id="mainChart" viewBox="0 0 340 110"></svg>
  </div>
  <div class="stock-list" id="stockList"></div>
  <div class="risk-bar">
    <span>行情流每 1.2s 刷新 · 点击标的切换分时图</span>
    <span id="tickTime">LIVE</span>
  </div>
</div>
<script>
const STOCKS = [
  { sym: 'NVDA', name: 'NVIDIA Corp', base: 134.20, price: 138.79, hist: [134.5,135.2,134.9,136.1,135.8,137.0,136.7,137.9,138.2,138.5,138.1,138.79] },
  { sym: 'TSM',  name: 'Taiwan Semi', base: 192.00, price: 196.45, hist: [192.1,193.0,192.8,194.2,193.9,195.1,194.8,195.6,196.0,195.8,196.2,196.45] },
  { sym: 'AAPL', name: 'Apple Inc.',  base: 231.50, price: 228.14, hist: [231.2,230.6,230.9,229.8,230.1,229.2,228.9,229.4,228.6,228.3,228.5,228.14] },
  { sym: 'MSFT', name: 'Microsoft',   base: 424.00, price: 429.30, hist: [424.5,425.1,426.0,425.7,427.2,426.9,428.0,427.8,428.5,429.0,428.8,429.30] }
];
let selIdx = 0;
function sparkPoints(arr, w, h) {
  const min = Math.min(...arr), max = Math.max(...arr), span = Math.max(0.01, max - min);
  return arr.map((v, i) => `${((i / (arr.length - 1)) * w).toFixed(1)},${(h - 4 - ((v - min) / span) * (h - 8)).toFixed(1)}`).join(' ');
}
function renderMain() {
  const s = STOCKS[selIdx];
  const diff = s.price - s.base, pct = (diff / s.base) * 100, isUp = diff >= 0;
  const color = isUp ? '#10b981' : '#f43f5e';
  document.getElementById('fSym').textContent = s.sym;
  document.getElementById('fName').textContent = s.name;
  document.getElementById('fPrice').textContent = `$${s.price.toFixed(2)}`;
  document.getElementById('fPrice').className = `mc-price ${isUp ? 'up' : 'down'}`;
  const chgEl = document.getElementById('fChg');
  chgEl.textContent = `${isUp ? '▲ +' : '▼ '}${pct.toFixed(2)}%`;
  chgEl.className = `mc-chg ${isUp ? 'bg-up' : 'bg-down'}`;
  const pts = sparkPoints(s.hist, 340, 96);
  const firstY = pts.split(' ')[0].split(',')[1];
  document.getElementById('mainChart').innerHTML = `
    <defs>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.0"/>
      </linearGradient>
    </defs>
    <line x1="0" y1="${firstY}" x2="340" y2="${firstY}" stroke="rgba(255,255,255,0.12)" stroke-dasharray="3 3"/>
    <polygon points="0,104 ${pts} 340,104" fill="url(#areaGrad)"/>
    <polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>`;
}
function renderList() {
  const listEl = document.getElementById('stockList');
  listEl.innerHTML = STOCKS.map((s, idx) => {
    const diff = s.price - s.base, pct = (diff / s.base) * 100, isUp = diff >= 0;
    const stroke = isUp ? '#10b981' : '#f43f5e';
    const pts = sparkPoints(s.hist, 68, 26);
    return `<div class="stock-row ${idx === selIdx ? 'active' : ''}" data-idx="${idx}">
      <div>
        <div class="s-sym">${s.sym}</div>
        <div class="s-sub">${s.name}</div>
      </div>
      <svg class="s-spark" viewBox="0 0 68 26">
        <polyline fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" points="${pts}"/>
      </svg>
      <div class="s-right">
        <div class="s-price ${isUp ? 'up' : 'down'}">$${s.price.toFixed(2)}</div>
        <span class="s-badge ${isUp ? 'bg-up' : 'bg-down'}">${isUp ? '▲ +' : '▼ '}${diff.toFixed(2)} (${pct.toFixed(2)}%)</span>
      </div>
    </div>`;
  }).join('');
}
document.getElementById('stockList').addEventListener('click', e => {
  const row = e.target.closest('.stock-row');
  if (!row) return;
  selIdx = Number(row.dataset.idx);
  renderMain(); renderList();
});
setInterval(() => {
  let maxJump = 0;
  STOCKS.forEach(s => {
    const step = (Math.random() - 0.48) * s.base * 0.006;
    maxJump = Math.max(maxJump, Math.abs(step / s.base));
    s.price = Math.max(1, +(s.price + step).toFixed(2));
    s.hist.push(s.price);
    if (s.hist.length > 16) s.hist.shift();
  });
  const alertEl = document.getElementById('volAlert');
  if (maxJump > 0.004) {
    alertEl.textContent = '异动提醒: 买盘放量脉冲';
    alertEl.style.color = '#38bdf8';
  } else {
    alertEl.textContent = '风险监控: 波动率平稳';
    alertEl.style.color = '#fbbf24';
  }
  document.getElementById('tickTime').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  renderMain(); renderList();
}, 1200);
renderMain(); renderList();
</script>
</body>
</html>
