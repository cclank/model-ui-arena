<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Weather / 天气之间</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#08121c;color:#f0f5fb;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}.app{--sky1:#163f55;--sky2:#132e42;width:min(100%,600px);padding:25px;border-radius:30px;background:linear-gradient(150deg,var(--sky1),var(--sky2) 66%,#172c3b);border:1px solid #ffffff25;box-shadow:0 30px 80px #0008;position:relative;overflow:hidden;transition:background .7s,filter .7s}.app:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 13%,#f1c87977,transparent 30%),linear-gradient(115deg,#fff0, #fff0 50%,#fff08);pointer-events:none}.head,.hero,.forecast,.foot{position:relative;z-index:1}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:11px;letter-spacing:.18em;color:#c8d9e0}.place{display:flex;gap:5px}.city{border:1px solid #fff3;background:#fff0;color:#d5e3e9;border-radius:999px;padding:7px 10px;font:inherit;font-size:10px;cursor:pointer}.city.active{background:#e9f1ee;color:#18313b;border-color:#e9f1ee}.hero{padding:28px 2px 20px;transition:opacity .22s,transform .22s}.eyebrow{color:#c0d3dc;font-size:10px;letter-spacing:.18em}.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.temperature{font-size:78px;letter-spacing:-.08em;line-height:1;font-weight:300;margin:8px 0}.temperature sup{font-size:26px;vertical-align:top;line-height:2}.weather{font-size:16px}.weather small{display:block;color:#c0d3dc;font-size:11px;margin-top:5px}.sun{width:105px;height:105px;border-radius:50%;margin-right:18px;background:radial-gradient(circle,#fff4d1 0 20%,#ffd683c9 22% 32%,#ffd6832a 34% 63%,transparent 68%);animation:breathe 4s ease-in-out infinite}.meta{display:flex;gap:19px;color:#d4e1e6;font-size:11px;margin-top:18px}.meta b{font-weight:500;color:#fff}.forecast{border-top:1px solid #ffffff2a;padding-top:18px}.section{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section strong{font-size:12px;font-weight:550}.switch{display:flex;align-items:center;gap:8px;color:#d4e1e6;font-size:10px}.unit{border:0;background:#ffffff22;border-radius:999px;padding:2px;width:51px;height:25px;color:#fff;cursor:pointer;position:relative}.unit:after{content:attr(data-unit);position:absolute;inset:3px auto 3px 3px;width:23px;border-radius:50%;display:grid;place-items:center;background:#f3f4e8;color:#24414b;font-size:8px;transition:transform .2s}.unit.f:after{transform:translateX(22px)}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.day{min-width:0;border-radius:15px;background:#06182430;text-align:center;padding:11px 4px 10px}.day span,.day small{display:block;color:#c2d3db;font-size:9px}.day i{display:block;font-style:normal;font-size:20px;line-height:1.5}.range{height:17px;margin:2px 0 4px;position:relative;background:linear-gradient(90deg,#a3cbe2,#ffe3a0);border-radius:99px;opacity:.75}.range:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,transparent,#ffffffb8,transparent);transform:translateX(-100%);animation:shine 3.5s ease-in-out infinite}.foot{display:flex;justify-content:space-between;color:#aec1ca;font-size:9px;padding-top:15px}.scene{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}.ray{position:absolute;left:76%;top:11%;width:2px;height:145px;background:linear-gradient(#ffeab788,transparent);transform-origin:top;animation:ray 6s ease-in-out infinite}.rain{position:absolute;top:-20px;width:1px;height:16px;border-radius:2px;background:#d4eeff99;animation:fall var(--t) linear infinite;left:var(--x);opacity:var(--o)}.flake{position:absolute;top:-16px;left:var(--x);color:#eef9ffb0;font-size:11px;animation:fall var(--t) linear infinite}.night{filter:saturate(.75) brightness(.78)}@keyframes breathe{50%{transform:scale(1.06);filter:brightness(1.16)}}@keyframes shine{45%,100%{transform:translateX(130%)}}@keyframes ray{50%{opacity:.45;transform:rotate(7deg)}}@keyframes fall{to{transform:translate3d(25px,600px,0)}}
@media(max-width:500px){body{padding:10px}.app{padding:20px 17px;border-radius:25px}.temperature{font-size:70px}.sun{width:90px;height:90px;margin-right:2px}.city{padding:7px 8px;font-size:9px}.day{padding:10px 2px 9px}.meta{gap:12px}.days{gap:4px}}
</style></head><body><main class="app" id="app"><div class="scene" id="scene"></div><header class="head"><div class="logo">ATMOSPHERE <span style="color:#ffffff66">/</span> 天气之间</div><nav class="place" id="cities"></nav></header><section class="hero" id="hero"><div class="eyebrow" id="caption">LOCAL WEATHER · RIGHT NOW</div><div class="line"><div><div class="temperature" id="temp"></div><div class="weather" id="desc"></div></div><div class="sun" id="sun"></div></div><div class="meta"><span>风速 <b id="wind"></b></span><span>湿度 <b id="humidity"></b></span><span id="highlow"></span></div></section><section class="forecast"><div class="section"><strong>未来五日</strong><div class="switch"><span>温度单位</span><button id="unit" class="unit" type="button" data-unit="°C" aria-label="切换摄氏华氏"></button></div></div><div class="days" id="days"></div></section><footer class="foot"><span id="updated">数据为本地模拟</span><span id="mode">自动昼夜</span></footer></main>
<script>
const cities=[{name:'上海',temp:24,weather:'晴转多云',kind:'sun',wind:12,hum:58,days:[['今天','晴',26,18],['周三','云',25,19],['周四','雨',22,17],['周五','晴',27,20],['周六','云',25,18]]},{name:'杭州',temp:21,weather:'细雨',kind:'rain',wind:8,hum:81,days:[['今天','雨',23,18],['周三','雨',22,17],['周四','云',24,18],['周五','晴',27,19],['周六','晴',28,20]]},{name:'哈尔滨',temp:8,weather:'初雪',kind:'snow',wind:16,hum:43,days:[['今天','雪',10,1],['周三','云',11,2],['周四','晴',13,4],['周五','雪',9,0],['周六','晴',12,3]]}];let idx=0,fahrenheit=false;const $=s=>document.querySelector(s);cities.forEach((c,i)=>{const b=document.createElement('button');b.className='city';b.textContent=c.name;b.onclick=()=>show(i);$('#cities').append(b)});function cv(n){return fahrenheit?Math.round(n*9/5+32):n}function show(i){idx=i;const c=cities[i],hero=$('#hero');hero.style.opacity=0;hero.style.transform='translateY(5px)';setTimeout(()=>{hero.style.opacity=1;hero.style.transform='';$('#app').style.setProperty('--sky1',c.kind==='rain'?'#254353':c.kind==='snow'?'#354858':'#16485c');$('#app').style.setProperty('--sky2',c.kind==='rain'?'#253948':c.kind==='snow'?'#293b4e':'#173243');$('#temp').innerHTML=`${c.temp<0?'−':''}${cv(c.temp)}<sup>°${fahrenheit?'F':'C'}</sup>`;$('#desc').innerHTML=`${c.weather}<small>${c.name} · 体感 ${cv(c.temp-1)}°${fahrenheit?'F':'C'}</small>`;$('#wind').textContent=`${c.wind} km/h`,$('#humidity').textContent=`${c.hum}%`,$('#highlow').textContent=`最高 ${cv(c.days[0][2])}° / 最低 ${cv(c.days[0][3])}°`;$('#cities').querySelectorAll('.city').forEach((b,j)=>b.classList.toggle('active',j===i));$('#days').innerHTML=c.days.map((d,j)=>`<div class="day"><span>${d[0]}</span><i>${d[1]==='晴'?'☼':d[1]==='雨'?'⌁':d[1]==='雪'?'✳':'◌'}</i><small>${d[1]}</small><div class="range" style="opacity:${.55+j*.08}"></div><small>${cv(d[2])}° <span style="display:inline;color:#91a8b4">${cv(d[3])}°</span></small></div>`).join('');$('#sun').style.opacity=c.kind==='sun'?1:'.24';$('#scene').innerHTML=c.kind==='rain'?Array.from({length:34},(_,n)=>`<i class="rain" style="--x:${(n*37)%100}%;--t:${1.4+(n%7)*.3}s;--o:${.24+(n%5)*.1}"></i>`).join(''):c.kind==='snow'?Array.from({length:24},(_,n)=>`<i class="flake" style="--x:${(n*43)%100}%;--t:${5+n%8}s">✳</i>`).join(''):'<i class="ray"></i>';},180)}$('#unit').onclick=()=>{fahrenheit=!fahrenheit;$('#unit').classList.toggle('f',fahrenheit);$('#unit').dataset.unit=fahrenheit?'°F':'°C';show(idx)};const hr=new Date().getHours();if(hr<6||hr>=18)$('#app').classList.add('night');$('#mode').textContent=hr<6||hr>=18?'夜间氛围 · AUTO':'日间氛围 · AUTO';show(0);
</script></body></html>
