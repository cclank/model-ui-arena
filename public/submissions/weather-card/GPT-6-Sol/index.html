<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天气有形</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#dce8ec;font-family:Arial,"PingFang SC",sans-serif;color:#fff}.app{--top:#327fbc;--bottom:#75c6d6;position:relative;isolation:isolate;width:min(100%,460px);min-height:710px;overflow:hidden;border-radius:32px;background:linear-gradient(155deg,var(--top),var(--bottom));box-shadow:0 30px 65px #285c7950;transition:background .6s}.app.rain{--top:#344f75;--bottom:#7897aa}.app.snow{--top:#557fa3;--bottom:#c5d9dc}.app.night{filter:saturate(.72) brightness(.77)}.grain{position:absolute;inset:0;z-index:-1;opacity:.28;background:radial-gradient(circle at 82% 24%,#fff 0 2px,transparent 3px),radial-gradient(circle at 18% 70%,#fff 0 1px,transparent 2px);background-size:87px 101px}
header{display:flex;justify-content:space-between;align-items:center;padding:26px 28px 0;gap:12px}.brand{font-size:11px;letter-spacing:.24em;font-weight:700;opacity:.8}.unit{border:1px solid #ffffff75;border-radius:30px;padding:7px 12px;background:#ffffff1b;color:white;cursor:pointer;font-weight:700}.cities{display:flex;gap:8px;padding:22px 24px 0}.cities button{border:1px solid #ffffff55;border-radius:30px;background:#ffffff18;color:#fff;font-size:12px;padding:8px 14px;cursor:pointer;transition:background .3s,transform .3s}.cities button.active{background:#fff;color:#315977;transform:translateY(-2px)}.scene{position:relative;height:245px;overflow:hidden}.sun{position:absolute;left:50%;top:38%;width:125px;height:125px;margin:-62px;border-radius:50%;background:#fff2ac;box-shadow:0 0 0 24px #fff5b029,0 0 0 65px #fff6b01e,0 0 80px #fff6be;animation:breathe 4s ease-in-out infinite}.cloud{position:absolute;width:160px;height:44px;border-radius:40px;background:#e8f3f4df;top:56%;left:50%;transform:translateX(-50%);box-shadow:0 8px 20px #17315d2b;animation:drift 5s ease-in-out infinite alternate}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:88px;height:80px;left:28px;top:-46px}.cloud:after{width:65px;height:60px;left:80px;top:-33px}.app.sunny .cloud{opacity:.35;left:80%;top:70%}.app.rain .sun,.app.snow .sun{opacity:0}.rain .cloud,.snow .cloud{width:205px;background:#dceaf0;top:43%}.particle{position:absolute;left:var(--x);top:44%;animation:fall var(--t) linear infinite;animation-delay:var(--d)}.rain .particle{height:19px;width:2px;background:#ecf9ff;border-radius:2px;transform:rotate(12deg)}.snow .particle{width:7px;height:7px;background:#fff;border-radius:50%;filter:blur(.3px)}.sunny .particle{width:5px;height:5px;background:#fff3b1;border-radius:50%;animation:float 4s ease-in-out infinite alternate}.content{padding:0 28px;transition:opacity .28s,transform .28s}.content.changing{opacity:0;transform:translateY(10px)}.location{font-size:13px;letter-spacing:.17em;opacity:.85}.temp{font-size:100px;font-weight:200;letter-spacing:-.09em;line-height:1.12}.desc{font-size:23px;font-weight:600;margin:0 0 25px}.stats{display:flex;gap:30px;border-top:1px solid #ffffff60;padding:18px 0 24px}.stats small{display:block;font-size:11px;opacity:.75;margin-bottom:5px}.stats strong{font-size:18px}.forecast{background:#ffffffef;color:#234457;padding:20px 18px 24px;min-height:206px}.forecast h2{margin:0 10px 9px;font-size:12px;letter-spacing:.2em}.chart{height:55px;width:100%;display:block}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.day{text-align:center;font-size:11px;min-width:0}.day b{display:block;font-size:13px;margin-bottom:5px}.day .icon{display:block;font-size:17px;height:25px}.day .low{color:#7292a0}.day .high{font-weight:700}.day .label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#607c8b;margin-top:5px}@keyframes breathe{50%{box-shadow:0 0 0 34px #fff5b02b,0 0 0 75px #fff6b01a,0 0 100px #fff6be}}@keyframes drift{to{transform:translateX(-44%)}}@keyframes fall{to{top:104%;transform:translate(-22px,12px)}}@keyframes float{to{top:9%;transform:translate(35px,-15px);opacity:.2}}
@media(max-width:420px){.app{min-height:690px;border-radius:24px}.scene{height:225px}.temp{font-size:86px}.forecast{padding-left:9px;padding-right:9px}.day{font-size:10px}}
.sunny .particle{top:var(--y);animation-name:float;animation-duration:4s;animation-delay:var(--d);animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
</style></head><body>
<main class="app sunny" id="app"><div class="grain"></div><header><div class="brand">ATMOS / 天气有形</div><button class="unit" id="unit" aria-label="切换温度单位">°C / °F</button></header><nav class="cities" aria-label="选择城市" id="cities"></nav><div class="scene" id="scene"><div class="sun"></div><div class="cloud"></div></div><section class="content" id="content"><div class="location" id="location"></div><div class="temp" id="temp"></div><div class="desc" id="desc"></div><div class="stats"><div><small>风速 WIND</small><strong id="wind"></strong></div><div><small>湿度 HUMIDITY</small><strong id="humid"></strong></div></div></section><section class="forecast"><h2>未来五天 / FORECAST</h2><svg class="chart" id="chart" viewBox="0 0 400 55" preserveAspectRatio="none" aria-label="未来五天气温趋势"></svg><div class="days" id="days"></div></section></main>
<script>
const data=[{city:"杭州",kind:"sunny",temp:26,desc:"晴朗 · 有微风",wind:"12 km/h",humid:"42%",days:[[27,19,"晴"],[28,20,"晴"],[25,18,"多云"],[24,17,"多云"],[26,18,"晴"]]},{city:"上海",kind:"rain",temp:21,desc:"阵雨 · 云层低垂",wind:"18 km/h",humid:"78%",days:[[22,18,"阵雨"],[20,17,"小雨"],[23,18,"多云"],[25,19,"晴"],[24,18,"多云"]]},{city:"哈尔滨",kind:"snow",temp:-3,desc:"飘雪 · 注意保暖",wind:"9 km/h",humid:"64%",days:[[-2,-9,"雪"],[-4,-11,"雪"],[0,-7,"多云"],[1,-6,"晴"],[-1,-8,"雪"]]}];
let selected=0,fahrenheit=false;const $=s=>document.querySelector(s),app=$("#app"),content=$("#content");const display=n=>fahrenheit?Math.round(n*1.8+32):n;
$("#cities").innerHTML=data.map((d,i)=>'<button data-i="'+i+'">'+d.city+"</button>").join("");
function render(){
 const d=data[selected],night=new Date().getHours()<6||new Date().getHours()>=18;
 app.className="app "+d.kind+(night?" night":"");
 document.querySelectorAll(".cities button").forEach((b,i)=>b.classList.toggle("active",i===selected));
 $("#location").textContent=d.city+" · 本地模拟天气";$("#temp").textContent=display(d.temp)+"°";$("#desc").textContent=d.desc;$("#wind").textContent=d.wind;$("#humid").textContent=d.humid;
 $("#scene").querySelectorAll(".particle").forEach(el=>el.remove());
 for(let i=0;i<30;i++){const p=document.createElement("i");p.className="particle";p.style.cssText="--x:"+Math.random()*100+"%;--y:"+(15+Math.random()*60)+"%;--t:"+(d.kind==="rain"?0.9+Math.random()*.6:2.8+Math.random()*2)+"s;--d:-"+Math.random()*5+"s";$("#scene").append(p)}
 const highs=d.days.map(x=>x[0]),min=Math.min(...highs)-3,max=Math.max(...highs)+3,points=highs.map((v,i)=>[40+i*80,45-(v-min)/(max-min)*37]);
 $("#chart").innerHTML='<path d="M'+points.map(p=>p.join(",")).join(" L")+'" fill="none" stroke="#5294b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+points.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#fff" stroke="#5294b5" stroke-width="2"/>').join("");
 const icons={"晴":"☀","多云":"☁","阵雨":"☂","小雨":"☂","雪":"❄"};
 $("#days").innerHTML=d.days.map((v,i)=>{const date=new Date();date.setDate(date.getDate()+i+1);return '<div class="day"><b>'+(i===0?"明天":(date.getMonth()+1)+"/"+date.getDate())+'</b><span class="icon">'+icons[v[2]]+'</span><span class="high">'+display(v[0])+'°</span> <span class="low">'+display(v[1])+'°</span><span class="label">'+v[2]+"</span></div>"}).join("");
}
$("#cities").onclick=e=>{const b=e.target.closest("button");if(!b||+b.dataset.i===selected)return;content.classList.add("changing");setTimeout(()=>{selected=+b.dataset.i;render();content.classList.remove("changing")},260)};
$("#unit").onclick=()=>{fahrenheit=!fahrenheit;render()};render();
</script></body></html>
