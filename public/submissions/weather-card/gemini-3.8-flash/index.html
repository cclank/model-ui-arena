<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atmospheric Weather - Gemini 3.8 Flash</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #090e1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff; padding: 16px;
    }
    .weather-card {
      width: 350px; border-radius: 28px; padding: 24px;
      backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
      display: flex; flex-direction: column; gap: 18px;
      transition: background 0.6s ease, box-shadow 0.6s ease;
    }
    .sunny { background: linear-gradient(145deg, rgba(234, 88, 12, 0.35), rgba(245, 158, 11, 0.55)); box-shadow: 0 20px 45px rgba(245, 158, 11, 0.2); }
    .rainy { background: linear-gradient(145deg, rgba(30, 58, 138, 0.45), rgba(59, 130, 246, 0.4)); box-shadow: 0 20px 45px rgba(59, 130, 246, 0.2); }
    .cloudy { background: linear-gradient(145deg, rgba(51, 65, 85, 0.5), rgba(100, 116, 139, 0.45)); box-shadow: 0 20px 45px rgba(100, 116, 139, 0.2); }

    .city-nav { display: flex; gap: 6px; background: rgba(0, 0, 0, 0.2); padding: 4px; border-radius: 16px; }
    .city-btn {
      flex: 1; padding: 8px 4px; border: none; border-radius: 12px;
      background: transparent; color: rgba(255, 255, 255, 0.7); font-size: 0.85rem;
      font-weight: 600; cursor: pointer; transition: all 0.25s ease;
    }
    .city-btn.active { background: rgba(255, 255, 255, 0.95); color: #0f172a; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

    .hero { display: flex; justify-content: space-between; align-items: center; }
    .temp-wrap { display: flex; flex-direction: column; }
    .temp-val { font-size: 4.2rem; font-weight: 800; line-height: 1; }
    .cond-text { font-size: 1.25rem; font-weight: 600; margin-top: 6px; opacity: 0.95; }
    .range-text { font-size: 0.8rem; opacity: 0.7; margin-top: 4px; }

    .icon-stage { width: 90px; height: 90px; position: relative; display: flex; align-items: center; justify-content: center; }
    .sun-core { width: 48px; height: 48px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 28px #f59e0b; animation: pulse 3s infinite ease-in-out; }
    .cloud-shape {
      width: 50px; height: 26px; background: rgba(255, 255, 255, 0.9); border-radius: 20px;
      position: relative; animation: float 3s infinite ease-in-out;
    }
    .cloud-shape::before { content:''; position: absolute; width: 26px; height: 26px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; top: -12px; left: 8px; }
    .cloud-shape::after { content:''; position: absolute; width: 20px; height: 20px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; top: -8px; left: 24px; }
    .rain-track { position: absolute; bottom: 8px; display: flex; gap: 8px; }
    .raindrop { width: 2px; height: 10px; background: #93c5fd; border-radius: 2px; animation: rain 0.8s infinite linear; }
    .raindrop:nth-child(2) { animation-delay: 0.25s; }
    .raindrop:nth-child(3) { animation-delay: 0.5s; }
    @keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes rain { 0% { transform: translateY(-8px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }

    .grid-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      background: rgba(0, 0, 0, 0.15); border-radius: 16px; padding: 12px 10px; text-align: center;
    }
    .stat-label { font-size: 0.72rem; opacity: 0.65; margin-bottom: 2px; }
    .stat-val { font-size: 0.95rem; font-weight: 700; }

    .trend-card { display: flex; flex-direction: column; gap: 6px; }
    .trend-header { font-size: 0.75rem; opacity: 0.75; font-weight: 600; }
  </style>
</head>
<body>
  <div class="weather-card sunny" id="card">
    <div class="city-nav">
      <button class="city-btn active" onclick="switchCity('shanghai')">上海</button>
      <button class="city-btn" onclick="switchCity('paris')">巴黎</button>
      <button class="city-btn" onclick="switchCity('reykjavik')">雷克雅未克</button>
    </div>
    <div class="hero">
      <div class="temp-wrap">
        <div class="temp-val"><span id="temp">27</span>°</div>
        <div class="cond-text" id="cond">晴空朗朗</div>
        <div class="range-text" id="range">最高 29° / 最低 19°</div>
      </div>
      <div class="icon-stage" id="iconStage"></div>
    </div>
    <div class="grid-stats">
      <div><div class="stat-label">湿度</div><div class="stat-val" id="hum">45%</div></div>
      <div><div class="stat-label">风速</div><div class="stat-val" id="wind">3.6 m/s</div></div>
      <div><div class="stat-label">空气质量</div><div class="stat-val" id="aqi">32 优</div></div>
    </div>
    <div class="trend-card">
      <div class="trend-header">24小时温度走势 (°C)</div>
      <svg viewBox="0 0 300 55" style="width: 100%; height: 55px; overflow: visible;">
        <path id="curve" d="" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>
        <g id="points"></g>
      </svg>
    </div>
  </div>
  <script>
    const cities = {
      shanghai: { temp: 27, cond: '晴空朗朗', range: '最高 29° / 最低 19°', hum: '45%', wind: '3.6 m/s', aqi: '32 优', type: 'sunny', curve: [21, 24, 27, 26, 22] },
      paris: { temp: 16, cond: '阵雨微凉', range: '最高 18° / 最低 12°', hum: '86%', wind: '5.2 m/s', aqi: '24 优', type: 'rainy', curve: [13, 15, 16, 15, 14] },
      reykjavik: { temp: 4, cond: '阴郁多云', range: '最高 6° / 最低 1°', hum: '72%', wind: '6.8 m/s', aqi: '12 极优', type: 'cloudy', curve: [2, 3, 4, 3, 2] }
    };
    function switchCity(id) {
      document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.city-btn')).find(b =>
        b.textContent.includes(id === 'shanghai' ? '上海' : id === 'paris' ? '巴黎' : '雷克雅未克')
      );
      if (activeBtn) activeBtn.classList.add('active');
      const c = cities[id];
      const card = document.getElementById('card');
      card.className = `weather-card ${c.type}`;
      document.getElementById('temp').textContent = c.temp;
      document.getElementById('cond').textContent = c.cond;
      document.getElementById('range').textContent = c.range;
      document.getElementById('hum').textContent = c.hum;
      document.getElementById('wind').textContent = c.wind;
      document.getElementById('aqi').textContent = c.aqi;

      const stage = document.getElementById('iconStage');
      if (c.type === 'sunny') {
        stage.innerHTML = '<div class="sun-core"></div>';
      } else if (c.type === 'rainy') {
        stage.innerHTML = '<div class="cloud-shape"></div><div class="rain-track"><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div></div>';
      } else {
        stage.innerHTML = '<div class="cloud-shape"></div>';
      }

      const min = Math.min(...c.curve) - 2;
      const max = Math.max(...c.curve) + 2;
      const pts = c.curve.map((val, i) => {
        const x = 20 + i * 65;
        const y = 45 - ((val - min) / (max - min)) * 32;
        return { x, y, val };
      });
      document.getElementById('curve').setAttribute('d', `M ${pts.map(p => `${p.x} ${p.y}`).join(' L ')}`);
      document.getElementById('points').innerHTML = pts.map(p =>
        `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" />
         <text x="${p.x}" y="${p.y - 7}" font-size="9" fill="rgba(255,255,255,0.9)" text-anchor="middle">${p.val}°</text>`
      ).join('');
    }
    switchCity('shanghai');
  </script>
</body>
</html>
