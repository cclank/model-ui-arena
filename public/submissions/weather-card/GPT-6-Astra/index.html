<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elsewhere — A window to the weather</title>
<!-- Three locally modelled destinations. Layered landscapes, sunlight, rain and snow create an animated window; units, daily forecasts and temperatures change together. -->
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#e9eef0;display:grid;place-items:center;padding:25px 16px;font-family:Arial,sans-serif;color:#fff}main{width:min(850px,100%);border-radius:24px;overflow:hidden;box-shadow:0 30px 70px #1d3b4e27;background:#133b50}.scene{position:relative;min-height:440px;padding:28px 35px;overflow:hidden;background:#729bb3}.sky{position:absolute;inset:0;background:linear-gradient(#99c9dc,#dddfc3);transition:background 1s}.scene.rain .sky{background:linear-gradient(#314c67,#91aeb6)}.scene.snow .sky{background:linear-gradient(#50627d,#b5c1d2)}.night .sky{filter:brightness(.54) saturate(.7)}.sun{position:absolute;width:125px;height:125px;left:54%;top:65px;background:#fff3c2;border-radius:50%;box-shadow:0 0 55px 30px #ffebba55,0 0 100px 70px #ffe8ac22;animation:breathe 8s ease-in-out infinite;transition:opacity .6s}.rain .sun,.snow .sun{opacity:0;animation:none}.landscape{position:absolute;bottom:-2px;left:0;width:100%;height:69%;transition:filter 1s}.rain .landscape{filter:brightness(.75) saturate(.55)}.snow .landscape{filter:saturate(.35)}.night .landscape{filter:brightness(.45)}.weather{position:absolute;inset:0;pointer-events:none}.weather i{position:absolute;animation:fall linear infinite;opacity:.5}.sunny .weather i{width:3px;height:3px;background:#fff4c3;border-radius:50%;animation:float 8s ease-in-out infinite}.rain .weather i{width:1px;height:32px;background:linear-gradient(transparent,#dceef8);rotate:15deg}.snow .weather i{width:5px;height:5px;background:white;border-radius:50%;filter:blur(.5px)}header,.location,.sub,.section-title{display:flex;align-items:center;justify-content:space-between;position:relative}.wordmark{font:italic 25px Georgia;letter-spacing:-1px}button{cursor:pointer;font-family:inherit;border:0;color:inherit}.unit{background:#ffffff24;border:1px solid #ffffff4a;padding:8px 11px;border-radius:20px;font:11px monospace}.locations{display:flex;gap:6px;position:relative;margin:26px 0 23px;flex-wrap:wrap}.locations button{background:#ffffff13;padding:8px 13px;border-radius:18px;font-size:11px;transition:background .3s}.locations button[aria-pressed=true]{background:#fff;color:#284758}.locations button:hover{background:#ffffff55}.location h1{font-weight:400;font-size:35px;letter-spacing:-1px;margin:0 0 5px}.location p{font:10px monospace;letter-spacing:2px;margin:0;opacity:.8}.temp{font:normal 106px/.95 Arial,sans-serif;letter-spacing:-8px;position:relative;margin:18px 0 8px}.condition{font-size:14px;position:relative}.sub{margin-top:28px;font:10px monospace;letter-spacing:1px;color:#e6eff0}.sub>span{display:flex;gap:17px}.forecast{padding:27px 35px 23px;background:#fcfcf8;color:#254354}.section-title{font-size:10px;letter-spacing:1.8px}.section-title span:last-child{color:#82949b;font-size:9px}.chart{width:100%;height:60px;display:block;overflow:visible;margin:16px 0 3px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}.day{min-width:0;font-size:11px}.day:first-child{text-align:left}.day:last-child{text-align:right}.day .desc{color:#7c929c;font-size:10px;margin:6px 0}.day .range{font:13px monospace}.range span{color:#8b9da2;font-size:11px}.foot{border-top:1px solid #e1e8e7;margin-top:22px;padding-top:15px;display:flex;justify-content:space-between;font:8px monospace;letter-spacing:1px;color:#8fa09e}button:focus-visible{outline:3px solid #d6b75a;outline-offset:4px}.switching{animation:content .6s ease both}@keyframes fall{from{transform:translateY(-70px)}to{transform:translateY(530px)}}@keyframes float{50%{transform:translate(20px,-30px);opacity:.15}}@keyframes breathe{50%{scale:1.1;opacity:.8}}@keyframes content{0%{opacity:.3;translate:0 5px}100%{opacity:1;translate:0 0}}@media(min-width:700px){.scene{min-height:456px}.temp{font-size:112px}.landscape{height:88%;width:74%;left:26%}}@media(max-width:430px){.scene{padding:24px;min-height:429px}.forecast{padding:25px 24px 20px}.location h1{font-size:30px}.temp{font-size:96px}.sub{font-size:9px}.section-title{font-size:9px}.day .desc{font-size:9px}.foot{font-size:7px}.locations button{padding:8px 11px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#13354b70,transparent 80%);pointer-events:none}.scene header,.locations,#content{position:relative;z-index:1}@media(min-width:700px){.landscape{width:100%;left:0}}
</style></head><body><main>
<section class="scene sunny" id="scene"><div class="sky"></div><div class="sun"></div><svg class="landscape" viewBox="0 0 700 420" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="hill" x2="0" y2="1"><stop stop-color="#436e76"/><stop offset="1" stop-color="#1c4352"/></linearGradient></defs><path d="M0 245 150 125 240 182 415 35 540 175 700 90V420H0" fill="#a3bdc0"/><path d="M260 196 415 35 488 115 440 99 418 113 396 95 375 145 345 141" fill="#e9ede4"/><path d="M0 313 155 184 313 265 489 168 700 258V420H0" fill="#71979a"/><path d="M0 344Q145 215 320 314T700 235V420H0" fill="url(#hill)"/><path d="M0 398Q150 317 310 377T700 305V420H0" fill="#1d414a"/><path d="M300 420Q405 365 536 367T665 324" stroke="#94b8b1" fill="none" stroke-width="3" opacity=".5"/></svg><div id="weather" class="weather"></div>
<header><span class="wordmark">elsewhere.</span><button class="unit" id="unit" aria-label="Switch temperature unit">°C / °F</button></header><nav class="locations" aria-label="Choose city"><button data-city="0" aria-pressed="true">Kyoto</button><button data-city="1" aria-pressed="false">Hangzhou</button><button data-city="2" aria-pressed="false">Reykjavík</button></nav>
<div id="content"><div class="location"><div><h1 id="city">Kyoto, Japan</h1><p id="local">A LITTLE CLOSER TO NATURE</p></div></div><div class="temp" id="temp">24°</div><div class="condition" id="condition">Sunlit, with room to wander.</div><div class="sub"><span><b id="wind">12 km/h</b><b id="humidity">58% humidity</b></span><span>FEELS <b id="feels">25°</b></span></div></div></section>
<section class="forecast"><div class="section-title"><span>THE NEXT FIVE DAYS</span><span id="season">TAKE THE SCENIC ROUTE.</span></div><svg class="chart" id="chart" viewBox="0 0 600 60" preserveAspectRatio="none" aria-label="Five day high temperatures"></svg><div class="days" id="days"></div><div class="foot"><span>LOCAL DEMO · NO LIVE WEATHER</span><span>LOOK UP, SLOW DOWN.</span></div></section>
</main><script>
const $=id=>document.getElementById(id),data=[{name:'Kyoto, Japan',type:'sunny',t:24,feels:25,wind:12,humidity:58,text:'Sunlit, with room to wander.',hi:[24,26,25,22,23],lo:[17,18,17,16,17],desc:['Sunny','Sunny','Cloudy','Showers','Clearing']},{name:'Hangzhou, China',type:'rain',t:21,feels:22,wind:18,humidity:87,text:'Rain on the lake. Time for tea.',hi:[21,22,24,23,25],lo:[18,18,19,18,20],desc:['Rain','Showers','Cloudy','Cloudy','Sunny']},{name:'Reykjavík, Iceland',type:'snow',t:-2,feels:-6,wind:26,humidity:72,text:'A quiet world, dusted in white.',hi:[-2,0,1,-1,2],lo:[-6,-4,-3,-5,-2],desc:['Snow','Cloudy','Sleet','Snow','Cloudy']}];let selected=0,fahrenheit=false,shown=24,anim,settleTimer;
const temp=x=>Math.round(fahrenheit?x*1.8+32:x)+'°';
function render(){const d=data[selected];$('scene').className='scene '+d.type+(new Date().getHours()<6||new Date().getHours()>=18?' night':'');$('city').textContent=d.name;$('condition').textContent=d.text;$('wind').textContent=d.wind+' km/h';$('humidity').textContent=d.humidity+'% humidity';$('feels').textContent=temp(d.feels);$('unit').textContent=fahrenheit?'°F / °C':'°C / °F';document.querySelectorAll('[data-city]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.city)===selected));$('content').classList.remove('switching');void $('content').offsetWidth;$('content').classList.add('switching');cancelAnimationFrame(anim);clearTimeout(settleTimer);const from=shown,start=performance.now();function count(now){const p=Math.min((now-start)/700,1);shown=from+(d.t-from)*(1-(1-p)**3);$('temp').textContent=temp(shown);if(p<1)anim=requestAnimationFrame(count);}anim=requestAnimationFrame(count);settleTimer=setTimeout(()=>{cancelAnimationFrame(anim);shown=d.t;$('temp').textContent=temp(d.t);},740);
$('weather').replaceChildren();for(let i=0;i<48;i++){const p=document.createElement('i');p.style.left=((i*71.31)%100)+'%';p.style.top=(d.type==='sunny'?(i*41)%90:-40)+'%';p.style.animationDelay=-(i*.39)+'s';p.style.animationDuration=(d.type==='rain'?1+i%5*.13:d.type==='snow'?6+i%4:7+i%5)+'s';$('weather').append(p);}
const min=Math.min(...d.hi)-2,max=Math.max(...d.hi)+2,pts=d.hi.map((v,i)=>[12+i*144,53-(v-min)/(max-min)*47]);$('chart').innerHTML=`<path d="M${pts.map(p=>p.join(',')).join(' L')}" fill="none" stroke="#6e9b8e" stroke-width="2" vector-effect="non-scaling-stroke"/>`+pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="#fcfcf8" stroke="#6e9b8e" stroke-width="2"/>`).join('');$('days').innerHTML=d.hi.map((v,i)=>{const dt=new Date();dt.setDate(dt.getDate()+i+1);return `<div class="day"><b>${dt.toLocaleDateString('en',{weekday:'short'})} ${dt.getDate()}</b><div class="desc">${d.desc[i]}</div><div class="range">${temp(v)} <span>${temp(d.lo[i])}</span></div></div>`;}).join('');}
document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.city);render();});$('unit').onclick=()=>{fahrenheit=!fahrenheit;render();};render();
</script></body></html>
