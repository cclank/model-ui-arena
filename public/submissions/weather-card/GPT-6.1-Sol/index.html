<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天气之间 · Weather, gently</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#e9eef0;font-family:Arial,"PingFang SC",sans-serif;color:#fff;display:grid;place-items:center;padding:28px}.card{position:relative;isolation:isolate;overflow:hidden;width:min(100%,740px);border-radius:32px;box-shadow:0 30px 80px #22344a28;background:#488eb8;transition:background 1s}.card.rain{background:#4b687f}.card.snow{background:#7b99b5}.card.night{filter:saturate(.8);background:#233b5d}.sky{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.sun{position:absolute;top:105px;right:90px;width:145px;height:145px;border-radius:50%;background:#ffe2a0;box-shadow:0 0 45px 20px #fff0c049,0 0 120px 40px #fff0c025;animation:sun 6s ease-in-out infinite}.night .sun{background:#e2e9ff;box-shadow:inset -25px -10px 0 #233b5d,0 0 60px #dceaff25}.cloud{position:absolute;top:220px;right:-70px;width:450px;height:150px;background:radial-gradient(ellipse at 35% 70%,#ffffff66,transparent 60%);filter:blur(14px);animation:cloud 18s ease-in-out infinite alternate}.rain .sun,.snow .sun{opacity:.1}.particle{position:absolute;top:-20px;animation:fall linear infinite}.rain .particle{width:1px;height:25px;background:linear-gradient(transparent,#d9efffaa)}.snow .particle{width:5px;height:5px;border-radius:50%;background:#fff8}.sunny .particle{width:3px;height:3px;border-radius:50%;background:#ffe6bdaa;animation:rise linear infinite}.content{padding:30px 36px;position:relative;transition:opacity .2s,transform .2s}.content.switching{opacity:.28;transform:translateY(8px)}header{display:flex;justify-content:space-between;align-items:center;gap:8px}.wordmark{font-size:12px;letter-spacing:.22em}.units{display:flex;gap:4px;background:#ffffff18;padding:4px;border-radius:18px}button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent;border-radius:20px}.units button{font-size:11px;padding:5px 9px}.units button[aria-pressed=true]{background:#fff;color:#3f6480}.cities{display:flex;gap:5px;margin:32px 0 16px}.cities button{font-size:13px;padding:8px 14px;opacity:.55}.cities button[aria-pressed=true]{opacity:1;background:#ffffff20}.top{display:flex;justify-content:space-between;align-items:start}.city{font-size:32px;font-weight:normal;letter-spacing:-.02em;margin:2px 0 7px}.date{font-size:11px;color:#ffffffa0}.current{min-height:215px}.temp{font-size:120px;line-height:1.2;letter-spacing:-.075em;font-weight:normal;margin:18px 0 0}.temp sup{font-size:.4em;vertical-align:top;line-height:1.8}.condition{display:flex;align-items:center;gap:8px;font-size:15px}.details{display:flex;gap:34px;margin:25px 0 30px}.details small{display:block;color:#ffffffa0;font-size:10px;margin-bottom:8px;letter-spacing:.08em}.details strong{font-size:16px;font-weight:normal}.forecast{border-top:1px solid #ffffff28;padding-top:23px}.forecast-head{display:flex;justify-content:space-between;font-size:10px;color:#ffffffb0;letter-spacing:.08em}.forecast svg{width:100%;height:65px;overflow:visible;display:block;margin-top:12px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}.days small{font-size:10px;color:#ffffffb0}.days .icon{display:block;margin:14px auto 8px;width:26px;height:26px}.days .desc{font-size:10px;min-height:15px}.days .range{font-size:12px;margin-top:9px;white-space:nowrap}.range span{color:#ffffff65;margin-left:6px}footer{display:flex;justify-content:space-between;gap:12px;font-size:9px;color:#ffffff95;margin-top:28px;letter-spacing:.05em}.sunny:not(.night) .place-note{color:#386177}.place-note{width:150px;color:#ffffffbb;font-size:11px;line-height:1.7;text-align:right;margin-top:50px}@keyframes sun{50%{transform:scale(1.04);box-shadow:0 0 80px 25px #fff0c038}}@keyframes fall{to{transform:translate(-90px,740px)}}@keyframes rise{from{transform:translateY(700px);opacity:0}50%{opacity:1}to{transform:translate(80px,-20px);opacity:0}}@keyframes cloud{to{transform:translateX(-140px)}}@media(max-width:520px){body{padding:14px}.content{padding:24px 22px}.card{border-radius:26px}.cities{margin-top:27px}.temp{font-size:100px}.sun{right:27px;top:178px;width:100px;height:100px}.place-note{width:108px;font-size:10px;margin-top:58px}.details{gap:29px}.city{font-size:28px}.forecast{padding-top:20px}.days .range{font-size:11px}.days .desc{font-size:9px}}
</style></head><body><main class="card sunny" id="card"><div class="sky" id="sky"><div class="sun"></div><div class="cloud"></div></div><div class="content" id="content"><header><span class="wordmark">天气之间 / IN BETWEEN</span><div class="units"><button data-unit="C" aria-pressed="true">°C</button><button data-unit="F" aria-pressed="false">°F</button></div></header><nav class="cities" aria-label="选择城市"><button data-city="0" aria-pressed="true">杭州</button><button data-city="1" aria-pressed="false">上海</button><button data-city="2" aria-pressed="false">札幌</button></nav><div class="top"><div class="current"><h1 id="city" class="city">杭州</h1><div class="date" id="date"></div><div class="temp"><span id="temp">24</span><sup>°</sup></div><div class="condition" id="condition">晴朗 · 微风适宜</div></div><div class="place-note" id="note">今天的阳光，<br>适合把步子放慢。</div></div><div class="details"><div><small>体感温度</small><strong id="feels"></strong></div><div><small>风速</small><strong id="wind"></strong></div><div><small>湿度</small><strong id="humidity"></strong></div></div><section class="forecast"><div class="forecast-head"><span>接下来，五天</span><span>最高 / 最低温度</span></div><svg id="chart" viewBox="0 0 500 65" aria-label="未来五天最高气温趋势"></svg><div class="days" id="days"></div></section><footer><span>本地模拟天气 · 无网络请求</span><span>GPT-6.1-SOL</span></footer></div></main>
<script>
const $=id=>document.getElementById(id),data=[{name:'杭州',t:24,feels:25,wind:8,humidity:62,kind:'sunny',desc:'晴朗 · 微风适宜',note:'今天的阳光，<br>适合把步子放慢。',hi:[24,26,23,22,25],lo:[17,18,17,16,18],weather:['晴','晴','多云','小雨','晴']},{name:'上海',t:19,feels:18,wind:16,humidity:86,kind:'rain',desc:'小雨 · 记得带伞',note:'听雨落在窗前，<br>城市也有了节奏。',hi:[19,20,22,23,21],lo:[16,16,17,18,17],weather:['小雨','小雨','多云','晴','多云']},{name:'札幌',t:-2,feels:-5,wind:12,humidity:74,kind:'snow',desc:'小雪 · 轻轻落下',note:'把脚印留在雪里，<br>把暖意带在身上。',hi:[-2,0,1,-1,2],lo:[-7,-5,-4,-6,-3],weather:['小雪','多云','晴','小雪','晴']}];let active=0,unit='C',value=24,animation=0,changeTimer;
const convert=t=>unit==='C'?t:Math.round(t*9/5+32),icon=w=>`<svg class="icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">${w==='晴'?'<circle cx="16" cy="16" r="6" fill="#ffe5a2"/><path d="M16 2v4m0 20v4M2 16h4m20 0h4M6 6l3 3m14 14l3 3M6 26l3-3M23 9l3-3" stroke="#ffe5a2" stroke-width="2"/>':'<path d="M9 22h15a6 6 0 0 0 0-12 8 8 0 0 0-15 2 5 5 0 0 0 0 10" fill="#ffffffc0"/>'+(w==='小雨'?'<path d="m12 25-2 4m10-4-2 4" stroke="#afdfff" stroke-width="2"/>':w==='小雪'?'<circle cx="11" cy="28" r="2" fill="white"/><circle cx="22" cy="28" r="2" fill="white"/>':'')}</svg>`;
function render(){const d=data[active],now=new Date();$('card').className='card '+d.kind+((now.getHours()<6||now.getHours()>=18)?' night':'');$('city').textContent=d.name;$('date').textContent=now.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('condition').textContent=d.desc;$('note').innerHTML=d.note;$('feels').textContent=convert(d.feels)+'°';$('wind').textContent=d.wind+' km/h';$('humidity').textContent=d.humidity+'%';cancelAnimationFrame(animation);let from=value,to=convert(d.t),start=performance.now();function count(t){const q=Math.min(1,(t-start)/650);value=from+(to-from)*(1-Math.pow(1-q,3));$('temp').textContent=Math.round(value);if(q<1)animation=requestAnimationFrame(count)}animation=requestAnimationFrame(count);$('sky').querySelectorAll('.particle').forEach(p=>p.remove());for(let i=0;i<42;i++){const p=document.createElement('i');p.className='particle';p.style.left=Math.random()*120+'%';p.style.animationDuration=(d.kind==='rain'?1+Math.random():5+Math.random()*6)+'s';p.style.animationDelay=-Math.random()*10+'s';$('sky').append(p)}const low=Math.min(...d.hi)-3,high=Math.max(...d.hi)+3,points=d.hi.map((t,i)=>[50+i*100,55-(t-low)/(high-low)*42]);$('chart').innerHTML=`<path d="M${points.map(p=>p.join(',')).join(' L')}" fill="none" stroke="#ffe3ad" stroke-width="2"/>`+points.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3" fill="#ffe3ad"/><text x="${x}" y="${y-10}" fill="#ffffffbe" text-anchor="middle" font-size="10">${convert(d.hi[i])}°</text>`).join('');$('days').innerHTML=d.weather.map((w,i)=>{const day=new Date(now);day.setDate(day.getDate()+i+1);return `<div><small>${i===0?'明天':day.toLocaleDateString('zh-CN',{weekday:'short'})}</small>${icon(w)}<div class="desc">${w}</div><div class="range">${convert(d.hi[i])}°<span>${convert(d.lo[i])}°</span></div></div>`}).join('');document.querySelectorAll('[data-city]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.city)===active));document.querySelectorAll('[data-unit]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.unit===unit))}
document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{clearTimeout(changeTimer);$('content').classList.add('switching');active=Number(b.dataset.city);changeTimer=setTimeout(()=>{render();$('content').classList.remove('switching')},180)});document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unit=b.dataset.unit;render()});render();
</script></body></html>
