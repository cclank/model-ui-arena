<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elsewhere — A window to the weather</title>
<!-- 用一扇有天气的窗呈现城市气候：落日、雨幕、雪花各有独立动态。
     城市切换采用天空渐变、内容淡入和温度插值，保留清晰的五日趋势。
     所有数据均为本地演示，支持摄氏/华氏与自动夜间氛围。 -->
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;background:#e9ece8;color:#fff;padding:26px 20px}.app{width:min(100%,560px);border-radius:26px;overflow:hidden;background:#214d55;box-shadow:0 26px 70px -25px #163c4255}.sky{position:relative;isolation:isolate;overflow:hidden;padding:25px 28px 0;min-height:380px;background:#769692}.atmosphere{position:absolute;inset:0;z-index:-4;transition:opacity 1.1s;opacity:0}.sunny .sun-sky,.rainy .rain-sky,.snowy .snow-sky{opacity:1}.sun-sky{background:linear-gradient(150deg,#688784,#8da19b 36%,#dab186 76%,#e9b987)}.rain-sky{background:linear-gradient(140deg,#324e64,#678391 70%,#a1aeb0)}.snow-sky{background:linear-gradient(145deg,#516c86,#8192a4 60%,#b0b8c3)}.night .atmosphere{filter:brightness(.64) saturate(.8)}header{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:19px;font-family:Georgia,serif;font-style:italic;letter-spacing:-.6px}.live{font:8px monospace;letter-spacing:1px;padding:6px 8px;border:1px solid #ffffff44;border-radius:30px}.tabs{display:flex;gap:5px;margin-top:25px}button{font:11px Arial;color:inherit;cursor:pointer;background:none;border:0}button:focus-visible{outline:3px solid #ffdb98;outline-offset:4px}.tabs button{border-radius:20px;padding:9px 12px;transition:background .3s}.tabs button[aria-selected=true]{background:#fff;color:#3b605f;box-shadow:0 3px 12px #244c5522}.tabs button:hover{background:#ffffff25}.tabs button[aria-selected=true]:hover{background:#fff}
.current{position:relative;margin-top:28px;z-index:3}.kicker{font:9px monospace;letter-spacing:1.5px;opacity:.75}.temperature{font-size:96px;font-weight:400;line-height:1.1;letter-spacing:-8px;margin:8px 0 0}.temperature sup{font-size:.5em;vertical-align:top;position:relative;top:8px;margin-left:3px;letter-spacing:0}.desc{font-size:14px;font-weight:400;margin:5px 0 21px}.metrics{display:flex;gap:25px;font-size:11px;padding-bottom:29px}.metrics span{display:block;font:8px monospace;letter-spacing:1.3px;opacity:.65;margin-bottom:6px}.units{position:absolute;right:0;bottom:28px;border:1px solid #fff5;border-radius:20px;padding:7px 10px;font-size:10px;z-index:4}.units:hover{background:#fff2}.sun{position:absolute;right:35px;top:160px;width:105px;height:105px;border-radius:50%;background:#ffe5b1;box-shadow:0 0 55px 22px #ffe7c755,0 0 0 18px #ffeac10c,0 0 0 45px #ffeac108;opacity:0;transition:opacity 1s,transform 2s;z-index:-2;animation:glow 6s infinite}.sunny .sun{opacity:1}.cloud{position:absolute;right:-15px;top:201px;width:190px;height:65px;background:linear-gradient(#eef4ecbb,#d7e3da88);border-radius:50%;z-index:-1;filter:blur(1px);animation:drift 14s ease-in-out infinite;opacity:.7;transition:opacity 1s}.cloud:before,.cloud:after{content:'';position:absolute;background:inherit;border-radius:50%;width:92px;height:87px;left:25px;bottom:10px}.cloud:after{width:65px;height:60px;left:97px;bottom:15px}.cloud.far{transform:scale(.7);top:140px;right:5px;opacity:.2;animation-duration:20s}.rainy .cloud{opacity:1}.snowy .sun{opacity:0}.hills{position:absolute;inset:auto -1px 0;height:125px;z-index:-3;background:#456664;clip-path:polygon(0 100%,0 54%,10% 48%,22% 66%,39% 49%,57% 59%,72% 28%,85% 43%,100% 0,100% 100%);opacity:.5}.hills.back{height:170px;background:#a3b7a7;transform:scaleX(-1);opacity:.33}.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}.particle{position:absolute;top:-20px;opacity:0;animation:fall linear infinite}.rainy .particle{width:1px;height:28px;background:linear-gradient(transparent,#deedfa99);opacity:.65;transform:rotate(13deg)}.snowy .particle{width:4px;height:4px;border-radius:50%;background:#fff;opacity:.75;animation-name:snow;animation-duration:7s!important}.sunny .particle{width:3px;height:3px;background:#fff3b899;border-radius:50%;animation-name:dust;animation-duration:10s!important;opacity:.7;top:80%}
.forecast{padding:25px 28px 23px;background:#fcfcf5;color:#3d5859}.section-title{font:9px monospace;letter-spacing:1.5px;display:flex;justify-content:space-between;color:#7e9390}.section-title b{font-weight:400;color:#69807b;font-size:8px}.forecast-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:22px}.day{text-align:center;font-size:10px}.day strong{display:block;font-weight:500;margin-bottom:12px}.weather-icon{width:25px;height:25px;display:block;margin:0 auto 7px;color:#dfb165}.day span{font-size:8px;color:#8a9690;display:block}.day p{font:11px monospace;margin:9px 0 0}.day p small{font-size:10px;color:#9aa79e}.chart{height:47px;width:100%;display:block;margin:13px 0 0}.bottom{display:flex;justify-content:space-between;border-top:1px solid #dde4da;margin-top:17px;padding-top:14px;font:8px monospace;letter-spacing:.7px;color:#8c9e95}.switching{animation:change .7s ease}.note{color:#607974;text-align:center;font:9px monospace;letter-spacing:1px;margin:17px 0 0}
@keyframes glow{50%{box-shadow:0 0 65px 30px #ffe7c766,0 0 0 24px #ffeac10c,0 0 0 55px #ffeac108}}@keyframes drift{50%{translate:-16px 3px}}@keyframes fall{to{translate:-90px 440px}}@keyframes snow{to{translate:45px 430px;rotate:100deg}}@keyframes dust{to{translate:35px -330px;opacity:0}}@keyframes change{0%{opacity:.3;transform:translateY(5px)}100%{opacity:1;transform:none}}
@media(max-width:450px){body{padding:18px}.sky{padding:22px 22px 0;min-height:365px}.tabs{gap:2px}.tabs button{padding:8px 10px;font-size:10px}.temperature{font-size:88px}.sun{right:29px;width:88px;height:88px;top:159px}.cloud{right:-28px;top:198px;width:163px}.forecast{padding:23px 20px 20px}.metrics{gap:22px}.current{margin-top:27px}.live{font-size:7px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.particle{display:none}}
</style>
<div><main class="app sunny" id="app"><section class="sky"><div class="atmosphere sun-sky"></div><div class="atmosphere rain-sky"></div><div class="atmosphere snow-sky"></div><div class="hills back"></div><div class="hills"></div><div class="sun"></div><div class="cloud far"></div><div class="cloud"></div><div class="particles" id="particles" aria-hidden="true"></div>
<header><span class="brand">elsewhere.</span><span class="live">A WINDOW TO THE WEATHER</span></header><nav class="tabs" role="tablist" aria-label="City"><button role="tab" data-city="0" aria-selected="true">Lisbon</button><button role="tab" data-city="1" aria-selected="false">Kyoto</button><button role="tab" data-city="2" aria-selected="false">Reykjavík</button></nav>
<div class="current" id="current"><div class="kicker" id="place"></div><div class="temperature"><span id="temp">24</span><sup>°</sup></div><h1 class="desc" id="description"></h1><div class="metrics"><div><span>WIND</span><b id="wind"></b></div><div><span>HUMIDITY</span><b id="humidity"></b></div></div></div><button class="units" id="units" aria-label="Switch temperature unit">°C / °F</button></section>
<section class="forecast" aria-label="Five day forecast"><div class="section-title">THE NEXT FIVE DAYS <b id="unit-label">CELSIUS</b></div><div class="forecast-grid" id="forecast"></div><svg class="chart" viewBox="0 0 400 44" preserveAspectRatio="none" role="img" aria-label="Forecast high temperature trend"><defs><linearGradient id="fade" x2="0" y2="1"><stop stop-color="#b5c9ad" stop-opacity=".4"/><stop offset="1" stop-color="#b5c9ad" stop-opacity="0"/></linearGradient></defs><path id="area" fill="url(#fade)"/><path id="line" fill="none" stroke="#8ba98d" stroke-width="1.5"/><g id="dots" fill="#fcfcf5" stroke="#8ba98d"/></svg><div class="bottom"><span id="outlook">A GOOD DAY TO GET LOST.</span><span>LOCAL DEMO DATA</span></div></section></main><p class="note">SLOW DOWN. LOOK UP.</p></div>
<script>
const $=id=>document.getElementById(id),cities=[{name:'LISBON, PORTUGAL',type:'sunny',temp:24,desc:'A little sun, a little possibility.',wind:'12 km/h',humidity:'48%',high:[24,26,25,23,24],low:[17,18,18,16,17],weather:['Sun','Sun','Cloud','Cloud','Sun'],outlook:'TAKE THE SCENIC ROUTE.'},{name:'KYOTO, JAPAN',type:'rainy',temp:19,desc:'Rain on the rooftops.',wind:'8 km/h',humidity:'86%',high:[19,21,22,20,23],low:[15,16,17,16,18],weather:['Rain','Rain','Cloud','Rain','Sun'],outlook:'BRING A LITTLE SHELTER.'},{name:'REYKJAVÍK, ICELAND',type:'snowy',temp:-2,desc:'The world, a little quieter.',wind:'18 km/h',humidity:'74%',high:[-2,0,1,-1,-3],low:[-6,-4,-3,-5,-7],weather:['Snow','Cloud','Snow','Snow','Cloud'],outlook:'WRAP UP. WANDER OUT.'}];let selected=0,f=false,display=24,countFrame;const night=new Date().getHours()<6||new Date().getHours()>=18,reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
for(let i=0;i<37;i++){const p=document.createElement('i');p.className='particle';p.style.left=(i*37%103)+'%';p.style.animationDelay=(-i*.37)+'s';p.style.animationDuration=(.7+i%5*.15)+'s';$('particles').append(p)}
const convert=t=>f?Math.round(t*9/5+32):t;function icon(kind){return `<svg class="weather-icon" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">${kind==='Sun'?'<circle cx="14" cy="14" r="5"/><path d="M14 1v4m0 18v4M1 14h4m18 0h4M5 5l3 3m12 12 3 3M5 23l3-3M20 8l3-3"/>':kind==='Snow'?'<path d="M14 2v24M4 8l20 12M4 20 24 8M10 5l4 3 4-3M10 23l4-3 4 3M4 13l5-2-1-5M20 22l-1-5 5-2"/>':'<path d="M6 19a5 5 0 1 1 1-10 7 7 0 0 1 13 0 5 5 0 0 1 1 10Z"/>'+(kind==='Rain'?'<path d="m9 22-2 3m9-3-2 3m9-3-2 3"/>':'')}</svg>`}
function render(){const c=cities[selected];$('app').className='app '+c.type+(night?' night':'');document.querySelectorAll('[data-city]').forEach(b=>b.setAttribute('aria-selected',Number(b.dataset.city)===selected));$('place').textContent=c.name+' / '+(night?'NIGHT':'DAY');$('description').textContent=c.desc;$('wind').textContent=c.wind;$('humidity').textContent=c.humidity;$('outlook').textContent=c.outlook;$('unit-label').textContent=f?'FAHRENHEIT':'CELSIUS';$('units').textContent=f?'°F / °C':'°C / °F';$('current').classList.remove('switching');void $('current').offsetWidth;$('current').classList.add('switching');cancelAnimationFrame(countFrame);const from=display,to=convert(c.temp),start=performance.now();function count(t){const p=reduced?1:Math.min(1,(t-start)/600);display=from+(to-from)*(1-(1-p)**3);$('temp').textContent=Math.round(display);if(p<1)countFrame=requestAnimationFrame(count)}countFrame=requestAnimationFrame(count);
$('forecast').innerHTML=c.high.map((t,i)=>{const d=new Date();d.setDate(d.getDate()+i+1);return `<div class="day"><strong>${d.toLocaleDateString('en',{weekday:'short'})}</strong>${icon(c.weather[i])}<span>${d.getDate()} ${d.toLocaleDateString('en',{month:'short'})} · ${c.weather[i]}</span><p>${convert(t)}° <small>${convert(c.low[i])}°</small></p></div>`}).join('');const min=Math.min(...c.high)-2,max=Math.max(...c.high)+2,points=c.high.map((t,i)=>[40+i*80,35-(t-min)/(max-min)*28]),line='M'+points.map(p=>p.join(',')).join(' L');$('line').setAttribute('d',line);$('area').setAttribute('d',line+' L360,44 L40,44Z');$('dots').innerHTML=points.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.7"/>`).join('')}
document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.city);render()});document.querySelector('.tabs').onkeydown=e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();selected=e.key==='Home'?0:e.key==='End'?2:(selected+(e.key==='ArrowRight'?1:2))%3;render();document.querySelector(`[data-city="${selected}"]`).focus()};$('units').onclick=()=>{f=!f;render()};render();
</script></html>
