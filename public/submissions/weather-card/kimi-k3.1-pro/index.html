<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atmos — 城市天气切片</title>
<style>
:root{color-scheme:dark;--bg:#0b1518;--card:#132326;--ink:#edf4ee;--muted:#91a6a3;--line:#ffffff16;--accent:#f2c879;--glass:#102022a8}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 15% 5%,#284841 0,transparent 38%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background 1s}body.night{--bg:#080e1c;--card:#121c2c;--accent:#b7c8ff}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{width:min(880px,calc(100% - 32px));margin:28px auto;filter:drop-shadow(0 30px 60px #0005)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 4px 16px}.brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.22em}.brand i{width:20px;height:20px;border:1px solid var(--accent);border-radius:50%;box-shadow:inset -5px -3px 0 var(--accent)}.local{font-size:9px;letter-spacing:.14em;color:var(--muted)}
.unit{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:8px 13px;font-size:11px;font-weight:700}
.card{overflow:hidden;border:1px solid var(--line);border-radius:30px;background:var(--card)}
.cities{display:flex;gap:7px;padding:14px 18px;background:#ffffff05;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.city{flex:1;min-width:64px;border:0;border-radius:10px;padding:9px 12px;background:transparent;color:var(--muted);font-size:12px;transition:.25s}.city:hover{color:var(--ink);background:#ffffff08}.city.active{color:#172321;background:var(--accent);font-weight:750;box-shadow:0 4px 20px #0002}
.hero{position:relative;min-height:360px;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,#537d77 0%,#25464b 52%,#152b34 100%);transition:background 1s}.hero[data-type=rain]{background:linear-gradient(145deg,#4a626e,#233642 65%,#172630)}.hero[data-type=snow]{background:linear-gradient(145deg,#79909b,#3d5664 65%,#243c49)}.hero[data-type=storm]{background:linear-gradient(145deg,#414c68,#1d293c 65%,#141d2c)}.night .hero{filter:saturate(.78) brightness(.72)}
#sky,.sky-art,.flash{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#sky{z-index:-1}.sky-art{z-index:-2;overflow:hidden}.orb{position:absolute;width:150px;height:150px;border-radius:50%;right:8%;top:14%;background:#ffe3a1;box-shadow:0 0 30px #ffe8ae80,0 0 100px #ffe4a366;animation:breathe 5s ease-in-out infinite}.orb:before{content:"";position:absolute;inset:-35px;border:1px solid #ffe8ae30;border-radius:50%;animation:spin 18s linear infinite}.orb:after{content:"";position:absolute;inset:-65px;border:1px dashed #ffe8ae28;border-radius:50%}.hero:not([data-type=clear]) .orb{width:105px;height:105px;background:#d5e1df;box-shadow:0 0 60px #d5e1df30;opacity:.35}.cloud{position:absolute;width:210px;height:64px;right:4%;top:34%;border-radius:60px;background:#d7e1dd25;filter:drop-shadow(0 14px 20px #07151c30);animation:drift 9s ease-in-out infinite;opacity:0;transition:opacity .6s}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:100px;height:100px;left:30px;bottom:0}.cloud:after{width:80px;height:80px;right:25px;bottom:0}.hero:not([data-type=clear]) .cloud{opacity:1}.hero[data-type=storm] .cloud{background:#aebbd52e}.flash{background:#dce8ff;opacity:0}.hero[data-type=storm] .flash{animation:flash 6s infinite}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 45px #ffe8ae99,0 0 130px #ffe4a377}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{50%{transform:translateX(-28px)}}@keyframes flash{0%,91%,94%,100%{opacity:0}92%,93%{opacity:.22}}
.hero-content{position:relative;z-index:2;padding:34px clamp(22px,5vw,50px);transition:opacity .18s,transform .18s}.hero.swap .hero-content{opacity:0;transform:translateY(8px)}.place{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:650;letter-spacing:.06em}.place:before{content:"";width:6px;height:6px;border:1px solid var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent)}.updated{margin-left:auto;color:#e8f1ed99;font-size:10px}.main-reading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:28px}.temperature{font:250 clamp(92px,15vw,146px)/.82 ui-sans-serif,system-ui;letter-spacing:-.09em;text-shadow:0 8px 30px #0002}.temperature sup{font:400 28px/1 system-ui;vertical-align:top;position:relative;top:8px;margin-left:8px;letter-spacing:0}.description{text-align:right;max-width:250px;padding:10px 12px;border:1px solid #ffffff1c;border-radius:12px;background:#10202266;backdrop-filter:blur(8px);text-shadow:0 1px 8px #0005}.description strong{display:block;font:500 22px/1.3 Georgia,"Songti SC",serif;letter-spacing:.08em}.description span{display:block;margin-top:8px;color:#e8f1edcc;font-size:11px;letter-spacing:.1em}.metrics{display:flex;gap:28px;margin-top:42px}.metric{min-width:110px}.metric label{display:block;font-size:9px;letter-spacing:.18em;color:#e8f1ed88;margin-bottom:7px}.metric strong{font-size:14px;font-weight:550}.metric strong small{font-size:10px;color:#e8f1ed99;margin-left:4px}
.forecast{padding:24px clamp(16px,4vw,34px) 26px;background:var(--card)}.forecast-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.forecast-head strong{font-size:11px;letter-spacing:.14em}.forecast-head span{font-size:9px;color:var(--muted);letter-spacing:.1em}.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;transition:opacity .2s}.day{text-align:center;border-right:1px solid var(--line);min-width:0}.day:last-child{border:0}.day time{display:block;font-size:10px;color:var(--muted);margin-bottom:7px}.day .cond{height:30px;font-size:11px;font-weight:600}.day .range{font:500 11px/1 ui-monospace,monospace}.day .range i{font-style:normal;color:var(--muted);margin:0 3px}#chart{display:block;width:100%;height:78px;margin-top:12px;overflow:visible}.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;letter-spacing:.1em;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:520px){.app{width:calc(100% - 20px);margin:10px auto}.card{border-radius:22px}.cities{padding:10px;gap:3px}.city{padding:9px 6px;min-width:0;font-size:11px}.hero{min-height:345px}.hero-content{padding:26px 20px}.main-reading{margin-top:38px}.temperature{font-size:100px}.description{padding:8px 9px;max-width:145px}.description strong{font-size:17px}.description span{font-size:9px}.metrics{gap:14px;margin-top:50px}.metric{min-width:0;flex:1}.metric:last-child{display:none}.orb{right:-4%;top:12%;width:120px;height:120px}.cloud{right:-18%;top:36%}.forecast{padding:20px 10px}.days{gap:2px}.day .cond{font-size:10px}.day .range{font-size:10px}.day .range i{margin:0 1px}.foot span:last-child{display:none}}
@media(prefers-reduced-motion:reduce){.orb,.orb:before,.cloud,.flash{animation:none}}
</style>
</head>
<body>
<main class="app">
<div class="topbar"><div class="brand"><i></i>ATMOS</div><span class="local">LOCAL SKIES / MOCK DATA</span><button class="unit" id="unit" aria-label="切换温度单位">°C / °F</button></div>
<section class="card" aria-label="城市天气应用">
<nav class="cities" id="cities" aria-label="切换城市"></nav>
<div class="hero" id="hero" data-type="clear"><canvas id="sky"></canvas><div class="sky-art"><div class="orb"></div><div class="cloud"></div></div><div class="flash"></div>
<div class="hero-content"><div class="place"><span id="place">北京</span><span class="updated" id="updated">刚刚更新</span></div>
<div class="main-reading"><div class="temperature"><span id="temp">26</span><sup id="degree">°C</sup></div><div class="description"><strong id="condition">晴朗</strong><span id="feels">体感 27° · 能见度 24 km</span></div></div>
<div class="metrics"><div class="metric"><label>WIND / 风速</label><strong id="wind">3.2 <small>m/s</small></strong></div><div class="metric"><label>HUMIDITY / 湿度</label><strong id="humidity">32 <small>%</small></strong></div><div class="metric"><label>AIR QUALITY</label><strong id="air">优 · 28</strong></div></div></div></div>
<div class="forecast"><div class="forecast-head"><strong>NEXT 5 DAYS</strong><span>温度趋势 / 未来五日</span></div><div class="days" id="days"></div>
<svg id="chart" viewBox="0 0 500 78" preserveAspectRatio="none" role="img" aria-label="未来五天最高与最低气温折线"><path id="area" fill="url(#fade)"/><path id="highLine" fill="none" stroke="#f2c879" stroke-width="2"/><path id="lowLine" fill="none" stroke="#8da9b0" stroke-width="1.5" stroke-dasharray="4 5"/><g id="dots"></g><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2c879" stop-opacity=".22"/><stop offset="1" stop-color="#f2c879" stop-opacity="0"/></linearGradient></defs></svg>
<div class="foot"><span>数据为本地模拟 · 每座城，一种天空</span><span id="daylight">DAYLIGHT CYCLE</span></div></div>
</section></main>
<script>
const cities=[
{name:'北京',en:'BEIJING',type:'clear',temp:26,feel:27,cond:'晴朗',detail:'微风穿过槐树梢',wind:3.2,humidity:32,air:'优 · 28',days:[['周三','晴',30,18],['周四','晴间云',29,17],['周五','多云',26,16],['周六','晴',28,15],['周日','晴',31,17]]},
{name:'上海',en:'SHANGHAI',type:'rain',temp:22,feel:23,cond:'绵绵细雨',detail:'雨落在梧桐与江面',wind:4.8,humidity:86,air:'优 · 24',days:[['周三','中雨',24,19],['周四','小雨',23,18],['周五','阴',25,19],['周六','多云',27,20],['周日','晴',29,21]]},
{name:'哈尔滨',en:'HARBIN',type:'snow',temp:-2,feel:-7,cond:'轻盈小雪',detail:'松花江畔初雪将至',wind:5.6,humidity:74,air:'优 · 31',days:[['周三','小雪',1,-8],['周四','阵雪',0,-10],['周五','晴',2,-9],['周六','多云',3,-7],['周日','晴',5,-5]]},
{name:'深圳',en:'SHENZHEN',type:'storm',temp:28,feel:32,cond:'雷雨将至',detail:'海风带来潮湿云层',wind:7.1,humidity:91,air:'良 · 42',days:[['周三','雷阵雨',31,26],['周四','阵雨',30,25],['周五','多云',32,26],['周六','晴',33,27],['周日','多云',32,26]]}
];
const $=id=>document.getElementById(id),hero=$('hero'),canvas=$('sky'),ctx=canvas.getContext('2d');let index=0,unit='C',shown=cities[0].temp,particles=[],W=0,H=0,last=0;
const convert=v=>unit==='C'?v:v*9/5+32,round=v=>Math.round(convert(v));
cities.forEach((c,i)=>{const b=document.createElement('button');b.className='city'+(!i?' active':'');b.textContent=c.name;b.setAttribute('aria-pressed',String(!i));b.onclick=()=>selectCity(i);$('cities').append(b)});
function countTo(target){const from=shown,start=performance.now(),to=convert(target);shown=target;function step(t){const p=Math.min(1,(t-start)/650),e=1-Math.pow(1-p,3);$('temp').textContent=Math.round(from===target&&unit==='C'?to:e* (to-convert(from))+convert(from));if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}
function pathFor(key,min,max){return cities[index].days.map((d,i)=>`${i?'L':'M'} ${50+i*100} ${12+(max-d[key])/(max-min||1)*40}`).join(' ')}
function drawForecast(){const ds=cities[index].days,all=ds.flatMap(d=>[d[2],d[3]]),min=Math.min(...all)-2,max=Math.max(...all)+2;$('days').innerHTML=ds.map((d,i)=>{const date=new Date();date.setDate(date.getDate()+i+1);const label=i===0?'明天':`${date.getMonth()+1}/${date.getDate()} ${new Intl.DateTimeFormat('zh-CN',{weekday:'short'}).format(date)}`;return `<div class="day"><time>${label}</time><div class="cond">${d[1]}</div><div class="range">${round(d[2])}°<i>/</i>${round(d[3])}°</div></div>`}).join('');const hp=pathFor(2,min,max),lp=pathFor(3,min,max);$('highLine').setAttribute('d',hp);$('lowLine').setAttribute('d',lp);$('area').setAttribute('d',hp+' L 450 72 L 50 72 Z');$('dots').innerHTML=ds.map((d,i)=>`<circle cx="${50+i*100}" cy="${12+(max-d[2])/(max-min)*40}" r="3" fill="#f2c879" stroke="#132326" stroke-width="2"/>`).join('')}
function update(){const c=cities[index];hero.dataset.type=c.type;$('place').textContent=`${c.name} / ${c.en}`;$('condition').textContent=c.cond;$('feels').textContent=`体感 ${round(c.feel)}° · ${c.detail}`;$('wind').innerHTML=`${c.wind.toFixed(1)} <small>m/s</small>`;$('humidity').innerHTML=`${c.humidity} <small>%</small>`;$('air').textContent=c.air;$('degree').textContent='°'+unit;document.querySelectorAll('.city').forEach((b,i)=>{b.classList.toggle('active',i===index);b.setAttribute('aria-pressed',String(i===index))});drawForecast();countTo(c.temp);resize()}
function selectCity(i){if(i===index)return;hero.classList.add('swap');setTimeout(()=>{index=i;update();hero.classList.remove('swap')},180)}
$('unit').onclick=()=>{unit=unit==='C'?'F':'C';$('unit').textContent=unit==='C'?'°C / °F':'°F / °C';update()};
function resize(){const r=hero.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);const type=cities[index].type,n=type==='clear'?32:85;particles=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,v:.8+Math.random()*2,r:1+Math.random()*2,a:.15+Math.random()*.55}))}
function animate(t){const type=cities[index].type;ctx.clearRect(0,0,W,H);for(const p of particles){if(type==='clear'){p.y-=p.v*.12;p.x+=Math.sin(t*.0005+p.y)*.12;ctx.fillStyle=`rgba(255,230,170,${p.a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*.55,0,7);ctx.fill()}else if(type==='snow'){p.y+=p.v*.45;p.x+=Math.sin(t*.001+p.y*.02)*.35;ctx.fillStyle=`rgba(240,248,250,${p.a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}else{p.y+=p.v*(type==='storm'?5:3.5);p.x-=p.v*.3;ctx.strokeStyle=`rgba(190,220,235,${p.a})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+2,p.y-8-p.v*2);ctx.stroke()}if(p.y>H+15||p.y<-10||p.x<0||p.x>W){p.x=Math.random()*W;p.y=type==='clear'?H+5:-15}}requestAnimationFrame(animate)}
const hour=new Date().getHours();if(hour<6||hour>=18)document.body.classList.add('night');$('daylight').textContent=hour>=6&&hour<18?'DAYLIGHT CYCLE':'NIGHT CYCLE';new ResizeObserver(resize).observe(hero);update();requestAnimationFrame(animate);
</script>
</body></html>
