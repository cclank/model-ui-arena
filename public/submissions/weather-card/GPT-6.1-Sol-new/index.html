<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather, somewhere.</title>
<!-- 设计说明：一张会呼吸的旅途天气明信片，城市各有自己的天空。
本地模拟数据、五日曲线、温标切换与数字过渡完整联动。
晴光、雨线、雪花由代码生成，城市切换保持连续淡入淡出。 -->
<style>
*{box-sizing:border-box}body{margin:0;background:#eaece5;font-family:Arial,"PingFang SC",sans-serif;color:#233e3c;min-height:100svh;display:grid;place-items:center;padding:25px}.card{width:min(760px,100%);border:1px solid #cad1c3;border-radius:24px;overflow:hidden;box-shadow:0 24px 65px #2b423b15;background:#f9faf3}.top{padding:25px 30px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-family:Georgia,serif;font-size:23px}.brand i{color:#839a86}button{font:inherit;border:0;cursor:pointer}.units{padding:4px;background:#e6ebe2;border-radius:20px;display:flex;gap:2px}.units button{padding:6px 10px;border-radius:15px;background:transparent;font-size:11px;color:#789084}.units .active{background:#fff;color:#243f39;box-shadow:0 2px 8px #233e3c12}.scene{position:relative;height:310px;background:#ece6b9;isolation:isolate;transition:background 1s,color 1s;overflow:hidden}.scene.rain{background:#aebfbb;color:#233e3c}.scene.snow{background:#d4e1e3}.scene.night{background:#263e47;color:#e1eadb}.landscape{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.75}.orb{position:absolute;width:145px;height:145px;background:#ffe18c;border-radius:50%;top:24px;right:85px;box-shadow:0 0 65px 40px #fff3b644;transition:all 1s}.rain .orb{opacity:.15}.snow .orb{background:#eef8ec;opacity:.7}.night .orb{width:74px;height:74px;background:#dddcb7;box-shadow:0 0 50px #d6f2cb33}.weather-copy{position:relative;padding:24px 30px;transition:opacity .2s,transform .2s}.weather-copy.changing{opacity:0;transform:translateY(6px)}.cities{display:flex;gap:7px;margin-bottom:26px}.cities button{padding:8px 12px;color:inherit;background:#ffffff30;border:1px solid #ffffff50;border-radius:20px;font-size:11px}.cities .active{background:#233e3c;color:#f8f5dc;border-color:#233e3c}.loc{font-size:10px;letter-spacing:3px;opacity:.7}.temp{font-size:78px;letter-spacing:-5px;font-weight:400;line-height:1.1;margin:6px 0}.temp sup{font-size:30px;vertical-align:top;position:relative;top:10px;letter-spacing:0}.desc{font-size:13px;letter-spacing:2px}.metrics{display:flex;gap:23px;margin-top:16px;font-size:11px;opacity:.8}.weather-particle{position:absolute;pointer-events:none;z-index:3}.ray{width:3px;height:3px;background:#fff4c5;border-radius:50%;animation:drift 7s linear infinite}.drop{width:1px;height:23px;background:linear-gradient(transparent,#e6f5ef);transform:rotate(15deg);animation:rain .8s linear infinite}.flake{width:5px;height:5px;border-radius:50%;background:#fff;animation:snow 7s linear infinite}.forecast{padding:26px 30px 20px}.section-head{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:2px;margin-bottom:18px}.section-head span:last-child{color:#93a095;font-size:9px;letter-spacing:0}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;text-align:center}.day .date{font-size:10px;color:#84978c}.day svg{width:32px;height:32px;margin:10px 0}.day .label{font-size:10px;color:#627a6d}.day .range{font-size:13px;margin-top:12px}.day .low{color:#98a59a;font-size:11px;margin-left:7px}.chart{height:50px;width:100%;overflow:visible;margin:7px 0}.footer{border-top:1px solid #e1e7db;display:flex;justify-content:space-between;gap:8px;padding:17px 30px;font-size:9px;color:#7f9286;letter-spacing:1px}.footer i{width:5px;height:5px;display:inline-block;border-radius:50%;background:#769e79;margin-right:6px}@keyframes rain{from{translate:0 -80px}to{translate:-75px 370px}}@keyframes snow{from{translate:0 -70px;opacity:0}15%{opacity:1}to{translate:50px 340px;opacity:0}}@keyframes drift{0%{translate:0 40px;opacity:0}35%{opacity:.8}100%{translate:20px -140px;opacity:0}}
@media(max-width:500px){body{padding:15px}.card{border-radius:20px}.top{padding:20px}.brand{font-size:21px}.scene{height:320px}.weather-copy{padding:20px}.orb{right:26px;top:85px;width:116px;height:116px}.forecast{padding:24px 15px 14px}.days{gap:2px}.day .range{font-size:12px}.day .low{margin-left:4px}.footer{padding:16px 20px;font-size:8px}.metrics{gap:18px}.cities{margin-bottom:27px}}
@media(prefers-reduced-motion:reduce){.weather-particle{animation:none}*{transition:none!important}}
</style></head><body><main class="card"><header class="top"><div class="brand">Weather, <i>somewhere.</i></div><div class="units" aria-label="温度单位"><button class="active" id="c">°C</button><button id="f">°F</button></div></header><section class="scene" id="scene"><div class="orb"></div><svg class="landscape" viewBox="0 0 760 310" preserveAspectRatio="xMidYMid slice"><path d="M0 285Q180 120 340 232T760 200V310H0" fill="#829788" opacity=".28"/><path d="M0 315Q220 220 450 285T780 220V330H0" fill="#688a7a" opacity=".35"/><path d="M530 310v-57h5v57m35 0v-100h5v100m34 0v-75h5v75" stroke="#567569" stroke-width="2"/><path d="M520 259l12-40 12 40m15-41 13-47 14 47m9 25 15-45 15 45" fill="#577c68" opacity=".6"/></svg><div class="weather-copy" id="copy"><nav class="cities" aria-label="选择城市"><button data-city="0" class="active">杭州</button><button data-city="1">伦敦</button><button data-city="2">札幌</button></nav><div class="loc" id="location"></div><div class="temp"><span id="temperature">24</span><sup id="degree">°C</sup></div><div class="desc" id="description"></div><div class="metrics"><span id="wind"></span><span id="humidity"></span><span id="feels"></span></div></div><div id="particles" aria-hidden="true"></div></section><section class="forecast"><div class="section-head"><span>接下来的五天</span><span>HIGH / LOW</span></div><div class="days" id="days"></div><svg viewBox="0 0 500 50" class="chart" preserveAspectRatio="none" aria-label="五日最高温趋势"><defs><linearGradient id="area" x2="0" y2="1"><stop stop-color="#7f9b69" stop-opacity=".25"/><stop offset="1" stop-color="#7f9b69" stop-opacity="0"/></linearGradient></defs><path id="fill" fill="url(#area)"/><path id="line" fill="none" stroke="#90a479" stroke-width="1.5"/><g id="points" fill="#f9faf3" stroke="#90a479" stroke-width="1.5"></g></svg></section><footer class="footer"><span><i></i>一座城，一种心情。</span><span>本地模拟数据 · <span id="updated"></span></span></footer></main>
<script>
const data=[{name:'HANGZHOU / 杭州',temp:24,type:'sun',desc:'晴朗，适合去走走',wind:12,humidity:58,feels:25,high:[24,26,25,22,23],low:[17,18,17,16,17],types:['sun','sun','cloud','rain','sun']},{name:'LONDON / 伦敦',temp:15,type:'rain',desc:'细雨，把城市放慢',wind:18,humidity:86,feels:13,high:[15,16,17,14,16],low:[10,11,12,9,10],types:['rain','rain','cloud','rain','sun']},{name:'SAPPORO / 札幌',temp:-2,type:'snow',desc:'小雪，世界安静下来',wind:8,humidity:72,feels:-5,high:[-2,0,1,-1,2],low:[-7,-5,-4,-6,-3],types:['snow','snow','cloud','snow','sun']}];
const $=s=>document.querySelector(s),convert=n=>unit==='C'?Math.round(n):Math.round(n*1.8+32);let city=0,unit='C',shown=24,ticket=0,raf=0;
function icon(t){return `<svg viewBox="0 0 40 40" fill="none" stroke="#718d78" stroke-width="1.5">${t==='sun'?'<circle cx="20" cy="20" r="7" fill="#ead38d"/><path d="M20 3v5m0 24v5M3 20h5m24 0h5M8 8l4 4m16 16 4 4M8 32l4-4m16-16 4-4"/>':t==='cloud'?'<path d="M9 29h23a6 6 0 0 0 0-12 10 10 0 0 0-19-2 7 7 0 0 0-4 14Z" fill="#dce6d9"/>':`<path d="M8 23h24a6 6 0 0 0 0-12 9 9 0 0 0-17-1 7 7 0 0 0-7 13Z" fill="#dce6d9"/><path d="${t==='snow'?'M11 28v7m-3-3h6m10-4v7m-3-3h6m8-7v7m-3-3h6':'M12 28l-2 6m12-6-2 6m12-6-2 6'}"/>`}</svg>`}
function animateTemperature(target){cancelAnimationFrame(raf);let from=shown,start=performance.now();function step(t){let p=Math.min(1,(t-start)/600);shown=from+(target-from)*(1-(1-p)**3);$('#temperature').textContent=Math.round(shown);if(p<1)raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step)}
function render(){let d=data[city];$('#scene').className='scene '+(d.type==='sun'?'':d.type)+(new Date().getHours()<6||new Date().getHours()>=18?' night':'');$('#location').textContent=d.name;$('#degree').textContent='°'+unit;$('#description').textContent=d.desc;$('#wind').textContent=`风速 ${d.wind} km/h`;$('#humidity').textContent=`湿度 ${d.humidity}%`;$('#feels').textContent=`体感 ${convert(d.feels)}°`;animateTemperature(convert(d.temp));document.querySelectorAll('[data-city]').forEach((b,i)=>{b.classList.toggle('active',i===city);b.setAttribute('aria-pressed',i===city)});$('#days').innerHTML=d.high.map((h,i)=>{let date=new Date();date.setDate(date.getDate()+i+1);return `<div class="day"><div class="date">${date.getMonth()+1}/${date.getDate()}</div>${icon(d.types[i])}<div class="label">${{sun:'晴',rain:'小雨',snow:'小雪',cloud:'多云'}[d.types[i]]}</div><div class="range">${convert(h)}°<span class="low">${convert(d.low[i])}°</span></div></div>`}).join('');let lo=Math.min(...d.high)-2,hi=Math.max(...d.high)+2,points=d.high.map((h,i)=>[50+100*i,43-(h-lo)/(hi-lo)*35]);let p='M'+points.map(x=>x.join(',')).join(' L');$('#line').setAttribute('d',p);$('#fill').setAttribute('d',p+' L450,50 L50,50Z');$('#points').innerHTML=points.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.5"/>`).join('');$('#particles').innerHTML=Array.from({length:d.type==='rain'?42:24},(_,i)=>`<i class="weather-particle ${d.type==='sun'?'ray':d.type==='rain'?'drop':'flake'}" style="left:${(i*37.7)%100}%;top:${d.type==='sun'?(i*17)%100:0}%;animation-delay:-${i*.37}s;animation-duration:${d.type==='rain'?.65+i%5*.08:5+i%4}s"></i>`).join('');$('#updated').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{let token=++ticket;$('#copy').classList.add('changing');setTimeout(()=>{if(token!==ticket)return;city=Number(b.dataset.city);render();$('#copy').classList.remove('changing')},190)});['c','f'].forEach(id=>$('#'+id).onclick=()=>{unit=id.toUpperCase();$('#c').classList.toggle('active',unit==='C');$('#f').classList.toggle('active',unit==='F');render()});render();
</script></body></html>
