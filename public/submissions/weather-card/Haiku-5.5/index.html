<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气卡片</title>
<style>
@property --c1 { syntax: '<color>'; inherits: false; initial-value: #1f6fc2; }
@property --c2 { syntax: '<color>'; inherits: false; initial-value: #4a9ee8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 16px; background: #080c18; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.card { position: relative; width: min(360px, 100%); overflow: hidden; border-radius: 30px; padding: 18px 18px 20px; color: #fff; text-shadow: 0 1px 10px rgba(0, 0, 0, .2); --c1: #1f6fc2; --c2: #4a9ee8; background: linear-gradient(165deg, var(--c1), var(--c2)); transition: --c1 .9s ease, --c2 .9s ease; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 30px 60px -24px rgba(0, 0, 0, .6); }
.card.rain { --c1: #4d5b70; --c2: #18212f; }
.card.snow { --c1: #3e5577; --c2: #7f97b8; }
.card.night { --c1: #1a2452; --c2: #060a1a; }
.card.night.rain { --c1: #262f40; --c2: #0a0e17; }
.card.night.snow { --c1: #2b3f66; --c2: #0c1528; }
.fx { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .9s ease; }
.card.sun .fx-sun, .card.rain .fx-rain, .card.snow .fx-snow, .card.sun.night .fx-stars { opacity: 1; }
.orb { position: absolute; top: -20px; right: -70px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #fffbe8 0 20%, #ffe38a 32%, rgba(255, 200, 90, .4) 50%, transparent 70%); animation: pulse 5s ease-in-out infinite; }
.rays { position: absolute; top: -90px; right: -140px; width: 360px; height: 360px; border-radius: 50%; background: repeating-conic-gradient(rgba(255, 240, 190, .2) 0 5deg, transparent 5deg 15deg); -webkit-mask: radial-gradient(circle, #000 25%, transparent 70%); mask: radial-gradient(circle, #000 25%, transparent 70%); animation: spin 60s linear infinite; transition: opacity .9s ease; }
.card.night .orb { background: radial-gradient(circle, #f4f7ff 0 16%, #c3d0f5 26%, rgba(150, 175, 240, .22) 40%, transparent 62%); }
.card.night .rays { opacity: 0; }
.mote, .star, .drop, .flake { position: absolute; left: var(--x); }
.mote { top: var(--y); width: 3px; height: 3px; border-radius: 50%; background: #fff6d6; box-shadow: 0 0 8px 2px rgba(255, 236, 170, .7); opacity: 0; animation: rise var(--d) ease-in var(--dl) infinite; }
.star { top: var(--y); width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle var(--d) ease-in-out var(--dl) infinite; }
.drop { top: -30px; width: 1.5px; height: var(--h); border-radius: 2px; background: linear-gradient(rgba(220, 235, 255, 0), rgba(230, 240, 255, .95)); animation: fall var(--d) linear var(--dl) infinite; }
.flake { top: -20px; width: var(--s); height: var(--s); border-radius: 50%; background: #fff; opacity: .9; box-shadow: 0 0 6px rgba(255, 255, 255, .7); animation: fall var(--d) linear var(--dl) infinite, sway var(--sw) ease-in-out var(--dl) infinite alternate; }
@keyframes pulse { 50% { transform: scale(1.1); opacity: .8; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: .9; } 100% { opacity: 0; transform: translate(-24px, -90px); } }
@keyframes twinkle { 50% { opacity: .15; } }
@keyframes fall { to { transform: translateY(800px); } }
@keyframes sway { to { translate: 16px 0; } }
.top, .panel { position: relative; z-index: 1; }
.top { display: flex; align-items: center; gap: 8px; }
.seg { display: flex; padding: 3px; border-radius: 999px; background: rgba(6, 20, 46, .4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.cities { flex: 1; }
.seg button { flex: 1; padding: 6px 8px; border-radius: 999px; font-size: 14px; white-space: nowrap; opacity: .85; transition: background .3s, color .3s, opacity .3s; }
.units button { flex: none; padding: 6px 10px; }
.seg button.on { background: #fff; color: #16365c; font-weight: 600; opacity: 1; }
.panel { transition: opacity .26s ease, transform .26s ease; }
.panel.swap { opacity: 0; transform: translateY(8px); }
.place { display: flex; align-items: baseline; gap: 8px; margin-top: 24px; }
.place h1 { font-size: 22px; font-weight: 600; }
.place span { font-size: 14px; opacity: .8; }
.when { margin-top: 2px; font-size: 13px; opacity: .8; font-variant-numeric: tabular-nums; }
.temp { display: flex; align-items: flex-start; margin-top: 6px; font-size: 128px; font-weight: 200; line-height: 1; letter-spacing: -6px; font-variant-numeric: tabular-nums; }
.temp sup { margin: 14px 0 0 6px; font-size: 34px; font-weight: 300; letter-spacing: 0; }
.desc { margin-top: 4px; font-size: 20px; font-weight: 500; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 22px; }
.stats div { padding: 10px 14px; border-radius: 16px; background: rgba(255, 255, 255, .14); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.stats small { display: block; font-size: 12px; opacity: .8; }
.stats b { font-size: 18px; font-weight: 600; }
.fc { padding: 14px 8px 12px; border-radius: 24px; background: rgba(4, 12, 32, .3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.fc h2 { display: flex; justify-content: space-between; padding: 0 10px; font-size: 12px; font-weight: 500; letter-spacing: .06em; opacity: .9; }
.dot-hi, .dot-lo { display: inline-block; width: 10px; height: 3px; margin: 0 4px 2px 0; border-radius: 2px; vertical-align: middle; }
.dot-hi { background: #ffd66b; }
.dot-lo { background: #bfe7ff; }
#chart { display: block; width: 100%; height: auto; margin-top: 6px; overflow: visible; }
.ln { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 400; animation: draw 1.1s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 400; } }
.days { display: flex; margin-top: 4px; }
.day { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 4px 0; border-radius: 14px; font-size: 12px; }
.day:first-child { background: rgba(255, 255, 255, .12); }
.day b { font-size: 13px; font-weight: 600; }
.day small { font-size: 11px; opacity: .75; }
.day .ic { margin: 4px 0 2px; font-size: 22px; line-height: 1.25; }
.day em { font-style: normal; opacity: .9; }
.day p { display: flex; gap: 5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.day strong { font-size: 14px; font-weight: 600; }
.day p span { opacity: .6; }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="fx fx-stars" id="fx-stars"></div>
  <div class="fx fx-sun" id="fx-sun"><div class="rays"></div><div class="orb"></div></div>
  <div class="fx fx-rain" id="fx-rain"></div>
  <div class="fx fx-snow" id="fx-snow"></div>
  <header class="top">
    <div class="seg cities" id="cities"></div>
    <div class="seg units" id="units"><button data-u="C">°C</button><button data-u="F">°F</button></div>
  </header>
  <div class="panel" id="panel">
    <section>
      <div class="place"><h1 id="city"></h1><span id="en"></span></div>
      <p class="when" id="when"></p>
      <div class="temp"><span id="temp">0</span><sup>°<span id="sym">C</span></sup></div>
      <p class="desc" id="desc"></p>
      <div class="stats">
        <div><small>风速</small><b id="wind"></b></div>
        <div><small>湿度</small><b id="hum"></b></div>
      </div>
    </section>
    <section class="fc">
      <h2><span>未来 5 天</span><span><i class="dot-hi"></i>最高 <i class="dot-lo"></i>最低</span></h2>
      <svg id="chart" viewBox="0 0 324 56" aria-hidden="true"></svg>
      <div class="days" id="days"></div>
    </section>
  </div>
</main>
<script>
const CITIES = [
  { name: '台北', en: 'Taipei', kind: 'rain', desc: '午后阵雨', t: 23, wind: 16, hum: 88, days: [['rain', 24, 19], ['rain', 23, 18], ['cloud', 25, 19], ['sun', 27, 20], ['cloud', 26, 20]] },
  { name: '东京', en: 'Tokyo', kind: 'sun', desc: '晴朗少云', t: 26, wind: 9, hum: 52, days: [['sun', 27, 18], ['sun', 28, 19], ['cloud', 25, 17], ['rain', 22, 16], ['sun', 26, 17]] },
  { name: '奥斯陆', en: 'Oslo', kind: 'snow', desc: '小雪纷飞', t: -1, wind: 22, hum: 81, days: [['snow', 1, -4], ['snow', 0, -5], ['cloud', 2, -3], ['snow', 1, -3], ['cloud', 3, -2]] }
];
const WX = { sun: ['晴', '☀️'], cloud: ['多云', '⛅'], rain: ['小雨', '🌧️'], snow: ['小雪', '❄️'] };
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const $ = id => document.getElementById(id);
const card = $('card');
const pad = n => String(n).padStart(2, '0');
const R = (a, b) => (a + Math.random() * (b - a)).toFixed(2);
const spawn = (host, n, tpl) => host.insertAdjacentHTML('beforeend', Array.from({ length: n }, tpl).join(''));
let idx = 0, unit = 'C', shown = null, run = 0, tm = 0;
const toU = c => (unit === 'C' ? c : Math.round(c * 9 / 5 + 32));

spawn($('fx-stars'), 22, () => `<span class="star" style="--x:${R(0, 100)}%;--y:${R(0, 70)}%;--d:${R(2, 4)}s;--dl:-${R(0, 4)}s"></span>`);
spawn($('fx-sun'), 12, () => { const d = R(4, 7); return `<span class="mote" style="--x:${R(0, 100)}%;--y:${R(55, 100)}%;--d:${d}s;--dl:-${R(0, d)}s"></span>`; });
spawn($('fx-rain'), 60, () => { const d = R(0.7, 1.2); return `<span class="drop" style="--x:${R(0, 100)}%;--h:${R(12, 24)}px;--d:${d}s;--dl:-${R(0, d)}s"></span>`; });
spawn($('fx-snow'), 30, () => { const d = R(7, 12); return `<span class="flake" style="--x:${R(0, 100)}%;--s:${R(3, 6)}px;--d:${d}s;--dl:-${R(0, d)}s;--sw:${R(2.5, 4)}s"></span>`; });

function chart(c) {
  const hi = c.days.map(d => toU(d[1])), lo = c.days.map(d => toU(d[2]));
  const min = Math.min(...lo) - 1, max = Math.max(...hi) + 1;
  const X = i => 32.4 + 64.8 * i, Y = v => 48 - (v - min) / (max - min) * 40;
  const line = a => a.map((v, i) => `${X(i)},${Y(v)}`);
  const dots = (a, col) => a.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3.2" fill="${col}"/>`).join('');
  const H = line(hi), L = line(lo);
  return `<polygon points="${H.concat(L.slice().reverse()).join(' ')}" fill="rgba(255,255,255,.14)"/>`
    + `<polyline class="ln" points="${H.join(' ')}" stroke="#ffd66b"/>`
    + `<polyline class="ln" points="${L.join(' ')}" stroke="#bfe7ff"/>`
    + dots(hi, '#ffd66b') + dots(lo, '#bfe7ff');
}

function days(c) {
  return c.days.map((d, i) => {
    const dt = new Date();
    dt.setDate(dt.getDate() + i);
    const [kind, hi, lo] = d;
    return `<div class="day"><b>${['今天', '明天'][i] ?? WD[dt.getDay()]}</b><small>${dt.getMonth() + 1}/${dt.getDate()}</small>`
      + `<span class="ic">${WX[kind][1]}</span><em>${WX[kind][0]}</em><p><strong>${toU(hi)}°</strong><span>${toU(lo)}°</span></p></div>`;
  }).join('');
}

function clock() {
  const n = new Date(), h = n.getHours();
  $('when').textContent = `${n.getMonth() + 1}月${n.getDate()}日 ${WD[n.getDay()]} · ${pad(h)}:${pad(n.getMinutes())}`;
  card.classList.toggle('night', h < 6 || h >= 18);
}

function countTo(to) {
  const from = shown ?? 0, id = ++run, t0 = performance.now();
  const step = now => {
    if (id !== run) return;
    const p = Math.max(0, Math.min(1, (now - t0) / 800)), e = 1 - (1 - p) ** 3;
    $('temp').textContent = shown = Math.round(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function paint(anim) {
  const c = CITIES[idx], v = toU(c.t);
  card.className = `card ${c.kind}`;
  clock();
  $('city').textContent = c.name;
  $('en').textContent = c.en;
  $('desc').textContent = c.desc;
  $('sym').textContent = unit;
  $('wind').textContent = unit === 'C' ? `${c.wind} km/h` : `${Math.round(c.wind / 1.609)} mph`;
  $('hum').textContent = `${c.hum}%`;
  $('chart').innerHTML = chart(c);
  $('days').innerHTML = days(c);
  [...$('cities').children].forEach((b, i) => b.classList.toggle('on', i === idx));
  [...$('units').children].forEach(b => b.classList.toggle('on', b.dataset.u === unit));
  if (anim) countTo(v);
  else { run++; shown = v; $('temp').textContent = v; }
}

let pend = [];
function swapTo(fn) {
  pend.push(fn);
  clearTimeout(tm);
  $('panel').classList.add('swap');
  tm = setTimeout(() => { pend.forEach(f => f()); pend = []; $('panel').classList.remove('swap'); }, 260);
}

$('cities').innerHTML = CITIES.map((c, i) => `<button data-i="${i}">${c.name}</button>`).join('');
$('cities').onclick = e => { const b = e.target.closest('button'); if (b) swapTo(() => { idx = +b.dataset.i; paint(true); }); };
$('units').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.u !== unit) swapTo(() => { unit = b.dataset.u; paint(false); }); };
paint(true);
setInterval(clock, 30000);
</script>
</body>
</html>
