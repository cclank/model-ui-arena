<script>
'use strict';
/* =====================================================================
 * 皮影戏《硅谷论剑》
 * 光学投影核（全部由几何算出，禁止固定模糊/缩放冒充）：
 *   灯焰 L（幕后 z=0），人偶关节点 P（z=zP），影幕 z=zS
 *   放大率 m = zS / zP（人偶离幕越近 → zP 越小 → m 越大、影子越大）
 *   幕上投影 S = L + m·(P − L)（灯右移 → 影子左移，反向）
 *   半影 σ = 灯焰半径 f ×(zS − zP)/zP（离幕越近越虚）

const SVGNS = 'http://www.w3.org/2000/svg';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const easeIO = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);

/* ---------- 舞台常量 ---------- */
const ZS = 750;                        // 灯到幕距离
const FLAME_R = 7;                     // 灯焰半径（决定半影）
const FLOOR = 535;                     // 人偶脚底（台口）
const SCR = { x: 40, y: 60, w: 920, h: 495 };
const PSC = .42, HIPH = PSC * 92;      // 人偶舞台缩放 / 髋离地高

const defs = el('defs', null, stage);
function lg(id, stops, x1, y1, x2, y2) {

lg('gPaper', [[0, '#f6ead0'], [.5, '#eeddb8'], [1, '#e2cd9f']], 0, 0, 0, 1);
lg('gLeather', [[0, '#d9ad68'], [1, '#b3813f']], 0, 0, 1, 1);

lg('gFlame', [[0, '#fff6cf'], [.4, '#ffd978'], [1, '#e07b2a']], 0, 0, 0, 1);

const rg = el('radialGradient', { id: 'gGlow', cx: '.5', cy: '.5', r: '.5' }, defs);
el('stop', { offset: 0, 'stop-color': 'rgba(255,214,130,.85)' }, rg);
el('stop', { offset: .45, 'stop-color': 'rgba(255,180,80,.28)' }, rg);
el('stop', { offset: 1, 'stop-color': 'rgba(255,170,60,0)' }, rg);
// 幕布亮度衰减：圆心 = 灯焰投影位置（每帧更新）

// 皮影镂空刻具
function poker(id, d) { el('pattern', { id, patternUnits: 'userSpaceOnUse', width: 26, height: 26 }, defs).appendChild(el('path', { d, fill: '#f7e7bd', opacity: .9 })); }
poker('pCutA', 'M13 6 a7 7 0 1 1 -0.1 0 Z M4 20 l3 -4 M19 20 l-3 -4');
poker('pCutB', 'M13 5 l5 8 l-5 8 l-5 -8 Z');

const grain = el('pattern', { id: 'pGrain', patternUnits: 'userSpaceOnUse', width: 46, height: 46 }, defs);
{
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++)
    el('circle', { cx: (rnd() * 46).toFixed(1), cy: (rnd() * 46).toFixed(1), r: (.4 + rnd() * .8).toFixed(2), fill: 'rgba(120,90,40,.10)' }, grain);
  for (let i = 0; i < 5; i++) {
    const y = rnd() * 46;
    el('path', { d: `M0 ${y.toFixed(1)} q12 ${(rnd() - .5) * 3} 23 0 t23 0`, fill: 'none', stroke: 'rgba(120,90,40,.07)', 'stroke-width': .6 }, grain);
  }
}
// 半影：几何每帧算出 σ（幕布坐标系 px）→ 转成人偶局部坐标后写入 feGaussianBlur，
// 影子得到真实的软边；同时在面板显示数值供人工验算。详见 fShS/fShD 定义处注释。
// 破幕面具：白 = 罩布，黑 = 破洞
const vmask = el('mask', { id: 'veilMask', maskUnits: 'userSpaceOnUse', x: SCR.x, y: SCR.y, width: SCR.w, height: SCR.h }, defs);
el('rect', { x: SCR.x, y: SCR.y, width: SCR.w, height: SCR.h, fill: '#fff' }, vmask);
// 影子滤镜（每人偶一份，半影 σ 可独立实时驱动）：
//   ① feColorMatrix 整层压暗至 34% —— 透光质感：镂空处仍最亮、彩绘带色、墨线最暗、叠压更暗；
//   ② feGaussianBlur —— 真实半影软边，stdDeviation 每帧由 σ/(放大率·人偶缩放) 算出。
// ⚠ 必须挂在「直接实例化的组」上：挂在 use→defs 引用链上会让整层渲染近全透明（已实测的渲染器缺陷）。
function shadowFilter(id) {
  const f = el('filter', { id, x: '-25%', y: '-15%', width: '150%', height: '130%' }, defs);

/* =====================================================================
 * 人偶工厂（各 15 部件）：脖签轴 = 上身总成（躯干+颈+头+背旗）绕颈点倾斜；
 * 手签控双臂（肩点固定、肘部随动），余肢重力自摇；脚踩台口。
 * 返回关节表 J：帧循环只写「translate(基准) rotate(角)」复合 transform，
 * 基准位移永不被抹（旧版 setRot 直接覆写 transform 曾把关节拉回髋心）。
 * 同一工厂建两具：幕后真身（无滤镜）+ 幕上影子（hip 挂 fShS/fShD）。
 * ===================================================================== */
function partPath(d, fill, sw, parent, extra) {
  return el('path', Object.assign({ d, fill, stroke: '#241a10', 'stroke-width': sw || 1.1, 'stroke-linejoin': 'round' }, extra || {}), parent);
}
function jt(parent, tx, ty) { const e = el('g', { transform: `translate(${tx},${ty})` }, parent); return { el: e, tx, ty }; }
function buildSam() {
  const g = el('g');
  const hip = el('g', { transform: `scale(${PSC})` }, g);
  const flag = el('g', null, hip);
  el('path', { d: 'M6 -262 L6 -140', stroke: '#3a2c18', 'stroke-width': 3 }, flag);
  partPath('M6 -262 L58 -240 L6 -216 Z', 'url(#gLeather)', 1, flag);
  const ft = el('text', { x: 18, y: -232, 'font-size': 12, fill: '#2b2118', 'font-family': 'Georgia, serif' }, flag);
  ft.textContent = 'OpenAI';
  // 上身总成：绕颈点 (0,-136) 倾斜；raw 做坐标补偿，所有部件坐标与髋坐标系一致
  const body = el('g', { transform: 'translate(0,-136)' }, hip);
  const raw = el('g', { transform: 'translate(0,136)' }, body);
  partPath('M-26 0 L-30 -70 Q-32 -108 -20 -128 L20 -128 Q32 -108 30 -70 L26 0 Z', 'url(#gLeather)', 1.2, raw);
  partPath('M-24 -58 Q0 -50 24 -58 L26 -92 Q0 -84 -26 -92 Z', 'rgba(46,125,116,.55)', .8, raw);
  partPath('M-26 -128 L26 -128 L26 -136 L-26 -136 Z', 'rgba(46,125,116,.4)', .8, raw);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++)
    el('circle', { cx: -12 + j * 24, cy: -72 - i * 16, r: 3.4, fill: 'url(#pCutA)' }, raw);
  const neck = el('g', { transform: 'translate(0,-136)' }, raw);
  partPath('M-7 0 L-8 -14 L8 -14 L7 0 Z', 'url(#gLeather2)', 1, neck);
  const head = el('g', { transform: 'translate(0,-16)' }, neck);
  partPath('M-19 0 Q-21 -18 -13 -30 Q0 -38 13 -30 Q21 -18 19 0 Q10 8 0 8 Q-10 8 -19 0 Z', '#dcb478', 1.2, head);
  partPath('M-20 -14 Q-24 -34 0 -40 Q24 -34 20 -14 Q14 -26 0 -27 Q-14 -26 -20 -14 Z', '#3a2c1c', .9, head);
  partPath('M-20 -12 l-4 -10 M-12 -22 l-2 -8 M-2 -26 l0 -8 M8 -24 l2 -8 M17 -13 l4 -9', 'none', 0, head, { stroke: '#3a2c1c', 'stroke-width': 2.4, 'stroke-linecap': 'round' });
  partPath('M-12 -12 q4 -3 8 0 M4 -12 q4 -3 8 0', 'none', 0, head, { stroke: '#241a10', 'stroke-width': 1.6 });
  el('circle', { cx: -8, cy: -16, r: 1.7, fill: '#241a10' }, head);
  el('circle', { cx: 8, cy: -16, r: 1.7, fill: '#241a10' }, head);
  partPath('M0 -12 l-2 6 l2 2 l2 -2 Z', '#c9a06a', .8, head);
  partPath('M-6 -2 q6 4 12 0', 'none', 0, head, { stroke: '#241a10', 'stroke-width': 1.4 });
  partPath('M-18 -4 q-2 8 4 12 M18 -4 q2 8 -4 12 M-14 6 q0 4 5 5 M14 6 q0 4 -5 5', 'none', 0, head, { stroke: 'rgba(58,44,28,.5)', 'stroke-width': 1.1 });
  const J = { g, hip, body, pivot: 136 };
  function arm(side) {
    const s = side === 'L' ? -1 : 1;
    const sh = jt(hip, s * 26, -118);
    partPath('M0 0 Q' + s * 10 + ' 22 ' + s * 6 + ' 40', '#dcb478', 4.6, sh.el);
    const fo = jt(sh.el, s * 6, 40);
    partPath('M0 0 Q' + s * 4 + ' 20 ' + s * 2 + ' 36', '#dcb478', 4, fo.el);
    const hd = jt(fo.el, s * 2, 36);
    partPath('M-6 0 q6 -4 12 0 q-2 10 -6 10 q-4 0 -6 -10 Z', '#e8c98f', 1, hd.el);
    return { sh, fo, hd };
  }
  const aL = arm('L'), aR = arm('R');
  Object.assign(J, { armL: aL.sh, armR: aR.sh, foreL: aL.fo, foreR: aR.fo });
  function leg(side) {
    const s = side === 'L' ? -1 : 1;
    const th = jt(hip, s * 13, 0);
    partPath('M0 0 L' + s * 2 + ' 44', '#dcb478', 7.5, th.el);
    const sh = jt(th.el, s * 2, 44);
    partPath('M0 0 L' + s * 1 + ' 42', '#dcb478', 6.2, sh.el);
    const ftg = jt(sh.el, s * 1, 42);

  return J;
}
function buildDario() {

  T(J.armL, v.armL); T(J.armR, v.armR); T(J.foreL, v.foreL); T(J.foreR, v.foreR);
  T(J.thighL, v.legL); T(J.thighR, v.legR); T(J.shinL, v.legL * .4); T(J.shinR, v.legR * .4);
}
function writePuppet(J, v, py) {
  J.g.setAttribute('transform', `translate(${v.x.toFixed(1)} ${py.toFixed(1)})`);
  writeJoints(J, v);
}
function armJoint(v, side, a, fo) {
  const s = side === 'L' ? -1 : 1;
  const shx = v.x + PSC * s * 26, shy = v.foot - HIPH - PSC * 118;
  const ar = a * D2R, fr = (a + fo) * D2R;
  const x = shx + PSC * (s * 6 * Math.cos(ar) - 40 * Math.sin(ar) + s * 2 * Math.cos(fr) - 36 * Math.sin(fr));
  const y = shy + PSC * (s * 6 * Math.sin(ar) + 40 * Math.cos(ar) + s * 2 * Math.sin(fr) + 36 * Math.cos(fr));
  return { x, y };
}

/* ---------- 主循环 ---------- */
const mSamEl = $('mSam'), mDarEl = $('mDar'), bSamEl = $('bSam'), bDarEl = $('bDar'), lampPosEl = $('lampPos'), beatNameEl = $('beatName');
let last = performance.now();
function project(px, py, z) {
  const m = ZS / z;
  return { m, sigma: FLAME_R * (ZS - z) / z * .3, sx: lamp.x + (px - lamp.x) * m, sy: lamp.y + (py - lamp.y) * m };
}
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!isFinite(dt) || dt < 0) dt = .016;
  dt = Math.min(dt, .1);
  flameT += dt;
  if (playing) {
    tShow += dt;
    if (tShow > 44.5) { tShow = 0; cueIdx = 0; subLine = ''; }
    const b = beatAt(tShow);
    if (b.name !== curBeat) { curBeat = b.name; cueIdx = 0; }
    while (cueIdx < b.cues.length && tShow - b.t0 >= b.cues[cueIdx][0]) {
      const c = b.cues[cueIdx][1];
      if (c === 'drum') drum(); else if (c === 'gong') gong(); else cymbal();
      cueIdx++;
    }
    directPose(tShow);
    showSub(tShow);
  } else {
    subBar.classList.add('off');
  }
  // 灯焰摇曳 + 撞晃（离幕近者 m 大 → 影子晃得更凶，全由几何放大）
  bump = Math.max(0, bump - dt * .8);
  const fl = Math.sin(flameT * 7.3) * 1.5 + Math.sin(flameT * 13.7 + 1) * .8 + Math.sin(flameT * 3.1) * .5;
  const bumpX = bump ? Math.sin(flameT * 11) * 26 * bump : 0;
  lamp.x = lampBase.x + fl + bumpX;
  lamp.y = lampBase.y + Math.sin(flameT * 5.7 + 2) * 1.2;
  flame.setAttribute('transform', 'scale(' + (1 + Math.sin(flameT * 9.1) * .07).toFixed(3) + ')');
  lampG.setAttribute('transform', 'translate(' + lamp.x.toFixed(1) + ' ' + lamp.y.toFixed(1) + ')');
  // 幕前灯柄：随灯基位横移、固定贴台口；操演时点亮
  lampHandle.setAttribute('transform', 'translate(' + lampBase.x.toFixed(1) + ' 600)');
  lampHandle.setAttribute('opacity', perfMode ? 1 : .45);
  hFlame.setAttribute('transform', 'scale(' + (1 + Math.sin(flameT * 8.3 + 1) * .09).toFixed(3) + ')');
  // 姿态弹簧 + 重力自摆
  for (const k of ['sam', 'dar']) {
    const p = P[k], v = V[k];
    const stiff = k === 'sam' ? 11 : 11;
    v.x += (p.x - v.x) * (1 - Math.exp(-stiff * dt));
    v.z += (p.z - v.z) * (1 - Math.exp(-stiff * dt));
    v.foot += (p.foot - v.foot) * (1 - Math.exp(-7 * dt));
    v.lean += (p.lean - v.lean) * (1 - Math.exp(-9 * dt));
    v.armL += (p.armL - v.armL) * (1 - Math.exp(-9 * dt));
    v.armR += (p.armR - v.armR) * (1 - Math.exp(-9 * dt));
    v.foreL += (p.foreL - v.foreL) * (1 - Math.exp(-12 * dt));
    v.foreR += (p.foreR - v.foreR) * (1 - Math.exp(-12 * dt));
    const sway = Math.sin(flameT * 1.6 + (k === 'sam' ? 0 : 2)) * 1.8;      // 余肢自然摆动
    v.armL += sway * dt * 2.2; v.armR -= sway * dt * 2.2;
    v.legL = Math.sin(flameT * 1.1 + (k === 'sam' ? 0 : 1.7)) * 2.4;
    v.legR = -v.legL;
  }
  // 写人偶：真身两具（根位移+全身）+ 影子两具同姿（独立实例，无 defs 共享，必须分别写）
  writePuppet(R.sam, V.sam, V.sam.foot - HIPH + out * 70);
  writePuppet(R.dar, V.dar, V.dar.foot - HIPH + out * 70);
  writeJoints(S.sam, V.sam); writeJoints(S.dar, V.dar);
  propsR.sam.rack.setAttribute('opacity', P.sam.prop.toFixed(2));
  propsR.sam.rack.setAttribute('transform', 'scale(' + (0.5 + P.sam.prop * 0.5).toFixed(3) + ')');
  propsR.dar.shield.setAttribute('opacity', P.dar.prop.toFixed(2));
  propsS.sam.rack.setAttribute('opacity', P.sam.prop.toFixed(2));
  propsS.sam.rack.setAttribute('transform', 'scale(' + (0.5 + P.sam.prop * 0.5).toFixed(3) + ')');
  propsS.dar.shield.setAttribute('opacity', P.dar.prop.toFixed(2));
  // 签子（柄在台口下）
  const jS = { n: { x: V.sam.x, y: V.sam.foot - HIPH - PSC * 136 }, l: armJoint(V.sam, 'L', V.sam.armL, V.sam.foreL), r: armJoint(V.sam, 'R', V.sam.armR, V.sam.foreR) };
  const jD = { n: { x: V.dar.x, y: V.dar.foot - HIPH - PSC * 142 }, l: armJoint(V.dar, 'L', V.dar.armL, V.dar.foreL), r: armJoint(V.dar, 'R', V.dar.armR, V.dar.foreR) };
  [[rodSamNeck, 'samNeck', jS.n], [rodSamL, 'samHandL', jS.l], [rodSamR, 'samHandR', jS.r],
   [rodDarNeck, 'darNeck', jD.n], [rodDarL, 'darHandL', jD.l], [rodDarR, 'darHandR', jD.r]].forEach(([r, key, j]) => {
    const h = rodState[key];
    r.stick.setAttribute('d', 'M' + h.x + ' ' + h.y + ' L' + j.x.toFixed(1) + ' ' + j.y.toFixed(1));
    r.knob.setAttribute('cx', h.x); r.knob.setAttribute('cy', h.y);
  });
  // ===== 投影核：影子大小 / 虚实 / 位移全部由几何算出 =====
  const hipSy = V.sam.foot - HIPH, hipDy = V.dar.foot - HIPH;
  const pS = project(V.sam.x, hipSy, V.sam.z);
  const pD = project(V.dar.x, hipDy, V.dar.z);
  S.sam.g.setAttribute('transform', 'translate(' + pS.sx.toFixed(1) + ' ' + pS.sy.toFixed(1) + ') scale(' + pS.m.toFixed(4) + ')');
  S.dar.g.setAttribute('transform', 'translate(' + pD.sx.toFixed(1) + ' ' + pD.sy.toFixed(1) + ') scale(' + pD.m.toFixed(4) + ')');
  // 人偶出台后幕上不再有影（已走到光路之外）；半影软边由 σ/(m·PSC) 实时驱动（值不变则不写，免触发滤镜重算）
  S.sam.g.setAttribute('opacity', (1 - out).toFixed(2));
  S.dar.g.setAttribute('opacity', (1 - out).toFixed(2));
  const sdS = Math.max(0, pS.sigma / (pS.m * PSC)).toFixed(3), sdD = Math.max(0, pD.sigma / (pD.m * PSC)).toFixed(3);
  if (blurS.getAttribute('stdDeviation') !== sdS) blurS.setAttribute('stdDeviation', sdS);
  if (blurD.getAttribute('stdDeviation') !== sdD) blurD.setAttribute('stdDeviation', sdD);
  fall.setAttribute('cx', lamp.x.toFixed(1)); fall.setAttribute('cy', lamp.y.toFixed(1));
  mSamEl.textContent = pS.m.toFixed(2) + ' ×'; mDarEl.textContent = pD.m.toFixed(2) + ' ×';
  bSamEl.textContent = pS.sigma.toFixed(1) + ' px'; bDarEl.textContent = pD.sigma.toFixed(1) + ' px';
  lampPosEl.textContent = lamp.x.toFixed(0) + ', ' + lamp.y.toFixed(0);
  beatNameEl.textContent = playing ? beatAt(tShow).name : '操演中';
  // 对波光带（光不挡光 → 无影子）
  if (+beamA.getAttribute('opacity') > 0) {
    const cx = (pS.sx + pD.sx) / 2, cy = (pS.sy + pD.sy) / 2 - 100;
    beamA.setAttribute('d', 'M' + (pS.sx + 26).toFixed(1) + ' ' + (pS.sy - 90).toFixed(1) + ' Q' + (cx - 36).toFixed(1) + ' ' + (cy - 30).toFixed(1) + ' ' + cx.toFixed(1) + ' ' + cy.toFixed(1));
    beamB.setAttribute('d', 'M' + (pD.sx - 26).toFixed(1) + ' ' + (pD.sy - 90).toFixed(1) + ' Q' + (cx + 36).toFixed(1) + ' ' + (cy - 30).toFixed(1) + ' ' + cx.toFixed(1) + ' ' + cy.toFixed(1));
  }
  // ===== 破幕 / 罩布时间线 =====
  // 平时幕上无布（影子全亮）；「破幕」折子降下罩布并烧穿（燃烧锋面+火星）；「和局收场」残布褪去。
  const b = beatAt(tShow);
  if (playing) {
    if (b.name === '破 幕') { burn = clamp(burn + dt * 1.3, 0, 1); veilT = clamp(veilT + dt * 1.4, 0, 1); }
    else if (b.name === '和局收场') veilT = Math.max(0, veilT - dt * .9);   //  burn 不再回落：烧出的洞留在 mask 里
    else if (b.name === '开场') { burn = 0; veilT = 0; }
  }
  const hx0 = 500, hy0 = 400, hr = 10 + burn * 64;
  let d = '';
  if (burn > 0.01) {
    const n = 14;
    for (let i = 0; i <= n; i++) {
      const a = i / n * Math.PI * 2;
      const rr = hr * (1 + .22 * Math.sin(a * 5 + flameT * 2) + .12 * Math.sin(a * 9 - flameT * 3));
      d += (i ? 'L' : 'M') + (hx0 + Math.cos(a) * rr * 1.25).toFixed(1) + ' ' + (hy0 + Math.sin(a) * rr).toFixed(1);
    }
    d += 'Z';
  }
  holePath.setAttribute('d', d);
  holeRim.setAttribute('d', d);
  holeRim.setAttribute('opacity', burn > .05 && veilT > .05 ? .9 : 0);
  holeDark.setAttribute('rx', (hr * 1.1).toFixed(1)); holeDark.setAttribute('ry', (hr * .8).toFixed(1));
  holeDark.setAttribute('cx', hx0); holeDark.setAttribute('cy', hy0);
  holeDark.setAttribute('opacity', (burn * .96 * veilT).toFixed(2));
  for (const s of sparks) {
    if (burn > .2 && veilT > .1 && Math.random() < burn * .35) {
      s.x = hx0 + (Math.random() - .5) * hr; s.y = hy0 + (Math.random() - .5) * hr * .7;
      s.vx = (Math.random() - .5) * 40; s.vy = -30 - Math.random() * 50; s.life = 1;
    }
    if (s.life > 0) {
      s.life -= dt * .8; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 26 * dt;
      s.el.setAttribute('cx', s.x.toFixed(1)); s.el.setAttribute('cy', s.y.toFixed(1));
      s.el.setAttribute('opacity', Math.max(0, s.life).toFixed(2));
    } else s.el.setAttribute('opacity', 0);
  }
  veil.setAttribute('fill', 'rgba(24,17,10,' + (veilT * .66 * (1 - burn * .78)).toFixed(3) + ')');
  // ===== 全彩出场：人偶走出幕布 → 移居前台层、全彩、下台；和局收场回幕后 =====
  if (playing) {
    if (b.name === '全彩出场') out = clamp(out + dt * 1.2, 0, 1);
    else if (b.name === '和局收场') out = Math.max(0, out - dt * .8);
    else if (b.name === '开场' || b.name === '破 幕') out = 0;
  }
  if (out > .02 && R.sam.g.parentNode !== frontG) { frontG.appendChild(R.sam.g); frontG.appendChild(R.dar.g); }
  if (out <= .02 && R.sam.g.parentNode === frontG) { stage.insertBefore(R.sam.g, screenG); stage.insertBefore(R.dar.g, screenG); }
  R.sam.g.setAttribute('opacity', (.5 + out * .5).toFixed(2));
  R.dar.g.setAttribute('opacity', (.5 + out * .5).toFixed(2));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* =====================================================================
 * 操演模式：拖签子柄 / 拖油灯 / 深浅滑杆
 * ===================================================================== */
function toVB(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * 1000, y: (e.clientY - r.top) / r.height * 640 };
}
function onRodDown(e) {
  if (!perfMode) return;
  e.preventDefault(); e.stopPropagation();
  dragRod = e.currentTarget.dataset.rod;
  e.currentTarget.setPointerCapture(e.pointerId);
  $('hint').textContent = '操演中：拖动这只签子 · 面板实时显示放大率与半影';
}
function onRodMove(e) {
  if (!dragRod || !perfMode) return;
  const p = toVB(e);
  const h = rodState[dragRod];
  h.x = clamp(p.x, 60, 940); h.y = clamp(p.y, 562, 636);
  const who = dragRod.startsWith('sam') ? 'sam' : 'dar';
  if (dragRod.endsWith('Neck')) {
    P[who].x = clamp(p.x, 120, 880);
    P[who].lean = clamp((p.x - (who === 'sam' ? 400 : 600)) * .05, -14, 14);
  } else {
    const isL = dragRod.endsWith('L');
    const v = V[who];
    const cx = who === 'sam' ? v.x : v.x;
    P[who][isL ? 'armL' : 'armR'] = clamp((p.x - cx + (isL ? 26 : -26)) * 1.1, -170, 170);
    P[who][isL ? 'foreL' : 'foreR'] = clamp((624 - p.y) * 1.6, -120, 60);
  }
}
stage.addEventListener('pointermove', e => { if (perfMode) onRodMove(e); if (dragLamp) onLampMove(e); });
stage.addEventListener('pointerup', () => { dragRod = null; dragLamp = false; lampDrag0 = null; });
stage.addEventListener('pointercancel', () => { dragRod = null; dragLamp = false; lampDrag0 = null; });
/* 幕前灯柄：幕后油灯被纸幕挡住点不到，台口前沿放一个可见把手（delta 拖拽映射灯基位） */
const lampHandle = el('g', { id: 'lampHandle', cursor: 'grab' }, stage);       // 最后挂 → 最上层
el('ellipse', { cx: 0, cy: 6, rx: 30, ry: 8, fill: 'rgba(20,13,7,.5)' }, lampHandle);
el('path', { d: 'M-19 0 q19 -11 38 0 l-5 15 q-14 6 -28 0 Z', fill: '#6e5230', stroke: '#2e2214', 'stroke-width': 1 }, lampHandle);
el('path', { d: 'M-23 -13 L23 -13 L17 -1 L-17 -1 Z', fill: '#5c4426', stroke: '#2e2214', 'stroke-width': .8 }, lampHandle);
const hFlame = el('path', { d: 'M0 -33 q9 12 6 21 q-3 8 -6 8 q-3 0 -6 -8 q-3 -9 6 -21 Z', fill: 'url(#gFlame)', opacity: .95 }, lampHandle);
const hLabel = el('text', { x: 0, y: 30, 'font-size': 10, 'text-anchor': 'middle', fill: 'rgba(240,226,190,.5)', 'font-family': 'Georgia, serif', 'letter-spacing': 2 }, lampHandle);
hLabel.textContent = '拖我移灯';
lampHandle.addEventListener('pointerdown', e => {
  if (!perfMode) return;
  e.preventDefault(); e.stopPropagation();
  dragLamp = true;
  const p = toVB(e);
  lampDrag0 = { lx: lampBase.x, ly: lampBase.y, px: p.x, py: p.y };
  lampHandle.setPointerCapture(e.pointerId);
  $('hint').textContent = '拖动油灯：影子反向走 · 离幕近的影子晃得凶';
});
function onLampMove(e) {
  if (!dragLamp || !lampDrag0) return;
  const p = toVB(e);
  lampBase.x = clamp(lampDrag0.lx + (p.x - lampDrag0.px), 80, 920);
  lampBase.y = clamp(lampDrag0.ly + (p.y - lampDrag0.py), 250, 520);
}

/* ---------- 控件 ---------- */
$('btnPlay').onclick = () => { playing = !playing; $('btnPlay').textContent = playing ? '暂 停' : '播 放'; $('btnPlay').classList.toggle('on', playing); };
$('btnReplay').onclick = () => { tShow = 0; cueIdx = 0; subLine = ''; burn = 0; veilT = 0; out = 0; curBeat = ''; playing = true; $('btnPlay').textContent = '暂 停'; $('btnPlay').classList.add('on'); };
$('btnPerf').onclick = () => {
  perfMode = !perfMode;
  $('btnPerf').classList.toggle('on', perfMode);
  $('depthCtl').style.display = perfMode ? 'flex' : 'none';
  $('btnPlay').disabled = perfMode;
  if (perfMode) { playing = false; $('btnPlay').textContent = '播 放'; $('btnPlay').classList.remove('on'); $('hint').textContent = '操演模式：拖签子柄操纵人偶 · 拖油灯看影子反走 · 滑杆调离幕远近'; }
  else { playing = true; $('btnPlay').textContent = '暂 停'; $('btnPlay').classList.add('on'); $('hint').textContent = '演出中：静观 · 点「操演模式」后可拖动签子柄与油灯、调节离幕远近'; }
};
$('btnSnd').onclick = () => { sndOn = !sndOn; $('btnSnd').classList.toggle('on', sndOn); if (sndOn) ac(); };
$('zSam').oninput = e => { P.sam.z = +e.target.value; $('zSamN').textContent = e.target.value; };
$('zDar').oninput = e => { P.dar.z = +e.target.value; $('zDarN').textContent = e.target.value; };
['pointerdown', 'keydown'].forEach(t => window.addEventListener(t, () => { if (sndOn) ac(); }, { once: true }));
</script>
