<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>皮影戏 · 硅谷论剑 · 破幕</title>
<style>
  :root{--ink:#f3e3c3;--muted:rgba(243,227,195,.6);--gold:#e5b35a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#140806;color:var(--ink);font-family:"Songti SC","STSong","Noto Serif SC",serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .title{position:fixed;left:24px;top:16px;z-index:2}
  .title h1{font-size:26px;letter-spacing:.45em;font-weight:700;line-height:1.1}
  .title p{font-size:12px;letter-spacing:.3em;color:var(--muted);margin-top:6px}
  .hint{position:fixed;right:24px;top:18px;z-index:2;font-size:12px;line-height:1.85;color:var(--muted);text-align:right;letter-spacing:.06em}
  .hint b{color:var(--gold);font-weight:400;font-family:ui-monospace,Menlo,monospace;letter-spacing:0}
  .sub{position:fixed;left:50%;transform:translateX(-50%);z-index:2;font-size:clamp(14px,1.9vw,19px);letter-spacing:.2em;color:#f8e8c8;text-shadow:0 2px 14px rgba(0,0,0,.9);white-space:nowrap;transition:opacity .45s;max-width:94vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  .ctrl{position:fixed;left:50%;transform:translateX(-50%);z-index:2;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;width:max-content;max-width:calc(100% - 20px)}
  button{font:inherit;font-size:13px;letter-spacing:.16em;color:var(--ink);background:rgba(243,227,195,.07);border:1px solid rgba(243,227,195,.25);border-radius:999px;padding:9px 16px;cursor:pointer;transition:.2s}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.on{background:var(--gold);border-color:var(--gold);color:#2a1206}
  .free{display:none;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.1em}
  .free.show{display:flex}
  input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:4px;border-radius:9px;background:rgba(243,227,195,.22);outline:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid #3a1a0c;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid #3a1a0c}
  @media (max-width:760px){.title{left:14px;top:10px}.title h1{font-size:20px}.title p{display:none}.hint{display:none}button{padding:8px 11px;font-size:12px;letter-spacing:.08em}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="g" style="pointer-events:none;visibility:hidden"></canvas>
<div class="title"><h1>皮影戏</h1><p>硅谷论剑 · 破幕</p></div>
<div class="hint" id="hint"></div>
<div class="sub" id="sub"></div>
<div class="ctrl" id="ctrl"><button id="bShow" class="on">重新开演</button><button id="bFree">自己演</button><button id="bSound">锣鼓：开</button><button id="bVoice">配音：开</button>
  <span class="free" id="freeBox"><span id="selName">Sam</span>离幕<input type="range" id="depth" min="0" max="100" value="6"><button id="bFlip">转身</button></span></div>
<script>
"use strict";
/* ==========================================================================
   皮影戏 · 硅谷论剑（Sam 大战 Dario）—— 光学真实的皮影戏台（Canvas 2D，零依赖）
   光学：灯在 z = 0，幕在 z = 1，人偶在 z = d（0 < d < 1），三者平行。
     · 灯上一点 l 把人偶上一点 x 投到幕上：X = l + (x − l) / d
       → 放大率 m = 1/d：人偶离幕越远（d 越小），影子越大
       → 油灯移动 ΔL，影子移动 ΔL·(1 − 1/d)：与灯反向；贴幕的布景（d = 1）纹丝不动
     · 灯焰有大小：对灯焰上 N 个采样点各投影一次再取平均 = 真实半影
       半影半宽 = 灯焰半径 × (1 − d) / d：贴幕时锐利，离幕时发虚（灯焰高于宽，所以竖向更虚）
   透光：幕上亮度 = 灯光 × 透过率。人偶先画进“吸收层”（吸收 = 1 − 透过率，两层皮叠压处吸收相加），
     对 N 个灯焰采样点平移叠加取平均，再与白底做 difference 得到透过率，最后与灯光 multiply。
     镂空处透过率为 1（最亮），彩绘半透明带色，墨线几乎不透光。
   骨骼：脖签控身体，手签控双手（FABRIK）；四肢是带关节限位的 Verlet 链，受重力摆动，脚踩台口。
   ========================================================================== */
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), $ = (i) => document.getElementById(i);
const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t), ease = (T, a, b) => smooth(clamp((T - a) / (b - a), 0, 1));
const bell = (T, a, b, r = 0.25) => ease(T, a, a + (b - a) * r) * (1 - ease(T, b - (b - a) * r, b));
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const noise1 = (x) => { const i = Math.floor(x), f = x - i; return lerp(hash(i), hash(i + 1), f * f * (3 - 2 * f)) * 2 - 1; };

/* 幕布坐标 1000 × 600（y 向下），台口在 y = 575 */
const SW = 1000, SH = 600, FLOOR = 575, STAND_W = FLOOR - 236, STAND_T = FLOOR - 102;
const lamp = { x: 500, y: 240, bx: 500, by: 240, rx: 9, ry: 22, glow: 1, gust: 0 };   // 灯在幕上的正投影位置，灯焰半径（幕坐标）
const N_S = 10, SAMPLES = Array.from({ length: N_S }, (_, i) => { const r = Math.sqrt((i + 0.5) / N_S), a = i * 2.39996; return [Math.cos(a) * r, Math.sin(a) * r]; });   // 灯焰上的螺旋采样
const optics = (d) => ({ m: 1 / d, penX: (lamp.rx * (1 - d)) / d, penY: (lamp.ry * (1 - d)) / d });

/* 牛皮颜色以“透过率”书写，画进吸收层时自动转成 1 − 透过率 */
const TR = {
  leather: [0.96, 0.8, 0.52], red: [0.96, 0.3, 0.16], green: [0.34, 0.7, 0.36], teal: [0.26, 0.58, 0.62], blue: [0.3, 0.44, 0.8],
  yellow: [1, 0.8, 0.3], orange: [1, 0.56, 0.16], ink: [0.07, 0.06, 0.05], dark: [0.2, 0.17, 0.14], skin: [1, 0.87, 0.68], white: [1, 0.98, 0.9],
};
let COLOR = false;
const ab = (k, a = 1) => { const t = TR[k]; if (COLOR) return `rgba(${Math.round(t[0] * 255)},${Math.round(t[1] * 255)},${Math.round(t[2] * 255)},${a})`; return `rgba(${Math.round((1 - t[0]) * 255)},${Math.round((1 - t[1]) * 255)},${Math.round((1 - t[2]) * 255)},${a})`; };
let INK = ab("ink", 0.88);

let W = 0, H = 0, dpr = 1, K = 1;
const scr = { x: 0, y: 0, w: 0, h: 0, b: 0 };
const mk = () => document.createElement("canvas");
const sharp = mk(), acc = mk(), trans = mk(), scen = mk(), paper = mk(), frameL = mk();
const sctx = sharp.getContext("2d"), actx = acc.getContext("2d"), tctx = trans.getContext("2d");

/* ---------- 锣鼓（WebAudio 合成） ---------- */
let AC = null, master = null, soundOn = true;
function initAudio() { try { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.8; const comp = AC.createDynamicsCompressor(); comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 5; master.connect(comp).connect(AC.destination); } if (AC.state === "suspended") AC.resume(); } catch (e) { AC = null; } }
const audioReady = () => AC && soundOn && AC.state === "running";
function noiseBuf(dur) { const n = Math.max(1, (AC.sampleRate * dur) | 0), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; return b; }
function env(g, t0, a, peak, dec) { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + dec); }
function noiseHit(t0, dur, type, freq, q, peak) { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf(dur + 0.05); f.type = type; f.frequency.value = freq; f.Q.value = q; env(g, t0, 0.004, peak, dur); s.connect(f).connect(g).connect(master); s.start(t0); s.stop(t0 + dur + 0.06); }
function tone(t0, f0, f1, dur, peak, type = "sine") { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur); env(g, t0, 0.006, peak, dur); o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05); }
const SFX = {
  ban(d = 0) { if (!audioReady()) return; const t = AC.currentTime + d; noiseHit(t, 0.07, "bandpass", 2100, 3, 0.5); tone(t, 1100, 700, 0.06, 0.25, "triangle"); },   // 板鼓
  xiao(d = 0) { if (!audioReady()) return; const t = AC.currentTime + d; tone(t, 640, 780, 0.7, 0.22); tone(t, 1480, 1720, 0.5, 0.08); noiseHit(t, 0.12, "highpass", 3000, 0.7, 0.08); },   // 小锣：音高上扬“台”
  gong(d = 0) { if (!audioReady()) return; const t = AC.currentTime + d; [[1, 0.3], [1.51, 0.12], [2.14, 0.08], [2.8, 0.05]].forEach(([k, g]) => tone(t, 205 * k, 170 * k, 2.4, g)); noiseHit(t, 0.25, "bandpass", 900, 0.8, 0.15); },   // 大锣：音高下沉“哐”
  bo(d = 0) { if (!audioReady()) return; const t = AC.currentTime + d; noiseHit(t, 0.7, "highpass", 5200, 0.5, 0.28); noiseHit(t, 0.25, "bandpass", 7600, 2, 0.12); },   // 钹
  growl(d = 0) {
    if (!audioReady()) return; const t = AC.currentTime + d, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
    s.buffer = noiseBuf(1.6); f.type = "lowpass"; f.frequency.value = 190; f.Q.value = 6; env(g, t, 0.15, 0.9, 1.3); l.frequency.value = 23; lg.gain.value = 0.45;
    l.connect(lg).connect(g.gain); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + 1.6); l.start(t); l.stop(t + 1.6);
  },
  wind(d = 0) {
    if (!audioReady()) return; const t = AC.currentTime + d, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf(2.2); f.type = "bandpass"; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(1400, t + 1); f.frequency.exponentialRampToValueAtTime(400, t + 2);
    env(g, t, 0.5, 0.35, 1.6); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + 2.2);
  },
  roll(dur = 2.2, d = 0) { for (let x = 0; x < dur; ) { SFX.ban(d + x); x += lerp(0.2, 0.06, x / dur); } },   // 急急风：由慢到快
};


/* 本戏新增的颜色与音效 */
Object.assign(TR, { gray: [0.62, 0.64, 0.67], terra: [0.95, 0.47, 0.3], cream: [1, 0.95, 0.82], jean: [0.36, 0.5, 0.86], gold: [1, 0.86, 0.36], pcb: [0.3, 0.72, 0.42] });
Object.assign(lamp, { shx: 0, shy: 0 });
Object.assign(SFX, {
  zap(d = 0) { if (!audioReady()) return; const t = AC.currentTime + d; tone(t, 1800, 160, 0.9, 0.12, "sawtooth"); tone(t, 900, 80, 0.9, 0.1, "square"); noiseHit(t, 0.8, "bandpass", 3000, 1.5, 0.12); },   // 光线
  boing(d = 0) { if (!audioReady()) return; const t = AC.currentTime + d; tone(t, 180, 620, 0.35, 0.35); tone(t + 0.3, 620, 240, 0.3, 0.2); },
  clink(d = 0) { if (!audioReady()) return; const t = AC.currentTime + d; tone(t, 3200 + Math.random() * 900, 2600, 0.12, 0.06, "triangle"); },
  tweet(d = 0) { if (!audioReady()) return; const t = AC.currentTime + d; for (let i = 0; i < 4; i++) tone(t + i * 0.13, 2200, 3100, 0.1, 0.05); },
  whoosh(d = 0) {
    if (!audioReady()) return; const t = AC.currentTime + d, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf(0.6); f.type = "bandpass"; f.Q.value = 2; f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(3000, t + 0.4); env(g, t, 0.08, 0.3, 0.45); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + 0.6);
  },
});

/* ---------- 牛皮部件：外形 + 镂空（evenodd 挖孔），路径按部件缓存 ---------- */
const PATHS = new Map();
function shape(key, build) { let p = PATHS.get(key); if (!p) { p = new Path2D(); build(p); PATHS.set(key, p); } return p; }
function piece(c, key, fill, build, lw = 1.5) { const p = shape(key, build); c.fillStyle = ab(fill); c.fill(p, "evenodd"); c.lineWidth = lw; c.lineJoin = "round"; c.strokeStyle = INK; c.stroke(p); }
function inkLine(c, pts, w = 1.6) { c.lineWidth = w; c.lineCap = c.lineJoin = "round"; c.strokeStyle = INK; c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke(); }
const Hc = {
  lozenges(p, x0, y0, x1, y1, s, k = 0.3) { for (let y = y0, r = 0; y <= y1; y += s * 0.8, r++) for (let x = x0 + (r % 2) * s * 0.5; x <= x1; x += s) { const h = s * k; p.moveTo(x, y - h); p.lineTo(x + h * 0.75, y); p.lineTo(x, y + h); p.lineTo(x - h * 0.75, y); p.closePath(); } },
  dots(p, pts, r) { for (const [x, y] of pts) { p.moveTo(x + r, y); p.arc(x, y, r, 0, TAU); } },
  spiral(p, x, y, r) { for (let k = 0; k < 3; k++) { const rr = r * (1 - k * 0.3), a = k * 2.1, o = rr * 0.26; p.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); p.arc(x, y, rr, a, a + Math.PI * 1.25); p.arc(x + Math.cos(a + 2) * o, y + Math.sin(a + 2) * o, rr * 0.7, a + Math.PI * 1.25, a, true); p.closePath(); } },
  slit(p, x0, y0, x1, y1, w) { const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1, nx = (-dy / l) * w * 0.5, ny = (dx / l) * w * 0.5; p.moveTo(x0 + nx, y0 + ny); p.lineTo(x1, y1); p.lineTo(x0 - nx, y0 - ny); p.closePath(); },
};
function rivet(c) { piece(c, "rivet", "leather", (p) => { p.moveTo(3.6, 0); p.arc(0, 0, 3.6, 0, TAU); p.moveTo(1.4, 0); p.arc(0, 0, 1.4, 0, TAU); }, 1); }   // 关节铆钉

function carve(c, chars, x, y, size, vertical = true) {                  // 镂字：在临时层上用 destination-out 挖空
  c.save(); c.globalCompositeOperation = "destination-out"; c.fillStyle = "#000"; c.font = `700 ${size}px "STKaiti","KaiTi","Kaiti SC","Songti SC",serif`; c.textAlign = "center"; c.textBaseline = "middle";
  [...chars].forEach((ch, i) => c.fillText(ch, vertical ? x : x + i * size * 1.05, vertical ? y + i * size * 1.05 : y)); c.restore();
}
function plaque(c, lines, cx, cy, size) {                               // 红底镂字戏牌
  const cols = Math.max(...lines.map((l) => [...l].length)), w = size * (cols * 1.08 + 1.1), h = size * (lines.length * 1.1 + 0.9), x = cx - w / 2, y = cy - h / 2, p = new Path2D();
  p.moveTo(x + 10, y); p.lineTo(x + w - 10, y); p.quadraticCurveTo(x + w, y, x + w, y + 10); p.lineTo(x + w, y + h - 10); p.quadraticCurveTo(x + w, y + h, x + w - 10, y + h); p.lineTo(x + 10, y + h); p.quadraticCurveTo(x, y + h, x, y + h - 10); p.lineTo(x, y + 10); p.quadraticCurveTo(x, y, x + 10, y); p.closePath();
  c.fillStyle = ab("red"); c.fill(p); c.lineWidth = 3; c.strokeStyle = INK; c.stroke(p); c.lineWidth = 1.2; c.strokeRect(x + 7, y + 7, w - 14, h - 14);
  lines.forEach((l, i) => carve(c, l, cx - (([...l].length - 1) * size * 1.05) / 2, cy - h / 2 + size * (0.95 + i * 1.1), size, false));
}


/* ---------- 人物：Sam（OpenAI，居左）与 Dario（Anthropic，居右），都用生角“空脸”画法 ---------- */
function limbs(k, sleeve, pants, shoe) {
  return {
    upper(c, L) { piece(c, k + ".ua" + L, sleeve, (p) => { p.moveTo(10, -4); p.arc(0, -4, 10, 0, Math.PI, true); p.bezierCurveTo(-11, 14, -9, L - 10, -7, L + 3); p.lineTo(7, L + 3); p.bezierCurveTo(9, L - 10, 11, 14, 10, -4); p.closePath(); Hc.lozenges(p, 0, 9, 0, L - 7, 8, 0.3); }, 1.4); rivet(c); },
    lower(c, L) {
      piece(c, k + ".la" + L, sleeve, (p) => { p.moveTo(-7, -3); p.lineTo(7, -3); p.lineTo(6, L - 8); p.lineTo(-6, L - 8); p.closePath(); Hc.dots(p, [[0, 9], [0, 19]], 2); }, 1.3);
      piece(c, k + ".fist" + L, "skin", (p) => { p.moveTo(8, L); p.bezierCurveTo(8, L - 9, -8, L - 9, -8, L); p.bezierCurveTo(-8, L + 9, 8, L + 9, 8, L); p.closePath(); }, 1.3);
      inkLine(c, [[-4, L - 1], [5, L - 1]], 0.9); inkLine(c, [[-4, L + 3], [5, L + 3]], 0.9); rivet(c);
    },
    thigh(c, L) { piece(c, k + ".th" + L, pants, (p) => { p.moveTo(13, -2); p.arc(0, -2, 13, 0, Math.PI, true); p.lineTo(-10, L); p.lineTo(10, L); p.closePath(); Hc.lozenges(p, -4, 10, 4, L - 8, 9, 0.3); }, 1.4); rivet(c); },
    shin(c, L) {
      piece(c, k + ".sh" + L, pants, (p) => { p.moveTo(-9, -3); p.lineTo(9, -3); p.lineTo(8, L - 12); p.lineTo(-8, L - 12); p.closePath(); }, 1.3);
      piece(c, k + ".shoe" + L, shoe, (p) => { p.moveTo(-9, L - 13); p.lineTo(8, L - 13); p.bezierCurveTo(12, L - 5, 20, L - 3, 26, L + 1); p.bezierCurveTo(29, L + 7, 22, L + 9, 10, L + 9); p.lineTo(-10, L + 9); p.closePath(); Hc.dots(p, [[2, L - 4], [10, L - 1]], 1.6); }, 1.3);
      inkLine(c, [[-10, L + 7], [25, L + 7]], 1.8); rivet(c);
    },
  };
}
function flag(c, key, fill, text, flip) {                                // 背旗：写着门派名号（翻身时把字再翻回来，保证可读）
  inkLine(c, [[-14, 30], [-40, -152]], 3.2);
  piece(c, key, fill, (p) => { p.moveTo(-39, -148); p.lineTo(-112, -154); p.lineTo(-99, -125); p.lineTo(-110, -96); p.lineTo(-33, -98); p.closePath(); Hc.dots(p, [[-44, -140], [-44, -106]], 2.2); }, 1.6);
  c.save(); c.translate(-72, -123); c.scale(flip, 1); c.fillStyle = INK; c.font = `700 ${text.length > 7 ? 12 : 15}px Georgia, "Times New Roman", serif`; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(text, 0, 0); c.restore();
  c.fillStyle = ab("gold"); c.beginPath(); c.arc(-40, -154, 4, 0, TAU); c.fill();
}
const NECK = (p) => { p.moveTo(-6, -16); p.lineTo(8, -12); p.lineTo(10, 5); p.lineTo(-8, 5); p.closePath(); };
const TORSO = (p) => { p.moveTo(-25, 4); p.bezierCurveTo(-8, -4, 18, -4, 27, 6); p.bezierCurveTo(34, 30, 32, 70, 26, 124); p.lineTo(-24, 124); p.bezierCurveTo(-30, 70, -32, 30, -25, 4); p.closePath(); };
const SAM = {
  head(c) {                                                              // 漫画式神似：短发前额一撮上翘、浓平眉、招牌大眼睛、下巴圆
