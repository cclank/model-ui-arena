<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>皮影戏 · 硅谷论剑</title>
<!--
  《硅谷论剑 · Sam 大战 Dario》— 单文件 · 零依赖 · Canvas 2D + WebAudio
  ── 投影模型（全部由几何算出，没有固定模糊/随意缩放）──────────────────────────────────
     灯 L = (Lx, Ly)，灯到幕的距离 zL；人偶所在平面平行于幕，离幕 z（= 灯到人偶 zL − z）。
     放大率  m = zL / (zL − z)           影点 S = L + (P − L)·m      → 移动油灯时，离幕的影子反向移动，贴幕布景（z≈0, m≈1）不动
     半影    w = 2·r·z / (zL − z)        r = 灯焰半径（相似三角形）  → 离幕越远越虚
     半影用“对灯焰圆盘取样”得到：每个样本点是一次硬影（灯位偏移 δ 使影平移 δ·(1−m)），N 张硬影平均即软影。
  ── 透光：每层皮先在暂存层内相乘（两层叠压更暗），N 个样本累加成覆盖率+颜色，再与已被灯光照亮的纸相乘：
     镂空处不画（最亮）、彩绘 = 半透明有色、墨线 ≈ 不透光。
  ── 人偶：脖签控身体、两根手签控双手；肘/膝由重力驱动的 Verlet 粒子 + 关节限位（不能反折）；脚踩台口，走动时自动迈步。
-->
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0a0605;color:#f4e8d0;font-family:"Kaiti TC","STKaiti","KaiTi",-apple-system,"PingFang TC","PingFang SC",serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#title{position:fixed;left:0;right:0;top:32%;text-align:center;pointer-events:none;transition:opacity 1.2s;letter-spacing:.35em;text-shadow:0 0 30px rgba(255,180,90,.6)}
#title b{display:block;font-size:clamp(28px,6vw,64px);color:#f7d98a;font-weight:700}
#title span{display:block;margin-top:10px;font-size:clamp(14px,2.2vw,22px);color:#e9cfa0;letter-spacing:.5em}
#sub{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);width:min(94vw,920px);text-align:center;pointer-events:none;transition:opacity .4s;font-size:clamp(17px,2.6vw,28px);line-height:1.5;text-shadow:0 2px 10px #000,0 0 3px #000}
#sub b{display:inline-block;margin-right:.6em;padding:0 .55em;border-radius:6px;font-size:.62em;vertical-align:.12em;color:#1a0d05;letter-spacing:.2em}
#sub i{font-style:normal;color:rgba(255,255,255,.28)}#sub u{text-decoration:none;color:#fff}
#hud{position:fixed;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{font:600 13px -apple-system,"PingFang TC",sans-serif;color:#f4e8d0;background:rgba(30,18,10,.7);border:1px solid rgba(255,220,150,.3);border-radius:10px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px)}
button:hover{border-color:#f7d98a}button[aria-pressed=true]{background:#e2a94b;color:#241205;border-color:#e2a94b}
#panel{position:fixed;left:10px;bottom:64px;width:min(330px,calc(100vw - 20px));padding:10px 12px;border-radius:12px;background:rgba(20,12,8,.78);border:1px solid rgba(255,220,150,.25);backdrop-filter:blur(10px);font:11px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#f0dcb8;display:none}
#panel h4{font:600 12px -apple-system,sans-serif;color:#f7d98a;margin-bottom:4px;letter-spacing:.1em}#panel td{padding:1px 6px 1px 0;white-space:nowrap}#panel td:first-child{color:#fff}
#ctl{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(96vw,760px);padding:8px 12px;border-radius:14px;background:rgba(20,12,8,.82);border:1px solid rgba(255,220,150,.25);display:none;gap:6px 16px;flex-wrap:wrap;font:12px -apple-system,"PingFang TC",sans-serif;align-items:center}
#ctl label{display:flex;gap:6px;align-items:center;color:#f0dcb8}#ctl input{width:110px;accent-color:#e2a94b}#ctl output{min-width:34px;font-family:ui-monospace,monospace;color:#fff}
#hint{position:fixed;left:0;right:0;bottom:18px;text-align:center;pointer-events:none;font-size:13px;color:#f7d98a;letter-spacing:.2em;animation:bl 1.8s ease-in-out infinite}
@keyframes bl{50%{opacity:.35}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="title"><b>硅谷论剑</b><span>Sam 大战 Dario</span></div>
<div id="sub"></div>
<div id="hud"><button id="bplay">重演</button><button id="bop" aria-pressed="false">自己演</button><button id="bsnd" aria-pressed="false">锣鼓：关</button><button id="bpan" aria-pressed="false">投影数据</button></div>
<aside id="panel"></aside>
<div id="ctl">
  <label>Sam 离幕<input id="zs" type="range" min="0" max="52" step=".5" value="12"><output id="zso"></output></label>
  <label>Dario 离幕<input id="zd" type="range" min="0" max="52" step=".5" value="12"><output id="zdo"></output></label>
  <label>灯距幕<input id="zl" type="range" min="45" max="110" step="1" value="72"><output id="zlo"></output></label>
  <label>灯焰半径<input id="fr" type="range" min=".4" max="4" step=".1" value="1.6"><output id="fro"></output></label>
  <button id="bbump">撞灯</button><span style="color:#c9b48a">拖：人偶脖/手（金/蓝点）· 灯（橙点）</span>
</div>
<div id="hint">轻触任意处 · 开启锣鼓，并从头开演</div>
<script>
'use strict';
const $ = s => document.querySelector(s), TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t, sst = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rngf = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const RN = rngf(31), nz = (t, s = 0) => Math.sin(t * 1.7 + s) * .5 + Math.sin(t * 2.9 + s * 1.7 + 1.3) * .3 + Math.sin(t * 5.3 + s * .6 + 2.1) * .2;

/* ═══════════ 1. 灯与投影 ═══════════ */
const LAMP = { x: 80, y: 36, z: 72, r: 1.6, ox: 0, oy: 0, vx: 0, vy: 0, fx: 0, fy: 0, br: 1 };
const lampPos = () => ({ x: LAMP.x + LAMP.ox + LAMP.fx, y: LAMP.y + LAMP.oy + LAMP.fy });
const magOf = z => LAMP.z / Math.max(2, LAMP.z - z);                     // 放大率 m = zL / (zL − z)
const penOf = z => 2 * LAMP.r * z / Math.max(2, LAMP.z - z);              // 半影全宽（屏幕上的长度）
const toScreen = (x, y, z, L = lampPos()) => { const m = magOf(z); return { x: L.x + (x - L.x) * m, y: L.y + (y - L.y) * m }; };
const toPlane = (sx, sy, z, L = lampPos()) => { const m = magOf(z); return { x: L.x + (sx - L.x) / m, y: L.y + (sy - L.y) / m }; };
const toPlaneRef = (sx, sy, z) => toPlane(sx, sy, z, { x: LAMP.x, y: LAMP.y });        // 编排用：以静止灯位为参考
const SCR_W = 160, SCR_H = 96;

/* ═══════════ 2. 画布、视野与静态层 ═══════════ */
const cv = $('#cv'), ctx = cv.getContext('2d'), mkc = () => { const c = document.createElement('canvas'); return [c, c.getContext('2d')]; };
const [scr, sctx] = mkc(), [tmp, tctx] = mkc(), [acc, actx] = mkc(), [bd, bctx] = mkc(), [tex, xctx] = mkc();
let VIEW = { x0: 0, x1: 160 }, SR = { x: 0, y: 0, w: 1, h: 1 }, KP = 6, W = 1, H = 1, DPR = 1;
const PAL = { leather: [.96, .80, .55], skin: [.95, .70, .46], red: [.90, .24, .18], green: [.24, .66, .40], teal: [.22, .68, .64], blue: [.28, .46, .84], yellow: [.99, .88, .40], grey: [.68, .76, .86], brown: [.60, .36, .20], hair: [.14, .10, .08], ink: [.05, .045, .04], gold: [.98, .78, .30], orange: [.97, .55, .20], sage: [.74, .88, .68], white: [.99, .97, .92] };
const rgb = c => `rgb(${c.map(v => v * 255 | 0)})`;
function layout() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const portrait = W / H < .95; VIEW = portrait ? { x0: 26, x1: 134 } : { x0: 0, x1: 160 }; const vw = VIEW.x1 - VIEW.x0, asp = vw / SCR_H;
  const availW = W - 22, availH = H - (portrait ? 190 : 150); const w = Math.min(availW, availH * asp), h = w / asp; SR = { x: (W - w) / 2, y: Math.max(52, (H - h) / 2 - (portrait ? 24 : 26)), w, h };
  const dp = Math.min(DPR, 1.5), pw = Math.round(w * dp), ph = Math.round(h * dp); KP = pw / vw; for (const c of [scr, tmp, acc, bd, tex]) { c.width = pw; c.height = ph; }
  buildTexture(); buildBackdrop();
}
function buildTexture() {                                                   // 纸的纤维与斑：相乘用（白色 = 不变）
  const c = xctx, w = tex.width, h = tex.height, r = rngf(7); c.fillStyle = '#fff'; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) { const x = r() * w, y = r() * h, rad = (30 + r() * 120) * KP / 6, g = c.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, `rgba(190,150,90,${.05 + r() * .06})`); g.addColorStop(1, 'rgba(190,150,90,0)'); c.fillStyle = g; c.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
  c.lineCap = 'round'; for (let i = 0; i < 2600; i++) { const x = r() * w, y = r() * h, a = r() * TAU, l = (3 + r() * 10) * KP / 6; c.strokeStyle = `rgba(${r() < .5 ? '120,84,40' : '255,255,255'},${.04 + r() * .07})`; c.lineWidth = .5 + r() * .8; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke(); }
}
/* 路径小工具 */
function crS(pts, closed, per = 8) {
  const n = pts.length, out = [], g = i => closed ? pts[((i % n) + n) % n] : pts[clamp(i, 0, n - 1)], segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) { const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2); for (let k = 0; k < per; k++) { const t = k / per, t2 = t * t, t3 = t2 * t; out.push([0, 1].map(d => .5 * (2 * p1[d] + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3))); } }
  if (!closed) out.push(pts[n - 1]); return out;
}
function addPoly(p, pts, per = 1, closed = true) { const s = per > 1 ? crS(pts, closed, per) : pts; s.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); if (closed) p.closePath(); }
const poly = (pts, per = 1) => { const p = new Path2D(); addPoly(p, pts, per); return p; };
const circ = (p, x, y, r) => { p.moveTo(x + r, y); p.arc(x, y, r, 0, TAU); };
const ell = (p, x, y, rx, ry, rot = 0) => { p.moveTo(x + rx * Math.cos(rot), y + rx * Math.sin(rot)); p.ellipse(x, y, rx, ry, rot, 0, TAU); };
const rect = (p, x, y, w, h) => { p.moveTo(x, y); p.lineTo(x + w, y); p.lineTo(x + w, y + h); p.lineTo(x, y + h); p.closePath(); };

/* ═══════════ 3. 布景：贴幕的镂空剪纸（硅谷元素，z≈0，永远锐利、灯移它不动）═══════════ */
function buildBackdrop() {
  const c = bctx; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, bd.width, bd.height); c.setTransform(KP, 0, 0, KP, -VIEW.x0 * KP, 0); c.globalCompositeOperation = 'multiply'; c.lineJoin = 'round';
  const fill = (k, p, rule = 'evenodd') => { c.fillStyle = rgb(PAL[k]); c.fill(p, rule); }, ink = (p, w = .26) => { c.strokeStyle = rgb(PAL.ink); c.lineWidth = w; c.stroke(p); };
  // 远山（浅绿）+ 等高线镂空
  let p = new Path2D(); addPoly(p, [[-6, 84], [-6, 62], [14, 52], [34, 60], [58, 46], [84, 58], [110, 44], [136, 56], [166, 48], [166, 84]], 6); for (let i = 0; i < 7; i++) ell(p, 20 + i * 22, 66 + (i % 2) * 5, 6, .55, -.05); fill('sage', p); ink(p, .22);
  // 芯片“月亮”（金）：外壳 + 引脚 + 晶圆方窗 + 十字线
  { const cx = 80, cy = 25, s = 8; p = new Path2D(); rect(p, cx - s, cy - s, 2 * s, 2 * s); rect(p, cx - s + 2.2, cy - s + 2.2, 2 * s - 4.4, 2 * s - 4.4); fill('gold', p); const q = new Path2D(); for (let i = 0; i < 7; i++) { const t = -s + 1.6 + i * (2 * s - 3.2) / 6; rect(q, cx + t - .45, cy - s - 2.4, .9, 2.4); rect(q, cx + t - .45, cy + s, .9, 2.4); rect(q, cx - s - 2.4, cy + t - .45, 2.4, .9); rect(q, cx + s, cy + t - .45, 2.4, .9); } fill('gold', q);
    const d = new Path2D(); rect(d, cx - s + 2.2, cy - s + 2.2, 2 * s - 4.4, 2 * s - 4.4); ink(d, .3); const cr = new Path2D(); cr.moveTo(cx - s + 2.2, cy); cr.lineTo(cx + s - 2.2, cy); cr.moveTo(cx, cy - s + 2.2); cr.lineTo(cx, cy + s - 2.2); ink(cr, .22);
    const o = new Path2D(); rect(o, cx - s, cy - s, 2 * s, 2 * s); ink(o, .3); c.save(); c.globalAlpha = .55; const glow = c.createRadialGradient(cx, cy, 4, cx, cy, 20); glow.addColorStop(0, 'rgba(255,214,120,.55)'); glow.addColorStop(1, 'rgba(255,214,120,0)'); c.fillStyle = glow; c.fillRect(cx - 22, cy - 22, 44, 44); c.restore(); }
  // 祥云（黄，带螺旋镂空）
  const cloud = (x, y, s) => { const q = new Path2D(); addPoly(q, [[-9, 2], [-8, -2], [-5, -3.5], [-3, -6], [1, -6.5], [4, -4.5], [7, -4], [10, -1], [9, 2], [4, 3.2], [-4, 3.2]].map(v => [x + v[0] * s, y + v[1] * s]), 5); for (const [dx, dy, r] of [[-4, -.4, 1.4], [1, -2.4, 1.6], [6, -.8, 1.2]]) { circ(q, x + dx * s, y + dy * s, r * s * .55); } fill('yellow', q); ink(q, .24); const sp = new Path2D(); for (const [dx, dy, r] of [[-4, -.4, 1.4], [1, -2.4, 1.6], [6, -.8, 1.2]]) { sp.moveTo(x + (dx + r) * s * .9, y + dy * s); sp.arc(x + dx * s, y + dy * s, r * s * .9, 0, Math.PI * 1.6); } ink(sp, .2); };
  cloud(46, 13, 1.25); cloud(118, 11, 1.1); cloud(24, 31, .9); cloud(140, 30, .85);
  // 机房宝塔（红瓦、服务器机柜、LED 镂空点）
  { const px = 19; let y = 84; for (let t = 0; t < 5; t++) { const bw = 15 - t * 1.9, bh = 6.2; p = new Path2D(); rect(p, px - bw / 2, y - bh, bw, bh); for (let r = 0; r < 2; r++) for (let i = 0; i < Math.floor(bw / 1.5) - 1; i++) circ(p, px - bw / 2 + 1.5 + i * 1.5, y - bh + 1.8 + r * 2.2, .42); fill('brown', p); ink(p, .24);
      const e = new Path2D(); addPoly(e, [[px - bw / 2 - 4.6, y - bh + .8], [px - bw / 2 - 1.6, y - bh - .6], [px, y - bh - 3.4], [px + bw / 2 + 1.6, y - bh - .6], [px + bw / 2 + 4.6, y - bh + .8], [px + bw / 2 + 2, y - bh + 1.4], [px - bw / 2 - 2, y - bh + 1.4]], 5); for (let i = 0; i < 6; i++) { const tx = px - bw / 2 - 1 + i * (bw + 2) / 5; rect(e, tx - .18, y - bh - .3, .36, 1.3); } fill('red', e); ink(e, .24); y -= bh + 3.1; }
    p = new Path2D(); rect(p, px - .35, y - 5, .7, 5); circ(p, px, y - 5.6, 1); fill('gold', p); ink(p, .2); }
  // 吊桥（红橙，主缆 + 吊索）与海浪
  { const t1 = 126, t2 = 152, top = 44, deck = 79; p = new Path2D(); for (const tx of [t1, t2]) { rect(p, tx - 1.1, top, 2.2, deck - top + 5); for (let k = 0; k < 4; k++) rect(p, tx - 3, top + 6 + k * 8, 6, 1.1); } rect(p, 96, deck, 70, 1.8); fill('orange', p); ink(p, .22);
    p = new Path2D(); for (const [xa, xb, sag] of [[96, t1, 12], [t1, t2, 26], [t2, 166, 12]]) { p.moveTo(xa, deck - (xa === 96 ? 2 : 0)); for (let i = 1; i <= 24; i++) { const u = i / 24, x = lerp(xa, xb, u), y0 = xa === 96 ? deck : top, y1 = xb === 166 ? deck : top; p.lineTo(x, lerp(y0, y1, u) + sag * Math.sin(Math.PI * u) * (xa === t1 ? 1 : .55)); } } ink(p, .3);
    p = new Path2D(); for (let x = 100; x < 166; x += 2.4) { const u = (x - t1) / (t2 - t1), y = u >= 0 && u <= 1 ? top + 26 * Math.sin(Math.PI * u) : deck - 6; if (y < deck - .5) { p.moveTo(x, y); p.lineTo(x, deck); } } ink(p, .16);
    p = new Path2D(); for (let i = 0; i < 9; i++) { const wx = 100 + i * 8, wy = 82.4 + (i % 2) * 1; p.moveTo(wx, wy); p.quadraticCurveTo(wx + 2, wy - 1.6, wx + 4, wy); p.quadraticCurveTo(wx + 5.2, wy + 1.2, wx + 7, wy); } ink(p, .3); }
  // 棕榈
  const palm = (x, y, h, lean) => { p = new Path2D(); addPoly(p, [[x - .7, y], [x + lean * .3 - .5, y - h * .5], [x + lean - .4, y - h], [x + lean + .4, y - h], [x + lean * .3 + .5, y - h * .5], [x + .7, y]], 4); fill('brown', p); const f = new Path2D(); for (let k = 0; k < 7; k++) { const a = -Math.PI * .95 + k * Math.PI * .95 / 3, tx = x + lean + Math.cos(a) * 6.5, ty = y - h + Math.sin(a) * 4 + 3.4; f.moveTo(x + lean, y - h); f.quadraticCurveTo(x + lean + Math.cos(a) * 3.6, y - h - 2.6, tx, ty); f.quadraticCurveTo(x + lean + Math.cos(a) * 3.4, y - h - .6, x + lean, y - h); } fill('green', f, 'nonzero'); ink(f, .2); };
  palm(37, 84, 17, 2.5); palm(42, 84, 12, -2); palm(104, 84, 15, -2.2);
  // 灯笼：红色，刻“算”“力”
  const lantern = (x, ch) => { p = new Path2D(); ell(p, x, 10.6, 3.3, 4.2); fill('red', p); ink(p, .26); p = new Path2D(); rect(p, x - 1.6, 5.2, 3.2, 1); rect(p, x - 1.6, 14.8, 3.2, 1); fill('gold', p); p = new Path2D(); p.moveTo(x, 15.8); p.lineTo(x, 20); ink(p, .3); c.save(); c.globalCompositeOperation = 'destination-out'; c.fillStyle = '#000'; c.font = '700 4px "PingFang SC","Microsoft YaHei",serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch, x, 10.9); c.restore(); p = new Path2D(); p.moveTo(x, 0); p.lineTo(x, 5.2); ink(p, .3); };
  lantern(9, '算'); lantern(151, '力');
  // 回纹边 + 台口（地面）
  p = new Path2D(); rect(p, 0, 0, 160, 3.4); for (let x = 0; x < 160; x += 3.4) rect(p, x + .95, .95, 1.5, 1.5); fill('red', p);
  p = new Path2D(); rect(p, 0, 84, 160, 12); for (let x = 3; x < 160; x += 8) rect(p, x, 87, .5, 8); fill('brown', p); p = new Path2D(); rect(p, 0, 84, 160, 1.1); fill('red', p); p = new Path2D(); p.moveTo(0, 84); p.lineTo(160, 84); ink(p, .3);
}

/* ═══════════ 4. 人偶：部件几何（镂空 + 彩绘 + 墨线）═══════════ */
const DIM = { T: 11, UA: 8.1, FA: 9.0, TH: 8.4, SH: 8.8, FT: 1.9 };

    { d: .2 }, { fn: () => { for (const p of PUP) { p.z = Z0; p.hand.F.abs = p.hand.B.abs = null; } sam.walk = dario.walk = null; sam.f.nx.p = sam.f.nx.t = at(-30); dario.f.nx.p = dario.f.nx.t = at(190); sam.foot.F.x = sam.f.nx.p + 3; sam.foot.B.x = sam.f.nx.p - 3; dario.foot.F.x = dario.f.nx.p - 3; dario.foot.B.x = dario.f.nx.p + 3; sam.f.tilt.p = sam.f.tilt.t = dario.f.tilt.p = dario.f.tilt.t = 0; pose(sam, 'rest'); pose(dario, 'rest'); dario.held.F = null; $('#title').style.opacity = 1; PERC.open(); } }, { d: 2.6 },
    say('N', '话说硅谷之巅，两大门派，一言不合，便要斗法！', [[.3, () => $('#title').style.opacity = 0], [1.6, () => { goto_(sam, SX, 22); goto_(dario, DX, 22); }]]),
    say('N', '左首，OpenAI 掌门，山姆。', [[.2, () => { pose(sam, 'wave'); PERC.small(); }], [1.6, () => pose(sam, 'rest')]]),
    say('N', '右首，Anthropic 掌门，达里奥。', [[.2, () => { pose(dario, 'scratch'); PERC.small(); }], [1.6, () => pose(dario, 'rest')]]),
    say('S', '达里奥！听说你的模型，又婉言谢绝了一位客人？', [[.1, () => { pose(sam, 'point'); lean(sam, .12); SND.wood(); }], [3.2, () => { pose(sam, 'rest'); lean(sam, 0); }]]),
    say('D', '山姆！听说你的新版本，又“马上”就要发布了？', [[.1, () => { pose(dario, 'wave'); lean(dario, .1); SND.wood(); }], [3.4, () => { pose(dario, 'rest'); lean(dario, 0); }]]),
    say('N', '第一回合。', [[0, () => { PERC.hit(); }]]),
    say('S', '接招！算力洪流，万卡齐发！', [[.3, () => { pose(sam, 'up2'); jump(sam, 6); }], [1.2, () => { chipsFrom.hit = false; chipsFrom(); pose(sam, 'push'); lean(sam, .18); }]]),
    say('D', '宪法之盾！很抱歉，这一招，我不能接。', [[.2, () => { dario.held.F = shieldDraw; pose(dario, 'guard'); lean(dario, -.1); SND.wood(); }], [2.6, () => { pose(sam, 'rest'); lean(sam, 0); }], [4.6, () => { dario.held.F = null; pose(dario, 'rest'); lean(dario, 0); }]]),
    say('N', '第二回合。', [[0, () => PERC.hit()]]),
    say('D', '看我万字长文——《爱的机器》！', [[.3, () => { pose(dario, 'push'); lean(dario, .15); }], [1.4, scroll], [3.4, () => { pose(dario, 'rest'); lean(dario, 0); }]]),
    say('S', '命名迷阵！GPT 四欧，o 三迷你高配！', [[.3, () => { pose(sam, 'up2'); jump(sam, 5); }], [1, tags], [3.2, () => { pose(dario, 'scratch'); }], [5.4, () => { pose(dario, 'rest'); pose(sam, 'rest'); }]]),
    say('N', '一个越写越长，一个越改越乱。', []),
    say('N', '第三回合！', [[0, () => PERC.hit()]]),
    say('D', '克劳德巨爪，离幕三尺——压！', [[.2, () => { pose(dario, 'push'); lean(dario, .2); }], [1, paw], [3.4, () => { pose(dario, 'rest'); lean(dario, 0); }]]),
    say('S', '灯——晃起来！', [[.2, () => { pose(sam, 'fist'); lean(sam, .2); }], [.7, kick], [2, () => { pose(sam, 'rest'); lean(sam, 0); }]]),
    say('N', '灯焰乱晃，影随灯动，巨爪也失了准头。', [[1.5, () => bumpLamp(.8, -1)]]),
    say('D', '其实……我们都想让 AI 造福世人。', [[.2, () => { pose(dario, 'shake'); goto_(dario, 88, 14); }]]),
    say('S', '英雄所见略同！握手言和！', [[.2, () => { goto_(sam, 72, 14); pose(sam, 'shake'); }], [1.6, () => { PERC.small(); jump(sam, 4); jump(dario, 4); }]]),
    say('N', '胜负未分，下回分解。', [[1.4, () => PERC.end()]]),
    { d: 2.4 }, { fn: () => { SHOW.done = true; $('#sub').style.opacity = 0; } }
  ];
}
function compile() {
  let t = 0; SHOW.items = scriptItems(); SHOW.timers = []; SHOW.idx = 0; SHOW.t = 0; SHOW.done = false; SHOW.line = null;
  for (const it of SHOW.items) { it.t0 = t; if (it.say) { it.dur = .6 + it.say[1].length * .2; t += it.dur + .35; } else if (it.d != null) t += it.d; }
  SHOW.dur = t;
}
function fire(it) {
  if (it.fn) it.fn();
  if (it.say) { const [w, txt] = it.say; SHOW.line = { who: w, txt, t0: it.t0, dur: it.dur }; $('#sub').style.opacity = 1; for (const p of PUP) p.speaking = (w === 'S' && p === sam) || (w === 'D' && p === dario); if (w !== 'N') SND.bangu(.5); for (const [dt, fn] of it.par || []) SHOW.timers.push({ at: SHOW.t + dt, fn }); }
}
function stepShow(dt) {
  if (SHOW.paused || SHOW.done) return; SHOW.t += dt; while (SHOW.idx < SHOW.items.length && SHOW.items[SHOW.idx].t0 <= SHOW.t) fire(SHOW.items[SHOW.idx++]);
  for (let i = SHOW.timers.length - 1; i >= 0; i--) if (SHOW.timers[i].at <= SHOW.t) { const fn = SHOW.timers[i].fn; SHOW.timers.splice(i, 1); fn(); }
  const L = SHOW.line; if (L) { const u = clamp((SHOW.t - L.t0) / L.dur, 0, 1), n = Math.floor(u * L.txt.length); $('#sub').innerHTML = `<b style="background:${COLOR[L.who]}">${NAME[L.who]}</b><u>${L.txt.slice(0, n)}</u><i>${L.txt.slice(n)}</i>`; if (SHOW.t > L.t0 + L.dur + .3) for (const p of PUP) p.speaking = false; }
}
function startShow() { props.length = 0; SHOW.paused = false; OP.set(false); compile(); LAMP.ox = LAMP.oy = LAMP.vx = LAMP.vy = 0; $('#sub').innerHTML = ''; }

/* ═══════════ 11. 主更新循环、灯焰摇曳与撞灯 ═══════════ */
let T_ = 0;
function update(dt) {
  T_ += dt; stepShow(dt);
  LAMP.fx = nz(T_ * 3.1, 1) * .28; LAMP.fy = nz(T_ * 2.3, 4) * .34; LAMP.br = 1 + nz(T_ * 4.7, 7) * .035;                                   // 灯焰摇曳
  const w2 = 9.5, c = 1.0; LAMP.vx += (-w2 * LAMP.ox - c * LAMP.vx) * dt; LAMP.vy += (-w2 * LAMP.oy - c * LAMP.vy) * dt; LAMP.ox += LAMP.vx * dt; LAMP.oy += LAMP.vy * dt;   // 灯悬着，被撞后单摆式衰减摆动
  const n = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / n; for (let i = 0; i < n; i++) for (const p of PUP) stepPuppet(p, h, T_);
  for (const o of props) o.upd && o.upd(dt); for (let i = props.length - 1; i >= 0; i--) if (props[i].dead) props.splice(i, 1);
}

/* ═══════════ 12. 操演模式：拖签子 / 手 / 灯；调离幕远近 ═══════════ */
const OP = { on: false, drag: null, set(v) { this.on = v; $('#bop').setAttribute('aria-pressed', v); $('#ctl').style.display = v ? 'flex' : 'none'; SHOW.paused = v; if (!v) { for (const p of PUP) { p.hand.F.abs = p.hand.B.abs = null; p.dragging = false; } } else { $('#zs').value = sam.z; $('#zd').value = dario.z; $('#zl').value = LAMP.z; $('#fr').value = LAMP.r; syncOut(); } } };
function syncOut() { $('#zso').textContent = sam.z.toFixed(0); $('#zdo').textContent = dario.z.toFixed(0); $('#zlo').textContent = LAMP.z.toFixed(0); $('#fro').textContent = LAMP.r.toFixed(1); }
$('#zs').oninput = e => { sam.z = +e.target.value; syncOut(); }; $('#zd').oninput = e => { dario.z = +e.target.value; syncOut(); }; $('#zl').oninput = e => { LAMP.z = +e.target.value; syncOut(); }; $('#fr').oninput = e => { LAMP.r = +e.target.value; syncOut(); };
$('#bbump').onclick = () => bumpLamp(1.4, Math.random() < .5 ? 1 : -1);
cv.addEventListener('pointerdown', e => {
  unlock(); if (!OP.on) return; cv.setPointerCapture(e.pointerId); const s = px2s(e.clientX, e.clientY); let best = null, bd_ = 5.5;
  const cand = (id, pt, z, p, kind) => { const q = toScreen(pt.x, pt.y, z), d = Math.hypot(q.x - s.x, q.y - s.y); if (d < bd_) { bd_ = d; best = { id, p, kind }; } };
  for (const p of PUP) { cand('n', p.pose.N, p.z, p, 'neck'); cand('F', p.pose.hF, p.z, p, 'hand'); cand('B', p.pose.hB, p.z, p, 'hand'); }
  const L = lampPos(), dl = Math.hypot(L.x - s.x, L.y - s.y); if (dl < Math.max(bd_, 6)) best = { kind: 'lamp' }; OP.drag = best; if (best && best.p) best.p.dragging = true; if (best && best.p) best.p.walk = null;
});
cv.addEventListener('pointermove', e => {
  if (!OP.drag) return; const s = px2s(e.clientX, e.clientY), d = OP.drag;
  if (d.kind === 'lamp') { LAMP.x = clamp(s.x, 10, 150); LAMP.y = clamp(s.y, 6, 80); return; }
  const pl = toPlane(s.x, s.y, d.p.z); if (d.kind === 'neck') { d.p.f.nx.t = pl.x; d.p.f.ny.t = clamp(pl.y, 22, d.p.baseY + 8); } else d.p.hand[d.id].abs = { x: pl.x, y: pl.y };
});
const endDrag = () => { if (OP.drag && OP.drag.p) OP.drag.p.dragging = false; OP.drag = null; }; cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
$('#bop').onclick = () => { unlock(); OP.set(!OP.on); }; $('#bplay').onclick = () => { unlock(); startShow(); };
$('#bsnd').onclick = e => { SOUND = !SOUND; e.target.setAttribute('aria-pressed', SOUND); e.target.textContent = '锣鼓：' + (SOUND ? '开' : '关'); if (SOUND) { au(); SND.bangu(); } };
$('#bpan').onclick = e => { const p = $('#panel'), on = p.style.display !== 'block'; p.style.display = on ? 'block' : 'none'; e.target.setAttribute('aria-pressed', on); };
let unlocked = false;
function unlock() { if (unlocked) return; unlocked = true; $('#hint').style.display = 'none'; SOUND = true; $('#bsnd').setAttribute('aria-pressed', true); $('#bsnd').textContent = '锣鼓：开'; au(); startShow(); }
addEventListener('keydown', unlock);

/* ═══════════ 13. 数据面板（人工验算放大率 / 半影）═══════════ */
let panT = 0;
function refreshPanel(LY, now) {
  if ($('#panel').style.display !== 'block' || now - panT < 250) return; panT = now; const L = lampPos();
  const row = (n, z) => `<tr><td>${n}</td><td>z=${z.toFixed(1)}</td><td>m=${magOf(z).toFixed(3)}</td><td>半影 ${penOf(z).toFixed(2)}</td></tr>`;
  $('#panel').innerHTML = `<h4>投影数据 · m = zL/(zL−z) · 半影 = 2r·z/(zL−z)</h4><table>${row('Sam', sam.z)}${row('Dario', dario.z)}${row('布景', .3)}${LY.filter(o => o.name && o.name !== 'Sam' && o.name !== 'Dario').slice(0, 5).map(o => row(o.name, o.z)).join('')}</table><div style="margin-top:4px;color:#c9b48a">灯 (${L.x.toFixed(1)}, ${L.y.toFixed(1)}) zL=${LAMP.z} · 焰半径 r=${LAMP.r.toFixed(1)}<br>影点 S = L + (P−L)·m：灯左移 → 离幕的影子右移，布景不动</div>`;
}

/* ═══════════ 14. 启动 ═══════════ */
let last = performance.now();
function frame(now) { requestAnimationFrame(frame); const dt = Math.min(.05, (now - last) / 1e3); last = now; update(dt); const LY = renderScreen(); drawStage(); drawHandles(); refreshPanel(LY, now); }
addEventListener('resize', layout); layout(); compile(); for (let i = 0; i < 40; i++) update(1 / 60); requestAnimationFrame(frame);
window.__sp = { sam, dario, LAMP, SHOW, props, update, magOf, penOf, toScreen, toPlane, OP, startShow, seek(t) { startShow(); while (SHOW.t < t) update(1 / 60); },
  cost(n = 20) { const t0 = performance.now(); for (let i = 0; i < n; i++) { update(1 / 60); const LY = renderScreen(); drawStage(); } ctx.getImageData(0, 0, 1, 1); return +((performance.now() - t0) / n).toFixed(1); } };   // 调试：平均每帧毫秒数
</script>
