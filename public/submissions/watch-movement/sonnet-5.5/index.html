<title>机芯 · 怀表机械传动</title>
<!--
  AURAVAL Cal.08 · 手动上弦怀表机芯（单文件 · 零依赖 · Canvas 2D + WebAudio）
  ── 传动链（齿数 / 周期，页面右侧面板会实时核对）──────────────────────────────────────
     发条盒 64  ─(中心轮小齿 8)→  中心轮 64 (1 圈/小时，带分针)
     中心轮 64  ─(三轮小齿 8)──→  三轮 60
     三轮 60    ─(秒轮小齿 8)──→  秒轮 60 (1 圈/分钟，带小秒针)
     秒轮 60    ─(擒纵小齿 6)──→  擒纵轮 15 齿（每拍前进半个齿距 12°，6 秒 1 圈）
     30 拍 / 擒纵轮 1 圈 × 10 圈/分 = 300 拍/分 = 18 000 拍/小时 = 摆轮 2.5 Hz
     分轮 15 → 跨轮 45（同轴过轮 12）→ 时轮 48：(45/15)×(48/12) = 12 : 1，时针只由分轮系导出
  ── 啮合 ────────────────────────────────────────────────────────────────────────────
     中心距 = 模数 × (z1 + z2) / 2；从动轮相位 θB = φ + π − π/zB + (zA/zB)(φ − θA)，
     使 A 的齿正好对着 B 的齿槽，转向相反；同轴轮/轴齿共用同一个角度。所有角度 = a_k + g_k · P，
     其中 P 是唯一的走时状态（拍数），a_k 由上式沿传动链一次性解出（见 solveTrain）。
  ── 擒纵 ────────────────────────────────────────────────────────────────────────────
     摆轮角 α = A·sin(π·nb)+off，冲击宝石在叉槽内时叉角 φ = −asin(r_j·sinα / L_s)，出槽后叉靠在限位钉上；
     叉每翻转一次，擒纵轮前进半个齿距（受叉瓦锁/放，见 stepShape），小秒针随之跳一格 = 与摆轮过平衡位同步。
  ── 齿轮是每帧由代码生成的矢量路径旋转，不是位图贴图旋转。
-->
<style>

  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 14px 50px rgba(0,0,0,.5);transition:transform .3s,opacity .3s}

<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="title"><b>AURAVAL</b><span>Calibre 08 · 21 rubis · 18 000 A/h · 手动上弦</span></div>
  <div id="chips"></div>
</div>
<aside id="panel" data-open="0"></aside>

  <div class="grp" id="spd"><button data-s="0.1">0.1×</button><button data-s="1" aria-pressed="true">1×</button><button data-s="60">60×</button><button data-s="3600">3600×</button></div>
  <div class="grp"><button class="hold" id="cw-">⟲ 反转</button><button class="hold" id="cw+">⟳ 正转/上弦</button><button id="bcrown">拔出表冠</button></div>
  <div class="grp"><button id="bloupe">放大镜</button><button id="bsnd">声音</button><button id="bsync">对时</button><button id="btbl">参数</button></div>

<script>
'use strict';
const $ = s => document.querySelector(s), TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t, sst = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const polar = (c, r, a) => [c[0] + r * Math.cos(a * D2R), c[1] + r * Math.sin(a * D2R)], angTo = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]), dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const wrapPi = a => { a %= TAU; return a > Math.PI ? a - TAU : a < -Math.PI ? a + TAU : a; };
const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ════════════ 1. 齿形生成（按齿数由代码生成）════════════ */
const inv = a => Math.tan(a) - a;
function wheelOutline(z, m, o = {}) {                       // 轮：渐开线齿形，thick = 节圆齿厚 / 周节
  const alpha = 20 * D2R, ha = 1.0, hf = 1.2, thick = o.thick ?? 0.46, N = 6, rp = m * z / 2, ra = rp + ha * m, rf = rp - hf * m, rb = rp * Math.cos(alpha), tau = TAU / z, half0 = thick * tau / 2;
  const psi = r => half0 + inv(alpha) - inv(Math.acos(Math.min(1, rb / Math.max(r, rb)))), r0 = Math.max(rf, rb), pts = [], P = (r, a) => pts.push([Math.cos(a) * r, Math.sin(a) * r]);
  for (let i = 0; i < z; i++) {
    const a = i * tau; if (r0 > rf) P(rf, a - psi(r0));
    for (let j = 0; j <= N; j++) { const r = r0 + (ra - r0) * Math.pow(j / N, .85); P(r, a - psi(r)); }
    const pt = psi(ra); for (let j = 1; j < 3; j++) P(ra, a - pt + 2 * pt * j / 3);
    for (let j = N; j >= 0; j--) { const r = r0 + (ra - r0) * Math.pow(j / N, .85); P(r, a + psi(r)); }
    if (r0 > rf) P(rf, a + psi(r0)); const a1 = a + psi(r0), a2 = a + tau - psi(r0); for (let j = 1; j < 3; j++) P(rf, a1 + (a2 - a1) * j / 3);
  }

}
function pinionOutline(z, m, o = {}) {                      // 轴齿：平行边圆头轴齿
  const thick = o.thick ?? 0.26, p = Math.PI * m, u = thick * p / 2, rp = m * z / 2, ra = rp + m, rf = rp - 1.25 * m, tau = TAU / z, pts = [], cx = ra - u, rr = Math.sqrt(Math.max(rf * rf - u * u, .01));
  const loc = (rho, lam, a) => pts.push([rho * Math.cos(a) - lam * Math.sin(a), rho * Math.sin(a) + lam * Math.cos(a)]);
  for (let i = 0; i < z; i++) {
    const a = i * tau; loc(rr, -u, a); loc(rf + (cx - rf) * .5, -u, a); loc(cx, -u, a);
    for (let j = 1; j < 7; j++) { const t = -Math.PI / 2 + j * Math.PI / 7; loc(cx + u * Math.cos(t), u * Math.sin(t), a); }
    loc(cx, u, a); loc(rf + (cx - rf) * .5, u, a); loc(rr, u, a);
    const a1 = a + Math.asin(u / rf), a2 = a + tau - Math.asin(u / rf); for (let j = 1; j < 3; j++) pts.push([Math.cos(a1 + (a2 - a1) * j / 3) * rf, Math.sin(a1 + (a2 - a1) * j / 3) * rf]);
  }

}
// 啮合相位：A（齿数 zA，角 thA）→ B（齿数 zB）；phi = A→B 中心连线方向；返回 B 的齿中心角（B 的齿槽正对 A 的齿）
const meshAngle = (thA, phi, zA, zB) => phi + Math.PI - Math.PI / zB + (zA / zB) * (phi - thA);
const polyPath = (path, pts) => { pts.forEach((p, i) => i ? path.lineTo(p[0], p[1]) : path.moveTo(p[0], p[1])); path.closePath(); };
function spokeWindows(rIn, rOut, n, sw, shear) {            // 轮辐窗口：弧形辐条（shear = 辐条弯曲量）
  const wins = [];
  for (let k = 0; k < n; k++) {
    const a0 = k * TAU / n, a1 = (k + 1) * TAU / n, pts = [], S = 7;
    for (let j = 0; j <= S; j++) { const r = lerp(rIn, rOut, j / S), sh = shear * j / S; pts.push([r, a0 + sw / (2 * r) + sh]); }
    for (let j = S; j >= 0; j--) { const r = lerp(rIn, rOut, j / S), sh = shear * j / S; pts.push([r, a1 - sw / (2 * r) + sh]); }
    wins.push(pts.map(([r, a]) => [Math.cos(a) * r, Math.sin(a) * r]));
  }

function circlePts(r, n = 36, rev = false) { const p = []; for (let i = 0; i < n; i++) { const a = (rev ? -i : i) / n * TAU; p.push([Math.cos(a) * r, Math.sin(a) * r]); } return p; }

  const n = pts.length, out = [], get = i => closed ? pts[((i % n) + n) % n] : pts[Math.max(0, Math.min(n - 1, i))], segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) { const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    for (let k = 0; k < per; k++) { const t = k / per, t2 = t * t, t3 = t2 * t; out.push([0, 1].map(d => .5 * (2 * p1[d] + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3))); } }
  if (!closed) out.push(pts[n - 1].slice()); return out;
}
function ribbon(center, widths, per = 10) {                 // 沿 Catmull-Rom 中心线的变宽带（桥板）
  const d = crSample(center, false, per), N = d.length, w = d.map((_, i) => { const u = i / (N - 1) * (center.length - 1), k = Math.min(center.length - 2, Math.floor(u)), t = u - k; return lerp(widths[k], widths[k + 1], t); });
  const L = [], R = [];
  for (let i = 0; i < N; i++) { const a = d[Math.max(0, i - 1)], b = d[Math.min(N - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l; L.push([d[i][0] + nx * w[i] / 2, d[i][1] + ny * w[i] / 2]); R.push([d[i][0] - nx * w[i] / 2, d[i][1] - ny * w[i] / 2]); }
  const cap = (i, dir) => { const a = d[Math.max(0, i - 1)], b = d[Math.min(N - 1, i + 1)], a0 = Math.atan2(b[0] - a[0], -(b[1] - a[1])), out = []; for (let k = 1; k < 10; k++) { const t = a0 - dir * k * Math.PI / 10; out.push([d[i][0] + Math.cos(t) * w[i] / 2, d[i][1] + Math.sin(t) * w[i] / 2]); } return out; };

/* ════════════ 2. 机芯布局（单位 = 模数 1；y 向下；表冠在 12 点）════════════ */
const ESC = { RE: 9.6, RR: 6.2, NT: 15, TIPW: 1.6, DELTA: 7 * D2R, DP: .6, T0: 11.46 * D2R, U0: .45, U1: .75, ST: { t: 1.6, w: 1.2, lf: -.08 }, LS: 20, RJ: 4.4 };
ESC.D = ESC.RE / Math.cos(30 * D2R); ESC.ARM = ESC.RE * Math.tan(30 * D2R); ESC.SWING = 2 * ESC.DELTA * ESC.ARM; ESC.R0 = -ESC.DP + ESC.SWING / 2; ESC.PITCH = TAU / ESC.NT;
ESC.ALPHA0 = Math.asin(ESC.LS * Math.sin(ESC.DELTA) / ESC.RJ);      // 冲击宝石出/入叉槽的摆轮角
const L = {}; L.C = [0, 0]; L.B = polar(L.C, 36, -50); L.T = polar(L.C, 36, 140); L.S = polar(L.T, 34, 70); L.E = polar(L.S, 33, -5);
L.PF = polar(L.E, ESC.D, -30); L.BAL = polar(L.PF, ESC.LS + ESC.RJ, -25); L.K = polar(L.C, 15, -100);
L.CW = polar(L.B, 21, -150); L.WP = [0, L.CW[1] - Math.sqrt(9.5 * 9.5 - L.CW[0] * L.CW[0])];
ESC.PSI = angTo(L.PF, L.E);                                             // 叉局部 +x（叉轴 → 擒纵轮心）在世界中的方向
const M_WORLD = { plateR: 96, ringR: 110, caseR: 118 };
const SPEC = { barrel: [64, 1], cwheel: [64, 1], cpin: [8, 1], twheel: [60, 1], tpin: [8, 1], fwheel: [60, 1], fpin: [8, 1], ewheel: [15, 0], epin: [6, 1], cannon: [15, .5], kwheel: [45, .5], gpin: [12, .5], hwheel: [48, .5], ratchet: [56, .5], crownw: [28, .5], windp: [10, .5] };

/* 走时状态与啮合相位：所有角度 = a_k + g_k · P（P = 拍数），a_k 沿链由 meshAngle 解出 */
const G = {};                                                            // 增益 (rad / 拍)
G.e = -12 * D2R; G.f = -G.e * 6 / 60; G.t = -G.f * 8 / 60; G.c = -G.t * 8 / 64; G.b = -G.c * 8 / 64;
const A0 = {};                                                           // 初相位（P = 0）
A0.e = ESC.T0 + ESC.PSI; A0.f = meshAngle(A0.e, angTo(L.E, L.S), 6, 60); A0.t = meshAngle(A0.f, angTo(L.S, L.T), 8, 60); A0.c = meshAngle(A0.t, angTo(L.T, L.C), 8, 64); A0.b = meshAngle(A0.c, angTo(L.C, L.B), 8, 64);
A0.k = meshAngle(A0.c, angTo(L.C, L.K), 15, 45); A0.h = meshAngle(A0.k, angTo(L.K, L.C), 12, 48);
A0.r = 0; A0.cw = meshAngle(A0.r, angTo(L.B, L.CW), 56, 28); A0.wp = meshAngle(A0.cw, angTo(L.CW, L.WP), 28, 10);
const BEATS_PER_S = 5, S_MAX = 6;                                        // 18 000 A/h = 5 拍/秒；发条 6 圈 ≈ 48 小时

/* ════════════ 3. 状态 ════════════ */
const st = { P: 0, Pint: 0, side: 1, nb: .25, amp: 4.6, off: 0, u: 0, alpha: 0, phi: 0, S: 4.3, wr: 0, cr: 0, slip: 0, spd: 1, out: false, outT: 0, hackT: 0, hold: 0, drag: null, snapT: 0, sound: false, loupe: false, lx: 0, ly: 0, ticks: 0, offMin: 0, offHour: 0, offSec: 0, stopSide: 1, flash: 0 };
const hasConic = typeof CanvasRenderingContext2D !== 'undefined' && !!CanvasRenderingContext2D.prototype.createConicGradient;
const AMP_FULL = 4.75;                                                   // ≈ 272°
function ampFull(S) { return S <= 0 ? 0 : AMP_FULL * (.62 + .38 * sst(0, 1.2, S)); }
const xCannon = () => G.c * st.P + st.slip;                              // 分轮（分针轴）相对初相位转过的角度
const ang = {
  b: () => A0.b + G.b * st.P, c: () => A0.c + G.c * st.P, t: () => A0.t + G.t * st.P, f: () => A0.f + G.f * st.P, e: () => A0.e + G.e * st.P,
  cannon: () => A0.c + xCannon(), k: () => A0.k - xCannon() * 15 / 45, h: () => A0.h + xCannon() * 15 / 45 * 12 / 48,
  r: () => A0.r + st.wr, cw: () => A0.cw - st.wr * 56 / 28, wp: () => A0.wp + st.wr * 5.6

/* ════════════ 4. 材质与绘制基础 ════════════ */
const MAT = {
  gold: { base: '#c99f45', mid: '#e6c565', hi: '#fff3bc', lo: '#8a6520', dark: '#4c3510', edge: 'rgba(46,30,6,.7)' },
  rhod: { base: '#c3c9d1', mid: '#dde2e8', hi: '#ffffff', lo: '#8a919c', dark: '#565d69', edge: 'rgba(30,34,42,.65)' },
  steel: { base: '#a2aab6', mid: '#c9d0d9', hi: '#f6f9fd', lo: '#6a727e', dark: '#363b44', edge: 'rgba(20,24,30,.75)' },
  blued: { base: '#2a4ba6', mid: '#3f70d6', hi: '#a9ceff', lo: '#142a6e', dark: '#0a1440', edge: 'rgba(3,8,30,.8)' },
  ruby: { base: '#d3163a', mid: '#f0405f', hi: '#ffc2cc', lo: '#7d0a22', dark: '#450212', edge: 'rgba(40,0,8,.8)' }

let VIEW = { K: 1, SH: 1 };                                              // K = 像素 / 世界单位；SH = 阴影像素比例
function conic(ctx, cx, cy, m) {                                         // 太阳纹：世界坐标固定的圆锥渐变（光源在左上）
  if (!hasConic) { const g = ctx.createLinearGradient(cx - 20, cy - 20, cx + 20, cy + 20); g.addColorStop(0, m.hi); g.addColorStop(.5, m.base); g.addColorStop(1, m.lo); return g; }

  [[0, m.mid], [.06, m.base], [.125, m.mid], [.19, m.base], [.3, m.lo], [.375, m.dark], [.45, m.lo], [.52, m.base], [.575, m.mid], [.625, m.hi], [.68, m.mid], [.75, m.base], [.83, m.lo], [.875, m.dark], [.94, m.base], [1, m.mid]].forEach(s => g.addColorStop(s[0], s[1]));
