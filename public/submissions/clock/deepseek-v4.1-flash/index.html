<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chronos · 钟表</title>
<style>
:root{--bg0:#070a14;--bg1:#101731;--ink:#eaf0ff;--dim:#8b96b8;--accent:#7fd8ff;--glow:#3aa9ff33;--card:#111a33cc;--stroke:#ffffff1c;--shadow:#000a}
body.day{--bg0:#f6f1e7;--bg1:#e9dfcc;--ink:#252a36;--dim:#8a8271;--accent:#d2691e;--glow:#e0a06033;--card:#ffffffd9;--stroke:#0000001a;--shadow:#8a7a5a55}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(120vmax 90vmax at 18% -10%,var(--bg1),var(--bg0) 62%);color:var(--ink);font-family:"SF Pro Display",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;transition:background .9s,color .9s}
body::before{content:"";position:fixed;inset:-25%;background:radial-gradient(42vmax 42vmax at 74% 92%,var(--glow),transparent 68%);filter:blur(6px);animation:drift 24s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate3d(-7%,-5%,0) scale(1.1)}}
.card{position:relative;width:min(88vw,360px);padding:24px 26px 18px;border-radius:30px;background:var(--card);border:1px solid var(--stroke);backdrop-filter:blur(16px);box-shadow:0 34px 90px -34px var(--shadow),inset 0 1px 0 #ffffff22;display:grid;justify-items:center;gap:12px}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.phase{padding:4px 11px;border:1px solid var(--stroke);border-radius:999px;letter-spacing:.14em;color:var(--accent)}
.clock{width:min(74vw,268px);aspect-ratio:1}
svg{display:block;width:100%;height:100%}
.hairline{fill:none;stroke:var(--stroke);stroke-width:1.4}
.tick{stroke:var(--dim);stroke-width:1;opacity:.55;animation:breathe 7s ease-in-out infinite}
.tick.major{stroke:var(--ink);stroke-width:2.6;opacity:.92}
@keyframes breathe{50%{opacity:.2}}
.num{fill:var(--dim);font-size:12.5px;font-family:ui-serif,Georgia,"Songti SC",serif;letter-spacing:.08em}
#hh,#mm{transition:none}
#ss{transform-origin:100px 100px;transition:transform .38s cubic-bezier(.3,1.7,.5,1)}
.pulse{fill:none;stroke:var(--accent);stroke-width:1.2;opacity:0;transform-origin:100px 100px;transform-box:view-box}
.pulse.go{animation:ripple 1s ease-out}
@keyframes ripple{0%{opacity:.45;transform:scale(.84)}100%{opacity:0;transform:scale(1.04)}}
.digital{font-size:clamp(34px,11vw,46px);font-weight:200;letter-spacing:.05em;font-variant-numeric:tabular-nums;text-shadow:0 0 30px var(--glow);animation:soft 1s steps(2) infinite}
@keyframes soft{50%{opacity:.96}}
.meta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--dim);letter-spacing:.06em}
.meta b{color:var(--ink);font-weight:500}
.status{width:100%;display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);letter-spacing:.14em;padding-top:10px;border-top:1px solid var(--stroke)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);display:inline-block;margin-right:6px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:400px){.card{padding:20px 18px 14px;border-radius:26px}}
</style>
</head>
<body>
<main class="card">
  <div class="row"><span>Chronos · 本地时间</span><span class="phase" id="phase">—</span></div>
  <div class="clock">
    <svg viewBox="0 0 200 200" role="img" aria-label="模拟时钟">
      <defs>
        <radialGradient id="disc" cx="50%" cy="42%" r="62%">
          <stop offset=".55" style="stop-color:transparent"/><stop offset="1" style="stop-color:var(--accent)" stop-opacity=".14"/>
        </radialGradient>
      </defs>
      <circle class="hairline" cx="100" cy="100" r="93"/>
      <circle cx="100" cy="100" r="93" fill="url(#disc)"/>
      <circle class="pulse" id="pulse" cx="100" cy="100" r="93"/>
      <g id="ticks"></g>
      <text class="num" x="100" y="33" text-anchor="middle">12</text>
      <text class="num" x="167" y="101" text-anchor="middle">3</text>
      <text class="num" x="100" y="169" text-anchor="middle">6</text>
      <text class="num" x="33" y="101" text-anchor="middle">9</text>
      <line id="hh" x1="100" y1="114" x2="100" y2="54" stroke="var(--ink)" stroke-width="6.5" stroke-linecap="round"/>
      <line id="mm" x1="100" y1="116" x2="100" y2="34" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" opacity=".88"/>
      <g id="ss" stroke="var(--accent)" stroke-linecap="round">
        <line x1="100" y1="122" x2="100" y2="26" stroke-width="1.5"/>
        <circle cx="100" cy="28" r="3" fill="var(--accent)" stroke="none"/>
      </g>
      <circle cx="100" cy="100" r="5" fill="var(--ink)"/>
      <circle cx="100" cy="100" r="2" fill="var(--bg0)"/>
    </svg>
  </div>
  <div class="digital" id="digital">00:00:00</div>
  <div class="meta"><b id="date">—</b><span>·</span><span id="weekday">—</span></div>
  <div class="status"><span><i class="dot"></i><span id="zone">Local</span></span><span id="note">对齐秒边界 · 每秒刷新</span></div>
</main>
<script>
const $=(id)=>document.getElementById(id),pad=(n)=>String(n).padStart(2,"0");
const WK=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
const NS="http://www.w3.org/2000/svg",ticks=$("ticks");
for(let i=0;i<60;i++){const a=i*6*Math.PI/180,maj=i%5===0,ro=91.5,ri=maj?79:85.5,l=document.createElementNS(NS,"line");
  l.setAttribute("x1",(100+Math.sin(a)*ro).toFixed(2));l.setAttribute("y1",(100-Math.cos(a)*ro).toFixed(2));
  l.setAttribute("x2",(100+Math.sin(a)*ri).toFixed(2));l.setAttribute("y2",(100-Math.cos(a)*ri).toFixed(2));
  l.setAttribute("class","tick"+(maj?" major":""));l.style.animationDelay=(-i*.12)+"s";ticks.appendChild(l);}
let spin=0,lastS=new Date().getSeconds();
const ss=$("ss"),hh=$("hh"),mm=$("mm");
function tick(){const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
  if(s!==lastS){if(s<lastS)spin+=360;lastS=s;ss.style.transform=`rotate(${spin+s*6}deg)`;
    const p=$("pulse");p.classList.remove("go");void p.getBoundingClientRect();p.classList.add("go");}
  hh.style.transform=`rotate(${(h%12)*30+m*.5}deg)`;mm.style.transform=`rotate(${m*6+s*.1}deg)`;
  $("digital").textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;
  $("date").textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  $("weekday").textContent=WK[d.getDay()];
  const day=h>=6&&h<18;document.body.classList.toggle("day",day);
  $("phase").textContent=h<5?"凌晨":h<9?"早晨":h<12?"上午":h<14?"正午":h<18?"下午":h<23?"夜晚":"深夜";
  $("zone").textContent=(Intl.DateTimeFormat().resolvedOptions().timeZone||"Local")+` · UTC${-d.getTimezoneOffset()/60>=0?"+":""}${-d.getTimezoneOffset()/60}`;}
hh.style.transformOrigin="100px 100px";mm.style.transformOrigin="100px 100px";
(function loop(){tick();setTimeout(loop,1000-Date.now()%1000);})();
</script>
</body>
</html>
