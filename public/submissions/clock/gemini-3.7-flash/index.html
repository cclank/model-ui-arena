<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Chrono - Clock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #0f172a, #020617);
      color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; padding: 16px;
    }
    .clock-card {
      width: 100%; max-width: 360px; background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 28px; padding: 24px 20px;
      backdrop-filter: blur(16px); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(56, 189, 248, 0.1);
      display: flex; flex-direction: column; align-items: center; gap: 20px; position: relative;
    }
    .dial-wrap { position: relative; width: 220px; height: 220px; }
    .dial-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .dial-bg { fill: none; stroke: rgba(255, 255, 255, 0.05); stroke-width: 6; }
    .dial-progress {
      fill: none; stroke: url(#sec-grad); stroke-width: 6; stroke-linecap: round;
      stroke-dasharray: 628.3; stroke-dashoffset: 628.3; transition: stroke-dashoffset 0.1s linear;
    }
    .analog-face {
      position: absolute; inset: 12px; border-radius: 50%;
      background: radial-gradient(circle, #090d16 0%, #050811 100%);
      border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }
    .hand {
      position: absolute; bottom: 50%; left: 50%; transform-origin: 50% 100%;
      border-radius: 4px; transition: transform 0.05s cubic-bezier(0.4, 2.08, 0.55, 0.44);
    }
    .hour-hand { width: 4px; height: 48px; margin-left: -2px; background: #e2e8f0; }
    .min-hand { width: 3px; height: 68px; margin-left: -1.5px; background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
    .sec-hand {
      width: 1.5px; height: 82px; margin-left: -0.75px; background: #f43f5e;
      box-shadow: 0 0 10px #f43f5e;
    }
    .center-pin {
      position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
      margin: -5px 0 0 -5px; background: #f8fafc; border: 2px solid #f43f5e;
      border-radius: 50%; z-index: 10;
    }
    .digital-time {
      font-size: 2.5rem; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff, #94a3b8); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }
    .meta-bar {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem; color: #64748b; font-weight: 500; border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 12px;
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      background: rgba(56, 189, 248, 0.1); color: #38bdf8; border-radius: 12px; font-size: 0.75rem;
    }
    .pulse-dot { width: 6px; height: 6px; background: #38bdf8; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
  </style>
</head>
<body>
  <div class="clock-card">
    <div class="dial-wrap">
      <svg class="dial-svg" viewBox="0 0 220 220">
        <defs>
          <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#f43f5e" />
          </linearGradient>
        </defs>
        <circle class="dial-bg" cx="110" cy="110" r="100" />
        <circle id="secProgress" class="dial-progress" cx="110" cy="110" r="100" />
      </svg>
      <div class="analog-face">
        <div id="hourHand" class="hand hour-hand"></div>
        <div id="minHand" class="hand min-hand"></div>
        <div id="secHand" class="hand sec-hand"></div>
        <div class="center-pin"></div>
      </div>
    </div>
    <div id="digitalTime" class="digital-time">00:00:00</div>
    <div class="meta-bar">
      <span id="dateStr">2026.08.16 SUN</span>
      <span class="status-badge"><span class="pulse-dot"></span>LIVE</span>
    </div>
  </div>
  <script>
    const hourHand = document.getElementById('hourHand');
    const minHand = document.getElementById('minHand');
    const secHand = document.getElementById('secHand');
    const secProgress = document.getElementById('secProgress');
    const digitalTime = document.getElementById('digitalTime');
    const dateStr = document.getElementById('dateStr');
    const circumference = 2 * Math.PI * 100;

    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

    function updateClock() {
      const now = new Date();
      const ms = now.getMilliseconds();
      const s = now.getSeconds() + ms / 1000;
      const m = now.getMinutes() + s / 60;
      const h = (now.getHours() % 12) + m / 60;

      secHand.style.transform = `rotate(${s * 6}deg)`;
      minHand.style.transform = `rotate(${m * 6}deg)`;
      hourHand.style.transform = `rotate(${h * 30}deg)`;

      const offset = circumference - (s / 60) * circumference;
      secProgress.style.strokeDashoffset = offset;

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      digitalTime.textContent = `${hh}:${mm}:${ss}`;

      const yr = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const dt = String(now.getDate()).padStart(2, '0');
      const day = days[now.getDay()];
      dateStr.textContent = `${yr}.${mo}.${dt} ${day}`;

      requestAnimationFrame(updateClock);
    }
    requestAnimationFrame(updateClock);
  </script>
</body>
</html>
