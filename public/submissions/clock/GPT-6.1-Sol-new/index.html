<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一刻 · Time, well spent</title>
<!-- 设计说明：以象牙白纸面和深墨色表盘构成一张时间海报。
模拟指针与数字读数共享本地时间，秒针连续行进。
自动跟随昼夜，也可手动切换；390px 下保持完整构图。 -->
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e6df;color:#242822;font-family:Arial,"PingFang SC",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px;transition:background .8s,color .8s}button{font:inherit}
.sheet{width:min(980px,100%);padding:36px 44px;border:1px solid #b7b6aa;position:relative;background:#f4f1e9;box-shadow:0 18px 70px #363b2710;transition:background .8s}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:10px;letter-spacing:2px}.brand{font-size:15px;letter-spacing:5px;font-weight:700}.dot{display:inline-block;width:6px;height:6px;background:#849478;border-radius:50%;margin-right:8px;box-shadow:0 0 0 4px #84947820}.theme{border:1px solid #b7b6aa;border-radius:50%;height:36px;width:36px;background:transparent;color:inherit;cursor:pointer;font-size:19px}.body{display:grid;grid-template-columns:.9fr 1.1fr;align-items:center;gap:40px;padding:70px 0 55px}h1{font-family:Georgia,serif;font-size:clamp(46px,7vw,78px);font-weight:400;letter-spacing:-4px;line-height:1.02;margin:18px 0 22px}h1 em{font-weight:400;color:#8a7353}.caption{font-size:12px;line-height:1.9;color:#777a70}.eyebrow{font-size:10px;letter-spacing:3px;color:#84877b}.digital{font:27px "Courier New",monospace;font-variant-numeric:tabular-nums;letter-spacing:2px;margin-top:36px}.digital span{font-size:16px;color:#979788}.date{font-size:11px;color:#7b7d72;margin-top:10px;letter-spacing:1px}.clock{aspect-ratio:1;position:relative;border-radius:50%;background:radial-gradient(circle at 37% 25%,#343c33,#181e1a 70%);border:9px solid #d2c9b9;box-shadow:0 0 0 1px #a69b87,0 0 0 6px #ece6da,15px 25px 30px #222b2824,inset 0 0 25px #0007;color:#d2c7b1}.clock svg{width:100%;height:100%;display:block}.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:4px}.hour{width:6px;height:22%;margin-left:-3px;background:#dfd8c7}.minute{width:4px;height:32%;margin-left:-2px;background:#dfd8c7}.second{width:1.5px;height:38%;margin-left:-.75px;background:#cb9470}.second:after{content:"";position:absolute;top:100%;height:28px;width:1.5px;background:#cb9470}.hub{width:12px;height:12px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#b78a63;border:3px solid #e9dec2;box-shadow:0 1px 4px #000}.face-word{position:absolute;top:30%;text-align:center;width:100%;font-size:9px;letter-spacing:4px;color:#b2b39e}.face-sub{position:absolute;bottom:29%;width:100%;text-align:center;font-size:6px;letter-spacing:2px;color:#7a8676}.bottom{border-top:1px solid #c8c6b9;padding-top:20px;letter-spacing:1px;color:#83867a}.dayline{width:130px;height:3px;background:#d1d3c5;position:relative}.dayline i{display:block;height:100%;background:#897555;width:0}.night{background:#141c19;color:#e5ddcc}.night .sheet{background:#1d2722;border-color:#3d493d}.night h1 em{color:#c8a579}.night .clock{border-color:#9a866b}.night .bottom{border-color:#3d493d}.night .theme{border-color:#596154}.night .caption,.night .date{color:#acb0a0}
@media(max-width:650px){body{padding:15px}.sheet{padding:24px}.body{grid-template-columns:1fr;gap:30px;padding:32px 0}.copy{display:grid;grid-template-columns:1fr auto;align-items:end}h1{font-size:52px;letter-spacing:-3px;margin:13px 0}.caption{font-size:11px}.readout{text-align:right;padding-bottom:8px}.digital{font-size:22px;margin:0;letter-spacing:0}.digital span{font-size:13px}.date{font-size:9px;letter-spacing:0}.clock{width:86%;margin:auto}.eyebrow{font-size:9px;letter-spacing:2px}.bottom{font-size:8px}.dayline{width:80px}.top{font-size:8px;letter-spacing:1px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="sheet"><header class="top"><div class="brand">一刻 / YIKE</div><span><i class="dot"></i>LOCAL TIME</span><button class="theme" aria-label="切换昼夜主题">◐</button></header><section class="body"><div class="copy"><div><div class="eyebrow" id="period">THE PRESENT MOMENT</div><h1>Time,<br><em>well spent.</em></h1><p class="caption">把这一刻，留给值得的事。<br>Every second is a small beginning.</p></div><div class="readout"><div class="digital" id="time">00:00<span>:00</span></div><div class="date" id="date"></div></div></div><div class="clock" aria-label="模拟时钟"><svg viewBox="0 0 300 300" aria-hidden="true" id="ticks"></svg><div class="face-word">Y I K E</div><div class="face-sub">A MOMENT OF YOUR OWN</div><div class="hand hour" id="h"></div><div class="hand minute" id="m"></div><div class="hand second" id="s"></div><div class="hub"></div></div></section><footer class="bottom"><span id="zone"></span><div class="dayline" title="今日已过"><i id="day"></i></div><span>此时 · 此地</span></footer></main>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');let manual=false,lastSecond=-1;
for(let i=0;i<60;i++){let a=i*Math.PI/30,r=i%5?138:132;$('#ticks').innerHTML+=`<line x1="${150+Math.sin(a)*r}" y1="${150-Math.cos(a)*r}" x2="${150+Math.sin(a)*143}" y2="${150-Math.cos(a)*143}" stroke="${i%5?'#6a7462':'#d8c6a0'}" stroke-width="${i%5?1:2}"/>`}
for(let i=1;i<=12;i++){let a=i*Math.PI/6;$('#ticks').innerHTML+=`<text x="${150+Math.sin(a)*113}" y="${155-Math.cos(a)*113}" fill="#c9c5b1" text-anchor="middle" font-family="Georgia" font-size="15">${i}</text>`}
$('#zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone.replaceAll('_',' ').toUpperCase();$('.theme').onclick=()=>{manual=true;document.body.classList.toggle('night')};
function frame(){let d=new Date(),s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,h=d.getHours()+m/60;$('#s').style.transform=`rotate(${s*6}deg)`;$('#m').style.transform=`rotate(${m*6}deg)`;$('#h').style.transform=`rotate(${h*30}deg)`;if(d.getSeconds()!==lastSecond){lastSecond=d.getSeconds();$('#time').innerHTML=`${pad(d.getHours())}:${pad(d.getMinutes())}<span>:${pad(d.getSeconds())}</span>`;$('#date').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('#day').style.width=(h/24*100)+'%';if(!manual)document.body.classList.toggle('night',h<6||h>=18);$('#period').textContent=h<6?'THE QUIET HOURS':h<12?'A FRESH BEGINNING':h<18?'MAKE IT COUNT':'SLOW DOWN, BREATHE'}requestAnimationFrame(frame)}frame();
</script></body></html>
