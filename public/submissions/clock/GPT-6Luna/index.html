<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Still / 时序</title>
<style>
:root{color-scheme:dark;--ink:#eaf1eb;--muted:#829188;--line:#263831;--mint:#b8d7c1;--gold:#e4bd78}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 52% 39%,#1c352f 0,#101d1b 42%,#091110 100%);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.frame{width:min(100%,760px);min-height:570px;border:1px solid #334a41;border-radius:28px;background:linear-gradient(145deg,#172622eF,#111a18f5);box-shadow:0 38px 100px #0008,inset 0 1px #fff1;overflow:hidden;position:relative}.frame:before{content:"";position:absolute;inset:12px;border:1px solid #ffffff0b;border-radius:19px;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:center;padding:29px 38px 0}.brand{letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--mint)}.edition,.live{color:var(--muted);font-size:10px;letter-spacing:.16em}.body{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:18px;padding:26px 46px 32px}.dial{width:min(100%,330px);aspect-ratio:1;border-radius:50%;justify-self:center;position:relative;background:radial-gradient(circle at 43% 34%,#253d36,#101a18 68%);box-shadow:0 0 0 1px #a7c6ad33,0 0 0 10px #192823,0 0 0 11px #789b8150,0 18px 40px #0008,inset 0 3px 22px #0008}.dial:before{content:"";position:absolute;inset:16px;border:1px solid #80978955;border-radius:50%;background:repeating-conic-gradient(from 0deg,#d7e4d9 0deg 1.05deg,transparent 1.05deg 6deg);mask:radial-gradient(circle,transparent 0 83%,#000 83.6% 85.3%,transparent 85.7%)}.dial:after{content:"";position:absolute;inset:28px;border:1px solid #ffffff12;border-radius:50%}.num{position:absolute;z-index:1;color:#d5dfd5;font:13px Georgia,serif;transform:translate(-50%,-50%)}.brandmark{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font:600 10px/1.4 Georgia,serif;letter-spacing:.19em;color:#c3d4c6;text-align:center}.brandmark small{display:block;font:8px/1.6 ui-sans-serif,system-ui;color:#879b8d;letter-spacing:.2em}.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:9px 9px 2px 2px;z-index:2}.hour{height:25%;width:5px;background:linear-gradient(90deg,#8da799,#eef3e9,#839a8b)}.minute{height:34%;width:3px;background:linear-gradient(90deg,#91aa9a,#f4f4df,#8aa391)}.second{height:37%;width:1px;background:var(--gold);box-shadow:0 0 7px #e7c37d99}.second:after{content:"";position:absolute;width:5px;height:5px;background:var(--gold);border-radius:50%;top:-6px;left:-2px}.hub{position:absolute;z-index:3;width:10px;height:10px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe4a9,#a77b43 66%,#453a2d);box-shadow:0 0 0 3px #101b19}.readout{padding:8px 4px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase}.digital{font-variant-numeric:tabular-nums;font-size:clamp(36px,7vw,58px);letter-spacing:-.06em;line-height:1.05;margin:13px 0 9px;color:#e4eee5}.digital span{color:#8ea99a}.date{font-size:13px;color:#b7c5b9}.rule{height:1px;background:linear-gradient(90deg,#69827455,transparent);margin:28px 0 19px}.details{display:grid;grid-template-columns:1fr 1fr;gap:15px}.label{color:var(--muted);font-size:9px;letter-spacing:.15em;text-transform:uppercase}.value{margin-top:5px;font-size:12px;color:#d1ddd2}.toggle{border:1px solid #40594e;background:#182722;color:#c8d8ca;border-radius:999px;padding:8px 13px;font:inherit;font-size:11px;cursor:pointer}.bottom{padding:0 38px 24px;display:flex;justify-content:space-between;color:#6e8277;font-size:9px;letter-spacing:.13em;text-transform:uppercase}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#9dc7a9;margin-right:7px;box-shadow:0 0 7px #9dc7a9}
@media(max-width:620px){body{padding:12px}.frame{min-height:0;border-radius:22px}.top{padding:24px 24px 0}.body{grid-template-columns:1fr;padding:26px 22px 20px;gap:24px}.dial{width:min(76vw,300px)}.readout{text-align:center}.rule{margin:20px 0 14px}.details{text-align:left}.bottom{padding:4px 25px 23px}}
</style>
</head>
<body><main class="frame"><header class="top"><div class="brand">STILL <span style="color:#718579">/</span> 时序</div><div class="edition">NO. 06 · LOCAL TIME</div></header><section class="body"><div class="dial" aria-label="模拟时钟"><div id="nums"></div><div class="brandmark">STILL<small>PRECISION · DAILY</small></div><i class="hand hour" id="hour"></i><i class="hand minute" id="minute"></i><i class="hand second" id="second"></i><i class="hub"></i></div><div class="readout"><div class="eyebrow" id="greeting">A quieter moment</div><div class="digital" id="digital">00<span>:</span>00<span>:</span>00</div><div class="date" id="date"></div><div class="rule"></div><div class="details"><div><div class="label">今日时区</div><div class="value" id="zone"></div></div><div><div class="label">光线时段</div><div class="value" id="light"></div></div><div><div class="label">今天第几天</div><div class="value" id="day"></div></div><div><div class="label">显示方式</div><div class="value"><button class="toggle" id="format" type="button">切换 12 / 24 小时</button></div></div></div></div></section><footer class="bottom"><span><i class="dot"></i>SECOND HAND · CONTINUOUS</span><span>BUILT FOR THE PRESENT</span></footer></main>
<script>
const $=s=>document.querySelector(s),dial=$('.dial');for(let n=1;n<=12;n++){const a=n*Math.PI/6-Math.PI/2,r=41;const e=document.createElement('b');e.className='num';e.textContent=n;e.style.left=`${50+r*Math.cos(a)}%`;e.style.top=`${50+r*Math.sin(a)}%`;dial.append(e)}let h24=false;$('#format').onclick=()=>{h24=!h24;tick()};function tick(){const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds()+d.getMilliseconds()/1000;$('#hour').style.transform=`translateX(-50%) rotate(${(h%12+m/60+s/3600)*30}deg)`;$('#minute').style.transform=`translateX(-50%) rotate(${(m+s/60)*6}deg)`;$('#second').style.transform=`translateX(-50%) rotate(${s*6}deg)`;const pad=n=>String(n).padStart(2,'0'),shown=h24?h:(h%12||12);$('#digital').innerHTML=`${pad(shown)}<span>:</span>${pad(m)}<span>:</span>${pad(Math.floor(s))}${h24?'':` <small style="font-size:11px;color:#91a89a;letter-spacing:.15em">${h<12?'AM':'PM'}</small>`}`;$('#date').textContent=new Intl.DateTimeFormat('zh-CN',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(d);$('#zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone||'Local';$('#light').textContent=h>=6&&h<12?'晨光 · MORNING':h>=12&&h<18?'日光 · DAYLIGHT':h>=18&&h<21?'暮色 · EVENING':'夜色 · NIGHT';$('#greeting').textContent=h>=5&&h<11?'A quieter morning':h>=11&&h<17?'A moment in daylight':'The day, held gently';const start=Date.UTC(d.getFullYear(),0,1),today=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()),days=Math.round((Date.UTC(d.getFullYear()+1,0,1)-start)/864e5);$('#day').textContent=`${Math.floor((today-start)/864e5)+1} / ${days} 天`;requestAnimationFrame(tick)}tick();
</script></body></html>
