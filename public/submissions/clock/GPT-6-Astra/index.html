<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian — A moment, considered</title>
<!-- An instrument-like clock in warm ivory. A continuously swept second hand shares its local time with the digital display. The palette follows local daylight; motion stops in hidden tabs. -->
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#dfded6;color:#282b28;font-family:Arial,sans-serif;padding:28px;transition:background 1s,color 1s}main{width:min(1040px,100%);background:#f4f2e9;border:1px solid #c9c9bd;padding:32px 42px;box-shadow:0 24px 60px #33342212}header,footer,.meta,.digital{display:flex;justify-content:space-between;align-items:center}.brand{font-size:15px;letter-spacing:5px;font-weight:700}.edition,.eyebrow,footer{font:10px/1.6 monospace;letter-spacing:1.5px}.edition{color:#6e7568}.layout{display:grid;grid-template-columns:1.25fr 1fr;align-items:center;gap:56px;padding:44px 0}.dial{width:100%;overflow:visible}.side{border-top:1px solid #babeb1;padding-top:21px}.eyebrow{color:#6e7568}h1{font:normal clamp(34px,4.4vw,56px)/1.07 Georgia,serif;letter-spacing:-2px;margin:26px 0 32px}.digital{gap:8px;justify-content:flex-start;font:clamp(31px,4vw,49px)/1 monospace;letter-spacing:-3px;font-variant-numeric:tabular-nums}.digital .seconds{font-size:22px;color:#bc492f;letter-spacing:-1px;align-self:flex-start;margin-top:5px}.date{font:12px monospace;margin:16px 0 34px;color:#5f665d}.track{height:3px;background:#d5d8cc;margin:12px 0 9px}.track i{display:block;height:100%;background:#bd4d31;transition:width 1s linear}.meta{font:9px monospace;color:#6b7465}.dot{width:6px;height:6px;border-radius:50%;background:#798469;display:inline-block;margin-right:8px}footer{border-top:1px solid #c9cbbf;padding-top:18px;color:#72786b}.night{background:#161b1b;color:#e6e9db}.night main{background:#222a29;border-color:#42514c}.night .face{fill:#26322f}.night .ink{fill:#d8dfcb}.night .line{stroke:#d8dfcb}.night .date,.night footer,.night .eyebrow,.night .meta,.night .edition{color:#a2b09e}.night .side,.night footer{border-color:#536251}.night .track{background:#3c4c40}@media(max-width:650px){body{padding:16px}main{padding:24px}.layout{grid-template-columns:1fr;gap:24px;padding:24px 0}.dial{max-width:340px;justify-self:center}.side{padding-top:16px}h1{font-size:36px;margin:12px 0 18px}.digital{font-size:42px}.date{margin-bottom:22px}.edition{font-size:8px}footer{font-size:8px}.meta{font-size:9px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main>
<header><span class="brand">MERIDIAN.</span><span class="edition">INSTRUMENT Nº 001<br>THE LOCAL TIME EDITION</span></header>
<div class="layout">
<svg class="dial" viewBox="0 0 400 400" role="img" aria-label="Analog local clock">
<defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".16"/></filter><radialGradient id="paper"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#e8e7dc"/></radialGradient></defs>
<circle cx="200" cy="200" r="196" fill="none" stroke="#aab09f" stroke-width=".6"/><circle class="face" cx="200" cy="200" r="184" fill="url(#paper)"/>
<g id="ticks"></g><g class="ink" fill="#363c33" font-family="Georgia,serif" font-size="22" text-anchor="middle"><text x="200" y="63">12</text><text x="344" y="208">3</text><text x="200" y="352">6</text><text x="57" y="208">9</text></g>
<text class="ink" x="200" y="120" text-anchor="middle" fill="#8a907d" font-family="monospace" font-size="9" letter-spacing="3">MERIDIAN</text>
<circle cx="200" cy="278" r="24" fill="none" stroke="#b6bdab" stroke-width=".7"/><text id="day" class="ink" x="200" y="281" text-anchor="middle" fill="#565e4d" font-family="monospace" font-size="10"></text><text x="200" y="291" text-anchor="middle" fill="#89917b" font-family="monospace" font-size="5">DAY</text>
<g filter="url(#shadow)"><path id="hour" class="ink" d="M194 218 196 104 200 93 204 104 206 218Z" fill="#353d32"/><path id="minute" class="ink" d="M197 221 198 60 200 50 202 60 203 221Z" fill="#353d32"/>
<g id="second"><path d="M199.2 238V39H200.8V238Z" fill="#bb4c32"/><circle cx="200" cy="230" r="7" fill="#bb4c32"/></g><circle cx="200" cy="200" r="7" fill="#c15637"/><circle cx="200" cy="200" r="2" fill="#edbf94"/></g>
</svg>
<section class="side"><div class="eyebrow"><span class="dot"></span>HERE, IN THIS MOMENT</div><h1>A moment,<br>considered.</h1><div class="digital" role="timer" aria-label="Current local time"><span id="time">00:00</span><span class="seconds" id="sec">00</span></div><div class="date" id="date"></div><div class="meta"><span id="zone">LOCAL TIME</span><span id="phase">DAYLIGHT</span></div><div class="track"><i id="progress"></i></div><div class="meta"><span>00:00</span><span>A DAY, IN PROGRESS</span><span>24:00</span></div></section>
</div><footer><span>PRECISION IN THE PRESENT.</span><span id="offset"></span></footer>
</main>
<script>
const $=id=>document.getElementById(id),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
for(let i=0;i<60;i++){const a=i*Math.PI/30,r=i%5?175:169;const e=document.createElementNS('http://www.w3.org/2000/svg','line');for(const [k,v]of Object.entries({x1:200+Math.sin(a)*r,y1:200-Math.cos(a)*r,x2:200+Math.sin(a)*181,y2:200-Math.cos(a)*181,stroke:i%5?'#a3aa96':'#606b55','stroke-width':i%5?1:2}))e.setAttribute(k,v);$('ticks').append(e);}
let stamp='',raf;function draw(){const d=new Date(),s=d.getSeconds()+(reduce?0:d.getMilliseconds()/1000),m=d.getMinutes()+s/60,h=d.getHours()+m/60;for(const [id,a]of [['second',s*6],['minute',m*6],['hour',h*30]])$(id).setAttribute('transform',`rotate(${a} 200 200)`);const key=d.toLocaleString();if(key!==stamp){stamp=key;$('time').textContent=[d.getHours(),d.getMinutes()].map(x=>String(x).padStart(2,'0')).join(':');$('sec').textContent=String(d.getSeconds()).padStart(2,'0');$('day').textContent=String(d.getDate()).padStart(2,'0');$('date').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const night=h<6||h>=18;document.body.classList.toggle('night',night);$('phase').textContent=night?'AFTER HOURS':'DAYLIGHT';$('zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone.replaceAll('_',' ').toUpperCase();$('offset').textContent=`UTC ${d.getTimezoneOffset()<=0?'+':'−'}${String(Math.floor(Math.abs(d.getTimezoneOffset())/60)).padStart(2,'0')}:${String(Math.abs(d.getTimezoneOffset())%60).padStart(2,'0')}`;$('progress').style.width=h/24*100+'%';}raf=requestAnimationFrame(draw);}
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden)draw();});draw();
</script></body></html>
