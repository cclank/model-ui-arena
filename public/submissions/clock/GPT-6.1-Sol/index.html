<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>午后刻度 · Local time</title>
<style>
:root{color-scheme:light;--paper:#f3f1e7;--ink:#252d23;--accent:#d3e6a6;--muted:#767c69}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC",sans-serif;transition:background 1.5s,color 1.5s;min-height:100svh;display:grid;place-items:center;padding:28px}body.night{--paper:#1e2924;--ink:#ebeedf;--muted:#a5b2a0;--accent:#b5d091}.studio{width:min(100%,1000px)}header,footer,.timebar{display:flex;justify-content:space-between;align-items:center;gap:16px}.mark{font-size:14px;letter-spacing:.24em;font-weight:bold}.label{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}header{border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent);padding-bottom:24px}.status{display:flex;align-items:center;gap:8px;font-size:11px}.dot{width:6px;height:6px;background:#89a859;border-radius:50%;box-shadow:0 0 0 5px #89a85918;animation:breathe 2s infinite}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:65px;align-items:center;padding:64px 0}.dial{aspect-ratio:1;position:relative;max-width:470px;width:100%;border-radius:50%;background:var(--accent);color:#253121;box-shadow:inset 0 0 0 1px #70885122,0 20px 50px #1b291910}.dial svg{width:100%;height:100%;overflow:visible}.dialtext{fill:#293523;font-size:10px;font-family:Arial;letter-spacing:2px}.hand{transform-origin:200px 200px}.hour{stroke:#293523;stroke-width:8;stroke-linecap:round}.minute{stroke:#293523;stroke-width:4;stroke-linecap:round}.second{stroke:#d45432;stroke-width:1.8}.statement{font-family:Georgia,"Songti SC",serif;font-size:clamp(32px,5vw,59px);font-weight:normal;line-height:1.12;letter-spacing:-.055em;margin:18px 0 25px}.statement span{display:block;color:var(--muted);font-style:italic}.readout{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:clamp(36px,5vw,60px);font-weight:normal;letter-spacing:-.05em;margin:30px 0 10px}.seconds{font-size:.55em;color:var(--muted);margin-left:8px}#date{font-size:12px;color:var(--muted)}.description{font-size:12px;line-height:1.8;max-width:260px;color:var(--muted);margin-top:26px}.timebar{font-size:11px;margin-top:35px;padding:14px 0;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}button{border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);color:var(--ink);padding:10px 14px;border-radius:30px;background:transparent;cursor:pointer;font-size:11px}button:hover{background:var(--accent);color:#253121}footer{font-size:10px;letter-spacing:.1em;color:var(--muted)}@keyframes breathe{50%{opacity:.35}}@media(max-width:650px){body{padding:22px}.layout{grid-template-columns:1fr;gap:30px;padding:35px 0}.dial{max-width:310px;justify-self:center}.statement{font-size:36px;margin:12px 0}.readout{font-size:49px;margin:20px 0 8px}.description{display:none}.timebar{margin-top:20px}footer{font-size:9px}.status{font-size:10px}}
</style></head>
<body><main class="studio"><header><div class="mark">刻 度 <span class="label">/ MOMENT</span></div><div class="status"><i class="dot"></i>正在经过的此刻</div></header>
<section class="layout"><div class="dial"><svg viewBox="0 0 400 400" role="img" aria-label="显示当前本地时间的模拟时钟"><g id="ticks"></g><text x="200" y="108" text-anchor="middle" class="dialtext">M O M E N T</text><text x="200" y="299" text-anchor="middle" class="dialtext" style="font-size:8px">LOCAL / EVERY SECOND</text><line id="hour" class="hand hour" x1="200" y1="209" x2="200" y2="128"/><line id="minute" class="hand minute" x1="200" y1="217" x2="200" y2="81"/><line id="second" class="hand second" x1="200" y1="232" x2="200" y2="53"/><circle cx="200" cy="200" r="7" fill="#293523"/><circle cx="200" cy="200" r="3" fill="#d45432"/></svg></div>
<div><div class="label" id="period">A LITTLE TIME, WELL SPENT.</div><h1 class="statement">留一点时间，<span>给此时此刻。</span></h1><div class="readout"><span id="hm">00:00</span><span class="seconds" id="ss">00</span></div><div id="date"></div><p class="description">指针缓缓行走，日光悄悄移转。<br>这里的每一秒，都与你同步。</p><div class="timebar"><span id="zone">LOCAL TIME</span><button id="format" aria-label="切换十二或二十四小时制">24 小时制</button></div></div></section>
<footer><span>GPT-6.1-SOL / TIME STUDY 01</span><span>慢一点，也很好。</span></footer></main>
<script>
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';let twelve=false,lastSecond=-1;
for(let i=0;i<60;i++){const a=i*Math.PI/30,r=i%5?172:161,l=document.createElementNS(ns,'line');for(const[k,v]of Object.entries({x1:200+Math.sin(a)*r,y1:200-Math.cos(a)*r,x2:200+Math.sin(a)*180,y2:200-Math.cos(a)*180,stroke:'#293523','stroke-width':i%5?1:2,opacity:i%5?.4:1}))l.setAttribute(k,v);$('ticks').append(l)}
for(let i=1;i<=12;i++){const a=i*Math.PI/6,t=document.createElementNS(ns,'text');t.setAttribute('x',200+Math.sin(a)*141);t.setAttribute('y',205-Math.cos(a)*141);t.setAttribute('text-anchor','middle');t.setAttribute('fill','#293523');t.setAttribute('font-size','13');t.textContent=i;$('ticks').append(t)}
$('format').onclick=()=>{twelve=!twelve;$('format').textContent=twelve?'12 小时制':'24 小时制';lastSecond=-1};
function update(){const d=new Date(),s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,h=d.getHours()+m/60;$('second').style.transform=`rotate(${s*6}deg)`;$('minute').style.transform=`rotate(${m*6}deg)`;$('hour').style.transform=`rotate(${h*30}deg)`;if(d.getSeconds()!==lastSecond){lastSecond=d.getSeconds();$('hm').textContent=[twelve?(d.getHours()%12||12):d.getHours(),d.getMinutes()].map(n=>String(n).padStart(2,'0')).join(':');$('ss').textContent=String(d.getSeconds()).padStart(2,'0');$('date').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const night=h<6||h>=18;document.body.classList.toggle('night',night);$('period').textContent=night?'THE QUIET HOURS.':'A LITTLE TIME, WELL SPENT.';$('zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone+(twelve?(h<12?' · AM':' · PM'):'')}if(!document.hidden)requestAnimationFrame(update)}document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});update();
</script></body></html>
