<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>山水长卷 · 卧游</title>
<style>
  :root{--ink:#efe4cc;--muted:rgba(239,228,204,.6);--gold:#d9b46a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#1a130e;color:var(--ink);font-family:"Songti SC","STSong","Noto Serif SC",serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

  @media (max-width:760px){.title{left:14px;top:12px}.title h1{font-size:19px}.info{right:14px;top:14px;font-size:11px}.hint{display:none}.ctrl{bottom:12px}button{padding:8px 11px;font-size:12px;letter-spacing:.06em}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>山水长卷</h1><p id="ttl"></p></div>
<div class="info" id="info"></div>
<div class="hint">拖动展卷，自右向左读<br>滚轮、方向键亦可 · 盖章后点击画面</div>
<div class="ctrl" id="ctrl"><button id="bAuto" class="on">卧游</button><button id="bNew">换一卷</button><button id="bStamp">盖章</button><button id="bHome">回到卷首</button></div>
<script>
"use strict";
/* ==========================================================================
   山水长卷 · 卧游 —— 无尽生成的水墨手卷（Canvas 2D，零依赖）
   · 手卷自右向左展开：最右是包首与引首（大字题名、引首章），隔水之后是画心，向左无限生成
   · 同一卷号 = 同一幅画：画心按“层 × 段”分块，每块由 hash(卷号, 层, 段) 播种；
     每个物件（山、树、屋、石、题跋）自带种子，跨块重绘时笔笔一致，所以块与块之间无缝
   · 三远法分层：远山（花青淡染）/ 中景（淡墨，塔、林）/ 近景（高远峭壁或平远水岸：披麻皴、斧劈皴、苔点）/ 前景
     各层视差不同，远层走得慢、墨色淡；层与层之间以游移的云雾留白相隔
   · 会呼吸：云雾游移、浓淡起伏；瀑布下泻、炊烟袅袅、渔舟来回、雁阵过空、帆影远行
   ========================================================================== */
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), $ = (i) => document.getElementById(i);
const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, smooth = (t) => t * t * (3 - 2 * t);
function rng(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash3 = (a, b, c) => { let h = (2166136261 ^ a) >>> 0; h = Math.imul(h ^ (b + 0x9e3779b9), 16777619); h = Math.imul(h ^ Math.imul(c, 0x27d4eb2d), 16777619); h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); return (h ^ (h >>> 15)) >>> 0; };
const gauss = (R) => Math.sqrt(-2 * Math.log(R() + 1e-9)) * Math.cos(TAU * R()), pick = (R, a) => a[Math.floor(R() * a.length)];
const PH = 1000, CW = 1000;                                            // 画心高 1000 单位；每块宽 1000 单位
const INK = (a) => `rgba(28,24,20,${a})`, BLUE = (a) => `rgba(62,80,100,${a})`, OCHRE = (a) => `rgba(160,112,64,${a})`, PAPER = "#e9dbba", PAPER_A = "rgba(234,222,194,0.97)";
let SEED = 0, QJ = false, TITLE = "", SIGN = "", SIGNER_NAME = "", SEALS = [];
const FLECKS = [];

/* ---------- 毛笔：起笔重按、收笔提锋，宽度抖动；dry > 0 时拆成数股并随机断笔 = 飞白 ---------- */
function brush(c, pts, w, col, R, o = {}) {
  const n = pts.length; if (n < 2) return;
  const press = o.press ?? 0.18, lift = o.lift ?? 0.6, dry = o.dry || 0, prof = (t) => (0.4 + 0.6 * Math.min(1, t / press)) * Math.max(0.1, Math.pow(1 - t, lift));
  const nrm = []; for (let i = 0; i < n; i++) { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; nrm.push([-dy / l, dx / l]); }
  const strands = dry ? 3 + Math.floor(dry * 4) : 1; c.fillStyle = col;
  for (let s = 0; s < strands; s++) {
    const off = strands === 1 ? 0 : (s / (strands - 1) - 0.5) * w * 0.8, sw = strands === 1 ? 1 : 0.5 + R() * 0.5; let L = [], Rt = [];
    const flush = () => { if (L.length > 1) { c.beginPath(); c.moveTo(L[0][0], L[0][1]); for (let i = 1; i < L.length; i++) c.lineTo(L[i][0], L[i][1]); for (let i = Rt.length - 1; i >= 0; i--) c.lineTo(Rt[i][0], Rt[i][1]); c.closePath(); c.fill(); } L = []; Rt = []; };
    for (let i = 0; i < n; i++) {
      if (dry && R() < dry * 0.16) { flush(); continue; }
      const t = i / (n - 1), hw = (w * prof(t) * sw * (0.85 + R() * 0.3)) / (strands === 1 ? 2 : strands * 0.9), nx = nrm[i][0], ny = nrm[i][1], cx = pts[i][0] + nx * off, cy = pts[i][1] + ny * off;
      L.push([cx + nx * hw, cy + ny * hw]); Rt.push([cx - nx * hw, cy - ny * hw]);
    }
    flush();
  }
}
function pl(x0, y0, x1, y1, n, bend, R, jit = 0.5) { const pts = [], dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l; for (let i = 0; i < n; i++) { const t = i / (n - 1), b = Math.sin(Math.PI * t) * bend + (R() - 0.5) * jit; pts.push([x0 + dx * t + nx * b, y0 + dy * t + ny * b]); } return pts; }
function blot(c, x, y, rx, ry, col, rot = 0) { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); c.fill(); }

/* ---------- 题名、落款、诗句素材（自拟组合） ---------- */
const TA = ["溪山", "江山", "云山", "松泉", "烟岚", "秋林", "春江", "雪霁", "万壑", "千岩", "林泉", "渔村"], TB = ["清远", "无尽", "卧游", "行旅", "秋霁", "晴晓", "渔隐", "烟雨", "归棹", "幽居", "胜览", "长春"];
const GAN = "甲乙丙丁戊己庚辛壬癸", ZHI = "子丑寅卯辰巳午未申酉戌亥", SEASON = ["春日", "夏日", "秋日", "冬日", "春暮", "秋暮"], SIGNER = ["霜天", "卧游者", "溪上人", "松下客"];
const PA = ["远岫", "寒林", "孤舟", "松风", "溪云", "野渡", "疏钟", "晴岚", "空江", "石径", "柴门", "夕照", "渔灯", "烟树", "春水", "秋山", "暮雪", "白鸥", "苍苔", "竹影", "归雁", "断桥", "茅檐", "清泉"];
const PB = ["初歇", "欲晚", "渐远", "相送", "不语", "犹湿", "半掩", "独往", "长流", "微茫", "未收", "如梦", "无声", "暗度", "轻飞", "自闲", "空明", "欲断"];
const PC = ["处", "里", "外", "中", "边", "后", "深", "迟", "闲", "归", "时", "寒"], PD = ["数峰", "一径", "千重", "几点", "半江", "满山", "一川", "两岸"];
const poemLine = (R, five) => (five ? "" : pick(R, PD)) + pick(R, PA) + pick(R, PB) + pick(R, PC);
const SEAL_TEXTS = ["卧游", "山长水远", "烟云供养", "闲云", "心远", "林泉高致", "溪山", "清赏"];
function makeSeal(text, zhu, R) {                                        // 印章：白文（红底白字）/ 朱文（红字红框），带印泥斑驳
  const S = 160, cvs = document.createElement("canvas"); cvs.width = cvs.height = S; const c = cvs.getContext("2d");
  const chars = [...text], n = chars.length, cols = n === 4 ? 2 : 1, rows = n === 4 ? 2 : n, w = cols === 1 ? S * 0.62 : S, x0 = (S - w) / 2, j = () => (R() - 0.5) * 5;
  const rect = new Path2D(); rect.moveTo(x0 + 6 + j(), 6 + j()); rect.lineTo(x0 + w - 6 + j(), 6 + j()); rect.lineTo(x0 + w - 6 + j(), S - 6 + j()); rect.lineTo(x0 + 6 + j(), S - 6 + j()); rect.closePath();
  const fs = cols === 2 ? S * 0.4 : Math.min(w * 0.8, ((S - 20) / rows) * 0.95), pos = (i) => (cols === 2 ? [x0 + (i < 2 ? w * 0.74 : w * 0.26), S * (i % 2 ? 0.72 : 0.29)] : [S / 2, 10 + ((S - 20) / rows) * (i + 0.5)]);
  c.fillStyle = c.strokeStyle = "#b3261e"; c.font = `700 ${fs}px "STKaiti","KaiTi","Kaiti SC","Songti SC",serif`; c.textAlign = "center"; c.textBaseline = "middle";
  if (!zhu) { c.fill(rect); c.globalCompositeOperation = "destination-out"; chars.forEach((ch, i) => c.fillText(ch, ...pos(i))); }
  else { c.lineWidth = 7; c.stroke(rect); chars.forEach((ch, i) => c.fillText(ch, ...pos(i))); }
  c.globalCompositeOperation = "destination-out"; for (let i = 0; i < 260; i++) { c.globalAlpha = 0.3 + R() * 0.7; c.beginPath(); c.arc(R() * S, R() * S, R() * 1.8, 0, TAU); c.fill(); }
  c.globalAlpha = 1; c.globalCompositeOperation = "source-over"; return cvs;
}

/* ---------- 云雾贴图（纸色半透明）与绢本纸纹 ---------- */
const MIST = document.createElement("canvas");
(() => { MIST.width = 512; MIST.height = 160; const c = MIST.getContext("2d"), R = rng(4242); c.scale(1, 0.4);
  for (let i = 0; i < 28; i++) { const x = 130 + R() * 252, y = 150 + R() * 100, r = 40 + R() * 70, g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, "rgba(236,226,200,.5)"); g.addColorStop(1, "rgba(236,226,200,0)"); c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); } })();
let PAPER_TILE = null;
function buildPaper(dpr) {
  const T = 420, p = document.createElement("canvas"); p.width = p.height = Math.round(T * dpr); const c = p.getContext("2d"), R = rng(99); c.scale(dpr, dpr);
  c.fillStyle = PAPER; c.fillRect(0, 0, T, T);
  for (let i = 0; i < 700; i++) { const x = R() * T, y = R() * T, l = 4 + R() * 14, a = R() * TAU; c.strokeStyle = R() < 0.5 ? "rgba(120,90,40,.05)" : "rgba(255,252,240,.12)"; c.lineWidth = 0.5 + R() * 0.8; c.beginPath(); for (const ox of [-T, 0, T]) for (const oy of [-T, 0, T]) { c.moveTo(x + ox, y + oy); c.lineTo(x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l); } c.stroke(); }   // 绕边重复 → 平铺无缝
  for (let y = 0; y < T; y += 3) { c.fillStyle = "rgba(120,96,60,.03)"; c.fillRect(0, y, T, 1); }                    // 绢丝经纬
  for (let x = 0; x < T; x += 3) { c.fillStyle = "rgba(255,250,235,.045)"; c.fillRect(x, 0, 1, T); }
  PAPER_TILE = p;
}

/* ---------- 山形：若干高斯峰叠加 + 体量包络 + 多尺度起伏 + 峰顶“矾头” ---------- */
function profile(e) {
  const R = rng(e.seed), far = e.style === "far", n = far ? 70 : 110, np = 1 + Math.floor(R() * (far ? 3 : 3.99)), pk = [];
  for (let i = 0; i < np; i++) pk.push({ c: (R() - 0.5) * 1.1, s: 0.1 + R() * 0.2, h: i ? 0.35 + R() * 0.5 : 1 });
  pk[0].c *= 0.4; const ph = [R() * 6, R() * 6, R() * 6, R() * 6], xs = [], ys = [];
  for (let i = 0; i <= n; i++) {
    const u = (i / n) * 2 - 1, env = Math.pow(Math.max(0, 1 - u * u), 0.9); let v = 0;
    for (const p of pk) v = Math.max(v, p.h * Math.exp(-((u - p.c) ** 2) / (2 * p.s * p.s)));
    v = Math.max(v, 0.28 * env) * env + env * (0.045 * Math.sin(u * 11 + ph[0]) + 0.025 * Math.sin(u * 27 + ph[1]) + 0.012 * Math.sin(u * 61 + ph[2]));
    v += env * Math.max(0, v - 0.55) * 0.12 * Math.abs(Math.sin(u * 40 + ph[3]));
    xs.push(e.cx + (u * e.w) / 2); ys.push(e.base - e.h * Math.max(0, v));
  }
  const P = { xs, ys, pk: [] }; for (const p of pk) { const x = e.cx + (p.c * e.w) / 2; P.pk.push({ x, y: ridgeAt(P, x), s: (p.s * e.w) / 2 }); }
  return P;
}
function ridgeAt(P, x) { const xs = P.xs, n = xs.length - 1; if (x <= xs[0]) return P.ys[0]; if (x >= xs[n]) return P.ys[n]; const f = ((x - xs[0]) / (xs[n] - xs[0])) * n, i = Math.floor(f); return lerp(P.ys[i], P.ys[Math.min(n, i + 1)], f - i); }
const nearestPeak = (P, x) => P.pk.reduce((a, b) => (Math.abs(b.x - x) < Math.abs(a.x - x) ? b : a));
function fallSpot(e, P) { const n = P.xs.length - 1; let bi = Math.round(n * 0.55), by = -1; for (let i = Math.round(n * 0.3); i <= Math.round(n * 0.7); i++) if (P.ys[i] > by) { by = P.ys[i]; bi = i; } return { x: P.xs[bi], y0: P.ys[bi] + 16, y1: e.base - 24, w: 12 }; }
function templeSpot(P) { const p = P.pk[0], x = p.x - p.s * 0.55; return { x, y: ridgeAt(P, x) + 26 }; }

/* ---------- 构图：近景每段在“高远峭壁 / 平远水岸 / 空阔水面”之间交替，保证疏密开合 ---------- */
const typeRaw = (k) => { const r = rng(hash3(SEED, 99, k))(); return r < 0.36 ? "cliff" : r < 0.7 ? "shore" : "water"; };
const typeOf = (k) => (k === -1 ? "shore" : typeRaw(k) === "cliff" && typeRaw(k + 1) === "cliff" ? "shore" : typeRaw(k));
function treeOf(x, y, h, R, sd, t) { return { kind: "tree", t: t || pick(R, ["pine", "leaf", "leaf", "willow", "pine"]), x, y, h, lean: (R() - 0.5) * 0.45, seed: sd() }; }
function gen(L, k) {
  const R = rng(hash3(SEED, L, k)), rr = (a, b) => a + R() * (b - a), sd = () => (R() * 4294967296) >>> 0, x0 = k * CW, E = [], live = [];
  if (L === 0) {                                                       // 远山：花青淡染
    for (let i = 0, n = R() < 0.6 ? 2 : 1; i < n; i++) E.push({ kind: "mtn", style: "far", cx: x0 + rr(100, 900), w: rr(650, 1300), h: rr(110, 260), base: rr(640, 660), tone: rr(0.2, 0.36), seed: sd() });
    live.push({ kind: "mist", x: x0 + 500, y: 632, w: 1400, h: 100, ph: R() * 6 });
  } else if (L === 1) {                                                // 中景：淡墨山、塔、帆、雁
    const cx = x0 + rr(150, 850), w = rr(420, 900);
    E.push({ kind: "mtn", style: "mid", cx, w, h: rr(170, 360), base: rr(692, 712), seed: sd(), pagoda: R() < 0.3 });
    live.push({ kind: "mist", x: cx, y: 676, w: w * 1.15, h: 90, ph: R() * 6 });
    if (R() < 0.4) live.push({ kind: "sail", x: x0 + rr(100, 900), y: rr(716, 738), s: rr(0.5, 0.8), ph: R() * 6, range: rr(30, 90) });
    if (R() < 0.25) live.push({ kind: "birds", x: x0 + rr(0, 1000), y: rr(140, 320), n: 4 + ((R() * 6) | 0), ph: R() * 6 });
  } else if (L === 2 && k < 0) {                                       // 近景
    const t = typeOf(k), shore = rr(765, 800);
    if (t === "cliff") {
      const cx = x0 + rr(300, 700), w = rr(520, 800), h = rr(470, 690), m = { kind: "mtn", style: "near", cx, w, h, base: shore + 8, seed: sd(), fall: R() < 0.55, temple: R() < 0.5, cun: R() < 0.5 ? "pima" : "fupi" };
      E.push(m); const P = profile(m);
      if (m.fall) { const f = fallSpot(m, P); live.push({ kind: "fall", ...f }); live.push({ kind: "mist", x: f.x, y: f.y1 - 6, w: 200, h: 60, ph: R() * 6 }); }
      if (m.temple) { const tp = templeSpot(P); live.push({ kind: "mist", x: tp.x + 20, y: tp.y + 16, w: 240, h: 56, ph: R() * 6 }); }
      live.push({ kind: "mist", x: cx + rr(-100, 100), y: m.base - h * rr(0.35, 0.55), w: w * 0.8, h: 80, ph: R() * 6 });
      for (let i = 0, n = 2 + ((R() * 3) | 0); i < n; i++) E.push({ kind: "rock", x: cx + rr(-w * 0.5, w * 0.5), y: shore + rr(6, 30), w: rr(50, 120), h: rr(30, 70), seed: sd() });
      for (let i = 0, n = 2 + ((R() * 3) | 0); i < n; i++) E.push(treeOf(cx + rr(-w * 0.55, w * 0.55), shore + rr(0, 14), rr(70, 130), R, sd));
      if (R() < 0.6) { const hx = cx + rr(-w * 0.45, w * 0.45); E.push({ kind: "hut", x: hx, y: shore + 6, s: rr(0.8, 1.1), seed: sd() }); live.push({ kind: "smoke", x: hx + 8, y: shore - 28, ph: R() * 6 }); }
    } else if (t === "shore") {
      for (let i = 0, n = R() < 0.6 ? 2 : 1; i < n; i++) E.push({ kind: "mtn", style: "near", cx: x0 + rr(150, 850), w: rr(300, 620), h: rr(90, 230), base: shore + 10, seed: sd(), cun: "pima" });
      const ta = x0 + rr(100, 450), tb = ta + rr(250, 450);
      for (let i = 0, n = 4 + ((R() * 7) | 0); i < n; i++) E.push(treeOf(rr(ta, tb), shore + rr(-4, 16), rr(70, 170), R, sd));
      for (let i = 0, n = R() < 0.55 ? 1 : 2; i < n; i++) { const hx = rr(ta - 60, tb + 60); E.push({ kind: "hut", x: hx, y: shore + 8, s: rr(0.8, 1.15), seed: sd() }); if (R() < 0.7) live.push({ kind: "smoke", x: hx + 8, y: shore - 26, ph: R() * 6 }); }
      if (R() < 0.4) E.push({ kind: "person", x: rr(ta, tb), y: shore + 16, seed: sd() });
      if (R() < 0.35) E.push({ kind: "bridge", x: x0 + rr(150, 850), y: shore + 14, w: rr(70, 120), seed: sd() });
      for (let i = 0, n = 2 + ((R() * 3) | 0); i < n; i++) E.push({ kind: "rock", x: x0 + rr(60, 940), y: shore + rr(10, 40), w: rr(40, 100), h: rr(24, 60), seed: sd() });
    } else {                                                           // 平远：大片留白水面

  if (!drag && cam.x > camMax) { cam.x = lerp(cam.x, camMax, 1 - Math.exp(-dt * 10)); cam.v = Math.min(cam.v, 0); }
  render(clock); info(); requestAnimationFrame(frame);
}
addEventListener("resize", layout); layout();
setSeed(+((location.hash.match(/\d+/) || [])[0] || 0) || 1 + Math.floor(Math.random() * 999999));
requestAnimationFrame(frame);
window.shanshui = {                                                     // 便于自动化验收
  state: () => ({ seed: SEED, style: QJ ? "浅绛" : "水墨", title: TITLE, camX: +cam.x.toFixed(1), camMax: +camMax.toFixed(1), renders: stats.renders, avgMs: +(stats.ms / Math.max(1, stats.renders)).toFixed(1), maxMs: +stats.maxMs.toFixed(1), cache: CACHE.size }),
  goto(x) { cam.x = x; cam.v = 0; idle = 0; }, auto(v) { auto = v; }, seed: setSeed, types: (a, b) => { const o = []; for (let k = a; k <= b; k++) o.push(typeOf(k)); return o; },
  checksum(L, k) { const c = renderChunk(L, k), d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data; let h = 0; for (let i = 0; i < d.length; i += 97) h = (h * 31 + d[i]) >>> 0; return h; },
};
