<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>录音机</title>
<style>
  :root{--bg1:#12131a;--bg2:#1c1f2e;--card:#191c29;--ink:#eef1ff;--sub:#98a0c0;--red:#ff4d5e;--line:#2b3049;--ok:#37d39b}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:grid;place-items:center;padding:20px;
    background:radial-gradient(120% 100% at 50% 0%,var(--bg2),var(--bg1));
    color:var(--ink);font-family:-apple-system,"PingFang SC",system-ui,sans-serif}
  .card{width:min(94vw,380px);background:linear-gradient(180deg,#1e2233,var(--card));
    border:1px solid var(--line);border-radius:24px;padding:22px 20px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;background:#3a4066;transition:.3s}
  .dot.rec{background:var(--red);box-shadow:0 0 0 0 rgba(255,77,94,.6);animation:bl 1.1s infinite}
  .dot.pause{background:var(--ok)}
  @keyframes bl{0%{box-shadow:0 0 0 0 rgba(255,77,94,.55)}70%{box-shadow:0 0 0 10px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}
  .time{font-size:46px;font-weight:800;text-align:center;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:2px 0 4px}
  .ms{font-size:20px;color:var(--sub);font-weight:600}
  canvas{width:100%;height:88px;display:block;border-radius:14px;background:#0f1220;border:1px solid var(--line)}
  .bar{height:4px;border-radius:4px;background:var(--line);margin:14px 0 4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#ff9068);transition:width .1s linear}
  .ctrls{display:flex;gap:12px;justify-content:center;margin-top:18px}
  button{flex:1;border:0;border-radius:16px;padding:15px 0;font-size:15px;font-weight:700;color:#fff;cursor:pointer;
    transition:transform .12s,filter .2s,opacity .2s;font-family:inherit}
  button:active{transform:scale(.95)}
  button:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.4)}
  .start{background:linear-gradient(180deg,#ff5f6d,var(--red))}
  .pause{background:linear-gradient(180deg,#3f4770,#333a5c)}
  .stop{background:linear-gradient(180deg,#4a5170,#3a4160)}
  .summary{margin-top:16px;padding:14px;border-radius:14px;background:#11141f;border:1px solid var(--line);
    font-size:13px;color:var(--sub);display:none;animation:fade .4s}
  .summary.show{display:block}
  .summary b{color:var(--ink)}
  .summary .row{display:flex;justify-content:space-between;padding:3px 0}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .hint{text-align:center;font-size:12px;color:#6b7398;margin-top:12px;min-height:16px}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="status"><span class="dot" id="dot"></span><span id="stext">待机</span></div>
      <div style="font-size:12px;color:var(--sub)">REC‑01</div>
    </div>
    <div class="time"><span id="mm">00</span>:<span id="ss">00</span><span class="ms" id="cs">.0</span></div>
    <canvas id="wave" width="680" height="176"></canvas>
    <div class="bar"><i id="prog"></i></div>
    <div class="ctrls">
      <button class="start" id="bStart">开始</button>
      <button class="pause" id="bPause" disabled>暂停</button>
      <button class="stop" id="bStop" disabled>停止</button>
    </div>
    <div class="summary" id="sum"></div>
    <div class="hint" id="hint"></div>
  </div>
<script>
  const cv=document.getElementById('wave'),ctx=cv.getContext('2d');
  const dot=document.getElementById('dot'),stext=document.getElementById('stext');
  const mm=document.getElementById('mm'),ss=document.getElementById('ss'),cs=document.getElementById('cs');
  const prog=document.getElementById('prog'),sum=document.getElementById('sum'),hint=document.getElementById('hint');
  const bS=document.getElementById('bStart'),bP=document.getElementById('bPause'),bT=document.getElementById('bStop');
  let state='idle',startT=0,acc=0,raf=null,level=0,data=new Array(120).fill(0),pendingStop=false;
  const MAX=60000;
  function elapsed(){return state==='rec'?acc+(performance.now()-startT):acc}
  function fmt(t){const m=Math.floor(t/60000),s=Math.floor(t%60000/1000),c=Math.floor(t%1000/100);
    mm.textContent=String(m).padStart(2,'0');ss.textContent=String(s).padStart(2,'0');cs.textContent='.'+c;
    prog.style.width=Math.min(100,t/MAX*100)+'%';}
  function setState(s){state=s;dot.className='dot'+(s==='rec'?' rec':s==='pause'?' pause':'');
    stext.textContent={idle:'待机',rec:'录音中',pause:'已暂停'}[s];
    bS.disabled=s==='rec';bS.textContent=s==='pause'?'继续':'开始';
    bP.disabled=s!=='rec';bP.textContent=s==='pause'?'已暂停':'暂停';
    bT.disabled=s==='idle';}
  function draw(){
    const w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);
    const target=state==='rec'?(0.25+Math.random()*0.75):state==='pause'?0.05:0;
    level+=(target-level)*0.25;data.push(level);data.shift();
    const bw=w/data.length,mid=h/2;
    ctx.fillStyle='rgba(255,77,94,.15)';ctx.fillRect(0,0,w,h);
    for(let i=0;i<data.length;i++){
      const bh=Math.max(3,data[i]*(h-24)*(0.7+0.3*Math.sin(i*0.4+performance.now()/300)));
      const g=ctx.createLinearGradient(0,mid-bh/2,0,mid+bh/2);
      g.addColorStop(0,'#ff9068');g.addColorStop(.5,'#ff4d5e');g.addColorStop(1,'#c9184a');
      ctx.fillStyle=state==='rec'?g:'rgba(120,130,170,.4)';
      ctx.fillRect(i*bw+bw*0.2,mid-bh/2,bw*0.6,bh);
    }
    fmt(elapsed());
    if(elapsed()>=MAX&&state==='rec'){hint.textContent='已达最长录音 60s，自动停止';doStop();return;}
    raf=requestAnimationFrame(draw);
  }
  function doStop(){
    const t=elapsed();acc=t;setState('idle');
    sum.className='summary show';
    sum.innerHTML='<div class="row"><span>本次录音</span><b>已完成</b></div>'+
      '<div class="row"><span>时长</span><b>'+mm.textContent+':'+ss.textContent+cs.textContent+'</b></div>'+
      '<div class="row"><span>采样</span><b>48 kHz · 单声道</b></div>'+
      '<div class="row"><span>状态</span><b style="color:var(--ok)">已保存</b></div>';
    hint.textContent='';
  }
  bS.onclick=()=>{sum.className='summary';if(state==='idle'){acc=0;data.fill(0);}startT=performance.now();setState('rec');hint.textContent='';};
  bP.onclick=()=>{if(state==='rec'){acc=elapsed();setState('pause');}else if(state==='pause'){startT=performance.now();setState('rec');}};
  bT.onclick=()=>{
    if(pendingStop){pendingStop=false;bT.textContent='停止';doStop();return;}
    pendingStop=true;bT.textContent='再按确认';hint.textContent='再次点击「再按确认」以停止并保存';
    setTimeout(()=>{if(pendingStop){pendingStop=false;bT.textContent='停止';hint.textContent='';}},2600);
  };
  setState('idle');fmt(0);draw();
</script>
</body>
</html>
