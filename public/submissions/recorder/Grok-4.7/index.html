<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKE · 录音机</title>
<style>
:root{color-scheme:dark;--bg:#12110f;--panel:#1c1b18;--ink:#f3efe6;--muted:#9a9184;--line:#34312b;--amber:#e7a23a;--red:#e23b2f;--ok:#d7c4a1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(80% 50% at 50% 0%,#2a241c,var(--bg));color:var(--ink);font:15px/1.4 ui-sans-serif,"PingFang SC","Segoe UI",sans-serif;display:grid;place-items:center;padding:18px}
.deck{width:min(420px,100%);background:linear-gradient(#26231e,#171613);border:1px solid #3a342c;border-radius:22px;padding:18px 16px 16px;box-shadow:0 24px 50px #0008,inset 0 1px 0 #ffffff14}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font:11px ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--amber)}
.led{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:#3a332c;box-shadow:inset 0 0 0 1px #000}
.rec .dot{background:var(--red);box-shadow:0 0 12px var(--red);animation:blink 1s steps(1) infinite}
.pause .dot{background:var(--amber)}
@keyframes blink{50%{opacity:.25}}
.time{font:64px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.state{color:var(--muted);min-height:1.2em;margin:0 0 12px}
.wave{height:74px;display:flex;align-items:center;gap:3px;padding:8px;border-radius:12px;background:#0e0d0b;border:1px solid #2c2823}
.wave i{flex:1;height:18%;border-radius:99px;background:linear-gradient(var(--amber),#8a5a16);transform-origin:center;animation:eq .9s ease-in-out infinite alternate;animation-delay:var(--d);animation-play-state:paused;opacity:.45}
.rec .wave i{animation-play-state:running;opacity:1}
@keyframes eq{from{height:16%}to{height:var(--h)}}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
button{font:inherit;border-radius:12px;border:1px solid var(--line);background:#2a2621;color:var(--ink);padding:12px 8px;cursor:pointer}
button:disabled{opacity:.38;cursor:not-allowed}
button.primary{background:var(--red);border-color:#a32018;color:#fff}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.confirm,.sum{margin-top:12px;background:#100f0d;border:1px solid #3a342c;border-radius:12px;padding:12px}
.confirm p,.sum p{margin:0 0 8px;color:var(--muted);font-size:13px}
.sum strong{font:28px ui-monospace,Menlo,monospace}
.sum span{display:block;color:var(--ok);margin-top:4px}
.confirm .row{margin-top:0}
[hidden]{display:none!important}
@media(max-width:390px){.time{font-size:52px}}
</style>
</head>
<body>
<main class="deck" id="deck">
  <div class="top"><div class="brand">TAKE · FIELD</div><div class="led"><i class="dot"></i><span id="led">待命</span></div></div>
  <div class="time" id="time">00:00</div>
  <p class="state" id="state">尚未开始</p>
  <div class="wave" id="wave" aria-hidden="true"></div>
  <div class="row">
    <button id="start" class="primary" type="button">开始</button>
    <button id="pause" type="button" disabled>暂停</button>
    <button id="stop" type="button" disabled>停止</button>
  </div>
  <div class="confirm" id="confirm" hidden>
    <p>结束并保存这段录音？计时将停在当前时长。</p>
    <div class="row"><button id="cancel" type="button">继续</button><button id="ok" class="primary" type="button">确认停止</button></div>
  </div>
  <section class="sum" id="sum" hidden>
    <p>本次录音摘要</p>
    <strong id="sum-time">00:00</strong>
    <span id="sum-meta"></span>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const wave=$("wave");
for(let i=0;i<32;i++){
  const b=document.createElement("i");
  b.style.setProperty("--d",`${(i%10)*0.07}s`);
  b.style.setProperty("--h",`${40+Math.abs(Math.sin(i*1.3))*55}%`);
  wave.appendChild(b);
}
let mode="idle", acc=0, t0=0, takes=0;
const deck=$("deck");
function elapsed(){return acc+(mode==="rec"?performance.now()-t0:0)}
function fmt(ms){const s=Math.floor(ms/1000);return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
function paint(){
  $("time").textContent=fmt(elapsed());
  if(mode==="rec") requestAnimationFrame(paint);
}
function render(){
  deck.classList.toggle("rec",mode==="rec");
  deck.classList.toggle("pause",mode==="pause");
  const label={idle:"待命",rec:"录音中",pause:"已暂停",done:"已保存"}[mode];
  $("led").textContent=label;
  $("state").textContent={idle:"按开始，计时从 00:00 走",rec:"红点闪烁 · 波形跟随",pause:"计时已冻结，可继续或停止",done:"摘要已生成，可开始下一条"}[mode];
  $("start").disabled=mode==="rec";
  $("start").textContent=mode==="pause"?"继续":"开始";
  $("pause").disabled=mode!=="rec";
  $("stop").disabled=mode!=="rec"&&mode!=="pause";
  if(mode!=="rec") $("confirm").hidden=true;
}
$("start").onclick=()=>{
  if(mode==="pause"){mode="rec";t0=performance.now();paint();render();return}
  acc=0; takes++; mode="rec"; t0=performance.now();
  $("sum").hidden=true; paint(); render();
};
$("pause").onclick=()=>{if(mode!=="rec")return;acc=elapsed();mode="pause";render()};
$("stop").onclick=()=>{if(mode==="rec"||mode==="pause")$("confirm").hidden=false};
$("cancel").onclick=()=>{$("confirm").hidden=true};
$("ok").onclick=()=>{
  if(mode==="rec") acc=elapsed();
  const ms=acc; mode="done";
  $("time").textContent=fmt(ms);
  $("sum-time").textContent=fmt(ms);
  $("sum-meta").textContent=`TAKE ${String(takes).padStart(2,"0")} · 状态：已停止并保存 · 时长 ${fmt(ms)}`;
  $("sum").hidden=false; $("confirm").hidden=true; render();
};
render();
</script>
</body>
</html>
