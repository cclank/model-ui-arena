<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Notes — Pocket recorder</title>
<!-- A tactile tape recorder. This explicitly simulated recording uses a monotonic clock, excludes paused time and retains a session summary. No microphone permission is requested. -->
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#b96345;display:grid;place-items:center;padding:32px 16px;font-family:Arial,sans-serif;color:#282820;background-image:radial-gradient(ellipse at 30% 10%,#d48864,transparent 70%)}main{width:min(500px,100%)}.intro{display:flex;justify-content:space-between;align-items:end;color:#fbe6d1;margin:0 5px 25px}.intro h1{font:italic 38px Georgia;margin:0}.intro span{font:9px/1.6 monospace;letter-spacing:2px;text-align:right}.machine{background:linear-gradient(120deg,#ece7d5,#d5d0bd);border:1px solid #f7ead4;border-radius:22px;padding:28px;box-shadow:0 30px 35px #4c26174a,inset 0 -5px 0 #aba997;position:relative}.top{display:flex;justify-content:space-between;align-items:center}.name{font-size:17px;letter-spacing:5px;font-weight:800}.tag{font:8px monospace;letter-spacing:1px;border:1px solid #969c86;padding:5px;border-radius:3px}.deck{position:relative;margin:25px 0 22px;border:8px solid #595e50;background:#a7ae91;border-radius:10px;box-shadow:inset 0 5px 12px #31382144,0 2px 2px #fff8}.cassette{display:block;width:100%}.roll{transform-origin:center;transform-box:fill-box;animation:spin 3s linear infinite;animation-play-state:paused}.recording .roll{animation-play-state:running}.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 30%,#fff2 31%,#fff1 60%,transparent 61%)}.display{background:#26362c;border:3px solid #8f9580;border-radius:6px;padding:16px;color:#c9d8a8;box-shadow:inset 0 3px 8px #1118}.readout{display:flex;align-items:center;justify-content:space-between}.led{width:7px;height:7px;border-radius:50%;background:#607554;display:inline-block;margin-right:7px}.recording .led{background:#ff7951;box-shadow:0 0 10px #ff7951;animation:blink 1s infinite}.state{font:10px monospace;letter-spacing:2px}#timer{font:36px/1 monospace;letter-spacing:1px;font-variant-numeric:tabular-nums}.levels{display:flex;gap:4px;align-items:end;height:30px;margin:18px 0 4px}.levels i{flex:1;max-width:8px;height:2px;background:#b5c492;transition:height .1s}.ticks{display:flex;justify-content:space-between;font:8px monospace;opacity:.6}.controls{display:flex;gap:10px;margin-top:22px}button{border:1px solid #a6a892;border-radius:5px;background:linear-gradient(#efecdd,#c9cbb8);height:57px;flex:1;color:#353c31;box-shadow:0 4px 0 #949783;font:9px monospace;letter-spacing:1px;cursor:pointer}button svg{display:block;margin:0 auto 5px;width:13px;height:13px}button:first-child{color:#b1452c}button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #949783}button:disabled{opacity:.35;cursor:not-allowed}button:focus-visible{outline:3px solid #bd4b2c;outline-offset:5px}.speaker{display:flex;gap:4px;margin-top:25px;height:23px;align-items:center}.speaker i{height:100%;width:3px;background:#797f6b;border-radius:4px;box-shadow:1px 0 #fffc}.speaker span{margin-left:auto;font:8px monospace;letter-spacing:1px;color:#727865}.screw{position:absolute;width:6px;height:6px;background:#929581;border-radius:50%;bottom:13px;box-shadow:inset 0 1px #555}.screw:after{content:'';position:absolute;inset:3px 1px 2px;background:#525a47}.screw:last-child{right:15px}.summary{background:#f8ebd6;margin:24px 13px 0;padding:19px 23px;box-shadow:0 8px 14px #59231522;transform:rotate(-1deg);animation:appear .3s ease-out}.summary[hidden]{display:none}.summary h2{font:italic 22px Georgia;margin:0 0 12px}.receipt{display:flex;justify-content:space-between;border-top:1px dashed #c2b7a5;padding-top:12px;font:11px/1.6 monospace}.note{text-align:center;color:#f1d0b5;font:10px/1.8 monospace;margin-top:24px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.45}}@keyframes appear{from{opacity:0;translate:0 -10px}}@media(max-width:410px){.machine{padding:22px}.intro h1{font-size:34px}}@media(prefers-reduced-motion:reduce){.roll,.led,.summary{animation:none!important}}
</style></head><body><main>
<div class="intro"><h1>Field notes.</h1><span>KEEP A LITTLE<br>OF THE EVERYDAY.</span></div>
<section class="machine" id="machine" aria-label="Simulated tape recorder"><div class="top"><span class="name">FIELD / 01</span><span class="tag">POCKET RECORDER</span></div>
<div class="deck"><svg class="cassette" viewBox="0 0 360 160" aria-label="Twin reel cassette"><rect x="10" y="12" width="340" height="137" rx="9" fill="#c8c8ac" stroke="#767c66"/><path d="M20 35H340V60H20Z" fill="#b8553a"/><text x="28" y="29" fill="#545b46" font-size="8" font-family="monospace">SIDE A · THE SOUND OF BEING HERE</text><rect x="32" y="65" width="296" height="61" rx="30" fill="#48543e"/><circle cx="83" cy="95" r="34" fill="#302f22"/><circle cx="277" cy="95" r="34" fill="#302f22"/><path d="M83 62H277M83 128H277" stroke="#454732" stroke-width="5"/><g fill="#d9d5b7" stroke="#778363" stroke-width="3"><g class="roll"><circle cx="83" cy="95" r="24"/><path d="M83 75V86M83 104V115M63 95H74M92 95H103M69 81 77 89M89 101 97 109M69 109 77 101M89 89 97 81"/></g><g class="roll"><circle cx="277" cy="95" r="24"/><path d="M277 75V86M277 104V115M257 95H268M286 95H297M263 81 271 89M283 101 291 109M263 109 271 101M283 89 291 81"/></g></g><rect x="135" y="78" width="90" height="35" rx="4" fill="#899574"/><path d="M145 85V106M160 85V106M175 85V106M190 85V106M205 85V106" stroke="#c4c9a6" stroke-width="2"/><path d="M108 148 120 130H240L252 148" fill="#a6ad8e" stroke="#737e61"/><text x="306" y="140" font-family="monospace" font-size="8" fill="#525d42">C—60</text></svg><div class="glass"></div></div>
<div class="display"><div class="readout"><span class="state"><i class="led"></i><span id="state" aria-live="polite">READY</span></span><output id="timer">00:00</output></div><div class="levels" id="levels" aria-hidden="true"></div><div class="ticks"><span>−40</span><span>−20</span><span>−10</span><span>0 dB</span></div></div>
<div class="controls"><button id="start" aria-label="Start recording"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="currentColor"/></svg><span id="start-label">START</span></button><button id="pause" disabled><svg viewBox="0 0 16 16"><path d="M3 2H6V14H3ZM10 2H13V14H10Z" fill="currentColor"/></svg>PAUSE</button><button id="stop" disabled><svg viewBox="0 0 16 16"><path d="M2 2H14V14H2Z" fill="currentColor"/></svg>STOP</button></div>
<div class="speaker" id="speaker"><span>DESIGNED FOR LISTENING.</span></div><i class="screw"></i><i class="screw"></i></section>
<section class="summary" id="summary" hidden aria-live="polite"><h2>A moment, kept.</h2><div class="receipt"><span id="session">SESSION 01<br>SIMULATION COMPLETE</span><span id="duration">00:00</span></div></section>
<p class="note">INTERACTIVE PROTOTYPE · SIMULATED AUDIO<br>Press record. Take your time.</p>
</main><script>
const $=id=>document.getElementById(id);let mode='ready',elapsed=0,began=0,session=0;const bars=[];for(let i=0;i<37;i++){const b=document.createElement('i');$('levels').append(b);bars.push(b);}for(let i=0;i<31;i++)$('speaker').prepend(document.createElement('i'));
const ms=()=>elapsed+(mode==='recording'?performance.now()-began:0),fmt=t=>`${String(Math.floor(t/60000)).padStart(2,'0')}:${String(Math.floor(t/1000)%60).padStart(2,'0')}`;
function render(){const rec=mode==='recording';$('machine').classList.toggle('recording',rec);$('state').textContent=mode.toUpperCase();$('start').disabled=rec;$('start-label').textContent=mode==='paused'?'RESUME':'START';$('start').setAttribute('aria-label',mode==='paused'?'Resume recording':'Start recording');$('pause').disabled=!rec;$('stop').disabled=mode!=='recording'&&mode!=='paused';$('timer').textContent=fmt(ms());}
$('start').onclick=()=>{if(mode==='recording')return;if(mode!=='paused'){elapsed=0;session++;$('summary').hidden=true;}began=performance.now();mode='recording';render();};
$('pause').onclick=()=>{if(mode!=='recording')return;elapsed=ms();mode='paused';render();};
$('stop').onclick=()=>{if(!['recording','paused'].includes(mode))return;elapsed=ms();mode='stopped';$('duration').textContent=fmt(elapsed);$('session').innerHTML=`SESSION ${String(session).padStart(2,'0')}<br>SIMULATION COMPLETE`;$('summary').hidden=false;render();};
setInterval(()=>{if(document.hidden)return;$('timer').textContent=fmt(ms());const t=performance.now()/180;bars.forEach((b,i)=>{b.style.height=(mode==='recording'?4+Math.abs(Math.sin(i*.63+t)*Math.cos(i*.2-t*.6))*24:mode==='paused'?4:2)+'px';});},90);render();
</script></body></html>
