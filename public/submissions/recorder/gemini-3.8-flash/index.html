<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Memo Recorder - Gemini 3.8 Flash</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f1f5f9; padding: 16px;
    }
    .recorder-box {
      position: relative; width: 350px; padding: 24px; border-radius: 24px;
      background: rgba(17, 24, 39, 0.85); border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); backdrop-filter: blur(16px);
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .status-row {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      font-size: 0.8rem; color: #94a3b8; letter-spacing: 0.5px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 12px; background: rgba(255, 255, 255, 0.06); font-weight: 600;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .recording .dot { background: #ef4444; animation: pulse 1s infinite alternate; }
    .paused .dot { background: #f59e0b; }
    @keyframes pulse { from { opacity: 0.3; transform: scale(0.85); } to { opacity: 1; transform: scale(1.15); } }
    .timer {
      font-size: 3.2rem; font-weight: 800; font-variant-numeric: tabular-nums;
      color: #f8fafc; letter-spacing: 1px;
    }
    .visualizer {
      width: 100%; height: 50px; display: flex; align-items: center;
      justify-content: center; gap: 4px;
    }
    .v-bar {
      flex: 1; height: 6px; background: #6366f1; border-radius: 4px;
      transition: height 0.08s ease, background 0.3s;
    }
    .recording .v-bar { background: linear-gradient(180deg, #ec4899, #8b5cf6); }
    .controls { display: flex; align-items: center; gap: 16px; margin: 6px 0; }
    .btn {
      width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.08); color: #f1f5f9; transition: all 0.2s ease;
    }
    .btn:hover:not(:disabled) { transform: scale(1.08); background: rgba(255, 255, 255, 0.16); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-main { width: 64px; height: 64px; background: #ef4444; color: #fff; font-size: 1.3rem; }
    .btn-main:hover:not(:disabled) { background: #dc2626; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
    .history-card {
      width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px; font-size: 0.85rem; max-height: 120px; overflow-y: auto;
    }
    .history-head { font-weight: 600; color: #94a3b8; margin-bottom: 8px; font-size: 0.75rem; text-transform: uppercase; }
    .rec-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.04);
      margin-bottom: 6px; font-size: 0.8rem;
    }
    .modal {
      position: absolute; inset: 0; border-radius: 24px; background: rgba(11, 15, 25, 0.94);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 20px; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal.show { opacity: 1; pointer-events: auto; }
    .modal-btn {
      padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="recorder-box" id="recorder">
    <div class="modal" id="stopModal">
      <div style="font-weight: 600; font-size: 0.95rem; text-align: center;">确定要停止并保存录音吗？</div>
      <div style="display: flex; gap: 12px;">
        <button class="modal-btn" style="background: #ef4444; color: white;" onclick="confirmStop()">停止保存</button>
        <button class="modal-btn" style="background: rgba(255,255,255,0.1); color: white;" onclick="closeModal()">取消</button>
      </div>
    </div>
    <div class="status-row">
      <span class="badge"><span class="dot"></span><span id="statusTxt">待命就绪</span></span>
      <span style="font-size: 0.75rem; opacity: 0.6;">48kHz • 24bit</span>
    </div>
    <div class="timer" id="timer">00:00</div>
    <div class="visualizer" id="vis"></div>
    <div class="controls">
      <button class="btn" id="stopBtn" disabled onclick="requestStop()" title="停止">⏹</button>
      <button class="btn btn-main" id="playBtn" onclick="toggleRecord()" title="录音/暂停">⏺</button>
      <button class="btn" id="resetBtn" disabled onclick="resetAll()" title="重置">↺</button>
    </div>
    <div class="history-card">
      <div class="history-head">录音摘要与历史</div>
      <div id="recList">
        <div style="text-align: center; color: #64748b; font-size: 0.75rem; padding: 10px;">暂无录音记录</div>
      </div>
    </div>
  </div>
  <script>
    const box = document.getElementById('recorder');
    const statusTxt = document.getElementById('statusTxt');
    const timerEl = document.getElementById('timer');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const vis = document.getElementById('vis');
    const recList = document.getElementById('recList');
    const modal = document.getElementById('stopModal');

    const BARS = 20;
    for (let i = 0; i < BARS; i++) {
      const b = document.createElement('div');
      b.className = 'v-bar';
      vis.appendChild(b);
    }
    const bars = document.querySelectorAll('.v-bar');

    let state = 'idle';
    let elapsed = 0, timerId = null, animId = null;

    function formatTime(s) {
      const m = String(Math.floor(s / 60)).padStart(2, '0');
      const sec = String(s % 60).padStart(2, '0');
      return `${m}:${sec}`;
    }

    function updateVis() {
      bars.forEach(bar => {
        const h = state === 'recording' ? Math.floor(Math.random() * 40) + 8 : 6;
        bar.style.height = `${h}px`;
      });
    }

    function toggleRecord() {
      if (state === 'idle') {
        state = 'recording';
        box.className = 'recorder-box recording';
        statusTxt.textContent = '录音中...';
        playBtn.textContent = '⏸';
        stopBtn.disabled = false;
        resetBtn.disabled = true;
        timerId = setInterval(() => { elapsed++; timerEl.textContent = formatTime(elapsed); }, 1000);
        animId = setInterval(updateVis, 100);
      } else if (state === 'recording') {
        state = 'paused';
        box.className = 'recorder-box paused';
        statusTxt.textContent = '已暂停';
        playBtn.textContent = '⏺';
        clearInterval(timerId);
        clearInterval(animId);
        updateVis();
      } else if (state === 'paused') {
        state = 'recording';
        box.className = 'recorder-box recording';
        statusTxt.textContent = '录音中...';
        playBtn.textContent = '⏸';
        timerId = setInterval(() => { elapsed++; timerEl.textContent = formatTime(elapsed); }, 1000);
        animId = setInterval(updateVis, 100);
      }
    }

    function requestStop() {
      if (elapsed > 2) {
        modal.classList.add('show');
      } else {
        confirmStop();
      }
    }
    function closeModal() { modal.classList.remove('show'); }

    function confirmStop() {
      closeModal();
      clearInterval(timerId);
      clearInterval(animId);
      const timeStr = formatTime(elapsed);
      if (elapsed > 0) {
        if (recList.children.length === 1 && recList.children[0].textContent.includes('暂无')) {
          recList.innerHTML = '';
        }
        const item = document.createElement('div');
        item.className = 'rec-item';
        const now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        item.innerHTML = `<span>Take_${now}</span><span style="color:#38bdf8; font-weight:600;">${timeStr}</span>`;
        recList.prepend(item);
      }
      resetAll();
    }

    function resetAll() {
      clearInterval(timerId);
      clearInterval(animId);
      state = 'idle';
      elapsed = 0;
      timerEl.textContent = '00:00';
      statusTxt.textContent = '待命就绪';
      box.className = 'recorder-box';
      playBtn.textContent = '⏺';
      stopBtn.disabled = true;
      resetBtn.disabled = true;
      updateVis();
    }
  </script>
</body>
</html>
