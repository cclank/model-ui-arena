function renderGrid(){const first=new Date(Date.UTC(shownYear,shownMonth,1,4)),offset=(first.getUTCDay()+6)%7,start=new Date(first.getTime()-offset*DAY),today=localToday();$('year').value=shownYear;$('month').value=shownMonth;$('prev').disabled=shownYear===1900&&shownMonth===0;$('next').disabled=shownYear===2100&&shownMonth===11;$('grid').innerHTML=Array.from({length:42},(_,i)=>{const date=new Date(start.getTime()+i*DAY),s=iso(date);if(s<MIN||s>MAX)return `<button class="cell" role="gridcell" disabled aria-label="超出支持范围">${date.getUTCDate()}</button>`;const l=lunar(s),term=yearTerms(date.getUTCFullYear()).get(s),fest=festival(s,l),label=fest||term||(l.day===1?(l.leap?'闰':'')+l.monthName+'月':dayName(l.day));return `<button class="cell${date.getUTCMonth()!==shownMonth?' other':''}${s===today?' today':''}${fest?' festival':term?' term':''}" role="gridcell" data-date="${s}" aria-label="${s} ${l.leap?'闰':''}${l.monthName}月${dayName(l.day)} ${fest||term||''}" aria-selected="${s===selected}" tabindex="${s===selected?0:-1}">${date.getUTCDate()}<small>${label}</small></button>`}).join('')}
function shiftMonth(n,focus=false){const d=dateUTC(selected),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);const max=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,max));let s=iso(d);s=s<MIN?MIN:s>MAX?MAX:s;select(s,focus)}$('prev').onclick=()=>shiftMonth(-1);$('next').onclick=()=>shiftMonth(1);$('today').onclick=()=>select(localToday());$('year').onchange=$('month').onchange=()=>{const y=+$('year').value,m=+$('month').value,day=Math.min(+selected.slice(8),new Date(Date.UTC(y,m+1,0)).getUTCDate());let s=iso(new Date(Date.UTC(y,m,day,4)));select(s<MIN?MIN:s>MAX?MAX:s)};
$('grid').onclick=e=>{const cell=e.target.closest('[data-date]');if(cell)select(cell.dataset.date)};$('grid').onkeydown=e=>{const move={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};if(e.key in move){e.preventDefault();select(add(selected,move[e.key]),true)}else if(e.key==='PageUp'||e.key==='PageDown'){e.preventDefault();shiftMonth((e.key==='PageUp'?-1:1)*(e.shiftKey?12:1),true)}else if(e.key==='Home'){e.preventDefault();select(add(selected,-((dateUTC(selected).getUTCDay()+6)%7)),true)}else if(e.key==='End'){e.preventDefault();select(add(selected,6-(dateUTC(selected).getUTCDay()+6)%7),true)}};
function query(){const s=$('q-date').value;if(!s||s<MIN||s>MAX){$('q-result').textContent='请选择 1900-01-31 至 2100-12-31 范围内的有效日期。';$('q-result').classList.add('error');return}try{select(s)}catch(e){$('q-result').textContent='此浏览器无法计算中国历法，请使用新版浏览器重试。';$('q-result').classList.add('error')}}$('q-date').addEventListener('input',query);$('q-date').addEventListener('change',query);select(selected);
