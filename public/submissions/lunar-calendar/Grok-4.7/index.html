<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>岁序 · 农历</title>
<style>
:root{color-scheme:light dark;--bg:#f3ecdf;--ink:#241910;--card:#fffaf3;--line:#e6d9c8;--red:#a33b2b;--moss:#2c6b5a;--gold:#9a7040;--muted:#7d6e60;--soft:#f6ecdf}
@media (prefers-color-scheme:dark){:root{--bg:#14110e;--ink:#f6efe4;--card:#221c17;--line:#3c332b;--red:#ef8b7a;--moss:#9fd8c8;--gold:#e6c48a;--muted:#b5a594;--soft:#2a231c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 "Iowan Old Style",Palatino,Georgia,"Songti SC",serif;padding:12px 8px 28px}
.wrap{width:min(440px,100%);margin:0 auto}
.kicker{font:11px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--gold)}
h1{font-size:34px;font-weight:500;margin:2px 0 8px;letter-spacing:.12em}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button,input{font:inherit;color:inherit}
.nav button,.query input{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 8px 12px}
.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.week{color:var(--muted);font-size:11px;text-align:center;padding-bottom:4px}
.cell{min-width:0;min-height:54px;border:0;border-radius:10px;background:transparent;padding:3px 0;text-align:center}
.cell .n{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.cell .l{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden}
.cell.out{opacity:.38}
.cell.today{background:var(--red);color:#fff}
.cell.today .l{color:#fff}
.cell.sel{box-shadow:inset 0 0 0 1.5px var(--gold)}
.cell.fest .l{color:var(--red)}
.cell.term .l{color:var(--moss)}
.cell.today .l{color:#fff}
.detail{padding:10px 6px 0}
.detail strong{font-size:18px;font-weight:500}
.meta{color:var(--muted);font-size:13px;margin-top:3px}
#q-result{margin-top:6px;font-size:14px;line-height:1.5}
.query{display:flex;gap:8px;align-items:center;margin-top:10px}
.query input{flex:1;min-width:0;border-radius:10px}
.hint{margin:8px 2px 0;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main class="wrap">
  <div class="kicker">SHUO XU</div>
  <h1 id="title">岁序</h1>
  <div class="nav">
    <button id="prevY" type="button">上年</button>
    <button id="prev" type="button">上月</button>
    <button id="today" type="button">今天</button>
    <button id="next" type="button">下月</button>
    <button id="nextY" type="button">下年</button>
  </div>
  <section class="card">
    <div class="week" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div id="grid" class="grid" role="grid" tabindex="0" aria-label="月历"></div>
    <div class="detail">
      <strong id="headline"></strong>
      <div class="meta" id="meta"></div>
      <div id="q-result"></div>
    </div>
    <div class="query"><label for="q-date">查询</label><input id="q-date" type="date"></div>
  </section>
  <p class="hint">方向键移动日期，PageUp / PageDown 翻月。</p>
</main>
<script>
const LI=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,0x0d520];
const GAN="甲乙丙丁戊己庚辛壬癸",ZHI="子丑寅卯辰巳午未申酉戌亥",ZOD="鼠牛虎兔龙蛇马羊猴鸡狗猪";
const MN=["","正","二","三","四","五","六","七","八","九","十","冬","腊"];
const DN=["","初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
const TERMS=["春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至","小寒","大寒","立春","雨水","惊蛰"];
const WK=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
const MS=864e5,D2R=Math.PI/180,$=id=>document.getElementById(id);
const ymd=(y,m,d)=>Date.UTC(y,m-1,d),info=y=>LI[y-1900];
const leapMonth=y=>info(y)&0xf,leapDays=y=>leapMonth(y)?(info(y)&0x10000?30:29):0,monthDays=(y,m)=>info(y)&(0x10000>>m)?30:29;
function months(y){const seq=[];for(let m=1;m<=12;m++){seq.push({m,leap:false,days:monthDays(y,m)});if(m===leapMonth(y))seq.push({m,leap:true,days:leapDays(y)})}return seq}
function yearDays(y){let n=0;for(const mo of months(y))n+=mo.days;return n}
function toLunar(y,m,d){let off=Math.round((ymd(y,m,d)-ymd(1900,1,31))/MS),ly=1900;if(off<0)return null;for(let n;ly<2100&&off>=(n=yearDays(ly));ly++)off-=n;for(const mo of months(ly)){if(off<mo.days)return{y:ly,m:mo.m,leap:mo.leap,d:off+1};off-=mo.days}return null}
const gz=ly=>GAN[((ly-4)%10+10)%10]+ZHI[((ly-4)%12+12)%12],zod=ly=>ZOD[((ly-4)%12+12)%12];
function sunLon(jd){const T=(jd-2451545)/36525,L=280.46646+36000.76983*T+3.032e-4*T*T,M=(357.52911+35999.05029*T-1.537e-4*T*T)*D2R;const C=(1.914602-0.004817*T-1.4e-5*T*T)*Math.sin(M)+(0.019993-1.01e-4*T)*Math.sin(2*M)+2.89e-4*Math.sin(3*M);return(((L+C-0.00569-0.00478*Math.sin((125.04-1934.136*T)*D2R))%360)+360)%360}
function termOf(y,m,d){const jd=ymd(y,m,d)/MS+2440587.5-1/3,a=Math.floor(sunLon(jd)/15),b=Math.floor(sunLon(jd+1)/15);return a===b?"":TERMS[b]}
function fest(y,m,d,L){if(!L.leap&&L.m===1&&L.d===1)return"春节";if(!L.leap&&L.m===1&&L.d===15)return"元宵";if(!L.leap&&L.m===5&&L.d===5)return"端午";if(!L.leap&&L.m===7&&L.d===7)return"七夕";if(!L.leap&&L.m===8&&L.d===15)return"中秋";if(!L.leap&&L.m===9&&L.d===9)return"重阳";if(!L.leap&&L.m===12&&L.d===8)return"腊八";const n=new Date(ymd(y,m,d)+MS),N=toLunar(n.getUTCFullYear(),n.getUTCMonth()+1,n.getUTCDate());return N&&!N.leap&&N.m===1&&N.d===1?"除夕":""}
function line(y,m,d){const L=toLunar(y,m,d);if(!L)return"农历：无 · 生肖：无 · 节气：无 · 节日：无";return`农历：${gz(L.y)}年 ${(L.leap?"闰":"")+MN[L.m]}月 ${DN[L.d]} · 生肖：${zod(L.y)} · 节气：${termOf(y,m,d)||"无"} · 节日：${fest(y,m,d,L)||"无"}`}
const now=new Date();
const today={y:now.getFullYear(),m:now.getMonth()+1,d:now.getDate()};
let sel={...today},cur={y:today.y,m:today.m};
const iso=o=>`${o.y}-${String(o.m).padStart(2,"0")}-${String(o.d).padStart(2,"0")}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return{y,m,d}};
function shift(o,days){const t=new Date(o.y,o.m-1,o.d+days);return{y:t.getFullYear(),m:t.getMonth()+1,d:t.getDate()}}
function shiftMonth(o,n){const t=new Date(o.y,o.m-1+n,1),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return{y:t.getFullYear(),m:t.getMonth()+1,d:Math.min(o.d,dim)}}
function render(){
  $("title").textContent=`${cur.y} · ${cur.m}月`;
  const start=new Date(cur.y,cur.m-1,1).getDay();
  let html="";
  for(let i=0;i<42;i++){
    const date=shift({y:cur.y,m:cur.m,d:1},i-start);
    const L=toLunar(date.y,date.m,date.d);
    const f=L?fest(date.y,date.m,date.d,L):"",term=termOf(date.y,date.m,date.d);
    const sub=f||term||(L?(date&&L.d===1?(L.leap?"闰":"")+MN[L.m]+"月":DN[L.d]):"");
    const todayCell=date.y===today.y&&date.m===today.m&&date.d===today.d;
    const selected=date.y===sel.y&&date.m===sel.m&&date.d===sel.d;
    const cls=["cell",date.m!==cur.m?"out":"",todayCell?"today":"",selected?"sel":"",f?"fest":"",!f&&term?"term":""].filter(Boolean).join(" ");
    html+=`<button type="button" class="${cls}" role="gridcell" data-d="${iso(date)}" ${todayCell?'aria-current="date"':""}><span class="n">${date.d}</span><span class="l">${sub}</span></button>`;
  }
  $("grid").innerHTML=html;
  const L=toLunar(sel.y,sel.m,sel.d);
  const doy=Math.round((new Date(sel.y,sel.m-1,sel.d)-new Date(sel.y,0,0))/MS);
  $("headline").textContent=`${sel.m}月${sel.d}日 ${WK[new Date(sel.y,sel.m-1,sel.d).getDay()]}`;
  $("meta").textContent=L?`${gz(L.y)}年 · 生肖${zod(L.y)} · 第${doy}天`:"超出历表";
  $("q-result").textContent=line(sel.y,sel.m,sel.d);
  $("q-date").value=iso(sel);
}
function pick(o){sel=o;cur.y=o.y;cur.m=o.m;render()}
$("grid").onclick=e=>{const b=e.target.closest("button");if(b)pick(parse(b.dataset.d))};
$("q-date").addEventListener("input",()=>{if($("q-date").value)pick(parse($("q-date").value))});
$("q-date").addEventListener("change",()=>{if($("q-date").value)pick(parse($("q-date").value))});
$("prev").onclick=()=>pick(shiftMonth(sel,-1));
$("next").onclick=()=>pick(shiftMonth(sel,1));
$("prevY").onclick=()=>pick(shiftMonth(sel,-12));
$("nextY").onclick=()=>pick(shiftMonth(sel,12));
$("today").onclick=()=>pick({...today});
$("grid").addEventListener("keydown",e=>{
  const map={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};
  if(e.key==="PageUp"||e.key==="PageDown"){e.preventDefault();pick(shiftMonth(sel,e.key==="PageUp"?-1:1));return}
  if(map[e.key]==null)return;
  e.preventDefault();pick(shift(sel,map[e.key]));
});
render();
</script>
</body>
</html>
