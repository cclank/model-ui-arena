<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGNITION · 10 秒倒计时</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#060915;color:#fff;font-family:Arial,"PingFang SC",sans-serif;display:grid;place-items:center;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#20408055 0,transparent 45%),repeating-linear-gradient(0deg,transparent 0 59px,#3a5d9a17 60px),repeating-linear-gradient(90deg,transparent 0 59px,#3a5d9a17 60px);pointer-events:none}.stage{text-align:center;position:relative;width:min(100%,700px);padding:30px}.eyebrow{font-size:11px;color:#8da6d0;letter-spacing:.45em;font-weight:700}.title{font-size:clamp(26px,6vw,49px);font-weight:800;letter-spacing:.18em;margin:9px 0 10px}.subtitle{font-size:12px;letter-spacing:.25em;color:#7796bd}.clock{position:relative;width:min(76vw,390px);height:min(76vw,390px);margin:28px auto 20px;display:grid;place-items:center;filter:drop-shadow(0 0 23px #2b8bff66)}.clock svg{position:absolute;inset:0;transform:rotate(-90deg);width:100%;height:100%;overflow:visible}.track{fill:none;stroke:#1c2a49;stroke-width:7}.progress{fill:none;stroke:#69d9ff;stroke-width:8;stroke-linecap:round;stroke-dasharray:1005.31;stroke-dashoffset:0;filter:drop-shadow(0 0 10px #46baff);transition:stroke .25s}.inner{border:1px solid #3d6aaf88;border-radius:50%;width:73%;height:73%;display:grid;place-items:center;background:radial-gradient(circle,#102b5c55,#071426 65%);box-shadow:inset 0 0 40px #1677bb33,0 0 35px #3673e544}.number{font-size:clamp(125px,34vw,220px);line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.09em;margin-right:.09em;text-shadow:0 0 32px #61bfffaa}.label{font-size:11px;letter-spacing:.32em;color:#89cffa;margin-top:-30px}.stage.urgent .number,.stage.urgent .label{color:#ffc0a0;text-shadow:0 0 30px #ff7345}.stage.urgent .progress{stroke:#ff8153;filter:drop-shadow(0 0 10px #ff653d)}.stage.beat .inner{animation:beat .65s ease-out}.stage.done .number{color:#fff5c9;text-shadow:0 0 45px #ffd56f}.stage.done .inner{box-shadow:0 0 65px #ffd67899,inset 0 0 40px #f7aa5244}.controls{display:flex;justify-content:center;gap:10px;align-items:center}.restart{border:1px solid #72bcf9;border-radius:99px;background:#266bad22;color:white;padding:13px 28px;letter-spacing:.2em;font-weight:800;cursor:pointer;transition:background .2s,transform .2s}.restart:hover{background:#267ab066;transform:translateY(-2px)}.status{margin-top:19px;color:#80a2c1;font-size:12px;letter-spacing:.13em}.spark{position:fixed;left:50%;top:50%;width:6px;height:6px;background:var(--color);box-shadow:0 0 12px var(--color);border-radius:50%;animation:explode 1.5s cubic-bezier(.1,.7,.25,1) forwards;pointer-events:none}@keyframes beat{0%{transform:scale(1)}25%{transform:scale(1.045)}100%{transform:scale(1)}}@keyframes explode{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}@media(max-width:450px){.stage{padding:16px}.clock{margin:20px auto}.label{margin-top:-16px}.number{font-size:32vw}}
</style></head><body><main class="stage" id="stage"><div class="eyebrow">THE MOMENT STARTS NOW</div><h1 class="title">IGNITION</h1><div class="subtitle">TEN SECONDS TO THE FUTURE</div><div class="clock"><svg viewBox="0 0 360 360"><circle class="track" cx="180" cy="180" r="160"/><circle class="progress" id="progress" cx="180" cy="180" r="160"/></svg><div class="inner"><div><div class="number" id="number">10</div><div class="label" id="label">SECONDS</div></div></div></div><div class="controls"><button class="restart" id="restart">↻ RESTART</button></div><div class="status" id="status">倒计时正在进行</div></main><script>
const stage=document.querySelector("#stage"),number=document.querySelector("#number"),label=document.querySelector("#label"),status=document.querySelector("#status"),progress=document.querySelector("#progress");let start=0,previous=10,finished=false,raf=0;const circumference=2*Math.PI*160;
function burst(){for(let i=0;i<115;i++){const p=document.createElement("i"),angle=Math.random()*Math.PI*2,dist=80+Math.random()*innerWidth*.4;p.className="spark";p.style.setProperty("--x",Math.cos(angle)*dist+"px");p.style.setProperty("--y",Math.sin(angle)*dist+"px");p.style.setProperty("--color",["#ffe29a","#ff865d","#6edcff","#fff"][i%4]);document.body.append(p);setTimeout(()=>p.remove(),1600)}}
function tick(t){const elapsed=Math.min((t-start)/1000,10),value=Math.max(0,Math.ceil(10-elapsed));progress.style.strokeDashoffset=String(circumference*elapsed/10);number.textContent=value;stage.classList.toggle("urgent",value<=3&&value>0);
 if(value!==previous){previous=value;stage.classList.remove("beat");void stage.offsetWidth;stage.classList.add("beat");status.textContent=value<=3&&value>0?"最后 "+value+" 秒 · 准备点亮":"倒计时正在进行"}
 if(elapsed>=10){if(!finished){finished=true;stage.classList.remove("urgent");stage.classList.add("done");label.textContent="COMPLETE";status.textContent="此刻，正式开始";burst()}return}
 raf=requestAnimationFrame(tick)
}
function restart(){cancelAnimationFrame(raf);document.querySelectorAll(".spark").forEach(el=>el.remove());stage.className="stage";number.textContent="10";label.textContent="SECONDS";status.textContent="倒计时正在进行";progress.style.strokeDashoffset="0";previous=10;finished=false;start=performance.now();raf=requestAnimationFrame(tick)}
document.querySelector("#restart").onclick=restart;restart();
</script></body></html>
