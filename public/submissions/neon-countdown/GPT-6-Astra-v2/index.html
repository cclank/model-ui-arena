<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afterglow — Ten seconds to everything</title>
<!-- 冷青色轨道计时器，以十秒节拍、环形进度和最后三秒的暖色警醒建立张力。
     归零时切入明亮完成态，径向粒子爆发并保留清楚的 0 与重启入口。
     基于真实经过时间，切到后台也不会让倒计时漂移。 -->
<style>
*{box-sizing:border-box}:root{--accent:#91e8e0;--glow:#56dad950}body{margin:0;background:#091517;color:#e5f7ee;min-height:100svh;overflow-x:hidden;font-family:Arial,Helvetica,sans-serif;transition:background 1s}body.urgent{--accent:#ffb080;--glow:#ff97683d}body.done{--accent:#ceffa6;--glow:#bef78444;background:#14211a}body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 44%,var(--glow),transparent 53%);opacity:.38;pointer-events:none;transition:background 1s}main{width:min(100%,740px);margin:auto;min-height:100svh;position:relative;display:flex;flex-direction:column;align-items:center;padding:30px 30px 25px;text-align:center}header{display:flex;justify-content:space-between;width:100%;font:9px monospace;letter-spacing:2px;color:#8baca2}.brand{font-size:11px;font-weight:bold;letter-spacing:3px}.tag{color:var(--accent);font-size:8px;transition:color .5s}.intro{margin:36px 0 16px}.eyebrow{font:8px monospace;letter-spacing:2.3px;color:#709f96}h1{font:normal 29px Georgia,serif;letter-spacing:-.6px;margin:11px 0}.instrument{position:relative;width:min(100%,380px);aspect-ratio:1;margin:4px 0 15px;isolation:isolate}.instrument:before,.instrument:after{content:'';position:absolute;inset:15%;border:1px solid var(--accent);opacity:.08;border-radius:50%;box-shadow:0 0 60px var(--glow),inset 0 0 55px var(--glow)}.instrument:after{inset:5%;opacity:.05}.ring{width:100%;height:100%;position:absolute;inset:0;overflow:visible}.ring .track{stroke:#46625b33;stroke-width:1;fill:none}.ring .progress{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;fill:none;transform:rotate(-90deg);transform-origin:190px 190px;filter:drop-shadow(0 0 5px var(--accent))}.tick{stroke:#426b65;stroke-width:1}.tick.on{stroke:var(--accent);stroke-width:2}.readout{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}.readout .minor{font:8px monospace;letter-spacing:3px;color:var(--accent);opacity:.8}.digit{font-size:142px;font-weight:200;line-height:1.13;letter-spacing:-9px;font-variant-numeric:tabular-nums;padding-right:9px;text-shadow:0 0 40px var(--glow);color:#effdf5}.readout .below{font:8px monospace;letter-spacing:3px;color:#7da297}.coordinates{position:absolute;font:7px monospace;letter-spacing:1px;color:#5a857b;top:50%}.coordinates.left{left:-2px;transform:rotate(-90deg)}.coordinates.right{right:-2px;transform:rotate(90deg)}.timeline{display:flex;gap:6px;margin:8px 0 16px}.timeline i{width:19px;height:3px;background:#304b42;transition:background .2s,box-shadow .2s}.timeline i.lit{background:var(--accent);box-shadow:0 0 10px var(--glow)}.message{font:11px monospace;color:#8fab9b;min-height:15px;margin:0 0 24px}.restart{border:1px solid #71927f6b;color:#d4e8d6;background:#12302633;cursor:pointer;border-radius:30px;padding:13px 29px;font:10px monospace;letter-spacing:1px;transition:all .3s}.restart:hover{background:var(--accent);color:#162820;border-color:var(--accent)}.restart:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.restart b{font-weight:400;margin-right:8px;font-size:15px}footer{display:flex;justify-content:space-between;width:100%;margin-top:auto;padding-top:34px;font:8px monospace;color:#618676;letter-spacing:1px}.wave{position:absolute;inset:18%;border:1px solid var(--accent);border-radius:50%;opacity:0;pointer-events:none}.wave.beat{animation:wave .85s ease-out}.done .wave{animation:complete 3s ease-out infinite}.done .wave:nth-child(2){animation-delay:1s}.urgent .digit{color:#ffe2c3}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.state-text{position:absolute;left:-9999px}@keyframes wave{from{opacity:.3;transform:scale(.8)}to{opacity:0;transform:scale(1.65)}}@keyframes complete{from{opacity:.5;transform:scale(.8)}to{opacity:0;transform:scale(2)}}@media(max-width:450px){main{padding:24px}.intro{margin:37px 0 18px}h1{font-size:28px}.digit{font-size:126px}.instrument{width:325px;max-width:100%}.message{font-size:10px}footer{font-size:7px;padding-top:36px}.brand{font-size:10px}.coordinates{font-size:6px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<canvas id="sparks" aria-hidden="true"></canvas><main><header><span class="brand">AFTERGLOW</span><span class="tag" id="tag">SEQUENCE / 001</span></header><div class="intro"><div class="eyebrow">A BRIEF MOMENT BEFORE EVERYTHING</div><h1 id="heading">Something is about to begin.</h1></div><section class="instrument" aria-label="Ten second countdown"><div class="wave" id="wave"></div><div class="wave"></div><svg class="ring" viewBox="0 0 380 380" aria-hidden="true"><circle class="track" cx="190" cy="190" r="180"/><circle class="track" cx="190" cy="190" r="137"/><g id="ticks"></g><circle class="progress" id="progress" cx="190" cy="190" r="157" stroke-dasharray="986.46"/><path d="M190 3v8m0 358v8M3 190h8m358 0h8" stroke="#739c8d" stroke-width="1"/></svg><div class="readout"><span class="minor" id="phase">T MINUS</span><output class="digit" id="digit">10</output><span class="below">SECONDS</span></div><span class="coordinates left">00:00:10</span><span class="coordinates right">EST. INFINITY</span></section><div class="timeline" id="timeline" aria-hidden="true"></div><p class="message" id="message">Take a breath. Stay for the moment.</p><button class="restart" id="restart"><b>↻</b> Restart</button><p class="state-text" id="announcement" role="status" aria-live="polite"></p><footer><span>TEN SECONDS. ALL THE POSSIBILITY.</span><span id="elapsed">00.000 / 10.000</span></footer></main>
<script>
const $=id=>document.getElementById(id),canvas=$('sparks'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;let start=0,prev=-1,finished=false,sequence=0,raf,particles=[],last=0,w,h;
for(let i=0;i<60;i++){const a=i/60*Math.PI*2,n=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:190+Math.sin(a)*166,y1:190-Math.cos(a)*166,x2:190+Math.sin(a)*(i%5?171:175),y2:190-Math.cos(a)*(i%5?171:175),class:'tick'}).forEach(([k,v])=>n.setAttribute(k,v));$('ticks').append(n)}for(let i=0;i<10;i++)$('timeline').append(document.createElement('i'));
function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function burst(){const box=document.querySelector('.instrument').getBoundingClientRect();for(let i=0;i<(reduced?30:230);i++){const a=i/230*Math.PI*2*19.17,v=1.5+(i*7%19)/3;particles.push({x:box.left+box.width/2,y:box.top+box.height/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,size:i%5===0?2:1})}}
function reset(){cancelAnimationFrame(raf);sequence++;$('tag').textContent='SEQUENCE / '+String(sequence).padStart(3,'0');start=performance.now();prev=-1;finished=false;particles=[];document.body.className='';$('heading').textContent='Something is about to begin.';$('phase').textContent='T MINUS';$('message').textContent='Take a breath. Stay for the moment.';$('announcement').textContent='Ten second countdown started.';last=start;tick(start)}
function tick(now){const elapsed=Math.min(10,(now-start)/1000),n=Math.max(0,Math.ceil(10-elapsed)),dt=Math.min(2,(now-last)/16.667||1);last=now;$('progress').style.strokeDashoffset=(elapsed/10*986.46);$('elapsed').textContent=elapsed.toFixed(3).padStart(6,'0')+' / 10.000';if(prev!==n){prev=n;$('digit').textContent=n;$('ticks').querySelectorAll('line').forEach((e,i)=>e.classList.toggle('on',i<60*(1-elapsed/10)));$('timeline').querySelectorAll('i').forEach((e,i)=>e.classList.toggle('lit',i>=n));if(!reduced)$('digit').animate([{opacity:.4,transform:'translateY(7px) scale(.94)'},{opacity:1,transform:'none'}],{duration:330,easing:'cubic-bezier(.2,.8,.2,1)'});$('wave').classList.remove('beat');void $('wave').offsetWidth;$('wave').classList.add('beat');document.body.classList.toggle('urgent',n<=3&&n>0);if(n<=3&&n>0){$('phase').textContent='GET READY';$('message').textContent='Here comes your moment.'}if(n===0&&!finished){finished=true;document.body.className='done';$('heading').textContent='The moment is yours.';$('phase').textContent='COMPLETE';$('message').textContent='A new beginning looks good on you.';$('announcement').textContent='Countdown complete.';burst()}}
ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='lighter';for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.992,dt);p.vy=p.vy*Math.pow(.992,dt)+.018*dt;p.life-=.006*dt;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.strokeStyle=i%3?'#ceffa6':'#a0e3dc';ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2,p.y-p.vy*2);ctx.stroke()}ctx.globalAlpha=1;if(!finished||particles.length)raf=requestAnimationFrame(tick)}
$('restart').onclick=reset;document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden){last=performance.now();tick(last)}});reset();
</script></html>
