<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最炫倒计时</title>
<style>
@property --h{syntax:'<number>';inherits:true;initial-value:190}
:root{--h:190;--c1:hsl(var(--h) 100% 60%);--c2:hsl(calc(var(--h) + 70) 100% 64%);--spd:1;transition:--h .7s}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#04010d;color:#fff;font-family:-apple-system,"SF Pro Display","PingFang TC","PingFang SC","Helvetica Neue",Arial,sans-serif}
#stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;overflow:hidden;
  background:radial-gradient(circle at 50% 46%,hsl(var(--h) 90% 16%),#04010d 68%)}
.grid{position:absolute;left:-60%;right:-60%;bottom:0;height:52%;transform:perspective(320px) rotateX(64deg);transform-origin:50% 100%;opacity:.55;
  background:linear-gradient(hsl(var(--h) 100% 60% /.7) 1px,transparent 1px) 0 0/100% 56px,linear-gradient(90deg,hsl(var(--h) 100% 60% /.7) 1px,transparent 1px) 0 0/56px 100%;
  -webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);animation:gr calc(1s / var(--spd)) linear infinite}
@keyframes gr{to{background-position:0 56px,0 0}}
.vig{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 18vmin 2vmin hsl(var(--h) 100% 50% /.85)}
[data-s=final] .vig{animation:vg 1s ease-in-out infinite}[data-s=final]{--spd:3}[data-s=done]{--spd:.4}
@keyframes vg{50%{opacity:1}}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ringbox{position:relative;width:min(84vmin,600px);aspect-ratio:1}
[data-s=final] .ringbox{animation:sk .16s steps(2) infinite}
@keyframes sk{25%{transform:translate(2px,-2px)}75%{transform:translate(-2px,2px)}}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.seg{fill:none;stroke:url(#g);stroke-width:13;stroke-linecap:round;stroke-dasharray:1 2;filter:drop-shadow(0 0 7px var(--c1)) drop-shadow(0 0 16px var(--c2))}
.trk{fill:none;stroke:hsl(var(--h) 60% 40% /.28);stroke-width:13;stroke-linecap:round}
.tk{stroke:var(--c1);stroke-width:2.4;stroke-linecap:round;transition:opacity .2s}
.spin{fill:none;stroke:var(--c2);stroke-width:1.6;stroke-dasharray:3 9;opacity:.7;transform-origin:200px 200px;animation:sp calc(14s / var(--spd)) linear infinite}
@keyframes sp{to{transform:rotate(-360deg)}}
.core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.core small{font-size:clamp(11px,2.6vmin,15px);letter-spacing:.5em;text-indent:.5em;color:var(--c1);text-shadow:0 0 10px var(--c1)}
.nw{position:relative}
.num{font:800 clamp(110px,34vmin,270px)/1 "SF Pro Display","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#fff;
  text-shadow:0 0 5px #fff,0 0 16px var(--c1),0 0 44px var(--c1),0 0 100px var(--c2)}
.ghost{position:absolute;inset:0;pointer-events:none}
[data-s=final] .num{animation:fl .9s steps(1) infinite}
@keyframes fl{0%,52%,58%,100%{opacity:1}55%{opacity:.35}}
[data-s=done] .num{animation:none}
#msg{min-height:1.5em;font-size:clamp(16px,4.4vmin,30px);font-weight:700;letter-spacing:.3em;text-indent:.3em;color:#fff;text-shadow:0 0 14px var(--c1),0 0 34px var(--c2)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 46%,#fff,hsl(var(--h) 100% 60% /.55) 45%,transparent 75%)}
button{position:relative;font-weight:600;font-size:15px;line-height:1;font-family:inherit;color:#fff;background:rgba(255,255,255,.06);border:1.5px solid var(--c1);border-radius:99px;padding:13px 30px;
  cursor:pointer;letter-spacing:.14em;box-shadow:0 0 18px hsl(var(--h) 100% 60% /.45),inset 0 0 14px hsl(var(--h) 100% 60% /.25);text-shadow:0 0 8px var(--c1);transition:transform .15s}
button:active{transform:scale(.95)}button span{opacity:.6;margin-left:6px;font-weight:400}
[data-s=done] button{animation:bt 1.1s ease-in-out infinite;font-size:18px;padding:16px 38px}
@keyframes bt{50%{transform:scale(1.07);box-shadow:0 0 40px var(--c1),inset 0 0 22px var(--c2)}}
</style>
</head>
<body>
<main id="stage" data-s="run">
  <div class="grid"></div><div class="vig"></div><canvas id="fx"></canvas>
  <div class="ringbox">
    <svg viewBox="0 0 400 400">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs>
      <circle class="spin" cx="200" cy="200" r="128"/><g id="trk"></g><g id="segs"></g><g id="tks"></g>
      <circle id="rp" cx="200" cy="200" r="150" fill="none" stroke="var(--c1)" stroke-width="5" opacity="0" style="transform-origin:200px 200px"/>
    </svg>
    <div class="core"><small id="lbl">T - MINUS</small><div class="nw"><div class="num" id="num">10</div></div><div id="msg"></div></div>
  </div>
  <button id="re">重新开始<span>Restart</span></button>
  <div id="flash"></div>
</main>
<script>
const $ = s => document.querySelector(s), NS = 'http://www.w3.org/2000/svg', TAU = Math.PI * 2, R = Math.random, DUR = 10000;
const st = $('#stage'), num = $('#num'), cv = $('#fx'), ctx = cv.getContext('2d');
let end = 0, cur = 11, done = false, W = 1, H = 1, dpr = 1, ps = [], AC = null, lastTick = -1;
const mk = (p, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); $(p).appendChild(e); return e; };
const pt = (a, r) => `${200 + r * Math.cos(a)} ${200 + r * Math.sin(a)}`;
const arcs = [...Array(10)].map((_, k) => { const a0 = (-90 + k * 36 + 3.5) * Math.PI / 180, a1 = (-90 + (k + 1) * 36 - 3.5) * Math.PI / 180, d = `M${pt(a0, 150)}A150 150 0 0 1 ${pt(a1, 150)}`;
  mk('#trk', 'path', { class: 'trk', d }); return mk('#segs', 'path', { class: 'seg', d, pathLength: 1 }); });   // 10 段圆环 = 10 秒，当前这一秒的那段连续消耗
const ticks = [...Array(60)].map((_, i) => { const a = (-90 + i * 6) * Math.PI / 180; return mk('#tks', 'path', { class: 'tk', d: `M${pt(a, 172)}L${pt(a, i % 6 ? 180 : 188)}` }); });   // 60 刻度 = 每格 1/6 秒
function resize() { dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; }
addEventListener('resize', resize); resize();

/* ---------- 音效（首次交互后才会有声；没有交互时静默） ---------- */
addEventListener('pointerdown', () => { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); }, { once: true });
function beep(f, d = .14, v = .07, type = 'sine') {
  if (!AC || AC.state !== 'running') return; const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
}

/* ---------- 粒子：火花（叠加发光）与彩纸 ---------- */
function spark(x, y, n, sp, hue, life = 1) { for (let i = 0; i < n && ps.length < 1400; i++) { const a = R() * TAU, v = sp * (.35 + R() * .65); ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: life * (.6 + R() * .6), m: life, h: hue + R() * 50 - 25, t: 0 }); } }
function confetti(n) { for (let i = 0; i < n && ps.length < 1400; i++) ps.push({ x: R() * W, y: -20 - R() * H * .5, vx: (R() - .5) * 80, vy: 120 + R() * 220, l: 5, m: 5, h: R() * 360, t: 1, r: R() * TAU, w: R() * 9 + 5 }); }
function loop(dt) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(0, 0, W, H);
  for (let i = ps.length; i--;) {
    const p = ps[i]; p.l -= dt; if (p.l <= 0 || p.y > H + 30) { ps.splice(i, 1); continue; }
    if (p.t === 0) { p.vx *= 1 - 1.5 * dt; p.vy = p.vy * (1 - 1.5 * dt) + 260 * dt; } else { p.vx += Math.sin(p.y * .02 + p.r) * 40 * dt; p.r += 5 * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt; const a = Math.min(1, p.l / p.m * 2);
    if (p.t === 0) { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `hsla(${p.h} 100% 62% / ${a})`; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(p.x - p.vx * .035, p.y - p.vy * .035); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    else { ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = `hsla(${p.h} 100% 60% / ${a})`; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.abs(Math.cos(p.r * 1.3)) * .9 + .1); ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); ctx.restore(); }
  }
}

/* ---------- 状态机：run → final(最后 3 秒) → done；start() 可随时重来 ---------- */
const hueOf = n => n > 3 ? 190 + (10 - n) * 16 : [45, 8, 352, 335][n];
const flash = (o, ms) => $('#flash').animate([{ opacity: o }, { opacity: 0 }], { duration: ms, easing: 'ease-out' });
function onSecond(n) {                                     // 每一秒的节奏反馈：数字弹入 + 幽灵放大 + 圆环涟漪 + 全屏闪光 + 火花 + 蜂鸣
  cur = n; document.documentElement.style.setProperty('--h', hueOf(n)); st.dataset.s = n <= 3 ? 'final' : 'run'; num.textContent = n;
  $('#lbl').textContent = n <= 3 ? 'IGNITION' : 'T - MINUS';
  num.animate([{ transform: 'scale(1.42)', filter: 'blur(7px)' }, { transform: 'scale(1)', filter: 'blur(0)' }], { duration: 420, easing: 'cubic-bezier(.2,1.5,.4,1)' });
  const g = num.cloneNode(true); g.removeAttribute('id'); g.classList.add('ghost'); num.parentNode.appendChild(g);
  g.animate([{ opacity: .55, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(2.3)' }], { duration: 750, easing: 'ease-out' }).onfinish = () => g.remove();
  $('#rp').animate([{ opacity: .9, transform: 'scale(.9)' }, { opacity: 0, transform: 'scale(1.32)' }], { duration: n <= 3 ? 520 : 750, easing: 'ease-out' });
  flash(n <= 3 ? .5 : .16, n <= 3 ? 500 : 380);
  const cx = W / 2, cy = H * .46, rr = Math.min(W, H) * .42 * (n <= 3 ? 1 : .9);
  for (let i = 0; i < 4; i++) spark(cx + Math.cos(i * TAU / 4 + n) * rr, cy + Math.sin(i * TAU / 4 + n) * rr, n <= 3 ? 26 : 9, n <= 3 ? 250 : 120, hueOf(n), n <= 3 ? .8 : .5);
  beep(n <= 3 ? 880 + (3 - n) * 220 : 520, n <= 3 ? .2 : .1, n <= 3 ? .09 : .05, n <= 3 ? 'square' : 'sine');
}
function finish() {                                        // 结束态：0 + 完成文案 + 全屏爆闪 + 多点烟花 + 彩纸雨
  done = true; st.dataset.s = 'done'; document.documentElement.style.setProperty('--h', 45); num.textContent = '0'; $('#lbl').textContent = 'LIFTOFF'; $('#msg').textContent = '倒计时完成 · 点火成功';
  arcs.forEach(a => a.style.strokeDashoffset = 0); ticks.forEach(t => t.style.opacity = 1); flash(1, 1100);
  $('#rp').animate([{ opacity: 1, transform: 'scale(.8)' }, { opacity: 0, transform: 'scale(2.6)' }], { duration: 1200, easing: 'cubic-bezier(.1,.8,.3,1)' });
  num.animate([{ transform: 'scale(2)', filter: 'blur(10px)' }, { transform: 'scale(1)', filter: 'blur(0)' }], { duration: 700, easing: 'cubic-bezier(.2,1.4,.4,1)' });
  for (let k = 0; k < 9; k++) setTimeout(() => { const a = k * 2.4, r = Math.min(W, H) * (.12 + (k % 3) * .1);
    spark(W / 2 + Math.cos(a) * r * 1.6, H * .46 + Math.sin(a) * r, 90, 330 + R() * 120, k * 42, 1.3); beep(200 + R() * 400, .25, .05, 'triangle'); }, k * 130);
  spark(W / 2, H * .46, 220, 520, 45, 1.6); confetti(150); beep(660, .5, .08, 'triangle'); setTimeout(() => beep(990, .7, .08, 'triangle'), 140);
}
function start() {
  end = performance.now() + DUR; done = false; cur = 11; ps.length = 0; lastTick = -1; $('#msg').textContent = ''; arcs.forEach(a => a.style.strokeDashoffset = 0); ticks.forEach(t => t.style.opacity = 1);
}
let prev = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - prev) / 1e3); prev = now;
  if (!done) {
    const left = Math.max(0, end - now), e = (DUR - left) / 1000, n = Math.ceil(left / 1000);
    if (left <= 0) finish(); else {
      if (n !== cur) onSecond(n);
      arcs.forEach((a, k) => a.style.strokeDashoffset = -Math.min(1, Math.max(0, e - k)));   // 第 k 段在第 k 秒内从起点向终点被消耗
      const ti = Math.floor(e * 6); if (ti !== lastTick) { lastTick = ti; ticks.forEach((t, i) => t.style.opacity = i < ti ? .1 : 1); }
    }
  }
  loop(dt); requestAnimationFrame(frame);
}
$('#re').onclick = () => { start(); onSecond(10); };
start(); onSecond(10); requestAnimationFrame(frame);
</script>
</body>
</html>
