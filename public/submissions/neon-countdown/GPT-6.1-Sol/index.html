*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#12131e;color:#ebe8fa;font-family:Arial,"PingFang SC",sans-serif}body{min-height:100svh;display:grid;place-items:center;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,#635fff24,transparent 55%),linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:auto,65px 65px,65px 65px;transition:background 1s}body.urgent:before{background:radial-gradient(ellipse at 50% 50%,#ff5b572b,transparent 60%)}body.complete:before{background:radial-gradient(ellipse at 50% 50%,#67dba322,transparent 65%)}main{position:relative;width:min(100%,1050px);padding:34px;z-index:1}header,footer{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.18em;color:#9493ad}.brand{font-size:13px;color:#eeebff}.brand b{color:#a09aff}.status{display:flex;align-items:center;gap:7px}.status i{width:5px;height:5px;background:#b0a1ff;border-radius:50%}.stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding:55px 0 45px}.tag{font-size:9px;letter-spacing:.35em;color:#a5a1c4;margin-bottom:16px}.dial{position:relative;width:min(76vw,385px);aspect-ratio:1;display:grid;place-items:center}.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}.track{stroke:#36334f;stroke-width:1;fill:none}.progress{stroke:#9d8dff;stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px #8774ff);transition:stroke .4s}.urgent .progress{stroke:#ff927b;filter:drop-shadow(0 0 10px #ff6d57)}.complete .progress{stroke:#8ee7bd;filter:drop-shadow(0 0 15px #66d6a0)}.inner{border:1px solid #5d507a28;border-radius:50%;width:83%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#18172970;box-shadow:inset 0 0 70px #716af90b}.number{font-size:clamp(90px,18vw,15 </style></head><body data-state="running"><canvas id="burst"></canvas><main><header><span class="brand">T <b>−</b> 10 / IGNITION</span><span class="status"><i></i><span id="status">正在蓄势</span></span></header><section class="stage"><div class="tag">EVERY BEGINNING NEEDS A MOMENT</div><div class="dial"><svg viewBox="0 0 300 300" aria-label="十秒倒计时进度"><circle class="track" cx="150" cy="150" r="138"/><circle class="track" cx="150" cy="150" r="128" stroke-dasharray="1 7"/><circle class="progress" id="progress" cx="150" cy="150" r="138"/></svg><div class="inner"><div class="number" id="number">10</div><div class="unit">SECONDS</div></div><div class="pulse" id="pulse"></div></div><h1 class="statement" id="title">给开始，一点仪式感。</h1><div class="note" id="note">十秒之后，让光照进来。</div><div class="actions"><button id="restart">Restart / 重新开始</button><button class="secondary" id="pause">暂停</button></div><div class="segments" id="segments"></div><div class="timerlabel" id="elapsed">00.00 / 10.00</div></section><footer><span>GPT-6.1-SOL / MOTION STUDY</span><span>A SMALL BEGINNING.</span></footer></main>
<script>
const $=id=>document.getElementById(id),circ=2*Math.PI*138,canvas=$('burst'),ctx=canvas.getContext('2d');let start=performance.now(),paused=false,pauseAt=0,pauseTotal=0,done=false,previous=-1,confetti=[],last=performance.now();$('progress').style.strokeDasharray=circ;for(let i=0;i<10;i++)$('segments').append(document.createElement('i'));

function burst(){const box=$('number').getBoundingClientRect();for(let i=0;i<230;i++){let a=Math.random()*Math.PI*2,v=3+Math.random()*10;confetti.push({x:box.x+box.width/2,y:box.y+box.height/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,r:2+Math.random()*3,angle:Math.random()*6.28,color:['#a994ff','#8ee7bd','#fff5d1','#f99a83'][i%4]})}}
function restart(){start=performance.now();pauseTotal=0;paused=false;done=false;previous=-1;confetti=[];document.body.className='';document.body.dataset.state='running';$('status').textContent='正在蓄势';$('title').textContent='给开始，一点仪式感。';$('note').textContent='十秒之后，让光照进来。';$('pause').disabled=false;$('pause').textContent='暂停'}$('restart').onclick=restart;$('pause').onclick=()=>{if(done)return;paused=!paused;if(paused){pauseAt=performance.now();$('status').textContent='暂停片刻';document.body.dataset.state='paused'}else{pauseTotal+=performance.now()-pauseAt;$('status').textContent='正在蓄势';document.body.dataset.state='running'}$('pause').textContent=paused?'继续':'暂停'};
function frame(now){const dt=Math.min((now-last)/16.667,2);last=now;const elapsed=Math.min(10,((paused?pauseAt:now)-start-pauseTotal)/1000),n=Math.max(0,Math.ceil(10-elapsed));$('number').textContent=n;$('progress').style.strokeDashoffset=circ*elapsed/10;$('elapsed').textContent=elapsed.toFixed(2).padStart(5,'0')+' / 10.00';[...$('segments').children].forEach((s,i)=>s.classList.toggle('on',i<Math.floor(elapsed)));if(n!==previous&&!paused){previous=n;$('pulse').classList.remove('beat');void $('pulse').offsetWidth;$('pulse').classList.add('beat');document.body.classList.toggle('urgent',n<=3&&n>0);if(n>0&&n<=3)$('status').textContent='准备好了吗'}if(n===0&&!done){done=true;document.body.className='complete';document.body.dataset.state='complete';$('status').textContent='完成';$('title').textContent='现在，轮到你闪耀。';$('note').textContent='倒计时完成 · 新的开始就在此刻。';$('pause').disabled=true;burst()}ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=confetti.length-1;i>=0;i--){const p=confetti[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.075*dt;p.vx*=.992;p.life-=.006*dt;p.angle+=.03*dt;if(p.life<=0){confetti.splice(i,1);continue}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
