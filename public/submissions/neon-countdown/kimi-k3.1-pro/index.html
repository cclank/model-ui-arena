<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEN — Neon Countdown</title>
<style>
:root{color-scheme:dark;--accent:#8fffe0;--accent2:#7b61ff;--ink:#f1f6f3;--muted:#70827f;--line:#ffffff14}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden}body{min-height:100svh;background:#070a0d;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;transition:--accent .4s}body.critical{--accent:#ff557c;--accent2:#b538ff}body.complete{--accent:#ffd785;--accent2:#ff7557}
.background{position:fixed;inset:0;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--accent2) 12%,transparent),transparent 37%),linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:auto,56px 56px,56px 56px;mask-image:radial-gradient(circle,#000 20%,transparent 90%)}.background:before,.background:after{content:"";position:absolute;left:50%;top:50%;border:1px solid color-mix(in srgb,var(--accent) 12%,transparent);border-radius:50%;transform:translate(-50%,-50%);animation:orbit 18s linear infinite}.background:before{width:min(78vw,800px);aspect-ratio:1}.background:after{width:min(94vw,960px);aspect-ratio:1;animation-direction:reverse;animation-duration:28s;border-style:dashed}@keyframes orbit{to{transform:translate(-50%,-50%)rotate(360deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.app{position:relative;width:min(850px,100%);padding:28px clamp(18px,4vw,44px);text-align:center}header{display:flex;justify-content:space-between;align-items:center;text-align:left}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:28px;height:28px;border:1px solid var(--accent);transform:rotate(45deg);position:relative;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 20%,transparent)}.brand-mark:after{content:"";position:absolute;inset:7px;border:1px solid var(--accent)}.brand strong{font-size:11px;letter-spacing:.25em}.brand small{display:block;margin-top:4px;color:var(--muted);font-size:8px;letter-spacing:.15em}.state{display:flex;align-items:center;gap:8px;color:var(--accent);font:600 9px/1 inherit;letter-spacing:.16em}.state i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}
.stage{position:relative;width:min(66vw,520px);aspect-ratio:1;margin:22px auto 8px;display:grid;place-items:center;filter:drop-shadow(0 24px 55px #0008)}.halo{position:absolute;inset:13%;border-radius:50%;background:color-mix(in srgb,var(--accent) 7%,transparent);box-shadow:0 0 90px color-mix(in srgb,var(--accent) 12%,transparent),inset 0 0 60px #0008;transition:.4s}.rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:rotate(-90deg)}.track{fill:none;stroke:#ffffff0c;stroke-width:2}.progress{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;filter:drop-shadow(0 0 7px var(--accent));transition:stroke .4s}.inner{fill:none;stroke:#ffffff0b;stroke-width:1;stroke-dasharray:1 4}.ticks{position:absolute;inset:0;transform:rotate(0deg)}.tick{stroke:#ffffff28;stroke-width:1}.tick.major{stroke:color-mix(in srgb,var(--accent) 65%,transparent);stroke-width:2}.sweep{position:absolute;inset:0;pointer-events:none}.sweep:before{content:"";position:absolute;left:calc(50% - .5px);top:2%;height:8%;width:1px;background:var(--accent);box-shadow:0 0 10px var(--accent);transform-origin:.5px calc(460%);}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none}.number{font:200 clamp(120px,22vw,220px)/.85 ui-monospace,"SFMono-Regular",Consolas,monospace;letter-spacing:-.12em;margin-left:-.12em;color:var(--ink);text-shadow:0 0 12px color-mix(in srgb,var(--accent) 50%,transparent),0 0 50px color-mix(in srgb,var(--accent) 20%,transparent);font-variant-numeric:tabular-nums;will-change:transform,opacity}.label{margin-top:25px;color:var(--accent);font:650 10px/1 inherit;letter-spacing:.48em;margin-left:.48em}.micro{position:absolute;left:6%;top:50%;transform:translateY(-50%) rotate(-90deg);color:var(--muted);font:8px/1 ui-monospace,monospace;letter-spacing:.2em}.micro.right{left:auto;right:6%;transform:translateY(-50%) rotate(90deg)}
.completion{height:0;opacity:0;transform:translateY(10px);transition:.5s;pointer-events:none}.complete .completion{height:auto;opacity:1;transform:none}.completion strong{display:block;font:400 clamp(21px,3vw,30px)/1.2 Georgia,"Songti SC",serif;letter-spacing:.18em;color:var(--accent)}.completion span{display:block;margin-top:8px;color:var(--muted);font-size:8px;letter-spacing:.28em}.bottom{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:18px;text-align:left}.timing{display:flex;gap:25px}.timing label{display:block;color:var(--muted);font-size:8px;letter-spacing:.14em;margin-bottom:6px}.timing strong{font:500 12px/1 ui-monospace,monospace}.timing strong:last-child{color:var(--accent)}button{border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 6%,transparent);color:var(--accent);border-radius:99px;padding:12px 18px;font:650 9px/1 inherit;letter-spacing:.15em;cursor:pointer;transition:.2s;box-shadow:0 0 20px color-mix(in srgb,var(--accent) 5%,transparent)}button:hover{background:var(--accent);color:#07110e;box-shadow:0 0 28px color-mix(in srgb,var(--accent) 30%,transparent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.hint{margin:14px 0 0;color:var(--muted);font-size:8px;letter-spacing:.13em}.shock{position:absolute;inset:10%;border:1px solid var(--accent);border-radius:50%;opacity:0;pointer-events:none}.complete .shock{animation:shock 1.2s ease-out}@keyframes shock{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
@media(max-width:560px){.app{padding:20px 16px}.stage{width:min(88vw,430px);margin-top:32px}.number{font-size:clamp(110px,38vw,160px)}.label{font-size:8px;margin-top:20px}.micro{display:none}.bottom{gap:12px}.timing{gap:16px}.timing>div:last-child{display:none}button{padding:11px 13px;font-size:8px}.brand small{display:none}.background:before{width:120vw}.background:after{width:150vw}.completion strong{font-size:20px}.state{font-size:8px}}
@media(prefers-reduced-motion:reduce){.background:before,.background:after,.state i{animation:none}}
</style>
</head>
<body>
<div class="background"></div><canvas id="fx"></canvas>
<main class="app"><header><div class="brand"><i class="brand-mark"></i><div><strong>TEN / 十秒</strong><small>NEON TEMPORAL SEQUENCE</small></div></div><div class="state"><i></i><span id="state">SEQUENCE ACTIVE</span></div></header>
<section class="stage" id="stage" aria-label="十秒倒计时"><div class="halo"></div>
<svg class="rings" viewBox="0 0 520 520" aria-hidden="true"><circle class="track" cx="260" cy="260" r="238" pathLength="100"/><circle class="progress" id="progress" cx="260" cy="260" r="238" pathLength="100"/><circle class="inner" cx="260" cy="260" r="205" pathLength="100"/></svg><svg class="ticks" id="ticks" viewBox="0 0 520 520" aria-hidden="true"></svg><div class="sweep" id="sweep"></div>
<div class="readout"><div class="number" id="number">10</div><div class="label" id="label">SECONDS</div></div><span class="micro">T-MINUS / 010</span><span class="micro right">NEON CORE / SYNCED</span><div class="shock"></div></section>
<div class="completion" aria-live="polite"><strong>时刻已抵达</strong><span>THE MOMENT IS YOURS</span></div>
<div class="bottom"><div class="timing"><div><label>PRECISE REMAINING</label><strong id="precise">10.00 s</strong></div><div><label>SEQUENCE</label><strong id="sequence">10 → 00</strong></div></div><button id="restart" type="button">RESTART / 重新启动</button></div><p class="hint">PRESS R TO RESTART · LAST THREE SECONDS ENTER CRITICAL PHASE</p></main>
<script>
const $=id=>document.getElementById(id),canvas=$('fx'),ctx=canvas.getContext('2d'),particles=[],dust=[];let W,H,dpr,start=performance.now(),end=start+10000,previous=11,done=false,last=performance.now(),critical=false;
for(let i=0;i<60;i++){const a=i*6*Math.PI/180,major=i%5===0,line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',260+Math.sin(a)*(major?248:251));line.setAttribute('y1',260-Math.cos(a)*(major?248:251));line.setAttribute('x2',260+Math.sin(a)*258);line.setAttribute('y2',260-Math.cos(a)*258);line.setAttribute('class','tick'+(major?' major':''));$('ticks').append(line)}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);dust.length=0;for(let i=0;i<70;i++)dust.push({a:Math.random()*7,r:100+Math.random()*Math.min(W,H)*.48,s:.00005+Math.random()*.00012,size:.4+Math.random()*1.2})}
function pulse(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;$('number').animate([{transform:'scale(1.13)',opacity:.35,filter:'brightness(2)'},{transform:'scale(1)',opacity:1,filter:'brightness(1)'}],{duration:430,easing:'cubic-bezier(.2,.8,.2,1)'});$('stage').animate([{filter:'drop-shadow(0 0 30px var(--accent))'},{filter:'drop-shadow(0 24px 55px #0008)'}],{duration:500})}
function burst(){for(let i=0;i<320;i++){const a=Math.random()*Math.PI*2,s=1.5+Math.random()*8,life=50+Math.random()*70;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,hue:i%3===0?38:i%3===1?160:270})}}
function finish(){done=true;critical=false;document.body.classList.remove('critical');document.body.classList.add('complete');$('number').textContent='0';$('label').textContent='COMPLETE';$('state').textContent='SEQUENCE COMPLETE';$('precise').textContent='0.00 s';$('progress').style.strokeDashoffset='100';burst()}
function restart(){start=last=performance.now();end=start+10000;previous=11;done=critical=false;particles.length=0;document.body.classList.remove('complete','critical');$('label').textContent='SECONDS';$('state').textContent='SEQUENCE ACTIVE';$('sequence').textContent='10 → 00';tick(start)}
$('restart').onclick=restart;addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'||e.code==='Space'){e.preventDefault();restart()}});
function draw(t,dt){ctx.clearRect(0,0,W,H);const accent=getComputedStyle(document.body).getPropertyValue('--accent').trim();ctx.globalCompositeOperation='lighter';for(const d of dust){d.a+=d.s*dt*16;const x=W/2+Math.cos(d.a)*d.r,y=H/2+Math.sin(d.a)*d.r*.7;ctx.fillStyle=accent;ctx.globalAlpha=.08+.1*Math.sin(d.a*3);ctx.fillRect(x,y,d.size,d.size)}ctx.globalAlpha=1;for(let i=particles.length-1;i>=0;i--){const p=particles[i],px=p.x,py=p.y;p.vx*=.985;p.vy=p.vy*.985+.025*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;const a=Math.max(0,p.life/p.max);ctx.strokeStyle=`hsla(${p.hue},95%,70%,${a})`;ctx.lineWidth=1.4*a+.3;ctx.beginPath();ctx.moveTo(px-p.vx,py-p.vy);ctx.lineTo(p.x,p.y);ctx.stroke();if(p.life<=0)particles.splice(i,1)}}
function tick(t){const dt=Math.min(2.2,(t-last)/16.667||1);last=t;if(!done){const remaining=Math.max(0,end-t),sec=Math.ceil(remaining/1000),ratio=remaining/10000;if(sec!==previous){previous=sec;$('number').textContent=sec;$('sequence').textContent=`${String(sec).padStart(2,'0')} → 00`;pulse();if(sec<=3&&sec>0&&!critical){critical=true;document.body.classList.add('critical');$('state').textContent='CRITICAL PHASE'}}if(remaining<=0)finish();else{$('precise').textContent=(remaining/1000).toFixed(2)+' s';$('progress').style.strokeDashoffset=String(100-ratio*100);$('sweep').style.transform=`rotate(${(1-ratio)*360}deg)`}}draw(t,dt);requestAnimationFrame(tick)}
addEventListener('resize',resize);resize();requestAnimationFrame(tick);
</script>
</body></html>
