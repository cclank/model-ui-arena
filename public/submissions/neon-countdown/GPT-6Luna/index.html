<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>T − 10 / Countdown</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090c13;color:#f0f2fa;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.page{min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 48%,#1e2038,#0b0e17 56%,#080a10)}.panel{width:min(100%,680px);min-height:565px;border:1px solid #34384c;border-radius:26px;background:linear-gradient(145deg,#151927,#0e111b);box-shadow:0 35px 90px #0008,inset 0 1px #ffffff12;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}.panel:before{content:"";position:absolute;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,#a263e10d,transparent 70%);top:45px;left:50%;transform:translateX(-50%)}.head{width:100%;display:flex;justify-content:space-between;padding:25px 29px;color:#939aaf;font-size:9px;letter-spacing:.17em}.head b{color:#c6b5f4;font-weight:500}.stage{position:relative;margin-top:18px;width:min(70vw,300px);aspect-ratio:1;display:grid;place-items:center}.stage svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}.track{fill:none;stroke:#292f41;stroke-width:3}.progress{fill:none;stroke:#c4a4fa;stroke-width:3;stroke-linecap:round;stroke-dasharray:666;stroke-dashoffset:0;filter:drop-shadow(0 0 9px #bd91ffb0);transition:stroke .3s}.orbit{fill:none;stroke:#8992b228;stroke-width:1;stroke-dasharray:1 7}.number{font:300 clamp(88px,20vw,142px)/1 ui-sans-serif,system-ui;letter-spacing:-.1em;font-variant-numeric:tabular-nums;color:#f4f0ff;text-shadow:0 0 35px #b999ff3d}.unit{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.24em;color:#9ea4ba}.copy{text-align:center;margin-top:13px}.kicker{font-size:9px;color:#9e8aba;letter-spacing:.26em}.title{font:italic 23px Georgia,serif;color:#dfd3f4;margin-top:7px}.buttons{display:flex;gap:9px;margin:25px 0 25px;z-index:1}.btn{border:1px solid #4a5064;border-radius:999px;padding:11px 17px;background:#1b2030;color:#d8d9e4;font:inherit;font-size:10px;letter-spacing:.08em;cursor:pointer}.btn.primary{background:#c1a0ee;color:#171522;border-color:#c1a0ee}.foot{margin-top:auto;width:100%;border-top:1px solid #ffffff12;display:flex;justify-content:space-between;padding:13px 24px;color:#687086;font-size:8px;letter-spacing:.12em}.pulse{animation:pulse .9s ease-in-out infinite}.done{background:radial-gradient(ellipse at 50% 48%,#342248,#11101b 68%)}.done .progress{stroke:#f3c879;filter:drop-shadow(0 0 13px #ffc55d)}.done .number{color:#fff1ce;text-shadow:0 0 38px #ffc9677a}@keyframes pulse{50%{transform:scale(1.035)}}
@media(max-width:480px){.page{padding:10px}.panel{min-height:540px;border-radius:22px}.head{padding:21px 18px}.stage{width:min(76vw,285px);margin-top:24px}.foot{padding:12px 16px;font-size:7px}.title{font-size:21px}}
</style></head><body><main class="page"><section class="panel" id="panel"><header class="head"><span>CHRONO / <b>T − 10</b></span><span id="state">AUTO SEQUENCE</span></header><div class="stage"><svg viewBox="0 0 240 240" aria-hidden="true"><circle class="orbit" cx="120" cy="120" r="106"/><circle class="track" cx="120" cy="120" r="106"/><circle class="progress" id="progress" cx="120" cy="120" r="106"/></svg><div class="number" id="number">10</div><div class="unit">SECONDS REMAINING</div></div><div class="copy"><div class="kicker" id="kicker">IGNITION IN PROGRESS</div><div class="title" id="title">Hold this moment.</div></div><div class="buttons"><button class="btn" id="pause">暂停</button><button class="btn primary" id="restart">重新开始</button></div><footer class="foot"><span>SECONDS, MADE VISIBLE</span><span>10 · 09 · 08 · 07 · …</span></footer></section></main>
<script>
const $=s=>document.querySelector(s),total=10000,circ=2*Math.PI*106;let start=performance.now(),pausedAt=0,paused=false,done=false,lastValue=-1;$('#progress').style.strokeDasharray=circ;function restart(){start=performance.now();pausedAt=0;paused=false;done=false;lastValue=-1;$('#panel').classList.remove('done');$('#progress').style.stroke='';$('#pause').textContent='暂停';$('#state').textContent='AUTO SEQUENCE';$('#kicker').textContent='IGNITION IN PROGRESS';$('#title').textContent='Hold this moment.';$('#number').classList.remove('pulse');requestAnimationFrame(tick)}$('#pause').onclick=()=>{if(done)return;paused=!paused;if(paused)pausedAt=performance.now();else start+=performance.now()-pausedAt;$('#pause').textContent=paused?'继续':'暂停';$('#state').textContent=paused?'SEQUENCE PAUSED':'AUTO SEQUENCE'};$('#restart').onclick=restart;function tick(now){if(paused)return;let elapsed=now-start,remaining=Math.max(0,total-elapsed),sec=Math.ceil(remaining/1000),p=elapsed/total;$('#progress').style.strokeDashoffset=circ*Math.max(0,Math.min(1,p));if(sec!==lastValue){lastValue=sec;$('#number').textContent=String(sec);$('#number').classList.toggle('pulse',sec>0&&sec<=3)}if(sec<=3&&sec>0){$('#kicker').textContent='FINAL SEQUENCE';$('#title').textContent='The room grows quiet.';$('#progress').style.stroke=sec===1?'#ff8f8f':'#f0a8a8'}if(remaining<=0){done=true;$('#panel').classList.add('done');$('#progress').style.stroke='#f3c879';$('#number').textContent='0';$('#number').classList.remove('pulse');$('#kicker').textContent='SEQUENCE COMPLETE';$('#title').textContent='A new beginning.';$('#state').textContent='COMPLETE · 00:00';return}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
