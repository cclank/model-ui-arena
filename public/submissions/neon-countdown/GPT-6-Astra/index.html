<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ignition — Ten seconds to lift off</title>
<!-- A typographic launch countdown driven by an absolute deadline. Dial, progress segments and final burst share one time source; restarting clears the entire previous run. -->
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#091315;color:#e2f4e8;font-family:Arial,sans-serif;overflow:hidden;display:grid;place-items:center}body:before{content:'';position:absolute;inset:0;background:linear-gradient(#c1ebcb05 1px,transparent 1px),linear-gradient(90deg,#c1ebcb05 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse,#000,transparent 75%)}.glow{position:fixed;inset:15%;background:radial-gradient(ellipse,#55782c23,transparent 70%);pointer-events:none;transition:background 1s}header,footer{position:fixed;left:36px;right:36px;display:flex;justify-content:space-between;align-items:center}header{top:30px}header b{font-size:13px;letter-spacing:4px}header span{font:9px monospace;letter-spacing:2px;color:#779386}footer{bottom:25px;font:9px monospace;color:#7d9485;letter-spacing:1px}.main{position:relative;text-align:center;width:min(500px,90vw);padding:30px 0}.eyebrow{font:10px monospace;letter-spacing:4px;color:#99b899;margin:0 0 18px}.dial{position:relative;width:340px;height:340px;max-width:85vw;max-height:85vw;margin:auto}.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}.rail{stroke:#2e4135;stroke-width:.8}.progress{stroke:#d1ef87;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 9px #a8e85f)}.number{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;font:300 clamp(110px,22vw,172px)/1 Arial;letter-spacing:-10px;padding-right:10px;color:#ddf0b5;text-shadow:0 0 65px #b7e97522;font-variant-numeric:tabular-nums}.number:after{content:'SECONDS';position:absolute;bottom:58px;font:8px monospace;letter-spacing:4px;color:#83a277;left:0;right:0;padding-left:9px}.tick{animation:beat .55s ease-out}.ticks{stroke:#638953;stroke-width:2;stroke-dasharray:1 12;opacity:.6}.status{font:italic 31px Georgia;margin:23px 0 12px;min-height:36px}.caption{font:10px monospace;color:#83a38c;margin:0 0 25px;letter-spacing:1px}.segments{display:flex;gap:4px;justify-content:center;margin-bottom:25px}.segments i{width:20px;height:3px;background:#273d2c;transition:background .2s}.segments i.on{background:#cbe986;box-shadow:0 0 12px #bad77c55}button{background:#d1eb98;color:#263720;border:0;border-radius:5px;padding:13px 29px;font:10px monospace;letter-spacing:2px;cursor:pointer;box-shadow:0 5px 20px #b4dc6e12}button:hover{background:#e1f7b3}button:focus-visible{outline:2px solid white;outline-offset:5px}.urgent .progress{stroke:#ffab67;filter:drop-shadow(0 0 14px #fa875e)}.urgent .number{color:#ffd7a6}.urgent .glow{background:radial-gradient(ellipse,#b158282a,transparent 70%)}.complete .progress{stroke:#bfeaa1}.complete .number{color:#e7ffe0}.complete .glow{background:radial-gradient(ellipse,#79b5553a,transparent 70%)}#burst{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}@keyframes beat{0%{scale:1.1;filter:brightness(1.9)}100%{scale:1;filter:brightness(1)}}@media(max-width:450px){header,footer{left:22px;right:22px}header span{font-size:7px;letter-spacing:1px}header b{font-size:11px}.status{font-size:28px}footer{font-size:7px}.main{padding:40px 0 25px}.dial{width:300px;height:300px}.number:after{bottom:50px}}@media(max-height:650px){.dial{height:250px;width:250px}.number{font-size:130px}.number:after{bottom:33px}.eyebrow{margin:0}.status{margin-top:8px}.segments{margin-bottom:13px}.caption{margin-bottom:16px}}@media(prefers-reduced-motion:reduce){.tick{animation:none}}
</style></head><body><div class="glow"></div><canvas id="burst" aria-hidden="true"></canvas><header><b>IGNITION / 10</b><span>A SMALL LEAP INTO WHAT'S NEXT</span></header><main class="main"><p class="eyebrow">ALL SYSTEMS, READY.</p><div class="dial"><svg viewBox="0 0 340 340" aria-hidden="true"><circle class="rail" cx="170" cy="170" r="166" fill="none"/><circle class="ticks" cx="170" cy="170" r="157" fill="none"/><circle class="rail" cx="170" cy="170" r="142" fill="none"/><circle id="progress" class="progress" cx="170" cy="170" r="142" fill="none" pathLength="100" stroke-dasharray="100"/></svg><div class="number" id="number" role="timer">10</div></div><h1 class="status" id="status">Something good is coming.</h1><p class="caption" id="caption">THE NEXT CHAPTER STARTS IN TEN.</p><div class="segments" id="segments" aria-hidden="true"></div><button id="restart">RESTART ↗</button></main><footer><span id="phase">SEQUENCE / RUNNING</span><span id="percent">00% ELAPSED</span></footer><script>
const $=id=>document.getElementById(id),canvas=$('burst'),ctx=canvas.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let deadline,lastValue=-1,done=false,particles=[],raf,lastTime=0;for(let i=0;i<10;i++)$('segments').append(document.createElement('i'));
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);}function explode(){particles=Array.from({length:reduce?24:170},(_,i)=>{const a=i/170*Math.PI*2;return{x:innerWidth/2,y:innerHeight*.44,vx:Math.cos(a)*(70+Math.random()*320),vy:Math.sin(a)*(70+Math.random()*320),life:1.6+Math.random()*1.5,r:1+Math.random()*3};});}
function frame(now){const dt=Math.min((now-lastTime)/1000||.016,.04);lastTime=now;const remaining=Math.max(0,deadline-now),value=Math.ceil(remaining/1000),progress=1-remaining/10000;$('progress').style.strokeDashoffset=progress*100;$('percent').textContent=String(Math.floor(progress*100)).padStart(2,'0')+'% ELAPSED';$('segments').querySelectorAll('i').forEach((s,i)=>s.classList.toggle('on',i<Math.floor(progress*10)));if(value!==lastValue){lastValue=value;$('number').textContent=value;$('number').classList.remove('tick');void $('number').offsetWidth;$('number').classList.add('tick');document.body.classList.toggle('urgent',value<=3&&value>0);if(value<=3&&value>0){$('status').textContent='Here we go.';$('caption').textContent='TAKE A BREATH. MAKE IT COUNT.';}}if(!remaining&&!done){done=true;document.body.classList.add('complete');$('status').textContent='You’re cleared for takeoff.';$('status').setAttribute('aria-live','polite');$('caption').textContent='COUNTDOWN COMPLETE. YOUR MOMENT IS NOW.';$('phase').textContent='SEQUENCE / COMPLETE';explode();}
ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=50*dt;p.vx*=Math.exp(-dt*.4);p.life-=dt;ctx.globalAlpha=Math.min(1,Math.max(0,p.life));ctx.fillStyle='#d7efa1';ctx.fillRect(p.x,p.y,p.r,p.r*2);}ctx.globalAlpha=1;if(!document.hidden)raf=requestAnimationFrame(frame);}
function restart(){cancelAnimationFrame(raf);deadline=performance.now()+10000;lastValue=-1;done=false;particles=[];document.body.className='';$('status').textContent='Something good is coming.';$('caption').textContent='THE NEXT CHAPTER STARTS IN TEN.';$('phase').textContent='SEQUENCE / RUNNING';raf=requestAnimationFrame(frame);}$('restart').onclick=restart;addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden)raf=requestAnimationFrame(frame);});resize();restart();
</script></body></html>
