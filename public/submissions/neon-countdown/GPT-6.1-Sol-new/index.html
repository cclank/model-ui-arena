<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T−10 / Ignition sequence</title>
<!-- 设计说明：一场十秒的轨道点火，橙色能量环与巨大数字同步收束。
基于单调时钟计时，末三秒加压，结束进入持久完成态。
重启清除旧粒子与节拍，移动端保持数字、进度和控制完整。 -->
<style>
*{box-sizing:border-box}body{margin:0;height:100svh;min-height:560px;background:#0d0c10;color:#eae5de;font-family:Arial,"PingFang SC",sans-serif;display:grid;place-items:center;grid-template-columns:minmax(0,1fr);overflow:hidden}.stage{position:relative;width:min(1000px,100%);height:100%;padding:32px 38px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}.top,.bottom{width:100%;display:flex;justify-content:space-between;align-items:center;font:9px monospace;letter-spacing:2px;color:#6a6570}.top strong{font:15px Arial;letter-spacing:4px;color:#ded4cc}.live{width:5px;height:5px;display:inline-block;border-radius:50%;background:#f28d46;margin-right:8px;box-shadow:0 0 10px #f28d4670}.center{position:relative;width:min(430px,86vw);aspect-ratio:1;display:grid;place-items:center}.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.base{fill:none;stroke:#31252b;stroke-width:1}.progress{fill:none;stroke:#ff9a52;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 7px #ff763a);stroke-dasharray:1131;stroke-dashoffset:0}.inner{position:absolute;inset:10%;border:1px dashed #42313a;border-radius:50%;animation:spin 90s linear infinite}.inner:before,.inner:after{content:"";position:absolute;left:50%;top:-2px;width:4px;height:4px;border-radius:50%;background:#ee9b68}.inner:after{top:auto;bottom:-2px;background:#805247}.reading{text-align:center;position:relative}.label{font:9px monospace;color:#a2796b;letter-spacing:4px}.digit{font-size:clamp(100px,20vw,164px);font-weight:200;line-height:1.2;letter-spacing:-10px;color:#f4e5d2;font-variant-numeric:tabular-nums;text-shadow:0 0 35px #ff9a5233}.digit.pulse{animation:beat .5s ease-out}.sub{font:10px monospace;color:#9a7269;letter-spacing:2px}.intro{text-align:center;margin-top:-15px}.intro h1{font:italic 34px Georgia,serif;color:#e4d5c4;margin:0 0 12px}.intro p{font-size:10px;color:#736a73;letter-spacing:3px}.restart{padding:12px 25px;color:#e9b28b;letter-spacing:2px;border:1px solid #79513a;background:#221713;border-radius:3px;font:10px monospace;cursor:pointer;transition:background .3s,box-shadow .3s}.restart:hover{background:#462a1b;box-shadow:0 0 25px #e47c3325}.restart:focus-visible{outline:2px solid #ff9a52;outline-offset:4px}.grid{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ff8e4010 1px,transparent 1px),linear-gradient(90deg,#ff8e400a 1px,transparent 1px);background-size:70px 70px;mask-image:radial-gradient(ellipse,#0008,transparent 65%)}.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,#c8461422,transparent 58%);transition:opacity .5s;opacity:.4}.urgent .glow{opacity:1}.urgent .digit{color:#ffad7f}.urgent .center{animation:tension 1s infinite}.complete .progress{stroke:#d8f4ae;filter:drop-shadow(0 0 10px #a5d66d)}.complete .digit{color:#dbefbc;text-shadow:0 0 50px #b6dc7877}.complete .glow{background:radial-gradient(ellipse at 50% 44%,#b4bf4a20,transparent 65%);opacity:1}canvas{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}@keyframes spin{to{transform:rotate(360deg)}}@keyframes beat{0%{transform:scale(1.12);filter:brightness(1.5)}100%{transform:scale(1)}}@keyframes tension{50%{filter:brightness(1.15)}}
@media(max-width:550px){.stage{padding:25px 22px}.top,.bottom{letter-spacing:1px;font-size:8px}.top strong{font-size:12px}.intro h1{font-size:29px}.center{width:min(89vw,100%)}.digit{font-size:130px}.intro p{font-size:9px}.bottom span:last-child{max-width:135px;text-align:right;line-height:1.7}}
@media(prefers-reduced-motion:reduce){.inner,.urgent .center,.digit.pulse{animation:none}}
</style></head><body><div class="grid"></div><div class="glow"></div><canvas id="burst"></canvas><main class="stage"><header class="top"><strong>IGNITION / 01</strong><span><i class="live"></i><span id="status">SEQUENCE RUNNING</span></span></header><div class="center"><svg class="ring" viewBox="0 0 400 400" aria-label="倒计时进度"><circle class="base" cx="200" cy="200" r="192"/><circle class="base" cx="200" cy="200" r="174"/><circle class="progress" id="progress" cx="200" cy="200" r="180"/></svg><div class="inner"></div><div class="reading"><div class="label" id="label">TIME TO LIFTOFF</div><div class="digit" id="digit" role="timer">10</div><div class="sub" id="sub">SECONDS REMAINING</div></div></div><section class="intro"><h1 id="headline">Something good is coming.</h1><p id="copy">准备好，迎接下一刻。</p></section><button class="restart" id="restart">RESTART ↗</button><footer class="bottom"><span>T−10 / IGNITION SEQUENCE</span><span>从此刻出发。 EVERY END IS A START.</span></footer></main>
<script>
const $=s=>document.querySelector(s),c=$('#burst'),ctx=c.getContext('2d');let started,previous=-1,done=false,particles=[],last=0,w,h;const circumference=2*Math.PI*180;$('#progress').style.strokeDasharray=circumference;
function resize(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio,2);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);
function restart(){started=performance.now();previous=-1;done=false;particles=[];document.body.className='';$('#label').textContent='TIME TO LIFTOFF';$('#sub').textContent='SECONDS REMAINING';$('#status').textContent='SEQUENCE RUNNING';$('#headline').textContent='Something good is coming.';$('#copy').textContent='准备好，迎接下一刻。';$('#progress').style.strokeDashoffset=0;$('#digit').textContent='10'}$('#restart').onclick=restart;
function finish(){done=true;document.body.className='complete';$('#status').textContent='MISSION COMPLETE';$('#label').textContent='YOU HAVE ARRIVED';$('#sub').textContent='SEQUENCE COMPLETE';$('#headline').textContent='And so it begins.';$('#copy').textContent='倒计时完成 · 下一程，就现在。';for(let i=0;i<280;i++){let a=i/280*Math.PI*2,s=80+Math.random()*330;particles.push({x:w/2,y:h*.43,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,life:1.8+Math.random()*1.8,c:i%3?'#ffb977':'#d8f4ae'})}}
function frame(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;let elapsed=(t-started)/1000,remaining=Math.max(0,10-elapsed),number=Math.ceil(remaining);if(!done){$('#progress').style.strokeDashoffset=circumference*(1-remaining/10);document.body.classList.toggle('urgent',number<=3&&number>0);if(number!==previous){previous=number;$('#digit').textContent=number;$('#digit').classList.remove('pulse');void $('#digit').offsetWidth;$('#digit').classList.add('pulse')}if(remaining===0)finish()}ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='lighter';for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.age+=dt;if(p.age>p.life){particles.splice(i,1);continue}p.vx*=Math.exp(-dt*.65);p.vy+=38*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=1-p.age/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,2,3)}ctx.globalAlpha=1;requestAnimationFrame(frame)}restart();requestAnimationFrame(frame);
</script></body></html>
