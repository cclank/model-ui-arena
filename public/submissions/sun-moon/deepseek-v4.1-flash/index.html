<script>
const D2R=Math.PI/180,R2D=180/Math.PI,MS=864e5,$=i=>document.getElementById(i);
const jdOf=(y,m,d,ut)=>Date.UTC(y,m-1,d)/MS+2440587.5+ut/24;
function solar(jd,lon,tz){
 const jc=(jd-2451545)/36525,L0=(280.46646+jc*(36000.76983+jc*3.032e-4))%360,M=357.52911+jc*(35999.05029-1.537e-4*jc);
 const e=0.016708634-jc*(4.2037e-5+1.267e-7*jc);
 const C=Math.sin(M*D2R)*(1.914602-jc*(0.004817+1.4e-5*jc))+Math.sin(2*M*D2R)*(0.019993-1.01e-4*jc)+Math.sin(3*M*D2R)*2.89e-4;
 const om=(125.04-1934.136*jc)*D2R,appL=L0+C-0.00569-0.00478*Math.sin(om);
 const ob=23+(26+(21.448-jc*(46.815+jc*(5.9e-4-jc*1.813e-3)))/60)/60+0.00256*Math.cos(om);
 const decl=Math.asin(Math.sin(ob*D2R)*Math.sin(appL*D2R))*R2D,y=Math.tan(ob/2*D2R)**2;
 const eqt=4*R2D*(y*Math.sin(2*L0*D2R)-2*e*Math.sin(M*D2R)+4*e*y*Math.sin(M*D2R)*Math.cos(2*L0*D2R)-0.5*y*y*Math.sin(4*L0*D2R)-1.25*e*e*Math.sin(2*M*D2R));
 return {noon:720-4*lon-eqt+tz*60,decl};
}
function hourAngle(lat,decl){
 const c=Math.cos(90.833*D2R)/(Math.cos(lat*D2R)*Math.cos(decl*D2R))-Math.tan(lat*D2R)*Math.tan(decl*D2R);
 return c>1?{polar:"极夜"}:c<-1?{polar:"极昼"}:{ha:Math.acos(c)*R2D};
}
function sunTimes(y,m,d,lat,lon,tz){
 let s=solar(jdOf(y,m,d,12-tz),lon,tz),h=hourAngle(lat,s.decl);
 if(h.polar)return h;
 let rise=s.noon-h.ha*4,set=s.noon+h.ha*4;
 for(let i=0;i<2;i++){
  const sr=solar(jdOf(y,m,d,rise/60-tz),lon,tz),hr=hourAngle(lat,sr.decl);
  const ss=solar(jdOf(y,m,d,set/60-tz),lon,tz),hs=hourAngle(lat,ss.decl);
  if(hr.polar||hs.polar)return hr.polar?hr:hs;
  rise=sr.noon-hr.ha*4;set=ss.noon+hs.ha*4;
 }
 return {rise,set};
}
const norm=x=>((x%360)+360)%360;
function moon(jd){
 const t=(jd-2451545)/36525;
 const D=norm(297.8501921+445267.1114034*t-0.0018819*t*t),M=norm(357.5291092+35999.0502909*t-1.536e-4*t*t),
       Mp=norm(134.9633964+477198.8675055*t+0.0087414*t*t);
 const corr=6.289*Math.sin(Mp*D2R)-2.1*Math.sin(M*D2R)+1.274*Math.sin((2*D-Mp)*D2R)+0.658*Math.sin(2*D*D2R)+0.214*Math.sin(2*Mp*D2R)+0.11*Math.sin(D*D2R);
 return {k:(1+Math.cos((180-D-corr)*D2R))/2,p:norm(D+corr)/360};
}
const NAMES=["新月","蛾眉月","上弦月","盈凸月","满月","亏凸月","下弦月","残月"];
function phaseName(p){
 const near=c=>Math.min(Math.abs(p-c),Math.abs(p-c-1),Math.abs(p-c+1))<=0.03;
 if(near(0))return "新月";if(near(.25))return "上弦月";if(near(.5))return "满月";if(near(.75))return "下弦月";
 return p<.25?"蛾眉月":p<.5?"盈凸月":p<.75?"亏凸月":"残月";
}
const fmt=min=>{const t=((Math.round(min)%1440)+1440)%1440;return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");};
const PRESETS=[["北京",39.9042,116.4074,8],["上海",31.2304,121.4737,8],["广州",23.1291,113.2644,8],["新加坡",1.3521,103.8198,8],
 ["新德里",28.6139,77.209,5.5],["悉尼",-33.8688,151.2093,10],["雷克雅未克",64.1466,-21.9426,0],["特罗姆瑟",69.6496,18.956,1]];
$("presets").innerHTML=PRESETS.map((p,i)=>`<button type="button" data-i="${i}">${p[0]}</button>`).join("");
$("craters").innerHTML=[[34,34,7],[62,30,5],[44,60,9],[66,62,4.5],[28,58,4],[52,44,3.2]].map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="#c9bf9f" opacity=".5"/>`).join("");
$("stars").innerHTML=Array.from({length:46},(_,i)=>`<circle cx="${((i*137.5)%640).toFixed(1)}" cy="${((i*61.8)%210).toFixed(1)}" r="${(0.5+(i%3)*0.35).toFixed(2)}" fill="#fff"/>`).join("");
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const lerpC=(a,b,t)=>{const A=hex(a),B=hex(b);return "#"+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,"0")).join("");};
const SKY=[[0,"#0b1229","#16204a","#243055"],[5,"#2a2a52","#7b4a6a","#e0895e"],[7,"#4a86c8","#8fb8e0","#d8e6f2"],[12,"#2f7fd0","#79b4e6","#cfe6f5"],
 [17,"#3a76b8","#e8a26a","#f2cfa0"],[19,"#2d2f60","#8a4f70","#e08a5e"],[21,"#121a3a","#1d2750","#2b3560"],[24,"#0b1229","#16204a","#243055"]];
function skyAt(h){let i=0;while(i<SKY.length-2&&h>=SKY[i+1][0])i++;
 const a=SKY[i],b=SKY[i+1],t=Math.max(0,Math.min(1,(h-a[0])/(b[0]-a[0])));
 return [lerpC(a[1],b[1],t),lerpC(a[2],b[2],t),lerpC(a[3],b[3],t)];}
const HZ=220,CX=320,RX=260,RY=160;
const arcX=u=>CX-RX*Math.cos(Math.PI*u),arcY=u=>HZ-RY*Math.sin(Math.PI*u);
function litPathD(k,p){const R=42,a=R*Math.abs(1-2*k),wax=p<.5;
 return `M50,8 A${R},${R} 0 0 ${wax?1:0} 50,92 A${a.toFixed(2)},${R} 0 0 ${wax===(k>.5)?1:0} 50,8 Z`;}
const iso=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
function render(){
 const lat=parseFloat($("q-lat").value)||0,lon=parseFloat($("q-lon").value)||0,tz=parseFloat($("q-tz").value)||0,date=$("q-date").value;
 const [y,m,d]=date.split("-").map(Number);
 if(!y){$("q-result").textContent="请选择日期";return;}
 const st=sunTimes(y,m,d,lat,lon,tz),mo=moon(jdOf(y,m,d,12-tz)),decl=solar(jdOf(y,m,d,12-tz),lon,tz).decl;
 const riseT=st.polar?st.polar:fmt(st.rise),setT=st.polar?st.polar:fmt(st.set);
 const pName=phaseName(mo.p),kPct=Math.round(mo.k*100);
 $("q-result").textContent=`日出：${riseT} · 日落：${setT} · 月相：${pName} · 照亮：${kPct}%`;
 $("hPhase").textContent=pName;
 $("hPlace").textContent=`${lat.toFixed(2)}°, ${lon.toFixed(2)}° · UTC${tz>=0?"+":""}${tz} · ${date}`;
 $("mName").textContent=pName;
 $("mDesc").textContent=`照亮 ${kPct}% · 相位比例 ${mo.p.toFixed(3)} · ${mo.p<.5?"盈（亮面朝右）":"亏（亮面朝左）"}`;
 $("litPath").setAttribute("d",litPathD(mo.k,mo.p));
 $("craters").style.display=mo.k<0.08?"none":"";
 $("tDec").textContent=(decl>=0?"+":"")+decl.toFixed(2)+"°";
 $("tAlt").textContent=(90-Math.abs(lat-decl)).toFixed(1)+"°";
 $("tAge").textContent=(mo.p*29.53).toFixed(1)+" 天";
 $("tDay").textContent=st.polar?(st.polar==="极昼"?"24 小时":"0 小时"):(()=>{const mi=Math.round(st.set-st.rise);return `${Math.floor(mi/60)} 小时 ${String(mi%60).padStart(2,"0")} 分`;})();
 $("sunArc").setAttribute("d",st.polar?"":`M${arcX(0)},${HZ} A${RX},${RY} 0 0 1 ${arcX(1)},${HZ}`);
 $("marks").innerHTML=st.polar?"":[[0,riseT],[.5,"正午"],[1,setT]].map(([u,lab])=>
  `<g><circle cx="${arcX(u).toFixed(1)}" cy="${arcY(u).toFixed(1)}" r="3" fill="#fff" opacity=".8"/><text x="${arcX(u).toFixed(1)}" y="${HZ+16}" fill="#fff" fill-opacity=".7" font-size="11" text-anchor="middle">${lab}</text></g>`).join("");
 const tMin=Number($("q-time").value);
 $("timeLab").textContent=fmt(tMin);
 const [c0,c1,c2]=skyAt(tMin/60);
 $("s0").setAttribute("stop-color",c0);$("s1").setAttribute("stop-color",c1);$("s2").setAttribute("stop-color",c2);
 $("stars").style.opacity=Math.max(0,Math.min(1,1.35-Math.abs(tMin/60-12)/6));
 const up=!st.polar&&tMin>=st.rise&&tMin<=st.set;
 $("sunC").setAttribute("opacity",up?1:0);$("sunGlowC").setAttribute("opacity",up?1:0);$("moonC").setAttribute("opacity",up?0:1);
 const nightLen=st.polar?1:Math.max(1,1440-(st.set-st.rise));
 const nf=st.polar?.5:((tMin>st.set?tMin-st.set:tMin+1440-st.set)/nightLen);
 const u=up?(tMin-st.rise)/(st.set-st.rise):nf;
 const tgt=up?[["sunC"],["sunGlowC"]]:[["moonC"]];
 for(const [id] of tgt){$(id).setAttribute("cx",arcX(u).toFixed(1));$(id).setAttribute("cy",arcY(u).toFixed(1));}
}
$("presets").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 const p=PRESETS[+b.dataset.i];$("q-lat").value=p[1];$("q-lon").value=p[2];$("q-tz").value=p[3];
 [...$("presets").children].forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render();});
["q-lat","q-lon","q-date","q-tz"].forEach(id=>{$(id).addEventListener("input",render);$(id).addEventListener("change",render);});
$("q-time").addEventListener("input",render);
$("q-date").value=iso(new Date());render();
</script>
</body>
</html>
